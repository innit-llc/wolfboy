context_questions:
  - Is the value actually a secret, or a public token / part of a signed URL whose presence in the
    URL is by design?
  - Does this parameter actually arrive in the query string? Rails' `params`, and any framework hash
    that merges query, body and path, cannot answer that on its own — find the route and the HTTP
    verb, or the form or client that calls it, and quote them. A value that only ever arrives in a
    POST body is out of scope for this rule.
  - Does the serving stack record full request URLs (application logs, access logs, reverse proxy,
    CDN, APM)?
  - "Where the line calls a name/value helper (`addParameters`, `queryParam`, `searchParams.set`,
    `param`, `setParameter`, `addParameter`) instead of writing `name=value` into a string: open
    that call site and say what the helper builds - a URL query string, a form body, or a request
    header. Some of these names are not URL-exclusive: `setParameter` is also JPA's and Hibernate's
    named-bind method, so a database bind reaches you through the same clause. This detector reads
    one line and cannot tell them apart, and only the first is what this rule reports."
  - "Where the credential word sits at the end or in the middle of the parameter name
    (`oauth_token`, `oauth_accessor_secret`, `x-api-key`): is the whole identifier a credential, or
    a name that merely ends in one of these words, such as `primary_key`, `sort_key` or `cache_key`?
    And where the parameter is a single-use code (`activationCode`, `verificationCode`, `resetCode`,
    `inviteCode`): how long does it stay valid after it is issued, is it invalidated on first use,
    and who else can reach the URL that carries it?"
evidence_template: "{file}:{line} names a URL query parameter drawn from a secret and token
  vocabulary - built for sending, read from the query on receipt, or MERELY NAMED, where no request
  is built here and none is parsed here. The third limb is not hypothetical and it is the one to
  rule out first: the sending-side clause matches a query-parameter substring anywhere on a line and
  requires nothing to construct, send or receive that URL, and the only comment suppression this
  detector carries drops lines that BEGIN with a comment marker, so a string inside a data file and
  a line of prose both reach you unfiltered. Two shapes of it sit in the corpus - a user-interface
  translation string inside a localisation catalogue, explaining to that product's own users what
  the query-parameter authentication method means, and a documentation bullet listing the ways to
  authenticate. Both talk about a query parameter carrying a credential without building or reading
  one, and where that is what you are holding there is no data flow at this location to report.
  Whether the value is a secret, or a public token or signature whose presence in the URL is by
  design, is context question 1. SINCE 2026-09-09 THREE FURTHER SHAPES REACH YOU AND EACH CARRIES
  ITS OWN LIMIT. First, a parameter ASSEMBLED BY A NAME/VALUE HELPER - `OAuth.addParameters(url,
  \"oauth_token\", t)`, `UriComponentsBuilder.queryParam(...)`, `searchParams.set(...)`,
  `.param(...)` - rather than written as literal `name=value` text: one line does not say whether
  the helper builds a URL query string, a form body, a request header or a database bind
  (`setParameter` is also JPA's named-bind method), so open the helper call site before reading the
  finding as a URL. Second, the credential word may sit ANYWHERE IN THE IDENTIFIER rather than at
  its start (`oauth_accessor_secret`, `x-api-key`), which also admits a name that merely ends in one
  of these words - `primary_key`, `sort_key`, `cache_key` - so read the whole identifier, not the
  word. A camelCase infix such as `oauthToken` is NOT reached. Third, a SINGLE-USE CODE
  (`activationCode`, `verificationCode`, `confirmationToken`, `resetCode`, `inviteCode`) is a
  credential for one operation whose exposure window is the life of the URL that carries it; whether
  that URL was logged, referred, forwarded or shared, and whether the code is invalidated on first
  use, are deployment facts this finding does not answer"
remediation_template: |
  This is a candidate for review against GDPR Art. 32 (security of processing), not a determination
  about this code. The changes below apply where the review confirms it.
  Sending side (this line builds a URL carrying a secret in the query): move the value into
  the POST body or an Authorization header.
  Receiving side (an endpoint here accepts a secret from the query): stop accepting it from
  the query, take it only from an Authorization header (or a signed header), and migrate the
  callers' webhook and integration settings to the header form.
  A single-use code in a link (a reset, activation, invitation or sign-in link sent by e-mail or
  message, context question 5): the code has to travel in the URL the person opens, so neither
  move above applies. Narrow what that URL can expose instead: make the code expire soon after it
  is issued and stop accepting it after its first use; on the page the link opens, take the code
  into a form or a session and redirect to an address without it, and send a Referrer-Policy of
  no-referrer there so the code does not travel on to other sites in a Referer header; and keep
  the parameter out of the access, proxy and application logs (context question 3).
  In each case, any secret that has already travelled in a URL is sitting in logs, browser
  history and Referer headers, so revoke it.
data_categories:
  - user.authorization.credentials
  - system.credentials
fingerprint_spec: project
reading_class:
  class: per-location

      y|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id\
      |sessionId|sessionid|sid|otp|auth|authorization)=[^&\"'`\\s]{0,60}[\"'`$\\{]"
    - (?:\$_(?:GET|REQUEST)\s*\[\s*["'](?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)["']\s*\]|filter_input\s*\(\s*INPUT_GET\s*,\s*["'](?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)["'])
    - \.(?:args|GET|query_params|queryparams)\s*(?:\.\s*(?:to_dict|dict|copy)\s*\([^)]*\)\s*)?(?:\.\s*get(?:list)?\s*\(\s*|\[\s*)["'](?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)["']
    - (?:\bparams|\bquery_parameters)\s*(?:\[\s*|\.\s*(?:fetch|dig|require)\s*\(\s*)(?::|["'])(?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)["']?\s*[\])]

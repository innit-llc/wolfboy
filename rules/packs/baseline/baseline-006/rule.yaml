    - (?:searchParams|queryParams|query_params|new\s+URLSearchParams\s*\([^()]*\))\s*\.\s*(?:get|getAll|has)\s*\(\s*["'`](?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)["'`]
    - \.query\s*(?:\.\s*(?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)\b|\[\s*["'`](?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)["'`]\s*\])
    - \{[^}]*\b(?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)\b[^}]*\}\s*=\s*[A-Za-z0-9_.$\[\]"']*\.query\b
    - \.query\s*\}\s*\)\s*\.\s*(?:(?:password|passwd|pwd|secret|token|api_key|apikey|apiKey|apiSecret|access_key|accessKey|accesskey|access_token|accessToken|refresh_token|refreshToken|id_token|idToken|auth_token|authToken|authtoken|private_key|privateKey|client_secret|clientSecret|signature|sig|key|credential|credentials|passcode|jwt|session_id|sessionId|sessionid|sid)(?:[_-][A-Za-z0-9_-]*)?|auth|authorization)\b
    - "[?&](?:[\"'`]\\s*[.+]\\s*[\"'`])?(?:[A-Za-z0-9_.-]*[_.-])?(?:(?&credential_param_words)|otp|\
      (?&single_use_credential_words)|(?&credential_param_words_exact))=[^&\"'`\\s]{0,60}[\"'`$\\{]"
    - (?:\b(?:addParameters?|queryParam|addQueryParam(?:eter)?|setQueryParam(?:eter)?|queryParameter|setParameter)|searchParams\s*\.\s*(?:set|append)|\.\s*param)\s*\(\s*(?:[^,]{0,120},\s*)?[\"'`](?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))[\"'`]\s*,
    - (?:\$_(?:GET|REQUEST)\s*\[\s*["'](?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))["']\s*\]|filter_input\s*\(\s*INPUT_GET\s*,\s*["'](?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))["'])
    - \.(?:args|GET|query_params|queryparams)\s*(?:\.\s*(?:to_dict|dict|copy)\s*\([^)]*\)\s*)?(?:\.\s*get(?:list)?\s*\(\s*|\[\s*)["'](?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))["']
    - (?:\bparams|\bquery_parameters)\s*(?:\[\s*|\.\s*(?:fetch|dig|require)\s*\(\s*)(?::|["'])(?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))["']?\s*[\])]
    - \.(?:Query\(\)\.Get|Query|DefaultQuery|QueryParam|FormValue|PostFormValue|GetQuery)\s*\(\s*["`](?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))["`]
    - (?:\.get(?:Parameter|ParameterValues|QueryParam)\s*\(\s*|\.getParameterMap\s*\(\s*\)\s*\.\s*get\s*\(\s*|\.getQueryParams\s*\(\s*\)\s*\.\s*(?:getFirst|get)\s*\(\s*|@(?:RequestParam|QueryParam)\s*\(\s*(?:[A-Za-z]+\s*=\s*)?)"(?:[A-Za-z0-9_.-]*[_.-])?(?:(?:(?&credential_param_words)|(?&single_use_credential_words))(?:[_-][A-Za-z0-9_-]*)?|(?&credential_param_words_exact))"

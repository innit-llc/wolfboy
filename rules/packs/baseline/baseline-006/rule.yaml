id: baseline-006
pack: baseline
short_name: A secret carried in a URL
problem_line:
  text: Secret carried in a URL query string
  template: "{data} carried in a URL query string"
fix_line: Move the secret from the query to a header or POST body, or make a code a link must carry
  single-use; revoke any sent.
title: "Secret- or token-named URL query parameter: built for sending, or read from the query on receipt"
jurisdiction:
  - EU
  - US
  - JP
legal_basis:
  - cite: GDPR Art. 32 (security of processing; URLs persist in server logs, browser history and Referer
      headers, so a query string is an unsuitable transport for a secret)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    checked_at: 2026-07-21
    jurisdiction: EU
  - cite: "Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 23
      (security control measures — a business handling personal information must take necessary and
      appropriate measures for the security control of the personal data it handles). PPC Guidelines
      (General Rules) Q&A 10-21 places prevention of leakage in the use of information systems under
      this duty. General basis: the Act names no transport for a credential, and it reaches this
      finding where the value in the query string is a user's own credential or where the logs the
      URL lands in hold personal data"
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-07-22
    jurisdiction: JP
  - cite: California Civil Code Sec. 1798.81.5(b) — a business that owns, licenses or maintains personal
      information about a California resident shall implement and maintain reasonable security
      procedures and practices appropriate to the nature of the information. Sec. 1798.81.5(d)(1)(B)
      counts a username or email address together with a password permitting access to an online
      account as personal information, which is the sending-side case this rule looks for. State
      scope only, and a reasonableness standard rather than a named control. It does not reach the
      service tokens (revalidate, webhook and function secrets) that the receiving-side patterns
      pick up — those are not personal information under Sec. 1798.81.5(d)
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=1798.81.5&lawCode=CIV
    checked_at: 2026-07-22
    jurisdiction: US
  - cite: "United States, FTC Act Sec. 5 (15 U.S.C. Sec. 45(a)(1) and (n)) — unfair acts or practices in
      or affecting commerce, the authority behind the Federal Trade Commission's data-security line
      (failure to employ reasonable security causing or likely to cause substantial injury to
      consumers, not reasonably avoidable and not outweighed by countervailing benefits). General
      basis: no federal statute names a transport for a secret, and this covers the service-token
      side, where the injury runs through what the token unlocks"
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2-subchapI-sec45.htm
    checked_at: 2026-07-22
    jurisdiction: US
severity: high
rule_confidence: 0.8
detector:

id: baseline-010
pack: baseline
short_name: Certificate checks off or replaced, or old TLS allowed
problem_line:
  text: TLS protection weakened on a connection
  template: "{data} carried over weakened TLS"
fix_line: Verify certificates and host names by default, trust or pin a private CA per connection,
  and require TLS 1.2 or later.
title: "TLS protection weakened: certificate or host-name verification turned off or replaced, or a
  protocol version below TLS 1.2 allowed"
jurisdiction:
  - EU
  - US
  - JP
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 32(1) - 'Taking into account the state of the art, the
      costs of implementation and the nature, scope, context and purposes of processing as well as
      the risk of varying likelihood and severity for the rights and freedoms of natural persons,
      the controller and the processor shall implement appropriate technical and organisational
      measures to ensure a level of security appropriate to the risk, including inter alia as
      appropriate: (a) the pseudonymisation and encryption of personal data; (b) the ability to
      ensure the ongoing confidentiality, integrity, availability and resilience of processing
      systems and services;'. A connection that encrypts to a peer it never authenticated, or that
      allows a protocol version the state of the art has retired, is the measure this paragraph
      names done in a way an on-path attacker can undo. Bites only where personal data travels on
      the connection"
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    checked_at: 2026-10-07
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 32(2) - 'In assessing the appropriate level of security
      account shall be taken in particular of the risks that are presented by processing, in
      particular from accidental or unlawful destruction, loss, alteration, unauthorised disclosure
      of, or access to personal data transmitted, stored or otherwise processed.' The word
      transmitted is the hook for this rule: a man-in-the-middle on a connection whose certificate
      is not checked is unauthorised access to the data it transmits"
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    checked_at: 2026-10-07
    jurisdiction: EU
  - cite: "EU Cyber Resilience Act (Regulation (EU) 2024/2847), Annex I, Part I, point (2)(e) and (f) -
      products with digital elements shall '(e) protect the confidentiality of stored, transmitted
      or otherwise processed data, personal or other, such as by encrypting relevant data at rest or
      in transit by state of the art mechanisms, and by using other technical means;' and '(f)
      protect the integrity of stored, transmitted or otherwise processed data, personal or other,
      commands, programs and configuration against any manipulation or modification not authorised
      by the user'. Point (2)(b), 'be made available on the market with a secure by default
      configuration, unless otherwise agreed between manufacturer and business user in relation to a
      tailor-made product with digital elements, including the possibility to reset the product to
      its original state;', is the hook where verification off or an old protocol version is the
      DEFAULT the product ships rather than an option an operator chooses. Points (2)(b), (e) and
      (f) sit under the opening words of point (2), 'On the basis of the cybersecurity risk
      assessment referred to in Article 13(2) and where applicable, products with digital elements
      shall:', so they bind as the manufacturer's cybersecurity risk assessment makes them
      applicable, and point (2)(b) gives way where manufacturer and business user have agreed
      otherwise for a tailor-made product. Per Art. 71(2) the Regulation applies from 11 December
      2027. Scope check: the CRA reaches products with digital elements made available on the EU
      market (Art. 2(1), Art. 3(1)) and hosted software only as a remote data processing solution
      within Art. 3(2). Recital 12 places websites that do not support the functionality of such a
      product, and cloud services (SaaS, PaaS, IaaS) designed and developed outside a manufacturer's
      responsibility, outside this Regulation and inside Directive (EU) 2022/2555 instead. For a
      plain hosted web application this entry therefore does not reach the scanned artefact and GDPR
      Art. 32 is the operative EU basis; it applies where the repository ships a distributed product
      or the backend of one."
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    checked_at: 2026-10-07
    jurisdiction: EU
  - cite: Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 23
      (security control measures — a business handling personal information must take necessary and
      appropriate measures for the security control of the personal data it handles). Bites only
      where personal data is what travels over the plaintext connection
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-10-07
    jurisdiction: JP
  - cite: "Japan, Personal Information Protection Commission, Guidelines on the APPI (General Rules) Q&A
      10-21, on methods for preventing leakage in the use of information systems under the Art. 23
      security control measures. The Commission's own answer gives encryption of personal data on
      networks that may be intercepted, naming SSL/TLS and S/MIME, as such a method — the most
      directly on-point Japanese source in this pack for transport encryption. Guidance rather than
      statute: the operative duty is APPI Art. 23"
    url: https://www.ppc.go.jp/all_faq_index/faq1-q10-21/
    checked_at: 2026-10-07
    jurisdiction: JP
  - cite: "United States, FTC Act Sec. 5 (15 U.S.C. Sec. 45(a)(1) and (n)) - unfair or deceptive acts or
      practices in or affecting commerce. Transport security sits inside the Federal Trade
      Commission's data-security line, which reaches a failure to employ reasonable security that
      causes or is likely to cause substantial injury to consumers, not reasonably avoidable and not
      outweighed by countervailing benefits. General basis: no federal statute requires certificate
      validation for a given connection, and the theory reaches this finding only where personal
      data or credentials travel on it"
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2-subchapI-sec45.htm
    checked_at: 2026-10-07
    jurisdiction: US
  - cite: "United States, Federal Trade Commission, Fandango and Credit Karma settlements of March 2014
      (press release of 2014-03-28). The Commission charged that both companies misrepresented the
      security of their mobile apps, which had SSL certificate validation turned off, leaving
      consumers' sensitive data open to man-in-the-middle attacks; both settled under consent orders
      requiring comprehensive security programs. The charge was misrepresentation (the deception
      limb of Sec. 5), so these are records of security claims the code contradicted, not unfairness
      precedent beside the entry above. An enforcement record, not a statute: the operative duty is
      FTC Act Sec. 5, and it is on point only for a connection that carries consumers' personal
      data"
    url: https://www.ftc.gov/news-events/news/press-releases/2014/03/fandango-credit-karma-settle-ftc-charges-they-deceived-consumers-failing-securely-transmit-sensitive
    checked_at: 2026-10-07
    jurisdiction: US
severity: medium
rule_confidence: 0.5

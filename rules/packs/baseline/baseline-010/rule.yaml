context_questions:
  - Which connection does this setting or verifier serve? Name the client, the host it reaches and
    what travels over it (credentials, session tokens, personal data, webhooks carrying records). A
    line with no connection behind it - a type declaration, a form label, a schema, documentation -
    is not the construct.
  - Is the protection off unconditionally, or only under a condition - a setting, an environment
    variable, a development or self-signed flag? If under a condition, what does the code ship as
    the default, and is turning it off an explicit operator choice that is documented?
  - Where verification is replaced rather than switched off - a trust manager's checkServerTrusted,
    a host-name verifier, a validation callback, a rustls verifier, a challenge handler - does the
    replacement check the chain and the host name, or pin a certificate or CA, or does it accept
    every certificate?
  - "For a protocol version: which connection or listener does it apply to, is it the minimum the
    code accepts or a version it is pinned to, and is there a stated reason (a named legacy peer)?
    Could that peer be required to speak TLS 1.2?"
evidence_template: "{file}:{line} carries a setting or construct that weakens TLS protection, in one
  of the positions this rule reads: certificate or host-name verification switched off
  (rejectUnauthorized, NODE_TLS_REJECT_UNAUTHORIZED, InsecureSkipVerify, verify=False, VERIFY_NONE,
  CURLOPT_SSL_VERIFYPEER, verify_none, setInsecure, danger_accept_invalid_certs, a verification key
  set off) or replaced by the code's own verifier (a trust manager, host-name verifier, validation
  callback or challenge handler), or a protocol version below TLS 1.2 enabled or set as the minimum
  (SSL 3.0, TLS 1.0, TLS 1.1). That is text in a file. The detector did not establish which
  connection uses it, whether the deployment reaches the setting, what a replacement verifier's body
  does, or that the line is deployed code rather than documentation or an example. Context questions
  1 to 4 are where this is settled."
remediation_template: >
  This is a candidate for review against GDPR Art. 32 (security of processing), not a determination
  about this

  code. The changes below apply where the review confirms it.

  Leave certificate and host-name verification on. Where a peer uses a private or self-signed
  certificate,

  trust that CA or pin that certificate for that one connection (a CA bundle option, a custom trust
  store)

  instead of turning verification off, and make a replacement verifier check the chain and the host
  name.

  Where verification is a setting, ship it on by default and make turning it off an explicit
  operator choice.

  Set the minimum protocol version to TLS 1.2 (TLS 1.3 where every peer supports it), and remove SSL
  3.0,

  TLS 1.0 and TLS 1.1 from enabled protocol lists.
data_categories: []
fingerprint_spec: file

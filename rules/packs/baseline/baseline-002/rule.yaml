id: baseline-002
pack: baseline
short_name: Secret in the code, secret-named setting, or keychain use
problem_line:
  text: Credential stored where others may read it
fix_line: Rotate a key found in code or history, move it to an env variable or secret manager;
  narrow keychain item access.
title: A live-credential literal, a secret-named configuration key, or a platform-keychain call, key
  or type
jurisdiction:
  - EU
  - US
  - JP
legal_basis:
  - cite: GDPR Art. 32 (security of processing)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    checked_at: 2026-07-22
    jurisdiction: EU
  - cite: "EU Cyber Resilience Act (Regulation (EU) 2024/2847), Annex I, Part I, points (2)(a), (2)(b)
      and (2)(d) (essential cybersecurity requirements: no known exploitable vulnerabilities,
      secure-by-default configuration, protection from unauthorised access by appropriate control
      mechanisms). Per Art. 71(2) the Regulation applies from 11 December 2027; Art. 14 applies from
      11 September 2026 and Chapter IV from 11 June 2026. Scope check: the CRA reaches products with
      digital elements made available on the EU market (Art. 2(1), Art. 3(1)) and hosted software
      only as a remote data processing solution within Art. 3(2) — software whose absence would stop
      the product performing one of its functions. Recital 12 places websites that do not support
      the functionality of such a product, and cloud services (SaaS, PaaS, IaaS) designed and
      developed outside a manufacturer's responsibility, outside this Regulation and inside
      Directive (EU) 2022/2555 instead. For a plain hosted web application this entry therefore does
      not reach the scanned artefact and GDPR Art. 32 is the operative EU basis; it applies where
      the repository ships a distributed product or the backend of one"
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    checked_at: 2026-07-22
    jurisdiction: EU
  - cite: "Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 23
      (security control measures). The PPC Guidelines (General Rules), Annex on the security control
      measures to be taken, place identification and authentication of those who access an
      information system handling personal data under this duty. General basis, and an indirect one:
      Art. 23 protects personal data, whereas the value this rule looks for is a service credential.
      It reaches the finding through the system the credential unlocks, so it bites only where that
      system handles personal data"
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-07-22
    jurisdiction: JP
  - cite: "United States, FTC Act Sec. 5 (15 U.S.C. Sec. 45(a)(1) and (n)) — unfair acts or practices in
      or affecting commerce, the authority behind the Federal Trade Commission's data-security cases
      (failure to employ reasonable security causing or likely to cause substantial injury to
      consumers, not reasonably avoidable and not outweighed by countervailing benefits). General
      basis: no federal statute names credential management as a requirement, and the unfairness
      test turns on injury to consumers, so it reaches an exposed service credential only through
      the consumer data that credential unlocks"
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2-subchapI-sec45.htm
    checked_at: 2026-07-22
    jurisdiction: US
severity: high
rule_confidence: 0.9

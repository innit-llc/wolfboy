      - pfsockopen
      - socket_connect
      - create_connection
      - connect
      - Connect
      - ConnectAsync
      - Socket
      - InetSocketAddress
      - TcpClient
      - DnsEndPoint
      - HttpHost
      - TcpStream::connect
      - :gen_tcp.connect
      - begin
      - createConnection
    plaintext_dial_call:

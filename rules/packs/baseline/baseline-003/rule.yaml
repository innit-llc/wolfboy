context_questions:
  - Is this URL actually dereferenced, or is it a namespace URI, a canonical identifier or prose in
    a comment? Name the call that reaches the host.
  - Does what travels over this connection include personal data or credentials (request body, query
    string, headers, cookies, a directory bind password, mail, queued jobs, cached sessions, chat
    messages)?
  - Is this the application's own outbound request, or is it defaulting a scheme for a link the user
    will follow? If it is scheme-defaulting, say whether https is attempted first, and whether the
    rendered link carries rel=noreferrer - without it the referring URL travels in cleartext.
  - "For a scheme other than http - ws, ldap, smtp, imap, pop3, ftp, redis, amqp, mqtt and the rest
    - is TLS switched on another way the URL does not show: StartTLS required on the LDAP, SMTP,
    IMAP or POP3 connection, a tls option on the client, or a TLS-terminating proxy in front of the
    host? Does the host leave the machine or the private network?"
  - "Where the line opens a connection by host and port rather than writing a URL - port 80, an
    HTTPConnection or Net::HTTP call with no TLS on the line, a URL built with the scheme http -
    which host does it reach, and is TLS switched on anywhere the line does not show: a use_ssl
    setting on a following line, an options hash, or a TLS-terminating proxy in front of the host?"
  - "A PLACE IN CODE THAT DOES NOT SHIP, AND HOW TO RECORD IT. A plaintext connection that only a
    test suite, a development set-up, a continuous-integration test step or a demo opens to a
    service of its own carries no product data: a test stack whose stores are thrown away after the
    run, a branch only the development environment takes, a CI test job's service container, a demo
    seed. Where the line shows that (quote the branch, the test helper, the CI test step, or the
    file's own statement of what it is for), the status is `duty_met`, its `at` that line, and its
    `element` the words `test, development, CI, demo or documentation code that does not ship`. Two
    things are not this and stay `duty_unmet` wherever they sit, because the product's supply path
    carries them: a URL in a document that tells someone how to install, configure, update or reach
    the product (install documents, a README's set-up section, a documentation-site page, release
    notes); and a fetch or a push in a CI, build or release workflow, test steps included, other
    than a connection to a service the job itself starts and throws away: a download of code, a
    tool, a package or an image that the workflow then runs or builds with (a script piped into a
    shell, an installer, a dependency, a base image), a download or a publication of what is
    supplied, a deployment, or a step that configures a running environment or moves its data. The
    only documentation this covers is text that tells no one to use the URL (a reference link, an
    old changelog entry). A WAY OUT HOLDS ONLY AT EVERY KEPT PLACE: a status this question gives is
    the finding's only where every place of the finding that you or the seats before you kept has
    the shape that status names; a kept place inside a helper or a shared function has that shape
    only where every call that reaches it does, so walk every caller, and a caller that would be
    `duty_unmet` makes that place `duty_unmet`. Where the kept places differ, the finding takes the
    heaviest of their statuses (`duty_unmet`, then `waits_on_answer`, then `duty_met` or `exempt`),
    with its `at` and its `decisive` at that place: one kept place that is `duty_unmet` makes the
    finding `duty_unmet`."
evidence_template: "{file}:{line} carries a plaintext endpoint or connection in one of the positions
  this rule reads: a URL whose scheme carries no TLS (http://, ws://, ftp://, ldap://, telnet://,
  smtp://, imap://, pop3://, redis://, amqp://, mqtt://, irc://, rtmp://, rtsp://, nntp://,
  gopher://, tftp://) inside a quoted string, on the right of a `name: value`, `name => value` or
  `NAME=value` configuration line, or immediately after an HTML or XML tag; or a connection opened
  by host and port with no TLS on the line - a call whose port is the literal 80, a connection type
  that carries no TLS unless told to (Python HTTPConnection, Ruby Net::HTTP with one argument or
  started without use_ssl, Dart Uri.http, Mint with :http), or a URL assembled from parts with the
  scheme http (a scheme key, setter or constructor argument). That is text in a file. The detector
  did not establish that anything connects to it, that the host is remote rather than loopback, that
  TLS is not switched on by a line it did not read, or that the line is deployed code rather than
  documentation, an example template or test data - the same positions are satisfied by a
  contributor's personal homepage in a credits file, by mock data inside a unit test's stubbed
  return value, by a getting-started document whose host is the placeholder [HOSTNAME_OR_IP], by a
  worked example in a migration guide using a stand-in address, by a test server on loopback reached
  through a port variable, and by a development-server URL assembled through interpolation, where
  the host variable defaults to 127.0.0.1 and the clause, which declines a loopback address written
  literally, cannot see one that arrives through a variable. Context questions 1, 4 and 5 are where
  this is settled: name the call that reaches the host, and whether TLS is switched on elsewhere"
remediation_template: >
  This is a candidate for review against GDPR Art. 32 (security of processing), not a determination

  about this code. The changes below apply where the review confirms it.

  Move the endpoint to its TLS form: https, wss, ldaps (or LDAP with StartTLS required), ftps or
  sftp,

  smtps (or SMTP with STARTTLS required), imaps, pop3s, rediss, amqps, mqtts, ircs or rtmps. telnet
  has no

  TLS form; replace it with SSH.

  For a connection opened by host and port, open it with TLS: `use_ssl = true` on port 443 for Ruby

  Net::HTTP, HTTPSConnection for Python, the https scheme for a URL built

  from parts, and port 443 behind a TLS wrapper (such as `ssl://` or `tls://` in PHP) for a raw
  socket.

  Where the remote side offers no TLS, switch to a different provider, or put a TLS-terminating

  proxy you control in front of it.

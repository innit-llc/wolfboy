id: baseline-001
pack: baseline
short_name: A password or key written to the logs
problem_line:
  text: Password or key written to a log or console
  template: "{data} written to a log or console"
fix_line: Drop the secret from the log call or log a masked form, and set up redaction in the shared
  logger where one is used.
title: Secret- or credential-named value given to a log or print call
jurisdiction:
  - EU
  - US
  - JP
legal_basis:
  - cite: GDPR Art. 5(1)(f) and Art. 32 (integrity and confidentiality; security of processing)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    checked_at: 2026-07-21
    jurisdiction: EU
  - cite: Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 23
      (security control measures — duty to take necessary and appropriate measures for the security
      control of personal data)
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-07-22
    jurisdiction: JP
  - cite: Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 26
      (reporting of leakage etc. — the separate duty to report a leakage of personal data to the
      Personal Information Protection Commission and to notify the data subject)
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-07-22
    jurisdiction: JP
  - cite: "United States, FTC Act Sec. 5 (15 U.S.C. Sec. 45(a)(1) and (n)) — unfair acts or practices in
      or affecting commerce. This is the authority the Federal Trade Commission uses for its
      data-security line, where a failure to employ reasonable security causes or is likely to cause
      substantial injury to consumers that is not reasonably avoidable and not outweighed by
      countervailing benefits. General basis: the United States has no federal statute setting a
      security requirement for application logging, so this is an enforcement theory of general
      application rather than a named control"
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2-subchapI-sec45.htm
    checked_at: 2026-07-22
    jurisdiction: US
  - cite: "California Civil Code Sec. 1798.81.5(b) — a business that owns, licenses or maintains
      personal information about a California resident shall implement and maintain reasonable
      security procedures and practices appropriate to the nature of the information. Sec.
      1798.81.5(d)(1)(B) counts a username or email address together with a password (or a security
      question and answer) permitting access to an online account as personal information, which is
      the class of value this rule looks for. State scope only: this is California law rather than a
      nationwide requirement, and it states a reasonableness standard rather than a named control"
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=1798.81.5&lawCode=CIV
    checked_at: 2026-07-22
    jurisdiction: US
severity: high
rule_confidence: 0.7

context_questions:
  - "Does the secret-named value reach the log or print call at all? On the four whole-line clauses
    - the ones asking only that a log or print sink appear somewhere on the line and a secret-named
    expression somewhere else on it, in any language and JavaScript included, since their sink list
    carries `console` too - the sink and the secret-named expression are found independently of each
    other, so quote the call and say which argument position the value occupies, or record that it
    occupies none. Where it does reach the call: does the logged expression carry an actual secret
    or personal data? The identifier name alone proves nothing — the value may already be masked
    upstream. Trace the value back to where it is assigned and quote that line."
  - Does this log survive a production build, or is it behind a development-only guard (NODE_ENV
    check, debug flag, build-time strip)?
  - Is console output forwarded to a log-collection backend (Sentry, Datadog, CloudWatch) that would
    persist the value off-host?
  - "A FIXED SAMPLE VALUE OR A THROWAWAY VALUE, AND HOW TO RECORD IT. Some kept candidates print a
    value that guards no real person's data: a fixed sample value written into the repository itself
    (a demo or seed account's password or key, printed by the task that seeds it), or a throwaway
    value of a service that exists only in development, continuous integration or tests (a CI job's
    database container discarded after the job, a local test database). A SEED OR DEMO VALUE IS THIS
    ONLY WHERE THE PRODUCT ITSELF KEEPS THE SEED OUT OF EVERY RUNNING INSTANCE: a check in the
    seed's own code, or in the file that loads it, that refuses to run unless the environment is
    development or test, with nothing that lifts it; or a file only the test runner loads. Tell that
    guard from an operator flag by what it reads and what lifts it: the guard lists development and
    test as the only environments the seed runs in, and reads the environment the product's own
    shipped deployment sets (production, in its image, compose file or chart). The guard counts only
    where that deployment, or the install its documents give, sets production, or where the guard
    also refuses an environment left unset: where the shipped deployment leaves the environment
    unset, the framework's own default decides (Rails and Rack fall back to development, so `abort
    unless Rails.env.development? || Rails.env.test?` then passes), and a guard that passes that way
    does not count. An operator flag is a check that refuses only in production (so staging or any
    other environment runs the seed), a check that a variable, an argument or a setting lifts (an
    `ALLOW_` or `FORCE` variable, a `--force` argument), or a check of a variable of the seed's own
    that a deployment can set; a seed behind one counts as reachable. Where the line shows a fixed
    sample or throwaway value, and for a seed or demo value that guard as well, the status is
    `duty_met`, its `at` the line that shows it (the guard that keeps the seed out, the CI job or
    test step that starts the service, or the development-only guard), and its `element` the words
    `fixed sample or throwaway value used only in development, CI or tests`. A value the log call
    reads at run time from the environment, a store or a request is not this, because a deployment
    then prints whatever secret it holds, unless the code shows that only a development, CI or test
    run supplies it. Four things are not this and stay `duty_unmet` wherever the file sits: a seed
    or demo task that the product's start-up runs (an entrypoint or release step that runs the
    seeds) or that an operator can run against a running instance, with no such guard, because its
    account and its known password or key then exist on every instance that runs it; a value in a
    real vendor's key format (a prefix such as `sk_live_`, `AKIA` or `ghp_`, which baseline-002
    reads, or another provider's own credential format), because a live key opens that vendor's
    service wherever it is used; a value that a shipped configuration falls back to or that a sample
    environment file operators copy carries (a compose default, a fallback such as
    `${NAME:-value}`), because a deployment that does not set it runs with a secret every reader of
    the repository knows; and a value whose service also holds real people's data (a staging or
    production database a CI job reaches). Whether the file ships is the separate part `ships`, and
    it does not decide this. A WAY OUT HOLDS ONLY AT EVERY KEPT PLACE: a status this question gives
    is the finding's only where every place of the finding that you or the seats before you kept has
    the shape that status names; a kept place inside a helper or a shared function has that shape
    only where every call that reaches it does, so walk every caller, and a caller that would be
    `duty_unmet` makes that place `duty_unmet`. Where the kept places differ, the finding takes the
    heaviest of their statuses (`duty_unmet`, then `waits_on_answer`, then `duty_met` or `exempt`),
    with its `at` and its `decisive` at that place: one kept place that is `duty_unmet` makes the
    finding `duty_unmet`."
evidence_template: "{file}:{line} matched one of this rule's eight clauses, and the two families
  they fall into do not establish the same thing. Four clauses anchor on a console call (log, info,
  debug, warn, error) and verify the coupled construct: the secret-named expression sits inside that
  call's own parentheses, in argument, interpolation or subscript position. The other four are the
  weaker family, and what separates them is mechanism rather than language: each is a pair of
  independent whole-line lookaheads that asks only that a log or print sink appear somewhere on the
  line and that a secret-named expression appear somewhere else on it, with no coupling between the
  two. Their sink list is language-blind and includes `console` itself alongside the Python, Ruby,
  PHP, Go, Java, Kotlin, C#, Rust, Swift and shell forms, so they fire on JavaScript and TypeScript
  lines as readily as on any other - which language the file is written in tells you nothing about
  which family fired. The looser coupling is a deliberate trade, recorded in the detector. So on
  those four the detector established only that both things appear on the same line, and the known
  look-alikes are exactly that shape: a key-derivation or HMAC call taking the secret while a print
  call on the same line prints something else; a secret-named object literal handed to a different
  function beside a genuine console.error; the prefix `Rails.` counted as the logging idiom, because
  the pattern asks for `Rails` followed by a dot rather than for `Rails.logger`; a `print(` inside a
  string literal hundreds of characters further along a fenced documentation block collapsed onto
  one line; and a template data-binding attribute in a tutorial whose placeholder name ends in
  Secret. Read the matched line, say which family fired, and name the argument position the value
  occupies in the sink - or record that it occupies none, which settles the candidate before context
  questions 2 and 3, both of which assume a call that receives it. Whether the value itself is a
  secret rather than one already masked upstream is context question 1 A NINTH CLAUSE WAS ADDED
  2026-09-04, and the count of eight above predates it exactly as baseline-004's own template says
  of its four. It belongs to the WEAKER family, which is now five: it asks that a log or print sink
  appear somewhere on the line - the process output streams `stdout.write` and `stderr.write` among
  them, which no earlier sink list held - together with a credential-named key immediately followed
  by `=` and the opening of an interpolation, which is the shape a freshly generated key is printed
  in as an environment assignment. It couples the two no more tightly than the other four of that
  family do, so read it the same way: say whether the sink actually receives the value, or record
  that it does not. TWO MORE CLAUSES WERE ADDED 2026-09-08, and the counts of eight and nine above
  are left as they were written, exactly as this template already leaves the eight. Both belong to
  the WEAKER family, which is now seven, and both are read the same way. THE TENTH asks that an
  ALL-CAPS identifier of three to twelve characters be called on the line, outside any string
  literal, with a printf conversion or a brace placeholder after it, and a credential-named value in
  argument position. That is the shape of a project's OWN logging macro - LOGP and DBGP in one tree,
  ESP_LOGI, RTE_LOG or ZF_LOGI in another, and the house macro of any C or C++ project - which no
  list of sink names can hold, because each project defines its own. What it does not establish is
  that the identifier is a logging macro at all, or where the macro writes: open the macro's own
  definition and say which stream, file or ring buffer it reaches, because a macro that formats into
  a buffer the program never emits is a different fact from one that writes to the system log, and
  neither fact is on the matched line. THE ELEVENTH reads the message instead of the value: a log
  sink on the line, a quoted literal whose last word is a credential label - key, password, token,
  secret or credential, with only a colon, an equals sign or spaces allowed after it before the
  closing quote - and a value concatenated after that quote. Here the credential word sits in the
  text the programmer wrote while the value beside it is an ordinary accessor such as a getter, so
  the question the other clauses put to the identifier is answered by opening that accessor instead.
  Two further facts are not on the line and belong to the operator rather than to the code: whether
  the deployment's configured log level emits the line at all, since a debug-level call under a
  logger configured at info level writes nothing, and whether the build strips it."
remediation_template: |
  This is a candidate for review against GDPR Art. 32 (security of processing), not a determination
  about this code. The changes below apply where the review confirms it.
  Drop the secret from the log call, or log a masked form (leading characters only, or a hash).
  Where a structured logger is in use, configure its redaction rules (pino `redact` paths and
  equivalents) so the field is stripped centrally rather than at each call site.

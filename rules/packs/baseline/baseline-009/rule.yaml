    - (?:[\w$\])]\.|\[\s*["'])(?:ssl|tls|useSSL|useSsl|useTLS|useTls|use_ssl|use_tls|ssl_enabled|tls_enabled|sslEnabled|tlsEnabled)["']?\s*\]?\s*=(?!=)\s*(?:false|False|FALSE)(?![\w$])

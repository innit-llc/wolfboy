    - (?<![A-Za-z0-9$])(?:[a-z0-9_.-]*?[_.-])?(?:db|database|postgres|postgresql|pg|mysql|mariadb|mongo|mongodb|redis|cache|amqp|rabbitmq|kafka|nats|elastic|elasticsearch|opensearch|clickhouse|ldap|mssql|memcache|memcached|cassandra|broker)(?:[_.-](?:[a-z0-9_.-]*?[_.-])?)?(?:ssl|tls|use_ssl|use_tls|ssl_enabled|tls_enabled|Ssl|Tls|UseSsl|UseTls|SslEnabled|TlsEnabled)["']?\s*(?:=>|[:=])\s*["']?(?:false|False|FALSE|0|no|off|disable|disabled|none)["']?(?=\s*(?:$|[,;#})\]]))
    - xpack\.security(?:\.(?:http|transport))?(?:\.ssl)?\.enabled["']?\s*(?:=>|[:=])\s*["']?(?:false|False|FALSE)(?![\w])
    - (?:plugins\.security\.disabled|DISABLE_SECURITY_PLUGIN)["']?\s*(?:=>|[:=])\s*["']?(?:true|True|TRUE)(?![\w])
    - (?:security[._]?[Pp]rotocol|SECURITY_PROTOCOL)["']?\s*(?:=>|[:=,])\s*["']?(?:SASL_)?PLAINTEXT(?![\w])

id: baseline-009
pack: baseline
short_name: Service connection or app setting that allows plain text
problem_line:
  text: Service or app traffic with no encryption found
  template: "{data} sent to a service with no encryption found"
fix_line: Turn TLS on for the connection and verify the server, or use a local socket; narrow any
  cleartext app permission.
title: "Service connection or platform setting without TLS: a database, cache, queue, search,
  directory, gRPC or Docker API connection, or a mobile permission for plaintext traffic"
jurisdiction:
  - EU
  - US
  - JP
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 32(1) - 'the controller and the processor shall
      implement appropriate technical and organisational measures to ensure a level of security
      appropriate to the risk, including inter alia as appropriate: (a) the pseudonymisation and
      encryption of personal data; (b) the ability to ensure the ongoing confidentiality, integrity,
      availability and resilience of processing systems and services;'. Art. 32(2) - 'In assessing
      the appropriate level of security account shall be taken in particular of the risks that are
      presented by processing, in particular from accidental or unlawful destruction, loss,
      alteration, unauthorised disclosure of, or access to personal data transmitted, stored or
      otherwise processed.' The records a store holds, and the credentials that open it, are
      transmitted over this connection; whether the measure is appropriate to the risk is a
      judgement on the whole deployment, which this candidate opens and does not close"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-10-07
    jurisdiction: EU
  - cite: "EU Cyber Resilience Act (Regulation (EU) 2024/2847), Annex I, Part I, point (2)(e) - 'protect
      the confidentiality of stored, transmitted or otherwise processed data, personal or other,
      such as by encrypting relevant data at rest or in transit by state of the art mechanisms, and
      by using other technical means'; and point (2)(b), the hook for a plaintext DEFAULT as
      distinct from an option - 'be made available on the market with a secure by default
      configuration, unless otherwise agreed between manufacturer and business user in relation to a
      tailor-made product with digital elements, including the possibility to reset the product to
      its original state;'. Both points sit under the opening words of point (2), 'On the basis of
      the cybersecurity risk assessment referred to in Article 13(2) and where applicable, products
      with digital elements shall:', so they bind as the manufacturer's cybersecurity risk
      assessment makes them applicable, and point (2)(b) gives way where manufacturer and business
      user have agreed otherwise for a tailor-made product. Per Art. 71(2) the Regulation applies
      from 11 December 2027. Scope check: the CRA reaches products with digital elements made
      available on the EU market (Art. 2(1), Art. 3(1)) and hosted software only as a remote data
      processing solution within Art. 3(2). Recital 12 places websites that do not support the
      functionality of such a product, and cloud services (SaaS, PaaS, IaaS) designed and developed
      outside a manufacturer's responsibility, outside this Regulation and inside Directive (EU)
      2022/2555 instead. For a plain hosted web application this entry therefore does not reach the
      scanned artefact and GDPR Art. 32 is the operative EU basis; it applies where the repository
      ships a distributed product (a mobile app, a self-hosted server) or the backend of one. Where
      it does apply it is the only EU basis here that covers non-personal data"
    url: https://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-10-07
    jurisdiction: EU
  - cite: Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 23
      (security control measures - a business handling personal information must take necessary and
      appropriate measures for the security control of the personal data it handles). Bites only
      where personal data is what travels over the connection
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-10-07
    jurisdiction: JP
  - cite: Japan, Personal Information Protection Commission, Guidelines on the APPI (General Rules) Q&A
      10-21, on methods for preventing leakage in the use of information systems under the Art. 23
      security control measures. The Commission's own answer gives encryption of personal data on
      networks that may be intercepted, naming SSL/TLS and S/MIME, as such a method. Guidance, not
      statute
    url: https://www.ppc.go.jp/all_faq_index/faq1-q10-21/
    checked_at: 2026-10-07
    jurisdiction: JP
  - cite: United States, FTC Act Sec. 5 (15 U.S.C. Sec. 45(a)(1) and (n)) - unfair or deceptive acts or
      practices in or affecting commerce. Transport security sits inside the Federal Trade
      Commission's data-security line, which reaches a failure to employ reasonable security that
      causes or is likely to cause substantial injury to consumers, not reasonably avoidable and not
      outweighed by countervailing benefits. The Commission's business guidance Start with Security
      names strong cryptography for confidential material during transmission; that guidance is not
      statute
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2-subchapI-sec45.htm
    checked_at: 2026-10-07
    jurisdiction: US
severity: medium
rule_confidence: 0.5

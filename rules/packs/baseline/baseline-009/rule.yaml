    - "[\"']NS(?:Temporary)?(?:Exception)?Allows(?:ArbitraryLoads(?:InWebContent|ForMedia)?|Insecur\
      eHTTPLoads)[\"']\\s*(?:[:=]|=>)\\s*(?:true|True|YES|<true)"
    - (?<![\w+.:-])(?:postgres(?:ql)?|mysql|mariadb|mongodb|nats|jdbc:(?:postgresql|mysql|mariadb))(?:\+(?!srv)[a-z0-9]+)?://(?![^\s"'`<>]*[?&;](?:sslmode|ssl|tls|useSSL|requireSSL|sslMode|ssl-mode|ssl_mode|sslca|ssl_ca|sslrootcert|sslcert|tlsCAFile|tlsCertificateKeyFile|tlsInsecure|tlsAllowInvalidCertificates|encrypt|sslaccept|verifyServerCertificate|trustServerCertificate)=)(?:[^\s/@"'`]*@|(?![^\s/@"'`]*@))(?!(?:localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|\[::1\]|::1|0\.0\.0\.0)(?![A-Za-z0-9.-]))[A-Za-z0-9$_{\[<%]
    - (?<![A-Za-z0-9$])(?:(?:ssl|SSL|Ssl)\s+(?:mode|Mode|MODE)\s*=\s*(?:disable|disabled|allow|prefer|preferred|none|DISABLE|DISABLED|ALLOW|PREFER|PREFERRED|NONE|Disable|Disabled|Allow|Prefer|Preferred|None)|(?<=[;"'`]\s*)(?:ssl|SSL|Ssl)[_-]?(?:mode|Mode|MODE)\s*=\s*(?:none|None|NONE)\s*(?=[;"'`]|$))(?![\w-])
    - (?:(?<![=!<>])=(?!=)|[(,:]|=>)\s*(?:[\w.]+\.)?(?:Npgsql|MySql|Pg)?SslMode(?:\.|::)(?:Disable|Disabled|None|Allow|Prefer|Preferred)(?![\w-])
    - (?<![\w$])TLSConfig\s*(?::|(?<![=!<>])=(?!=))\s*["'](?:false|preferred)["']
    - (?<![\w$.-])["']?protocol["']?\s*(?:=>|[:=])\s*["']?(?:SASL_)?PLAINTEXT(?![\w-])
    - (?<![\w$.-])["']?cleartext["']?\s*:\s*true(?![\w$])
context_questions:
  - "Which service does this connection reach, and does the hop leave the machine? A Unix socket or
    a loopback address keeps it on the host; a service name on a container network (such as db,
    redis or postgres), a private address or a public host name may cross a network the operator
    does not control. Whether the deployment under review uses this configuration, and where the
    store actually runs, are facts about the deployment: find them in its configuration or ask the
    person running the scan, and do not decide them from a host name, a default value or a file
    name. Where the finding carries locations[].joined_from, read the whole span it names first: the
    cited line is only where the options object opens."
  - "Is TLS switched on anywhere the line does not show: an environment variable such as PGSSLMODE,
    the driver's own default (for PostgreSQL URLs: node pg uses no TLS, libpq and pgx prefer TLS
    without verifying the certificate, Go lib/pq requires it), a StartTLS call made on the directory
    connection after it opens, a sidecar, tunnel or service mesh that encrypts the hop? Quote it
    with its file and line, or record that none was found."
  - Is this the configuration a production deployment runs with, or one used only for local
    development, continuous integration or tests (a development compose file, a CI service
    container, a sample environment file)? Say which, from the file's own use in the repository;
    where the same setting also reaches production through a default, say so.
  - "What personal data cross this connection? A connection to a store carries what the store holds:
    establish it from the code you can read - the store's schema, migrations or models (a users
    table with an e-mail column is `email`, profiles with names `name`, messages, posts or uploads
    `user_content`, sessions or records keyed by user `user_id`), and for a cache or queue what the
    code writes to it - and record it as `data` at this place, quoting in `beyond` the one line it
    rests on (the table or model definition, or the write). Where the store's schema or models are
    not in the code you can read, or the code does not show which store this connection reaches,
    record only what the window shows and say in `why` what you could not see. Record `data` as
    established in every case: where the connection names a loopback address, a Unix socket, a
    development value or a default, say so in `why` with the line it rests on, and never empty
    `data` for it - whether a hop that stays on the machine changes the level is a fact only the
    person running the scan can establish, and this question does not decide it. A connection used
    only by continuous integration or tests carries test data, not the product's users': say so in
    `why` and record `data` as `[]`. Decide it by what the file does, never by its name, its folder
    or a host name, as question 1 asks: a CI job's service container or test step, a compose file
    only test scripts start, or a test setup - each of which runs tests against a store thrown away
    after them - is that. A workflow or file that deploys or configures a running environment (a
    review app, staging or production) is deployment configuration, wherever it sits, and its
    connection carries the product's data; so is the product's own runtime configuration, and a
    default in it is the product's. Name the credentials that open the store in `why`. For a mobile
    platform setting (Android cleartext permission, iOS App Transport Security exception), which
    domains does it cover, what is the value written beside the key (read the next line in a
    property list), and what does the app send to those domains?"
  - "ONE SHAPE THE SHIPPED FILE SETTLES: A HOP THAT STAYS ON ONE HOST'S PRIVATE CONTAINER NETWORK.
    Where the connection's host is a service defined in the same compose or Podman file that the
    product ships as its deployable stack, that service publishes no port (it has no ports entry,
    and nothing else in the file maps one), and the file puts the two on a network of that stack
    alone (its default network, or one it declares that is not marked external), the hop runs
    between two containers on the one machine the stack is started on and leaves it at no point: no
    network the operator does not control carries it. GDPR Art. 32(1) asks for 'a level of security
    appropriate to the risk', and the risk Art. 32(2) names, 'unauthorised disclosure of, or access
    to personal data transmitted, stored or otherwise processed', needs a path someone else can
    reach; CRA Annex I Part I point (2)(e) names, beside encryption, protection 'by using other
    technical means', which isolation on one host is; and the Commission's Q&A in entry 4 gives
    encryption on networks that may be intercepted. Then the status is `exempt`, its `at` the line
    of the file that defines the database service with no published port, and `exemption` has
    `basis` `L1` and `limb` `security appropriate to the risk: the hop never leaves one host`. Read
    the whole file first: a published port, an external network, a swarm deployment of the same file
    (a deploy section placing replicas across nodes, or install documentation that deploys it as a
    stack), or a host that is not a service of that file, is not this shape, and question 1 stands.
    Record `data` as question 4 asks whether or not this applies: the exemption is about the hop,
    not about what crosses it. A WAY OUT HOLDS ONLY AT EVERY KEPT PLACE: a status this question
    gives is the finding's only where every place of the finding that you or the seats before you
    kept has the shape that status names; a kept place inside a helper or a shared function has that
    shape only where every call that reaches it does, so walk every caller, and a caller that would
    be `duty_unmet` makes that place `duty_unmet`. Where the kept places differ, the finding takes
    the heaviest of their statuses (`duty_unmet`, then `waits_on_answer`, then `duty_met` or
    `exempt`), with its `at` and its `decisive` at that place: one kept place that is `duty_unmet`
    makes the finding `duty_unmet`."
evidence_template: "{file}:{line} matched one of the service-connection shapes this rule reads: a
  PostgreSQL or MySQL TLS mode set to disable, allow or prefer; a TLS parameter switched off inside
  a connection string (`useSSL=false`, `tls=false`, `ssl=false`, `Encrypt=False`) or the MySQL
  client's `--skip-ssl`; `ssl`, `tls` or `encrypt` set false in a database, cache, queue, search or
  directory client's options or on a configuration object; a store-named configuration key ending in
  a TLS word set off; Elasticsearch or OpenSearch security off; a Kafka plaintext protocol or
  listener; a gRPC channel or server with insecure credentials; an LDAP client opened without ldaps;
  STARTTLS switched off; the Docker Engine API on port 2375; an Android cleartext permission; an iOS
  App Transport Security exception; or a database or NATS URL to a host that is not loopback with no
  TLS parameter on it. That is text in a file. The detector did not establish that the deployment
  uses this configuration, that the hop leaves the machine, that nothing it did not read switches
  TLS on (an environment variable, a driver default, a StartTLS call, a tunnel), or that the line is
  deployed configuration rather than a development compose file, a test fixture, documentation or a
  sample environment file. Where the finding carries locations[].joined_from, {line} is the line the
  options object opens on and the setting may sit several lines below it: read the whole span. A
  STARTTLS line that names mail is also read by baseline-008, which asks the mail question. In a
  property list the value of an App Transport Security key is usually on the next line: read it
  before treating the key as set. Context questions 1 and 3 settle where the hop goes and whether
  this configuration is deployed; question 2 settles whether TLS is on elsewhere."
remediation_template: >
  This is a candidate for review against GDPR Art. 32 (security of processing), not a determination

  about this code. The changes below apply where the review confirms it.

  Turn TLS on for the connection and verify the server: `sslmode=verify-full` for PostgreSQL,

  `ssl-mode=VERIFY_IDENTITY` for MySQL, `tls=true` for MongoDB, `Encrypt=True` for SQL Server, TLS

  options on the cache, queue or search client, secure channel credentials for gRPC, ldaps or a

  mandatory StartTLS for LDAP, port 2376 with client certificates for the Docker API. Where the
  store

  runs on the same host, connect over a Unix socket or loopback and say so in the configuration. For
  a

  mobile app, remove the cleartext permission or narrow it to the named domains that cannot serve
  TLS.
data_categories: []
fingerprint_spec: directory

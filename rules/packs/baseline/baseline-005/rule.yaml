    - ^(?=.*(?:[A-Za-z_]*[Cc]ookie[A-Za-z_]*\s*(?:[:(]|\(\s*\)\s*\.|\.\s*[A-Za-z_]+\s*\()|[Ss]et-[Cc]ookie|[Ss]erialize\s*\(|[Ii]s[Hh]ttp[Oo]nly))(?!.*(?<![\w-])[Ss][Ee][Cc][Uu][Rr][Ee](?![\w-])\s*:).*[,(:]\s*\{(?![^{}]*\.\.\.)(?![^{}]*(?<![\w-])(?:[Ii]s)?[Ss][Ee][Cc][Uu][Rr][Ee](?![\w-]))[^{}]*[Hh][Tt][Tt][Pp][Oo][Nn][Ll][Yy]\s*:\s*true[^{}]*\}
    - ^(?=.*(?:[Cc][Oo][Oo][Kk][Ii][Ee]|[Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Cc][Ss][Rr][Ff]|[Xx][Ss][Rr][Ff]|[Jj][Ww][Tt]|[Aa][Uu][Tt][Hh]))(?=.*(?<![\w-])(?:[A-Za-z0-9_.-]*[_.-])?(?:[Ss]et)?[Ss][Ee][Cc][Uu][Rr][Ee](?![\w-])["']?\s*\]?\s*(?:=>|[:=]|\(|["']\s*,|,)\s*["']?(?:false|False|FALSE|0|[Oo]ff|no)(?![\w-]))
    - set(?:raw)?cookie\s*\((?![^()]*(?<![\w-])['\"]?[Ss][Ee][Cc][Uu][Rr][Ee]['\"]?\s*(?:=>|:)\s*true)[^()]*['\"]?[Hh][Tt][Tt][Pp][Oo][Nn][Ll][Yy]['\"]?\s*(?:=>|:)\s*true

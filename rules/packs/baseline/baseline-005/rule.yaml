id: baseline-005
pack: baseline
short_name: "Cookie with no Secure flag found: it can go over plain HTTP"
problem_line:
  text: Cookie that can be sent without encryption
fix_line: Make Secure, HttpOnly and SameSite (Lax, or Strict where the flow allows) the default in
  the shared cookie settings.
title: Cookie set with no Secure attribute, with the attribute switched off, or with it emitted only
  under a runtime condition
jurisdiction:
  - EU
  - US
  - JP
legal_basis:
  - cite: GDPR Art. 32 (security of processing; protection of session data)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    checked_at: 2026-07-22
    jurisdiction: EU
  - cite: "ePrivacy Directive 2002/58/EC (confidentiality and security of information stored on the
      user's terminal equipment). No article is pinned for the Secure attribute: the security duty
      in Art. 4 is addressed to providers of publicly available electronic communications services
      rather than to site operators, and Art. 5(3) governs consent for storage of or access to
      terminal-equipment information rather than the transport attributes of a cookie. Treat this
      entry as background; GDPR Art. 32 is the operative basis"
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02002L0058-20091219
    checked_at: 2026-07-22
  - cite: "Japan APPI (Act on the Protection of Personal Information, Act No. 57 of 2003), Art. 23
      (security control measures — necessary and appropriate measures for the security control of
      personal data). A cookie without Secure may travel over a plaintext connection, and PPC
      Guidelines (General Rules) Q&A 10-21 gives encryption of personal data on networks that may be
      intercepted (SSL/TLS) as a method under this duty. General basis: the Act names no cookie
      attribute, and it reaches this finding through the session cookie of a logged-in user, whose
      identifier is personal data in the operator's hands. A cookie set for an unidentified visitor
      is personal-related information under Art. 31 instead, which governs provision to third
      parties rather than security"
    url: https://laws.e-gov.go.jp/law/415AC0000000057
    checked_at: 2026-07-22
    jurisdiction: JP
  - cite: California Civil Code Sec. 1798.100(e) (CCPA as amended by Proposition 24, operative 1 January
      2023) — a business that collects a consumer's personal information shall implement reasonable
      security procedures and practices appropriate to the nature of the personal information, in
      accordance with Sec. 1798.81.5. Sec. 1798.140(v)(1)(A) counts a unique personal identifier or
      online identifier as personal information and Sec. 1798.140(aj) names cookies as such an
      identifier, which is what this rule looks at. State scope only, applying to businesses that
      meet the CCPA thresholds, and the duty is a reasonableness standard rather than a named
      attribute
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?sectionNum=1798.100&lawCode=CIV
    checked_at: 2026-07-22
    jurisdiction: US
  - cite: "United States, FTC Act Sec. 5 (15 U.S.C. Sec. 45(a)(1) and (n)) — unfair acts or practices in
      or affecting commerce, the authority behind the Federal Trade Commission's data-security line
      (failure to employ reasonable security causing or likely to cause substantial injury to
      consumers, not reasonably avoidable and not outweighed by countervailing benefits). General
      basis: no federal statute names cookie attributes"
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap2-subchapI-sec45.htm
    checked_at: 2026-07-22
    jurisdiction: US
severity: medium
rule_confidence: 0.5
detector:
  engine: builtin-regex
  join_bracketed_constructs: true
  shared_vocabulary:
    - cookie_writers
  match:
    - Set-Cookie["']?\s*[,:]\s*[\[\s]*["'`](?![^"'`]*(?<![\w-])[Ss][Ee][Cc][Uu][Rr][Ee](?![\w-]))[^"'`;\s]+=

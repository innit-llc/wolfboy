context_questions:
  - WHOSE AUTHORITY IS THIS, AND WHOSE DATA COMES BACK? These are two different people in this
    construct and the whole finding turns on the gap between them. Name the principal who granted
    the access - a tenant administrator, an account owner, nobody at all because the product uses
    its own key - and then name the people whose records the call returns. Where they are the same
    person this is an ordinary self-service integration and not this construct; where they differ,
    everything below applies to the second group.
  - WHICH OF THE THREE SHAPES IS THIS? (a) Application-level permissions or a service account with
    domain-wide delegation, where no user is in the authorisation loop at all. (b) One person's own
    token walking their relationship graph, where the other people on that graph never consented to
    anything. (c) A batch refresh of platform profiles on the product's own API key, where there is
    no delegating principal and the people are stored rows rather than users. Art. 14 governs all
    three in the same way, subject in each to Art. 14(5); who could possibly have consented differs,
    and so does what the operator must be told.
  - HOW MANY PEOPLE, AND CAN ANYBODY SAY WHO THEY ARE? The subject set is fixed by the platform at
    run time - a directory listing, a friends list, a group membership - so it is not enumerable
    from the source and may not be enumerable at all. Ask the operator for the actual scale in their
    deployment and for whether any list of affected people can be produced, because an Art. 14
    notice that cannot be addressed to anybody is a different problem from one that has not been
    drafted.
  - WHAT CATEGORIES ACTUALLY ARRIVE? Read the permission list and the endpoints rather than the
    integration's name. The difference between reading a directory listing and reading mailbox
    contents is the difference between a name and a work address on one hand, and message bodies,
    attachments, calendar entries, contact folders and chat history on the other. Where a write
    permission is present, note that the product can also MODIFY the records of people who never
    dealt with it.
  - "HOW IS ART. 14 SATISFIED, OR WHY IS IT DISAPPLIED? The information is owed within one month of
    obtaining the data, or at the first communication with the person, or at the first disclosure to
    another recipient, whichever comes first. Before asking how it is met, ask whether Art. 14(5)
    removes it: point (a) disapplies it where the person already has the information, which is what
    an operator relying on the consenting organisation to have told its own staff is in substance
    claiming, and it may well be sound for employees of that organisation. Point (b) disapplies it
    where providing the information is impossible or a disproportionate effort - but that route is
    conditional, and where it is taken the controller must still take appropriate measures,
    including making the information publicly available. Neither exemption reaches somebody outside
    the consenting organisation automatically - a friend on a relationship graph, an external
    correspondent in an imported mailbox, a person whose public profile was fetched: 14(5)(a) will
    not, and 14(5)(b) is available only on its appropriate-measures condition, which includes making
    the information publicly available. Record which group each affected person falls into and,
    where an exemption is claimed, which one and on what basis."
  - "IS THIS A FETCH OR A DECLARATION? Several shapes reach this rule that fetch nothing: a
    permission name in a documentation table, a directory property in a mapping or a test double, a
    confidential-client library named in an import. Those establish that the product is BUILT to
    read a directory on somebody else's authority, which is worth recording, and they are not
    evidence that a record was read. Say which the matched line is before writing a record row."
  - WHERE DOES THE IMPORTED DATA COME TO REST, AND FOR HOW LONG? Data obtained this way is typically
    copied into the product's own store - a backup archive, an index, a ranking table - and outlives
    the session that fetched it. Name the store and its retention rule, and check whether a deletion
    request from one of these people could be executed at all, given that they have no account here
    to make it from.
evidence_template: "{file}:{line} matched a construct through which this product obtains personal
  data about MANY PEOPLE from a third-party platform, on the authority of a principal who is not
  those people. THAT IS THE WHOLE OF WHAT IS ESTABLISHED. Ten shapes reach this rule and they
  differ. (i) An application-permission scope name - the strongest, because an application
  permission is by definition not scoped to the signed-in person. (ii) The app-only authentication
  flow, in which no user is in the loop at all. (iii) A service-account impersonation call, the most
  direct line here: it says act as this person, and that person did nothing. (iv) A directory being
  enumerated, which is the subject set being produced rather than named. (v) A relationship
  retrieval carrying one account holder's credential, where what returns is about other people on
  their graph. (vi) A named platform endpoint that returns records about many people. (vii)
  Directory user-object property names: THE LOOSEST SHAPE HERE, reaching a mapping table, a
  documentation example or a test double as readily as a call, and therefore evidence that the
  product handles directory objects rather than evidence that anything was fetched. (viii) A
  personal-address-book read: one account holder's own token paging through their contacts graph,
  where the people returned are their correspondents and not them. THE RESOURCE NAME ALONE IS NEVER
  THIS SHAPE - a bare self resource is the ordinary self-service integration this rule excludes, and
  what makes the call this construct is the connections collection on the end of it. (ix) A mailbox
  opened under one stored sign-in credential, or the folders of such a mailbox being enumerated. The
  correspondents whose addresses and names arrive in each message never dealt with this product. AN
  IMPORT OR A CONSTRUCTOR IS CAPABILITY EVIDENCE HERE, in the same way shape (vii) is: it says the
  product speaks a mail protocol, not that a message was read. THE CREDENTIAL CUSTODY ITSELF IS A
  DIFFERENT QUESTION AND A DIFFERENT RULE - `delegated-access-002` reports the holding of somebody
  else's sign-in password, and this rule reports the population that password reaches. (x) A
  customer's employee directory arriving through a directory-sync broker, or a SCIM surface. One
  administrator authorises the connection and every employee in the synchronised directory is
  somebody else. THE MATCHED LINE DOES NOT SAY WHICH SIDE OF THE SYNC THIS PRODUCT IS ON: the same
  SCIM path is written by a product that receives a directory and by one that writes into somebody
  else's, and `identity-issuance-002` is the rule for the second. WHAT THIS DETECTOR DOES NOT
  ESTABLISH: who granted the authority and whose data returns, which are two different people and
  the point of the finding (context question 1); how many people are affected or whether they can be
  identified at all, since the platform fixes the set at run time (question 3); which categories
  actually arrive (question 4); whether anybody has been informed (question 5); or, for shapes (i),
  (ii), (vii), and for the import, constructor and SCIM-path forms of (ix) and (x), that any record
  was fetched on this path (question 6). THE ARTICLE 14 QUESTION IS THE ONE TO CARRY FORWARD: the
  people whose data this construct obtains did not provide it and, in the ordinary case, have no
  relationship with this product at all."
remediation_template: >
  Name the two parties first (context question 1): the principal who granted the access, and the

  people whose records the call returns. Where they are the same person, this is an ordinary

  self-service integration and the finding closes.

  Read the permission list and the endpoints and write down the categories that actually arrive.

  A directory listing and a mailbox body are very different rows in a record of processing

  activities, and a write permission means the product can alter records belonging to people who

  never dealt with it.

  Record the categories of data subjects by the rule that produces them - "every account in the

  tenant directory", "every person on the account holder's friends list" - and state plainly that

  the membership is fixed by the platform at run time and is not enumerable from the product.

  Decide how the Art. 14 information is provided, and to which group - or, where it is not provided,

  which limb of Art. 14(5) is being relied on and why. Decide when, too, because Art. 14(3) sets the

  time from the fetch: within a reasonable period and at the latest within one month, and earlier

  where the path does either of two things first - at the latest at the first message to the person,

  where the data are used to contact them, and at the latest at the first disclosure, where the data

  are disclosed to another recipient. A product that mails these people or forwards their records in
  the

  first week has to have provided the information by then, not by the end of the month. Where the
  affected people are staff of the

  consenting organisation, the ordinary route is that organisation's own notice, and the operator

  should confirm it covers this processing by name; where that notice really does reach them,

  Art. 14(5)(a) is the provision that describes the position and it should be recorded as the reason

  rather than left as an assumption. Where they are not staff of that organisation - an external

  correspondent in an imported mailbox, a friend on a relationship graph, a person whose public

  profile was refreshed - that route does not reach them and something else has to. Art. 14(5)(b)'s

  disproportionate-effort limb is not a way of closing the question either: it carries its own

  condition, that appropriate measures are still taken, including making the information publicly

  available.

  Check whether the permissions requested are the least that would do. An application permission

  granted at tenant scope reads every mailbox in the organisation; several platforms offer a

  narrowing to named mailboxes or groups, and where the product only needs some, the grant should

  say so.

  Name the store the imported data comes to rest in and its retention rule, and work out how a

  deletion request from one of these people would be executed, given they have no account here.

  Where the matched line is a documentation table, a mapping or an import, record the capability and

  close the finding there.
data_categories:
  - user.account
  - user.unique_id
  - user.name
  - user.contact.email
  - user.contact.phone_number
  - user.content
  - user.behavior
fingerprint_spec: directory

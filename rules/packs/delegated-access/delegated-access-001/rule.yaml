    - (?:^|[^A-Za-z0-9_])(?:[Gg]et|[Ff]etch|[Ll]ist|[Ss]ync|[Ii]mport|[Ll]oad|[Rr]etrieve)(?:All)?(?:Friends|Followers|Following|Watchlist|Watchlists|Contacts|Connections|Subscribers|Buddies|Roster)\w*\s*\([^\n]{0,120}(?:[Tt]oken|[Cc]redential|[Aa]uthorization|[Aa]piKey|api_key)
    - (?:www\.)?googleapis\.com/youtube/v[0-9]+/channels|youtube\.googleapis\.com/youtube/v[0-9]+/channels|graph\.facebook\.com/[^\s"'`]{0,60}/(?:friends|accounts|followers|members)|api\.twitter\.com/[0-9.]+/users|graph\.microsoft\.com/(?:v1\.0|beta)/(?:users|groups|sites)|admin\.googleapis\.com/admin/directory/v[0-9]+/users
    - (?:^|[^A-Za-z0-9_])(?:userPrincipalName|accountEnabled|usageLocation|onPremisesImmutableId|onPremisesSyncEnabled|onPremisesSamAccountName|proxyAddresses)\b
    - (?:^|[^A-Za-z0-9_])people\.googleapis\.com|(?:^|[^A-Za-z0-9_])(?:listPeopleConnections|list_people_connections|people_connections|otherContacts|other_contacts|PeopleV1|personFields|person_fields)\w*|(?:^|[^A-Za-z0-9_])[Pp]eople\s*(?:\(\s*\))?\s*\.\s*[Cc]onnections\s*(?:\(\s*\))?\s*\.\s*(?:[Ll]ist|[Gg]et)\b|(?:^|[^A-Za-z0-9_])people/me/connections|(?:^|[^A-Za-z0-9_])Google[^A-Za-z0-9]{1,2}(?:Service|Apis)[^A-Za-z0-9]{1,2}People\w*|(?:^|[^A-Za-z0-9_])PeopleService\s*\([^\n]{0,100}(?:[Cc]lient|[Cc]redential|[Tt]oken|[Aa]ccount)

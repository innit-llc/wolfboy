id: delegated-access-001
pack: delegated-access
short_name: Bulk data about many people fetched on one person's account
problem_line:
  text: Data about many people fetched in bulk from a platform
fix_line: Record whose data arrives; inform them within a month (sooner if contacted or shared) or
  record the Art. 14(5) ground.
title: Bulk personal data about many people fetched from a platform on a principal who is not the subject
jurisdiction:
  - EU
  - US
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 14(1) - 'Where personal data have not been obtained
      from the data subject, the controller shall provide the data subject with the following
      information', including 'the purposes of the processing for which the personal data are
      intended as well as the legal basis for the processing', 'the categories of personal data
      concerned' and 'the recipients or categories of recipients of the personal data, if any'. Art.
      14(2)(f) adds 'from which source the personal data originate'. This is the central provision
      for this construct: the people whose mailboxes, contacts, files or lists arrive here did not
      hand them over and in the ordinary case do not know the product exists"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 14(3)(a) - the information must be provided 'within a
      reasonable period after obtaining the personal data, but at the latest within one month,
      having regard to the specific circumstances in which the personal data are processed'. Art.
      14(3)(b) and (c) bring the deadline forward, to the first communication with the data subject
      and to the first disclosure to another recipient respectively. The deadline runs from the
      fetch, which is what makes it answerable at the point this rule fires
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 14(5) - 'Paragraphs 1 to 4 shall not apply where and
      insofar as' one of four cases holds. Two of them bear directly on this construct. Point (a):
      'the data subject already has the information' - which is the route an operator relying on the
      consenting organisation to have told its own staff is taking, whether or not they say so.
      Point (b): 'the provision of such information proves impossible or would involve a
      disproportionate effort', and it is conditional rather than free - where it is relied on, 'In
      such cases the controller shall take appropriate measures' to protect the person, the same
      sentence naming one of them as 'including making the information publicly available'.
      Reference only: this entry narrows the duty rather than establishing one, and no detector can
      tell whether a case applies"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(1)(c) - the record of processing activities shall
      contain 'a description of the categories of data subjects and of the categories of personal
      data'. The categories of data subjects are exactly what this construct leaves undetermined in
      the code: the platform's directory or relationship graph decides who they are at run time"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(a) - personal data shall be 'processed lawfully,
      fairly and in a transparent manner in relation to the data subject'. Transparency towards a
      person who has no relationship with the product is the part that has to be arranged
      deliberately, because nothing in the ordinary product flow will reach them
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(1)(d) - the same record shall contain 'the
      categories of recipients to whom the personal data have been or will be disclosed including
      recipients in third countries or international organisations'. Reference only for this rule:
      here the platform is a SOURCE rather than a recipient, and the entry is cited so that the
      direction is written down rather than assumed"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 6(1) - 'Processing shall be lawful only if and to the
      extent that at least one of the following applies', the first ground being that 'the data
      subject has given consent to the processing of his or her personal data for one or more
      specific purposes'. Reference only, and cited for the mismatch it makes visible: the consent
      given here was given by the administrator or account holder, who is not the data subject of
      most of what arrives, so this ground does not carry the imported records without more"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(7) - 'controller' means 'the natural or legal person,
      public authority, agency or other body which, alone or jointly with others, determines the
      purposes and means of the processing of personal data'. Reference only: which of the product
      operator, the consenting organisation and the platform is controller for the imported records
      is not answerable from code"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "California Consumer Privacy Act, Cal. Civ. Code Sec. 1798.100 (Title 1.81.5, as amended by
      the California Privacy Rights Act). The notice duty is in subdivision (a): a business that
      controls the collection of a consumer's personal information 'shall, at or before the point of
      collection, inform consumers of the following', beginning with 'The categories of personal
      information to be collected and the purposes for which the categories of personal information
      are collected or used and whether that information is sold or shared'. Subdivision (b) is a
      route for discharging that duty rather than a separate one, and it is the route a business in
      this construct's position would take: such a business 'may satisfy its obligation under
      subdivision (a) by providing the required information prominently and conspicuously on the
      homepage of its internet website'. The people whose records arrive through this construct are
      consumers whose information is collected without any direct interaction, and Sec. 1798.110(a)
      lets each of them ask what was collected and from what source"
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.100.
    checked_at: 2026-09-01
    jurisdiction: US
effective_date: 2018-05-25
severity: high
rule_confidence: 0.35

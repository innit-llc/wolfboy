id: delegated-access-002
pack: delegated-access
short_name: The product logs in for the person at another service
problem_line:
  text: Product stands in the person's place at their institution
fix_line: Use the institution's redirect flow if offered; else encrypt held credentials and give
  each held value a deletion rule.
title: "Product stands in the person's place at their institution: credential custody and relayed
  authentication"
jurisdiction:
  - EU
  - US
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 6(1) - 'Processing shall be lawful only if and to the
      extent that at least one of the following applies', the first ground being that 'the data
      subject has given consent to the processing of his or her personal data for one or more
      specific purposes' and the second that 'processing is necessary for the performance of a
      contract to which the data subject is party or in order to take steps at the request of the
      data subject prior to entering into a contract'. Which of the two carries the credential
      custody itself, as distinct from the account data it is used to fetch, is the question this
      construct raises
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be 'adequate, relevant and
      limited to what is necessary in relation to the purposes for which they are processed'. A
      sign-in name, a password, the answers to security questions and the address a request came
      from are held here in order to reach an account, and each has to be justified against what the
      product actually needs to do
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 32(1) - the controller and the processor 'shall
      implement appropriate technical and organisational measures to ensure a level of security
      appropriate to the risk, including inter alia as appropriate', and point (a) of that paragraph
      names 'the pseudonymisation and encryption of personal data'. The risk here is set by what is
      held rather than by the volume: a credential in this product's custody opens the person's
      account at a third party"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: Directive (EU) 2015/2366 (PSD2), Art. 67(2) - the account information service provider shall
      'provide services only where based on the payment service user's explicit consent'; shall
      'ensure that the personalised security credentials of the payment service user are not, with
      the exception of the user and the issuer of the personalised security credentials, accessible
      to other parties and that when they are transmitted by the account information service
      provider, this is done through safe and efficient channels'; shall 'access only the
      information from designated payment accounts and associated payment transactions'; and shall
      'not use, access or store any data for purposes other than for performing the account
      information service explicitly requested by the payment service user, in accordance with data
      protection rules'. This is the regime that explains the ceremony, and point (b) is the
      provision the credential-custody shape sits directly against
    url: https://publications.europa.eu/resource/celex/32015L2366
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "Directive (EU) 2015/2366 (PSD2), Art. 94(2) - 'Payment service providers shall only access,
      process and retain personal data necessary for the provision of their payment services, with
      the explicit consent of the payment service user.' Reference only for this detector: it
      establishes the standard the operator is held to and not a fact this rule can read from a line
      of code"
    url: https://publications.europa.eu/resource/celex/32015L2366
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Directive (EU) 2015/2366 (PSD2), Art. 97 - Member States shall ensure that a payment service
      provider applies strong customer authentication where the payer 'accesses its payment account
      online', 'initiates an electronic payment transaction' or 'carries out any action through a
      remote channel which may imply a risk of payment fraud or other abuses', and that providers
      'have in place adequate security measures to protect the confidentiality and integrity of
      payment service users' personalised security credentials'. Art. 97(4) adds that those
      paragraphs apply 'when the information is requested through an account information service
      provider'. Reference only: this is why the ceremony the code relays exists at all"
    url: https://publications.europa.eu/resource/celex/32015L2366
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: Directive (EU) 2015/2366 (PSD2), Art. 66(3)(b) - a payment initiation service provider shall
      'ensure that the personalised security credentials of the payment service user are not, with
      the exception of the user and the issuer of the personalised security credentials, accessible
      to other parties and that they are transmitted by the payment initiation service provider
      through safe and efficient channels'. Reference only, and cited beside Art. 67(2)(b) because a
      product that both reads accounts and initiates payments is under both
    url: https://publications.europa.eu/resource/celex/32015L2366
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Delegated Regulation (EU) 2018/389 (the regulatory technical standards under
      Directive (EU) 2015/2366), Art. 22 - 'Payment service providers shall ensure the
      confidentiality and integrity of the personalised security credentials of the payment service
      user, including authentication codes, during all phases of the authentication.' Art. 22(2)
      requires that 'personalised security credentials are masked when displayed and are not
      readable in their full extent when input by the payment service user during the
      authentication', that 'personalised security credentials in data format, as well as
      cryptographic materials related to the encryption of the personalised security credentials are
      not stored in plain text', and that 'secret cryptographic material is protected from
      unauthorised disclosure'. Art. 22(4) adds that providers shall ensure that 'the processing and
      routing of personalised security credentials and of the authentication codes generated in
      accordance with Chapter II take place in secure environments in accordance with strong and
      widely recognised industry standards'. This is the provision the relayed ceremony sits
      directly against: the product renders the institution's prompt in its own interface, holds
      what the person types into it, and routes it onward"
    url: https://publications.europa.eu/resource/celex/32018R0389
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "Commission Delegated Regulation (EU) 2018/389, Art. 30(2)(c) - the interface shall ensure
      that 'the integrity and confidentiality of the personalised security credentials and of
      authentication codes transmitted by or through the payment initiation service provider or the
      account information service provider shall be ensured'. Art. 30(2)(b) is the neighbouring
      requirement that 'communication sessions between the account servicing payment service
      provider, the account information service provider, the payment initiation service provider
      and any payment service user concerned shall be established and maintained throughout the
      authentication'. Reference only: Art. 30's duties are addressed to the institution that
      operates the access interface rather than to the product this rule scans, and it is cited
      because it names the relay in terms and because the session it describes is what a stored
      session identifier belongs to"
    url: https://publications.europa.eu/resource/celex/32018R0389
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Delegated Regulation (EU) 2018/389, Arts. 31 and 33(4)-(5) - Art. 31 is the fork
      itself: institutions shall establish the access interface 'by means of a dedicated interface
      or by allowing the use by the payment service providers referred to in Article 30(1) of the
      interfaces used for authentication and communication with the account servicing payment
      service provider'. Art. 33(4) is the contingency route in which third-party providers 'shall
      be allowed to make use of the interfaces made available to the payment service users for the
      authentication and communication with their account servicing payment service provider', and
      Art. 33(5) attaches the conditions on which that is permitted, including that they 'take the
      necessary measures to ensure that they do not access, store or process data for purposes other
      than for the provision of the service as requested by the payment service user' and 'log the
      data that are accessed through the interface operated by the account servicing payment service
      provider for its payment service users'. Reference only: this is what separates a lawful
      fallback from screen-scraping, and which of the two a given deployment is doing is an operator
      fact"
    url: https://publications.europa.eu/resource/celex/32018R0389
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Delegated Regulation (EU) 2018/389, Art. 34 - 'For the purpose of identification,
      as referred to in Article 30(1)(a), payment service providers shall rely on qualified
      certificates for electronic seals as referred to in Article 3(30) of Regulation (EU) No
      910/2014 or for website authentication as referred to in Article 3(39) of that Regulation.'
      Art. 34(3) requires those certificates to carry additional attributes including 'the role of
      the payment service provider'. Reference only for this detector: Art. 34 is the provision
      behind the certificate and role tokens this rule matches, and a matched token is evidence that
      the product handles such a certificate rather than evidence that it holds a valid one"
    url: https://publications.europa.eu/resource/celex/32018R0389
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Regulation (EU) No 910/2014 (eIDAS), Art. 3(30) and Art. 3(39) - a 'qualified certificate for
      electronic seal' means 'a certificate for an electronic seal, that is issued by a qualified
      trust service provider and meets the requirements laid down in Annex III', and a 'qualified
      certificate for website authentication' means 'a certificate for website authentication, which
      is issued by a qualified trust service provider and meets the requirements laid down in Annex
      IV'. Reference only, and DEFINITIONAL ONLY: these two definitions name the two certificate
      kinds this detector matches by name, and they are what Art. 34 of Commission Delegated
      Regulation (EU) 2018/389 cross-refers to. This Regulation is NOT cited as the source of any
      custody duty - its operative obligations run to trust service providers, the party that issues
      such a certificate, and not to a product that holds one"
    url: https://publications.europa.eu/resource/celex/32014R0910
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: Gramm-Leach-Bliley Act, 15 U.S.C. Sec. 6801(b) - each agency shall establish standards for the
      financial institutions subject to its jurisdiction "to insure the security and confidentiality
      of customer records and information", "to protect against any anticipated threats or hazards
      to the security or integrity of such records" and "to protect against unauthorized access to
      or use of such records or information which could result in substantial harm or inconvenience
      to any customer". Whether the operator is a financial institution for this purpose is a fact
      about the product and not about the code, which is what context question 4 asks
    url: https://www.law.cornell.edu/uscode/text/15/6801
    checked_at: 2026-09-01
    jurisdiction: US
effective_date: 2018-05-25

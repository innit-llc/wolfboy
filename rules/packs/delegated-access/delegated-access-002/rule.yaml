context_questions:
  - "WHOSE CREDENTIAL IS THE PRODUCT HOLDING? This is the fork the whole rule turns on. A token the
    institution minted FOR THIS PRODUCT, revocable by the person from the institution's own screen,
    is the ordinary scoped-import shape and is not this construct. The person's OWN sign-in name and
    password - the ones they would type at the institution's own site - are. Read the field the
    value comes from and say which it is; where it is the first, the finding closes there. WHERE THE
    MATCHED LINE IS AN HTTP BASIC CREDENTIAL BEING ASSEMBLED, OR A REQUEST BUILT FOR ANOTHER
    SERVICE'S OWN SIGN-IN ENDPOINT, THE VALUE'S ORIGIN IS USUALLY NOT ON THAT LINE: follow it back
    to the setting, the preference store or the file it was read from, and answer from there. A
    THIRD ANSWER IS POSSIBLE AND IT IS NOT THE SECOND - an integration account the operator created
    at the other service and configured once, which nobody signs in with personally. Say so where
    that is what you find, because it changes who the account holder is and what question 3 has to
    trace."
  - DOES THE PRODUCT PARTICIPATE IN THE INSTITUTION'S AUTHENTICATION, OR ONLY REDIRECT TO IT?
    Redirecting the person to the institution's own page and receiving them back is participation by
    neither party. Rendering the institution's security questions, its one-time code prompt, its
    optical or photo transaction number or its captcha inside this product's own interface,
    collecting the answer and relaying it, is the product completing an authentication the
    institution believes the person is completing. Say which, and where the relayed values are held
    between the prompt and the reply.
  - "WHERE DOES EACH HELD VALUE LIVE, FOR HOW LONG, AND ENCRYPTED WITH WHAT? Trace every value the
    previous two questions surfaced: the credential, the answers, the session identifier, the
    certificate and its private key, and the address the request came from. For each, name the
    column or store, the encryption if any, and the deletion rule. A value with no deletion rule is
    the ordinary finding here, and it is worth checking whether the project has already written
    itself a note about one."
  - "IS THE OPERATOR ACTING IN A REGULATED ROLE, AND UNDER WHOSE AUTHORISATION? Reading a person's
    account at their institution on their behalf is a licensed activity in several jurisdictions,
    and the code cannot say whether the operator holds the licence, relies on an intermediary that
    does, or neither. ASK THE OPERATOR: who is the authorised party, in which jurisdiction, and what
    does the arrangement with the intermediary say about who is controller for the account data? The
    certificate custody in the code is evidence about how the role is exercised and not about
    whether it is held."
  - WHAT IS THE CONSENT'S SCOPE AND EXPIRY, AS THE INSTITUTION SEES IT? The regulated regimes attach
    an explicit consent to the access with a validity window and a designated set of accounts, and
    the institution enforces both. Read what the product stores about that consent - which accounts
    it names, when it expires, what happens on expiry - and check it against what the product tells
    the person. A consent the person believes is for one account and which in fact covers all of
    them is a mismatch this construct produces easily.
  - "WHAT IS FORWARDED ABOUT THE PERSON THAT IS NOT ACCOUNT DATA? Several of these regimes require
    or permit technical context to travel with the request: the address the person's own request
    came from, the identifier the institution knows them by, their user-agent. That is personal data
    about the person's device and location, held and forwarded for a protocol reason rather than a
    product one, and it needs its own record entry and its own retention rule."
  - "IS THIS CUSTODY OR ONLY CAPABILITY? Some shapes reach this rule without anything being held: a
    protocol name in a dependency declaration, a menu label, a version string, a constant in a
    header file. Those establish that the product speaks a retail-banking protocol, which is worth
    recording, and they are not evidence that a credential is in its custody. Say which the matched
    line is."
evidence_template: "{file}:{line} matched a construct through which this product STANDS IN A
  PERSON'S PLACE AT AN INSTITUTION WHERE THEY HOLD AN ACCOUNT - by holding the person's own sign-in
  credentials, by relaying the institution's live authentication ceremony, or by exercising a
  regulated third-party-access role. THAT IS THE WHOLE OF WHAT IS ESTABLISHED. Seven shapes reach
  this rule. (i) An institution credential field by name, where the distinguishing word is the
  institution and not the credential: a password belonging to somebody else's system that this
  product is holding. (ii) The authentication ceremony itself - a transaction-number method, a
  security-question or one-time-code challenge, a captcha relay. (iii) The regulated-role apparatus:
  protocol headers carrying the person's own address and identifier, the licensed-role names, and
  the certificate kinds a licensed party holds. (iv) A retail-banking protocol name, WHICH ALSO
  REACHES A DEPENDENCY DECLARATION, A MENU LABEL AND A VERSION STRING and is then capability
  evidence rather than custody evidence. (v) A callback shape through which a protocol library asks
  this product's own interface for a password or a transaction number. (vi) An access provider named
  beside a credential, consent, session or certificate construct - never a bare provider name,
  because the same providers serve the plain scoped-import class this rule is the complement of.
  (vii) THE SAME CUSTODY OUTSIDE THE FINANCIAL SECTOR: a sign-in credential for somebody else's
  service named after the service rather than after the credential - a mailbox, a calendar, a file
  store, a telephony account - or a session being opened with such a held value. This is shape (i)
  in a non-financial spelling. TWO FURTHER SPELLINGS OF SHAPE (vii) WERE ADDED ON 2026-09-09 and
  reach services that are neither a bank nor one of the eleven protocols named above: an HTTP Basic
  credential being ASSEMBLED - a scheme whose value is, by its own definition, a sign-in name and a
  password - and the sign-in ceremony itself, a request built for another service's own
  authentication endpoint with the account holder's identifier standing in the path. Neither
  establishes that the value assembled is stored anywhere, and neither reads the store: where each
  held value lives and for how long is question 3. Questions 5 and 6 have no object on a plain
  protocol account - there is no institution-enforced consent record and no protocol header carrying
  the person's own address - and layer 2 answers both 'not applicable'. QUESTION 4 STAYS WITH THE
  OPERATOR: whether they act in a regulated role is a fact about them and not about this line, and a
  protocol word cannot decide it. The rest of the questions apply in full. IT REACHES AN OPERATOR'S
  OWN SERVICE ACCOUNT AS READILY AS A PERSON'S, because the two are spelled identically, which is
  exactly what question 1 is for. WHOSE CREDENTIAL THIS IS - the account holder's own sign-in name
  and password, or an integration account the operator configured for the product to use - IS A
  DEPLOYMENT FACT THIS FINDING DOES NOT ANSWER. The two are written identically in code and no line
  separates them. The answer settles which ground under Art. 6(1) the custody itself would have to
  rest on, and THIS DETECTOR DOES NOT CHOOSE BETWEEN THEM: it leaves that question standing exactly
  where this rule's own Art. 6(1) entry leaves it. Read the setting or the store the value is
  entered in, say which of the two it is, and let the rest follow from that answer (question 1).
  WHAT THIS DETECTOR DOES NOT ESTABLISH: whether the credential is the person's own or a token the
  institution minted for the product, which is the fork the whole rule turns on (context question
  1); whether the product participates in the authentication or only redirects to it (question 2);
  where each held value lives, for how long, and under what encryption (question 3); whether the
  operator holds a regulated authorisation, which is a fact about the operator and not about the
  code (question 4); or, for shape (iv), that anything is held at all (question 7). THIS RULE
  DELIBERATELY KEEPS TEST AND FIXTURE PATHS: a real credential for a real person's account carries
  the same exposure inside a fixture as anywhere else."
remediation_template: >
  Settle the fork first (context question 1). A token the institution minted for this product,

  revocable by the person at the institution, is the ordinary scoped-import shape and this rule's

  concerns do not apply to it. Where the product holds the person's own sign-in name and password,

  everything below does.

  Where the person's own credentials are held, ask whether they need to be. Several institutions and

  intermediaries offer a redirected flow in which the person authenticates at the institution and

  the product never sees the credential; where that flow exists for the institutions the product

  supports, moving to it removes the exposure rather than protecting it.

  Trace every value held on the person's behalf - credential, security answers, one-time code,

  session identifier, certificate and private key, and the address the request came from - and give

  each a store, an encryption decision and a deletion rule. Values kept only to complete a ceremony

  should not survive it.

  For the sign-in credential, the security answers and the one-time codes, the encryption decision

  has one answer. Where the payment regime governs this handling, Art. 22(2) of Delegated Regulation

  (EU) 2018/389 asks that credentials in data format, and the key material that encrypts them, are

  not stored in plain text, that the secret key material is protected from unauthorised disclosure,

  and that credentials are masked when displayed; and PSD2 Art. 67(2)(b) and 66(3)(b) ask that they

  are accessible to nobody but the person and the issuer and travel only over safe channels. So:

  encrypt them at rest with keys held apart from the data, keep them out of logs, error reports,

  analytics events and support tooling, mask them on screen, and send them only over an encrypted

  channel. Outside that regime, GDPR Art. 32(1) asks for security appropriate to the risk and names

  encryption among the measures, and a value that opens the person's account somewhere else is the

  high end of that risk, so handle it the same way unless the record says why not.

  Where the code carries a note to the effect that a retention policy is still to be implemented for

  one of these values, treat that note as the finding rather than as documentation.

  Ask the operator who holds the regulated authorisation, in which jurisdiction, and what the

  arrangement with any intermediary says about who is controller for the account data. Record the

  answer; it is not derivable from the code.

  Read what the product stores about the consent the institution enforces - which accounts, what

  expiry, what happens when it lapses - and check it against what the person was told they were

  agreeing to.

  Give the technical context forwarded for protocol reasons - the person's own address, the

  identifier the institution knows them by, the user-agent - its own record entry and its own

  retention rule; it is personal data held for a reason the person never asked for.

  Where the matched line is a dependency declaration, a menu label or a protocol constant, record
  the

  capability and close the finding there.
data_categories:
  - user.authorization.credentials
  - user.account
  - user.unique_id
  - user.device.ip_address
  - user.financial
  - user.financial.bank_account
fingerprint_spec: project
reading_class:
  class: mixed
  limbs:
    - question: 1
      class: existence
    - question: 3
      class: enumeration
      item: held value
      item_source: reading
    - question: 7
      class: per-location

id: device-telemetry-001
pack: device-telemetry
short_name: Continuous tracking data about people
problem_line:
  text: People tracked continuously through device or stream data
fix_line: Record who is tracked and how they are told, and keep the report interval, retention and
  attributes to what is needed.
title: Continuous telemetry about tracked people, ingested over a device or change-stream protocol
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 14(1) - 'Where personal data have not been obtained
      from the data subject, the controller shall provide the data subject with the following
      information: (a) the identity and the contact details of the controller and, where applicable,
      of the controller's representative; (b) the contact details of the data protection officer,
      where applicable; (c) the purposes of the processing for which the personal data are intended
      as well as the legal basis for the processing'. This is the operative provision for the
      construct, and the reason is structural: in an ingestion product the person whose position is
      recorded is very often not the person who opened the account, so the duty that runs is the one
      owed to a subject the controller never spoke to"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be 'adequate, relevant
      and limited to what is necessary in relation to the purposes for which they are processed'. A
      continuous stream is the hardest case for this principle, because the volume is set by a
      reporting interval rather than by a purpose: a position every ten seconds and a position every
      ten minutes serve the same stated purpose and differ by two orders of magnitude in what they
      reveal. The interval, the retention and the set of attributes decoded are the three places
      minimisation is decided, and they are ordinarily configuration rather than code"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 6(1)(f) - processing is lawful to the extent that
      'processing is necessary for the purposes of the legitimate interests pursued by the
      controller or by a third party, except where such interests are overridden by the interests or
      fundamental rights and freedoms of the data subject which require protection of personal data,
      in particular where the data subject is a child.' Carried because this is the basis an
      ingestion deployment is ordinarily defended on, and because the closing words matter here more
      than almost anywhere else in this pack: one recorded shape of this construct is a wearable
      tracker on a child"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(1) - 'Processing of personal data revealing racial or
      ethnic origin, political opinions, religious or philosophical beliefs, or trade union
      membership, and the processing of genetic data, biometric data for the purpose of uniquely
      identifying a natural person, data concerning health or data concerning a natural person's sex
      life or sexual orientation shall be prohibited.' Reference only, and conditional: it applies
      where the ingested attributes include health measurements, which some wearable and
      personal-tracker protocols carry alongside position. Whether this deployment decodes such an
      attribute is context question 4 and is read out of the decoded attribute set, not asserted by
      this detector"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 88, quoted across both operative paragraphs because the
      first enables and the second is the one that binds. Art. 88(1): 'Member States may, by law or
      by collective agreements, provide for more specific rules to ensure the protection of the
      rights and freedoms in respect of the processing of employees' personal data in the employment
      context, in particular for the purposes of the recruitment, the performance of the contract of
      employment, including discharge of obligations laid down by law or by collective agreements,
      management, planning and organisation of work, equality and diversity in the workplace, health
      and safety at work, protection of employer's or customer's property and for the purposes of
      the exercise and enjoyment, on an individual or collective basis, of rights and benefits
      related to employment, and for the purpose of the termination of the employment relationship.'
      Art. 88(2), which names this construct in terms: 'Those rules shall include suitable and
      specific measures to safeguard the data subject's human dignity, legitimate interests and
      fundamental rights, with particular regard to the transparency of processing, the transfer of
      personal data within a group of undertakings, or a group of enterprises engaged in a joint
      economic activity and monitoring systems at the work place.' HOW TO READ THE PAIR: paragraph 1
      states no duty of its own - it authorises Member States to legislate, and names 'protection of
      employer's or customer's property' as one of the purposes such rules may serve, which is the
      purpose an employer defending fleet or network monitoring would ordinarily rely on. Paragraph
      2 is the constraint on any such national rule, and 'monitoring systems at the work place' is
      the exact construct this detector finds. WHAT REMAINS OPEN, and it is not a doubt about these
      words: which national law binds a given employer, and what that law requires. That is a fact
      about the deployment and about the Member States it reaches; it is asked as a context question
      and is outside this repository's quote-verification fetch path"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 4(1) - 'Where data cannot be directly accessed by
      the user from the connected product or related service, data holders shall make readily
      available data, as well as the relevant metadata necessary to interpret and use those data,
      accessible to the user without undue delay, of the same quality as is available to the data
      holder, easily, securely, free of charge, in a comprehensive, structured, commonly used and
      machine-readable format and, where relevant and technically feasible, continuously and in
      real-time.' Art. 5(1) extends the same obligation to making the data available to a third
      party the user nominates: 'Upon request by a user, or by a party acting on behalf of a user,
      the data holder shall make available readily available data, as well as the relevant metadata
      necessary to interpret and use those data, to a third party without undue delay'. DATE,
      verified against Art. 50 itself rather than against a secondary source: 'It shall apply from
      12 September 2025.' Art. 50 then defers exactly three things, and the two provisions cited
      here are among none of them: 'The obligation resulting from Article 3(1) shall apply to
      connected products and the services related to them placed on the market after 12 September
      2026.', 'Chapter III shall apply in relation to obligations to make data available under Union
      law or national legislation adopted in accordance with Union law, which enters into force
      after 12 September 2025.', and 'Chapter IV shall apply to contracts concluded after 12
      September 2025.' Arts. 4 and 5 are Chapter II. SO THESE TWO DUTIES HAVE BEEN IN APPLICATION
      SINCE 12 SEPTEMBER 2025 and a finding that reaches them is worded as a present obligation
      rather than as preparation; the only date still ahead is the Art. 3(1) deferral to 12
      September 2026, which is a different provision from either of these and must not be imported
      into a finding on them. WHAT IS NOT ESTABLISHED BY THIS DETECTOR is whether a given deployment
      is a 'data holder' of a 'connected product' within Arts. 2(5) and 2(13) - a fact about the
      product, asked as context questions 1 and 5. Carried as reference because an ingestion server
      is the archetype of a service holding data a connected product generated, and because this
      duty runs to the USER, who in the ordinary deployment of this construct is a different person
      from the data subject"
    url: https://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false

context_questions:
  - WHO ARE THE TRACKED PEOPLE, AND WHAT IS THEIR RELATIONSHIP TO THE ACCOUNT HOLDER? This is the
    first question and it is asked of the person running the scan, never read out of the code. A
    decoder's vocabulary says which protocol it speaks; it says nothing about whether the moving
    thing is a company van, a rented scooter, a shipping pallet, a lone worker or a child wearing a
    watch. Where the tracked people are not the account holder, the information duty owed to them is
    Art. 14's - owed to someone the controller never spoke to - and that is materially harder than
    the one an account-holder-facing product carries. State which population this deployment tracks;
    do not treat the code as settling it.
  - "HOW OFTEN, FOR HOW LONG, AND HOW MANY ATTRIBUTES? Minimisation under Art. 5(1)(c) is decided in
    three places and none of them is usually in the matched line: the reporting interval, the
    retention period for stored positions, and the set of attributes actually decoded and kept.
    Quote all three from configuration or schema. A position every ten seconds and a position every
    ten minutes serve the same stated purpose and are two orders of magnitude apart in what they
    reveal about a person's day."
  - IS ANYTHING PUSHED BACK INTO THE DEVICES, AND WHO CAN READ IT THERE? Where clause 4 or clause 5
    matched, personal data travels from the platform into the device - the numbers it may call, its
    contact list, a message displayed on it. Establish who holds the device and who can read what
    was written to it, because that is a disclosure to a recipient and it is easy to miss while
    reading an ingestion product as if data only flowed inwards.
  - DOES THE DECODED ATTRIBUTE SET INCLUDE A HEALTH MEASUREMENT? Some personal and wearable trackers
    report heart rate, step counts, fall detection or body temperature alongside position. Where
    they do, Art. 9(1) is engaged and the whole processing needs an Art. 9(2) condition, not only an
    Art. 6 basis. Read the decoded attribute names rather than assuming from the product's
    description; this is the single change that most alters what the deployment must have in place.
  - WHERE CLAUSE 6 MATCHED - WHOSE DATABASE IS BEING REPLICATED, AND WHAT IS IN IT? A
    logical-replication stream is a continuous copy of every row change. Establish whether the
    database belongs to the scanned product or to its customer, what the credentials are and where
    they are held, whether the republished stream is filtered at all, and who can subscribe to it. A
    service holding this position over a customer's production database is a processor for every
    person in that database, most of whom have no relationship with it.
evidence_template: "{file}:{line} matched one of six shapes: a device-protocol decoder or encoder
  layer, a purpose-built device identity, a position field with a second position field or a
  tracking noun beside it, a push-back constant that writes a phone number or contact into a device,
  a generic command builder carrying a contact word, or database change-stream replication
  vocabulary. This establishes only that THE CODE HAS A CONSTRUCT for ingesting a continuous
  machine-generated record over a device or replication protocol. It does not establish who the
  tracked people are - that is a fact about the product, asked of the operator, and it is what
  decides whether the Art. 14 information duty runs to people the controller never spoke to. It does
  not establish the reporting interval, the retention period or the decoded attribute set, which is
  where minimisation is actually decided. And where the match is clause 6, it does not establish
  whose database the stream is opened against."
remediation_template: |
  Establish who the tracked people are before anything else, and write it down. Everything else in
  this finding changes depending on the answer: an operator tracking their own devices, an employer
  tracking staff, a parent tracking a child and a platform tracking a customer's customers are four
  different postures with four different sets of duties.
  Where the tracked people are not the account holder, the information duty is Art. 14's. Record how
  those people are informed, and by whom - in many deployments the practical answer is that the
  account holder informs them, which is an arrangement that has to exist rather than be assumed.
  Write down the reporting interval, the retention period and the decoded attribute set as three
  separate numbers. They are where Art. 5(1)(c) is decided and they are ordinarily configuration, so
  they can be changed without changing the product.
  Where a health measurement is among the decoded attributes, treat the processing as needing an
  Art. 9(2) condition and not only an Art. 6 basis, and say which condition is relied on.
  Where personal data is pushed back into devices, record it as a disclosure with a recipient, and
  name who holds the device.
  Where a change-stream replication clause matched, record whose database it is, where the
  credentials live, whether the stream is filtered before republication, and who may subscribe.
data_categories:
  - user.location.precise
  - user.device
  - user.unique_id
  - user.behavior
  - user.contact.phone_number
fingerprint_spec: project
reading_class:
  class: existence
  elements:
    - name: reporting_interval
      question: 2
      text: the reporting interval
    - name: retention_period
      question: 2
      text: the retention period for stored positions
    - name: attribute_set
      question: 2
      text: the set of attributes actually decoded and kept

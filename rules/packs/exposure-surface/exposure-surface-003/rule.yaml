id: exposure-surface-003
pack: exposure-surface
short_name: Access decisions made inside the database
problem_line:
  text: Disclosure decided by policies in the customer's database
fix_line: Record who writes the policies, list every bypass, and clear the assumed role before the
  connection returns to the pool.
title: Disclosure authorisation delegated to, and decided inside, the data owner's own database
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(7) - 'controller' means 'the natural or legal person,
      public authority, agency or other body which, alone or jointly with others, determines the
      purposes and means of the processing of personal data'. Reference only: a definition
      establishes no duty of its own. Cited because this rule's construct is a division of that
      determination in an unusual place - the customer writes the policy that decides each
      disclosure, and the product supplies and executes the mechanism that asks it - and because
      which party the definition lands on is an arrangement fact this detector settles none of"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(8) - 'processor' means 'a natural or legal person,
      public authority, agency or other body which processes personal data on behalf of the
      controller'. Reference only: whether the product is a processor here is a fact about the
      arrangement between it and its customer, not about the code, and this detector settles none of
      it"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: GDPR (Regulation (EU) 2016/679), Art. 28(3)(a) - the contract governing processing by a
      processor shall stipulate in particular that the processor 'processes the personal data only
      on documented instructions from the controller, including with regard to transfers of personal
      data to a third country or an international organisation, unless required to do so by Union or
      Member State law'. Where the product is the processor, the customer's row-level-security
      policies are the closest thing the arrangement has to an instruction that is actually
      executed, and the question this raises is whether they are also DOCUMENTED as instructions
      anywhere
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(2) - 'The controller shall be responsible for, and be
      able to demonstrate compliance with, paragraph 1' ('accountability'). Demonstrating compliance
      requires being able to say who could read what. Where the deciding rule is a policy in a
      database the controller administers and the product executes, the two parties hold different
      halves of that answer
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 32(1)(b) - the controller and the processor 'shall
      implement appropriate technical and organisational measures to ensure a level of security
      appropriate to the risk, including inter alia as appropriate' 'the ability to ensure the
      ongoing confidentiality, integrity, availability and resilience of processing systems and
      services'. The mechanism this rule reads IS such a measure, and its failure modes - a role
      left assumed after a transaction, a flag that bypasses the check entirely - are properties of
      the measure rather than of any policy
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 15(1)(c) - on a request for access the controller shall
      provide 'the recipients or categories of recipient to whom the personal data have been or will
      be disclosed, in particular recipients in third countries or international organisations'.
      Reference only, and cited to mark the practical question rather than to assert a breach:
      answering it requires enumerating the policies, and only the party who administers the
      database can do that"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.45

    - "[Ss][Ee][Tt]_[Cc][Oo][Nn][Ff][Ii][Gg]\\s*\\(\\s*[\"'`](?:[Rr][Ee][Qq][Uu][Ee][Ss][Tt]\\.[A-Z\
      a-z_.]+|[Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee]\\.[A-Za-z_.]+)[\"'`]"

id: exposure-surface-002
pack: exposure-surface
short_name: Endpoint to personal data outside the usual sign-in
problem_line:
  text: Personal data served outside the product's own sign-in
  template: "{data} served outside the product's own sign-in"
fix_line: Make the caller check hold by default, ask the person before a new caller is served, and
  let them withdraw it.
title: "Standing endpoint over the personal-data store whose caller check is not the product's own
  account model: a local OS endpoint, or an auth middleware that self-disables"
jurisdiction:
  - EU
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 32(1)(b) - the controller and the processor 'shall
      implement appropriate technical and organisational measures to ensure a level of security
      appropriate to the risk, including inter alia as appropriate' 'the ability to ensure the
      ongoing confidentiality, integrity, availability and resilience of processing systems and
      services'. A standing endpoint that answers any process in the session is part of the
      processing system whose ongoing confidentiality this subparagraph asks about, and the measure
      that bounds it is whatever identifies the caller
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(f) - personal data shall be 'processed in a manner
      that ensures appropriate security of the personal data, including protection against
      unauthorised or unlawful processing and against accidental loss, destruction or damage, using
      appropriate technical or organisational measures'. The measure here is caller identification,
      and the declaring anchor's own source comment says of its method that it is weak, which is a
      fact about the measure and not a conclusion about the processing
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 25(1) - the controller shall, 'both at the time of the
      determination of the means for processing and at the time of the processing itself',
      'implement appropriate technical and organisational measures, such as pseudonymisation, which
      are designed to implement data-protection principles, such as data minimisation, in an
      effective manner and to integrate the necessary safeguards into the processing in order to
      meet the requirements of this Regulation and protect the rights of data subjects'. Whether a
      local endpoint exists at all, and what it will answer, is a determination of the means for
      processing
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 25(2), third sentence - 'In particular, such measures
      shall ensure that by default personal data are not made accessible without the individual's
      intervention to an indefinite number of natural persons.' Cited because it is the provision
      closest to this construct's shape, and its limits are stated rather than glossed: it speaks of
      natural persons, and what queries this endpoint is a PROCESS. Whether an unbounded set of
      local processes is the same question the sentence asks is not settled by this detector, and
      context question 3 puts it to the adjudicator rather than answering it"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.45

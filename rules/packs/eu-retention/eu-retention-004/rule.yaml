      - hours
      - minutes
      - seconds
      - weeks
      - months
      - years
      - day
      - hour
      - minute
      - second
      - week
      - month
      - year
    moment_words:
      - date
      - datetime
      - timestamp
      - until
      - deadline
      - cutoff

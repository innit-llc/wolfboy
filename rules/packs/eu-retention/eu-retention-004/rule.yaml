id: eu-retention-004
pack: eu-retention
short_name: Retention period written into the code
problem_line:
  text: "Retention in code: notice or reader not found, or mismatched"
fix_line: State the period where people read it, make stated and coded periods agree, and make sure
  something applies it.
title: Retention period stated as a constant, a configuration key or a cleanup argument
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e), the storage-limitation principle, quoted from
      the Official Journal text at CELEX 32016R0679. Art. 5(1) opens 'Personal data shall be:' and
      point (e) reads: 'kept in a form which permits identification of data subjects for no longer
      than is necessary for the purposes for which the personal data are processed'. FOR NO LONGER
      THAN IS NECESSARY - the limit is set by the purpose and never by a number of days, so no
      detector can compute the permitted period and NOTHING THIS RULE FINDS IS A NUMBER THAT IS TOO
      LARGE. What this rule finds is almost always a product stating a bounded period, which is the
      principle being answered rather than breached. What a candidate here is about is that the
      period is STATED IN CODE, what it applies to, and whether it is the period anyone outside the
      repository was told about. Art. 5(2) is the paragraph that makes the location of a stated
      period worth reporting: 'The controller shall be responsible for, and be able to demonstrate
      compliance with, paragraph 1'. A period compiled into a constant is the period that is
      enforced, whether or not it appears anywhere a reviewer, an operator or a data subject would
      look. Applies since 2018-05-25, Art. 99(2): 'It shall apply from 25 May 2018.'"
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-28
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 39, from the same Official Journal text: 'In order
      to ensure that the personal data are not kept longer than necessary, time limits should be
      established by the controller for erasure or for a periodic review.' Both limbs of that
      sentence are things a TIME LIMIT is established FOR, so the choice it offers is between two
      ways of enforcing a limit and never between having one and not having one. A named constant
      carrying a number of days IS a time limit established for erasure, provided something reads
      it. What is left for a reader to check is therefore not whether a limit exists but three other
      things, and the context questions ask them in order: what store the period governs, whether
      anything actually applies it, and whether it is the period the product tells people about. A
      recital does not enact a duty; it colours Art. 5(1)(e), which is what this rule cites as its
      test."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(1), from the same Official Journal text. The record
      of processing activities 'shall contain all of the following information', and point (f) is
      'where possible, the envisaged time limits for erasure of the different categories of data'. A
      constant named for a retention period in days IS an envisaged time limit for erasure, it is
      the one the product enforces, and Art. 30(1)(f) asks for it to be written into the record as
      well as into the source. Two limits on how far that can be taken, and both are in the text.
      The words 'where possible' are in the provision and are not a formality. And Art. 30(5)
      exempts smaller organisations, but only conditionally: 'The obligations referred to in
      paragraphs 1 and 2 shall not apply to an enterprise or an organisation employing fewer than
      250 persons unless the processing it carries out is likely to result in a risk to the rights
      and freedoms of data subjects, the processing is not occasional, or the processing includes
      special categories of data as referred to in Article 9(1) or personal data relating to
      criminal convictions and offences referred to in Article 10.' Those three unless-limbs are
      disjunctive, so the exemption cannot be assumed. Reference only. Whether this controller keeps
      such a record, and what is in it, is not something a scan of source code can see; it is asked
      of the person running the scan."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1), from the same Official Journal text. Personal
      data 'means any information relating to an identified or identifiable natural person', and the
      paragraph continues: 'an identifiable natural person is one who can be identified, directly or
      indirectly, in particular by reference to an identifier such as a name, an identification
      number, location data, an online identifier or to one or more factors specific to the
      physical, physiological, genetic, mental, economic, cultural or social identity of that
      natural person'. Reference only, and carried for a specific reason: this rule matches a NAMED
      QUANTITY and never a determination that whatever the quantity governs is within this
      definition. A constant called `LogFileRetentionDays` governs log files; whether those log
      files hold personal data is a question for the adjudicating agent or for the person running
      the scan, and no pattern in this rule tests it."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Quoted from the same Official Journal text. Article 5 is listed expressly by number, so the
      storage-limitation principle sits in the upper fining band rather than the Art. 83(4) one. The
      Journal prints no-break spaces inside '20 000 000'; they are rendered as ordinary spaces here,
      as in eu-retention-001, eu-retention-002 and eu-retention-003. This entry fixes the exposure
      if a candidate turns out to be a real gap; it says nothing about how likely that is, which is
      rule_confidence."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
sunset: null
superseded_by: null
severity: high
rule_confidence: 0.38

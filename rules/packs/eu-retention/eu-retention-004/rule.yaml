context_questions:
  - "MANDATORY, and the detector did not check it: WHAT DOES THIS PERIOD GOVERN, and does that thing
    hold personal data? The clause was matched as a NAME, and a name says what a quantity means,
    never what it applies to. Work outwards. Find every read of this constant, property or
    configuration key and quote the statement that uses it - the deletion, the sweep, the
    comparison, the index. Then say what store that statement touches and quote its columns or
    fields. Where the ScanProfile or the operator's declared documents answer whether that store
    holds personal data within GDPR Art. 4(1), say which one you used and quote it; where nothing
    answers it, return needs_human rather than deciding it from a name. If the period governs build
    artefacts, transcoding buffers, cache files or somebody else's records, dismiss the candidate
    here and say what it governs instead."
  - 'Is the period actually applied, and what is its value? Three separate questions and they are
    answered separately. (a) IS A VALUE ON THIS LINE? A declaration such as `public int
    LogFileRetentionDays { get; set; }` states the quantity and no number; a plan-catalogue entry
    such as `"data_retention_in_years": 3` states the number and no mechanism. Say which you have.
    (b) WHERE DOES THE VALUE COME FROM if it is not here - a default in another file, an environment
    variable, a function argument every caller overrides, a per-plan catalogue with several
    different numbers? Resolve it and quote the resolved value, or report that you could not and say
    so. (c) DOES ANYTHING READ IT? A stated period nothing applies is a number, not a retention
    practice, and a reader must not report it as one. Search for the name and quote the reader, or
    report that there is none.'
  - "Does this period appear anywhere the product tells anyone about it, and is it the same number?
    This is the question this rule is best placed to raise, because a constant is what the code does
    rather than what a settings page, a README or a privacy policy says. Look in three places and
    report each separately: the product's own settings surface, its user-facing documentation and
    privacy policy, and its record of processing activities if the operator supplies one. GDPR Art.
    30(1)(f) asks for the envisaged time limits for erasure of the different categories of data to
    be in that record, where possible, and Art. 30(5) exempts smaller organisations only
    conditionally - so do not assume the exemption. Where the enforced period and a stated period
    differ, that difference is the finding and it should be reported with both numbers and both
    sources. Where nothing states a period at all, say so; that is an observation about
    documentation."
  - "Is this a cache, a buffer, a working copy or a credential window rather than a record-retention
    period? The criterion is not the name of the constant: it is what expiry LOSES. If the same fact
    survives elsewhere and what expires is a copy, a rendered segment, a thumbnail or a signed link,
    this is not record retention and the candidate should be dismissed - name the durable copy and
    quote where it is written. Four look-alike classes are known to reach this rule and each is a
    real line in the pinned corpus: a transcoding or segment buffer named with the word `keep`; a
    consent-banner cookie lifetime, which is a cookie duration and belongs to the cookie-attribute
    row rather than to storage limitation; a password-reset, two-factor or e-mail-verification token
    window; and a presigned object-storage URL expiry, where the object is kept and only the link
    expires. Say which of the four this is, or say it is none of them."
  - "Who sets this period, and can they? A self-hosted product's deployer is usually the controller,
    and the purpose - which is what Art. 5(1)(e) measures the period against - is theirs to set.
    Report where this period can be changed from: a settings screen, an environment variable, a
    configuration file the deployer edits, or only by editing source and rebuilding. A period that
    can only be changed by a code change is a period the controller cannot set for their own
    purpose, and that is worth reporting even when the number itself is unremarkable."
  - Does the exception in Art. 5(1)(e) apply, and is the condition attached to it met? The point
    permits storage for longer periods where the data will be processed solely for archiving
    purposes in the public interest, scientific or historical research purposes or statistical
    purposes, and only subject to the safeguards in Art. 89(1). Two questions follow and they are
    separate. First, is this store within one of those purposes on the face of the code and of the
    product's own description - an audit trail kept for accountability is not automatically an
    archiving purpose in the public interest, and a product analytics store is not automatically a
    statistical purpose. Second, if it is, are the technical and organisational measures required by
    Art. 89(1) in place? Where a separate legal retention duty applies instead, quote the instrument
    and the period rather than naming it.
evidence_template: "{file}:{line} states a retention, expiry or cleanup PERIOD in ordinary
  application code or configuration, rather than in a schema, a migration or an infrastructure
  artefact. WHAT WAS ESTABLISHED, and it depends on which clause matched, so read the line first. A
  NAME CARRYING A RETENTION WORD AND A TIME UNIT - `ActivityLogRetentionDays`,
  `data_retention_in_years`, `EXCEPTIONS_TTL_DAYS`, `expiresAfterDays` - establishes that this
  product names a period after which something is removed, and, where a positive number stands
  beside the name on the same line, establishes that number as the stated period. WHERE NO NUMBER
  STANDS ON THE LINE THE VALUE WAS NOT SEEN: a property declaration, a schema field or a read of the
  name states the quantity and nothing else, and the value may be a default in another file, an
  environment variable or a per-plan catalogue entry that differs by tier. A RETENTION-NAMED MOMENT
  PROPERTY - `RetentionDate` and its column, migration and snapshot spellings - establishes that
  rows carry an individual moment at which they become removable, and establishes NO PERIOD AT ALL:
  how far ahead that moment is set is computed somewhere else. A CLEANUP VERB BESIDE A DURATION
  LITERAL establishes two facts that share a line, with up to 120 characters between them and
  nothing binding them beyond adjacency; read the statement and say whether the duration is the
  argument of the deletion or something else on the same line. A RETENTION-NAMED BINDING WHOSE VALUE
  IS A DURATION LITERAL - `passwordResetTTL = 30 * time.Minute` - establishes the most: the name,
  the number and the unit in one expression. WHAT WAS NOT ESTABLISHED, and each of these is a
  question rather than a caveat. FIRST, AND MOST IMPORTANTLY, NOTHING HERE SAYS THE PERIOD IS WRONG.
  GDPR Art. 5(1)(e) sets the limit by the purpose and not by a number of days, so no detector can
  compute the permitted period, and most of what this rule finds is a product stating a bounded
  retention period rather than failing to. SECOND, WHAT THE PERIOD GOVERNS WAS NOT READ. The
  detector matched a name; it did not follow the name to a store and it read no column. A
  transcoding buffer, a cache file lifetime, a consent-cookie duration and a token validity window
  are all written exactly like a record-retention constant, and all four occur in the corpus this
  rule was built against. THIRD, NOTHING ESTABLISHES THAT ANYTHING APPLIES THE PERIOD; a declared
  property whose reader is in another file states a number and no behaviour. FOURTH, THIS RULE NEVER
  REPORTS AN ABSENCE: it says nothing about data whose retention period is stated nowhere, and
  silence from it is not a statement that anything is kept forever. ADDED 2026-09-04: THIS RULE ALSO
  REPORTS THE ENFORCEMENT HALF, AND THOSE TWO CLAUSES STATE NO PERIOD AT ALL - read the cited line
  before applying the opening sentence to it. A ROUTINE DECLARATION whose name compounds a removal
  verb with an expiry word or a retention column name establishes that a sweep keyed to expiry
  exists in this file, and nothing else: not what period it applies, not what it removes, and not
  that anything ever calls it. A SCHEDULER REGISTRATION binding such a name to an interval or a cron
  expression establishes that the removal is timed rather than merely present, and the interval on
  that line is THE SWEEP'S FREQUENCY AND NEVER THE RETENTION PERIOD. Neither clause reads a deletion
  statement: a bare removal call names no period, no subject and no schedule, and none is matched.
  ADDED 2026-09-08: TWO MORE THINGS THE CITED LINE MAY BE. FIRST, THE CITED LINE MAY BE THE OPENING
  LINE OF A CONSTRUCT WRITTEN OVER SEVERAL LINES, AND ITS OWN TEXT MAY SHOW NOTHING OF WHAT MATCHED.
  This rule now declares the joined view, so every clause is also tested against the whole of a
  bracket-balanced construct that opens on a line, folded onto one string. A struct-literal
  initialiser or a settings tuple may put the period's NAME on the first line and its VALUE on the
  second, and the finding then cites the line the construct opens on and carries the folded span in
  locations[].joined_from. READ THAT WHOLE SPAN BEFORE SAYING WHAT THE STATED PERIOD IS: the name,
  the number and the unit may each be on a different line of it, and the file's own text is what an
  adjudication has to be able to quote. What is still not read, and no answer may assume otherwise:
  a continuation written with a trailing operator and no bracket, and a backslash continuation, are
  not folded; and a construct of more than forty lines, one folding past four thousand characters,
  or one whose brackets never close is refused. Where a product splits a duration into a VALUE and a
  UNIT held in two separate statements - a number on one line and the letter d, h or m on another -
  the fold does not reach them either, and each half is reported on its own line; the period is the
  two together and neither line states it alone, so find the other half before naming a number of
  days. SECOND, A PERIOD MAY BE A LOOKUP'S DEFAULT ARGUMENT RATHER THAN A SETTING'S VALUE. A
  defaulted property or environment lookup - getProperty(key, fallback), getenv(key, fallback),
  getOrDefault, config.get(key, n) - states the period in its SECOND argument, and that number is
  what runs ONLY WHEN THE DEPLOYMENT HAS NOT SET THE KEY. So the finding establishes that this
  product reads a period from a named key and ships a fallback for it, and it establishes NOTHING
  ABOUT WHAT ANY DEPLOYMENT RUNS. WHICH OF THE TWO IS IN FORCE IS THE OPERATOR'S FACT TO STATE, not
  the code's and not this detector's: report the key by name, report the fallback as the fallback,
  and ask the person running the scan whether the key is set in their deployment and to what. Where
  a second literal stands in the same expression - a floor, a ceiling, a clamp - say which of the
  two the product actually applies."
remediation_template: |
  WHAT WAS FOUND. A retention, expiry or cleanup period stated as a value in ordinary application
  code or configuration - a named constant, a configuration property, a plan-catalogue field or a
  cleanup routine's argument. In most cases this is a product doing the right thing: a bounded
  period is written down and something applies it. Read the three questions below before changing
  any code, because for a well-built product the answer to all three may be that nothing needs to
  change in the code at all.

  1. DOES THIS PERIOD GOVERN PERSONAL DATA? A constant named for a number of days says what it
     means and not what it applies to. Follow the name to the statement that reads it, and follow
     that statement to the store. A transcoding buffer, a cache lifetime, a signed-URL expiry and a
     password-reset window all look identical on the line. If it turns out to govern nothing that
     identifies a person, there is nothing here to change.
  2. IS THIS PERIOD WRITTEN DOWN ANYWHERE A HUMAN READS? Check the privacy policy, the user-facing
     documentation and the record of processing activities. Art. 5(2) puts the burden of being able
     to demonstrate the retention position on the controller, and Art. 30(1)(f) asks, where
     possible, for the envisaged time limits for erasure of the different categories of data to
     appear in that record. A period that exists only inside a constant is undocumented wherever a
     reviewer would look, whatever it turns out to enforce.
  3. DOES ANYTHING APPLY IT? Find the reader. A declared property with no reader, a function default
     every caller overrides, or a catalogue field no query selects is a number and not a retention
     practice - and a number that reads as a policy is worse than none, because a reviewer will
     believe it.

  IF SOMETHING DOES NEED TO CHANGE, the useful changes are these, in order of how often they are the
  right one.

  - PUT THE PERIOD WHERE IT CAN BE READ. A one-line comment beside the constant naming what the
    store holds, how long it is kept and why that length is necessary for the purpose costs nothing
    and is the difference between an enforced period and a demonstrable one.
  - MAKE THE PERIOD REACHABLE BY THE OPERATOR IF THEY ARE THE CONTROLLER. Where the product is
    self-hosted, the deployer usually sets the purpose, so a period they can only change by editing
    source and rebuilding is a period they cannot set.
  - CHECK THAT EVERY STORE HOLDING THE SAME CATEGORY OF DATA HAS THE SAME PERIOD. A period written
    per constant drifts: an export bucket, an aggregate table, a search index or a replica can
    outlive the store the constant was written for.
  - RECONCILE THE NUMBER WITH THE ONE PUBLISHED. Where the policy says ninety days and the constant
    says three years, one of the two is wrong and the code is the one that is running. Fix
    whichever is wrong, and say which you changed.

  DO NOT read this as a request to shorten the period. Nothing in this finding says the period is
  too long, and shortening a retention window without knowing the purpose can destroy records the
  product or its users are separately required to keep.
data_categories:
  - user.behavior
  - user.account
  - user.authorization.credentials
  - user.unique_id

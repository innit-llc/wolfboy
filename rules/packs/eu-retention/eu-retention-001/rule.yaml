id: eu-retention-001
pack: eu-retention
short_name: Retention setting with no time limit by default
problem_line:
  text: Personal data kept with no time limit by default
  template: "{data} kept with no time limit by default"
fix_line: Ship a bounded default, make sure the deletion job runs at it, and state the limit in your
  privacy documentation.
title: "Retention- or expiry-named setting whose shipped default is unbounded: a never-or-unlimited
  option or a sentinel"
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e), the storage-limitation principle, quoted in
      full from the Official Journal text at CELEX 32016R0679, retrieved 2026-08-10. Art. 5(1) opens
      'Personal data shall be:' and point (e) reads: 'kept in a form which permits identification of
      data subjects for no longer than is necessary for the purposes for which the personal data are
      processed'. Read the words exactly, because three of them decide what this rule may and may
      not say. FOR NO LONGER THAN IS NECESSARY - the limit is set by the purpose, not by any fixed
      number of days, so no duration is right or wrong on its face and a detector cannot compute the
      permitted period from code. KEPT IN A FORM WHICH PERMITS IDENTIFICATION - the duty bites on
      identifiability rather than on storage as such, so data that has been anonymised past
      identification is outside the point altogether and pseudonymised data is not. PERSONAL DATA -
      the subject of the sentence is defined in Art. 4(1), carried as entry 4, and whether any
      particular table is within it is not a question this detector answers. The point carries its
      own exception in the same sentence: 'personal data may be stored for longer periods insofar as
      the personal data will be processed solely for archiving purposes in the public interest,
      scientific or historical research purposes or statistical purposes in accordance with Article
      89(1) subject to implementation of the appropriate technical and organisational measures
      required by this Regulation in order to safeguard the rights and freedoms of the data
      subject'. That clause is the reason a long or absent retention limit is not self-evidently a
      gap, and it is CONJUNCTIVE - every conjunct has to hold before the longer storage is
      permitted. The data must be processed SOLELY for one of three named purposes, and the list is
      closed: archiving in the public interest, scientific or historical research, or statistics.
      That processing must be 'in accordance with Article 89(1)'. And it must be 'subject to
      implementation of the appropriate technical and organisational measures required by this
      Regulation'. Note also that 'in the public interest' attaches to archiving alone and not to
      research or statistics. Art. 89(1) is carried as entry 3 so its condition travels with the
      exception. Corrected 2026-08-10. SUPERSEDED WORDING, reproduced without quotation marks
      because every quoted span in this field is checked character-exact against the Official
      Journal text: an audit or research store may lawfully be kept for longer where the safeguards
      required by Art. 89(1) are in place. That named only the Art. 89(1) conjunct, dropped the word
      solely and the closed list of purposes, and offered an audit store as something the exception
      covers - and an audit trail kept for accountability is not an archiving purpose in the public
      interest, which context_questions[3] said in terms while this field said otherwise. Where two
      fields of one rule disagree the adjudicating agent weights the cite, so the wrong one was the
      one being read. Art. 5(2) puts the burden of showing the position on the controller: 'The
      controller shall be responsible for, and be able to demonstrate compliance with, paragraph 1'.
      Applies since 2018-05-25, Art. 99(2): 'It shall apply from 25 May 2018.'"
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 39, from the same Official Journal text. Two
      sentences corroborate Art. 5(1)(e) and neither enacts anything on its own. First: 'This
      requires, in particular, ensuring that the period for which the personal data are stored is
      limited to a strict minimum.' Second, and this is the sentence nearest to the code shape this
      rule matches: 'In order to ensure that the personal data are not kept longer than necessary,
      time limits should be established by the controller for erasure or for a periodic review.' Two
      things a reader must not take from this entry. A recital does not enact a duty; it colours
      Art. 5(1)(e), which is what this rule cites as its test. And the sentence offers erasure OR
      periodic review as alternatives - but read what the alternative is between. The words are that
      'time limits should be established by the controller for erasure or for a periodic review':
      both limbs are things a TIME LIMIT is established for, so the choice is between two ways of
      enforcing a limit and not between having a limit and not having one. A documented review cycle
      answers the second limb only where it has a stated interval and actually results in erasure
      once the purpose is exhausted. A review that runs on schedule and never erases leaves the data
      kept for longer than is necessary, and the limit set by Art. 5(1)(e) is substantive: it is
      breached on those facts however well documented the review is. The preceding sentence of this
      same recital says the same thing directly, and it is quoted above - the storage period must be
      'limited to a strict minimum'. A product with no stated review interval answers neither limb.
      What this entry does support is that a candidate here is a question and not a conclusion.
      Corrected 2026-08-10. SUPERSEDED WORDING, reproduced without quotation marks because every
      quoted span in this field is checked character-exact against the Official Journal text: so a
      product that keeps data indefinitely under a documented review cycle is answering the second
      limb rather than failing the first. That handed the adjudicating agent a complete dismissal
      ground - the mere existence of a documented review cycle - for the exact fact pattern this
      rule raises, and it contradicted the strict-minimum sentence quoted eight words earlier in
      this same field. The direction of the error was under-report, which is the dangerous one, and
      no context question checked the dismissal ground it offered. context_questions[5] now carries
      that check."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 89(1), from the same Official Journal text: 'Processing
      for archiving purposes in the public interest, scientific or historical research purposes or
      statistical purposes, shall be subject to appropriate safeguards, in accordance with this
      Regulation, for the rights and freedoms of the data subject.' The paragraph then states what
      those safeguards have to do: 'Those safeguards shall ensure that technical and organisational
      measures are in place in particular in order to ensure respect for the principle of data
      minimisation.' It then names two measures, and the modal verbs are not interchangeable. 'Those
      measures may include pseudonymisation provided that those purposes can be fulfilled in that
      manner.' But 'Where those purposes can be fulfilled by further processing which does not
      permit or no longer permits the identification of data subjects, those purposes shall be
      fulfilled in that manner.' Pseudonymisation is permissive; giving up the identifying form
      altogether is MANDATORY wherever the purposes can be met that way. So visible pseudonymisation
      does not close the safeguards question in a case where the purposes could have been fulfilled
      without identification at all - it is a measure the paragraph allows, not a measure that
      satisfies it in every case. Added 2026-08-10: the 'may include pseudonymisation' sentence was
      previously elided between the second and third quotations here and the two were joined with
      'and'. That left the only textual authority for naming pseudonymisation as an Art. 89(1)
      measure unquoted, and it hid the may/shall split that context_questions[3] turns on. Carried
      here because Art. 5(1)(e)'s longer-storage exception is expressly conditioned on this
      paragraph, so quoting the exception without it would overstate how freely the exception can be
      relied on. Whether a given store is within the archiving, research or statistical purposes,
      and whether the safeguards are in place, are questions for the adjudicating agent and for the
      operator; nothing in this detector tests either."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1), from the same Official Journal text. Personal
      data 'means any information relating to an identified or identifiable natural person', and the
      paragraph continues: 'an identifiable natural person is one who can be identified, directly or
      indirectly, in particular by reference to an identifier such as a name, an identification
      number, location data, an online identifier or to one or more factors specific to the
      physical, physiological, genetic, mental, economic, cultural or social identity of that
      natural person'. Reference only, and carried for a specific reason: this rule matches a
      CONFIGURATION SHAPE and never a determination that the data behind the setting is within this
      definition. A schema whose columns are literally named for a user or an address may be quoted
      as corroboration in a finding's context, and a column name is closer to a schema fact than to
      a product inference, but the definition above is applied by the adjudicating agent or by the
      person running the scan, not by a pattern. Nothing in the detector tests this entry."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 17(1), from the same Official Journal text: 'The data
      subject shall have the right to obtain from the controller the erasure of personal data
      concerning him or her without undue delay and the controller shall have the obligation to
      erase personal data without undue delay where one of the following grounds applies', the first
      of which is that 'the personal data are no longer necessary in relation to the purposes for
      which they were collected or otherwise processed'. Carried here to fix a boundary, not to test
      one. Art. 17 is a right exercised by an identified person against an identified record and is
      answered by a deletion endpoint or a support process; Art. 5(1)(e) is a standing property of
      the store that applies whether or not anyone asks. A product with a working erasure-on-request
      path can still ship the configuration this rule matches, and a product with no such path is a
      different row and a different mechanism. Reference only: this entry establishes nothing the
      detector tests."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 26, from the same Official Journal text. Two
      sentences, and together they are the authority for the proposition entry 1 states without
      support: that data anonymised past identification is outside the point altogether and that
      pseudonymised data is not. On pseudonymised data: 'Personal data which have undergone
      pseudonymisation, which could be attributed to a natural person by the use of additional
      information should be considered to be information on an identifiable natural person.' On
      anonymous data: 'The principles of data protection should therefore not apply to anonymous
      information, namely information which does not relate to an identified or identifiable natural
      person or to personal data rendered anonymous in such a manner that the data subject is not or
      no longer identifiable.' The anonymisation half of entry 1's sentence also follows directly
      from the words Art. 5(1)(e) itself uses, since the duty is on data 'kept in a form which
      permits identification', but the pseudonymisation half does not follow from those words and
      stood on bare assertion until this entry was added. It matters to this rule in one direction
      only: a product that pseudonymises rather than anonymises has not put the store outside Art.
      5(1)(e), so pseudonymisation is not an answer to a candidate raised here. A recital does not
      enact a duty. Reference only: nothing in the detector tests it, and no candidate turns on it."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Quoted from the same Official Journal text, retrieved 2026-08-10. Article 5 is listed
      expressly by number, so the storage-limitation principle sits in the upper fining band rather
      than the Art. 83(4) one, and that is what `severity: high` records. The Journal prints
      no-break spaces inside '20 000 000'; rendered as ordinary spaces here, as in eu-consent-016.
      This entry fixes the exposure if a candidate turns out to be a real gap; it says nothing about
      how likely that is, which is rule_confidence."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false

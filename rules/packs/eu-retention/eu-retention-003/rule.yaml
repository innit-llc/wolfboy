id: eu-retention-003
pack: eu-retention
short_name: Retention period set in the database or infrastructure
problem_line:
  text: "Retention clause: notice or run not found, or mismatched"
fix_line: State the period where people read it, make stated and enforced periods agree, and check
  that the clause actually runs.
title: Retention period or age-based deletion written into a schema, a migration or an
  infrastructure artefact
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e), the storage-limitation principle, quoted from
      the Official Journal text at CELEX 32016R0679. Art. 5(1) opens 'Personal data shall be:' and
      point (e) reads: 'kept in a form which permits identification of data subjects for no longer
      than is necessary for the purposes for which the personal data are processed'. Three phrases
      in that sentence decide what this rule may and may not say, and the first of them decides the
      whole shape of it. FOR NO LONGER THAN IS NECESSARY - the limit is set by the purpose and not
      by any number of days, so no period is right or wrong on its face and no detector can compute
      the permitted period from code. That matters more here than in either sibling rule, because
      what this detector finds is almost always a FINITE and enforced period: a seven-day window on
      a trace store, a thirty-day TTL index on an activity collection, a ninety-day object-expiry
      rule on a bucket. Such a clause is a product doing the thing the principle asks for, and a
      finding that treated it as a gap would be stating the opposite of the truth. What a candidate
      here is about is WHERE the period is written and therefore what it applies to and who can see
      it, never that the number is wrong. KEPT IN A FORM WHICH PERMITS IDENTIFICATION - the duty
      bites on identifiability rather than on storage as such, so data anonymised past
      identification is outside the point and pseudonymised data is not. PERSONAL DATA - the subject
      of the sentence is defined in Art. 4(1), carried as entry 4, and whether any particular table
      is within it is not a question this detector answers. The point carries its own exception in
      the same sentence: 'personal data may be stored for longer periods insofar as the personal
      data will be processed solely for archiving purposes in the public interest, scientific or
      historical research purposes or statistical purposes in accordance with Article 89(1) subject
      to implementation of the appropriate technical and organisational measures required by this
      Regulation in order to safeguard the rights and freedoms of the data subject'. That clause is
      CONJUNCTIVE - every conjunct has to hold before the longer storage is permitted. The
      processing must be SOLELY for one of three named purposes and the list is closed: archiving in
      the public interest, scientific or historical research, or statistics. It must be in
      accordance with Article 89(1), carried as entry 3. And it must be subject to implementation of
      the appropriate technical and organisational measures. Note that 'in the public interest'
      attaches to archiving alone and not to research or statistics. Art. 5(2) is the paragraph this
      rule leans on hardest and it is the reason the LOCATION of a period is worth reporting at all:
      'The controller shall be responsible for, and be able to demonstrate compliance with,
      paragraph 1'. A period compiled into a migration or into a Terraform file is the period that
      is actually enforced, and it is enforced whether or not it appears anywhere a reviewer, an
      operator or a data subject would look. Applies since 2018-05-25, Art. 99(2): 'It shall apply
      from 25 May 2018.'"
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 39, from the same Official Journal text. Two
      sentences corroborate Art. 5(1)(e) and neither enacts anything on its own. First: 'This
      requires, in particular, ensuring that the period for which the personal data are stored is
      limited to a strict minimum.' Second, and this is the sentence nearest the code shape this
      rule matches: 'In order to ensure that the personal data are not kept longer than necessary,
      time limits should be established by the controller for erasure or for a periodic review.'
      Read that second sentence against what this detector actually finds, because it points the
      other way from the two sibling rules. A TTL clause on a table, a TTL index on a collection and
      an object-expiry lifecycle rule are all time limits established for erasure, and they are
      enforced by the store itself rather than by a job somebody has to remember to run. On the face
      of it that is the recital being answered rather than breached. Both limbs of the sentence are
      things a TIME LIMIT is established FOR, so the choice it offers is between two ways of
      enforcing a limit and never between having a limit and not having one. What is left for a
      reader to check is therefore not whether a limit exists but three other things, and the
      context questions ask them in order: whether the limit that exists is the one the product
      tells people about, whether the artefact carrying it is the live one rather than a superseded
      migration, and whether the period is reached at all where the clause is guarded by a parameter
      supplied from outside the file. A recital does not enact a duty; it colours Art. 5(1)(e),
      which is what this rule cites as its test."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 89(1), from the same Official Journal text: 'Processing
      for archiving purposes in the public interest, scientific or historical research purposes or
      statistical purposes, shall be subject to appropriate safeguards, in accordance with this
      Regulation, for the rights and freedoms of the data subject.' The paragraph then states what
      those safeguards have to do: 'Those safeguards shall ensure that technical and organisational
      measures are in place in particular in order to ensure respect for the principle of data
      minimisation.' It names two measures and the modal verbs are not interchangeable. 'Those
      measures may include pseudonymisation provided that those purposes can be fulfilled in that
      manner.' But 'Where those purposes can be fulfilled by further processing which does not
      permit or no longer permits the identification of data subjects, those purposes shall be
      fulfilled in that manner.' Pseudonymisation is permissive; giving up the identifying form
      altogether is MANDATORY wherever the purposes can be met that way. Carried here because the
      longer-storage exception in Art. 5(1)(e) is expressly conditioned on this paragraph, so
      quoting the exception without it would overstate how freely the exception can be relied on. It
      has a second use in this rule: the stores this detector finds periods on are frequently
      analytics, telemetry and event stores, which is exactly where an operator is most likely to
      reach for the statistical-purposes limb, and this paragraph is what that limb costs. Whether a
      given store is within the archiving, research or statistical purposes, and whether the
      safeguards are in place, are questions for the adjudicating agent and for the operator;
      nothing in this detector tests either."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1), from the same Official Journal text. Personal
      data 'means any information relating to an identified or identifiable natural person', and the
      paragraph continues: 'an identifiable natural person is one who can be identified, directly or
      indirectly, in particular by reference to an identifier such as a name, an identification
      number, location data, an online identifier or to one or more factors specific to the
      physical, physiological, genetic, mental, economic, cultural or social identity of that
      natural person'. Reference only, and carried for a specific reason: this rule matches a
      MECHANISM written into a schema, a migration or an infrastructure file, and never a
      determination that the data the mechanism governs is within this definition. A table whose
      columns or secondary indexes are named for a user, a session or an address may be quoted as
      corroboration in the context of a finding, and a column name written in a schema is closer to
      a schema fact than to a product inference, but the definition above is applied by the
      adjudicating agent or by the person running the scan, and never by a pattern. Nothing in the
      detector tests this entry, and no pattern in it reads a column name."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Quoted from the same Official Journal text. Article 5 is listed expressly by number, so the
      storage-limitation principle sits in the upper fining band rather than the Art. 83(4) one, and
      that is what `severity: high` records. The Journal prints no-break spaces inside '20 000 000';
      they are rendered as ordinary spaces here, as in eu-consent-016, eu-retention-001 and
      eu-retention-002. This entry fixes the exposure if a candidate turns out to be a real gap; it
      says nothing about how likely that is, which is rule_confidence."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(1), from the same Official Journal text. The record
      of processing activities 'shall contain all of the following information', and point (f) is
      'where possible, the envisaged time limits for erasure of the different categories of data'.
      That is the provision a candidate raised by this rule bears on most directly: a TTL clause on
      a table, a TTL index on a collection or an object-expiry lifecycle rule IS an envisaged time
      limit for erasure, it is the one that is actually enforced, and Art. 30(1)(f) asks for it to
      be written in the record as well as in the migration. Two limits on how far that can be taken,
      and both are in the text. The words 'where possible' are in the provision and are not a
      formality. And Art. 30(5) exempts smaller organisations, but only conditionally, so the
      exemption cannot be assumed: 'The obligations referred to in paragraphs 1 and 2 shall not
      apply to an enterprise or an organisation employing fewer than 250 persons unless the
      processing it carries out is likely to result in a risk to the rights and freedoms of data
      subjects, the processing is not occasional, or the processing includes special categories of
      data as referred to in Article 9(1) or personal data relating to criminal convictions and
      offences referred to in Article 10.' Those three unless-limbs are disjunctive and the second
      of them - processing that is not occasional - is met by any product that keeps an event or
      activity store at all, so a scanned product is very often outside the exemption whatever its
      headcount. Reference only. Whether this controller keeps a record of processing activities,
      and what is in it, is not something a scan of source code can see; it is asked of the person
      running the scan, and it is context_questions[3]."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false

context_questions:
  - "MANDATORY, and the detector did not check it: does a deletion routine keyed to THIS switch
    exist in the tree, and what does it do when the switch holds its shipped default? This is the
    first element of the shape and the engine cannot reach it, because the routine lives in a
    different file from the setting in every evidenced instance and this rule file-scoped
    corroboration cannot cross that boundary. CORRECTED 2026-09-06, and the sentence above is left
    exactly as it was written: this rule gate was scoped to the DIRECTORY on that date, so its
    corroboration does now cross a file boundary, within one directory. It crosses it only to OPEN
    THE GATE, never to find a deletion routine: the eleven clauses it carries look for a switch
    bound to a period, and none of them looks for a routine. So this question is unchanged in
    substance and is still MANDATORY. Search the project for the switch name as a STRING rather than
    as an identifier - a scheduled task, a cron registration, a celery beat entry, a management
    command, a queue worker - and read the first few lines of what you find. The shape that makes a
    candidate concrete is a routine that reads the switch and returns before doing anything, or one
    that is never registered at all, so that a deletion the product documents does not run in the
    shipped configuration; in the evidenced instances the switch is read either in a scheduler that
    returns early or in a task-registration function that skips the registration. Report which of
    three you found and quote the file and the lines in every case: (a) such a routine exists and
    no-ops or is not registered at the default, which is the full shape; (b) a routine exists and
    deletes on some other basis, so the switch is not the only control and the finding is weaker
    than it looks; (c) no routine reads this switch at all, in which case the switch may be
    vestigial or the deletion may live outside the repository, and the candidate should be reported
    as a configuration observation only."
  - "Which way does this switch run? Read the consumer before anything else, because the corpus
    contains the exact structure of this finding with the polarity reversed. One photo library ships
    trash.enabled TRUE beside trash.days 30, and its consumer computes the cutoff as enabled ? days
    : 0 - so setting that flag to false does not stop the deletion, it empties the trash
    immediately. The same inversion exists on the period side: a zero on a retention-named key means
    keep nothing in a forum's keep_old_ip_address_count, disables automated backups in an AWS
    backupRetentionPeriod, and stops audit rows being written at all in a secrets manager's
    auditLogsRetentionDays. Find the code that reads the switch and say in one sentence what the
    false value makes it do: stop deleting, delete immediately, stop recording, stop warning, or
    disable a feature that was never a deletion. If the reading that the deletion is off does not
    survive that check, dismiss the candidate and quote the consumer."
  - "Is the data governed by this structure personal data within GDPR Art. 4(1), and who says so?
    This detector matched a configuration shape and is not permitted to answer this, under the
    standing rule that a fact about what data a product handles is asked of the person running the
    scan or read from their declared documents, and may be corroborated by code but never decided by
    it. Work from the schema rather than from the setting name: find the table, model or collection
    the routine deletes from and read its columns. Columns named for a user identifier, an address
    of the requesting machine, a related person, a name or an email address are corroboration worth
    quoting verbatim. Corroboration is not the determination. One evidenced instance of this shape
    is a certificate store, where the answer may well be no, and the rule takes no position on it.
    Where the ScanProfile or the declared documents answer the question, say which one you used and
    quote it; where nothing answers it, return needs_human rather than deciding it from column
    names. If the store holds no personal data, dismiss the candidate here and say what it holds
    instead."
  - "Does the period actually belong to this switch? The weakest of this rule six binding relations
    is proximity: two of them accept a switch and a period within ten lines of each other in the
    same file, and a settings file can put two unrelated settings on adjacent lines. Name the switch
    and the period the finding is about, then say whether one governs the other, quoting the code
    that shows it. Where the finding cites several locations, do this once for the pair the file is
    actually about and say which of the other locations are the same setting group and which are
    unrelated settings that happened to be in the same file. ADDED 2026-09-06: where the finding
    carries corroborated_from, this question is weaker still and it changes shape. The switch and
    the period that satisfied a binding relation are BOTH IN THE NAMED SIBLING FILE, not here, so
    nothing in this file was bound to anything; a sibling corroborator is weaker than proximity and
    never establishes belonging. Open the named file at the named line first, then say whether the
    line cited here is part of the same setting group as the sibling's pair or an unrelated setting
    that happens to sit in the same directory. Where it is unrelated, dismiss it and say so; a
    directory of configuration files is a weaker container than ten lines of one file."
  - Is the shipped default what a real deployment runs? The finding is about the value written in
    the source, which is what a new installation gets and nothing more. Check three things and
    report each. (a) Is there an installer, a seed, a migration, a Docker environment file or a
    deployment template in this repository that turns the switch on at install time, so that the
    default in the source is never what anyone runs? (b) Is the switch exposed to the operator at
    all - an environment variable, an admin setting, a configuration key - or is it internal and
    effectively fixed? (c) Does the product own documentation tell operators to turn it on, and does
    it say what happens if they do not? A default that every deployment overrides is a weaker
    finding than one nobody can see, and a switch the operator cannot reach at all is a stronger
    one. Nothing in this rule claims to know what any given deployer has configured.
  - Does the exception in Art. 5(1)(e) apply, and is the condition attached to it met? The point
    permits storage for longer periods where the data will be processed solely for archiving
    purposes in the public interest, scientific or historical research purposes or statistical
    purposes, and only subject to the safeguards in Art. 89(1). Two questions follow and they are
    separate. First, is this store within one of those purposes on the face of the code and of the
    product own description - an audit trail kept for accountability is not automatically an
    archiving purpose in the public interest, and a security log is not automatically a statistical
    purpose. Second, if it is, are the technical and organisational measures in Art. 89(1) in place?
    Ask that in the order the paragraph puts them, because its two measures are not equivalent and
    legal_basis[2] quotes both. Where the purposes CAN be fulfilled by processing that no longer
    permits identification, Art. 89(1) says they SHALL be fulfilled that way, so start by asking
    whether the purpose could be served by anonymised or aggregated data; only where it genuinely
    requires identifiable data does the permissive limb apply. Where the answer to the first is yes
    and to the second is no, that is a different observation from the one this rule raised and
    should be reported as such. Where a separate legal retention duty applies instead, quote the
    instrument and the period rather than naming it.
evidence_template: "{file}:{line} is a line this finding points at, in a file where this rule bound
  a retention period to a deletion switch that ships in the off state. WHERE THE FINDING CARRIES
  corroborated_from, THE CORROBORATION IS NOT IN THIS FILE, AND FOR THIS RULE THAT IS A LARGE
  DIFFERENCE. Added 2026-09-06: this rule's gate is scoped to the DIRECTORY, so it may be opened by
  another file whose immediate parent directory is this file's own, and when it is, the finding
  names that file and that line in locations[].corroborated_from. Read that named line FIRST. EACH
  BINDING RELATION IS STILL EVALUATED INSIDE ONE FILE - no clause is ever tested against text drawn
  from two files, so a switch in one file and a period in another can never satisfy a relation
  between them. What a sibling supplies is the OPENING of the gate and nothing else. BUT THE GATE IS
  WHERE THIS RULE'S BINDING LIVES: every one of this rule's own match clauses is a single-line
  anchor - a switch line, a period line, a database-migration name column, a block header, a Java
  constant - and none of them joins a switch to a period. SO WHERE corroborated_from NAMES A
  SIBLING, THE BINDING IS IN THAT SIBLING, between the sibling's own switch and the sibling's own
  period, and THIS FILE CARRIES NO BINDING AT ALL: the cited line is one of those single-line
  anchors, and being one of them is the whole of what it is. What is established for such a finding
  is that this DIRECTORY writes retention configuration in which a deletion switch ships off, and
  that the cited line is a switch or a period written beside it. Whether the two are the same
  setting group is the reader's first question and the fourth context question asks it. A finding
  that carries no corroborated_from is unchanged and means exactly what it meant before. WHAT WAS
  ESTABLISHED, and it is two facts and a relation between them. A key whose own name is drawn from
  the deletion vocabulary is assigned a default of false. A key drawn from the retention vocabulary
  and carrying a duration noun is assigned a finite positive value, or a duration literal such as
  90d. And the two are joined by one of six structural relations: they are within ten lines of each
  other in the same file and the switch's own name says what is deleted; or they are within ten
  lines of each other and the switch is a bare enable key while the period's name says what is
  deleted; or they are three columns of one database-migration insert; or they share a setting-name
  prefix; or they share a subject noun inside one identifier, as EnableMessageDeletion does with
  MessageRetentionDays; or they are two members of one block whose own key names the deletion. THE
  VALUE IN EACH CASE IS BOUND TO THE KEY THAT CARRIES THE WORD, never merely present on the same
  line, because vocabulary co-occurrence produced a wrong candidate during authoring and the binding
  is what removed it. WHAT WAS NOT ESTABLISHED, and each of these is a question rather than a
  caveat. FIRST, no deletion routine was found, because none was looked for: the routine that reads
  this switch lives in another file in every instance this rule was built from, and file-scoped
  corroboration cannot cross that boundary. CORRECTED 2026-09-06, and the sentence above is left
  exactly as it was written: this rule's corroboration does now cross a file boundary, within one
  directory. It crosses it only to open the gate and never to find a deletion routine, so the FIRST
  point stands unchanged - no routine was found, because none is looked for. A switch and a period
  can describe a deletion nobody wrote. The first context question asks for it by name. SECOND,
  nothing here establishes WHICH WAY the switch runs. The same structure exists in the corpus with
  the polarity reversed, where the flag ships true and setting it false deletes everything at once;
  read the consumer. THIRD, the finite period is not a finding on its own and must not be reported
  as one - a 90-day window is unremarkable, and what the candidate is about is the switch beside it.
  FOURTH, in the branch that binds two identifiers on a shared subject noun, the period VALUE WAS
  NOT READ: the assignment reads a named constant, so what was established is that a
  retention-period setting for that subject exists, not that its default is finite. FIFTH, OPEN THE
  FILE BEFORE REPORTING ANY SINGLE LOCATION. The corroboration is evaluated once per file and every
  qualifying line in that file then becomes a location, including lines that took no part in the
  binding; one corpus file of six thousand lines contributes thirteen locations of which four are
  API deletion switches unrelated to retention. Say which locations are the pair the file is about.
  ADDED 2026-09-04: TWO FURTHER RELATIONS ARE ALSO REPORTED. First, a sibling duration value in the
  same file written as the argument of a preference-reading call - a quoted setting name carrying
  both the deletion vocabulary and a duration noun, followed by a finite positive number - which is
  how a client-side settings module states the period and which the six relations above cannot read.
  Second, a SCREAMING_SNAKE constant pair in a Java configuration enumeration, bound on the subject
  noun the two constants share, where the switch's shipped default is the LAST positional argument
  and is a named constant such as BooleanUtils.FALSE rather than the literal false. In that second
  relation the cited line is the SWITCH constant, its period constant is elsewhere in the same file,
  and the period VALUE WAS NOT READ."
remediation_template: |
  WHAT WAS FOUND. A retention period with a finite default and, bound to it in the same structure, a
  switch whose shipped default turns the deletion off. The period is not the problem; the pairing is
  what a reviewer is being asked about. What the detector established is narrower, and it is two
  facts and a relation between them: a key whose own name comes from the deletion vocabulary carries
  a default of false in this source, and the retention period is bound to it. Nothing was looked at
  to see whether a routine reads that key, which way the switch runs, or whether some other path
  deletes these records on a different basis, so do not report the period as unenforced until the
  two questions below and context question 1 are answered.

  BEFORE CHANGING ANYTHING, ANSWER TWO QUESTIONS, because the answer decides whether there is
  anything to change at all.

  1. Does a routine exist that reads this switch and deletes records? Search the project for the
     switch name as a string. If nothing reads it, the switch is vestigial and the period is
     documentation; that is a different problem and a different fix.
  2. Which way does the switch run? Read the consumer. In at least one widely deployed project the
     identical structure works the other way round, and turning the flag off deletes everything
     immediately.

  IF THE DELETION IS REAL AND THE SWITCH TURNS IT OFF, there are three honest options and the choice
  is a product decision rather than an engineering one.

  - Ship the switch on. This is the option that makes the shipped default match the retention period
    the product already documents. Where turning it on could destroy data an existing operator
    expects to keep, gate the change behind a release note and a migration that preserves the
    current value for existing installations while new ones get the enforced default.
  - Keep the switch off and say so where the operator will see it. A default that ships off is
    defensible when the operator is the controller and is told, in the setting description and in
    the deployment documentation, that no deletion runs until they turn it on and what period
    applies when they do. Silence is what makes this a finding.
  - Remove the switch. Where the period is not configurable in practice and the deletion should
    always run, a switch that only ever gets turned on is a liability rather than a feature.

  WHATEVER IS CHOSEN, RECORD THE PERIOD AND ITS BASIS somewhere a reviewer can read: what the store
  holds, how long it is kept, and why that length is necessary for the purpose. Art. 5(2) puts the
  burden of being able to demonstrate that position on the controller, and a number in a defaults
  file is not by itself a demonstration.

  DO NOT treat a deployment override as an answer to this on its own. The finding is about the value
  a new installation gets. If every deployment turns the switch on through a template, say where the
  template lives; if some do not, they are running with no deletion at all.

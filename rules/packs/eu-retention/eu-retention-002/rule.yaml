id: eu-retention-002
pack: eu-retention
short_name: Retention period whose deletion switch is off by default
problem_line:
  text: Retention period with deletion switched off by default
fix_line: Ship the deletion switch on, or tell operators it is off and what period applies when on;
  record the period.
title: Retention period bound in one structure to a deletion switch whose shipped default is off
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e), the storage-limitation principle, quoted from
      the Official Journal text at CELEX 32016R0679. Art. 5(1) opens 'Personal data shall be:' and
      point (e) reads: 'kept in a form which permits identification of data subjects for no longer
      than is necessary for the purposes for which the personal data are processed'. Three words in
      that sentence decide what this rule may and may not say. FOR NO LONGER THAN IS NECESSARY - the
      limit is set by the purpose and not by any number of days, so no configured period is right or
      wrong on its face and no detector can compute the permitted period from code. This matters
      more for this rule than for its sibling, because the period this rule matches is FINITE: a
      90-day window is not a gap, and what the candidate is about is the switch beside it, not the
      number. KEPT IN A FORM WHICH PERMITS IDENTIFICATION - the duty bites on identifiability rather
      than on storage as such, so data anonymised past identification is outside the point and
      pseudonymised data is not. PERSONAL DATA - the subject of the sentence is defined in Art.
      4(1), carried as entry 4, and whether any particular table is within it is not a question this
      detector answers. The point carries its own exception in the same sentence: 'personal data may
      be stored for longer periods insofar as the personal data will be processed solely for
      archiving purposes in the public interest, scientific or historical research purposes or
      statistical purposes in accordance with Article 89(1) subject to implementation of the
      appropriate technical and organisational measures required by this Regulation in order to
      safeguard the rights and freedoms of the data subject'. That clause is CONJUNCTIVE - every
      conjunct has to hold before the longer storage is permitted. The processing must be SOLELY for
      one of three named purposes and the list is closed: archiving in the public interest,
      scientific or historical research, or statistics. It must be in accordance with Article 89(1),
      carried as entry 3. And it must be subject to implementation of the appropriate technical and
      organisational measures. Note that 'in the public interest' attaches to archiving alone and
      not to research or statistics. Art. 5(2) puts the burden of showing the position on the
      controller: 'The controller shall be responsible for, and be able to demonstrate compliance
      with, paragraph 1'. That sentence is why a switch that ships off is worth raising at all
      rather than dismissing as a deployment matter: the shipped default is the state the controller
      has to be able to account for. Applies since 2018-05-25, Art. 99(2): 'It shall apply from 25
      May 2018.'"
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 39, from the same Official Journal text. Two
      sentences corroborate Art. 5(1)(e) and neither enacts anything on its own. First: 'This
      requires, in particular, ensuring that the period for which the personal data are stored is
      limited to a strict minimum.' Second, and this is the sentence nearest the code shape this
      rule matches: 'In order to ensure that the personal data are not kept longer than necessary,
      time limits should be established by the controller for erasure or for a periodic review.'
      Read what the alternative in that second sentence is between. Both limbs are things a TIME
      LIMIT is established FOR, so the choice is between two ways of enforcing a limit and never
      between having a limit and not having one. That reading is what makes this rule a question
      rather than an answer, and it cuts both ways here. A product that has established a finite
      time limit has done the first half of what the recital asks. Whether the limit is enforced is
      the other half, and a switch that ships off is a reason to ask, not a finding that the limit
      is unenforced - the operator may turn it on, an installer may set it, and the deletion may
      live somewhere the scan never read. A recital does not enact a duty; it colours Art. 5(1)(e),
      which is what this rule cites as its test."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 89(1), from the same Official Journal text: 'Processing
      for archiving purposes in the public interest, scientific or historical research purposes or
      statistical purposes, shall be subject to appropriate safeguards, in accordance with this
      Regulation, for the rights and freedoms of the data subject.' The paragraph then states what
      those safeguards have to do: 'Those safeguards shall ensure that technical and organisational
      measures are in place in particular in order to ensure respect for the principle of data
      minimisation.' It names two measures and the modal verbs are not interchangeable. 'Those
      measures may include pseudonymisation provided that those purposes can be fulfilled in that
      manner.' But 'Where those purposes can be fulfilled by further processing which does not
      permit or no longer permits the identification of data subjects, those purposes shall be
      fulfilled in that manner.' Pseudonymisation is permissive; giving up the identifying form
      altogether is MANDATORY wherever the purposes can be met that way. Carried here because the
      longer-storage exception in Art. 5(1)(e) is expressly conditioned on this paragraph, so
      quoting the exception without it would overstate how freely the exception can be relied on.
      Whether a given store is within the archiving, research or statistical purposes, and whether
      the safeguards are in place, are questions for the adjudicating agent and for the operator;
      nothing in this detector tests either."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1), from the same Official Journal text. Personal
      data 'means any information relating to an identified or identifiable natural person', and the
      paragraph continues: 'an identifiable natural person is one who can be identified, directly or
      indirectly, in particular by reference to an identifier such as a name, an identification
      number, location data, an online identifier or to one or more factors specific to the
      physical, physiological, genetic, mental, economic, cultural or social identity of that
      natural person'. Reference only, and carried for a specific reason: this rule matches a
      CONFIGURATION SHAPE and never a determination that the data behind the setting is within this
      definition. A schema whose columns are named for a user or an address may be quoted as
      corroboration in the context of a finding, and a column name is closer to a schema fact than
      to a product inference, but the definition above is applied by the adjudicating agent or by
      the person running the scan, and never by a pattern. Nothing in the detector tests this
      entry."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Quoted from the same Official Journal text. Article 5 is listed expressly by number, so the
      storage-limitation principle sits in the upper fining band rather than the Art. 83(4) one, and
      that is what `severity: high` records. The Journal prints no-break spaces inside '20 000 000';
      they are rendered as ordinary spaces here, as in eu-consent-016 and eu-retention-001. This
      entry fixes the exposure if a candidate turns out to be a real gap; it says nothing about how
      likely that is, which is rule_confidence."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-12
    jurisdiction: EU
    supports_rule_condition: false

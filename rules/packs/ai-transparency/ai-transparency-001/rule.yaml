context_questions:
  - "Which role does the scanned party hold for this conversational system — provider (AI Act Art.
    3(3)) or deployer (Art. 3(4))? Answer from the codebase: is the model hosted, trained or
    fine-tuned inside this repository, or reached over a third-party API; and is the assistant
    surface shipped to end users or to third parties under this party's own name or brand, or is a
    vendor's assistant embedded as-is under this party's authority? Art. 50(1) addresses providers
    only, so record which branch the evidence supports and quote it."
  - Does the model use this line belongs to reach an end-user-facing conversational surface, or only
    an internal tool or batch job (out of scope)? Where the matched line is an endpoint, a binding,
    an import or a type rather than a call, find the call site it serves before answering - it may
    be in another file, and it may not exist in this repository at all. Trace the UI path and quote
    it.
  - Is the user told, before or at the start of the conversation, that they are interacting with an
    AI, in a way that is clear and noticeable? Find the AI-disclosure UI and quote it; if nothing is
    found, record the absence.
  - Could the AI nature be obvious from the context of use (the AI Act Art. 50(1) exception)? Read
    that exception narrowly and quote whatever would make it obvious.
  - "Which of the four shapes did the detector match on this line - a call to a model API, a model
    binding (a chat-model constructor, or a configuration key taking a model family as its value),
    an inference endpoint, host or port, or an SDK entry point such as a Bedrock command class, a
    chat-model type or a local model server? Quote the matched line and name the shape. Only a call
    establishes that a model is invoked from this file; an endpoint or a binding establishes that
    this file addresses a model provider, and a provider registry, a settings default, a model price
    catalogue and a documentation example all match exactly as a live call path does. ADDED
    2026-09-06: AND SAY WHERE THE CORROBORATION CAME FROM. Where the finding carries
    corroborated_from, the SDK import, SDK idiom, provider host or port, model name, locally served
    runtime or in-house AI module path that let this line through is in ANOTHER FILE of the same
    directory, and the field names that file and that line. Open it and quote it. Then answer the
    question the engine cannot: are the two files plausibly one module - the same package, the same
    service, the same feature - or only neighbours in one directory? Say which the corroborating
    file is, because this rule excludes no path of its own: an example, a generated file, a vendored
    copy and a test whose name the scanner's production-path default does not catch all corroborate
    exactly as first-party code does. Where the two are not one module, the matched name is a
    homonym that this scope released and the candidate should be dismissed on that ground, with the
    file you read named."
evidence_template: "{file}:{line} carries one of five shapes: a call to a model API, a model binding
  (a chat-model constructor, or a configuration key taking a model family as its value), an
  inference endpoint, host or port, or an SDK entry point such as a Bedrock command class or a
  chat-model type. Only the first is a call - an endpoint literal says where a model would be
  reached, a binding says which model would be used, and either can sit in a file that contains no
  call at all, which is how a provider registry, a settings default and a model price catalogue
  match. The candidate also requires corroboration from somewhere in the same file, the matched line
  included, and that is what tells these names from their homonyms: an SDK import or one of an SDK's
  own identifiers, a provider host or port, a model name, a locally served runtime, or an in-house
  AI module path. A fifth shape was added on 2026-09-04: an embedded third-party AI assistant widget
  - the vendor's package, its component identifier or its service host - which names no model, no
  SDK and no inference host, so on that shape the corroboration comes from the same list and the
  finding says only that the product embeds an assistant somebody else operates. THE TWO SENTENCES
  ABOVE PUT THE CORROBORATION IN THE SAME FILE, AND FROM 2026-09-06 THAT HOLDS WITHOUT QUALIFICATION
  ONLY OF A FINDING THAT CARRIES NO corroborated_from. Added 2026-09-06: this rule's gate is scoped
  to the DIRECTORY, so it may also be opened by another file whose immediate parent directory is the
  cited file's own, and where it is, the finding names that file and that line in
  locations[].corroborated_from. WHERE THE FINDING CARRIES corroborated_from, THE SDK EVIDENCE IS IN
  ANOTHER FILE OF THE SAME DIRECTORY, AND THE HOMONYM TEST IS CORRESPONDINGLY WEAKER: it then
  establishes only that SOME FILE IN THIS DIRECTORY CARRIES ONE OF THOSE CONSTRUCTS - not that this
  line is an LLM call, and not that the directory is an LLM module - and a same-name API belonging
  to a different SDK - messages.create from intercom-client or twilio, streamText from
  hono/streaming, a home-grown useChat composable - written beside such a file will reach you this
  way. Do not read the corroboration as a statement about the directory. In one measured case the
  corroborating file was a fake-conversation fixture that nothing in the application imports, in a
  flat utility folder of 74 files that is not a module at all. THE NAMED CORROBORATING LINE IS WHAT
  TO READ FIRST. Open it, say what kind of corroboration it carries, and say what joins that file to
  the cited line, because the record does not say which of this rule's corroboration branches
  matched and the engine established only that the two files sit in one directory. This rule
  declares no file_globs, no path_without and no path exclusions, so the named file is any file the
  scanner treats as production: an example, a generated file, a vendored copy, or a test written to
  a convention the scanner's default does not recognise. That default is the scanner's own and not
  this rule's: as the shipped scanner has it, a file is kept out when any directory on its path is
  named test, tests, spec, specs, testing, fixtures, __fixtures__, mocks, __mocks__, __snapshots__,
  e2e, cypress, playwright, stories or .storybook, or when its own name ends in .test, .spec,
  .stories or .cy before a JavaScript or TypeScript extension. Say which kind of file the
  corroborator is before relying on it. A finding that carries no corroborated_from is unchanged and
  means exactly what it meant before. Whether it reaches an end-user-facing conversational surface
  is context question 2, and whether an AI disclosure exists is context question 3 - this detector
  searches for neither"
remediation_template: >
  Settle the role first, because AI Act Art. 50(1) addresses providers and not deployers.

  Provider branch (this party puts the conversational system into service under its own name or
  brand,

  including one built on a third-party model): build the disclosure into the surface itself — an
  explicit

  "you are chatting with an AI assistant" on the first render, a permanent label in the conversation
  header

  plus a declaration in the opening message. Wording placed only in the terms of service never
  reaches the

  user at the point of interaction.

  Deployer branch (a vendor's assistant is embedded as-is under this party's authority): Art. 50(1)
  sits with

  the upstream provider, so the engineering task here is to keep the vendor's disclosure surfaced
  rather than

  restyled or suppressed by the embedding, and to check separately whether Art. 50(4) reaches any
  AI-generated

  text this product publishes on matters of public interest.

  AI Act Art. 50 applies to EU-facing deployments from 2026-08-02.

  Releasing this under a free and open-source licence does not remove the duty: Art. 2(12) withholds
  that

  exclusion from AI systems placed on the market or put into service as systems falling under
  Article 5 or 50,

  and Article 50 is the article this finding sits under. Neither does the way the project is funded.
  Recital

  103's monetisation test narrows the Art. 2(12) exclusion, and an Article 50 system does not have
  that

  exclusion to narrow, so being unmonetised, being a microenterprise and publishing on a public
  repository

  leave this duty exactly where it is.

id: ai-transparency-001
pack: ai-transparency
short_name: "AI chat or model call: telling people it is an AI"
problem_line:
  text: "Chat users: clear notice that they talk to an AI not found"
fix_line: Tell users on the first screen of the chat that they are talking to an AI, and keep a
  visible label in the conversation.
title: Language-model call, binding, endpoint or SDK entry point - conversational surface and AI
  disclosure need review
jurisdiction:
  - EU
  - US
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 50(1) — addressed to providers (Art. 3(3)), not
      to deployers (Art. 3(4)): providers must design and develop AI systems intended to interact
      directly with natural persons so that those persons are informed they are interacting with an
      AI system, unless that is obvious from the point of view of a reasonably well-informed,
      observant and circumspect natural person. Applies from 2026-08-02. A statement buried in the
      terms of service does not reach the user at the point of interaction."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    checked_at: 2026-07-22
    jurisdiction: EU
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 2(12) — the free and open-source exclusion, cited
      here because it does NOT switch this rule off and because a reader of an AI Act finding whose
      own product is open source reaches for it first. Art. 2(12): 'This Regulation does not apply
      to AI systems released under free and open-source licences, unless they are placed on the
      market or put into service as high-risk AI systems or as an AI system that falls under Article
      5 or 50.' Article 50 is named inside that proviso alongside Article 5, so the Art. 50(1)
      provider duty — the duty this rule tests — survives however the system is licensed. That is
      the same disposal ai-prohibited-001, -002 and -003 make one article over, on the identical
      words. How the project is funded does not reopen the question either. The conditions recital
      103 attaches — that a component provided against a price or otherwise monetised does not
      benefit, that making a component available through an open repository is not in itself a
      monetisation, and that transactions between microenterprises are excepted — qualify the
      exceptions this Regulation provides to free and open-source AI components, and the recital
      says exceptions in the plural: Art. 2(12) here, and elsewhere Art. 25(4), Art. 53(2) and Art.
      54(6). Microenterprise there is a defined term, tested by Commission Recommendation
      2003/361/EC rather than by self-description. An Article 50 system is outside the Art. 2(12)
      exclusion before any of those conditions is reached, and none of the other three exceptions
      reaches an Article 50 duty at all. So being unmonetised, being a microenterprise and
      publishing on a public repository change nothing here, in either direction. Commission
      Guidelines C(2026) 5054 final — draft approval, not yet applicable, interpretation only — say
      the same at para. 23 of the Annex: providers and deployers of open-source AI systems within
      the scope of Article 50 still have to meet their respective transparency obligations. Its
      footnote 11 anchors the free and open-source release on recital 102, not on recital 103.
      Neither of those two Guidelines propositions is quoted here or carries a quote receipt: the
      quote checker does not fetch guidance documents, and this entry's url resolves to the
      Regulation, which does not contain them — the Guidelines have a separate entry in this rule's
      legal_basis, carrying their own source link and their own not-yet-applicable status. Only the
      single-quoted Art. 2(12) sentence above is machine-verified against the Official Journal. How
      the system was released is a question for the person running the scan rather than for a
      detector, read from the terms the system is actually released under, and a LICENSE file is
      evidence about it rather than the answer. The Art. 2(12) quotation above is the text the four
      ai-annex3 Article 6(4) checklists carry, re-verified against the same Official Journal source
      on 2026-08-04. Those four quote recital 103 in full as well, because the Art. 2(12) exclusion
      becomes available on an Annex III row only once the Article 6(4) derogation takes the system
      out of high-risk — the proviso names high-risk systems first, so until then the exclusion is
      as unavailable there as it is here — and the monetisation test then decides whether it
      applies; on an Article 50 row it decides nothing, which is why it is not repeated here.
      Reference only: a scope provision establishes no duty of its own, and this one removes none
      from this rule."
    url: http://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-08-04
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Guidelines on the implementation of the transparency obligations for certain AI
      systems under Article 50 of Regulation (EU) 2024/1689, C(2026) 5054 final, 20.7.2026 — STATUS:
      DRAFT APPROVAL, NOT YET ADOPTED AND NOT YET APPLICABLE. Page 2 states that 'The Guidelines
      will be formally adopted by the Commission at a later date, when all language versions are
      available' and that 'It is only from that moment that these Guidelines will be applicable.'
      Verified 2026-07-27; the Art. 5 family went through the same two stages (C(2025) 884 final
      draft approval -> C(2025) 5052 final adopted), so the adopted version of this document is
      expected to carry a different C() number and paragraph numbering may shift. — para. 28 (Art.
      50(1) is addressed to providers); paras 10-11 (a party that places or puts a conversational AI
      system into service under its own name or trademark is its provider); para. 12 (a party using
      a third-party system under its own authority is a deployer); para. 15 (an operator may hold
      both roles at once); para. 27 (a party building an AI system on someone else's general-purpose
      AI model is a downstream AI system provider carrying the Art. 50(1) and (2) obligations)"
    url: https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems
    checked_at: 2026-07-22
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Utah Artificial Intelligence Consumer Protection Act, Utah Code Sec. 13-77-103
      (published-code recodification of the provision enacted as Sec. 13-75-103 by S.B. 226, 2025
      General Session), effective 2025-05-07 and replacing the disclosure provision that S.B. 149
      (2024) had put at Sec. 13-2-12 — narrower than AI Act Art. 50(1): disclosure that the
      individual is interacting with generative artificial intelligence is owed under Sec.
      13-77-103(1) only where the individual makes a clear and unambiguous request, and proactively
      under Sec. 13-77-103(2) only in a regulated occupation where the use is a high-risk artificial
      intelligence interaction"
    url: https://law.justia.com/codes/utah/title-13/chapter-77/part-1/section-103/
    checked_at: 2026-07-27
    jurisdiction: US
  - cite: "New York General Business Law Art. 47 (Artificial Intelligence Companion Models), Sec.
      1700-1704, in force 2025-11-05 — scope of the Article, quoting nothing: it is narrower than AI
      Act Art. 50(1) in its reach, because it applies only to AI companions as defined in Sec. 1700,
      where Art. 50(1) reaches AI systems intended to interact directly with natural persons
      generally. The notification duty this rule tests is the next entry, which quotes Sec. 1702 and
      carries that section's own url"
    url: https://www.nysenate.gov/legislation/laws/GBS/A47
    checked_at: 2026-09-07
    jurisdiction: US
    supports_rule_condition: false
  - cite: New York General Business Law Sec. 1702 (Notifications), in Art. 47 (Artificial Intelligence
      Companion Models), in force 2025-11-05 — periodic where AI Act Art. 50(1) states no
      periodicity at all, so on that limb New York asks for something Art. 50(1) does not ask for;
      Sec. 1702 reads in full "An operator shall provide a clear and conspicuous notification to a
      user at the beginning of any AI companion interaction which need not exceed once per day and
      at least every three hours for continuing AI companion interactions which states either
      verbally or in writing that the user is not communicating with a human."
    url: https://www.nysenate.gov/legislation/laws/GBS/1702
    checked_at: 2026-09-07
    jurisdiction: US
effective_date: 2025-05-07
severity: high
rule_confidence: 0.5

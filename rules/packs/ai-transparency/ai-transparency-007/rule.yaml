id: ai-transparency-007
pack: ai-transparency
short_name: "Emotion or biometric recognition: telling people it runs"
problem_line:
  text: "Emotion or biometric analysis: notice to people not found"
fix_line: Tell people where they meet the system, by the time capture or upload starts, that emotion
  or biometric analysis runs.
title: Emotion-recognition or biometric-categorisation API - notice to the persons exposed needs review
jurisdiction:
  - EU
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 50(3) — addressed to deployers (Art. 3(4)), not
      to providers (Art. 3(3)): 'Deployers of an emotion recognition system or a biometric
      categorisation system shall inform the natural persons exposed thereto of the operation of the
      system, and shall process the personal data in accordance with Regulations (EU) 2016/679 and
      (EU) 2018/1725 and Directive (EU) 2016/680, as applicable. This obligation shall not apply to
      AI systems used for biometric categorisation and emotion recognition, which are permitted by
      law to detect, prevent or investigate criminal offences, subject to appropriate safeguards for
      the rights and freedoms of third parties, and in accordance with Union law.' Art. 50(5) fixes
      the manner and the moment: the information goes to the natural persons concerned in a clear
      and distinguishable manner at the latest at the time of the first interaction or exposure, and
      conforms to the applicable accessibility requirements. Chapter IV applies from 2026-08-02
      under Art. 113 (no derogation covers Art. 50). The party calling a third-party emotion or
      biometric-categorisation API under its own authority is the deployer here — the mirror image
      of the provider-side duties in Art. 50(1) and (2)."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 2(12) — the free and open-source exclusion, cited
      here because it does NOT switch this rule off and because a reader of an AI Act finding whose
      own product is open source reaches for it first. Art. 2(12): 'This Regulation does not apply
      to AI systems released under free and open-source licences, unless they are placed on the
      market or put into service as high-risk AI systems or as an AI system that falls under Article
      5 or 50.' Article 50 is named inside that proviso alongside Article 5, so the Art. 50(3)
      deployer duty — the duty this rule tests — survives however the system is licensed. That is
      the same disposal ai-prohibited-001, -002 and -003 make one article over, on the identical
      words. How the project is funded does not reopen the question either. The conditions recital
      103 attaches — that a component provided against a price or otherwise monetised does not
      benefit, that making a component available through an open repository is not in itself a
      monetisation, and that transactions between microenterprises are excepted — qualify the
      exceptions this Regulation provides to free and open-source AI components, and the recital
      says exceptions in the plural: Art. 2(12) here, and elsewhere Art. 25(4), Art. 53(2) and Art.
      54(6). Microenterprise there is a defined term, tested by Commission Recommendation
      2003/361/EC rather than by self-description. An Article 50 system is outside the Art. 2(12)
      exclusion before any of those conditions is reached, and none of the other three exceptions
      reaches an Article 50 duty at all. So being unmonetised, being a microenterprise and
      publishing on a public repository change nothing here, in either direction. Commission
      Guidelines C(2026) 5054 final — draft approval, not yet applicable, interpretation only — say
      the same at para. 23 of the Annex: providers and deployers of open-source AI systems within
      the scope of Article 50 still have to meet their respective transparency obligations. Its
      footnote 11 anchors the free and open-source release on recital 102, not on recital 103.
      Neither of those two Guidelines propositions is quoted here or carries a quote receipt: the
      quote checker does not fetch guidance documents, and this entry's url resolves to the
      Regulation, which does not contain them — the Guidelines have a separate entry in this rule's
      legal_basis, carrying their own source link and their own not-yet-applicable status. Only the
      single-quoted Art. 2(12) sentence above is machine-verified against the Official Journal. How
      the system was released is a question for the person running the scan rather than for a
      detector, read from the terms the system is actually released under, and a LICENSE file is
      evidence about it rather than the answer. The Art. 2(12) quotation above is the text the four
      ai-annex3 Article 6(4) checklists carry, re-verified against the same Official Journal source
      on 2026-08-04. Those four quote recital 103 in full as well, because the Art. 2(12) exclusion
      becomes available on an Annex III row only once the Article 6(4) derogation takes the system
      out of high-risk — the proviso names high-risk systems first, so until then the exclusion is
      as unavailable there as it is here — and the monetisation test then decides whether it
      applies; on an Article 50 row it decides nothing, which is why it is not repeated here.
      Reference only: a scope provision establishes no duty of its own, and this one removes none
      from this rule."
    url: http://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-08-04
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Guidelines on the implementation of the transparency obligations for certain AI
      systems under Article 50 of Regulation (EU) 2024/1689, C(2026) 5054 final, 20.7.2026 — STATUS:
      DRAFT APPROVAL, NOT YET ADOPTED AND NOT YET APPLICABLE. Page 2 of the document states that
      'The Guidelines will be formally adopted by the Commission at a later date' and that 'It is
      only from that moment that these Guidelines will be applicable'. Cited for interpretation
      only; it establishes no obligation. Content relied on: para. 99 (Art. 50(3) imposes the
      obligation on deployers of emotion recognition and biometric categorisation systems, to inform
      the natural persons exposed to those systems of the operation of the system); para. 100
      (Recital 132 purpose: awareness of exposure to systems that can be intrusive for privacy; the
      obligation applies whether the persons are exposed in real time or the systems are operated ex
      post); paras 101-102 (Art. 3(39) notion of emotion recognition system; all emotion recognition
      systems are also high-risk unless prohibited under Art. 5(1)(f) in the areas of workplace and
      education); paras 103-104 (Art. 3(40) notion of biometric categorisation system; unless
      prohibited under Art. 5(1)(g), Art. 50(3) reaches any biometric categorisation system, e.g.
      age or gender classification based on biometric data, whether or not it is high-risk); paras
      105-108 (what must be told, that it is owed to all natural persons exposed including children,
      that no particular means is prescribed but Art. 50(5) requires a clear and distinguishable
      manner and accessibility, and that it is due at the latest at first exposure); para. 109 (the
      law-enforcement exception, applying the clarifications of paras 46-48 with the difference that
      Art. 50(3) turns on the legal rules governing law enforcement powers rather than on an
      explicit authorising law); para. 110 (the Art. 50(3) information obligation does not in itself
      render the use of such a system lawful, does not legitimise intrusive or discriminatory uses
      that might be prohibited under Art. 5, and is owed in addition to information duties under
      Union data protection law); paras 12-13 (deployer = the party assuming responsibility for the
      decision to deploy and for the manner of actual use, technical control not required; deployers
      are in scope of Art. 50(3) and (4) when established or located in the Union, or located in a
      third country where the output is used in the Union). Verified against the published PDF (51
      pp.) on 2026-07-27; paras 12-13 are within the range already cited by
      ai-transparency-001/-003/-004, paras 99-110 are new to this rule."
    url: https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), definitional and scoping provisions that fix who and
      what this rule is about, kept for reference because none of them creates an obligation on its
      own. Art. 3(4): a deployer is 'a natural or legal person, public authority, agency or other
      body using an AI system under its authority except where the AI system is used in the course
      of a personal non-professional activity'. Art. 2(10): the Regulation 'does not apply to
      obligations of deployers who are natural persons using AI systems in the course of a purely
      personal non-professional activity' — read in Commission Guidelines C(2026) 5054 final para.
      19, where 'purely' qualifies the whole phrase, both limbs must hold, and any activity yielding
      regular economic benefit or forming part of a professional, business, trade, occupational or
      freelance activity counts as professional. Art. 3(39): an emotion recognition system is 'an AI
      system for the purpose of identifying or inferring emotions or intentions of natural persons
      on the basis of their biometric data'. Art. 3(40): a biometric categorisation system is 'an AI
      system for the purpose of assigning natural persons to specific categories on the basis of
      their biometric data, unless it is ancillary to another commercial service and strictly
      necessary for objective technical reasons'. Art. 3(34): biometric data is 'personal data
      resulting from specific technical processing relating to the physical, physiological or
      behavioural characteristics of a natural person, such as facial images or dactyloscopic data'.
      Recital 18 narrows Art. 3(39): it does not include physical states such as pain or fatigue,
      nor the mere detection of readily apparent expressions, gestures or movements, unless those
      are used for identifying or inferring emotions."
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 99(4) and Art. 99(4)(g) — the penalty tier this
      rule sits in, kept for reference because a penalty provision does not create the disclosure
      duty: non-compliance with 'transparency obligations for providers and deployers pursuant to
      Article 50' is 'subject to administrative fines of up to EUR 15 000 000 or, if the offender is
      an undertaking, up to 3 % of its total worldwide annual turnover for the preceding financial
      year, whichever is higher'. Art. 99(6) reverses that for SMEs including start-ups: 'each fine
      referred to in this Article shall be up to the percentages or amount referred to in paragraphs
      3, 4 and 5, whichever thereof is lower'."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-99
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: EU AI Act (Regulation (EU) 2024/1689), Art. 5(1)(e), (f) and (g) with Art. 99(3) — the
      boundary of this rule, kept for reference because this rule does NOT test them and must not be
      read as covering them. Art. 5(1)(f) prohibits 'the placing on the market, the putting into
      service for this specific purpose, or the use of AI systems to infer emotions of a natural
      person in the areas of workplace and education institutions, except where the use of the AI
      system is intended to be put in place or into the market for medical or safety reasons'. Art.
      5(1)(g) prohibits biometric categorisation systems 'that categorise individually natural
      persons based on their biometric data to deduce or infer their race, political opinions, trade
      union membership, religious or philosophical beliefs, sex life or sexual orientation',
      excluding labelling or filtering of lawfully acquired biometric datasets and categorising of
      biometric data in the area of law enforcement. Art. 5(1)(e) prohibits 'the placing on the
      market, the putting into service for this specific purpose, or the use of AI systems that
      create or expand facial recognition databases through the untargeted scraping of facial images
      from the internet or CCTV footage'. Art. 99(3) puts all three at 'administrative fines of up
      to EUR 35 000 000 or, if the offender is an undertaking, up to 7 % of its total worldwide
      annual turnover for the preceding financial year, whichever is higher', and they have applied
      since 2025-02-02. Commission Guidelines C(2026) 5054 final para. 110 and para. 25 (with
      Recital 137) record that the Art. 50(3) notice does not in itself make such a use acceptable
      and cannot displace Art. 5 — the notice duty and the prohibitions are cumulative, at different
      tiers, on the same SDK surface.
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2026-08-02

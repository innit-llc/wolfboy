id: ai-transparency-004
pack: ai-transparency
short_name: "AI-generated voice or audio: marking it as AI-made"
problem_line:
  text: "AI-made audio: marking or disclosure not found"
fix_line: As provider, keep audio marked through delivery; as deployer, tell listeners when a voice
  resembles a real person.
title: Speech-synthesis or voice-cloning API referenced - synthetic-audio marking and disclosure
  need review
jurisdiction:
  - EU
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 50(2) — addressed to providers (Art. 3(3)) of AI
      systems generating synthetic audio: the provider must ensure the outputs are marked in a
      machine-readable format and detectable as artificially generated or manipulated. A party that
      only calls a third-party speech-synthesis service under its own authority is a deployer (Art.
      3(4)) and is not the addressee of this paragraph. Applies from 2026-08-02."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    checked_at: 2026-07-22
    jurisdiction: EU
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 50(4) first subparagraph — addressed to deployers
      (Art. 3(4)): a deployer of an AI system generating or manipulating audio constituting a deep
      fake (Art. 3(60)) must disclose that the content has been artificially generated or
      manipulated, clearly and distinguishably at the latest at the time of first exposure (Art.
      50(5)). This is the paragraph that typically reaches application code calling a third-party
      voice API."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    checked_at: 2026-07-22
    jurisdiction: EU
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 111(4), added by Art. 1(39)(b) of Regulation (EU)
      2026/1744 (Digital Omnibus on AI), CELEX 32026R1744, OJ L series 2026/1744 of 24.7.2026, in
      force 27 July 2026: 'Providers of AI systems, including general-purpose AI systems, generating
      synthetic audio, image, video or text content, that have been placed on the market before 2
      August 2026 shall take the necessary steps in order to comply with Article 50(2) by 2 December
      2026.' Recital 38 of the same Regulation gives the reason and the length: 'it is appropriate
      to introduce a transitional period of four months for providers who have already placed their
      systems on the market before the 2 August 2026'. Two limits are worth stating because both are
      easy to read past. It reaches the Art. 50(2) marking and detection duty ALONE, so the Art.
      50(1) interaction disclosure and the Art. 50(4) deployer disclosure are both outside it. And
      it reaches only a system placed on the market before 2026-08-02, so a system placed on the
      market on or after that date never had the four months. Art. 113 was amended by Art. 1(40) of
      the same Regulation in its third paragraph only, at points (a) and (c) and by a new point (d);
      none of them moves the date Chapter IV, which contains Article 50, applies from, so Art. 50
      still applies from 2026-08-02. Reference only: this fixes by when the duty in the first entry
      of this list has to be met, not what it requires."
    url: https://publications.europa.eu/resource/celex/32026R1744
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 2(12) — the free and open-source exclusion, cited
      here because it does NOT switch this rule off and because a reader of an AI Act finding whose
      own product is open source reaches for it first. Art. 2(12): 'This Regulation does not apply
      to AI systems released under free and open-source licences, unless they are placed on the
      market or put into service as high-risk AI systems or as an AI system that falls under Article
      5 or 50.' Article 50 is named inside that proviso alongside Article 5, so the Art. 50(2) and
      Art. 50(4) first subparagraph duties — the two duties this rule tests — survive however the
      system is licensed. That is the same disposal ai-prohibited-001, -002 and -003 make one
      article over, on the identical words. How the project is funded does not reopen the question
      either. The conditions recital 103 attaches — that a component provided against a price or
      otherwise monetised does not benefit, that making a component available through an open
      repository is not in itself a monetisation, and that transactions between microenterprises are
      excepted — qualify the exceptions this Regulation provides to free and open-source AI
      components, and the recital says exceptions in the plural: Art. 2(12) here, and elsewhere Art.
      25(4), Art. 53(2) and Art. 54(6). Microenterprise there is a defined term, tested by
      Commission Recommendation 2003/361/EC rather than by self-description. An Article 50 system is
      outside the Art. 2(12) exclusion before any of those conditions is reached, and none of the
      other three exceptions reaches an Article 50 duty at all. So being unmonetised, being a
      microenterprise and publishing on a public repository change nothing here, in either
      direction. Commission Guidelines C(2026) 5054 final — draft approval, not yet applicable,
      interpretation only — say the same at para. 23 of the Annex: providers and deployers of
      open-source AI systems within the scope of Article 50 still have to meet their respective
      transparency obligations. Its footnote 11 anchors the free and open-source release on recital
      102, not on recital 103. Neither of those two Guidelines propositions is quoted here or
      carries a quote receipt: the quote checker does not fetch guidance documents, and this entry's
      url resolves to the Regulation, which does not contain them — the Guidelines have a separate
      entry in this rule's legal_basis, carrying their own source link and their own
      not-yet-applicable status. Only the single-quoted Art. 2(12) sentence above is
      machine-verified against the Official Journal. How the system was released is a question for
      the person running the scan rather than for a detector, read from the terms the system is
      actually released under, and a LICENSE file is evidence about it rather than the answer. The
      Art. 2(12) quotation above is the text the four ai-annex3 Article 6(4) checklists carry,
      re-verified against the same Official Journal source on 2026-08-04. Those four quote recital
      103 in full as well, because the Art. 2(12) exclusion becomes available on an Annex III row
      only once the Article 6(4) derogation takes the system out of high-risk — the proviso names
      high-risk systems first, so until then the exclusion is as unavailable there as it is here —
      and the monetisation test then decides whether it applies; on an Article 50 row it decides
      nothing, which is why it is not repeated here. Reference only: a scope provision establishes
      no duty of its own, and this one removes none from this rule."
    url: http://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-08-04
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Guidelines on the implementation of the transparency obligations for certain AI
      systems under Article 50 of Regulation (EU) 2024/1689, C(2026) 5054 final, 20.7.2026 — STATUS:
      DRAFT APPROVAL, NOT YET ADOPTED AND NOT YET APPLICABLE. Page 2 states that 'The Guidelines
      will be formally adopted by the Commission at a later date, when all language versions are
      available' and that 'It is only from that moment that these Guidelines will be applicable.'
      Verified 2026-07-27; the Art. 5 family went through the same two stages (C(2025) 884 final
      draft approval -> C(2025) 5052 final adopted), so the adopted version of this document is
      expected to carry a different C() number and paragraph numbering may shift. — paras 10-15
      (Art. 50(1) and (2) fall on providers, Art. 50(3) and (4) on deployers, and one operator may
      hold both roles); para. 27 (a downstream party building an AI system on another provider's
      general-purpose AI model carries the Art. 50(1) and (2) obligations); para. 113(iii) (a
      person's voice counts among the personal characteristics whose resemblance can make audio a
      deep fake); para. 117 (a deployer cannot discharge the Art. 50(4) disclosure through the
      provider's machine-readable marking and needs a label perceivable to listeners)"
    url: https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Code of Practice on Transparency of AI-generated Content, published 10 June 2026, drawn up in
      a multi-stakeholder process facilitated by the AI Office, in two working groups with
      independent academic chairs and vice-chairs. 38 pages, in two sections, whose own headings
      name Article 50(2) and (5) for Section 1 - providers, marking and detection - and Article
      50(4) and (5) for Section 2 - deployers, labelling of deep fakes and of AI-generated or
      manipulated published text. STATUS: VOLUNTARY, AND THE SOURCE OF NO DUTY. WHAT THE CODE CAN BE
      ASSESSED AGAINST IS FIXED BY STATUTE, AND IT IS NARROWER THAN SOME OF THE QUOTATIONS BELOW. AI
      Act Art. 50(7), as replaced by Art. 1(20) of Regulation (EU) 2026/1744, CELEX 32026R1744,
      provides that the Commission, taking utmost account of the opinion of the Board, 'shall assess
      whether adherence to those codes of practice is adequate to ensure compliance with the
      obligations laid down in paragraphs 2 and 4 of this Article, in accordance with the procedure
      laid down in Article 56(6)'. So the statutory adequacy assessment runs to Art. 50(2) and Art.
      50(4). Art. 50(5) is the horizontal manner-of-provision requirement attaching to the
      information those two paragraphs require, and the Commission's own Art. 50 guidance states the
      code route just as narrowly, at Article 50(2) and (4), in the para. 146 quotation further
      down. Where a Commission document quoted below words the Code's reach over paragraphs 2, 4 and
      5, that is that document's wording and is attributed to it here; the enacted paragraph is what
      fixes the scope of the assessment. The Commission page for the Code states that 'Even though
      adherence to the code is voluntary, the transparency requirements under article 50 of the AI
      Act are legal obligations.', and reports that 'By the end of July 2026, about 190 companies
      organisations have signed the code.' - the missing conjunction is the source's, quoted as it
      stands. By Commission Opinion C(2026) 4839 final of 8.7.2026, on the assessment of the Code in
      accordance with Articles 50(7) and 56(6) of Regulation (EU) 2024/1689, the Commission
      concluded at para. 52 that the Code 'adequately covers the obligations provided for in
      Articles 50(2), (4) and (5) AI Act and facilitates their effective implementation', that
      providers and deployers inside the scope of those obligations 'may rely on the Code as the
      EU-wide recognised instrument that is considered adequate to ensure compliance with their
      respective obligations, regardless of their place of establishment, operation or competent
      market surveillance authority', and that all of this holds 'while recognising that adherence
      to the Code does not constitute conclusive evidence of compliance with these obligations'.
      Commission Guidelines C(2026) 5054 final Annex para. 146 - the same draft-approval document
      cited above in this rule, interpretation only - records that 'Providers and deployers of AI
      systems falling within the scope of Article 50(2) and (4) AI Act may demonstrate compliance
      with their respective transparency obligations for AI-generated content under those provisions
      by adhering to a code of practice that is assessed as adequate pursuant to Article 50(7) AI
      Act', and para. 147 records that for signatories the Commission and the competent market
      surveillance authorities 'will focus their supervisory activities on assessing whether those
      signatories have adhered to the code of practice and implemented the measures contained
      therein'. For this rule both Sections are in point: Section 1 covers the Art. 50(2) marking
      duty on the provider branch, and Section 2 the Art. 50(4) first-subparagraph labelling of deep
      fakes on the deployer branch, audio included. The Code does not reach the consent and
      personality-rights questions this rule raises where a real person's voice is involved, which
      rest on other instruments entirely. WHAT THIS ENTRY CHANGES, and what it does not: it changes
      how a finding on this rule is worded and which evidence the reader is asked for. It never
      changes whether a candidate is reported, and it establishes no duty of its own - the duty is
      in Art. 50, in the entries above. Whether the scanned party is a signatory is a fact about the
      operator, read from the Commission signatory list or from the party's own declarations and
      never inferred from source vocabulary; the matching question is in context_questions.
      Downloaded and read on 2026-09-07: the Code from newsroom document 129555, the Commission
      Opinion from newsroom document 130913, both linked from the page this entry names. Reference
      only."
    url: https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Tennessee Ensuring Likeness, Voice, and Image Security Act of 2024 (ELVIS Act), Public
      Chapter 588 of 2024 (H.B. 2091), effective 2024-07-01 — the US limb, and a personality-rights
      basis rather than a marking or disclosure duty: Tenn. Code Ann. Sec. 47-25-1102 defines
      'voice' to cover a simulation of an individual's voice; Sec. 47-25-1103(a) gives every
      individual a property right in the use of that voice; Sec. 47-25-1105(a)(2) creates civil
      liability for making an individual's voice available to the public knowing the use was
      unauthorised, and Sec. 47-25-1105(a)(3) for distributing a tool whose primary purpose is
      producing a particular identifiable individual's voice on the same knowledge standard"
    url: https://publications.tnsosfiles.com/acts/113/pub/pc0588.pdf
    checked_at: 2026-07-22
    jurisdiction: US
    supports_rule_condition: false
effective_date: 2026-08-02
severity: high
rule_confidence: 0.4
detector:
  engine: builtin-regex
  resolve_local_values: true
  vocabulary:
    tts_vendor_hosts:
      - play.ht
      - resemble.ai
  vocabulary_matching:
    tts_vendor_hosts:
      case_insensitive: true
  match:
    - api(\.[a-z0-9-]+)?\.elevenlabs\.io
    - "[Xx][Ii]-[Aa][Pp][Ii]-[Kk][Ee][Yy]"
    - ELEVEN_?LABS_API_KEY|[Ee]leven[_-]?[Ll]abs[_-]?[Aa]pi[_-]?[Kk]ey
    - (?:from|require|import)\s*\(?\s*["'](?:npm:|jsr:)?@?elevenlabs(?:["']|/|-js|-node|@)
    - (?:^|\s)(?:from|import)\s+elevenlabs\b
    - "[\"']@?elevenlabs(?:/[\\w.-]+|-js|-node)?[\"']\\s*:\\s*[\"'][~^>=<*\\d]"
    - /v1/text-to-speech|/v1/speech-to-speech|/v1/voices/add|/v2/tts
    - /(?:v\d/)?audio/speech(?![\w./-])
    - \baudio\.speech\.create\s*\(
    - (?:tts|TTS|speech|Speech|voice|Voice|audio|Audio)\w*["']?\s*(?::|!?={1,3})\s*["'][Ee]leven_?[Ll]abs["']
    - (?<![\w.-])(?:[a-z0-9-]+\.)*play\.ht(?![\w])
    - (?<![\w.-])(?:[a-z0-9-]+\.)*resemble\.ai(?![\w])
    - (?:from|require|import)\s*\(?\s*["'](?:npm:|jsr:)?@?play-?ht(?:["']|/|@)|(?:^|\s)(?:from|import)\s+pyht\b
    - "[Vv]oice.{0,20}[Cc]lon(e|ing)"
    - "[\"'](?:npm|jsr):@?elevenlabs(?:[@\"'/])"
    - import_module\s*\(\s*["'](?:elevenlabs|pyht)["']
    - (?:tts|TTS|[Ss]peech|SPEECH|[Vv]oice|VOICE|[Aa]udio|AUDIO|[Ee]ngine|ENGINE|[Pp]rovider|PROVIDER|[Bb]ackend|BACKEND)\w*["']?\s*(?::|!?={1,3})\s*["'][Ee]leven_?[Ll]abs["']
    - (?:tts|TTS|[Ss]peech|[Vv]oice|[Aa]udio|[Ee]ngine|[Pp]rovider|[Bb]ackend)\w*\s*\(\s*["'][Ee]leven_?[Ll]abs["']
    - \bELEVEN_?LABS_[A-Za-z0-9_]+\b
    - \.\s*[A-Za-z]*[Ee]leven[_-]?[Ll]abs[A-Za-z]*
    - (?<![\w.-])(?:[A-Za-z0-9-]+\.)*(?&tts_vendor_hosts)(?![\w])
    - "[Cc]lon(?:e|ing)[ _-]?[Vv]oice"
context_questions:
  - "Is this line a call to a speech-synthesis API, or something that only shares its vocabulary?
    Four of this rule's shapes match no call at all. A bare xi-api-key header name appears in any
    request to any service that uses that header, and in generic HTTP client code. A dependency
    entry or a lockfile line names the SDK without invoking it. A configuration name carrying the
    vendor's credential or base URL names the account rather than a request - `'name' =>
    'ELEVENLABS_API_KEY'` in a function-template catalogue, `name: 'elevenLabsApiKey'` as the
    programmatic name of a credential field, a bare `ELEVENLABS_API_KEY=` in a sample environment
    file - though the same vendor's base URL read through `os.getenv` did sit in a live synthesis
    client, so this shape sends you looking elsewhere in the tree rather than closing anything by
    itself. And the phrase 'voice cloning' occurs in prose - a README, a changelog, a marketing
    page, a policy document, a comment. Quote the line that actually requests synthesis, wherever in
    the tree it sits; or record that you found only a header name, a dependency declaration, prose,
    or a configuration name with no synthesis call anywhere behind it, in which case the candidate
    closes here."
  - "Which role does the scanned party hold for the audio-generating system — provider (AI Act Art.
    3(3)) or deployer (Art. 3(4))? Answer from the codebase: is a speech model hosted or fine-tuned
    in this repository, or is a third-party voice API called (ElevenLabs, PlayHT, Resemble, OpenAI
    audio.speech); and is the synthesis feature offered onward to users or third parties under this
    party's own name or brand? Art. 50(2) machine-readable marking addresses providers, while Art.
    50(4) disclosure addresses deployers, so record which branch the evidence supports and quote
    it."
  - Does the generated audio reproduce or imitate the voice of a real person (the deep fake
    question)? Establish the use and quote the code or configuration that shows it.
  - "PROVIDER BRANCH (AI Act Art. 50(2)). Is the generated AUDIO marked in a machine-readable format
    and detectable as artificially generated or manipulated? The detector performs no absence check
    at all: it raises the candidate on the synthesis path and leaves this entire search to you. The
    vocabulary this rule's deleted guard clauses keyed on is now evidence for you to weigh —
    audioWatermark, voiceWatermark, speechWatermark, ttsWatermark, syntheticWatermark, aiWatermark,
    watermarkAudio, watermarking_speech, c2pa — and weighing it means three things. First, read what
    the string is attached to. This project has measured the unqualified forms of exactly these
    words silencing genuine findings on an Ariakit `PopoverDisclosure`, a `useOnboardingDisclosure`
    hook, a screen-share watermark for video meetings and a `config.watermark.label` setting in an
    image-generation UI: none of the four touched audio. Second, check that the marking is applied
    to the synthesised audio on the way out rather than existing somewhere in the repository, and
    that it survives what happens next — transcode to MP3 or Opus, normalisation, concatenation,
    streaming re-chunking and CDN delivery all discard side-channel metadata routinely, and a
    watermark applied and then transcoded away is not detectable by anyone. Third, check that it
    runs in production rather than behind a disabled flag. If the marking comes from the voice
    vendor's own SDK option rather than from this code, say so and quote the option: relying on an
    upstream marking solution is allowed, but Commission Guidelines C(2026) 5054 final para. 74
    keeps the burden of demonstrating Art. 50(2) compliance with the provider of the system. Quote
    what you find, or record the absence together with the places searched."
  - "DEPLOYER BRANCH (AI Act Art. 50(4) first subparagraph with Art. 50(5)). Is a person who HEARS
    this audio actually told that it was artificially generated or manipulated, in a form they can
    perceive, at the latest at the time of first exposure? This is a different question from the one
    above, and the answer to that one does not answer this one: Commission Guidelines C(2026) 5054
    final para. 117 records that a deployer cannot discharge the Art. 50(4) disclosure through the
    provider's machine-readable marking, because that marking is not perceivable to the persons
    exposed, and para. 113(iii) puts a person's voice among the personal characteristics whose
    resemblance can make audio a deep fake in the first place. So look where the audio is played
    rather than where it is produced — the player component and its caption, the spoken preamble or
    outro in the audio itself, the transcript, the podcast feed item and its show notes, the IVR
    greeting, the video subtitle track, the download page — and read or listen for what actually
    reaches the listener. An attenuated form of the disclosure applies where the audio is part of an
    evidently artistic, creative, satirical or fictional work; say so if that is what this is. Three
    shapes look like the answer and are not: an internal flag or column recording that the clip was
    synthesised, which tells the operator and not the listener; a watermark or C2PA manifest, which
    is the machine-readable answer to the other question; and a component or i18n key named for a
    disclosure whose rendered string you have not read — `aiContentDisclosure`,
    `syntheticMediaDisclosure`, `<VoiceDisclosureBadge>`. Quote the words a listener receives and
    where they are emitted, or record the absence together with the places searched."
  - Is there a flow that captures the consent of the person the voice belongs to? This rests on
    data-protection and personality-rights grounds rather than on Art. 50 — the Tennessee ELVIS Act
    is the reference entry in this rule's legal basis and is tagged as not establishing the marking
    or disclosure duty this rule tests — so treat it as a separate finding rather than as an answer
    to either question above.
  - "CODE OF PRACTICE, AND WHO ANSWERS THIS. Is the scanned party a signatory of the Code of
    Practice on Transparency of AI-generated Content, and if it is, does the marking or labelling in
    this code follow the Code measures it signed up to? SOURCE CODE CANNOT ANSWER THE FIRST HALF,
    and no detector should try: whether a party has signed is a fact about the operator, held on the
    Commission signatory list and in the party's own declarations, not in its source vocabulary. Ask
    the person running the scan, or read it from the operator's declared documents. THE ANSWER
    CHANGES ONLY HOW THIS FINDING IS WORDED, NEVER WHETHER THIS CANDIDATE IS REPORTED. A signatory
    has an EU-wide recognised way of demonstrating compliance with the Art. 50(2) and Art. 50(4)
    duties, because enacted AI Act Art. 50(7) confines the adequacy assessment to 'the obligations
    laid down in paragraphs 2 and 4 of this Article'. Commission Opinion C(2026) 4839 final para. 52
    words its own conclusion over Articles 50(2), (4) and (5); that is the Opinion's wording and not
    the statutory scope, and Art. 50(5) is in any case the manner-of-provision requirement attaching
    to the information Art. 50(2) and (4) require rather than a separate duty. Ask a signatory which
    Code measures the code path here implements; a non-signatory is expected to show that its own
    means are adequate. The Commission concluded that adherence to the Code is not conclusive
    evidence of compliance either way, so neither answer disposes of the finding. If the answer is
    not known, say so and word the finding without it."
evidence_template: "{file}:{line} references a speech-synthesis or voice-cloning API - as a call, a
  header name, a dependency declaration, a configuration name carrying the vendor's credential or
  base URL, or prose, which context question 1 separates. The configuration shape names an account
  rather than a request, and it is easy to read as a call when it is neither: `'name' =>
  'ELEVENLABS_API_KEY'` in a function-template catalogue, `name: 'elevenLabsApiKey'` as the
  programmatic name of a credential field, a bare `ELEVENLABS_API_KEY=` in a sample environment
  file. The same vendor's base URL read through `os.getenv` did sit in a live synthesis client, so
  this shape settles nothing on its own and the call, where there is one, is on another line. The
  detector makes no finding about whether the audio is marked or disclosed — machine-readable
  marking on the output is context question 4, and a disclosure the listener can perceive is context
  question 5"
remediation_template: >
  Settle the role first, because the two duties land on different parties.

  Provider branch (a speech model is hosted or fine-tuned here, or the synthesis feature is put into
  service under

  this party's own name or brand): AI Act Art. 50(2) asks for machine-readable marking of the audio
  plus a means of

  detection — the vendor SDK's watermarking option or an equivalent audio marking scheme, preserved
  through

  transcode and delivery rather than stripped there.

  Deployer branch (a third-party voice API is called as-is under this party's authority): Art. 50(2)
  sits with the

  upstream provider. What may attach here is the Art. 50(4) disclosure, and only where the audio
  appreciably

  resembles an existing person — a label listeners can perceive at first exposure, spoken or
  on-screen, since

  Commission Art. 50 guidelines para. 117 records that the provider's machine-readable mark does not
  discharge it.

  Four things look like the answer and are not, and all four occur in real repositories: the word
  "watermark"

  attached to something else - a PDF or image overlay, a preview stamp, a screen-share watermark for
  video

  meetings, a `config.watermark.label` setting in a generation UI - all of which this project has
  measured

  silencing genuine audio findings; a `c2pa` or `audioWatermark` identifier in a helper that nothing
  on the

  synthesis path calls; marking that is applied and then lost in the transcode, normalisation or
  streaming step

  after it; and a component or i18n key named `aiContentDisclosure` or `syntheticMediaDisclosure`
  whose rendered

  string nobody has read. Put the machine-readable mark on the synthesised audio and the perceivable
  label where

  the audio is heard, and carry the label into every surface the same clip reaches - the player, the
  transcript,

  the feed item, the show notes, the IVR greeting and the video subtitle track - subject to the one
  temporal

  limit stated at the end of this template, which exempts audio generated or manipulated before
  2026-08-02

  from being marked or labelled retroactively.

  Independently of the role, where the voice of a real person is involved, make a recorded consent
  artefact a

  precondition for synthesis; that rests on data-protection and personality-rights grounds rather
  than on Art. 50.

  Check today's date before reading on, because it decides which of the next two paragraphs applies.
  Art. 50

  applies from 2026-08-02, and AI Act Art. 111(4), added by Art. 1(39)(b) of Regulation (EU)
  2026/1744, gives

  providers of generative systems placed on the market before 2026-08-02 up to and including
  2026-12-02 to take

  the necessary steps to comply with Art. 50(2) - a transitional period of four months. Synthetic
  audio is inside it:

  Art. 111(4) names audio first among the content types it covers.

  UP TO AND INCLUDING 2 DECEMBER 2026 a provider in exactly that position still has that period for
  the

  Art. 50(2) marking duty. Art. 111(4) says the necessary steps are to be taken BY 2 December 2026,
  so that

  day is the last day of the period and not the first day after it. A finding on that branch is
  worded as

  preparation for that date rather than as a statement about present conduct.

  FROM 3 DECEMBER 2026 there is no period left to rely on: the Art. 50(2) duty stands on the same
  terms as it

  does for a system placed on the market after 2026-08-02, and the preparation wording no longer
  describes the

  position.

  Neither branch reaches the Art. 50(1) interaction disclosure or the Art. 50(4) deployer
  disclosure.

  Art. 111(4) names neither of them, and both have applied from 2026-08-02 throughout.

  A separate limit runs beside both branches and qualifies the carry-it-everywhere instruction
  above: it is

  about which OUTPUTS the duty reaches rather than about when the duty starts. Commission Guidelines
  C(2026) 5054 final Annex para. 154 - the same draft-approval

  document this rule cites for interpretation only - records that outputs within Art. 50(2) and deep
  fakes

  within Art. 50(4) first subparagraph generated or manipulated before 2026-08-02 do not have to be
  marked or

  labelled retroactively, while encouraging those who hold or disseminate pre-existing unlabelled
  deep fakes to

  label them without disproportionate effort.

  Releasing this under a free and open-source licence does not remove either duty: Art. 2(12)
  withholds that

  exclusion from AI systems placed on the market or put into service as systems falling under
  Article 5 or 50,

  and Article 50 is the article both duties sit in. Neither does the way the project is funded.
  Recital 103's

  monetisation test narrows the Art. 2(12) exclusion, and an Article 50 system does not have that
  exclusion to

  narrow, so being unmonetised, being a microenterprise and publishing on a public repository leave
  both duties

  exactly where they are.

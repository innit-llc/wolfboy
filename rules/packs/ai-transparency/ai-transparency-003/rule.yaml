severity: high
rule_confidence: 0.45
applicability_preconditions:
  - features.genai_media
detector:
  engine: builtin-regex
  match:
    - images\s*\.\s*generate\s*\(|createImage\s*[(.]
    - stability\.ai|api\.replicate\.com|fal\.ai|fal\.run
    - \bopenai\s*\.\s*images\b
    - "[\"'`](?:gpt-image-\\d|dall-e-\\d|dalle-\\d|stable-diffusion(?:-xl)?|sdxl|flux\\.\\d|flux-(?\
      :pro|dev|schnell)|imagen-\\d|kandinsky|playground-v\\d)"
    - api\.openai\.com/v\d+/images\b
    - \bprocess\.env\.(?:STABILITY|REPLICATE|FAL)[A-Z0-9_]*_(?:API_BASE|BASE_URL|API_URL)\b
context_questions:
  - "Is an image or video generated at this location at all, and if it is, which role does the
    scanned party hold for the generating system — provider (AI Act Art. 3(3)) or deployer (Art.
    3(4))? Settle the first half first, because two of this rule's patterns also match code that
    generates nothing: `createImage` is an ordinary name for a locally defined helper that
    constructs, crops, downloads or resizes an image that already exists, and a generation host also
    occurs as a catalogue display name, a comparison-table row, a documentation link or an
    allow-list entry. Read the matched line and the definition of whatever it calls, and quote the
    model, endpoint or SDK method that produces a new image or video. If no reported location
    produces generated content, record that together with what you read, and the candidate closes
    there: the questions below all assume a generating system and none of them re-opens this one.
    Where something is generated, answer from the codebase: is the image or video model hosted,
    trained or fine-tuned in this repository, or reached over a third-party generation API (OpenAI
    images, Replicate, fal, Stability); and is the generation feature offered onward to users or
    third parties under this party's own name or brand? Art. 50(2) machine-readable marking
    addresses providers, while Art. 50(4) deep-fake disclosure addresses deployers, so record which
    branch the evidence supports and quote it."
  - Is the generated asset distributed or published to users, or does it stay internal (out of
    scope)? Trace the delivery path and quote it.
  - Does the generated image or video appreciably resemble an existing person, object, place, entity
    or event in a way that could pass as authentic (the Art. 3(60) deep-fake test that gates Art.
    50(4))? Quote the prompt construction, reference-image handling or preset that shows the
    intended use.
  - "PROVIDER BRANCH (AI Act Art. 50(2), and Art. 5 of the Chinese Labelling Measures). Does the
    OUTPUT PATH attach machine-readable marking that is detectable as artificially generated or
    manipulated — a C2PA / Content Credentials manifest, an IPTC digitalsourcetype field, XMP or
    EXIF provenance, or an embedded watermark in the pixels? The detector performs no absence check
    at all: it raises the candidate on the generation call and leaves this entire search to you. The
    vocabulary this rule's deleted guard clauses keyed on is now evidence for you to weigh — c2pa,
    C2PA, contentauth, ContentCredentials, watermark, Watermark — and weighing it means three
    things. First, read what the string is attached to: 'watermark' is one of the most overloaded
    words in a product codebase, and this project has measured it silencing genuine findings as a
    PDF or image overlay, a Zoom screen-share watermark, a preview-image stamp and, in one AI chat
    product, a `config.watermark.label` setting in the image and video generation UI. Second, check
    that the marking is on the OUTPUT of the generation call rather than somewhere else in the
    repository, and that it survives the steps after it — re-encode, resize, format conversion, CDN
    transform and social-card generation all strip metadata routinely. Third, check that it is
    reached in production rather than behind a disabled flag or in an unused helper. If the marking
    comes from the upstream model provider rather than from this code, say so and quote it: relying
    on an upstream or third-party marking solution is allowed, but Commission Guidelines C(2026)
    5054 final para. 74 keeps the burden of demonstrating Art. 50(2) compliance with the provider of
    the system. Quote what you find, or record the absence together with the places searched."
  - "DEPLOYER BRANCH (AI Act Art. 50(4) first subparagraph with Art. 50(5), and Art. 4 of the
    Chinese Labelling Measures). Is a person who sees the generated image or video actually TOLD
    that it was artificially generated or manipulated, in a form they can perceive, at the latest at
    the time of first exposure? This is a different question from the one above and a
    machine-readable mark does not answer it: Commission Guidelines C(2026) 5054 final para. 117
    records that a deployer cannot discharge the Art. 50(4) disclosure through the provider's
    machine-readable marking, because that marking is not perceivable to the persons exposed. The
    Chinese Measures make the same split explicit, and require BOTH halves: Art. 4 an explicit label
    the user can perceive, added in the generated image or video or in the interaction interface,
    and Art. 5 an implicit label in the file metadata. So look where the asset is rendered rather
    than where it is produced — the image or video component, the gallery, the share and download
    paths, the social card, the feed item, the email template, the print view — and read the string
    that ships. An attenuated form applies where the content is part of an evidently artistic,
    creative, satirical or fictional work; say so if that is what this is. Three shapes look like
    the answer and are not: an internal flag or column recording that the asset was generated, which
    tells the operator and not the viewer; a provenance manifest or meta tag, which is the
    machine-readable answer to the other question; and a component or i18n key named for a label
    whose rendered string you have not read. Quote the string that ships and where it renders, or
    record the absence together with the places searched."
  - Are these outputs served to users in the EU or in China? China states the metadata-embedding
    duty expressly, and states it alongside a perceivable-label duty, so both halves of the previous
    two questions have to be answered for a China-facing deployment.
  - "CODE OF PRACTICE, AND WHO ANSWERS THIS. Is the scanned party a signatory of the Code of
    Practice on Transparency of AI-generated Content, and if it is, does the marking or labelling in
    this code follow the Code measures it signed up to? SOURCE CODE CANNOT ANSWER THE FIRST HALF,
    and no detector should try: whether a party has signed is a fact about the operator, held on the
    Commission signatory list and in the party's own declarations, not in its source vocabulary. Ask
    the person running the scan, or read it from the operator's declared documents. THE ANSWER
    CHANGES ONLY HOW THIS FINDING IS WORDED, NEVER WHETHER THIS CANDIDATE IS REPORTED. A signatory
    has an EU-wide recognised way of demonstrating compliance with the Art. 50(2) and Art. 50(4)
    duties, because enacted AI Act Art. 50(7) confines the adequacy assessment to 'the obligations
    laid down in paragraphs 2 and 4 of this Article'. Commission Opinion C(2026) 4839 final para. 52
    words its own conclusion over Articles 50(2), (4) and (5); that is the Opinion's wording and not
    the statutory scope, and Art. 50(5) is in any case the manner-of-provision requirement attaching
    to the information Art. 50(2) and (4) require rather than a separate duty. Ask a signatory which
    Code measures the code path here implements; a non-signatory is expected to show that its own
    means are adequate. The Commission concluded that adherence to the Code is not conclusive
    evidence of compliance either way, so neither answer disposes of the finding. If the answer is
    not known, say so and word the finding without it."
evidence_template: "{file}:{line} matched one of this rule's four patterns: an `images.generate(` or
  `createImage` call; one of the four generation hosts it names (`stability.ai`,
  `api.replicate.com`, `fal.ai`, `fal.run`); an `api.openai.com/vN/images` path; or a `STABILITY`,
  `REPLICATE` or `FAL` base-URL environment variable. Two of those patterns also match code that
  generates nothing, and both shapes have already been met in real repositories: `createImage` is an
  ordinary name for a locally defined helper - one built an `HTMLImageElement` from a URL so that a
  canvas could crop an app icon, another downloaded a remote federated image into a file store - and
  a generation host also occurs as a display name in a catalogue entry (`Generate with fal.ai`)
  rather than in a call. The spelling is what the detector established; whether anything is
  generated here is context question 1, and it is answered by reading the matched line and the
  definition of whatever it calls. The detector also makes no finding about whether provenance
  marking or an AI-origin disclosure exists — machine-readable marking on the output path is context
  question 4, and a disclosure the viewer can perceive is context question 5"
remediation_template: >
  Settle the role first, because the two duties land on different parties.

  Provider branch (this party puts the generating system into service under its own name or brand,
  or hosts or

  fine-tunes the model itself): AI Act Art. 50(2) asks for machine-readable marking plus a matching
  detection

  path — C2PA content credentials (c2pa-node or similar), or the vendor SDK's watermark/metadata
  option, kept

  intact through re-encode, resize and CDN steps rather than stripped there. Relying on an upstream
  model

  provider's marking solution is allowed, but the burden of evidencing it stays with the system
  provider

  (Commission Art. 50 guidelines para. 74).

  Deployer branch (this code only calls a third-party generation API as-is): Art. 50(2) sits with
  the upstream

  provider, and the duty that may attach here is the Art. 50(4) deep-fake disclosure — a
  human-perceivable label

  on the published asset at first exposure, since para. 117 of the same guidelines records that a
  deployer cannot

  discharge it with the provider's machine-readable mark. Preserving any upstream marking is still
  worthwhile.

  For a China-facing deployment both halves are required and neither substitutes for the other: an
  explicit label

  the user can perceive, in the generated image or video or in the interaction interface (Measures
  Art. 4), and an

  implicit label in the file metadata carrying the synthetic-content attribute, the service
  provider's name or

  code and a content number (Measures Art. 5, with GB 45438-2025).

  Four things look like the answer and are not, and all four occur in real repositories: the word
  "watermark"

  attached to something else - a PDF or image overlay, a preview stamp, a screen-share watermark, a

  `config.watermark.label` setting in a generation UI - which this project has measured silencing
  genuine

  findings; a `c2pa`, `contentauth` or `ContentCredentials` identifier in a helper nothing on the
  output path

  calls; marking that is applied and then stripped by the next re-encode, resize, format conversion
  or CDN

  transform; and a component or i18n key named for a label whose rendered string nobody has read.
  Put the

  machine-readable mark on the generation output and the perceivable label where the asset is
  displayed, and

  carry the label into every surface the same asset reaches - the page, the gallery, the download,
  the social

  card, the feed and the email - subject to the one temporal limit stated at the end of this
  template, which

  exempts outputs generated or manipulated before 2026-08-02 from being marked or labelled
  retroactively.

  Check today's date before reading on, because it decides which of the next two paragraphs applies.
  Art. 50

  applies from 2026-08-02, and AI Act Art. 111(4), added by Art. 1(39)(b) of Regulation (EU)
  2026/1744, gives

  providers of generative systems placed on the market before 2026-08-02 up to and including
  2026-12-02 to take

  the necessary steps to comply with Art. 50(2) - a transitional period of four months.

  UP TO AND INCLUDING 2 DECEMBER 2026 a provider in exactly that position still has that period for
  the

  Art. 50(2) marking and detection duty. Art. 111(4) says the necessary steps are to be taken BY 2
  December

  2026, so that day is the last day of the period and not the first day after it. A finding on that
  branch is

  worded as preparation for that date rather than as a statement about present conduct.

  FROM 3 DECEMBER 2026 there is no period left to rely on: the Art. 50(2) duty stands on the same
  terms as it

  does for a system placed on the market after 2026-08-02, and the preparation wording no longer
  describes the

  position.

  Neither branch reaches the Art. 50(1) interaction disclosure, the Art. 50(4) deployer disclosure
  or the

  Chinese labelling duties. Art. 111(4) names none of them, and all three have applied throughout -

  Art. 50(1) and Art. 50(4) from 2026-08-02, the Measures from 2025-09-01.

  A separate limit runs beside both branches and qualifies the carry-it-everywhere instruction
  above: it is

  about which OUTPUTS the duty reaches rather than about when the duty starts. Commission Guidelines
  C(2026) 5054 final Annex para. 154 - the same draft-approval

  document this rule cites for interpretation only - records that outputs within Art. 50(2) and deep
  fakes

  within Art. 50(4) first subparagraph generated or manipulated before 2026-08-02 do not have to be
  marked or


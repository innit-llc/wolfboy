  - cite: "Commission Guidelines on the implementation of the transparency obligations for certain AI
      systems under Article 50 of Regulation (EU) 2024/1689, C(2026) 5054 final, 20.7.2026 — STATUS:
      DRAFT APPROVAL, NOT YET ADOPTED AND NOT YET APPLICABLE. The two-page Communication that
      carries the Annex states that 'The Guidelines will be formally adopted by the Commission at a
      later date, when all language versions are available. It is only from that moment that these
      Guidelines will be applicable.' Cited for interpretation only; it establishes no obligation,
      which rests entirely on Art. 50(4) above. By the precedent of the Art. 5 family (C(2025) 884
      final draft -> C(2025) 5052 final adopted) the adopted version is likely to carry a different
      C() number and its paragraph numbering may shift, so this entry needs re-checking before the
      rule ships. Content relied on, all from section 6.2 of the Annex unless stated: para. 130
      (three cumulative conditions — an AI system, used to generate or manipulate text published
      with the purpose of informing the public on matters of public interest, and no exception
      applies); para. 131(i) ('published' means the text is accessible by an indeterminate, fairly
      large number of unrelated, potential readers simultaneously and/or successively, whether or
      not against payment; text is not published where access is restricted to a closed, private
      group, and private interpersonal correspondence and organisation-internal texts such as
      publications on internal corporate networks are outside); para. 131(ii) ('informing the
      public' entails that the text intends to communicate knowledge, opinions or facts, so short
      texts that do not materially do so are outside); para. 131(iii) ('matters of public interest'
      covers matters relevant to society at large at local, national, Union or international level
      and meriting public debate or scrutiny, including politics and democratic processes, public
      administration and services, the administration of justice and law enforcement, the protection
      of fundamental rights, public security, public health, environmental protection, consumer
      safety, and any economic, financial, political, scientific or cultural development that may be
      a relevant subject of public debate); the worked examples after para. 131 (in scope: an
      AI-generated summary of a human-authored article on a newspaper's website about a town council
      decision, AI-manipulated parts of a lifestyle-website article on diets and disease,
      AI-manipulated corporate reports with investor information on a listed company's website, an
      AI-generated storm warning on a meteorological institute's social media profile; out of scope:
      AI-generated fantasy novels, AI-manipulated advertisement or product-description text without
      health, consumer-safety or sustainability claims, a news summary generated by a chatbot and
      visible only to the user who prompted it, and AI-manipulated client advice by a consultant);
      para. 132 (the disclosure means labelling the AI output and disclosing its artificial origin,
      and 'labelling or disclosure methods (including disclaimers) applied in accordance with
      Article 50(4), second subparagraph, AI Act should also be clear and perceivable by natural
      persons (e.g. visible or audible measures) without them needing to rely on any specific
      technical tools or performing dedicated actions'); para. 133 (the exception has two cumulative
      conditions); paras 134-135 (human review means deliberate examination of the substance by one
      or more natural persons with relevant knowledge and professional judgement, with fact-checking
      a minimum requirement; editorial control means control exercised in practice by a responsible
      editorial entity with authority to approve, alter or reject the substance on substantive
      grounds; superficial, solely formal or procedural checks such as spell-checking, the mere
      existence of an editorial policy, automated review processes and cursory approval without
      substantive engagement do not qualify); para. 136 (where AI systems modify, supplement or
      reformulate content AFTER editorial sign-off, the result is treated as AI-generated and any
      substantive AI intervention after review causes the exception to become void); para. 138
      (editorial responsibility means holding the ultimate legal responsibility over the
      publication, and the identity and contact details of the person or function holding it should
      be publicly available in an easily findable location); para. 139 with paras 46-48 (the
      law-enforcement exception; 'authorised by law' comprises Union law and national law adopted in
      compliance with it, the authorising law must clearly specify the purposes and circumstances of
      permitted use and provide safeguards, and transparency continues to apply where the same
      system is deployed for other purposes); para. 140 (editorial responsibility is to be read in
      line with the media acquis, cf. Art. 2(8) EMFA, Regulation (EU) 2024/1083, while remaining a
      distinct and broader concept); paras 141-143 in section 7 (Art. 50(5): information is clear
      where noticeable, easy to understand and accessible, and distinguishable where easy to
      identify as separate from the surrounding content; it is NOT clear and distinguishable where
      it can be easily overlooked, for example only in a manual, hidden under layers of menu
      options, or part of terms of use that are often not read; for Art. 50(4) content the
      obligation applies to each output with respect to any natural person exposed, and the worked
      example for first exposure is 'at the start of an AI-generated or manipulated text publication
      on matters of public interest'); para. 152 in section 8.3 (the Art. 99(4) fine ceiling, with
      the SME rule); para. 154 in section 8.4 (text AI-generated and published before 2026-08-02
      need not be labelled retroactively, but 'if texts that have been generated or manipulated
      before 2 August 2026 are published on or after that date, they need to be labelled'); paras
      146-147 (adherence to a code of practice assessed as adequate under Art. 50(7) is a way for
      deployers to demonstrate compliance with this disclosure duty, and supervision of signatories
      focuses on adherence to it). Downloaded and read on 2026-07-27 from the Commission library
      page below (Communication: newsroom document 131214, 2 pp.; Annex: 131215, 51 pp.)."
    url: https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems

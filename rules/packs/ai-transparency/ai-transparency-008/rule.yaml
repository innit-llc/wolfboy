    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), definitional and scoping provisions that fix who this
      rule is about, kept for reference because none of them creates an obligation on its own. Art.
      3(4): a deployer is 'a natural or legal person, public authority, agency or other body using
      an AI system under its authority except where the AI system is used in the course of a
      personal non-professional activity'. Art. 3(3): a provider is 'a natural or legal person,
      public authority, agency or other body that develops an AI system or a general-purpose AI
      model or that has an AI system or a general-purpose AI model developed and places it on the
      market or puts the AI system into service under its own name or trademark, whether for payment
      or free of charge'. The distinction decides whether this rule reaches the scanned party at
      all: Art. 50(4) is a deployer duty, so a party that merely ships a text-generation library, an
      SDK or a CMS plugin to others is not the addressee — the deployer is whoever runs it over its
      own publication. Art. 2(10): the Regulation 'does not apply to obligations of deployers who
      are natural persons using AI systems in the course of a purely personal non-professional
      activity'; the text carries no comma between 'purely personal' and 'non-professional', which
      is what supports reading 'purely' as qualifying the whole phrase so that both limbs must hold
      (Commission Guidelines C(2026) 5054 final para. 19). Recital 13 glosses Art. 3(4) in the same
      terms."
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 99(4) and Art. 99(4)(g) — the penalty tier this
      rule sits in, kept for reference because a penalty provision does not create the disclosure
      duty: non-compliance with 'transparency obligations for providers and deployers pursuant to
      Article 50' is 'subject to administrative fines of up to EUR 15 000 000 or, if the offender is
      an undertaking, up to 3 % of its total worldwide annual turnover for the preceding financial
      year, whichever is higher'. Art. 99(6) reverses that for SMEs including start-ups: 'each fine
      referred to in this Article shall be up to the percentages or amount referred to in paragraphs
      3, 4 and 5, whichever thereof is lower'. Quoted from the same Official Journal text as the
      entries above, read 2026-07-27."
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 50(1), Art. 50(2) and Art. 50(4) first
      subparagraph — the boundary of this rule, kept for reference because this rule tests none of
      them and must not be read as covering them. Art. 50(1) (informing a natural person that they
      are interacting with an AI system) is a PROVIDER duty and is tested by ai-transparency-001.
      Art. 50(2) (marking synthetic audio, image, video or text outputs 'in a machine-readable
      format and detectable as artificially generated or manipulated') is also a PROVIDER duty, and
      it is the paragraph that C2PA-style content credentials and embedded metadata answer;
      ai-transparency-003 and -004 test its image/video and audio halves. Its synthetic-TEXT half is
      not covered by any rule in this pack. The two duties are not interchangeable in this
      direction: Commission Guidelines C(2026) 5054 final para. 132 requires the Art. 50(4)
      disclosure to be 'clear and perceivable by natural persons (e.g. visible or audible measures)
      without them needing to rely on any specific technical tools or performing dedicated actions',
      and para. 117 states the same point for deep fakes, so machine-readable provenance on a
      published text does not by itself discharge what this rule tests. Art. 50(4) first
      subparagraph (deep-fake image, audio or video) is a deployer duty adjudicated on the
      generation paths of ai-transparency-003 and -004."

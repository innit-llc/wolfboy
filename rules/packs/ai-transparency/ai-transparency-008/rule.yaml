  - cite: "Code of Practice on Transparency of AI-generated Content, published 10 June 2026, drawn up in
      a multi-stakeholder process facilitated by the AI Office, in two working groups with
      independent academic chairs and vice-chairs. 38 pages, in two sections, whose own headings
      name Article 50(2) and (5) for Section 1 - providers, marking and detection - and Article
      50(4) and (5) for Section 2 - deployers, labelling of deep fakes and of AI-generated or
      manipulated published text. STATUS: VOLUNTARY, AND THE SOURCE OF NO DUTY. WHAT THE CODE CAN BE
      ASSESSED AGAINST IS FIXED BY STATUTE, AND IT IS NARROWER THAN SOME OF THE QUOTATIONS BELOW. AI
      Act Art. 50(7), as replaced by Art. 1(20) of Regulation (EU) 2026/1744, CELEX 32026R1744,
      provides that the Commission, taking utmost account of the opinion of the Board, 'shall assess
      whether adherence to those codes of practice is adequate to ensure compliance with the
      obligations laid down in paragraphs 2 and 4 of this Article, in accordance with the procedure
      laid down in Article 56(6)'. So the statutory adequacy assessment runs to Art. 50(2) and Art.
      50(4). Art. 50(5) is the horizontal manner-of-provision requirement attaching to the
      information those two paragraphs require, and the Commission's own Art. 50 guidance states the
      code route just as narrowly, at Article 50(2) and (4), in the para. 146 quotation further
      down. Where a Commission document quoted below words the Code's reach over paragraphs 2, 4 and
      5, that is that document's wording and is attributed to it here; the enacted paragraph is what
      fixes the scope of the assessment. The Commission page for the Code states that 'Even though
      adherence to the code is voluntary, the transparency requirements under article 50 of the AI
      Act are legal obligations.', and reports that 'By the end of July 2026, about 190 companies
      organisations have signed the code.' - the missing conjunction is the source's, quoted as it
      stands. By Commission Opinion C(2026) 4839 final of 8.7.2026, on the assessment of the Code in
      accordance with Articles 50(7) and 56(6) of Regulation (EU) 2024/1689, the Commission
      concluded at para. 52 that the Code 'adequately covers the obligations provided for in
      Articles 50(2), (4) and (5) AI Act and facilitates their effective implementation', that
      providers and deployers inside the scope of those obligations 'may rely on the Code as the
      EU-wide recognised instrument that is considered adequate to ensure compliance with their
      respective obligations, regardless of their place of establishment, operation or competent
      market surveillance authority', and that all of this holds 'while recognising that adherence
      to the Code does not constitute conclusive evidence of compliance with these obligations'.
      Commission Guidelines C(2026) 5054 final Annex para. 146 - the same draft-approval document
      cited above in this rule, interpretation only - records that 'Providers and deployers of AI
      systems falling within the scope of Article 50(2) and (4) AI Act may demonstrate compliance
      with their respective transparency obligations for AI-generated content under those provisions
      by adhering to a code of practice that is assessed as adequate pursuant to Article 50(7) AI
      Act', and para. 147 records that for signatories the Commission and the competent market
      surveillance authorities 'will focus their supervisory activities on assessing whether those
      signatories have adhered to the code of practice and implemented the measures contained
      therein'. For this rule Section 2 is the Section in point: it covers the Art. 50(4) labelling
      duty on deployers, and for this rule that is the second subparagraph - AI-generated or
      manipulated text published to inform the public on matters of public interest. Section 1
      covers the Art. 50(2) provider duty, which this rule does not test. WHAT THIS ENTRY CHANGES,
      and what it does not: it changes how a finding on this rule is worded and which evidence the
      reader is asked for. It never changes whether a candidate is reported, and it establishes no
      duty of its own - the duty is in Art. 50, in the entries above. Whether the scanned party is a
      signatory is a fact about the operator, read from the Commission signatory list or from the
      party's own declarations and never inferred from source vocabulary; the matching question is
      in context_questions. Downloaded and read on 2026-09-07: the Code from newsroom document
      129555, the Commission Opinion from newsroom document 130913, both linked from the page this
      entry names. Reference only."
    url: https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content

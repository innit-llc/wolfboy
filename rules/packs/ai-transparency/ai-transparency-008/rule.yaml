id: ai-transparency-008
pack: ai-transparency
short_name: "AI-written content: telling people it is AI-made"
problem_line:
  text: "AI-written public-interest text: disclosure not found"
fix_line: Label the text as AI-made on every surface readers see it, unless a human reviewed it with
  editorial responsibility.
title: Language-model call, publishing surface or generated-content wording - AI-origin disclosure
  to readers needs review
jurisdiction:
  - EU
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 50(4) second subparagraph — addressed to
      deployers (Art. 3(4)), not to providers (Art. 3(3)): 'Deployers of an AI system that generates
      or manipulates text which is published with the purpose of informing the public on matters of
      public interest shall disclose that the text has been artificially generated or manipulated.
      This obligation shall not apply where the use is authorised by law to detect, prevent,
      investigate or prosecute criminal offences or where the AI-generated content has undergone a
      process of human review or editorial control and where a natural or legal person holds
      editorial responsibility for the publication of the content.' Two exemption limbs sit in the
      second sentence, and the second limb is itself conjunctive: review or editorial control ALONE
      does not exempt unless a natural or legal person also holds editorial responsibility for the
      publication. Art. 50(5) fixes the manner and the moment for the disclosure required by
      paragraphs 1 to 4: 'The information referred to in paragraphs 1 to 4 shall be provided to the
      natural persons concerned in a clear and distinguishable manner at the latest at the time of
      the first interaction or exposure. The information shall conform to the applicable
      accessibility requirements.' Art. 50 sits in Chapter IV, which none of the Art. 113 carve-outs
      (a), (b) or (c) reaches, so the general application date governs: 'It shall apply from 2
      August 2026.'"
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Recital 134, last sentence — kept for interpretation
      only, because a recital creates no obligation: 'In addition, it is also appropriate to
      envisage a similar disclosure obligation in relation to AI-generated or manipulated text to
      the extent it is published with the purpose of informing the public on matters of public
      interest unless the AI-generated content has undergone a process of human review or editorial
      control and a natural or legal person holds editorial responsibility for the publication of
      the content.' The 'similar' points back to the deep-fake sentence earlier in the same recital,
      which asks deployers to 'clearly and distinguishably disclose that the content has been
      artificially created or manipulated by labelling the AI output accordingly and disclosing its
      artificial origin'. Recital 133, by contrast, is the rationale for the Art. 50(2)
      provider-side marking duty and is not the recital for this rule."
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 2(12) — the free and open-source exclusion, cited
      here because it does NOT switch this rule off and because a reader of an AI Act finding whose
      own product is open source reaches for it first. Art. 2(12): 'This Regulation does not apply
      to AI systems released under free and open-source licences, unless they are placed on the
      market or put into service as high-risk AI systems or as an AI system that falls under Article
      5 or 50.' Article 50 is named inside that proviso alongside Article 5, so the Art. 50(4)
      second subparagraph duty — the duty this rule tests — survives however the system is licensed.
      That is the same disposal ai-prohibited-001, -002 and -003 make one article over, on the
      identical words. How the project is funded does not reopen the question either. The conditions
      recital 103 attaches — that a component provided against a price or otherwise monetised does
      not benefit, that making a component available through an open repository is not in itself a
      monetisation, and that transactions between microenterprises are excepted — qualify the
      exceptions this Regulation provides to free and open-source AI components, and the recital
      says exceptions in the plural: Art. 2(12) here, and elsewhere Art. 25(4), Art. 53(2) and Art.
      54(6). Microenterprise there is a defined term, tested by Commission Recommendation
      2003/361/EC rather than by self-description. An Article 50 system is outside the Art. 2(12)
      exclusion before any of those conditions is reached, and none of the other three exceptions
      reaches an Article 50 duty at all. So being unmonetised, being a microenterprise and
      publishing on a public repository change nothing here, in either direction. Commission
      Guidelines C(2026) 5054 final — draft approval, not yet applicable, interpretation only — say
      the same at para. 23 of the Annex: providers and deployers of open-source AI systems within
      the scope of Article 50 still have to meet their respective transparency obligations. Its
      footnote 11 anchors the free and open-source release on recital 102, not on recital 103.
      Neither of those two Guidelines propositions is quoted here or carries a quote receipt: the
      quote checker does not fetch guidance documents, and this entry's url resolves to the
      Regulation, which does not contain them — the Guidelines have a separate entry in this rule's
      legal_basis, carrying their own source link and their own not-yet-applicable status. Only the
      single-quoted Art. 2(12) sentence above is machine-verified against the Official Journal. How
      the system was released is a question for the person running the scan rather than for a
      detector, read from the terms the system is actually released under, and a LICENSE file is
      evidence about it rather than the answer. The Art. 2(12) quotation above is the text the four
      ai-annex3 Article 6(4) checklists carry, re-verified against the same Official Journal source
      on 2026-08-04. Those four quote recital 103 in full as well, because the Art. 2(12) exclusion
      becomes available on an Annex III row only once the Article 6(4) derogation takes the system
      out of high-risk — the proviso names high-risk systems first, so until then the exclusion is
      as unavailable there as it is here — and the monetisation test then decides whether it
      applies; on an Article 50 row it decides nothing, which is why it is not repeated here.
      Reference only: a scope provision establishes no duty of its own, and this one removes none
      from this rule."
    url: http://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-08-04
    jurisdiction: EU

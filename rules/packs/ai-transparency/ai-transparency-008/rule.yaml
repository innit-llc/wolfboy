settling_questions:
  - operator.ai_text_public_interest
context_questions:
  - "Which role does the scanned party hold for the text-generating system — provider (AI Act Art.
    3(3)) or deployer (Art. 3(4))? Art. 50(4) second subparagraph is owed by the DEPLOYER: the party
    using the system under its own authority, which for a hosted model API is whoever calls it on
    its own credentials to produce text it then publishes. Answer from the codebase, because the
    same repository can be neither. A repository that ships a CMS plugin, an SDK, an integration
    catalogue, a template or a client library exposing text generation to its own users is a
    conduit: it exposes no reader to any published text of its own, and the deployer is whoever
    installs and runs it downstream. A repository that develops a text-generation system and puts it
    on the market under its own name or trademark is a provider, and providers carry Art. 50(1) and
    Art. 50(2) instead, which are ai-transparency-001 and the (uncovered) synthetic-text half of
    Art. 50(2), not this rule. Quote the credential handling, the call path and the publishing
    surface that settle which role this repository holds, and say plainly if the answer is neither
    because nothing here ever reaches a reader."
  - "Is the text this code produces actually PUBLISHED, in the sense of Commission Guidelines
    C(2026) 5054 final para. 131(i) — accessible by an indeterminate, fairly large number of
    unrelated potential readers, simultaneously or successively, whether or not against payment?
    Trace the delivery path from the generation call to the surface a reader reaches and quote both
    ends. Several near neighbours are outside: text restricted to a closed, private group; private
    interpersonal correspondence including professional correspondence; organisation-internal texts
    such as posts on an internal corporate network or a staff wiki; a chatbot answer visible only to
    the user who prompted it, which the Guidelines list as an out-of-scope example even when it
    summarises the news; drafts held for review that never leave the editor; and internal reports,
    log summaries and commit messages. A subscription paywall does NOT take a text outside, and
    neither does a small readership on its own."
  - Does the published text aim to INFORM THE PUBLIC ON MATTERS OF PUBLIC INTEREST? This is the
    judgement the detector cannot make and the main reason a candidate here is often dismissed.
    Commission Guidelines para. 131(ii) asks whether the text intends to communicate knowledge,
    opinions or facts, so short strings that do not materially do so are outside. Para. 131(iii)
    describes matters of public interest as those relevant to society at large at local, national,
    Union or international level and meriting public debate or scrutiny, and lists politics and
    democratic processes, public administration and services, the administration of justice and law
    enforcement, the protection of fundamental rights, public security, public health, environmental
    protection, consumer safety, and economic, financial, political, scientific or cultural
    developments that may be a relevant subject of public debate. The Commission's own in-scope
    examples are an AI-generated summary of a newspaper article about a town council decision,
    AI-manipulated parts of a lifestyle-website article on diets and disease, AI-manipulated
    corporate reports carrying investor information on a listed company's website, and an
    AI-generated storm warning on a meteorological institute's social media profile. Its
    out-of-scope examples are AI-generated fantasy novels, AI-manipulated advertisement or
    product-description text that makes no health, consumer-safety or sustainability claim, and a
    consultant's AI-manipulated client advice. Marketing copy, release notes, SEO landing pages,
    product descriptions, changelogs and support articles will usually sit outside — but say which
    side the evidence puts this text on and quote the topic, the audience and the publication
    surface rather than assuming.
  - "Does the editorial exemption in the second half of the paragraph apply? It has TWO CUMULATIVE
    conditions and each has to be evidenced separately: (i) the AI-generated or manipulated text has
    undergone a process of human review or editorial control, AND (ii) a natural or legal person
    holds editorial responsibility for the publication. Review on its own is not enough. Commission
    Guidelines paras 134-135 read human review as deliberate examination of the substance by one or
    more natural persons with relevant knowledge and professional judgement, with fact-checking as a
    minimum, and editorial control as control exercised in practice by a responsible editorial
    entity with authority to approve, alter or reject the substance on substantive grounds; they
    exclude superficial, solely formal or procedural checks such as spell-checking or grammatical
    correction, the mere existence of an editorial policy, automated review processes, and cursory
    approval without substantive engagement. Para. 136 adds that where an AI system modifies,
    supplements or reformulates content AFTER editorial sign-off the result is treated as
    AI-generated again and the exemption becomes void, so look at the order of operations in the
    pipeline: a scheduled rewrite, a translation pass or an SEO pass running after approval defeats
    it. Para. 138 reads editorial responsibility as ultimate legal responsibility over the
    publication, whose holder's identity and contact details should be publicly available in an
    easily findable place. In the code this shows up as an approval state machine with a named human
    approver, a review queue with a substantive decision recorded, an editor role with reject
    authority, or a masthead or colophon page — not as a `status: published` column or an
    auto-approve default. Quote what you find, in the order it runs, and record which of the two
    conditions is unevidenced if either is."
  - "Does the law-enforcement exemption apply — is the use authorised by law to detect, prevent,
    investigate or prosecute criminal offences? Read it narrowly. Commission Guidelines para. 139
    routes this to paras 46-48: 'authorised by law' comprises Union law and national law adopted in
    compliance with it, the authorising law must clearly specify the purposes and circumstances of
    the permitted use and provide appropriate safeguards for the rights and freedoms of third
    parties, and where the same system is also deployed for ordinary purposes the transparency duty
    continues to apply to those. The Commission's own example is an AI-generated police warning
    about a terrorist threat published on social media. Commercial fraud messaging, content
    moderation, abuse reporting and a general security framing do not reach it. Quote whatever is
    being relied on."
  - 'Is the fact that this text was artificially generated actually communicated to the READER of
    the published page, in a clear and distinguishable manner (Art. 50(5)), or does the codebase
    only record it internally? The detector performs no absence check at all — it raises the
    candidate on the generation and publication paths and leaves this entire question to you — so
    the search is yours to do and yours to report. Look in the places a label ships from rather than
    the places a flag is stored: post and article templates, the layout and byline components that
    wrap every item, MDX and front-matter renderers, feed and newsletter serialisers, AMP, print and
    social-card templates, i18n and locale bundles, and the CMS field definitions that feed them.
    Follow the render path rather than the data path, because the label usually sits in the layout
    rather than in the file that generated the text. Then weigh what you found against Commission
    Guidelines paras 132 and 142: the disclosure must be clear, distinguishable and perceivable by a
    natural person without specific technical tools or dedicated actions, and information that can
    be easily overlooked under normal exposure — only in a manual, hidden under layers of menu
    options, or buried in terms of use — does not meet that standard. Three shapes look like a
    disclosure and are not, and all three appear in real repositories: an internal flag such as an
    `ai_generated` or `is_ai` boolean, a `generated_by` or `model` column or a metadata key that no
    template renders, which records the fact for the operator and tells the reader nothing;
    machine-readable provenance such as a C2PA or Content Credentials manifest, a schema.org or Open
    Graph property or an HTML meta tag, which answers the separate Art. 50(2) provider duty and is
    precisely the specific technical tool para. 132 says a reader must not need; and an identifier
    or i18n key named for a disclosure — `AiDisclosureBadge`, `AIGeneratedLabel`,
    `t("post.aiNotice")` — whose rendered string you have not read, where a two-word `AI-generated`
    badge on a published article and the `<option>AI-generated</option>` of an admin filter listing
    model-written posts are indistinguishable until you open the surrounding surface. Quote the
    string that ships to the reader and where it renders, or record the absence together with the
    places searched.'
  - If a disclosure exists, does it reach the reader in the right manner and at the right moment?
    Art. 50(5) requires the information in a clear and distinguishable manner at the latest at the
    time of first exposure, and to conform to the applicable accessibility requirements. Commission
    Guidelines para. 143 gives the worked example for this paragraph as disclosure 'at the start of
    an AI-generated or manipulated text publication on matters of public interest', and applies the
    duty to each output with respect to any natural person exposed to it — so a label rendered on
    the article page but stripped from the RSS item, the AMP page, the newsletter send, the
    syndication feed or the social card is a partial answer, and one that only appears after a click
    or below the fold may be missed. Quote where the label renders and where it does not.
  - When was this text generated, and when is it published? Commission Guidelines para. 154 records
    that text AI-generated and published before 2026-08-02 does not need to be labelled
    retroactively, but that text generated or manipulated before that date and published on or after
    it does. For a scheduled queue, a backfill job or a static site rebuilt from an existing content
    directory, the publication date is the one that matters. Quote the scheduling or build path if
    either exists.
  - "CODE OF PRACTICE, AND WHO ANSWERS THIS. Is the scanned party a signatory of the Code of
    Practice on Transparency of AI-generated Content, and if it is, does the marking or labelling in
    this code follow the Code measures it signed up to? SOURCE CODE CANNOT ANSWER THE FIRST HALF,
    and no detector should try: whether a party has signed is a fact about the operator, held on the
    Commission signatory list and in the party's own declarations, not in its source vocabulary. Ask
    the person running the scan, or read it from the operator's declared documents. THE ANSWER
    CHANGES ONLY HOW THIS FINDING IS WORDED, NEVER WHETHER THIS CANDIDATE IS REPORTED. A signatory
    has an EU-wide recognised way of demonstrating compliance with the Art. 50(2) and Art. 50(4)
    duties, because enacted AI Act Art. 50(7) confines the adequacy assessment to 'the obligations
    laid down in paragraphs 2 and 4 of this Article'. Commission Opinion C(2026) 4839 final para. 52
    words its own conclusion over Articles 50(2), (4) and (5); that is the Opinion's wording and not
    the statutory scope, and Art. 50(5) is in any case the manner-of-provision requirement attaching
    to the information Art. 50(2) and (4) require rather than a separate duty. Ask a signatory which
    Code measures the code path here implements; a non-signatory is expected to show that its own
    means are adequate. The Commission concluded that adherence to the Code is not conclusive
    evidence of compliance either way, so neither answer disposes of the finding. If the answer is
    not known, say so and word the finding without it."
  - "WHO ANSWERS WHETHER SUCH TEXT IS PUBLISHED AT ALL? Whether the organisation that runs this
    product publishes text that AI generated or manipulated, with the purpose of informing the
    public on matters of public interest, is a fact about that organisation: the person running the
    scan is asked it as the AI text question, ScanProfile.operator.ai_text_public_interest, and the
    code never decides it. Where the finding stands or falls on that fact - context questions 2 and
    3 - write it as waiting on operator.ai_text_public_interest, whether or not it has been
    answered, and let the program apply the answer; quote what the code shows about publication and
    subject matter, and where it contradicts the person's answer, say so in the reasoning. The
    answer settles context questions 2 and 3 and nothing else: the editorial exemption (question 4),
    the law-enforcement exemption (question 5) and whether and how the reader is told (questions 6
    and 7) stay yours, so where one of those decides the finding, answer it instead of waiting. The
    answer concerns the text limb of Art. 50(4), the only limb this rule tests, and says nothing
    about deep fakes, which are the paragraph's first subparagraph."
evidence_template: "{file}:{line} matched one of this rule's 26 patterns. They fall into three
  groups and the detector matches each group on its own: a language-model call, SDK import, endpoint
  host, model name or dependency declaration; a publishing surface - a headless-CMS write call, a
  content collection, front matter, a markdown content path, a site-generator configuration or a
  feed; or wording that names generated content, an automated publishing pipeline, or a newsroom or
  editorial function. Nothing joins the three: this rule declares no same-file corroboration,
  deliberately, so a match on any one group alone raises the candidate and the detector did not
  establish that AI-generated text reaches a published surface. READ THE LOCATIONS BEFORE ACCEPTING
  THE HEADLINE - this rule raises one finding per repository, and a candidate can rest entirely on
  the publishing group with no model call anywhere in it, or the other way round. The detector makes
  no finding about whether a disclosure exists and none about the subject matter — whether the
  reader is told is context question 6, and whether the text informs the public on matters of public
  interest is context question 3"
remediation_template: >
  Settle the role first. AI Act Art. 50(4) second subparagraph is owed by the deployer (Art. 3(4)) —

  the party using the text-generating system under its own authority over its own publication — and

  not by the vendor whose model is called, nor by a project that only ships a CMS plugin, an SDK or
  a

  template for others to run. A natural person publishing in a purely personal non-professional

  activity sits outside deployer obligations altogether (Art. 2(10)).

  Then settle whether the text is in scope at all, because the paragraph is narrow: it reaches text

  that is published to an indeterminate readership AND aims to inform the public AND concerns
  matters

  of public interest. Marketing copy, product descriptions without health, safety or sustainability

  claims, fiction, and a chatbot answer visible only to the person who asked are outside it. Where
  the

  answer is yes, the two engineering routes are these, and only one of them ends in a label.

  Route A - keep the human in the loop, and keep them there last. The exemption needs both limbs:

  substantive human review or editorial control (a named person with relevant knowledge examining
  the

  substance, fact-checking included; a spell-check, an auto-approve default or an editorial policy

  document does not reach it) and a natural or legal person holding editorial responsibility for the

  publication, whose identity and contact details are findable — a masthead, colophon or imprint
  page.

  Order matters more than most teams expect: any AI step that modifies, supplements or reformulates

  the text after sign-off puts the text back in scope, so a post-approval rewrite, translation or
  SEO

  pass belongs before the review gate rather than after it.

  Route B - label the output where the reader meets it. Put the disclosure in the layout or byline

  component that wraps every published item rather than in one template, and carry it into every

  surface the same item reaches: the article page, the RSS and Atom items, the newsletter send, the

  AMP and print views, the syndication payload and the social card. What ships is a sentence a
  reader

  sees - "This article was generated by AI", "This summary was written using a language model",
  "This

  text has been artificially generated" - rendered next to the byline or at the head of the item,
  not

  a name in the code. Art. 50(5) asks for it clearly and distinguishably, at the latest at first

  exposure, conforming to the applicable accessibility requirements. Four things that look like the

  answer and are not: a boolean column such as ai_generated or is_ai, or a generated_by / model
  field,

  that no template reads; a C2PA or Content Credentials manifest, a schema.org property or an HTML

  meta tag, which is machine-side and answers the separate Art. 50(2) duty instead; a component or

  i18n key named AiDisclosure or aiGeneratedLabel whose string is never rendered; and a paragraph in

  the terms of use, which is where the Commission's guidance says information gets missed. Keeping

  machine-readable provenance is still worthwhile, and it may answer Art. 50(2) if this party is
  also

  the provider of the generating system.

  One migration note: text generated before 2026-08-02 but published on or after it needs the label,

  so a scheduled queue, a backfill or a static rebuild from an existing content directory is the
  case

  to check first. Art. 50 applies to EU-facing deployments from 2026-08-02, at the Art. 99(4)(g)
  tier.

  Releasing this under a free and open-source licence does not remove the duty: Art. 2(12) withholds
  that

  exclusion from AI systems placed on the market or put into service as systems falling under
  Article 5 or 50,

  and Article 50 is the article this finding sits under. Neither does the way the project is funded.
  Recital

  103's monetisation test narrows the Art. 2(12) exclusion, and an Article 50 system does not have
  that

  exclusion to narrow, so being unmonetised, being a microenterprise and publishing on a public
  repository

  leave this duty exactly where it is.
data_categories: []

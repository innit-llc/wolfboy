id: recipients-006
pack: recipients
short_name: Analytics, avatar or monitoring company that may get data
problem_line:
  text: Personal data sent to an external service
  template: "{data} sent to {recipient}"
fix_line: "Unless you publish and host this service, record it as a recipient: what it receives and
  the company you contract with."
title: Analytics, avatar-image, audit-log, session-replay or error-monitoring vendor named in the
  tree, or a digest taken over an email address with no vendor on the line
jurisdiction:
  - EU
  - US
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 30(1)(d) - the record of processing activities "shall
      contain all of the following information", including "the categories of recipients to whom the
      personal data have been or will be disclosed including recipients in third countries or
      international organisations"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(2) - \"Each processor and, where applicable, the
      processor's representative shall maintain a record of all categories of processing activities
      carried out on behalf of a controller, containing: (a) the name and contact details of the
      processor or processors and of each controller on behalf of which the processor is acting,
      and, where applicable, of the controller's or the processor's representative, and the data
      protection officer; (b) the categories of processing carried out on behalf of each controller;
      (c) where applicable, transfers of personal data to a third country or an international
      organisation, including the identification of that third country or international organisation
      and, in the case of transfers referred to in the second subparagraph of Article 49(1), the
      documentation of suitable safeguards; (d) where possible, a general description of the
      technical and organisational security measures referred to in Article 32(1).\" Reference only,
      and cited for one purpose: there is no categories-of-recipients field in a processor's record,
      so where the scanned product is a processor the recipient category belongs in the
      customer-controller's Art. 30(1)(d) record instead"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
    supports_rule_condition: false
  - cite: 'GDPR (Regulation (EU) 2016/679), Art. 4(9) - "recipient" means "a natural or legal person,
      public authority, agency or another body, to which the personal data are disclosed, whether a
      third party or not". Reference only: a definition establishes no duty of its own. Note
      "natural or legal person" - one vendor in these lists is operated by a named individual rather
      than by a company, and the definition covers that expressly'
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1) - \"personal data\" means \"any information
      relating to an identified or identifiable natural person ('data subject'); an identifiable
      natural person is one who can be identified, directly or indirectly, in particular by
      reference to an identifier such as a name, an identification number, location data, an online
      identifier or to one or more factors specific to the physical, physiological, genetic, mental,
      economic, cultural or social identity of that natural person\". Reference only: a definition
      establishes no duty of its own"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
    supports_rule_condition: false
  - cite: California Consumer Privacy Act, Cal. Civ. Code Sec. 1798.110(a)(4) (Title 1.81.5, as amended
      by the California Privacy Rights Act) - a consumer may request that a business disclose "The
      categories of third parties to whom the business discloses personal information." The
      obligation is owed on a verifiable consumer request under Sec. 1798.110(b), and Sec.
      1798.130(a)(5)(B) requires the same categories in the privacy policy
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.110.
    checked_at: 2026-08-25
    jurisdiction: US
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.3

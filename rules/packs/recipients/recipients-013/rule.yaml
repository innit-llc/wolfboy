  class: mixed
  limbs:
    - question: 1
      class: per-location
    - question: 2
      class: enumeration
      item: channel and its shipped default
      item_source: reading
    - question: 3
      class: enumeration
      item: identifier in the message body
      item_source: reading
    - question: 4
      class: enumeration
      item: field of the message body
      item_source: reading

id: recipients-013
pack: recipients
short_name: Usage-report address, call, ID header or default-on setting
problem_line:
  text: Usage reports sent to an address set in the product
fix_line: Record and disclose who runs the address and what is sent, and consider an off default and
  no lasting ID.
title: Telemetry from server or desktop code to a first-party or operator-configured endpoint -
  installation identifiers and an on-by-default setting; recipient and basis need review
jurisdiction:
  - EU
  - US
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 30(1)(d) - the controller's record of processing
      activities "shall contain all of the following information", including "the categories of
      recipients to whom the personal data have been or will be disclosed including recipients in
      third countries or international organisations". A first-party telemetry channel sent from the
      product's own server or desktop binary has a recipient by construction - the operator of the
      address the payload is posted to - and the address is ordinarily a constant compiled into the
      product rather than anything the deployment chose
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 13(1)(e) - where personal data are collected from the
      data subject, the controller shall, at the time when personal data are obtained, provide the
      data subject with "the recipients or categories of recipients of the personal data, if any".
      Cited for the desktop case, where the person operating the product is the data subject and the
      identifier travels from that person's own machine as they use it
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 14(1)(e) - where personal data have not been obtained
      from the data subject, the controller shall provide the data subject with \"the recipients or
      categories of recipients of the personal data, if any\". Cited beside Art. 13(1)(e) because a
      server-side ping is usually not a collection from the data subject at all: the deployment's
      own process assembles and sends it, and the person whose record identifier or user name rides
      along took no step towards the vendor"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: 'GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be "adequate, relevant
      and limited to what is necessary in relation to the purposes for which they are processed".
      Cited for the identifier rather than for the channel: a telemetry payload that answers how
      many installations exist needs a counter, and one that carries an identifier which survives a
      restart answers a different and larger question about one installation over time'
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 6(1) - "Processing shall be lawful only if and to the
      extent that at least one of the following applies". Cited AS THE QUESTION and not as an
      answer. Which ground carries a disclosure to the vendor is a deployment fact this detector
      does not read, and an operator who left an on-by-default setting alone has not thereby chosen
      one; nothing in this rule's output may read as though the question had been settled
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(9) - \"recipient\" means \"a natural or legal person,
      public authority, agency or another body, to which the personal data are disclosed, whether a
      third party or not\". Reference only: a definition establishes no duty of its own. It is cited
      because the destination this rule matches is not always the vendor - an operator-configured
      collector is frequently the deployment's own host, in which case there is no disclosure to
      anybody outside the controller - and the definition rather than intuition is what decides
      that"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "California Consumer Privacy Act, Cal. Civ. Code Sec. 1798.110(a)(4) (Title 1.81.5, as amended
      by the California Privacy Rights Act) - a consumer may request that a business disclose \"The
      categories of third parties to whom the business discloses personal information.\" The
      obligation is owed on a verifiable consumer request under Sec. 1798.110(b), and Sec.
      1798.110(c)(4), disclosed pursuant to Sec. 1798.130(a)(5)(B), requires the same categories in
      the privacy policy. PINPOINT CORRECTED 2026-09-01 (D11, independent adversarial verification):
      the earlier wording routed the privacy-policy limb through Sec. 1798.130(a)(5)(B) alone, which
      read on its own enumerates categories of personal INFORMATION rather than categories of third
      parties. NOT MACHINE-VERIFIED AND SAID SO: this rule's quote-verification receipt marks this
      span unverifiable, because Californian law is outside the fetch path of the tool that checks
      quotations against official texts; the correction is from knowledge of the statute rather than
      from a fetched text, and it should be confirmed against the code or by a lawyer before it is
      treated as settled"
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.110.
    checked_at: 2026-09-10
    jurisdiction: US
effective_date: 2018-05-25
sunset: null
superseded_by: null
severity: medium
rule_confidence: 0.5

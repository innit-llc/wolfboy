id: recipients-007
pack: recipients
short_name: Cloud region the data is stored in
problem_line:
  text: Cloud region setting for personal data in this code
fix_line: Confirm the region each service touching personal data runs in, and record any
  third-country transfer that follows.
title: Cloud region configured in this tree - where the deployment is set to put data, for Art. 30(1)(e)
jurisdiction:
  - EU
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 30(1)(e) - each controller's record of processing
      activities shall contain "where applicable, transfers of personal data to a third country or
      an international organisation, including the identification of that third country or
      international organisation and, in the case of transfers referred to in the second
      subparagraph of Article 49(1), the documentation of suitable safeguards". A cloud region
      written into a configuration file is evidence about the first limb - which country - and about
      nothing else in the sentence
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(2)(c) - each processor's record shall contain
      \"where applicable, transfers of personal data to a third country or an international
      organisation, including the identification of that third country or international organisation
      and, in the case of transfers referred to in the second subparagraph of Article 49(1), the
      documentation of suitable safeguards\". Reference only: it is cited so that the record
      instruction can fork on which of the two records the scanned product keeps, rather than naming
      a field that may not exist in it"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
    supports_rule_condition: false
  - cite: 'GDPR (Regulation (EU) 2016/679), Art. 30(5) - "The obligations referred to in paragraphs 1
      and 2 shall not apply to an enterprise or an organisation employing fewer than 250 persons
      unless the processing it carries out is likely to result in a risk to the rights and freedoms
      of data subjects, the processing is not occasional, or the processing includes special
      categories of data as referred to in Article 9(1) or personal data relating to criminal
      convictions and offences referred to in Article 10." Reference only: this provision removes a
      duty rather than creating one, and every fact it turns on is an operator fact'
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-25
    jurisdiction: EU
    supports_rule_condition: false
  - cite: 'California Consumer Privacy Act, Cal. Civ. Code Sec. 1798.110(a)(4) (Title 1.81.5, as amended
      by the California Privacy Rights Act) - a consumer may request that a business disclose "The
      categories of third parties to whom the business discloses personal information", and Sec.
      1798.130(a)(5)(B) requires the same categories in the privacy policy. Reference only, and
      cited to mark a limb this rule does NOT claim: the Californian duty is about WHICH PARTIES
      receive personal information, and a configured cloud region establishes a PLACE rather than a
      party. `recipients-001` to `recipients-006` carry the Californian limb because they name
      parties; this rule does not name one'
    url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.110.
    checked_at: 2026-08-25
    jurisdiction: US
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.12

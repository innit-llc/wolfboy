context_questions:
  - "ASK THE PERSON RUNNING THE SCAN, do not conclude it from the code: \"Which cloud region does
    this deployment actually store and process personal data in, for each service - object storage,
    database, queue, functions, CDN - and where is that value set?\" The answer is very often NOT IN
    THIS REPOSITORY: it is set in a cloud console, in a deployment platform's dashboard such as
    Vercel, Fly or Render, in a Kubernetes secret, or in a secrets manager, and a tree that carries
    no region at all can still be pinned to one. A value that IS in the tree may be a default that
    production overrides. If the operator cannot say, return needs_human rather than reading the
    answer out of the source."
  - "WHAT SHAPE IS THE MATCHED LINE? Name it before treating it as a fact about this deployment. Six
    shapes reach this rule and three of them are evidence about where the data goes: (a) a
    configuration key with a value (`region = \"eu-west-1\"` in a Terraform provider block,
    `AWS_REGION=eu-central-1` in an environment file, `location: europe-west4` in a values file);
    (b) a configuration key whose value is supplied elsewhere (`region = var.aws_region`, `region:
    ${AWS_REGION}`, `region: process.env.AWS_REGION`) - this establishes that the knob exists and
    says NOTHING about which region, which is question 1's; (c) a hostname carrying a region
    (`s3.eu-west-1.amazonaws.com`, `nyc3.digitaloceanspaces.com`), which is the strongest form
    because a hostname is neither a menu nor a default. The other three are not evidence about this
    deployment: (d) a MENU - a picker, a dropdown, a translation catalogue or an enumeration
    offering the product's own users every region a vendor has, which says what the product permits
    and not what it does; (e) a vendored SDK's own data files and generated models; (f) a test
    double or a sample file. Quote the line and say which of the six it is."
  - "IS THE MATCHED TEXT A REGION AT ALL? These identifiers are short and this detector is
    deliberately wide, so a share of what it raises is a collision rather than a region. Six shapes
    to dismiss by reading the line, and the first four were MEASURED on real repositories rather
    than imagined: (a) an Azure region name inside an ordinary compound - `eastasia` matches inside
    `majorFontEastAsian`, and `southeastus` inside `southeastusers`; (b) a Cloudflare location hint
    inside a word - `enam` matches inside the POSIX constant `ENAMETOOLONG` and inside the Malay
    word for six; (c) `region` naming a region of a PAGE rather than of a cloud - an HTML
    `data-region` attribute is the largest single family of this kind; (d) `region` in its ordinary
    sense for a sales territory, a continent in a dataset of countries, or an analytics dimension
    for where a visitor was; (e) `zone` meaning a DNS zone or a time zone, and `location` meaning
    where a person, a job or an event is - which is why a bare `location` key does not reach this
    rule at all; (f) an airport-style three-letter code that is data rather than a data centre. Say
    so plainly and dismiss it; a collision is a cost of casting wide, not a defect to argue around."
  - WHICH SERVICE DOES THIS REGION GOVERN, AND DOES PERSONAL DATA REACH IT? A region pinned on an
    object store that holds user uploads, on a database that holds accounts, on a queue that carries
    event payloads or on a log sink is a fact about where personal data sits. The same region pinned
    on a build cache, a container registry, a public asset bucket or a metrics endpoint may not be.
    Read the surrounding block and name the service, then say what the service holds. Where one
    repository configures SEVERAL services in SEVERAL regions, record each separately - this rule
    reports one candidate per repository and the evidence array is where the separation lives.
  - "WHICH RECORD DOES THIS FACT BELONG IN, AND IN WHICH FIELD? The two records are different and
    have different fields. Where the scanned product is a CONTROLLER, the country goes in Art.
    30(1)(e), which asks for transfers to a third country \"including the identification of that
    third country or international organisation\". Where it is a PROCESSOR - the ordinary shape of a
    multi-tenant product hosting its customers' data - its own record is the Art. 30(2) record and
    its transfer field is Art. 30(2)(c), which asks for the same identification. Both fields open
    with \"where applicable\": they are owed where a transfer to a third country occurs, and a
    deployment entirely inside the EEA fills them with nothing. Settle which record the product
    keeps before writing anything, and if that is not established, say so rather than choosing one."
  - "DO NOT ANSWER THE SAFEGUARDS QUESTION FROM THIS FINDING. Both transfer fields have a second
    limb - the documentation of suitable safeguards - and it is conditional: it is owed only \"in
    the case of transfers referred to in the second subparagraph of Article 49(1)\", the
    compelling-legitimate-interests derogation. Whether a transfer to the region named here meets
    Chapter V at all, and on what basis, is a separate question that turns on the operator's
    contracts and on an adequacy decision this detector has not read. This rule establishes WHERE
    the deployment is configured to put data and nothing else. Record the place; leave the
    assessment to whoever holds the contracts."
  - "DOES THE ART. 30 RECORD DUTY APPLY TO THIS ORGANISATION AT ALL? Art. 30(5) switches it off for
    an enterprise or organisation employing fewer than 250 persons UNLESS any one of three things is
    true: the processing is likely to result in a risk to the rights and freedoms of data subjects,
    the processing is not occasional, or it includes special categories of data under Art. 9(1) or
    criminal-conviction data under Art. 10. Storing user accounts and uploads on a continuing basis
    is not occasional, so the exemption often does not survive - but headcount and regularity are
    facts the operator supplies, not facts in the tree. If the operator has not supplied them, say
    so rather than assuming either way."
  - DOES THIS REGION AGREE WITH WHAT THE OPERATOR HAS ALREADY WRITTEN DOWN? That is the gap this
    rule exists to find, and it is answered by reading the operator's own declared documents against
    the code - the record of processing activities, the privacy policy, the data-processing
    agreement, the subprocessor list and any data-residency promise made to customers. A policy that
    says data is held in the European Union beside a tree that pins `us-east-1` is a contradiction
    worth reporting as one, and so is a record whose transfer column is empty beside a tree that
    names a region outside the EEA. A record that already carries the country, with the operator's
    answer to question 1, is not a finding at all.
evidence_template: "{file}:{line} carries a string that names A CLOUD REGION OR A REGION-BEARING
  ENDPOINT - the place a service is configured to run in. That is the whole of what the detector
  established, and the sentence is written this way on purpose. WHERE THAT SERVICE HOLDS DATA, the
  place named is where the data sits; where the region governs COMPUTE rather than storage - a
  function's execution region, a build runner, a monitoring probe's location, an edge point of
  presence - it says where the work happens and not by itself where anything is kept, and context
  question 4 is the one that separates the two. THE REGION STRING IS A CODE FACT: it is written in
  the repository, it is quotable, and the line is above. WHETHER IT IS THE REGION THIS DEPLOYMENT
  USES IS A DEPLOYMENT FACT AND IS NOT ESTABLISHED. A repository can carry a default that production
  overrides, a value in a sample environment file nobody deploys, a region in a
  continuous-integration workflow that is not the production one, a menu of thirty regions the
  product offers its own users, a vendored SDK's own data tables - or nothing at all, because the
  operator set the region in a cloud console, a deployment platform's dashboard or a secrets
  manager, in which case the true answer is not in this tree and cannot be put there. Context
  question 1 asks the operator which region each service actually uses and where the value is set;
  context question 2 names the six shapes a matched line takes and asks which one this is. What the
  detector also did NOT establish: whether any personal data reaches the service the region governs,
  who operates it, and whether a transfer to that place meets the conditions of Chapter V - that
  last one is a separate question this rule does not ask and its answer is not to be inferred from
  anything here. The fact this finding is for is the identification of the country in the record's
  transfer field, Art. 30(1)(e) where the product keeps a controller's record and Art. 30(2)(c)
  where it keeps a processor's. Finally, these identifiers are short and this detector is
  deliberately wide: an Azure region name matches inside a longer word, `region` is also an ordinary
  English noun, and a three-letter code is sometimes just data. Read the line before treating it as
  configuration"
remediation_template: |
  Read the matched line first and decide what it is, because six shapes reach this rule and only
  three of them say anything about where this deployment puts data: a configuration key with a
  region value, a configuration key whose value comes from somewhere else, and a hostname carrying a
  region. A picker or a translation catalogue offering every region a vendor has, a vendored SDK's
  own data tables, and a test double are the other three, and none of them puts data anywhere.
  If it is one of the three, the work is a question and then a record entry, in that order.
  Ask whoever deployed this product which region each service that touches personal data actually
  runs in - object storage, database, queue, functions, log sink, CDN - and where that value is set.
  For a large share of deployments the answer is not in the repository at all: it is in a cloud
  console, in a deployment platform's dashboard, or in a secrets manager, and no amount of reading
  the tree will produce it. A default written in the source is what the code proposes, not what the
  deployment does.
  Then write the answer into the record's transfer field, and settle which record that is first.
  Where the scanned product is a CONTROLLER the field is Art. 30(1)(e); where it is a PROCESSOR its
  own record is the Art. 30(2) record and the field is Art. 30(2)(c). Both ask for the same thing
  in the same words - the identification of the third country or international organisation - and
  both are owed only "where applicable", so a deployment entirely inside the EEA fills them with
  nothing and says so. The second limb of each, the documentation of suitable safeguards, is
  conditional on the transfer resting on the second subparagraph of Article 49(1), so do not go
  looking for that documentation on a transfer resting on an adequacy decision or on standard
  contractual clauses.
  Write the country rather than the region code. `eu-west-1` is a code an auditor should not have to
  decode; "Ireland" is the fact the field asks for. Where one product runs services in several
  regions, write each service and its country, because a single line saying "EU" is untrue of the
  log sink that sits in Virginia.
  Two engineering changes make this fact durable, and both are worth more than a one-off answer.
  First, put the region in exactly one place per environment - a variable, a values file, a
  parameter - and read it from there, so that the record has one thing to point at instead of nine.
  Second, where a data-residency promise has been made to customers, make it checkable: a startup
  assertion that the configured region is in the promised set turns a paragraph in a contract into
  something that fails a deployment instead of failing an audit.
  Do not delete the region setting in order to close the finding. Removing the knob does not move
  the data; it moves it to whatever default the SDK picks, which for the AWS SDKs is a region the
  code no longer names. A destination written down is a better answer than one nobody can see.

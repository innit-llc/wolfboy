id: recipients-014
pack: recipients
short_name: Visitor IDs shared and matched with another company
problem_line:
  text: Visitor identifiers synced with other companies
  template: "{data} synced with {recipient}"
fix_line: Ask consent before the first sync, show people every counterpart, and record the table and
  its lifetime.
title: Cross-party identifier sync - a minted redirect with a placeholder for the counterpart's
  identifier, a per-counterpart pseudonym table on the terminal equipment, or its callback
jurisdiction:
  - EU
legal_basis:
  - cite: "ePrivacy Directive 2002/58/EC, Art. 5(3) as amended by Directive 2009/136/EC, quoted from the
      consolidated Official Journal text at CELEX 02002L0058-20091219: \"Member States shall ensure
      that the storing of information, or the gaining of access to information already stored, in
      the terminal equipment of a subscriber or user is only allowed on condition that the
      subscriber or user concerned has given his or her consent, having been provided with clear and
      comprehensive information, in accordance with Directive 95/46/EC, inter alia, about the
      purposes of the processing\". Cited because the correspondence table this construct builds is
      kept in the subject's own browser, and every callback both stores into it and gains access to
      what is already there. Which national transposition applies, and whether any exemption in the
      second subparagraph is in play, are questions this detector does not reach"
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02002L0058-20091219
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 30(1)(d) - the controller's record of processing
      activities "shall contain all of the following information", including "the categories of
      recipients to whom the personal data have been or will be disclosed including recipients in
      third countries or international organisations". Cited because each counterpart the product
      mints a redirect for is a recipient of the subject's pseudonym at the moment the browser
      follows that redirect, and the number of counterparts is usually the number of configuration
      files rather than a number anyone has written into a record
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 13(1)(e) - where personal data are collected from the
      data subject, the controller shall, at the time when personal data are obtained, provide the
      data subject with "the recipients or categories of recipients of the personal data, if any".
      Cited because the disclosure happens in the subject's own browser at sync time, which is the
      moment the information duty attaches to
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 14(1)(e) - where the personal data have not been
      obtained from the data subject, the controller shall provide the data subject with \"the
      recipients or categories of recipients of the personal data, if any\". Cited beside Art.
      13(1)(e) because the identifier a counterpart returns was not obtained from the subject at
      all: it is the counterpart's own pseudonym for this browser, written into the subject's device
      by the product"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
  - cite: 'GDPR (Regulation (EU) 2016/679), Art. 26(1) - "Where two or more controllers jointly
      determine the purposes and means of processing, they shall be joint controllers", and they
      "shall in a transparent manner determine their respective responsibilities for compliance with
      the obligations under this Regulation". Reference only, and cited AS A QUESTION rather than as
      an answer: whether the product and each counterpart jointly determine the purposes and means
      of the linkage is a fact about an arrangement, decided by reading the contracts and the
      deployment, and no line this detector matches decides it. Context question 5 is where it is
      asked'
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: 'GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be "adequate, relevant
      and limited to what is necessary in relation to the purposes for which they are processed".
      Reference only: this detector establishes no purpose and cannot. It is cited because the table
      grows one entry per counterpart the product is configured for, whether or not that counterpart
      is ever used for the subject in question, and the size of the table is a design choice that
      the minimisation question is asked of'
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-10
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: high
rule_confidence: 0.45

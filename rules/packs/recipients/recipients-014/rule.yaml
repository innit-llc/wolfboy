  match:
    - (?:^|[^A-Za-z0-9_])[A-Za-z0-9_]{0,12}(?&counterpart_id_macro_keys)
    - "[?&](?&pseudonym_param_names)\\s*=\\s*[\"'`]?(?:%%[A-Za-z0-9_.]{1,40}%%|%[A-Za-z0-9_.]{1,40}\
      %|\\$\\$[A-Za-z0-9_.]{1,40}\\$\\$|\\$\\{[A-Za-z0-9_.]{1,40}\\}|\\$[A-Za-z][A-Za-z0-9_]{1,39}|\
      \\{\\{[A-Za-z0-9_.]{1,40}\\}\\}|\\{[A-Za-z0-9_.]{1,40}\\}|\\[[A-Za-z0-9_.]{1,40}\\]|<[A-Za-z]\
      [A-Za-z0-9_.]{0,39}>|@[A-Za-z0-9_.]{1,40}@|#\\{[A-Za-z0-9_.]{1,40}\\})"
    - "[?&][A-Za-z0-9_.\\-]{1,32}\\s*=\\s*(?&redirect_url_macros)"
    - (?:^|[^A-Za-z0-9_])(?:(?:Map|HashMap|LinkedHashMap|TreeMap|ConcurrentHashMap|ImmutableMap|BTreeMap|Dictionary|Dict|Record)\s*[<\[(]\s*(?:String|string|str|&str|Text|CharSequence)\s*,\s*|map\s*\[\s*(?:string|str|String)\s*\]\s*)(?&pseudonym_type_terms)[A-Za-z0-9_]{0,32}
    - (?:^|[^A-Za-z0-9_])[A-Za-z0-9_]{0,20}(?&pseudonym_table_terms)[A-Za-z0-9_]{0,8}(?&terminal_store_terms)
    - (?:^|[^A-Za-z0-9_])(?&terminal_store_writes)[^\n]{0,100}(?&pseudonym_table_terms)
    - /(?&sync_endpoint_names)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])[A-Za-z0-9_]{0,16}(?&counterpart_name_terms)[A-Za-z0-9_]{0,12}\s*,\s*(?&pseudonym_param_names)[A-Za-z0-9_]{0,8}\s*[,)]
context_questions:
  - "WHO ARE THE COUNTERPARTS, AND IS EACH ONE NAMED WHERE THE SUBJECT CAN SEE IT? List them from
    the configuration rather than from the notice: in the anchor implementation of this construct
    the counterpart list is one file per party in a configuration directory, and the number of
    parties is whatever that directory holds. Then compare that list with the privacy notice, the
    cookie banner's vendor list and the record of processing activities, and say which parties
    appear in the code and in none of them. A count that differs between the two places is the
    answer to this question, not a detail of it."
  - "CAN THE SUBJECT REFUSE BEFORE THE FIRST REDIRECT IS FOLLOWED, AND WHAT DOES THE PRODUCT DO IF
    THEY DO NOTHING? Quote the code path that decides whether the sync runs: is it reached only
    after a positive signal is recorded, or does it run on first contact and stop later if a signal
    says so? Quote the default. This detector reads the mechanism and never the gate in front of it,
    so where the gate is and whether it is passed are read here and nowhere else."
  - "HOW LONG DOES THE TABLE LIVE, AND WHAT HAPPENS WHEN IT IS DELETED? Quote the cookie's max-age
    or expiry, any per-entry expiry the value carries, and any sweep that removes stale entries.
    Then say what deleting it undoes: an entry that has already been returned to a counterpart was
    disclosed when the redirect was followed, and removing the local copy does not reach the copy
    the counterpart kept. Say which of the two the product's own deletion path addresses."
  - ARE THE IDENTIFIERS STABLE ACROSS SITES AND ACROSS SESSIONS, AND WHOSE IDENTIFIER IS EACH ONE?
    For each side of the table say whether the value is fixed for this browser wherever it appears,
    rotated per site, or derived per session; and say which values the product minted itself and
    which a counterpart returned. A table whose entries are stable across sites is a linkage between
    whatever those sites know about the person, which is a different fact from any single entry in
    it.
  - "IS THIS ARRANGEMENT ONE THE PRODUCT DETERMINES ALONE, OR JOINTLY WITH EACH COUNTERPART? This is
    a question about an arrangement and not about any line of code, and no match here answers it:
    read the contracts, the terms each counterpart is onboarded under, and who decides that a sync
    happens and what the identifier is then used for. Say what you find and say plainly where the
    documents do not settle it. Where the determination turns out to be joint, the transparency and
    responsibility-allocation duties attach to the arrangement rather than to either party alone."
  - "WHICH SIDE OF THE ARRANGEMENT IS THE SCANNED REPOSITORY? The same construct is written from
    both ends: the hub that mints callbacks and keeps the table, and a counterpart that receives a
    redirect and answers with its own identifier. Say which side each matched file is on, because
    the recipients, the storage and the erasure questions all land differently depending on the
    answer."
evidence_template: "{file}:{line} matched a construct this rule reads as CROSS-PARTY IDENTIFIER
  SYNC: a redirect the product mints with a placeholder for a counterpart's own identifier, a table
  of many counterparts' pseudonyms held in the subject's terminal equipment, or the callback
  endpoint that fills that table. The limb is readable from the matched line. WHAT EACH LIMB
  ESTABLISHES, AND WHAT IT DOES NOT. A PLACEHOLDER REDIRECT establishes that a counterpart is
  invited to return its own identifier for this browser; it does not establish that any counterpart
  does, that the redirect is ever followed, or that this counterpart is configured in the deployment
  being scanned - which counterparts are live is read from the configuration and the deployment, and
  that is context question 1. AND IT ESTABLISHES THAT ONLY WHERE THE BRACES ARE A COUNTERPART'S
  MACRO SLOT: a placeholder in query-parameter position is also the shape a host language's own
  string interpolation takes - a Python f-string or a JavaScript template literal writing
  `?return_url={return_url}` or `?user_id={target_id}`, or a documentation line writing
  `?user_id=<id>` - and on those lines there is no counterpart at all, so the match establishes only
  that a URL is being assembled. Which of the two this is cannot be read off the matched line: open
  the file and say WHO FILLS THE PLACEHOLDER - the product itself, at run time, from its own
  variable, or another party, after the browser reaches it. This is disclosed as a cost of reading
  widely and NOT repaired by narrowing the clause: no spelling has been removed, because a
  subtraction is the only operation that can create a miss. A PSEUDONYM TABLE establishes that a
  table of counterpart-keyed pseudonyms is declared, and - where the matched line pairs that table
  with a cookie or a client-side store - that the store it lives in is the subject's own terminal
  equipment. A DECLARATION READ ALONE DOES NOT ESTABLISH THE STORAGE LOCATION: a map from
  counterpart to pseudonym is the same shape whether it is written into a cookie or kept in server
  memory, and which one this is here is read from the file rather than from this line. It does not
  establish the lawful basis for storing it, whether a consent gate stands in front of the first
  write, or what the table's lifetime is, which are context questions 2 and 3. THE CALLBACK
  establishes that a value arriving from a counterpart is written into that table; it does not
  establish that consent was obtained, that the value is a person's identifier rather than a
  placeholder or a null, or that the write ever happens for a given subject. NOTHING HERE
  ESTABLISHES WHO THE RECIPIENTS ARE: the counterpart list is a configuration fact, not a fact this
  detector reads. NOTHING HERE DECIDES WHETHER THE ARRANGEMENT IS JOINT, which is context question 5
  and is answered from contracts rather than from code. AND NOTHING HERE SAYS WHICH SIDE OF THE
  ARRANGEMENT THIS REPOSITORY IS ON - hub or counterpart - which is context question 6 and changes
  what every other answer means. REACH: every anchor behind this rule is in one repository in one
  framework; a second implementation's spelling of the same construct is untested, so a silence from
  this rule is weaker evidence than a silence from a rule read across many trees."
remediation_template: |
  Put the consent decision in front of the first sync, not after it. The first redirect is the
  disclosure: once the browser has followed it, the counterpart has the subject's pseudonym and
  removing the local table afterwards does not reach it. Name the code path that decides, and say
  what happens when the subject has expressed nothing at all.
  Write the counterpart list where the subject can read it, and keep it beside the configuration
  that generates it. Where the parties are one configuration file each, the notice and the record of
  processing activities are stale the moment a file is added; a list built from the configuration is
  the only one that stays true.
  Describe the table for what it is in the record of processing activities: a store on the subject's
  terminal equipment holding one pseudonym per counterpart, with its lifetime and its per-entry
  expiry. Naming the cookie is not describing the table.
  Say what deletion does and does not undo. A deletion path that clears the local table should say
  so in those words, rather than in words that read as though the identifiers already disclosed were
  recalled.
  Where the determination is joint, record the allocation of responsibilities and make its essence
  available to the subject. Where it is not joint, write down why not, because that conclusion is
  the one everything else rests on.
data_categories:
  - user.behavior
  - user.device
  - user.device.cookie_id
  - user.unique_id
fingerprint_spec: project
reading_class:
  class: existence

  vocabulary_matching:
    counterpart_id_macro_keys:
      case_insensitive: true
      separator_insensitive: true
    pseudonym_param_names:
      case_insensitive: true
      separator_insensitive: true
    redirect_url_macros:
      case_insensitive: true
      separator_insensitive: true
    pseudonym_type_terms:
      case_insensitive: true
      separator_insensitive: true
    pseudonym_table_terms:
      case_insensitive: true
      separator_insensitive: true
    terminal_store_terms:
      case_insensitive: true
      separator_insensitive: true
    terminal_store_writes:

id: eu-dsa-001
pack: eu-dsa
short_name: "Content people can post: a way for others to report it"
problem_line:
  text: Notice-and-action route for user content not found or weak
fix_line: Provide an easy electronic way to report a specific item, confirm receipt, and tell the
  reporter the decision.
title: Store a recipient could write into - who supplies the content and the Art. 16
  notice-and-action mechanism need review
jurisdiction:
  - EU
legal_basis:
  - cite: "Digital Services Act, Regulation (EU) 2022/2065, Art. 16(1)-(2) — addressed to providers of
      hosting services (Chapter III, Section 2), which is the whole hosting rung of Art. 3(g)(iii)
      and not only the narrower online-platform rung of Art. 3(i). Art. 16(1): \"Providers of
      hosting services shall put mechanisms in place to allow any individual or entity to notify
      them of the presence on their service of specific items of information that the individual or
      entity considers to be illegal content. Those mechanisms shall be easy to access and
      user-friendly, and shall allow for the submission of notices exclusively by electronic
      means.\" Art. 16(2) requires the provider to take the necessary measures to enable and
      facilitate notices containing all of: (a) a sufficiently substantiated explanation of the
      reasons for the allegation; (b) a clear indication of the exact electronic location, such as
      the exact URL or URLs, and where necessary additional identifying information adapted to the
      type of content and type of hosting service; (c) the name and email address of the notifier,
      except for information considered to involve one of the offences referred to in Arts. 3 to 7
      of Directive 2011/93/EU; (d) a statement confirming the notifier's bona fide belief that the
      information and allegations are accurate and complete. Arts. 16(4)-(6) add confirmation of
      receipt, notification of the decision with redress information, and timely, diligent,
      non-arbitrary and objective processing."
    url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng
    checked_at: 2026-07-28
    jurisdiction: EU
  - cite: 'Regulation (EU) 2022/2065, Art. 3(g) and Art. 3(i) — definitional ladder, no duty of its own.
      Art. 3(g) defines "intermediary service" as one of three information society services: (i)
      mere conduit, (ii) caching, (iii) a "hosting" service, "consisting of the storage of
      information provided by, and at the request of, a recipient of the service". Art. 3(i) defines
      "online platform" as a hosting service that, at the request of a recipient, also "stores and
      disseminates information to the public", unless that is a minor and purely ancillary feature.
      Hosting is therefore the broader rung: a service can be a hosting service without ever
      disseminating to the public (private uploads, direct messages), and Art. 16 attaches at that
      broader rung.'
    url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: 'Regulation (EU) 2022/2065, Arts. 19(1), 29(1) and 15(2) — the size carve-outs and where they
      attach. Art. 19(1) reads "This Section, with the exception of Article 24(3) thereof, shall not
      apply to providers of online platforms that qualify as micro or small enterprises as defined
      in Recommendation 2003/361/EC" — "this Section" being Section 3 (additional provisions
      applicable to providers of online platforms, Arts. 19-28). Art. 29(1) does the same for
      Section 4 (online platforms allowing consumers to conclude distance contracts with traders).
      Art. 15(2) disapplies only the Art. 15(1) transparency-reporting duty to micro or small
      intermediary services. Verified against the OJ text on 2026-07-27: Section 2 (Arts. 16, 17,
      18) carries no size carve-out anywhere in the Regulation, so Art. 16 reaches a micro or small
      provider of a hosting service.'
    url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Regulation (EU) 2022/2065, Recital 50 — \"It is important that all providers of hosting
      services, regardless of their size, put in place easily accessible and user-friendly notice
      and action mechanisms\", which \"should be clearly identifiable, located close to the
      information in question and at least as easy to find and use as notification mechanisms for
      content that violates the terms and conditions of the hosting service provider\". The same
      recital names the service kinds this rule's vocabulary is built to cover, verbatim: \"The
      obligation to put in place notice and action mechanisms should apply, for instance, to file
      storage and sharing services, web hosting services, advertising servers and paste bins, in so
      far as they qualify as hosting services covered by this Regulation.\""
    url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng
    checked_at: 2026-07-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: 'Regulation (EU) 2022/2065, Art. 2(1) and Art. 93(2) — scope and application. Art. 2(1): the
      Regulation "shall apply to intermediary services offered to recipients of the service that
      have their place of establishment or are located in the Union, irrespective of where the
      providers of those intermediary services have their place of establishment"; Art. 3(d) and
      3(e) qualify that with "offer services in the Union" and "substantial connection to the Union"
      (establishment in the Union, a significant number of recipients in a Member State relative to
      population, or targeting of activities towards one or more Member States). Art. 93(2): the
      Regulation applies from 17 February 2024.'
    url: https://eur-lex.europa.eu/eli/reg/2022/2065/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: Directive (EU) 2015/1535, Art. 1(1), point (b), incorporated by Regulation (EU) 2022/2065 Art.
      3(a) — "'service' means any Information Society service, that is to say, any service normally
      provided for remuneration, at a distance, by electronic means and at the individual request of
      a recipient of services". A hosting service must first be an information society service; the
      remuneration limb is the outer boundary of the DSA's reach and is the open question for a
      service that carries no advertising, subscription or other consideration.
    url: https://eur-lex.europa.eu/eli/dir/2015/1535/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2024-02-17

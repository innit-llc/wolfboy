context_questions:
  - "Who supplies the content that reaches the write paths in the locations list? The detector no
    longer decides this: it raises a candidate wherever a store exists that a recipient could write
    into, and the operator-versus-recipient question is yours. Follow the request path into at least
    one of the listed writes and say whether the value comes from an authenticated or anonymous
    request body, an uploaded file or an editor surface (a recipient supplies it), or from a build
    step, a seed script, an import job, an admin-only console or a hard-coded constant (the operator
    supplies it). Quote the line where the value enters the process. If both happen in the same
    repository, the recipient path decides: Art. 3(g)(iii) asks whether the service consists of
    storing information provided by, and at the request of, a recipient, not whether it does so
    exclusively. Code the operator runs over content recipients already supplied - a data migration
    or backfill that moves uploaded files, an import or export job, a repair task - is not a
    recipient write path although the content is the recipients': it is not_the_construct; where it
    shows the store it moves content into, name that store under question 3. A development scenario
    or seed is not_the_construct because the operator supplies its content (above), not because it
    is reachable only outside production; it is not construct_but_gated."
  - "Does this service provide an electronic mechanism by which any individual or entity can notify
    the provider of SPECIFIC ITEMS of allegedly illegal content, and does that mechanism enable and
    facilitate the four Art. 16(2) elements - (a) a sufficiently substantiated explanation of the
    reasons for the allegation, (b) a clear indication of the exact electronic location such as the
    exact URL, (c) the notifier's name and email address, which must stay optional for the Directive
    2011/93/EU offences, and (d) a statement confirming the notifier's bona fide belief that the
    information is accurate and complete? This is the whole absence half of the rule and the
    detector no longer answers any part of it: it searches for no notice mechanism at all, so its
    silence on the point is not evidence. Search the tree yourself. Terms that a codebase which has
    built the channel usually spells it with, and which the deleted guard keyed on: report_illegal,
    flag_illegal, notify_illegal, illegal_content, illegalContent, unlawful_content;
    notice_and_action or noticeAndAction; a report-or-flag control bound to a content noun
    (report_comment, flag-post, reportPost, flagContent, ReportPostModal, FlagCommentButton); a
    persisted notice record (ContentFlagging, content_flags, takedown_request, abuse_notice,
    flagged_post, reportedContent). Treat a hit as where the question starts, not where it ends -
    three of those terms matched a stylesheet class, a Makefile line and a dashboard column label on
    real repositories. Weigh, and do not accept on sight: a hosted help desk or ticket widget
    (Intercom, Zendesk, Crisp, Beacon, Tawk, HubSpot); a support, abuse or legal address in a
    footer, a Terms page or an email template; a moderation queue or review console only staff can
    reach; an automated classifier, spam filter or profanity filter; a copyright-only DMCA form; an
    /admin/reports analytics route; a feature-flag client, an emoji category named 'flags' or a
    country-flag asset path; a navigator.sendBeacon call; a route that exists only as a directory
    name; a third-party trust-and-safety vendor. A staff-only moderation queue is not it, and a
    general support address is not it: Art. 16(1) requires a channel for notifying the provider
    about specific items of content, submitted exclusively by electronic means. Record what you
    searched, quote what you found and where, and state explicitly if you found nothing."
  - "Which of the reported locations actually evidence stored recipient content, and which do not? A
    location evidences stored recipient content when it declares the store (a schema, migration or
    model for content a recipient supplies) or sits on a path that writes into it at a recipient's
    request - the request handler, the model callbacks, sanitisers and attach steps run during that
    save, and jobs that add to or re-home what a recipient stored because a recipient asked (moving
    a thread moves its files). A line that only reads, searches, renders or exports what is stored
    is not such a location, and neither is maintenance the operator runs (question 1). An editor
    counts only where the window shows it bound to content that is saved - the component whose
    document is submitted or synchronised to the server, or an extension wired to an uploader. A
    package manifest entry, an import, or a formatting-mark or node definition is not a location of
    the store. For an editor that counts, `data` includes `user_content`. The locations list is a
    wide net and will contain incidental hits - an outbound transactional message send, an analytics
    or audit write, an operator seed script, a demo dataset, a schema for the product's own
    configuration, a module that only re-exports an upload component; and an in-app read view, a
    search result, an export, or an outbound mail, digest or chat message that renders stored
    content: evidence for question 6 or for another rule, not a location of the store. Name the
    strongest two or three locations, quote the line at each, and list the ones you are discarding
    with the reason. If every location is incidental, say so plainly: that is a complete answer and
    it closes the candidate."
  - "Is the service offered to recipients of the service established or located in the Union (Art.
    2(1), read with the Art. 3(d) and 3(e) 'offer services in the Union' and 'substantial connection
    to the Union' tests: establishment in the Union, a significant number of recipients in a Member
    State relative to its population, or targeting of activities towards Member States)? Check
    ScanProfile.distribution_regions and any EU-facing signal in the repository, such as EU locales,
    EUR pricing or EU consent code. A region that is not in the list may not have been asked: that
    question is open, not answered no."
  - Does a carve-out or a different rung of the definitional ladder apply? The micro and small
    enterprise exclusions attach to Section 3 (Art. 19(1), online-platform duties), Section 4 (Art.
    29(1), marketplaces) and Art. 15(1) transparency reporting (Art. 15(2)) - not to Section 2,
    where Art. 16 sits. Separately, check whether the service is a mere conduit or caching service
    under Art. 3(g)(i)-(ii) rather than a hosting service; and whether it is an information society
    service at all, since Art. 3(a) borrows the Directive (EU) 2015/1535 Art. 1(1)(b) definition,
    which covers services normally provided for remuneration - the open question for an unmonetised
    hobby service, noting that remuneration need not come from the recipient. Name the rung and the
    provision relied on.
  - "Is the stored content also disseminated to the public at the request of the recipient (Art.
    3(i)), or is it visible only to its author or to a closed group? This does not change the Art.
    16 answer, which attaches at the hosting rung either way, but it decides whether the
    online-platform duties of Section 3 attach on top. Answer from the read path: a public route or
    share link that renders the record without authentication, a sitemap or feed that includes it,
    or an explicit visibility or published column. Say which. An in-app read view, a search result,
    an export, or an outbound mail, digest or chat message that renders stored content is evidence
    for this question or for another rule, not a location of the store (question 3)."
  - "Where question 2 found a mechanism, does it meet the Art. 16(1) quality requirements as opposed
    to merely existing? Art. 16(1) requires it to be easy to access and user-friendly and to allow
    submission exclusively by electronic means, and Recital 50 adds that it should be clearly
    identifiable, located close to the information in question, and at least as easy to find and use
    as the notification mechanism the service already offers for content that violates its own terms
    and conditions. Art. 16(1) also says 'any individual or entity', so a control reachable only by
    signed-in recipients does not cover the non-user who wants to notify. Answer from the code: how
    many steps from the item to the submission surface, is it rendered on the item itself or buried
    in a settings tree, does it require an account, and is there a terms-and-conditions reporting
    flow that is easier to reach than this one? Quote the submission surface and the route that
    renders it."
  - What happens after a notice arrives? Art. 16(4)-(6) expect a confirmation of receipt where
    contact information is given, notification of the decision with information on redress, and
    timely, diligent, non-arbitrary and objective processing, with disclosure where automated means
    are used. Record which of these the code path provides and which it does not.
evidence_template: "{file}:{line} carries one of this rule's user-content spellings: a create,
  insert or upsert call on a table, model or class named for user content; a schema, migration or
  model definition declaring such a table; an upload handler, an attachment macro, a storage-client
  upload, a multipart form or a file input; a rich-text editor, an HTML sanitiser, or a spam or
  moderation check; or a cache or key-value write whose key carries a content noun. That vocabulary
  is where the Art. 3(g)(iii) hosting shape - storage of information provided by, and at the request
  of, a recipient of the service - is usually written, and the spelling is all the detector
  established: several of these strings also occur where nothing is stored for anyone. Shapes
  already met in real code: a catalogue identifier naming a moderation vendor (`'id' =>
  'analyze-with-perspectiveapi'`); a sanitiser call inside a JSX `data=` attribute on a hidden
  element; a rich-text editor import inside a `.diff` test-example artefact; a file input built for
  a desktop client's import dialog (`input.type = 'file'`); and key-value writes whose key merely
  contains a content noun - `searchParams.set('post_logout_redirect_uri', ...)`, which builds a
  logout URL, and `cookieStore.set('chat-model', model)`, which persists a UI preference. Read the
  matched line and say which of those it is; context question 3 asks the same of the locations list.
  Whether a recipient rather than the operator supplies what is stored, and whether this service
  offers an Art. 16(1) notice-and-action mechanism at all, are both for the adjudicator: since
  2026-07-28 the detector searches for no notice mechanism, so it is not asserting that none exists"
remediation_template: >
  Settle scope first, because DSA Art. 16 addresses providers of hosting services (Art. 3(g)(iii):

  storage of information provided by, and at the request of, a recipient of the service). If the
  only

  stored content comes from the operator, this candidate does not apply and the reason belongs in
  the

  adjudication record. If recipients do supply the stored content, the size of the team does not
  change

  the answer: the micro and small enterprise exclusions in Arts. 19(1) and 29(1) cover Sections 3
  and 4,

  not Section 2 where Art. 16 sits. Recital 50 names file storage and sharing services, web hosting

  services, advertising servers and paste bins as examples, so a service with no comment thread
  anywhere

  can still be squarely in scope.

  Before any of that, check whether the channel already exists, because this rule no longer checks
  for

  you: as of 2026-07-28 the detector carries no suppression for a discharged duty, so it fires on a

  service that ships a complete Art. 16 mechanism exactly as it fires on one that ships none. The

  vocabulary its deleted guard used is a reasonable place to start searching, and no more than that
  -

  report_illegal, flag_illegal, illegal_content, unlawful_content, notice_and_action, a
  report-or-flag

  control bound to a content noun (report_comment, flag-post, reportPost, flagContent,
  ReportPostModal),

  a persisted notice record (ContentFlagging, content_flags, takedown_request, abuse_notice,

  flagged_post, reportedContent). Every one of those terms has been measured matching something that
  is

  not a notice mechanism: a stylesheet class, a Makefile line, a translation key, an operator
  dashboard's

  column label. Weigh what you find against Art. 16(1) and Art. 16(2) rather than against the
  string.

  Where a mechanism exists outside this repository - a hosted help desk, a form in a separate
  front-end

  repository, a published address in a Terms page - record where it lives, and record equally that a

  help desk or a published address is not by itself an Art. 16(1) mechanism.

  Engineering change that closes the gap: add a notice channel that recipients and non-recipients
  alike

  can reach without an account, reachable from next to the content itself - a "report this" control
  on

  every post, comment, message, upload and profile surface - posting to a route that persists the
  notice

  with the content reference and the notifier's contact details.

  Give the submission form fields for all four Art. 16(2) elements: a free-text explanation of why
  the

  notifier alleges the content to be within Art. 3(h); the exact electronic location, prefilled with
  the exact URL

  of the item; the notifier's name and email address, which must stay optional for the Directive

  2011/93/EU offences; and a checkbox for the bona fide statement that the information given is
  accurate

  and complete.

  Then close the loop that Arts. 16(4)-(6) describe: acknowledge receipt where the notifier gave
  contact

  details, notify the decision with information on the possibilities for redress, and record whether

  automated means were used. Art. 16(1) permits electronic submission only, so a postal address or a

  phone number does not substitute for the form.
data_categories:
  - user.content
fingerprint_spec: project
reading_class:
  class: existence
  elements:
    - name: substantiated_explanation
      question: 2
      text: (a) a sufficiently substantiated explanation of the reasons for the allegation
    - name: exact_location
      question: 2
      text: (b) a clear indication of the exact electronic location such as the exact URL
    - name: notifier_contact
      question: 2
      text: (c) the notifier's name and email address, which must stay optional for the Directive
        2011/93/EU offences
    - name: bona_fide_statement
      question: 2
      text: (d) a statement confirming the notifier's bona fide belief that the information is accurate
        and complete

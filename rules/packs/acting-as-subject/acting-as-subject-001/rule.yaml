id: acting-as-subject-001
pack: acting-as-subject
short_name: Actions sent in a person's name while they are not there
problem_line:
  text: Acts in a person's name while they are absent or uninvolved
fix_line: Tell the person what will be sent in their name, to whom and when, and give them a record
  and a way to undo it.
title: Outbound action carried out under a person's own identity while that person is absent or uninvolved
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(a) - personal data shall be 'processed lawfully,
      fairly and in a transparent manner in relation to the data subject'. This is the operative
      provision and the fairness limb is the one that bites: an action that carries a person's
      identity to somebody else, performed at a moment the person is by construction not present, is
      a statement made in their name that they have no opportunity to see, correct or withhold"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 6(1) - 'Processing shall be lawful only if and to the
      extent that at least one of the following applies', the first ground being that 'the data
      subject has given consent to the processing of his or her personal data for one or more
      specific purposes' and the sixth that processing is 'necessary for the purposes of the
      legitimate interests pursued by the controller or by a third party, except where such
      interests are overridden by the interests or fundamental rights and freedoms of the data
      subject which require protection of personal data, in particular where the data subject is a
      child.' The same subparagraph adds that 'Point (f) of the first subparagraph shall not apply
      to processing carried out by public authorities in the performance of their tasks.' The point
      this rule turns on is that the act performed in the person's name needs a ground of its own:
      consenting to hold an account is not consenting to have messages, follow requests or signed
      activities issued under one's identity while one is away"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1) - 'personal data' means 'any information relating
      to an identified or identifiable natural person'. Reference only: a definition establishes no
      duty of its own. It is carried because it is what makes the outbound artefact this rule finds
      - a notice under a person's nick, a follow request keyed to their account, an activity signed
      with their key - personal data about that person and not merely a message the system sent"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(d) - personal data shall be 'accurate and, where
      necessary, kept up to date; every reasonable step must be taken to ensure that personal data
      that are inaccurate, having regard to the purposes for which they are processed, are erased or
      rectified without delay'. Reference only, and cited for the shape of the harm rather than for
      a duty this detector establishes: a record on the receiving server that attributes an act to a
      person who did not perform it is inaccurate personal data about them, held by a controller
      this installation does not operate and cannot rectify"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.3

context_questions:
  - "MANDATORY, AND THE DETECTOR DID NOT CHECK IT: DID THE PERSON TURN THIS ON, AND WERE THEY TOLD
    IT SPEAKS FOR THEM? This is a fact about the product and the deployment, not about the code, and
    it is asked of the person running the scan rather than inferred from any line. Three answers are
    genuinely different and the finding changes with each: the person enabled it themselves and the
    interface said what it would send in their name; the person enabled it and the interface
    described it as a convenience without saying an outbound message would carry their identity; or
    an operator or a default enabled it for everybody. Quote the setting, its shipped default, and
    the words the person actually sees. Where nothing in the product says what goes out under their
    name, record that as the gap."
  - IS THE MODULE OR SERVICE THAT CARRIES THIS LOADED IN THIS DEPLOYMENT? A plug-in that ships in
    the tree and is not enabled sends nothing. Establish from the deployment's own configuration -
    not from the presence of the file - whether the auto-responder module is loaded, whether the
    migration handler is reachable, whether the signing path runs. Where it is not enabled anywhere,
    the finding is about a capability the product has, and should say so in those words.
  - "WHOSE IDENTITY DOES THE OUTPUT ACTUALLY CARRY? This is the boundary that decides whether the
    candidate is this type at all. Read the outbound artefact: the sender field, the signing key,
    the account the relationship row is keyed to. Where the output carries the OPERATOR's identity -
    an administrator acting visibly as an administrator over somebody's data - this is the
    operator-route class and not this one. Where it carries a third-party client's identity under a
    grant, it is the delegation class. This rule's construct requires the output to go out under the
    SUBJECT's own identity."
  - WHAT EXACTLY IS SENT, AND TO WHOM? Read the payload rather than the method name. An auto-reply
    carries a short text to one person who wrote in; an account-migration announcement carries two
    actor URIs to every follower and every relay; a moderation forward carries a reporter's own
    free-text comment to the server of the person being reported, which is a disclosure about a
    third party as well as about the subject. These are very different sizes of disclosure behind
    three lines that look alike, and the severity of the finding turns on which one is in front of
    you.
  - "IS THIS A SCHEDULED ACTION ON THE PERSON'S OWN CONTEMPORANEOUS CONFIGURATION? A post the person
    wrote, scheduled by the person, published at the time the person chose is not this type - it is
    the person acting, with a delay. What makes the scheduler form count is that attribution or
    timing detaches from the person's own act: the content is composed by the system, or the trigger
    is somebody else's event, or the configuration that authorised it is old enough that the person
    could not now say what it will send. Say which of those, if any, applies, and where the
    configuration lives."
  - "IF THE MATCH IS A KEY OR A SIGNING CALL, WHICH DIRECTION DOES IT RUN AND WHAT PATH REACHED IT?
    Two questions in one, and the first is cheap: a signature being VERIFIED on something a remote
    server sent is not this construct at all, and some spellings of the helper serve both
    directions. Then read the caller. A person signing their own outbound post with their own key is
    the ordinary operation of the protocol; the construct here is a MODERATION, SUSPENSION, DELETION
    OR ADMINISTRATIVE path that fetches the person's key and signs in their name - so that a
    receiving server records the person as having announced their own removal. Name the enclosing
    method and say which it is."
  - "CAN THE PERSON SEE, AND UNDO, WHAT WAS DONE IN THEIR NAME? Look for two things and record both:
    a record the person can read of what went out under their identity while they were absent, and a
    way to reverse it. In the migration form the practical question is concrete - after a remote
    Move assertion, each local follower is following an account on a server they never chose; can
    they see that this happened, and unfollow? Where neither exists, that is the finding, and it is
    a fairness point under Art. 5(1)(a) before it is anything else."
evidence_template: "{file}:{line} matched one of seven shapes, in three groups, and which group it
  is decides what was established. GROUP A - ABSENCE-TRIGGERED SPEECH: an absence test on a
  predicate naming the subject, a bare presence word beside a subject noun in a negation or an early
  return, or an automatic responder named directly. GROUP B - A REMOTE ASSERTION ACTED IN LOCAL
  NAMES: a handler for a claim by another server about who a person now is, or a relationship-row
  rewrite called by name. GROUP C - SIGNING WITH THE SUBJECT'S KEY: a signing key fetched by a
  person's id or read off a person-shaped record, or a signed outbound call named. THIS ESTABLISHES
  ONLY THAT THE CODE HAS A CONSTRUCT for performing an attributable action under a person's
  identity, and in the absence group, for performing it at a moment the person is by construction
  not present. THE ENGINE READS ONE LINE AT A TIME, so a single match is usually ONE HALF of the
  construct: the guard without the send it guards, or the migration handler without the follow jobs
  it queues. Because this rule keys its findings per FILE, the other half is in the same candidate's
  locations array wherever it exists - read the locations together before deciding, and where only
  one half is present say so. WHAT IS NOT ESTABLISHED, and each of these is a question rather than a
  caveat. FIRST, NOBODY HAS ESTABLISHED THAT THE PERSON CONFIGURED THIS OR WAS TOLD IT SPEAKS FOR
  THEM - that is a fact about the product, it is context question 1, and no pattern here decides it.
  SECOND, WHETHER THE MODULE IS LOADED IN THIS DEPLOYMENT is not read from the tree; a plug-in
  present and not enabled sends nothing (context question 2). THIRD, WHOSE IDENTITY THE OUTPUT
  CARRIES was not read - an administrator acting visibly as an administrator, and a third-party
  client acting under a grant, are two different recorded classes and neither is this one (context
  question 3). FOURTH, THE PAYLOAD WAS NOT OPENED: a short auto-reply, a two-URI migration
  announcement and a moderation report carrying a third party's free text are three different
  disclosures (context question 4). FIFTH, FOR GROUP C, THE DIRECTION AND THE CALLER WERE NOT READ -
  a signature being verified on an inbound request is not this construct, and a person signing their
  own post is the protocol working normally (context question 6)."
remediation_template: >
  Establish first whether the output goes out under the person's own identity, because that is what

  makes this construct what it is. Where the sender, the signing key or the relationship row belongs

  to an operator or to a third-party client instead, this belongs to the delegation or
  operator-route

  classes and the finding closes here.

  Then write down what the person was told. The ordinary defect in this construct is not that the

  product acts for somebody - it is that nothing anywhere says what will be sent in their name, to

  whom, and on what trigger. Put that in the interface where the behaviour is switched on, in the

  words a person would use, and record the shipped default.

  Give the person a record and a reversal. Anything issued under someone's identity while they were

  absent should be visible to them afterwards, and undoable: an auto-reply log they can read, a list

  of relationships that a remote migration created for them, an unfollow that works.

  Treat a remote assertion about identity as a claim to be checked rather than as an instruction to

  execute. Where another server's Move claim causes rows keyed to your own users to be rewritten and

  requests to be issued in their names, decide deliberately whether that should happen without the

  person's involvement, and record the decision and its basis.

  On the signing path, separate the two cases. A person's own outbound activity signed with their
  own

  key is the protocol working as intended. A moderation, suspension or deletion activity signed with

  the subject's key makes the receiving server record the person as having announced their own

  removal; if that is the intended behaviour, say so where the person can read it, and check the

  lawful basis for it separately from the basis for the account itself.

  Record all of this in the record of processing activities as processing carried out in the data

  subject's name, with its own purpose and its own ground under Art. 6(1) - not folded into the

  purpose of the feature the person signed up for.
data_categories:
  - user.account
  - user.content
  - user.unique_id
  - user.behavior
fingerprint_spec: file

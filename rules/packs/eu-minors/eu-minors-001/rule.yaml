      straipsnio 1 dalies a punktą duoda ne jaunesnis negu 14 metų vaikas'. IN FORCE 2018-07-16
      (recast act art. 2(1): 'Šis įstatymas ... įsigalioja 2018 m. liepos 16 d.'). The 2024 recast
      act Nr. XIV-2626 was read in full and does not touch 6 straipsnis, and the current
      consolidated table of contents still carries it under the same heading. PRIMARY:
      e-seimas.lrs.lt, the official Lithuanian legal acts register; the recast act PDF and the
      current consolidated redaction were both fetched and grepped."
    url: https://e-seimas.lrs.lt/portal/legalAct/lt/TAD/TAIS.29193/asr
    checked_at: 2026-07-27
    jurisdiction: LT
    supports_rule_condition: false
  - cite: "NATIONAL AGE - LU 16. Derogation: NO - Luxembourg legislated no lower age, so the GDPR
      default applies unchanged. Negative proof read from the instrument itself rather than
      inferred: the loi du 1er août 2018 portant organisation de la Commission nationale pour la
      protection des données et mise en oeuvre du règlement (UE) 2016/679 (Mémorial A n° 686) was
      fetched in full as the official Journal officiel PDF and contains no occurrence of 'mineur',
      'enfant', 'société de l'information', 'seize ans', 'quinze ans', 'quatorze ans' or 'treize
      ans'; its four references to 'article 8' are to its own article 8 on the CNPD's missions. IN
      FORCE 2018-05-25, the date the GDPR applied. PRIMARY: data.legilux.public.lu, the official
      gazette's file service, fetched and the text extracted and searched."
    url: https://data.legilux.public.lu/file/eli-etat-leg-loi-2018-08-01-a686-jo-fr-pdf.pdf
    checked_at: 2026-07-27
    jurisdiction: LU
    supports_rule_condition: false
  - cite: "NATIONAL AGE - LV 13. Derogation: YES, at the floor. Provision: Fizisko personu datu
      apstrādes likums 33. pants: the processing is lawful 'ja bērns ir vismaz 13 gadus vecs', or
      where a parent or legal guardian has consented for a child below 13. IN FORCE 2018-07-05
      (adopted 2018-06-21). 33. pants carries no amendment note, unlike other articles of the same
      act which carry theirs explicitly. PRIMARY: likumi.lv, the official Latvian consolidated-law
      service, fetched and grepped."
    url: https://likumi.lv/ta/id/300099-fizisko-personu-datu-apstrades-likums
    checked_at: 2026-07-27
    jurisdiction: LV
    supports_rule_condition: false
  - cite: "NATIONAL AGE - MT 13. Derogation: YES, at the floor. Provision: Subsidiary Legislation
      586.11, regulation 4: 'The processing of personal data of a child in relation to information
      society services shall be lawful where the child is thirteen years of age.' The instrument is
      the Processing of Child's Personal Data in relation to the Offer of Information Society
      Services Regulations (Legal Notice 179 of 2018), and NOT the Data Protection Act itself, which
      is why a search of Chapter 586 finds nothing. IN FORCE 2018-06-01 per the instrument's own
      commencement line; legislation.mt dates the single published version 2018-06-04 and records no
      later version. PRIMARY: legislation.mt, the official Maltese legislation service, the
      regulations' PDF fetched and the text extracted and grepped."
    url: https://legislation.mt/eli/sl/586.11/eng/pdf
    checked_at: 2026-11-15
    jurisdiction: MT
    supports_rule_condition: false
  - cite: "NATIONAL AGE - NL 16. Derogation: NO - the Netherlands legislated no lower age, so the GDPR
      default applies unchanged. The trap here is that the UAVG does have a children's-consent
      article and it is not a derogation: artikel 5 opens 'Indien artikel 8 van de verordening niet
      van toepassing is', i.e. it governs parental consent for processing OUTSIDE Art. 8, and sets
      16 there too ('indien de betrokkene de leeftijd van zestien jaren nog niet heeft bereikt').
      Reading it as the Art. 8(1) age is the mistake to avoid; where Art. 8 applies, it applies at
      16 by direct effect. IN FORCE 2018-05-25. A further amendment to artikel 5 enters into force
      2026-09-01 and adds a threshold of 12 for exercising rights, not for the Art. 8 consent age.
      PRIMARY: wetten.overheid.nl, the official Dutch consolidated-law service, fetched and
      grepped."
    url: https://wetten.overheid.nl/BWBR0040940/2018-05-25/0/Hoofdstuk1/Artikel5
    checked_at: 2026-07-27
    jurisdiction: NL
    supports_rule_condition: false
  - cite: "NATIONAL AGE - PL 16. Derogation: NO - Poland legislated no lower age, so the GDPR default
      applies unchanged. Negative proof read from the act itself: the ustawa z dnia 10 maja 2018 r.
      o ochronie danych osobowych (Dz.U. 2018 poz. 1000) was fetched in full as the official Sejm
      ELI PDF and contains no occurrence of 'społeczeństwa informacyjnego', 'dziecka', '13 lat' or
      '16 lat' anywhere in its 176 articles. IN FORCE 2018-05-25, confirmed from the Act's own art.
      176 ('Ustawa wchodzi w życie z dniem 25 maja 2018 r.') rather than from the no-derogation
      convention. PRIMARY: api.sejm.gov.pl, the Sejm's official ELI service, fetched and the text
      extracted and searched."
    url: https://api.sejm.gov.pl/eli/acts/DU/2018/1000/text.pdf
    checked_at: 2026-07-27
    jurisdiction: PL
    supports_rule_condition: false
  - cite: "NATIONAL AGE - PT 13. Derogation: YES, at the floor. Provision: Lei n.º 58/2019, de 8 de
      agosto, artigo 16.º 'Consentimento de menores': personal data of children may be processed on
      consent for a direct offer of information society services 'quando as mesmas já tenham
      completado 13 anos de idade', and below 13 only with the legal representatives' consent, 'de
      preferência com recurso a meios de autenticação segura'. IN FORCE 2019-08-09 (artigo 68.º: the
      law enters into force the day after publication); the GDPR default of 16 applied in Portugal
      until then. PRIMARY: Diário da República, the official Portuguese gazette, fetched and grepped
      - the site serves its rendered text only to a crawler user-agent, which is how it was read.
      NOT ESTABLISHED: whether artigo 16.º has been amended since 2019; the gazette's amendments tab
      did not render for any user-agent tried, and the article text carries no amendment marker."
    url: https://diariodarepublica.pt/dr/detalhe/lei/58-2019-123815982
    checked_at: 2026-07-27
    jurisdiction: PT
    supports_rule_condition: false
  - cite: "NOT VERIFIED AGAINST THE NATIONAL ACT. NATIONAL AGE - RO 16. Derogation: NO, on the evidence
      available. Legea nr. 190/2018 could not be read: legislatie.just.ro, the Ministry of Justice's
      official consolidated-law service, closes the connection on every request from this machine
      over HTTP/1.1 and HTTP/2 alike, and Monitorul Oficial publishes no free full-text archive of
      2018 issues. What was read instead, and what it says: the Romanian supervisory authority's own
      published guide answers the information-society-services question for children by quoting the
      GDPR figure of 16 and citing it to 'art. 8 din Regulamentul (UE) 2016/679' alone, breaking the
      same document's consistent habit of citing '(art. X din Legea nr. 190/2018)' wherever a rule
      is national; and its itemisation of everything Law 190/2018 adds contains no
      children's-consent provision. That is an official body's statement of the position, not the
      statute. IN FORCE 2018-05-25 on that reading, NOT confirmed from the Act's own commencement
      clause. Re-check this row before relying on it."
    url: https://www.dataprotection.ro/servlet/ViewDocument?id=1650
    checked_at: 2026-07-27
    jurisdiction: RO
    supports_rule_condition: false
  - cite: "NATIONAL AGE - SE 13. Derogation: YES, at the floor. Provision: lag (2018:218) med
      kompletterande bestämmelser till EU:s dataskyddsförordning, 2 kap. 4 §: 'Vid erbjudande av
      informationssamhällets tjänster direkt till ett barn som bor i Sverige ska behandling av
      personuppgifter vara tillåten med stöd av barnets samtycke, om barnet är minst 13 år.' Note
      the express territorial limb - the Swedish rule is written for a child resident in Sweden,
      which matters for a service that reaches several Member States. IN FORCE 2018-05-25. The Act
      has been amended up to SFS 2025:256 and the official amendment register lists no amendment to
      2 kap. 4 §. PRIMARY: Sveriges riksdag's publication of Svensk författningssamling, fetched and
      grepped."
    url: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-2018218-med-kompletterande-bestammelser_sfs-2018-218/
    checked_at: 2026-07-27
    jurisdiction: SE
    supports_rule_condition: false
  - cite: "NATIONAL AGE - SI 15. Derogation: YES. Provision: Zakon o varstvu osebnih podatkov (ZVOP-2),
      Uradni list RS št. 163/22, 8. člen (1): 'Privolitev otroka za uporabo storitev informacijske
      družbe ... je veljavna, če je otrok star 15 let ali več', with a parent, guardian or holder of
      parental responsibility below 15 and, for a service offered free of charge, a foster parent or
      institution representative. IN FORCE 2023-01-26 (127. člen: the Act enters into force on the
      thirtieth day after publication; published 2022-12-27). SLOVENIA IS THE SECOND ROW THAT BREAKS
      COMPILATIONS: it had no GDPR implementing act at all between 2018-05-25 and ZVOP-2, so the
      default of 16 applied directly in that period and 15 is recent, not long-standing. PRIMARY:
      Uradni list RS, the official gazette; the issue PDF was fetched and the text extracted and
      grepped. NOT ESTABLISHED: whether ZVOP-2 has been amended since 2023 - the consolidated
      service pisrs.si requires an API token this machine does not have."
    url: https://www.uradni-list.si/_pdf/2022/Ur/u2022163.pdf
    checked_at: 2026-07-27
    jurisdiction: SI
    supports_rule_condition: false
  - cite: "NATIONAL AGE - SK 16. Derogation: NO, and by express enactment rather than by silence.
      Provision: zákon č. 18/2018 Z. z. o ochrane osobných údajov, § 15 ods. 1: 'Prevádzkovateľ v

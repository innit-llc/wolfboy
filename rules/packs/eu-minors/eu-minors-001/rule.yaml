settling_questions:
  - audience.minors_possible
context_questions:
  - "THE APPLICABILITY QUESTION, and the one to answer first, because a negative answer ends the
    review. Is this service offered DIRECTLY TO A CHILD, in the sense of GDPR Art. 8(1)? No detector
    can answer this and none of the code below decides it - it is a judgement about audience, and it
    is the reason this candidate was raised rather than resolved. Look for and quote the evidence,
    naming the file or artifact each piece came from: a store listing age rating or content rating
    (Play Data safety, App Store age rating, PEGI, ESRB, IARC); an existing COPPA,
    children's-privacy or age-rating declaration anywhere in the repository or its policy documents;
    the marketing and landing copy - who is it addressed to, and does it name schools, parents,
    kids, teens, students or a school year; the actual content and its subject matter; the visual
    register of the product; any age-rating or minimum-age field in a manifest, app store config or
    ToS; whether the product is sold to schools or families. Then say plainly which way the evidence
    points. A general-purpose product with an adult or mixed audience is outside Art. 8, and where
    the evidence says so, record that, dismiss the candidate and stop - do not carry on through the
    remaining questions. Note that 'we do not intend children to use it' is not the same answer as
    'it is not offered directly to children', and a product that is in fact used by children while
    addressing adults raises different duties (Art. 5(1)(a) fairness, Art. 25 by-design defaults)
    rather than this one."
  - Is consent the lawful basis for the processing at this collection point? Art. 8(1) opens with
    'Where point (a) of Article 6(1) applies', so this Article reaches only the processing whose
    basis is consent. Most account sign-ups run on performance of a contract (Art. 6(1)(b)) for the
    account itself and on consent only for specific extras - marketing email, analytics,
    personalisation, profile visibility. Identify what is collected at this surface, split it by
    purpose, and say which purposes rest on consent; quote the consent record, the checkbox, the
    consent store write, or the privacy notice statement of basis. Where nothing at this surface
    rests on consent, say so - and note Art. 8(3), which preserves Member State general contract law
    on the validity, formation and effect of a contract with a child, so choosing basis (b) does not
    settle the underlying question of whether a child can bind themselves.
  - "Does this sign-up flow establish the user's age before any consent-based processing begins, and
    where the user is below the age applicable in their Member State, does it obtain and verify
    authorisation from the holder of parental responsibility? This is the question a suppression
    would have answered from a keyword, and it is asked here instead so that the answer is visible
    and can be disagreed with. Search the whole project and quote what is found with its file and
    line: an age or date-of-birth field at each entry point; a threshold constant (MIN_AGE,
    ageLimit, AGE_OF_CONSENT, digitalConsentAge, minimumAge) and whether any branch reads it; an
    age-verification or age-assurance call, including a third-party vendor SDK; a parental or
    guardian consent field, screen, token or email address; a child, kids, teen or minor account
    mode. Then say which shape this project is in: (a) a date of birth is collected and no branch
    reads it, (b) an account is created with no age step at all, (c) an age is collected and
    compared but nothing behind it reaches a parental authorisation, (d) a threshold exists and is
    applied, (e) a per-country table exists and one or more of its rows is out of date. Finding the
    vocabulary is the start of the answer and not the answer: a gate on one entry point says nothing
    about a second one, and a parental-consent screen that records an unverified self-declaration
    satisfies the search and not Art. 8(2)."
  - "What actually happens to the age or date-of-birth value this code collects? Trace it from the
    input to every read. Three outcomes need distinguishing, and only reading the code separates
    them: (i) it is stored and never read by any branch, so nothing is gated on it; (ii) it is read
    but only for display, personalisation, birthday email or analytics segmentation; (iii) it is
    read by a decision that changes what the account can do or what data is collected. Quote the
    write and every read. Where the answer is (i) or (ii), the value is being collected without the
    purpose that would justify it, which is a data-minimisation question under Art. 5(1)(c) as well
    as this one."
  - "Where the code applies an age threshold, what number is it, which Member States' users does the
    service reach, and does that number hold in each of them? Art. 8(1) sets 16 as the default and
    its second subparagraph lets each Member State legislate a lower age with a floor of 13, so a
    service reaching several Member States faces several thresholds at once. THE NATIONAL AGES, as
    carried by this rule and sourced row by row in legal_basis (each row there gives the provision,
    the in-force date of the instrument that set it, and the source that was retrieved): AT 14, BE
    13, BG 14, CY 14, CZ 15*, DE 16=, DK 15, EE 13, ES 14, FI 13, FR 15, GR 15*, HR 16=, HU 16=, IE
    16=, IT 14, LT 14, LU 16=, LV 13, MT 13, NL 16=, PL 16=, PT 13, RO 16=*, SE 13, SI 15, SK 16=. A
    trailing '=' marks a Member State that legislated no lower age at all, so the GDPR default of 16
    is what applies there; a trailing '*' marks a row that was NOT verified against a primary source
    - CZ, GR and RO - and those three rows say so in their own words in legal_basis, which is where
    to look before relying on them. TWO ROWS HAVE MOVED SINCE 2018 and are the ones a compilation
    gets wrong: Denmark is 15 only from 2024-01-01 (13 before that, and consent given before the
    change stays under the old rule), and Slovenia is 15 only from 2023-01-26 (before ZVOP-2 it had
    no implementing act at all, so 16 applied directly). Compare the code's number against the
    states the service actually reaches, and quote the constant and the comparison. Three shapes to
    name explicitly: a single hard-coded number, which cannot hold across the Union unless the code
    treats it as a floor for everyone; a hard-coded 18, which is not a GDPR figure and usually
    arrives from a COPPA-shaped design or an alcohol, gambling or adult-content gate; and a
    per-country table whose rows have gone stale, which is why every row above is worth checking one
    by one rather than at a glance. Say which row you are relying on. Where the country is unknown
    at the point of decision, the only number that is safe everywhere is the highest one that can
    apply, which is 16."
  - "Where a child is below the applicable age, is there a path to consent given or authorised by
    the holder of parental responsibility, and what does the code do to verify that authorisation?
    Art. 8(2) requires the controller to make 'reasonable efforts to verify in such cases that
    consent is given or authorised by the holder of parental responsibility over the child, taking
    into consideration available technology' - so the existence of a parental-consent screen is the
    start of the answer, not the end of it. Quote the verification step and describe what it
    actually establishes: an unchecked 'I am this child's parent' checkbox, a self-entered parent
    email with no confirmation, a confirmed email round trip, a payment-instrument check, a signed
    form, a third-party age-assurance or verifiable-parental-consent service. Say what happens to
    the account between the request and any confirmation, and whether processing starts before
    authorisation arrives. Where there is no such path at all, say so and quote the branch that lets
    the under-age case through."
  - "Does Recital 38's carve-out apply - is this a preventive or counselling service offered
    directly to a child, for which 'the consent of the holder of parental responsibility should not
    be necessary'? This is narrow: a helpline, a mental-health or safeguarding service, a
    child-protection reporting channel. It is not a general social, gaming, educational or content
    product that happens to carry safety features. Where it applies, requiring a parent's
    involvement may itself be the wrong design, and say so."
  - Which party in this repository is the controller for the processing at this surface, in the Art.
    4(7) sense of determining the purposes and means? Art. 8(2) addresses the controller and no one
    else; there is no processor-side limb in this Article. Where the repository is a self-hosted or
    white-label product that other organisations deploy for their own users, the operator of each
    deployment is generally the controller and this codebase supplies the mechanism - in that case
    describe what the code makes possible or impossible for a deploying operator rather than
    reporting a duty against the authors. Quote the deployment model from the README, the licence,
    the installation instructions or the hosting configuration.
  - Is there an account-creation path other than the one this candidate points at, and does it
    behave the same way? Social and federated sign-in (Google, Apple, GitHub, SAML, magic link),
    invitation flows, API-key or CLI account creation, admin-created accounts, and importers all
    create users without passing through the form the detector found. List every entry point you can
    find and say whether each one reaches the same age handling, or bypasses it. A gate on one path
    and none on the others is the commonest way this obligation is missed in practice.
evidence_template: "{file}:{line} carries vocabulary from one of this rule's seven patterns: a
  date-of-birth field name in one of the Member State languages, an age compared against a literal
  between 12 and 21 in either word order, an age-limit, age-threshold, minimum-age, underage or
  COPPA identifier, parental-consent, guardian, child-, minor- or teen-account wording, sign-up or
  account-creation wording, or a two-letter country code mapped to an age between 13 and 16. That is
  vocabulary, not location: the detector did not establish that the matched line is part of an
  account-creation, age-assurance or parental-authorisation surface, because a date of birth on a
  clinical or personnel record and an age comparison inside a content filter are written in the same
  words. Read the surrounding code and say which surface, if any, this line belongs to - that
  surface is where GDPR Art. 8 has to be answered. It is also not evidence that the service is
  offered directly to a child; determine the audience first (context question 1), and only then
  decide whether an age is collected without gating anything, whether an account can be created with
  no age step, whether an age is asked for with no parental-authorisation path behind it, or whether
  a hard-coded threshold has been applied across Member States with different ages."
remediation_template: |
  This is a candidate for review against GDPR Art. 8, not a determination about this code. Art. 8
  addresses the controller (Art. 4(7)) and is engaged only where two things hold together: an
  information society service is offered directly to a child, and consent under Art. 6(1)(a) is the
  basis for the processing. Settle those two before changing anything - for a product with an adult
  or mixed audience, or for processing that runs on contract rather than consent, there is nothing
  here to fix, and the right outcome is a recorded note of why.
  Where both do hold, the engineering questions are these.
  1. Which age applies. Art. 8(1) sets 16 as the default and its second subparagraph lets each
     Member State legislate a lower age down to a floor of 13, so the binding threshold sits
     somewhere in 13 to 16 and is fixed by the national implementing law of each Member State whose
     users the service reaches - a service available across the Union faces several at once. The
     age of every Member State is carried in this rule: the working list is in the context question
     about thresholds, and each row is sourced in legal_basis with its national provision, the
     in-force date of the instrument that set it, and whether that state derogated from 16 at all.
     A single hard-coded number is the shape to look at hardest: 18 is not a GDPR figure and usually
     arrives from a COPPA-shaped or adult-content design, and 13 is the floor of the range rather
     than a safe default. Making the threshold a per-country value, sourced from the national law
     and defaulting to 16 where the country is unknown, is the change that removes the assumption.
     A per-country table is not the end of the work, because the numbers move: Denmark went from 13
     to 15 on 2024-01-01 and Slovenia from 16 to 15 on 2023-01-26, so a table written before those
     dates is now below the national floor in two states. Whatever holds the numbers - a constant,
     a config file, a remote table - needs a date on it and a review that outlives the developer
     who wrote it.
  2. Whether the age is used. A date of birth that is stored and never read by a gating branch buys
     nothing and costs a data-minimisation question under Art. 5(1)(c). Either connect it to a
     decision or stop collecting it.
  3. What happens below the threshold. Art. 8(1) permits the processing where consent is given or
     authorised by the holder of parental responsibility, and Art. 8(2) requires the controller to
     make reasonable efforts to verify that authorisation, taking available technology into account.
     An unverified self-declaration is the weak point: a parent email that is never confirmed
     establishes nothing. Holding the account in a state that collects no consent-based data until
     authorisation is confirmed is what makes the verification step load-bearing rather than
     decorative.
  4. Every entry point, not one. Social sign-in, invitations, API and admin account creation, and
     importers routinely bypass the form that carries the age step.
  Two adjacent obligations are commonly confused with this one and are not covered by it: whether
  the interface and privacy information are in language a child can understand (Arts. 12-14 and
  Recital 58), and whether the shipped defaults are the most protective ones for a child's account
  (Art. 25). Both are separate rows with their own rules.

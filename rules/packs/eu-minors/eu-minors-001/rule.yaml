      from 2024-07-01 carries § 15 unchanged. PRIMARY: slov-lex.sk, the official Slovak legal
      information portal, fetched and grepped. CORRECTION 2026-11-15: two words of the quotation,
      spracúva and dovŕšila, had lost a diacritic until § 15 ods. 1 was read again on that
      snapshot."
    url: https://static.slov-lex.sk/static/SK/ZZ/2018/18/20240701.html
    checked_at: 2026-11-15
    jurisdiction: SK
    supports_rule_condition: false

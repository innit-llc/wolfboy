      age.' Section 31(2) narrows information society services for Irish purposes to exclude
      preventive or counselling services, tracking Recital 38, and section 31(3) required a review
      of subsection (1) within three to four years of commencement; the Act's official amendments
      table shows no subsequent amendment to section 31, so the review did not move the figure. IN
      FORCE 2018-05-25 (Data Protection Act 2018 (Commencement) Order 2018, S.I. No. 174 of 2018).
      PRIMARY: the electronic Irish Statute Book, fetched and grepped."

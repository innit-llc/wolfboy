id: eu-minors-001
pack: eu-minors
short_name: "Sign-up: age check and parental consent"
problem_line:
  text: "Sign-up: age check or parental consent not found or weak"
fix_line: Check age per country's limit; below it, get parental consent, reasonably verified, before
  consent-based processing.
title: Age assurance and parental authorisation at the account-creation surface (GDPR Art. 8)
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 8 'Conditions applicable to child's consent in relation
      to information society services', quoted in full from the Official Journal text (CELEX
      32016R0679, English), retrieved 2026-07-27 from the Publications Office cellar. Art. 8(1):
      'Where point (a) of Article 6(1) applies, in relation to the offer of information society
      services directly to a child, the processing of the personal data of a child shall be lawful
      where the child is at least 16 years old. Where the child is below the age of 16 years, such
      processing shall be lawful only if and to the extent that consent is given or authorised by
      the holder of parental responsibility over the child.' Second subparagraph of Art. 8(1):
      'Member States may provide by law for a lower age for those purposes provided that such lower
      age is not below 13 years.' Art. 8(2): 'The controller shall make reasonable efforts to verify
      in such cases that consent is given or authorised by the holder of parental responsibility
      over the child, taking into consideration available technology.' Art. 8(3): 'Paragraph 1 shall
      not affect the general contract law of Member States such as the rules on the validity,
      formation or effect of a contract in relation to a child.' ADDRESSEE: the controller, defined
      by Art. 4(7) as 'the natural or legal person, public authority, agency or other body which,
      alone or jointly with others, determines the purposes and means of the processing of personal
      data'. Art. 8(2) names the controller expressly; there is no processor-side duty in this
      Article. THE AGE THRESHOLD IS NOT 16 EVERYWHERE, AND THIS RULE CARRIES THE NATIONAL AGES
      RATHER THAN ASKING THE ADJUDICATING AGENT TO RECALL THEM: 16 is the default in the first
      subparagraph, and the second subparagraph lets each Member State legislate a lower age down to
      a floor of 13, so the age that binds a given service is the one in the national implementing
      law of each Member State whose users it reaches, anywhere in the closed range 13 to 16. A
      service available across the Union faces several different thresholds at once. CORRECTION,
      2026-07-27, recorded rather than quietly applied: an earlier version of this entry stated that
      published compilations of the national ages contradict each other and concluded that no table
      could be carried. The contradictions are real and the conclusion drawn from them was wrong.
      They are staleness, not legal doubt. Denmark circulates as both 13 and 15 because both are
      correct for different periods - Lov nr. 1783 af 28. december 2023 replaced 13 with 15 in
      databeskyttelsesloven s. 6(2)-(3) with effect from 1 January 2024 - and Slovenia moved the
      same way under ZVOP-2. Resolving a stale secondary source against a dated primary instrument
      is the problem this product exists to solve, so the national ages follow as one legal_basis
      entry per Member State, each carrying three things the compilations omit: the IN-FORCE DATE of
      the instrument that set the age (not its adoption date, and not a compilation's publication
      date), the NATIONAL PROVISION that sets it, and whether the state DEROGATED from the GDPR
      default at all or simply left 16 in place. HOW TO READ A ROW: each entry's checked_at is the
      date the entry was last reviewed, and its url is the source that was actually retrieved on
      that date and grepped for the words quoted in the entry - not a source that looked plausible.
      Twenty-two rows are an official gazette or official consolidated-law service. Two (FR, HU)
      carry official text whose live service blocks automated requests, and say so; their url is the
      live copy that did answer. Three (CZ, GR, RO) open with NOT VERIFIED AGAINST A PRIMARY SOURCE
      or NOT VERIFIED AGAINST THE NATIONAL ACT, and their url is the secondary source the number
      actually rests on, named so that it can be judged rather than laundered. Those three are the
      rows to re-check first. Two more (BG, CY) have a verified age and a commencement date that
      could not be pinned to an express provision, and say so in place. A row that says nothing
      about its limits has none that were found."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "GDPR Art. 4(25), by way of Directive (EU) 2015/1535 Art. 1(1)(b): \"'information society
      service' means a service as defined in point (b) of Article 1(1) of Directive (EU) 2015/1535
      of the European Parliament and of the Council\". That definition, quoted from the Official
      Journal text of Directive (EU) 2015/1535 (CELEX 32015L1535, English), retrieved 2026-07-27:
      \"'service' means any Information Society service, that is to say, any service normally
      provided for remuneration, at a distance, by electronic means and at the individual request of
      a recipient of services\", where 'at a distance' means 'the service is provided without the
      parties being simultaneously present', 'by electronic means' means 'sent initially and
      received at its destination by means of electronic equipment for the processing (including
      digital compression) and storage of data, and entirely transmitted, conveyed and received by
      wire, by radio, by optical means or by other electromagnetic means', and 'at the individual
      request of a recipient of services' means 'provided through the transmission of data on
      individual request'. Directive (EU) 2015/1535 Annex I carries an indicative list of services
      outside the definition. An ordinary hosted web or mobile application is an information society
      service on this definition; 'normally provided for remuneration' describes the class of
      service, not this instance, so a product free at the point of use is not thereby outside it."
    url: http://publications.europa.eu/resource/celex/32015L1535
    checked_at: 2026-11-15
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR Art. 6(1)(a): 'Processing shall be lawful only if and to the extent that at least one of
      the following applies: (a) the data subject has given consent to the processing of his or her
      personal data for one or more specific purposes'. Quoted from CELEX 32016R0679, retrieved
      2026-07-27. CORRECTION 2026-08-03: this entry read 'specified purposes' until the
      quote-verification gate was extended to rule cites and found it. Art. 6(1)(a) reads 'specific
      purposes'; 'specified purposes' is Art. 9(2)(a), the explicit-consent provision for special
      categories, which this rule does not cite. Do not restore the other word. Art. 8(1) opens with
      'Where point (a) of Article 6(1) applies', so Art. 8 is engaged only for the processing whose
      basis is consent. Processing of the same child's data on another Art. 6(1) basis - performance
      of a contract under (b), legal obligation under (c), legitimate interests under (f) - does not
      engage Art. 8, although Art. 8(3) preserves the Member States' general contract law on the
      validity of a contract with a child, so basis (b) is not a way round the question. Which basis
      a sign-up flow actually runs on is not visible to a detector and is asked as a context
      question."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR Recital 38: 'Children merit specific protection with regard to their personal data, as
      they may be less aware of the risks, consequences and safeguards concerned and their rights in
      relation to the processing of personal data. Such specific protection should, in particular,
      apply to the use of personal data of children for the purposes of marketing or creating
      personality or user profiles and the collection of personal data with regard to children when
      using services offered directly to a child. The consent of the holder of parental
      responsibility should not be necessary in the context of preventive or counselling services
      offered directly to a child.' Recital 58, last sentence: 'Given that children merit specific
      protection, any information and communication, where processing is addressed to a child,
      should be in such a clear and plain language that the child can easily understand.' Both
      quoted from CELEX 32016R0679, retrieved 2026-07-27. Recital 38 carries the only express
      carve-out in this area - preventive or counselling services offered directly to a child - and
      it is the interpretive anchor for the marketing and profiling case."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR Art. 83(4)(a): 'Infringements of the following provisions shall, in accordance with
      paragraph 2, be subject to administrative fines up to 10 000 000 EUR, or in the case of an
      undertaking, up to 2 % of the total worldwide annual turnover of the preceding financial year,
      whichever is higher: (a) the obligations of the controller and the processor pursuant to
      Articles 8, 11, 25 to 39 and 42 and 43'. Quoted from CELEX 32016R0679, retrieved 2026-07-27.
      Article 8 is named expressly in the lower of the two tiers, not in Art. 83(5). The distinction
      matters and is easy to get wrong: Art. 83(5)(a) covers 'the basic principles for processing,
      including conditions for consent, pursuant to Articles 5, 6, 7 and 9' at 20 000 000 EUR or 4
      %, and Art. 8 is absent from that list. The higher tier can still be reached indirectly,
      because consent that does not satisfy Art. 8 leaves the processing without the Art. 6(1)(a)
      basis it was relying on, which is an Art. 6 question - but that is a separate finding, on a
      separate provision."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false

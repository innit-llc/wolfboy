  - cite: "NATIONAL AGE - DE 16. Derogation: NO - Germany legislated no lower age, so the GDPR default
      applies unchanged. This is a negative proof rather than silence copied from a compilation: the
      Bundesdatenschutzgesetz carries its consent provision at § 51 BDSG, whose five subsections
      cover proof, form, withdrawal, voluntariness and special categories and mention neither age
      nor minors nor information society services; a full-text search of the BDSG for
      'Minderjährig', 'Informationsgesellschaft', 'Altersgrenze' and '16 Jahre' returns nothing. §
      20 TDDDG does regulate minors' data in digital services, but it restricts commercial re-use of
      data collected for youth protection and sets no consent age. IN FORCE 2018-05-25, the date the
      GDPR applied. PRIMARY: gesetze-im-internet.de, the federal official consolidation, § 51 and §
      20 TDDDG both fetched and grepped."

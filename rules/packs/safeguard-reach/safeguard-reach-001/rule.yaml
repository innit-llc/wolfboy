    - (?:^|\r?\n)[
      \t]*["']?[\w.$-]{0,40}(?:(?&erasure_verb)|[Cc][Ll][Ee][Aa][Rr]|CLEAR)[\w.$-]{0,40}["']?[
      \t]*(?:=>|[:=])
    - \b(?:DELETE|[Dd]elete)[ \t]+(?:FROM|from)[ \t]+["'\[]?[A-Za-z_][\w.$]{0,60}["'\]]?[
      \t]*(?:WHERE|where|;)|\b(?:TRUNCATE|[Tt]runcate)[ \t]+(?:TABLE|table)\b|\b(?:DROP|[Dd]rop)[
      \t]+(?:TABLE|table)\b
  match_without:

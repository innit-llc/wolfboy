id: safeguard-reach-001
pack: safeguard-reach
short_name: '"Delete everything" promise beside the code that does it'
problem_line:
  text: Total-deletion claim wider than the routine it describes
fix_line: Extend the routine to everything the message names, above all identifying records, or say
  what is kept and how long.
title: Total deletion, clearing or reset claim served beside the routine that answers it
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(a) - personal data shall be 'processed lawfully,
      fairly and in a transparent manner in relation to the data subject'. This is the operative
      provision for this rule and the transparency limb is the one that bites. A product that tells
      a person every statistic for a website will be deleted, or that a file is being deleted from
      all of their devices, has made a statement about what happens to their data; where the routine
      behind the message reaches a narrower set of records than the message names, the person has
      been told something that is not so about the processing of their own data, and the gap between
      the two is the finding. The two product messages just described are paraphrased rather than
      quoted, deliberately: the only quoted words in this field are the Regulation's own, so that
      every quotation mark here marks something a reader can find in the Official Journal text.
      Nothing in this detector establishes that the gap exists - it establishes only that a total
      claim is made in a file that also carries a deletion or clearing routine."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e), the storage-limitation principle. Art. 5(1)
      opens 'Personal data shall be:' and point (e) reads: 'kept in a form which permits
      identification of data subjects for no longer than is necessary for the purposes for which the
      personal data are processed'. Carried because the records a shortfalling control leaves behind
      are records the controller is still keeping, and the period for which they are kept is set by
      the purpose and not by the existence of a delete button. Read the words exactly: FOR NO LONGER
      THAN IS NECESSARY means no duration is right or wrong on its face and a detector cannot
      compute the permitted period from code, and KEPT IN A FORM WHICH PERMITS IDENTIFICATION means
      data anonymised past identification is outside the point altogether. This entry is why the
      finding is about a store that keeps identifying records the operator believes it has erased,
      rather than only about a message being wrong. Reused in substance from `eu-retention-001`,
      which cites the same point with the same quoted spans."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 17(1): 'The data subject shall have the right to obtain
      from the controller the erasure of personal data concerning him or her without undue delay and
      the controller shall have the obligation to erase personal data without undue delay where one
      of the following grounds applies', the first ground being that 'the personal data are no
      longer necessary in relation to the purposes for which they were collected or otherwise
      processed'. Carried to fix a boundary rather than to test one. Where the string this rule
      matches sits on the path a person uses to erase their own data, a routine that reaches less
      than the message names is an erasure that has not been completed; where the string sits on an
      operator's maintenance path, Art. 17 is not engaged at all and Art. 5(1)(a) and 5(1)(e) carry
      the finding on their own. Which of the two it is, is context question 4. Reused verbatim in
      substance from `eu-retention-001` and `eu-dsr-001`, both of which quote this paragraph."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(2): 'The controller shall be responsible for, and be
      able to demonstrate compliance with, paragraph 1'. Reference only, and carried for one reason:
      it puts the burden of showing the position on the controller. A candidate raised by this rule
      is a question the operator is in a position to answer and the reader is not - which records
      the routine reaches, and which it does not - and Art. 5(2) is why the absence of an answer is
      itself worth recording. It establishes no duty this detector tests."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.25

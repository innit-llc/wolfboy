    - \b(?:(?&erasure_verb)|(?<!\b[Aa]ll[ \t])(?<!\bALL[ \t])[Cc][Ll][Ee][Aa][Rr]|CLEAR)[
      _-]{0,2}(?:(?:(?&total_scope_word)|[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee](?=[
      _-]{0,2}(?&erasure_verb))|[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee](?=[
      _-]{0,2}(?:(?:[Uu]ser|USER|[Cc]ustomer|CUSTOMER|[Aa]ccount|ACCOUNT|[Pp]ersonal|PERSONAL|[Mm]ember|MEMBER)[
      _-]{0,2})?(?:[Dd]ata|DATA|[Rr]ecords?|RECORDS?|[Pp]rofiles?|PROFILES?|[Hh]istory|HISTORY|[Ii]nformation|INFORMATION)\b))|(?:[Aa][Nn][Yy](?![
      \t]*(?:\[\])?[ \t]*(?:[>)\];,|&}=]|$))|(?<![:<|&][ \t]{0,3})(?<!\bas[
      \t])[Aa][Nn][Yy]|ANY))(?![a-z])
    - \b(?:[Nn]o|NO|[Nn]one|NONE|[Nn]othing|NOTHING)\b[^\n]{0,40}\b(?:[Cc]opies|COPIES|[Cc]opy|COPY|[Bb]ackups|BACKUPS|[Tt]races|TRACES|[Rr]ecords|RECORDS)\b[^\n]{0,40}\b(?:[Rr]emain|REMAIN|[Rr]emains|[Rr]emaining|[Kk]ept|KEPT|[Rr]etained|RETAINED|[Ll]eft|LEFT|[Pp]reserved|PRESERVED)\b
  also_in_file:

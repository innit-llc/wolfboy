      \t]){0,6}(?:be(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6}|been(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6}|get(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6})?(?:[Dd]elet(?:e|ed|es|ing|ion)|DELET(?:E|ED|ES|ING|ION)|[Cc]lear(?:ed|s|ing)|CLEAR(?:ED|S|ING)|[Rr]emov(?:e|ed|es|ing|al)|REMOV(?:E|ED|ES|ING|AL)|[Ee]ras(?:e|ed|es|ing|ure)|ERAS(?:E|ED|ES|ING|URE)|[Ww]ip(?:e|ed|es|ing)|WIP(?:E|ED|ES|ING)|[Pp]urg(?:e|ed|es|ing)|PURG(?:E|ED|ES|ING)|[Rr]eset(?:s|ting)?|RESET(?:S|TING)?|[Dd]estroy(?:ed|s|ing)?|DESTROY(?:ED|S|ING)?|[Dd]iscard(?:ed|s)?|DISCARD(?:ED|S)?)\b
    - ^(?:(?!\b(?:[Dd]elet(?:e|ed|es|ing|ion)|DELET(?:E|ED|ES|ING|ION)|[Cc]lear(?:ed|s|ing)|CLEAR(?:ED|S|ING)|[Rr]emov(?:e|ed|es|ing|al)|REMOV(?:E|ED|ES|ING|AL)|[Ee]ras(?:e|ed|es|ing|ure)|ERAS(?:E|ED|ES|ING|URE)|[Ww]ip(?:e|ed|es|ing)|WIP(?:E|ED|ES|ING)|[Pp]urg(?:e|ed|es|ing)|PURG(?:E|ED|ES|ING)|[Rr]eset(?:s|ting)?|RESET(?:S|TING)?|[Dd]estroy(?:ed|s|ing)?|DESTROY(?:ED|S|ING)?|[Dd]iscard(?:ed|s)?|DISCARD(?:ED|S)?)\b)[^\n]){0,400}?\b(?:[Dd]o|DO|[Dd]oes|DOES|[Dd]id|DID|[Ww]o|WO|[Ww]ould|WOULD|[Ss]hould|SHOULD|[Cc]ould|COULD|[Ii]s|IS|[Aa]re|ARE|[Ww]as|WAS|[Ww]ere|WERE|[Hh]as|HAS|[Hh]ave|HAVE|[Hh]ad|HAD|[Mm]ust|MUST)n['’]t(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6}(?:be(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6}|been(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6}|get(?:<[^<>\n]{0,60}>|&lt;[^;\n]{0,10};|[
      \t]){0,6})?(?:[Dd]elet(?:e|ed|es|ing|ion)|DELET(?:E|ED|ES|ING|ION)|[Cc]lear(?:ed|s|ing)|CLEAR(?:ED|S|ING)|[Rr]emov(?:e|ed|es|ing|al)|REMOV(?:E|ED|ES|ING|AL)|[Ee]ras(?:e|ed|es|ing|ure)|ERAS(?:E|ED|ES|ING|URE)|[Ww]ip(?:e|ed|es|ing)|WIP(?:E|ED|ES|ING)|[Pp]urg(?:e|ed|es|ing)|PURG(?:E|ED|ES|ING)|[Rr]eset(?:s|ting)?|RESET(?:S|TING)?|[Dd]estroy(?:ed|s|ing)?|DESTROY(?:ED|S|ING)?|[Dd]iscard(?:ed|s)?|DISCARD(?:ED|S)?)\b
    - (?<!\band[ \t])\bfrom[ \t]+(?:your|this|the[ \t]+current)[
      \t]+(?:device|computer|browser|phone|machine|handset)\b
context_questions:
  - "MANDATORY, AND THE DETECTOR DID NOT CHECK IT: DOES THE ROUTINE REACH THE RECORDS THE CLAIM
    NAMES? This is the whole question and no pattern in this rule answers any part of it. Read the
    routine the claim sits beside and enumerate what it touches, then read the claim and enumerate
    what it names. Four shortfalls have been recorded in real trees and each is invisible to a
    pattern: a second store that no deletion path addresses at all; a clearing call bound to the
    default instance of a library whose substantive content is in a named instance; a predicate that
    cannot match the rows left at the shipped default; and a removal that writes a flag while the
    blob or the buffer persists. Where the two enumerations agree, say so - a control that reaches
    what it claims is the answer this rule most often gets, and recording it is what makes the rule
    usable."
  - "IS THE SECOND STORE CONFIGURED IN THIS DEPLOYMENT? Where the shortfall depends on a store that
    a deployment may or may not run - an analytics warehouse behind an environment variable, an
    offline store created only in the browser - the size of the escaping population is a deployment
    fact and not a code fact. Establish from the deployment's own configuration whether it is
    running. Where it is not, the finding is about a capability the product ships and should say so
    in those words. Where the second store is REQUIRED rather than optional, say that too: it means
    no deployment choice even sizes the escape."
  - "WHAT DOES THE PERSON ACTUALLY SEE, AND WHERE IS THE STRING RENDERED? A matched string is not
    necessarily shown to anybody: a message key can be dead, a modal can be behind a feature flag, a
    status line can be reachable only by an operator. Find the render site. Then quote the sentence
    the person reads in full, including any qualification that follows it - a message whose own next
    clause names its limits ('but your settings will remain intact', 'for this network only') is a
    narrower claim than the first clause alone, and the canon's boundary puts a control whose own
    text discloses its limits ADJACENT to this type rather than inside it."
  - IS THIS AN ERASURE PATH FOR A PERSON, OR AN OPERATOR MAINTENANCE PATH? The two carry different
    provisions and the finding changes with the answer. A control the data subject reaches - delete
    my account, clear my history, reset my data - engages Art. 17(1) as well as Art. 5(1)(a) and
    5(1)(e). An operator's maintenance command engages the storage-limitation principle and the
    fairness of what the operator was told, and not the erasure right at all. Name the route and who
    can reach it.
  - "WHOSE DATA IS IN THE PART THAT ESCAPES? The severity of a shortfall is set by what is left
    behind, not by the size of the claim. Read the leftover store and name the categories: message
    bodies, document blobs, visit counters, credentials, special-category data. A buffer of chat
    lines and a table of page-view counts are very different residues behind two claims that read
    alike."
  - IS THERE A CONTRAST ANCHOR IN THE SAME TREE? Products that overstate one control often describe
    another honestly, and the honest one is the best evidence of what the operator knows. For
    example, two delete dialogs may say that the visitor analytics are removed too, while a third
    says that they are kept for historical reporting. Look for the sibling message that admits what
    is kept, quote it, and say whether the two can both be true.
  - WAS ANYTHING MEASURED, OR IS THIS A READING? Say plainly which parts of the answer come from
    running the code and which from reading it. A deletion path can be exercised - delete a record,
    then look for it in every store the product writes to - and where that was done the finding
    should carry the result rather than an argument. Where it was not done, say so.
evidence_template: "{file}:{line} carries a claim that data will be deleted, cleared, reset, removed
  or wiped, quantified as total - all, every, everything, permanently, from all devices, or no
  copies remaining - in a file that also carries a deletion or clearing routine, a key naming such
  an action, or an SQL erasure statement. THIS ESTABLISHES ONLY THAT THE CLAIM AND A ROUTINE ARE IN
  THE SAME FILE. It does not establish that the routine reaches less than the claim names, which is
  the construct and which nothing in this detector can see: that is a whole-tree question about a
  second store, a second index, a NULL predicate or a blob left behind, and it is context question
  1. FOUR FURTHER THINGS ARE NOT ESTABLISHED. FIRST, WHETHER A SECOND STORE IS EVEN CONFIGURED in
  this deployment - a deployment fact, context question 2. SECOND, WHETHER THE STRING IS SHOWN TO
  ANYBODY: a message key can be dead and a modal can be behind a flag (context question 3). THIRD,
  WHETHER THE QUALIFICATION THAT FOLLOWS THE SENTENCE NARROWS IT - the canon puts a control whose
  own text discloses its limits ADJACENT to this type, not inside it, so a message that names its
  own scope is not this construct (context question 3). FOURTH, WHETHER THIS IS A DATA-SUBJECT
  ERASURE PATH OR AN OPERATOR MAINTENANCE PATH, which decides whether Art. 17(1) is engaged at all
  (context question 4). Read the claim and the routine together before deciding, and where the
  routine reaches everything the claim names, record that as the answer."
remediation_template: >
  Start by enumerating both sides in writing, because the whole of this construct is the difference

  between them. List what the routine touches: every table, every index, every bucket, every named

  browser store, every device that holds a copy. Then list what the message names. Put the two lists

  beside each other.

  Where the routine reaches everything the message names, nothing needs changing and the record of

  that comparison is worth keeping, because the next person to read the message will ask the same

  question.

  Where it does not, there are two honest repairs and the choice between them is a product decision

  rather than a legal one. Either extend the routine to reach what the message names - the second

  store, the named instance, the rows left at the shipped default, the blob behind the flag - or

  narrow the message to what the routine reaches, in the words a person would use, naming what is

  kept and for how long.

  Prefer extending the routine wherever the leftover records are identifying, because a narrower

  message does not shorten the period for which those records are kept, and the storage-limitation

  principle applies to the store whatever the interface says.

  Where the leftover store is one the product does not control on this deletion path - a warehouse

  written by a different service, a copy on a device that is offline - say so in the message and
  give

  the person a way to see the state of it. An honest description of a partial deletion is a
  different

  thing from a total claim that is not met, and the recorded in-tree contrast anchor shows a product

  writing one of each in the same directory.

  Record the outcome in the record of processing activities as the retention position of the store

  that keeps the residue, with its own period and its own purpose, rather than folding it into the

  period the deleted store carries.
data_categories:
  - user.account
  - user.content
  - user.behavior
fingerprint_spec: file

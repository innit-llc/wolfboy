      \t]*\([^\n]{0,80}(?<![A-Za-z0-9])(?&expiry_column)(?![A-Za-z0-9])[^\n]{0,25}(?:[<>]=?|__(?&time_comparison_keyword)(?![A-Za-z0-9])|(?:=>|[:=])[

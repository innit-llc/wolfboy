    - ^(?![ \t]*(?://|#|--|\*))[^\n]{0,200}(?<![A-Za-z0-9])(?&expiry_column)(?![A-Za-z0-9])[
      \t]*(?:__(?&time_comparison_keyword)(?![A-Za-z0-9])|[<>]=?|(?:=>|[:=])[ \t]*\{?[

id: safeguard-reach-002
pack: safeguard-reach
short_name: Delete, expiry or limit step that may miss its data
problem_line:
  text: Delete, expiry or limit step that misses its data
fix_line: "Make the step act on the data: delete flagged rows, clear every copy, set an expiry, or
  fix what switches it off."
title: Data-limiting control whose predicate, binding or presence cannot reach what it is for
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e), the storage-limitation principle. Art. 5(1)
      opens 'Personal data shall be:' and point (e) reads: 'kept in a form which permits
      identification of data subjects for no longer than is necessary for the purposes for which the
      personal data are processed'. This is the operative provision for limb (i) and for the
      flag-write form of limb (ii): where the sweep cannot select the rows left at the shipped
      default, or where the removal writes a flag while the object persists, those records are kept,
      and the period for which they are kept is set by the purpose rather than by the existence of
      the sweep. Read the words exactly: FOR NO LONGER THAN IS NECESSARY means no duration is right
      or wrong on its face and a detector cannot compute the permitted period from code, and KEPT IN
      A FORM WHICH PERMITS IDENTIFICATION means data anonymised past identification is outside the
      point altogether. Reused in substance from `eu-retention-001`, which cites the same point with
      the same quoted spans."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(a) - personal data shall be 'processed lawfully,
      fairly and in a transparent manner in relation to the data subject'. The operative provision
      for limb (iii) and for the client-side form of limb (ii). A control the person can see - a
      reset button, a visibility switch - states something about the processing of their data by
      existing at all. Where the control's own binding reaches a narrower set of records than a
      reader would conclude from seeing it, or where the guard that would have honoured the person's
      setting survives only as commented-out code, the person has been given a picture of the
      processing that the code does not answer to.
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 17(1): 'The data subject shall have the right to obtain
      from the controller the erasure of personal data concerning him or her without undue delay and
      the controller shall have the obligation to erase personal data without undue delay where one
      of the following grounds applies', the first ground being that 'the personal data are no
      longer necessary in relation to the purposes for which they were collected or otherwise
      processed'. Carried to fix a boundary rather than to test one. Where the control this rule
      matches is the path a person uses to erase their own data, a binding that reaches one store of
      two leaves the erasure incomplete; where it is an operator's maintenance sweep, Art. 17 is not
      engaged and Art. 5(1)(e) carries the finding alone. Which of the two it is, is context
      question 4. Reused in substance from `eu-retention-001` and `eu-dsr-001`, both of which quote
      this paragraph."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(2): 'The controller shall be responsible for, and be
      able to demonstrate compliance with, paragraph 1'. Reference only. It is carried because every
      candidate this rule raises is a question the operator can answer and the reader cannot - what
      the insert path writes, which stores exist, whether the routine is ever called - and Art. 5(2)
      is why the absence of an answer is itself worth recording. It establishes no duty this
      detector tests."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.2

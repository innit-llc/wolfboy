context_questions:
  - DOES THE PRODUCT'S RECTIFICATION ROUTE REACH THESE ROWS? This is the first question because Art.
    16 is what the construct turns on. Find the code that answers a correction request and check
    whether it touches the derived store at all. A route that updates the fields the person typed
    and leaves the generated rows untouched is the ordinary shape, and it means the product cannot
    correct a statement it made about them. Say which it is here, and quote the code path rather
    than assuming from the presence of an account-settings form.
  - DOES ANYTHING ACT ON THE ASSESSMENT, OR IS IT ONLY SHOWN? If a stored score, flag or percentile
    feeds a decision about the person - pricing, ranking, access, pay, moderation - then Art. 22
    comes into play and the sibling rule `derived-personal-data-001` carries the right questions. If
    it is only rendered for the person to read, it does not. This is a fact about the product and is
    asked of the operator, not concluded from the code.
  - WHAT IS THE CONCLUSION COMPUTED FROM, AND HOW CAN IT BE WRONG? Open the generator and list its
    inputs and its thresholds. A spending anomaly computed over three months of history is wrong for
    anyone whose circumstances changed last month; a throughput percentile is wrong for a
    contributor who works in a language with different unit sizes; an enrichment fetched from a
    third party is wrong whenever that third party is. Quote the threshold constants, because they
    are the part a person could contest and the part no user-facing text usually mentions.
  - "IS ANY PART OF THE SENTENCE WRITTEN BY A MODEL, AND DOES THE PERSON KNOW? Some products compute
    the numbers deterministically and have a language model phrase them. Where that is the case,
    record which fields are model-written and which are computed, whether the model call goes to a
    third party (which makes it a recipient question as well), and whether the person is told that
    what they are reading was machine-written. On the AI Act entry in this rule's legal basis: the
    marking obligation in Art. 50(2) does not attach where the system does not substantially alter
    the input data or the semantics thereof, which is the ordinary reading of a writer that phrases
    pre-computed facts - so the question to answer here is the factual one, whether THIS writer
    alters the semantics, and whether the product is the provider or the deployer of that system."
  - "WHAT IS THE RETENTION AND THE EXPORT POSITION OF THE DERIVED STORE? Two separate checks. First,
    whether these rows have a deletion path of their own or only inherit the account's - a
    de-duplicated row keyed to a month can outlive the record it was computed from. Second, whether
    a subject-access export includes them: an export built from the primary tables will not, and the
    derived rows are the part of the answer the person has never seen."
evidence_template: "{file}:{line} matched one of five shapes: an assessment noun beside a schema
  declaration, a purpose-built derived-statement name, generator machinery named as such, an
  assessment noun beside a delivery call, or an assessment noun beside a statistical summary. This
  establishes only that THE CODE HAS A CONSTRUCT for generating statements about a person and
  keeping them. It does not establish that the statements are inaccurate, that any person has asked
  for one to be corrected, or that any of them is shown to anyone. It does not establish that
  anything acts on the assessment - that is the boundary with the sibling rule
  `derived-personal-data-001` and is context question 2. And it does not establish whether the
  product's rectification and export routes reach the derived rows, which is the gap the construct
  usually carries and which has to be read out of the code that answers those requests, not out of
  the line that matched."
remediation_template: |
  Start from the rectification route, not from the store. Open the code that answers a correction
  request and establish whether it reaches the derived rows at all. Where it does not, that is the
  concrete item: either the derived rows become correctable, or the generator re-runs on corrected
  inputs and the stale conclusion is removed.
  Art. 16 has a second sentence that is easy to miss and is often the cheaper answer: where a
  conclusion cannot be corrected as such, the person may have incomplete data completed by providing
  a supplementary statement. A derived store with a place to record the person's own account of the
  matter, shown wherever the conclusion is shown, satisfies something a delete-only route does not.
  Write down the inputs and the thresholds of each generator. This is the meaningful information
  about the logic that the transparency provisions describe, and it is ordinarily already in the
  source as named constants - it needs surfacing rather than inventing.
  Check the export. A subject-access export assembled from the primary tables will not contain the
  derived rows, and those are the part of the answer the person has never seen.
  Check the retention. Rows keyed to a period, de-duplicated by a composite key, or refreshed on a
  schedule frequently have no deletion path of their own and outlive the records they were computed
  from.
  Where a language model writes the user-facing sentence, record which fields are model-written and
  which are computed, and whether the call leaves the deployment - if it does, the model provider is
  a recipient and belongs in the record of processing alongside anything already recorded for it.

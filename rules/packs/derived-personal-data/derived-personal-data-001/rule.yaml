id: derived-personal-data-001
pack: derived-personal-data
short_name: Accounts matched as one person, then acted on automatically
problem_line:
  text: Accounts linked as one person, and the link acted on
fix_line: Give each automated action on a match human review and a way to respond and contest;
  record how the key can be wrong.
title: Accounts re-linked by a derived identifier, with an automated adverse action on the match
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 22(1) - 'The data subject shall have the right not to
      be subject to a decision based solely on automated processing, including profiling, which
      produces legal effects concerning him or her or similarly significantly affects him or her.'
      The construct this rule locates is a decision of exactly that shape when two conditions hold
      that the detector cannot see: that the decision is taken SOLELY by the automated path, and
      that its effect on the person reaches the threshold this paragraph sets - legal effects, or
      effects that similarly significantly affect the person. Context questions 1 and 2 put both to
      the operator"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 22(3) - where the decision is necessary for a contract
      or based on explicit consent, 'the data controller shall implement suitable measures to
      safeguard the data subject's rights and freedoms and legitimate interests, at least the right
      to obtain human intervention on the part of the controller, to express his or her point of
      view and to contest the decision.' This is the provision a finding here is usually answered
      with rather than by removing the detection: the three safeguards are named, and whether the
      deployment has any of them is context question 3"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(d) - personal data shall be 'accurate and, where
      necessary, kept up to date; every reasonable step must be taken to ensure that personal data
      that are inaccurate, having regard to the purposes for which they are processed, are erased or
      rectified without delay'. A derived link between two accounts is itself personal data about
      both people, and it can be wrong in a way the person cannot see: two people behind one
      household address, one shared machine, a re-used payout instrument. Accuracy is a live duty
      over the linkage row, not only over the fields the person typed"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(4) - 'profiling' means any form of automated
      processing of personal data consisting of the use of personal data to evaluate certain
      personal aspects relating to a natural person, in particular to analyse or predict aspects
      concerning that natural person's performance at work, economic situation, health, personal
      preferences, interests, reliability, behaviour, location or movements'. Reference only: a
      definition establishes no duty of its own. It is carried because 'reliability' is the word
      that names what a re-linkage key is used to evaluate, and because Art. 22(1) is written over
      'including profiling'"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 15(1)(h) - the data subject has the right to obtain
      from the controller information on 'the existence of automated decision-making, including
      profiling, referred to in Article 22(1) and (4) and, at least in those cases, meaningful
      information about the logic involved, as well as the significance and the envisaged
      consequences of such processing for the data subject.' Reference only: this detector reads a
      call site and establishes nothing about what an access request is answered with. It is carried
      because the logic here is precisely what an access request would have to describe - which
      fields the key is derived from, and what happens when it matches"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 21(1) - 'The data subject shall have the right to
      object, on grounds relating to his or her particular situation, at any time to processing of
      personal data concerning him or her which is based on point (e) or (f) of Article 6(1),
      including profiling based on those provisions.' Reference only: whether this processing runs
      on legitimate interests at all is an operator fact and is context question 4. It is carried
      because a re-linkage programme is ordinarily defended on Art. 6(1)(f), and the objection right
      is what comes with that defence"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25

context_questions:
  - "WHAT DOES THE MATCH ACTUALLY DO TO THE PERSON, AND IS IT DONE WITHOUT A HUMAN? This is the
    first question because Art. 22(1) turns on it and no detector can see it. Follow the linkage
    from the match site to its consequence and say which of three shapes this is: (i) the match only
    raises a queue item a person reads before anything happens; (ii) the match itself bans, freezes,
    withholds money, disconnects or excludes, with a person able to review afterwards; (iii) the
    match acts and no review path exists. Only (ii) and (iii) are decisions 'based solely on
    automated processing'. Quote the line where the consequence is applied, not the line where the
    key is computed."
  - DOES THE CONSEQUENCE PRODUCE LEGAL EFFECTS OR SIMILARLY SIGNIFICANT ONES? This is a fact about
    the product and is asked of the operator, never read out of the code. Loss of earned money, loss
    of a paid account, loss of access to a service the person depends on, and a record shared with
    other operators are the shapes that ordinarily reach 'similarly significantly affects';
    exclusion from a voluntary game lobby ordinarily does not. State which this deployment is and on
    what basis, rather than treating the code path as settling it.
  - WHICH OF THE THREE SAFEGUARDS IN ART. 22(3) EXISTS HERE - human intervention, the ability to
    express a point of view, the ability to contest the decision? Name the route for each one that
    exists and say plainly which are absent. An appeals inbox that is not mentioned anywhere in the
    codebase may still exist as an operational process, so this is asked of the operator rather than
    concluded from the tree.
  - WHAT IS THE KEY DERIVED FROM, AND HOW OFTEN IS IT WRONG BY CONSTRUCTION? Open the derivation and
    list its inputs. A hash over hardware attributes collides for two people who bought the same
    machine model; a payout instrument is shared by a household; a network address is shared by
    everyone behind one connection; a verification-session identifier is reused when a person
    genuinely re-verifies. Each of these is a false link that the person cannot see and cannot
    correct, which is what Art. 5(1)(d) is about. Say which inputs this deployment uses and what its
    collision shape is.
  - IS THE PERSON EVER TOLD? Check whether the linkage appears in any user-facing surface - an
    account page, an export, an appeal response, a notice at the time of the action. A link that
    decides an outcome and appears in no disclosure is the gap Art. 15(1)(h) describes; record
    whether it is disclosed, and if so where, rather than assuming either way.
evidence_template: "{file}:{line} matched one of four shapes: a purpose-built derived identity key,
  a stored cross-account linkage column, a generic identity token beside an account noun, or a
  generic identity token beside a call that can return more than one row. The file also carries an
  adverse account action or the vocabulary of an automated-abuse apparatus, which is what
  distinguishes this construct from ordinary device fingerprinting. This establishes only that THE
  CODE HAS A CONSTRUCT for re-linking separate accounts by a derived value and acting on the result.
  It does not establish that any person was actually re-linked, nor that any account was acted on.
  It does not establish that the decision is taken solely by the automated path - the match may
  raise a queue item a person reads, which is a different posture and is context question 1. And it
  does not establish that the effect on the person reaches the Art. 22(1) threshold of legal effects
  or similarly significant ones, which is where that provision turns and which is a fact about the
  product, asked of the operator and not inferred from source vocabulary."
remediation_template: >
  Follow the match to its consequence before writing anything. The three shapes in context question
  1

  are materially different postures, and a finding that does not say which one this is has not

  described the construct.

  Where an automated path applies the consequence itself, record the three Art. 22(3) safeguards

  separately - human intervention, the ability to express a point of view, the ability to contest -

  and name the route for each. Where a route is absent, that is the specific item to add, and it is

  ordinarily cheaper than removing the detection.

  Write down what the key is derived from and what its collision shape is. A shared machine, a

  household payout instrument, a shared network address and a re-used verification session each

  produce a link that is wrong about the person, and Art. 5(1)(d) requires that inaccurate personal

  data be rectified or erased without delay. A linkage the person can neither see nor correct cannot

  satisfy that, whatever the match rate is.

  Consider whether the stored linkage column needs to persist after the action it justified. Where
  it

  does, it is personal data about both people and belongs in the record of processing and in what an

  access request returns; where it does not, the accuracy duty gets smaller by deleting it.

  Consider whether the person is told, at the time of the action, that a cross-account link was the

  reason. Art. 15(1)(h) describes meaningful information about the logic involved; a notice that
  says

  only that a rule was triggered does not carry it.

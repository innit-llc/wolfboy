id: derived-personal-data-003
pack: derived-personal-data
short_name: Past anonymous activity re-linked to a person
problem_line:
  text: Past anonymous activity re-linked to a known person
fix_line: Bound the merge to rows after sign-up, or tell people first and rest it on consent or a
  compatibility test.
title: Historical pseudonymous events re-keyed to one identity when a declared attribute arrives,
  with the alias map kept
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(b) - personal data shall be 'collected for
      specified, explicit and legitimate purposes and not further processed in a manner that is
      incompatible with those purposes'. This is the provision the construct turns on. Behaviour
      recorded against an anonymous visitor identifier and behaviour recorded against a named person
      are collected in different circumstances and very often for different stated purposes;
      re-keying the first set to the second is further processing of the earlier rows, and whether
      it is compatible with the purpose they were collected for is the question this rule raises.
      The same point carries its own express carve-out in the following words: 'further processing
      for archiving purposes in the public interest, scientific or historical research purposes or
      statistical purposes shall, in accordance with Article 89(1), not be considered to be
      incompatible with the initial purposes' - a closed list of three purposes, none of which
      describes a merge performed to serve the person a more complete profile"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 6(4) - 'Where the processing for a purpose other than
      that for which the personal data have been collected is not based on the data subject's
      consent or on a Union or Member State law which constitutes a necessary and proportionate
      measure in a democratic society to safeguard the objectives referred to in Article 23(1), the
      controller shall, in order to ascertain whether processing for another purpose is compatible
      with the purpose for which the personal data are initially collected, take into account, inter
      alia:' - and the paragraph then lists five factors, of which three decide this construct: '(a)
      any link between the purposes for which the personal data have been collected and the purposes
      of the intended further processing'; '(b) the context in which the personal data have been
      collected, in particular regarding the relationship between data subjects and the controller';
      and '(e) the existence of appropriate safeguards, which may include encryption or
      pseudonymisation'. Read the opening words exactly, because they set the condition rather than
      the duty: the test is owed where the further processing rests on NEITHER consent NOR the named
      kind of law. Factor (e) is the one that bites hardest here - pseudonymisation is named as a
      safeguard, and this construct is the operation that removes it from data already collected"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1) - personal data 'means any information relating to
      an identified or identifiable natural person', and an identifiable natural person is 'one who
      can be identified, directly or indirectly, in particular by reference to an identifier such as
      a name, an identification number, location data, an online identifier or to one or more
      factors specific to the physical, physiological, genetic, mental, economic, cultural or social
      identity of that natural person'. Reference only: a definition establishes no duty of its own.
      It is carried because this construct is the moment the second half of the sentence becomes the
      first - a corpus that was identifiable only indirectly becomes attached to a named person -
      and because the alias registry means that transition is recorded rather than implicit"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 26 - 'Personal data which have undergone
      pseudonymisation, which could be attributed to a natural person by the use of additional
      information should be considered to be information on an identifiable natural person.'
      Reference only, and a recital enacts no duty. It is carried because it answers in advance the
      objection a reader of this construct reaches for first: that the events were only ever
      pseudonymous, so nothing changed when they were re-keyed. On the Regulation's own reading the
      earlier rows were already information about an identifiable person, and the merge is what
      supplies the additional information the recital describes"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 13(3) - 'Where the controller intends to further
      process the personal data for a purpose other than that for which the personal data were
      collected, the controller shall provide the data subject prior to that further processing with
      information on that other purpose and with any relevant further information as referred to in
      paragraph 2.' Art. 14(4) carries the same duty for data not obtained from the data subject.
      Reference only: whether a given merge is a further purpose at all is the Art. 5(1)(b) question
      above, and this detector cannot settle it. Both are carried because the word in each of them
      is PRIOR - if the merge is a further purpose, the information is owed before it runs, and a
      merge that fires the instant a form is submitted has no obvious moment at which that could
      happen"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: high
rule_confidence: 0.3
detector:
  engine: builtin-regex
  file_globs:
    - "**"
  vocabulary:
    purpose_built_rekey:
      - update_with_query_and_stored_script
      - update_by_query_and_script
      - update_profile_id
      - update_visitor_id
      - reassign_profile_data
      - reassign_browsing_data
      - reassign_persisted_browsing_data
      - merge_profiles
      - merge_profile_on_property
      - merge_visitors
      - merge_identities
      - merge_anonymous_profile
      - identity_resolution
      - identity_stitching
      - profile_stitching
      - identity_graph
      - deanonymize
      - de_anonymise
      - deanonymise

id: derived-personal-data-004
pack: derived-personal-data
short_name: Location worked out from a visitor's IP address
problem_line:
  text: Visitor location derived from IP addresses
fix_line: Record the IP-to-location derivation, on whom and what it produces, and keep no finer
  location than the purpose needs.
title: A location derived from a visitor's IP address, and whether that derivation is in the record
  of processing
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(1) - 'Each controller and, where applicable, the
      controller's representative, shall maintain a record of processing activities under its
      responsibility. That record shall contain all of the following information', and at point (c)
      'a description of the categories of data subjects and of the categories of personal data'.
      This is the duty the rule tests. An IP-to-location derivation is a processing activity, the
      location it produces is a category of personal data, and the visitors it is performed on are a
      category of data subjects - so all three of point (c)'s elements are engaged by an operation
      that is very often invisible to whoever compiles the record, because the value is computed in
      a queue worker and only an aggregate is stored. The duty is not unconditional: Art. 30(5)
      provides that 'The obligations referred to in paragraphs 1 and 2 shall not apply to an
      enterprise or an organisation employing fewer than 250 persons unless the processing it
      carries out is likely to result in a risk to the rights and freedoms of data subjects, the
      processing is not occasional, or the processing includes special categories of data as
      referred to in Article 9(1) or personal data relating to criminal convictions and offences
      referred to in Article 10.' Read the exemption's own words: it falls away where ANY of the
      three conditions is met, and a derivation performed on every visitor to every page is not
      occasional"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1) - personal data 'means any information relating to
      an identified or identifiable natural person', and an identifiable natural person is 'one who
      can be identified, directly or indirectly, in particular by reference to an identifier such as
      a name, an identification number, location data, an online identifier or to one or more
      factors specific to the physical, physiological, genetic, mental, economic, cultural or social
      identity of that natural person'. Reference only: a definition establishes no duty of its own.
      It is carried because both halves of this construct are named in that list in terms - the IP
      address is the online identifier and the value derived from it is location data - so the
      question whether this operation touches personal data at all is answered by the definition
      rather than by argument"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: GDPR (Regulation (EU) 2016/679), Recital 30 - 'Natural persons may be associated with online
      identifiers provided by their devices, applications, tools and protocols, such as internet
      protocol addresses, cookie identifiers or other identifiers such as radio frequency
      identification tags. This may leave traces which, in particular when combined with unique
      identifiers and other information received by the servers, may be used to create profiles of
      the natural persons and identify them.' Reference only, and a recital enacts no duty. It is
      carried because it answers the objection a reader reaches for first - that an IP address held
      for a few milliseconds and reduced to a two-letter country code is nothing at all - by naming
      the IP address as an online identifier and describing exactly the combination this construct
      performs
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be 'adequate, relevant
      and limited to what is necessary in relation to the purposes for which they are processed'.
      Reference only: this detector cannot establish what any deployment needs, and saying which
      resolution of a location is necessary for somebody else's product is exactly the product fact
      a scanner must ask rather than infer. It is carried because it is the question that follows a
      confirmed finding - a country code, a city, a set of coordinates and a retained IP address are
      four different answers to the same purpose - and because the choice between them is usually a
      one-line change nobody has revisited"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: low
rule_confidence: 0.35

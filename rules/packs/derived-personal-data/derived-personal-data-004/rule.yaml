context_questions:
  - "FIND THE CALL SITE AND QUOTE IT. A dependency entry says the product carries an IP-geolocation
    database; it does not say anything runs. Find the line that performs the lookup, name the file,
    and say what is passed in - a request IP, a proxy-forwarded header, an address stored earlier -
    and what comes out. Where the only match is a manifest entry, an import or a database file and
    no call exists anywhere, say so: an unused dependency is a different finding and a much smaller
    one."
  - "WHAT IS KEPT, AND FOR HOW LONG? Three separate answers, and products differ on all three. Is
    the derived value written to a row at all, or only counted? Is the input address written
    anywhere - a log line, a request trace, an error report - after the derivation? And what is the
    value's resolution: a two-letter country code, a city, a region, a set of coordinates? Quote the
    schema or the insert statement rather than inferring from the variable name, because the
    difference between a counter keyed to a country and a per-visit row carrying a city is the whole
    difference between a small finding and a large one."
  - WHOSE RECORD DOES THE DERIVED VALUE END UP ON? A country attached to an aggregate counter is a
    statistic about an audience. A country attached to a session, a visit, an account or an event
    row is an attribute of a person. Say which it is, and where the value is attached to a person's
    record, say whether a subject-access export returns it - derived attributes are routinely
    missing from exports assembled out of the primary tables.
  - IS THE DERIVATION IN THE RECORD OF PROCESSING ACTIVITIES? This is the question the rule exists
    to raise and it cannot be answered from code. Look at whatever the deployment keeps as its
    record of processing - a register, a data map, a privacy notice's processing table - and say
    whether an IP-to-location derivation appears in it as an activity, with the categories of data
    subjects and of personal data that Art. 30(1)(c) names. The ordinary answer is that it does not,
    because the value is computed in a worker and nothing durable shows it. Note also that Art.
    30(5)'s exemption for organisations under 250 persons does not apply where the processing is not
    occasional, and a derivation performed on every visitor is not occasional.
  - "IS THE LOCATION ACTUALLY DERIVED HERE, OR DID SOMETHING UPSTREAM DERIVE IT? Where a CDN or an
    edge runtime supplies the country in a request header, the product may never touch the address
    at all. That is a different position and it should be recorded as one: the derivation is
    performed by another party, that party is a recipient or a separate controller for it, and the
    product's own record has to describe the arrangement rather than the lookup. Say which path this
    deployment is on, and where both exist, say which one runs in production."
  - IS ANYBODY TREATED DIFFERENTLY ON THE RESULT? If the derived location decides access, routing,
    pricing or the payment instruments offered, that is a market-access question under a different
    instrument and `eu-market-001` is the rule that carries it. This rule does not ask it and does
    not answer it. Say here only whether such a use exists, so that a reader knows whether to go and
    look at the other finding; do not fold the two into one.
evidence_template: "{file}:{line} matched a place where this product turns a visitor's IP ADDRESS
  INTO A LOCATION, or carries the means to: a named IP-geolocation database being asked a question,
  such a database beside the address it is given, the database wired in through an import or a
  manifest entry, an edge or CDN geolocation header read, a field that names its own provenance, or
  a MaxMind-format database file. THAT IS THE WHOLE OF WHAT IS ESTABLISHED. THE MATCHES ARE NOT
  EQUALLY INFORMATIVE AND THE DIFFERENCE MATTERS MORE HERE THAN IN MOST RULES. A LOOKUP CALL is the
  construct. A DEPENDENCY ENTRY, AN IMPORT OR A DATABASE FILE says the product carries the
  capability and says nothing at all about whether any line uses it - context question 1 asks for
  the call site and an unused dependency is a much smaller finding. A HEADER READ says the
  derivation happened somewhere upstream, which is a different arrangement with a different party in
  it (question 5). WHAT THIS DETECTOR DOES NOT ESTABLISH: whether the derived value is stored, at
  what resolution, and whether the input address is retained (question 2); whether the value ends up
  on a record about a person or only in an aggregate (question 3); and whether the operation appears
  in the controller's record of processing activities, which is the duty this rule tests and which
  no scan of source code can answer (question 4). THIS FINDING IS NOT A MARKET-ACCESS FINDING.
  Whether anybody is blocked, rerouted or refused a payment instrument on the result is
  `eu-market-001`'s question, that rule requires a country source paired with such an act by an
  explicit and measured design decision of its own, and this rule neither reopens nor duplicates
  it."
remediation_template: >
  Start by finding the call site, because everything else depends on whether one exists. A manifest

  entry with no call is an unused dependency and the answer is to say so and stop.

  Where a lookup does run, write down three facts and put them in the record of processing

  activities: that an IP-to-location derivation is performed, on whom, and what category of personal

  data it produces. Art. 30(1)(c) asks for the categories of data subjects and of personal data, and

  a derivation performed on every visitor is not occasional, so the small-organisation exemption in

  Art. 30(5) does not carry it.

  Then check the resolution against the purpose. A country code, a city, a region and a set of

  coordinates answer very different questions, the choice between them is usually one argument in
  one

  call, and it is rarely revisited after the day the feature was written.

  Check what happens to the address itself. The derivation is often described as transient while the

  same request writes the address into an access log, an error report or a request trace, and those

  three are ordinarily governed by nothing.

  Where the value is attached to a person's record rather than to an aggregate, check the export and

  the deletion path reach it. A derived attribute added by a worker is the kind of column a

  subject-access export assembled from the primary tables leaves out.

  Where a CDN or an edge runtime supplies the country instead, record the arrangement rather than
  the

  lookup: another party performs the derivation, and what the record has to describe is that

  relationship.

id: eu-market-001
pack: eu-market
short_name: "Country or locale checks: access and payment conditions"
problem_line:
  text: Access, redirect or payment set by the customer's country
fix_line: Stop blocking, redirecting without consent or varying payment by country, unless a stated
  legal requirement needs it.
title: Country or locale test, list, picker or geo lookup - access, rerouting or payment conditions
  need review (EU 2018/302)
jurisdiction:
  - EU
legal_basis:
  - cite: "Geo-blocking Regulation (Regulation (EU) 2018/302), Arts. 3, 4 and 5 - addressed to the
      TRADER, defined in Art. 2(18) as 'any natural person or any legal person, irrespective of
      whether privately or publicly owned, who is acting, including through any other person acting
      in the name or on behalf of the trader, for purposes relating to the trade, business, craft or
      profession of the trader'. Art. 3(1): 'A trader shall not, through the use of technological
      measures or otherwise, block or limit a customer's access to the trader's online interface for
      reasons related to the customer's nationality, place of residence or place of establishment.'
      Art. 3(2): 'A trader shall not, for reasons related to a customer's nationality, place of
      residence or place of establishment, redirect that customer to a version of the trader's
      online interface that is different from the online interface to which the customer initially
      sought access, by virtue of its layout, use of language or other characteristics that make it
      specific to customers with a particular nationality, place of residence or place of
      establishment, unless the customer has explicitly consented to such redirection. In the event
      of redirection with the customer's explicit consent, the version of the trader's online
      interface to which the customer initially sought access shall remain easily accessible to that
      customer.' Art. 4(1): 'A trader shall not apply different general conditions of access to
      goods or services, for reasons related to a customer's nationality, place of residence or
      place of establishment, where the customer seeks to: (a) buy goods from a trader and either
      those goods are delivered to a location in a Member State to which the trader offers delivery
      in the general conditions of access or those goods are collected at a location agreed upon
      between the trader and the customer in a Member State in which the trader offers such an
      option in the general conditions of access; (b) receive electronically supplied services from
      the trader, other than services the main feature of which is the provision of access to and
      use of copyright protected works or other protected subject matter, including the selling of
      copyright protected works or protected subject matter in an intangible form; (c) receive
      services from a trader, other than electronically supplied services, in a physical location
      within the territory of a Member State where the trader operates.' Art. 5(1): 'A trader shall
      not, within the range of means of payment accepted by the trader, apply, for reasons related
      to a customer's nationality, place of residence or place of establishment, the location of the
      payment account, the place of establishment of the payment service provider or the place of
      issue of the payment instrument within the Union, different conditions for a payment
      transaction, where: (a) the payment transaction is made through an electronic transaction by
      credit transfer, direct debit or a card-based payment instrument within the same payment brand
      and category; (b) authentication requirements are fulfilled pursuant to Directive (EU)
      2015/2366; and (c) the payment transactions are in a currency that the trader accepts.'
      'Online interface' is defined in Art. 2(16) as 'any software, including a website or a part
      thereof and applications, including mobile applications, operated by or on behalf of a trader,
      which serves to give customers access to the trader's goods or services'; 'general conditions
      of access' in Art. 2(14) includes net sale prices. Art. 11(1): 'It shall apply from 3 December
      2018.' Quoted from the Official Journal text (CELEX 32018R0302, OJ L 60 I, 2.3.2018, p. 1),
      retrieved 2026-07-27 from the Publications Office cellar. There is NO micro or small
      enterprise carve-out anywhere in this Regulation - unusual among the wider-acquis obligations
      in this map, where size thresholds normally do the work."
    url: http://publications.europa.eu/resource/celex/32018R0302
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "Geo-blocking Regulation (Regulation (EU) 2018/302), Art. 1(2) and Art. 1(3). Art. 1(2): 'This
      Regulation does not apply to purely internal situations, where all the relevant elements of
      the transaction are confined within one single Member State.' Art. 1(3): 'This Regulation does
      not apply to the activities referred to in Article 2(2) of Directive 2006/123/EC.' THE COUNT
      IS TWELVE, NOT ONE. An earlier brief to this rule's author described Art. 1(3) as excluding
      audiovisual services; that is one limb of twelve, and the eleven it omits - gambling,
      financial services, healthcare, transport and electronic communications among them - remove
      most of the industries that geo-block hardest. Art. 1(3) imports points (a) to (l) of Art.
      2(2) in full, reproduced verbatim below and re-verified word for word against the Official
      Journal text on 2026-07-27. Directive 2006/123/EC (Services Directive), Art. 2(2), OJ L 376,
      27.12.2006: 'This Directive shall not apply to the following activities: (a) non-economic
      services of general interest; (b) financial services, such as banking, credit, insurance and
      re-insurance, occupational or personal pensions, securities, investment funds, payment and
      investment advice, including the services listed in Annex I to Directive 2006/48/EC; (c)
      electronic communications services and networks, and associated facilities and services, with
      respect to matters covered by Directives 2002/19/EC, 2002/20/EC, 2002/21/EC, 2002/22/EC and
      2002/58/EC; (d) services in the field of transport, including port services, falling within
      the scope of Title V of the Treaty; (e) services of temporary work agencies; (f) healthcare
      services whether or not they are provided via healthcare facilities, and regardless of the
      ways in which they are organised and financed at national level or whether they are public or
      private; (g) audiovisual services, including cinematographic services, whatever their mode of
      production, distribution and transmission, and radio broadcasting; (h) gambling activities
      which involve wagering a stake with pecuniary value in games of chance, including lotteries,
      gambling in casinos and betting transactions; (i) activities which are connected with the
      exercise of official authority as set out in Article 45 of the Treaty; (j) social services
      relating to social housing, childcare and support of families and persons permanently or
      temporarily in need which are provided by the State, by providers mandated by the State or by
      charities recognised as such by the State; (k) private security services; (l) services
      provided by notaries and bailiffs, who are appointed by an official act of government.' Both
      texts retrieved 2026-07-27 from the Publications Office cellar (CELEX 32018R0302 and
      32006L0123)."
    url: http://publications.europa.eu/resource/celex/32006L0123
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Geo-blocking Regulation (Regulation (EU) 2018/302), the carve-outs that decide most
      candidates. Art. 3(3): 'The prohibitions set out in paragraphs 1 and 2 shall not apply where
      the blocking or limitation of access, or the redirection is necessary in order to ensure
      compliance with a legal requirement laid down in Union law, or in the laws of a Member State
      in accordance with Union law, to which the trader's activities are subject. In such instances,
      the trader shall provide a clear and specific explanation to customers regarding the reasons
      why the blocking or limitation of access, or the redirection is necessary in order to ensure
      such compliance. That explanation shall be given in the language of the online interface that
      the customer initially sought to access.' Art. 4(1)(b) excludes 'services the main feature of
      which is the provision of access to and use of copyright protected works or other protected
      subject matter, including the selling of copyright protected works or protected subject matter
      in an intangible form' - Art. 9(2) records that whether to delete this exclusion was the first
      review question. Art. 4(2): 'The prohibition set out in paragraph 1 shall not prevent traders
      from offering general conditions of access, including net sale prices, which differ between
      Member States or within a Member State and which are offered to customers on a specific
      territory or to specific groups of customers on a non-discriminatory basis.' Art. 4(4)
      disapplies point (b) for 'traders that are exempted from VAT on the basis of the provisions of
      Chapter 1 of Title XII of Directive 2006/112/EC'. Art. 4(5) disapplies the Art. 4(1)
      prohibition 'in so far as a specific provision laid down in Union law, or in the laws of
      Member States in accordance with Union law, prevents the trader from selling the goods or
      providing the services to certain customers or to customers in certain territories'. Art. 5(2)
      preserves withholding delivery until the payment transaction is confirmed as properly
      initiated, where justified by objective reasons, and Art. 5(3) preserves non-discriminatory
      surcharges on unregulated card instruments. Art. 4(1)(a) itself limits the goods duty to
      Member States 'to which the trader offers delivery in the general conditions of access', so
      the Regulation does not oblige a trader to deliver outside its stated delivery area. Retrieved
      2026-07-27 from the Publications Office cellar (CELEX 32018R0302)."
    url: http://publications.europa.eu/resource/celex/32018R0302
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Geo-blocking Regulation (Regulation (EU) 2018/302), Art. 7 and Art. 6(2). Art. 7(1)-(2):
      'Each Member State shall designate a body or bodies responsible for adequate and effective
      enforcement of this Regulation.' 'Member States shall lay down the rules setting out the
      measures applicable to infringements of the provisions of this Regulation and shall ensure
      that they are implemented. The measures provided for shall be effective, proportionate and
      dissuasive.' There is therefore no EU-level fine ceiling; the penalty is set nationally, and
      Art. 8 additionally requires each Member State to designate a body giving consumers practical
      assistance in disputes. Art. 6(2): 'Provisions of agreements imposing obligations on traders,
      in respect of passive sales within the meaning of Regulation (EU) No 330/2010, to act in
      violation of the prohibitions laid down in Articles 3, 4 and 5 of this Regulation shall be
      automatically void.' Art. 10 adds the Regulation to the Annexes of Regulation (EC) No
      2006/2004 and Regulation (EU) 2017/2394 (CPC cross-border enforcement cooperation) and to
      Annex I of Directive 2009/22/EC (injunctions), in the first two cases 'only when the customer
      is a consumer as defined in point (12) of Article 2 of that Regulation'. Retrieved 2026-07-27
      from the Publications Office cellar (CELEX 32018R0302)."
    url: http://publications.europa.eu/resource/celex/32018R0302
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false

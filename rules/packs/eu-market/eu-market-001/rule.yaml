context_questions:
  - "Is the scanned party a trader, and is this an online interface? Art. 2(18) defines a trader as
    any natural or legal person 'acting, including through any other person acting in the name or on
    behalf of the trader, for purposes relating to the trade, business, craft or profession of the
    trader', and Art. 2(16) defines an online interface as any software, including a website or part
    of one and including mobile applications, operated by or on behalf of a trader, which serves to
    give customers access to the trader's goods or services with a view to a transaction. Two
    consequences the reviewer should check before anything else. First, a library, SDK, connector or
    low-code building block that merely EXPOSES a country restriction as a configurable option is
    not itself the trader applying it - the trader is whoever configures it downstream - so quote
    whether this repository operates the interface or ships a capability to others. Second, Art.
    1(2) removes purely internal situations 'where all the relevant elements of the transaction are
    confined within one single Member State', and the Regulation reaches only customers within the
    meaning of Art. 2(13), that is consumers who are nationals or residents of a Member State and
    undertakings established in a Member State receiving a service or purchasing a good for the sole
    purpose of end use. Note that there is no micro or small enterprise carve-out in this
    Regulation: size does not answer this question."
  - "Does Art. 1(3) take the whole activity outside the Regulation? Art. 1(3) states that the
    Regulation 'does not apply to the activities referred to in Article 2(2) of Directive
    2006/123/EC', and that is TWELVE separate limbs, not the single audiovisual exclusion the
    provision is usually summarised as. All twelve, in the Directive's own order: (a) non-economic
    services of general interest; (b) financial services such as banking, credit, insurance and
    re-insurance, occupational or personal pensions, securities, investment funds, payment and
    investment advice; (c) electronic communications services and networks and associated facilities
    and services; (d) services in the field of transport, including port services; (e) services of
    temporary work agencies; (f) healthcare services, whether or not provided via healthcare
    facilities and however organised or financed; (g) audiovisual services, including
    cinematographic services, whatever their mode of production, distribution and transmission, and
    radio broadcasting; (h) gambling activities involving a stake of pecuniary value in games of
    chance, including lotteries, casino gambling and betting; (i) activities connected with the
    exercise of official authority under Art. 45 of the Treaty; (j) social services relating to
    social housing, childcare and support of families and persons in need provided by the State, by
    providers mandated by the State or by charities recognised as such; (k) private security
    services; (l) services provided by notaries and bailiffs appointed by an official act of
    government. Streaming platforms, betting sites, banks, brokers, telecom operators, airlines and
    clinics are the most prolific geo-blockers in the wild and every one of them sits in this list,
    so this question decides more candidates than any other in this rule. Identify what the product
    actually sells and say which limb applies, or say that none does - and note that the answer is
    about the ACTIVITY, so a general-purpose SaaS product used by a bank is not itself a financial
    service."
  - "Is the code a country restriction at all, or a country lookup put to a purpose that treats no
    one differently? This is the most common outcome for a candidate under this rule and it should
    be resolved first. The same geo-IP APIs - MaxMind GeoIP2 in Python, Ruby, PHP, Go, Java or Node,
    Cloudflare's CF-IPCountry, X-Vercel-IP-Country, CloudFront-Viewer-Country, X-AppEngine-Country,
    a Netlify or Vercel edge geo object, an nginx GeoIP module variable - are used overwhelmingly
    for currency defaulting, VAT or sales-tax rate selection, pre-selecting a language, choosing a
    CDN edge or storage region, fraud and abuse scoring, and analytics reporting. None of those
    varies access, rerouting or payment conditions by nationality, residence or establishment. Quote
    the line where the resolved country is CONSUMED and say what changes as a result: if the answer
    is a currency symbol, a tax rate, a default form value, a log field or a chart, record that and
    stop."
  - Which of the three articles is engaged, and is a customer's nationality, place of residence or
    place of establishment the reason? Art. 3(1) covers blocking or limiting access to the online
    interface through technological measures or otherwise; Art. 3(2) covers rerouting to a different
    version; Art. 4(1) covers different general conditions of access to goods or services, which
    Art. 2(14) defines to include net sale prices; Art. 5(1) covers different conditions for a
    payment transaction. Quote the specific behaviour and map it to one of the four. Where the
    differentiating input is something else entirely - a subscription tier, a device type, an A/B
    bucket, an age check, an authenticated account attribute - the provision is not engaged and the
    candidate resolves there.
  - "Is the restriction necessary to comply with a legal requirement, and is the required
    explanation present? Art. 3(3) provides that the Art. 3(1) and 3(2) prohibitions 'shall not
    apply where the blocking or limitation of access, or the redirection is necessary in order to
    ensure compliance with a legal requirement laid down in Union law, or in the laws of a Member
    State in accordance with Union law, to which the trader's activities are subject', and Art. 4(5)
    gives the equivalent for Art. 4(1). Two things to check rather than one. First, is the
    requirement one of Union law or the law of a Member State - a restriction taken from a non-Union
    sanctions or export-control regime, a licensing condition imposed by a commercial counterparty,
    or a decision to avoid a foreign regulator does not fit the wording as it reads. Second, Art.
    3(3) attaches a positive duty where it does apply: the trader must give customers 'a clear and
    specific explanation' of why the blocking, limitation or redirection is necessary, 'in the
    language of the online interface that the customer initially sought to access'. Quote the
    explanation if one is rendered, and record its absence if not. Where to look, and what would NOT
    settle it: a rendered notice component, a message catalogue entry shown on the refusal path, the
    body of the 403 or 451 response, a terms page linked from it. This vocabulary is given to you as
    evidence to weigh and not as a test to pass - the same words appear in every repository that has
    a cookie banner or a documentation tree, which is exactly why this rule carries no detector-side
    guard on them and why the question reaches you instead. Four things have to hold together and
    each is a reading rather than a string match: the explanation exists on the path the refused
    customer actually reaches; it is specific to this restriction rather than generic boilerplate;
    it is rendered in the language of the interface the customer originally requested rather than
    the language of the country they were resolved to; and the requirement it cites is one of Union
    law or a Member State law made in accordance with it. Say which of the four fail."
  - "If the code is a delivery, shipping or service-area limitation, note what the Regulation does
    and does not require. Art. 4(1)(a) reaches the sale of goods only where they are 'delivered to a
    location in a Member State to which the trader offers delivery in the general conditions of
    access' or collected at an agreed location in a Member State where the trader offers collection.
    A trader is therefore under no obligation to ship outside its stated delivery area, and a
    shipping-zone list that omits Member States is not on its own differential treatment - the
    customer may still buy and arrange collection or onward delivery themselves. Art. 4(2) likewise
    preserves conditions, including net sale prices, 'which differ between Member States or within a
    Member State and which are offered to customers on a specific territory or to specific groups of
    customers on a non-discriminatory basis'. What would engage Art. 4(1) is a customer inside the
    stated delivery area being offered different conditions because of where they live or hold
    nationality - for example being refused an order to a Member State address the trader does
    serve, or being shown different prices at the same delivery address depending on the country
    resolved from their IP address. Quote the delivery area as declared and say which side of that
    line the code falls. READ THE LIST, DO NOT SAMPLE IT. Where this candidate was raised on a
    `<select>`, a `<datalist>`, a country picker component or a ship-to configuration key, the
    detector matched only the line that OPENS the list, because no single entry in a one-per-line
    list carries the fact that decides anything - a 240-line selector and a 3-line selector look
    identical entry by entry, and what matters is which of the 27 Member States are absent. So
    enumerate the entries, name the Member States the list omits, and state whether the omission is
    the declared delivery area under Art. 4(1)(a) (permitted, and the customer may still collect or
    arrange onward delivery) or a refusal to sell to a customer inside an area the trader does serve
    (Art. 4(1) engaged). If the list is built at runtime from a database, a CMS or an environment
    variable rather than written in the file, say so and stop there rather than guessing its
    contents: an unreadable list is an unresolved candidate, not a clean one."
  - If this is a redirect, was there explicit consent, and does the originally requested version
    remain reachable? Art. 3(2) permits rerouting to a different version of the online interface
    only where 'the customer has explicitly consented to such redirection', and adds that in that
    event 'the version of the trader's online interface to which the customer initially sought
    access shall remain easily accessible to that customer'. Both limbs have to hold. Quote the
    consent step - an automatic redirect on first load, a modal that offers no way to decline, or a
    cookie set without an affirmative choice do not meet the first limb - and quote the mechanism
    that lets the customer return to and stay on the version they asked for. A country or language
    switcher that is itself overridden on the next request does not satisfy the second limb.
  - "If this is a payment condition, does Art. 5(1) reach it? The prohibition operates 'within the
    range of means of payment accepted by the trader': a trader remains free to choose which brands
    and categories it accepts at all, and Art. 5(1) bites only once the choice is made, forbidding
    different conditions for reasons related to the customer's nationality, residence or
    establishment, the location of the payment account, the place of establishment of the payment
    service provider, or the place of issue of the payment instrument within the Union. Its three
    cumulative conditions are that the transaction is an electronic credit transfer, direct debit or
    card-based instrument within the same payment brand and category, that authentication
    requirements under Directive (EU) 2015/2366 are fulfilled, and that the transaction is in a
    currency the trader accepts. Two express preservations matter here: Art. 5(2) allows the trader
    to withhold delivery of the goods or provision of the service, where justified by objective
    reasons, until the payment transaction is confirmed as properly initiated, and Art. 5(3) allows
    non-discriminatory charges for the use of card instruments whose interchange fees are
    unregulated. Say which cumulative condition fails, or which preservation applies, or that the
    gate stands."
  - "If the service is electronically supplied, does the Art. 4(1)(b) copyright carve-out or the
    Art. 4(4) VAT exemption apply? Art. 4(1)(b) reaches electronically supplied services 'other than
    services the main feature of which is the provision of access to and use of copyright protected
    works or other protected subject matter, including the selling of copyright protected works or
    protected subject matter in an intangible form'. E-books, downloadable or streamed music, films
    and games, stock photography and similar catalogues therefore sit outside Art. 4(1), which is
    why territorial catalogues persist; Art. 9(2) records that whether to delete this exclusion was
    the first question the Commission's review had to address. The test is the MAIN FEATURE of the
    service, so a SaaS product that incidentally serves copyrighted assets is not carved out. Art.
    4(4) separately disapplies point (b) for traders exempt from VAT under Chapter 1 of Title XII of
    Directive 2006/112/EC. Note that neither carve-out touches Art. 3: a copyright-licensed
    catalogue still may not block or reroute access to its online interface by country."
  - "Does this code path run in the shipped product, and is the list actually applied? Quote the
    call site. A country list that is declared and never read, a feature flag that is off, a
    middleware not registered on any route, an example under a documentation tree, or a connector
    option exposed to end users but not set by this repository each mean something different for the
    reviewer, and the difference should be stated rather than assumed. Where the finding rests on a
    comment, a README or generated article prose rather than executable code, say so plainly: prose
    describing a restriction is not the restriction."
evidence_template: "{file}:{line} matched one of this rule's country, locale or
  geographic-restriction patterns - which may be an access, rerouting or payment condition, and may
  equally be a form control, a shipping zone or a currency lookup that treats no one differently.
  BEFORE THE PURPOSE QUESTION COMES A PRIOR ONE: is a country or a locale on the line at all?
  Several clauses match on fragments and on adjacency, and three shapes were found in real
  repositories where nothing geographic is read. The IBAN clause treats a bare index within 50
  characters of the word IBAN as a country-code prefix slice, and matched a line where the index
  belonged to a different variable - findByIbanNull($data['iban'], [$types[0]]) - so no country is
  read anywhere on it. The control-name clause matched the words Market and Select across the two
  halves of a generated database type name, Prisma.MarketDataSelectScalar, in a market-data query
  signature that has no customer and no country in it. The geofence clause matched Geofence inside a
  screenshot identifier in a screenshot-automation helper - let whiteListedIdentifiers =
  ['GeofenceLocationTrackingOn', 'StandardLocationTrackingOn'] - and this is the misdirection to
  watch for, because whiteListed and Geofence sitting on one line make a geographic allow-list an
  easy reading and a wrong one. A line may also read nothing while its file does: a CSS background
  colour inside a country-picker component is a location of this rule. Quote the country or locale
  the line reads, or say there is none and record that. Since 2026-09-13 the match may also come
  from a CONSTRUCT rather than from that line alone: this rule reads the bracket-balanced construct
  a line opens on as one folded text as well, so a country-code list written one code per line, a
  redirect whose argument a formatter wrapped onto the next line, or a route attribute broken the
  same way is matched as a whole, and where that is what happened the finding is reported on the
  line the construct opens on and carries the span it was folded from in locations[].joined_from.
  Read those lines together, not the opening line alone. Then check against Geo-blocking Regulation
  (EU) 2018/302 Arts. 3, 4 and 5, and check whether the country is being used to restrict anything
  at all rather than to pick a currency, tax rate, language or edge region"
remediation_template: |
  This is a candidate for review against Regulation (EU) 2018/302 (geo-blocking), not a
  determination about this code. The Regulation has applied since 3 December 2018, it binds any
  trader within the meaning of Art. 2(18), and it has no micro or small enterprise carve-out -
  which makes it unusual among the wider-acquis obligations this pack covers. Enforcement is
  national under Art. 7, and under Art. 6(2) any passive-sales clause obliging a trader to act
  against Arts. 3, 4 or 5 is automatically void.
  Two questions decide most candidates, so answer them before changing anything:
  1. Is the country being used to RESTRICT, or only to choose a currency, a tax rate, a language,
     a CDN edge or a fraud score? The second group varies nothing about access, rerouting or
     payment conditions and is outside all three articles.
  2. Is the activity inside the Regulation at all? Art. 1(3) routes through Art. 2(2) of Directive
     2006/123/EC, which removes audiovisual services, gambling, financial services, healthcare,
     transport, electronic communications and several others. Art. 4(1)(b) additionally removes
     electronically supplied services whose main feature is access to copyright-protected works.
  Where the restriction stands, the engineering shape of the fix follows the article engaged:
  - Art. 3(1): serve the online interface to customers from every Member State. Where blocking is
     necessary to meet a requirement of Union or Member State law, Art. 3(3) preserves it but
     attaches a duty - render a clear and specific explanation of why, in the language of the
     interface the customer originally requested, rather than a bare 403 or 451.
  - Art. 3(2): make locale and country rerouting opt-in. Ask before redirecting, record the answer,
     and keep the originally requested version easily accessible afterwards - a persistent switcher
     that survives the next request, not a redirect that reasserts itself.
  - Art. 4(1): let a customer inside your stated delivery area buy on the same general conditions,
     including net sale prices, whatever country their address, IP address or account resolves to.
     Art. 4(1)(a) does not require shipping outside that stated area, and Art. 4(2) still permits
     genuinely territorial offers made on a non-discriminatory basis.
  - Art. 5(1): within the payment brands and categories already accepted, stop branching on the
     issuing country, the card BIN country, the IBAN country prefix or the location of the payment
     account. Art. 5(2) still allows waiting for confirmation that the payment was properly
     initiated, and Art. 5(3) still allows non-discriminatory surcharges on unregulated card
     instruments.
  If the list exists for sanctions or export-control screening, record which Union or Member State
  instrument it implements and keep the list scoped to it; a list carried over from a non-Union
  regime does not fit the Art. 3(3) wording as it reads, and that gap is worth surfacing to whoever
  owns the decision.
data_categories:
  - user.device.ip_address
  - user.location.imprecise
  - user.contact.address.country
  - user.financial.bank_account
  - user.financial.credit_card
fingerprint_spec: directory

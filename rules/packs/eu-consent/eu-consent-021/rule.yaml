context_questions:
  - "Is this a consent prompt within GDPR Art. 4(11) and ePrivacy Art. 5(3) at all - a decision
    about storing or reading something on the user's device, or about processing personal data - or
    is it something else that shares its vocabulary? Three shapes were found in real repositories
    wearing this one. (a) CONTRACT ACCEPTANCE: a registration checkbox bound to a terms field, or a
    modal asking a returning user to agree to revised terms, with links to a terms page and a
    privacy policy and a stored value keyed to a document version. There is no refusal control
    because refusing means not registering, and agreement to terms rests on Art. 6(1)(b) rather than
    on consent, so Art. 4(11) does not attach and this rule's question does not arise. The owner's
    own application produced exactly this misclassification once: a component named ConsentGate.tsx
    turned out to be a terms re-acceptance modal. (b) A BROWSER-SUPPORT NOTICE: a modal in a file
    named for cookies, with one button and no refusal, telling the user that cookies must be enabled
    before they can log in. It is a technical warning and there is nothing to consent to. (c) A
    THIRD PARTY'S BANNER CAPTURED AS DATA: a consent-management platform's script tag inside a
    recorded HTTP response, an import fixture or a saved page. That is somebody else's banner and
    says nothing about the scanned project. (d) NOT A CONTROL AT ALL: the acceptance word matched
    inside data or prose rather than inside an interface - an HTTP header value in a routing
    configuration, a row of a bundled model's token vocabulary, an enum value inside a stored
    instruction file for a language model. Shapes (a) to (c) share consent's vocabulary and are at
    least user interface; (d) is not, and the file it sits in usually qualified on a single
    incidental occurrence of the word cookie, consent or gdpr somewhere else in it. Open the file,
    quote what the control writes and what reads it, and say which of the five this is. Where it is
    (a), (b), (c) or (d), record that and stop."
  - "Does a refusal control exist that this rule could not see? The detector matched an acceptance
    control and found no refusal vocabulary in that one file - that is the whole of what it
    establishes, and it is not a claim that no refusal exists. Four places a refusal routinely lives
    where a file-scoped view cannot reach it, all four observed in real repositories: a sibling
    component that renders the preference panel and holds the deny-all writer; a persistent settings
    route reached from the footer or the account page; a translation catalogue, where every label is
    an i18n key and the component carries only onAccept and onReject as symbols; and a
    consent-management platform's own configuration, where the presence of the reject button is a
    boolean in the customer's own script tag or a missing property whose default is off. Search the
    project, quote the route definition, component or configuration literal you find, and say
    whether a user standing in front of THIS prompt can reach it. A refusal control that exists
    somewhere in the repository but is not offered at the moment of the prompt answers a different
    question - see the next one."
  - "If a refusal control does exist, is it offered at the same layer as the acceptance control, and
    what does reaching it cost? Art. 4(11) requires consent to be freely given, and Recital 42
    states that consent should not be regarded as freely given where the data subject has no genuine
    or free choice or is unable to refuse without detriment. Reconstruct both journeys from the same
    starting point - the moment the prompt appears - and report them limb by limb rather than as a
    symbol. (a) LAYER: is the refusal rendered by the same component, in the same render, as the
    acceptance control, or does it exist only inside a dialog that a Manage, Customise, Preferences
    or Settings control opens? A real documentation example in the pinned corpus offers Manage
    Cookies and Accept Cookies on the first layer and puts Decline All inside the dialog, and this
    rule is structurally unable to see that difference, so it is your question and not the
    detector's. (b) ACTIONS: how many clicks, taps or requests each path takes, counted from the
    same place. (c) PROMINENCE: whether the two controls are rendered as the same kind of control -
    report what you see and quote it, and do not treat a difference in a button variant or a class
    name as settling the question on its own, because the sources cited by this rule say nothing
    about styling. (d) WHAT THE CLOSE CONTROL DOES: check the dismiss cross and any click-outside
    handler, because in one real banner plugin the close cross calls the same writer as the accept
    button and dismissing the notice records consent. Where the two paths differ, say on which limb
    and by how much; where they do not, dismiss the candidate and quote both."
  - "What does the acceptance control actually switch on, and is consent the basis being relied on?
    Quote the code path that reads the stored decision and name what turns on it: a tracking or
    analytics tag, an advertising pixel, a session-replay recorder, a marketing send list, an
    optional feature. One case decides itself and it is common enough to check first: where the
    stored value gates nothing except whether the notice renders again - the tag, the SDK or the
    send fires identically whether the user accepted or never answered - then nothing is being
    processed on the basis of consent, there is no free choice being offered or withheld, and the
    defect is the absence of a consent mechanism at all. That is EU coverage map row 1 and
    eu-consent-001, not this row. Say which of the two it is and route it there rather than
    reporting one fact pattern under both rules."
  - "Is this product offered to users in the EU or the EEA, and who is the addressee? Read
    ScanProfile.distribution_regions, which is supplied with this candidate. A region that is not in
    the list may not have been asked: that question is open, not answered no. Where it is absent,
    say so and return needs_human rather than guessing, because this question decides whether the
    obligation is engaged. ePrivacy Art. 5(3) is addressed to the Member States and is applied
    through their national transpositions, so which national text governs is a question for a human
    with the product's establishment and audience in front of them. The party carrying the condition
    in the scanned repository is whoever stores or reads on the terminal equipment, which under GDPR
    Art. 4(7) is the controller - and where the banner belongs to a platform the scanned code merely
    integrates with, identify who that is before treating this repository as the addressee."
evidence_template: "{file}:{line} matched one of this rule's acceptance patterns, in a file where
  its consent vocabulary matched somewhere and its refusal vocabulary matched nowhere outside
  comments. THAT IS THE WHOLE OF WHAT WAS MATCHED, and neither half of it is self-verifying. One
  clause matches a bare acceptance word - Accept, Agree, I agree, Continue, Allow - wherever it
  stands between quotation marks or between tags, which is how a button label in markup is spelled
  and equally how a JSON key, an HTTP header value and a word-list entry are spelled; and the
  file-level gate is satisfied by consent vocabulary occurring anywhere in the file, in any role. So
  lines that are neither controls nor consent surfaces reach this template, and three such were
  found in real repositories. An HTTP response header value in a deployment routing configuration -
  'value': 'Accept', under 'key': 'Vary' - in a file that qualified because the string gdpr occurs
  in its redirect paths. A subword-token row in a bundled embedding model's vocabulary table -
  'allow': 3499, between 'operated': 3498 and 'spring': 3500 - in a file that qualified because
  cookie and consent are themselves tokens in that table. An enum value inside a stored instruction
  file for a language model - 'continue', beside 'handoff', naming what to do with a conversation -
  in a file that qualified because that instruction text names cookie banners twice, both times
  telling the model to leave them out. Read the matched line and open the file before anything else:
  say whether an acceptance control is on the line, and whether the file is a consent surface. Where
  either answer is no, record that and stop at context question 1, which is where that reading is
  scored. Beyond those two matches this detector establishes nothing. It is NOT a finding that no
  refusal control exists: a refusal path may sit in a sibling component, a settings route, a
  translation catalogue or a consent-management platform's configuration, none of which a
  file-scoped pattern can see; it may also be named in a comment in this file, and this rule is also
  structurally unable to see a refusal that exists one dialog deeper in the same file"
remediation_template: >
  This is a candidate for review against ePrivacy Art. 5(3) read with GDPR Art. 4(11), not a

  determination about this code. The scanner matched an acceptance control inside a file that reads

  as a consent surface, and its own refusal patterns matched nothing in that file outside its

  comments. It did not search the rest of the project, and it is not asserting that a refusal
  control

  is missing.

  Two facts close most candidates, so establish them first:

  1. Is this a consent prompt at all? Agreement to terms of service or to a privacy policy is a
     contract matter under Art. 6(1)(b) and Art. 4(11) does not attach to it; a notice telling the
     user to enable cookies in the browser is a technical warning with nothing to consent to; a
     vendor's banner captured inside a recorded HTTP response belongs to that vendor. Where the
     stored value is keyed to a document version rather than to a tracker category or a marketing
     channel, move on.
  2. Does a refusal control already exist? The scanner did not look outside this file. Start from
     the shapes that usually carry one and treat each as evidence rather than as an answer:
     onReject, onDecline, onOptOut, denyAll, rejectAll, acceptNecessary; a first-layer label
     spelled Reject all, Decline All, Refuse all, Necessary only, No thanks, or the French wording
     Continue without accepting; a preferences component or a route such as /cookie-settings; and,
     where a consent-management platform renders the banner, the property that decides whether the
     button appears at all - rejectButtonDisplay, enableDeclineButton, hideDeclineAll, or an
     acceptNecessaryBtn entry that is present or absent from the vendor's configuration call.
     Quote what you find and say whether a user standing in front of this prompt can reach it.
  Where the gap is real, the engineering change has three parts and partial work leaves it open:

  - A refusal control on the SAME layer as the acceptance control, in the same render, reachable in
    the same number of actions. A refusal that exists only inside the dialog a Manage or Customise
    button opens is a different journey from a one-click accept, and that difference is what a
    reviewer is being asked about.
  - A refusal path that writes the decision, not only one that hides the banner. Whatever the accept
    control writes - a cookie, a Web Storage key, a session key, a database row, a Consent Mode
    update, an SDK opt-in - the refusal needs its counterpart, so that a later page load does not
    read silence as agreement and re-prompt forever.
  - A close control that does not record acceptance. Where the dismiss cross, the escape key or a
    click outside the banner calls the same writer as the accept button, dismissing the prompt
    records a decision the user did not take; make those paths leave the stored value untouched.

id: eu-consent-021
pack: eu-consent
short_name: Consent banner with Accept but no Refuse found beside it
problem_line:
  text: Consent banner offers Accept; no equal Refuse found
fix_line: Put Refuse on the same layer as Accept, store a refusal as Accept stores consent, and
  never treat closing as consent.
title: Consent-banner acceptance control surfaced with no refusal vocabulary matched in the same
  file outside comments
jurisdiction:
  - EU
legal_basis:
  - cite: "ePrivacy Directive 2002/58/EC, Art. 5(3) (as amended by Directive 2009/136/EC) read with Art.
      2(f), and GDPR Art. 94. Art. 5(3), in the consolidated text at CELEX 02002L0058-20091219,
      where the paragraph carries the M2 marker that the amending-act table of that document maps to
      'DIRECTIVE 2009/136/EC OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL of 25 November 2009' (OJ
      L 337, p. 11, 18.12.2009): 'Member States shall ensure that the storing of information, or the
      gaining of access to information already stored, in the terminal equipment of a subscriber or
      user is only allowed on condition that the subscriber or user concerned has given his or her
      consent, having been provided with clear and comprehensive information, in accordance with
      Directive 95/46/EC, inter alia, about the purposes of the processing. This shall not prevent
      any technical storage or access for the sole purpose of carrying out the transmission of a
      communication over an electronic communications network, or as strictly necessary in order for
      the provider of an information society service explicitly requested by the subscriber or user
      to provide the service.' Art. 2(f) of the same Directive provides that \"'consent' by a user
      or subscriber corresponds to the data subject's consent in Directive 95/46/EC\", and GDPR Art.
      94 repeals that Directive - Art. 94(1): 'Directive 95/46/EC is repealed with effect from 25
      May 2018.'; Art. 94(2), first sentence: 'References to the repealed Directive shall be
      construed as references to this Regulation.' That chain is what makes the GDPR definition in
      entry 2 the definition a cookie or tracker banner has to satisfy. ADDRESSEE: Art. 5(3) is
      drafted as a duty on the Member States ('Member States shall ensure'), and what it requires
      them to ensure is that the storing or the access is allowed only on the stated condition, so
      the party that carries the condition in a scanned repository is whoever stores or reads on the
      terminal equipment. That party is usually, but not necessarily, the controller as GDPR Art.
      4(7) defines it: \"'controller' means the natural or legal person, public authority, agency or
      other body which, alone or jointly with others, determines the purposes and means of the
      processing of personal data\". The national transposition, not this Directive, is the
      instrument a supervisory authority applies, and which national text applies is a question for
      the adjudicator and not for this rule."
    url: http://publications.europa.eu/resource/celex/02002L0058-20091219
    checked_at: 2026-08-10
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(11), quoted in full from the Official Journal text at
      CELEX 32016R0679, retrieved 2026-08-10: \"'consent' of the data subject means any freely
      given, specific, informed and unambiguous indication of the data subject's wishes by which he
      or she, by a statement or by a clear affirmative action, signifies agreement to the processing
      of personal data relating to him or her\". Four cumulative qualities, of which this rule
      reaches one: freely given. The other three are other rows' subject matter - specific is
      purpose granularity, informed is the notice, unambiguous is the affirmative-action requirement
      that Recital 32 spells out ('Silence, pre-ticked boxes or inactivity should not therefore
      constitute consent.'). Recital 32's opening sentence gives the same test in the positive:
      'Consent should be given by a clear affirmative act establishing a freely given, specific,
      informed and unambiguous indication of the data subject's agreement to the processing of
      personal data relating to him or her, such as by a written statement, including by electronic
      means, or an oral statement.' Applies since 2018-05-25, Art. 99(2): 'It shall apply from 25
      May 2018.'"
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 42, last sentence, from the same Official Journal
      text: 'Consent should not be regarded as freely given if the data subject has no genuine or
      free choice or is unable to refuse or withdraw consent without detriment.' This is the
      sentence that ties refusal to the validity of the consent itself: where the user cannot
      refuse, what was collected is open to challenge from the moment it was taken, rather than a
      separate housekeeping failure to be fixed later. Recital 43, second sentence, supplies the
      companion presumption: 'Consent is presumed not to be freely given if it does not allow
      separate consent to be given to different personal data processing operations despite it being
      appropriate in the individual case, or if the performance of a contract, including the
      provision of a service, is dependent on the consent despite such consent not being necessary
      for such performance.' Two things a reader must not take from this entry. A recital does not
      enact a duty - it colours Art. 4(11)'s freely-given condition, which is what this rule cites
      as its test. And neither recital says anything about how prominent, how many clicks away, or
      how visually equal a refusal control has to be; that comparison is a matter for the
      adjudicating agent and for the national enforcement record, not for words this rule may put in
      the Official Journal's mouth."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 7(4), from the same Official Journal text: 'When
      assessing whether consent is freely given, utmost account shall be taken of whether, inter
      alia, the performance of a contract, including the provision of a service, is conditional on
      consent to the processing of personal data that is not necessary for the performance of that
      contract.' Read exactly. The paragraph is a direction about how to assess the freely-given
      condition, and the single factor it names is CONDITIONALITY - tying a service to consent that
      the service does not need. It is the textual home of the consent-or-pay question. It does not
      say that a refusal control must exist, that refusing must cost the same as accepting, or
      anything at all about the layout of a prompt; the phrase 'inter alia' leaves room for other
      factors without naming one. This rule therefore rests on Art. 4(11) with Recital 42, not on
      Art. 7(4), and Art. 7(4) is carried here as reference so that anyone reading row 1b's citation
      list can see which half of the row each provision answers. Consent-or-pay is out of this
      rule's scope entirely (see the detector comment), so nothing in this rule tests the factor
      this paragraph names."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 7(3), from the same Official Journal text: 'The data
      subject shall have the right to withdraw his or her consent at any time. The withdrawal of
      consent shall not affect the lawfulness of processing based on consent before its withdrawal.
      Prior to giving consent, the data subject shall be informed thereof. It shall be as easy to
      withdraw as to give consent.' Carried here to fix a boundary, not to test one: the parity
      sentence in this paragraph is about withdrawal AFTER consent has been given, which is EU
      coverage map row 16 and eu-consent-017. This rule is about the first layer of the prompt,
      before any decision has been recorded. A settings page that lets a user take consent back does
      not supply the refusal this rule is looking for, and a reject button on the banner is not a
      withdrawal path; the two obligations are answered by different code and must not be reported
      as one. Art. 7(1) marks the third neighbour - 'Where processing is based on consent, the
      controller shall be able to demonstrate that the data subject has consented to processing of
      his or her personal data.' - which is row 7 and eu-consent-016. Reference only: none of these
      establishes the condition this rule tests."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-10
    jurisdiction: EU
    supports_rule_condition: false

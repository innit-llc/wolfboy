id: eu-consent-016
pack: eu-consent
short_name: "Consent answers: record of who agreed, to what, and when"
problem_line:
  text: Consent record of who, what and when not found
fix_line: Keep an append-only server-side consent record (subject, purposes, notice version, time,
  method, outcome) or a CMP log.
title: Consent decision read, gated on, signalled or declared - server-side record of who, what and
  when needs review
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 7(1): 'Where processing is based on consent, the
      controller shall be able to demonstrate that the data subject has consented to processing of
      his or her personal data.' Quoted verbatim from the Official Journal consolidated text (CELEX
      32016R0679), retrieved 2026-07-27 from the Publications Office cellar
      (publications.europa.eu/resource/celex/32016R0679; eur-lex.europa.eu itself returns an empty
      WAF challenge). The duty is conditional on the first clause: where the processing rests on
      another Art. 6(1) basis - contract, legal obligation, legitimate interests - Art. 7(1) does
      not attach at all, which is context question 1. The addressee is the controller (Art. 4(7)),
      and the burden is on it: 'shall be able to demonstrate' is an evidential requirement, not a
      duty to obtain consent, which sits in Art. 6(1)(a). Art. 7(1) has applied since 2018-05-25
      (Art. 99(2))."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(2): 'The controller shall be responsible for, and be
      able to demonstrate compliance with, paragraph 1 ('accountability').' Quoted from the same
      Official Journal text. The single quotation marks inside the parenthesis are the Journal's own
      and are reproduced as part of the quotation; CORRECTION 2026-08-03, this entry printed the
      word bare until the quote-verification gate was extended to rule cites and found it, so do not
      remove them again. Read with Art. 7(1) this is why a consent decision that exists only in the
      data subject's own browser is the thing this rule looks for: the controller, not the data
      subject, holds the burden, and a value in localStorage or in a first-party cookie is held by
      the data subject, can be cleared by them at any time, and cannot be produced by the controller
      on request."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 42, first sentence: 'Where processing is based on
      the data subject's consent, the controller should be able to demonstrate that the data subject
      has given consent to the processing operation.' The same recital fixes what the demonstration
      has to be about: 'For consent to be informed, the data subject should be aware at least of the
      identity of the controller and the purposes of the processing for which the personal data are
      intended', and a declaration of consent pre-formulated by the controller 'should be provided
      in an intelligible and easily accessible form, using clear and plain language'. Read with Art.
      4(11) - consent is a 'freely given, specific, informed and unambiguous indication' - a stored
      value that names no purpose and no version of the text presented cannot show which processing
      operation was agreed to, which is why the purpose and version limbs are in the context
      questions rather than only the timestamp. Quoted from the same Official Journal text,
      retrieved 2026-07-27."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 30(1): 'Each controller and, where applicable, the
      controller's representative, shall maintain a record of processing activities under its
      responsibility. That record shall contain all of the following information: (a) the name and
      contact details of the controller ...; (b) the purposes of the processing; (c) a description
      of the categories of data subjects and of the categories of personal data; (d) the categories
      of recipients ...; (f) where possible, the envisaged time limits for erasure of the different
      categories of data ...'. Quoted from the same Official Journal text, retrieved 2026-07-27.
      This is a register of processing activities, not a per-data-subject consent log; it is the
      organisational half of the demonstrability duty and is out of this detector's reach by design
      (EU coverage map Part A row 7: 'Split honestly: persistence-absence is SRC; proof adequacy is
      ORG and must not be scored by the scanner')."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "CNIL, deliberation SAN-2023-009 of 15 June 2023 (published 22 June 2023), sanctioning CRITEO
      with an administrative fine of EUR 40 000 000. The restricted committee found, among other
      breaches, an infringement of GDPR Art. 7(1): the company could not demonstrate that the data
      subjects whose data it processed had consented, because it relied on its partners to collect
      consent and could not produce the proof. Verified as part of the EU coverage map's adversarial
      fact-check (2026-07-22 verification record, Part A row 7). Cited as enforcement pressure, in a
      national jurisdiction, not as the source of the obligation."
    url: https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000047678324
    checked_at: 2026-07-27
    jurisdiction: FR
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Both Art. 5 and Art. 7 are inside that tier, so the demonstrability duty carries the upper
      band rather than the Art. 83(4) one. Quoted from the same Official Journal text, retrieved
      2026-07-27."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25

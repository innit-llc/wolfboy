id: eu-consent-018
pack: eu-consent
short_name: "Marketing messages: opt-in and opt-out"
problem_line:
  text: "Marketing message: consent, opt-out or sender name not found"
fix_line: Send only on recorded consent or the existing-customer route; ship boxes unticked; name
  the sender and add unsubscribe.
title: Marketing-consent control, message template, send call, list write or vendor SDK - opt-in and
  opt-out need review
jurisdiction:
  - EU
legal_basis:
  - cite: "ePrivacy Directive 2002/58/EC, Art. 13 ('Unsolicited communications'), as replaced by
      Directive 2009/136/EC - ADDRESSEE: the Directive itself is addressed to the Member States
      (Art. 17(1): 'Before 31 October 2003 Member States shall bring into force the provisions
      necessary to comply with this Directive'), so it has no direct effect against a private sender
      and the operative duty on the party scanned here is the NATIONAL TRANSPOSITION of Art. 13 in
      each Member State whose subscribers or users are addressed - typically located in
      unfair-competition or telecoms codes rather than in the data-protection statute. The
      transposed prohibition binds the natural or legal person who uses electronic mail or automated
      calling for direct marketing, and Art. 13(4) reaches equally the person 'on whose behalf the
      communication is made'. Art. 13(1): 'The use of automated calling and communication systems
      without human intervention (automatic calling machines), facsimile machines (fax) or
      electronic mail for the purposes of direct marketing may be allowed only in respect of
      subscribers or users who have given their prior consent.' Art. 13(2): 'Notwithstanding
      paragraph 1, where a natural or legal person obtains from its customers their electronic
      contact details for electronic mail, in the context of the sale of a product or a service, in
      accordance with Directive 95/46/EC, the same natural or legal person may use these electronic
      contact details for direct marketing of its own similar products or services provided that
      customers clearly and distinctly are given the opportunity to object, free of charge and in an
      easy manner, to such use of electronic contact details at the time of their collection and on
      the occasion of each message in case the customer has not initially refused such use.' Art.
      13(4): 'In any event, the practice of sending electronic mail for the purposes of direct
      marketing which disguise or conceal the identity of the sender on whose behalf the
      communication is made, which contravene Article 6 of Directive 2000/31/EC, which do not have a
      valid address to which the recipient may send a request that such communications cease or
      which encourage recipients to visit websites that contravene that Article shall be
      prohibited.' Art. 13(5) confines paragraphs 1 and 3 to subscribers who are natural persons and
      leaves the position of legal persons to national law, which is one of the reasons the B2B
      rules differ by Member State. 'Electronic mail' is defined in Art. 2(h) as 'any text, voice,
      sound or image message sent over a public communications network which can be stored in the
      network or in the recipient's terminal equipment until it is collected by the recipient',
      which is why SMS and push-style stored messages fall inside the same provision as email."
    url: http://publications.europa.eu/resource/celex/02002L0058-20091219
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(11) and Recital 32, read into Art. 13(1) of Directive
      2002/58/EC through GDPR Art. 94(2) (references to the repealed Directive 95/46/EC are
      construed as references to the GDPR). Art. 4(11): consent means 'any freely given, specific,
      informed and unambiguous indication of the data subject's wishes by which he or she, by a
      statement or by a clear affirmative action, signifies agreement to the processing of personal
      data relating to him or her'. Recital 32: 'Consent should be given by a clear affirmative act
      ... This could include ticking a box when visiting an internet website ... Silence, pre-ticked
      boxes or inactivity should not therefore constitute consent.' GDPR Art. 95 keeps the ePrivacy
      regime specific: this Regulation 'shall not impose additional obligations' where Directive
      2002/58/EC sets out specific obligations with the same objective."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "CJEU, Case C-654/23, Inteligo Media SA v Autoritatea Nationala de Supraveghere a Prelucrarii
      Datelor cu Caracter Personal, judgment of 13 November 2025 (First Chamber). Operative part
      point 1: Art. 13(1) and (2) \"must be interpreted as meaning that the email address of a user
      is obtained by the publisher of an online publication 'in the context of the sale of a product
      or a service', within the meaning of Article 13(2) of that directive, where that user creates
      a free account on that publisher's online platform giving him or her the right to access, free
      of charge, a certain number of articles of that publication, to receive, free of charge, via
      email, a daily newsletter ... and the right to access, for a fee, additional articles and
      analyses of that publication. The transmission of such a newsletter constitutes a use of
      electronic mail 'for the purposes of direct marketing' for 'similar products or services'
      within the meaning of that provision.\" The three pairs of single quotation marks inside that
      passage are the Court's own, around the terms of Art. 13(2) it is construing, and they are
      part of the quotation; CORRECTION 2026-08-03, this entry dropped all three pairs until the
      quote-verification gate was extended to rule cites and found them, so do not remove them
      again. The passage is delimited with double quotation marks for the reason the extraction
      convention gives for that style - the quoted matter itself contains single marks - so that the
      whole passage is verified rather than a prefix of it.Point 2: where the controller uses the
      email address under Art. 13(2), 'the conditions for lawful processing laid down in Article
      6(1) of that regulation are not applicable'. Two consequences for adjudication: an editorial
      newsletter that steers free-tier users towards a paid tier is direct marketing, and a sign-up
      that costs the user no money can still be a 'sale' for the soft opt-in, because indirect
      remuneration suffices."
    url: http://publications.europa.eu/resource/celex/62023CJ0654
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "e-Commerce Directive 2000/31/EC, Art. 6, incorporated by reference into ePrivacy Art. 13(4):
      commercial communications must be clearly identifiable as such, and the natural or legal
      person on whose behalf they are made must be clearly identifiable. This is the source of the
      'do not disguise or conceal the sender' limb; like ePrivacy it is a directive, so the
      operative rule is again the national transposition."
    url: http://publications.europa.eu/resource/celex/02000L0031-20240217
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2003-10-31

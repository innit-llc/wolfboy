id: eu-consent-017
pack: eu-consent
short_name: "Consent given: an equally easy way to withdraw it"
problem_line:
  text: "Withdrawing consent: equal path, effect or notice not found"
fix_line: Make withdrawal as easy as giving consent, make it undo what the grant switched on, and
  say how before asking.
title: Consent grant written, or a symbol named for one - revocation path and its parity with
  granting need review
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 7(3), quoted in full from the Official Journal text
      (CELEX 32016R0679, retrieved 2026-07-27 from the Publications Office cellar and re-fetched
      from the same source on 2026-07-28, character-exact both times): 'The data subject shall have
      the right to withdraw his or her consent at any time. The withdrawal of consent shall not
      affect the lawfulness of processing based on consent before its withdrawal. Prior to giving
      consent, the data subject shall be informed thereof. It shall be as easy to withdraw as to
      give consent.' Four sentences, three duties and one saving clause: withdrawal at any time; no
      retroactive effect on processing already carried out; notice of the right before consent is
      taken; and parity of effort between giving and withdrawing. ADDRESSEE: the controller (Art.
      4(7)). The paragraph is drafted as a right of the data subject, and the correlative duty is
      placed on the controller by Art. 7(1) ('the controller shall be able to demonstrate') and
      stated directly by EDPB Guidelines 05/2020 para. 113: 'Article 7(3) of the GDPR prescribes
      that the controller must ensure that consent can be withdrawn by the data subject as easy as
      giving consent and at any given time.' Applies since 2018-05-25 (Art. 99(2))."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-28
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 42, last sentence, from the same Official Journal
      text: 'Consent should not be regarded as freely given if the data subject has no genuine or
      free choice or is unable to refuse or withdraw consent without detriment.' This is the recital
      that makes an absent withdrawal path a defect in the consent itself rather than a separate
      housekeeping failure: where withdrawal cannot be exercised, the consent that was collected is
      open to challenge from the moment it was given. Read with Art. 7(3) it also fixes what the
      adjudicating agent is looking for - not the wording of a banner, but whether the code contains
      any path back to the stored decision, and what that path costs the user compared with the one
      that took the decision in the first place."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-28
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 13(2)(c): where processing is based on Art. 6(1)(a) or
      Art. 9(2)(a), the controller shall provide 'the existence of the right to withdraw consent at
      any time, without affecting the lawfulness of processing based on consent before its
      withdrawal'. This carries the third sentence of Art. 7(3) ('Prior to giving consent, the data
      subject shall be informed thereof') into the information that must be given at collection,
      which is why a banner that names no withdrawal route is within this rule's subject matter even
      when a route exists elsewhere in the product."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-28
    jurisdiction: EU
  - cite: EDPB Guidelines 05/2020 on consent under Regulation 2016/679, Version 1.1, adopted 4 May 2020
      (v1.1 of 13 May 2020 carries formatting corrections only), section 5.2 - para. 113 (the
      controller must ensure withdrawal is as easy as giving and available at any time; 'the GDPR
      does not say that giving and withdrawing consent must always be done through the same
      action'); para. 114 ('when consent is obtained via electronic means through only one
      mouse-click, swipe, or keystroke, data subjects must, in practice, be able to withdraw that
      consent equally as easily. Where consent is obtained through use of a service-specific user
      interface (for example, via a website, an app, a log-on account, the interface of an IoT
      device or by e-mail), there is no doubt a data subject must be able to withdraw consent via
      the same electronic interface, as switching to another interface for the sole reason of
      withdrawing consent would require undue effort'; withdrawal must be possible 'free of charge
      or without lowering service levels'); para. 115 (Example 22 - a one-click online grant against
      a withdrawal that requires a business-hours phone call does not comply with Art. 7(3)); para.
      116 ('If the withdrawal right does not meet the GDPR requirements, then the consent mechanism
      of the controller does not comply with the GDPR', and the controller must inform the data
      subject of the right before consent is given); para. 117 (processing carried out before
      withdrawal remains unaffected, 'however, the controller must stop the processing actions
      concerned. If there is no other lawful basis justifying the processing (e.g. further storage)
      of the data, they should be deleted').
    url: https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-052020-consent-under-regulation-2016679_en
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "ePrivacy Directive 2002/58/EC, Art. 5(3) (as replaced by Directive 2009/136/EC) read with
      Art. 2(f), and GDPR Art. 94. Art. 5(3) requires that storing information, or gaining access to
      information already stored, in a user's terminal equipment be 'only allowed on condition that
      the subscriber or user concerned has given his or her consent'. Art. 2(f) provides that
      \"'consent' by a user or subscriber corresponds to the data subject's consent in Directive
      95/46/EC\", and GDPR Art. 94(1)-(2) repeals that Directive with effect from 25 May 2018 and
      provides that 'references to the repealed Directive shall be construed as references to this
      Regulation'. The chain is what makes this rule reach cookie and tracker banners: the consent
      they collect is GDPR consent, so Art. 7(3) supplies its withdrawal condition. Both texts
      quoted from the Official Journal (CELEX 02002L0058-20091219 and 32016R0679, retrieved
      2026-07-27)."
    url: http://publications.europa.eu/resource/celex/02002L0058-20091219
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "CNIL, Deliberation no. 2020-092 of 17 September 2020 adopting a recommendation on practical
      means of compliance when 'cookies and other trackers' are used, Article 3 ('Retrait et gestion
      du consentement'), paras 40-45. A recommendation rather than a binding instrument - it
      describes practical means of complying with Art. 82 of the French Data Protection Act, the
      national transposition of ePrivacy Art. 5(3) - and it is cited here because it is the clearest
      published statement of the code-visible shape this rule looks for. Para. 40: users who have
      consented 'doivent etre en mesure de le retirer a tout moment', and it must be 'aussi simple
      de retirer son consentement que de le donner'. Para. 41: users must be informed of the means
      of withdrawal before they consent. Para. 42: withdrawal solutions should be 'aisement
      accessibles a tout moment', simplicity being measured by the time and the number of actions
      needed. Para. 43: withdrawal 'peut par exemple etre offerte via un lien accessible a tout
      moment depuis le service concerne', with a descriptive name such as 'gerer mes cookies', or a
      settings module reachable from every page through a cookie icon - i.e. exactly the persistent
      re-entry point context_questions[3] asks the adjudicator to look for and to price against the
      grant. Para. 45: for withdrawal to be effective it may be necessary to ensure that trackers
      previously used are no longer read or written, which is limb (d) of that comparison. Note the
      negative use of this source too: the name CNIL recommends for the link, 'gerer mes cookies',
      was matched by none of the eight guard branches this rule used to carry, which is one reason
      they were inert on real code."
    url: https://www.cnil.fr/sites/cnil/files/atoms/files/recommandation-cookies-et-autres-traceurs.pdf
    checked_at: 2026-07-27
    jurisdiction: FR
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 17(1)(b): the controller shall erase personal data
      without undue delay where 'the data subject withdraws consent on which the processing is based
      according to point (a) of Article 6(1), or point (a) of Article 9(2), and where there is no
      other legal ground for the processing'. EDPB Guidelines 05/2020 para. 117 links the two:
      processing already carried out is unaffected, the processing actions concerned must stop, and
      absent another ground the data should be deleted. This rule does not test erasure;
      eu-consent-017 fires on the absence of a withdrawal path, not on what happens afterwards."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-28
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
sunset: null
superseded_by: null
severity: high
rule_confidence: 0.5
detector:
  engine: builtin-regex
  match:
    - (?:[Ll]ocalStorage|[Ss]essionStorage|[Ss]torage)\s*\??\.\s*setItem\s*\(\s*[^)\n]{0,80}(?:[Cc]onsent|CONSENT|[Cc]ookie[_-]?[Pp]ref|COOKIE_PREF|[Cc]ookies?[_-]?[Aa]ccepted|[Gg]dpr|GDPR)
    - (?:document\s*\.\s*cookie\s*=|[Cc]ookies?\s*(?:\.|::)\s*(?:set|Set|queue|make|add|forever)\b|[Ss]et[_-]?[Cc]ookie|setcookie|SET_COOKIE|[Cc]ookies?\s*\[|[Cc]ookies\s*\.\s*(?:permanent|signed|encrypted)|cookieStore\s*\.\s*set|new\s+Cookie\s*\(|http\.Cookie\s*\{|[Ww]ith[Cc]ookies?\s*\()[^\n]{0,90}(?:[Cc]onsent|CONSENT|[Cc]ookie[_-]?[Pp]ref|[Gg]dpr|GDPR|[Cc]ookies?[_-]?[Aa]ccepted)
    - (?:Name|name|NAME)\s*(?:=>|[:=])\s*["'`][a-z0-9][a-z0-9_.-]{0,24}consent[a-z0-9_.-]{0,24}["'`]
    - (?:[Aa]ccept(?!ance)|ACCEPT|[Aa]gree|AGREE|[Aa]llow|ALLOW|[Gg]rant|GRANT|[Gg]ive)\w{0,10}[_-]?(?:[Cc]onsent|CONSENT)
    - (?:[Aa]ccept(?!ance)|ACCEPT|[Aa]gree|AGREE|[Gg]rant|GRANT|[Gg]ive)\w{0,10}[_-]?(?:[Cc]ookies?|COOKIES?|[Tt]racking|TRACKING)
    - "[Oo]pt[_-]?[Ii]n\\w{0,6}[_-]?(?:[Cc]apturing|[Tt]racking|[Cc]onsent|[Aa]nalytics|[Cc]ookies?\
      )|opt_in_capturing|opt_in_tracking"
    - (?:[Cc]onsent|CONSENT)\w{0,20}\s*(?:\?)?\s*(?::|=>|(?<![=!<>+*/-])=(?!=))\s*(?:true|True|TRUE|["'`](?:true|yes|granted|accepted|all|allow)["'`])
    - gtag\s*\(\s*["'][Cc]onsent["']\s*,\s*["']update["']|(?:analytics_storage|ad_storage|ad_user_data|ad_personalization|functionality_storage|personalization_storage)["']?\s*:\s*["']granted["']|acceptAllServices|__tcfapi\s*\(
    - "[Cc]onsent(?:ed)?[_-]?(?:[Aa]t|AT|[Dd]ate|[Tt]imestamps?|[Vv]ersion|[Gg]iven)\\b|[Cc]onsent(\
      ?:ed)?[_-]?(?:[Ll]ogs?|[Rr]ecords?|[Hh]istory)\\s*(?:[.\\[({=:,]|$)|[Cc]onsents?\\w{0,14}[^\\\
      n]{0,12}(?:\\.|->|::)\\s*(?:create|insert|save|upsert|bulkCreate)\\b|INSERT\\s+INTO\\s+[^\\n]\
      {0,40}consent"
    - (?:[Tt]able|TABLE|[Cc]ollection|COLLECTION|[Mm]odel|MODEL)\w{0,10}\s*(?:=>|[:=])\s*["'`][a-z0-9_.-]{0,24}consents?[a-z0-9_.-]{0,14}["'`]
    - (?:[Ss]ession|SESSION)\s*(?:\[|(?:\(\s*\))?\s*(?:\.|->)\s*(?:set|put|update)\s*\(\s*\{?)\s*[:'"`$]?\w{0,24}[Cc]onsent|\$_SESSION\s*\[[^\]\n]{0,30}consent
    - (?:(?<![A-Za-z])set|Set|SET|(?<![A-Za-z])save|Save|SAVE|(?<![A-Za-z])store|Store|STORE|(?<![A-Za-z])record(?!ing)|Record(?!ing)|RECORD|(?<![A-Za-z])persist|Persist|(?<![A-Za-z])write|Write|(?<![A-Za-z])update|Update|UPDATE)\w{0,8}[_-]?(?:[Cc]onsent|CONSENT)
    - ^(?![^\n]*["']default["'])[^\n]*(?:analytics_storage|ad_storage|ad_user_data|ad_personalization|functionality_storage|personalization_storage|security_storage)["']?\s*:\s*["']denied["']
    - (?:TERMS?|PRIVACY|COOKIES?|GDPR|EULA|MARKETING)(?:[_-][A-Z]{2,14}){0,2}[_-]ACCEPT(?:ED|ANCE)?(?![A-Z])|(?:[Tt]erms?|[Pp]rivacy[Pp]olicy|[Pp]rivacy_policy|[Cc]ookie[Pp]olicy)\w{0,12}[_-]?[Aa]ccept(?:ed|ance)(?![a-z])|(?:[Aa]ccept(?:ed|ance)|ACCEPTED)[_-]?(?:[Tt]erms?|TERMS?|[Pp]rivacy|PRIVACY)(?![a-z])
    - (?:oauth2?|OAuth2?|Oauth2?|OAUTH2?|oidc|OIDC|Oidc)[_-]?(?:[Cc]onsents?|CONSENTS?)(?![a-z])
    - (?:[Cc]onsent|CONSENT)[_-]?(?:[Pp]age|PAGE|[Uu]ri|URI|[Uu]rl|URL|[Rr]oute|ROUTE|[Pp]ath|PATH)\s*(?:=>|[:=])\s*["'`/]

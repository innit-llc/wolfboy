context_questions:
  - "Does this code infer emotions or intentions of a natural person from biometric data — face,
    voice, gaze, keystroke dynamics, gait, body posture, heartbeat, EEG, ECG or another bodily
    signal — or is it a different use of the same SDK? Quote the request options and the response
    fields that are read. Art. 5(1)(f) is construed as limited to inferences based on biometric data
    (Guidelines para. 245, reading Art. 3(39)), so face detection, face matching, gaze or head-pose
    tracking on their own, attendance counting and speech-to-text fall outside it, and so does
    sentiment analysis over typed text. Two further exclusions to apply here rather than argue about
    later: Recital 18 puts physical states such as pain and fatigue outside the definition
    (Guidelines para. 261), and speech synthesis that takes an emotion parameter generates a voice
    rather than reading one. If the evidence only shows one of those, record that and close the
    candidate."
  - "Are the natural persons whose emotions are inferred workers or students of the party running
    this system? This is the question the detector no longer asks, and it decides whether the
    candidate stands. Quote the code that shows whose faces, voices or behavioural signals reach the
    model — the data source, the route that feeds it, the identity the results are stored against —
    and follow it across files, because the affect client and its domain caller are usually
    different modules. Guidelines para. 254 reads 'workplace' broadly (any physical or virtual space
    where assigned tasks are performed, whatever the employment status, remote and hybrid included,
    and extending to candidates during selection and hiring), and para. 255 reads 'education
    institution' broadly (all levels and modes, including admission testing). The same paragraphs
    draw the boundary the other way: a call centre inferring its customers' emotions, a storefront
    measuring shoppers, or a consumer app used outside an institution, is not within Art. 5(1)(f).
    If the subjects are customers, visitors or general consumers, this candidate belongs to the Art.
    50(3) notice duty instead and should be closed here."
  - "Is the deployment intended for medical or safety reasons within the Art. 5(1)(f) exception?
    Read the exception narrowly (Guidelines paras 256-259): therapeutic use means CE-marked medical
    devices, and 'safety' covers protection of life and health only, not property, theft or fraud.
    General wellbeing, stress, burnout, engagement, motivation or satisfaction monitoring is outside
    the exception even when the stated intent is benevolent. Quote the code or configuration that
    evidences the medical or safety purpose and the limits on it; a comment asserting the purpose is
    not evidence."
  - "Is the scanned party a deployer who is a natural person using this in a purely personal,
    non-professional activity (Art. 3(4) and Art. 2(10))? A hobby repository, a personal experiment
    or a learning exercise carries no deployer obligation and must not produce a finding at this
    tier. Quote what shows the capacity: is there a paying or contractual relationship, an
    organisation behind the repository, a published or distributed artifact? Two limits on this
    exclusion (Guidelines paras 34-36): it removes deployer obligations only and leaves the provider
    limb (placing on the market, putting into service) intact, and the Art. 2(12) free and
    open-source exclusion is expressly unavailable for Art. 5 systems, so publishing this openly
    does not by itself take it out of scope."
  - Which limb of Art. 5(1)(f) does the evidence support — placing on the market or putting into
    service (provider, Art. 3(3)), or use (deployer, Art. 3(4))? The prohibition binds both, each
    within their respective responsibilities (Guidelines para. 243), so this does not decide whether
    the candidate stands; it decides what the remediation is and who owns it. Quote whether the
    model is hosted, trained or fine-tuned here and offered onward under this party's own name or
    brand, or whether a third-party affect API is called under this party's own authority. A
    connector, plugin or integration that packages an affect API for other people to run is the
    provider limb even though the party running it never sees a worker or a student.
  - Is this code path live in a shipped product, or is it research, testing or development prior to
    placing on the market or putting into service (Art. 2(8))? Trace the call from an entry point
    and quote it. A demo under examples/ that is built and deployed counts as shipped; a branch that
    nothing reaches does not. Note that testing in real-world conditions is not covered by the Art.
    2(8) exclusion.
  - Is there an EU nexus (Art. 2(1))? The Regulation reaches a provider placing the system on the
    Union market or putting it into service in the Union wherever established, a deployer
    established or located in the Union, and a provider or deployer in a third country where the
    output of the system is used in the Union. Quote the deployment regions, tenant configuration or
    customer targeting that the repository shows, and record the absence if it shows none.
evidence_template: "{file}:{line} names an affect-inference surface — a vendor SDK or endpoint, an
  emotion model, dataset or identifier, or a call reading emotions, intentions or a related
  affective state (mood, arousal, valence, stress, engagement, interest or attention). READ THE LINE
  AND SAY WHICH KIND OF BRANCH MATCHED IT, because the branches do not establish the same amount.
  Some of them require a SECOND TOKEN on the same line, and that token is one of three kinds: a
  biometric or behavioural signal (face, voice, gaze, pupil, keystrokes, gait, posture, or a
  physiological sensor such as EEG, ECG or skin conductance); a model or SDK token (an affect vendor
  such as Hume, Affectiva, MorphCast or Rekognition, or a model being loaded or run —
  from_pretrained, load_model, onnxruntime, torch, tensorflow); or an observed-person word (a
  worker, an employee, an applicant, an interviewee, a student, a test taker, and on one branch a
  wider list that adds a candidate, a driver, a patient, a shopper or a passenger). One branch
  requires an observed-person word AND a signal-or-model token, three tokens in all. Where a second
  token was required, the match establishes the conjunction and not merely the affect word, and the
  finding is correspondingly stronger. The remaining branches require no second token at all,
  several of them are satisfied by a vendor name, a dataset name or a bare affect term, and there
  the match establishes only that the word is present. No count of branches is given here on
  purpose: the number changes as clauses are added and a number written into this sentence goes
  stale silently, which is what happened to the sentence this one replaces. Five look-alikes of that
  kind have been read on real matched lines, and on each of them the word was the whole of what was
  matched: a bare affect term as an entry in a tokenizer or word-list file, where arousal is a
  vocabulary row sitting between two unrelated tokens; emotion as the name of the CSS-in-JS styling
  library, so a local binding such as emotion_1 matches on a line whose call injects stylesheet
  rules; mood in its design sense, the visual tone of a surface, in a design-system table;
  engagement and interest in their commercial sense, buying interest and sales meetings, inside a
  prompt template; and editorial prose about a third party's product, where the affect surface named
  belongs to another company rather than to this repository. Read the matched line first and say
  which shape it is, or that it names no affect surface at all. Whether the call infers emotions
  from biometric data, or is a different use of the same SDK, is context question 1. Whether the
  observed persons are workers, job candidates or students is context question 2."
remediation_template: |
  Treat this as a candidate for review at the highest tier in the AI Act, not as a settled finding.
  Art. 99(3) sets fines of up to EUR 35 000 000 or 7% of worldwide annual turnover, whichever is
  higher — but Art. 99(6) reverses that comparison for SMEs including start-ups, for whom each fine
  is capped at whichever of the two is lower. For a solo developer or a small team that is the
  turnover percentage, not the EUR 35 000 000. Art. 5 has applied since 2025-02-02 and the penalties
  chapter since 2025-08-02.
  Establish three facts before changing anything, in this order.
  1. Does the system infer emotions or intentions from biometric data (face, voice, gaze, keystroke
  dynamics, gait, posture, heartbeat, EEG or ECG), rather than detect, match or count faces, track
  gaze alone, synthesise speech with an emotion parameter, or analyse typed text? Read the request
  options and the response fields, not the module name.
  2. Are the observed persons the party's own workers, job candidates or students, rather than
  customers or general consumers? The detector does not test this; it is the question that decides
  whether the candidate stands, and the answer is usually in a different file from the one reported.
  3. Is the purpose medical or safety within the narrow reading — a CE-marked medical device, or
  protection of life and health? Wellbeing, stress, burnout, engagement and motivation monitoring
  are outside it.
  If all three point at Art. 5(1)(f), the engineering change is to stop inferring emotions for those
  persons, not to paper over it. Concretely: drop the emotion attribute from the request rather than
  the whole face call (AWS Rekognition Attributes ["DEFAULT"] instead of ["ALL"] or ["EMOTIONS"];
  Azure Face without the emotion attribute), remove the expression model from the chain
  (face-api.js: keep withFaceLandmarks, drop withFaceExpressions and stop loading
  faceExpressionNet), drop the affect models from the job request (Hume Expression Measurement:
  remove the face and prosody models), stop loading the affect model in the Python pipeline (fer,
  py-feat, DeepFace's emotion action), or gate the whole path so it cannot be reached for worker,
  candidate or student subjects.
  Note what does not work here. Consent, a notice, a banner or a data protection impact assessment
  do not lift an Art. 5 prohibition — a notice discharges the separate Art. 50(3) duty owed by a
  deployer of an emotion-recognition system, which is a different obligation at a different tier.
  Releasing the code under a free or open-source licence does not help either: Art. 2(12) expressly
  withholds that exclusion from Art. 5 systems.
  If the deployment genuinely sits inside the medical or safety exception, keep the evidence with
  the code: the narrow purpose, the limits in time, scale and personal application, the safeguards,
  and a record that the data is not reused for performance assessment.

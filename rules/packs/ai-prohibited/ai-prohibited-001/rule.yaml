id: ai-prohibited-001
pack: ai-prohibited
short_name: Emotion inference named in the code
problem_line:
  text: Emotions inferred from biometrics at work or in education
fix_line: Drop the emotion attribute or model for workers and students, unless the use is medical or
  for safety.
title: Affect-inference call, model or term named, screened against AI Act Art. 5(1)(f) - signal and
  setting need review
jurisdiction:
  - EU
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 5(1)(f) — 'the placing on the market, the putting
      into service for this specific purpose, or the use of AI systems to infer emotions of a
      natural person in the areas of workplace and education institutions, except where the use of
      the AI system is intended to be put in place or into the market for medical or safety
      reasons'. Addressee: providers (Art. 3(3)) AND deployers (Art. 3(4)) alike, each within their
      respective responsibilities — the prohibition names three acts, placing on the market, putting
      into service and use, so unlike Art. 50 (whose paragraphs (1)-(2) fall on providers and
      (3)-(4) on deployers) it does not split by role. Applies from 2025-02-02 (Art. 113(a),
      Chapters I and II); the penalties chapter applies from 2025-08-02 (Art. 113(b))."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 99(3) and Art. 99(6). Art. 99(3): 'Non-compliance
      with the prohibition of the AI practices referred to in Article 5 shall be subject to
      administrative fines of up to EUR 35 000 000 or, if the offender is an undertaking, up to 7 %
      of its total worldwide annual turnover for the preceding financial year, whichever is higher.'
      The highest tier in the Regulation. Art. 99(6) reverses that comparison for the audience this
      scanner is built for: 'In the case of SMEs, including start-ups, each fine referred to in this
      Article shall be up to the percentages or amount referred to in paragraphs 3, 4 and 5,
      whichever thereof is lower.' Both quotations verified against the Official Journal text (L
      series, 32024R1689) on 2026-07-27. The penalties chapter has applied since 2025-08-02 while
      the prohibition itself has applied since 2025-02-02. Reference only: this article sets the
      consequence, it does not establish the duty the rule tests, which is Art. 5(1)(f)."
    url: http://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), definitions and scope carve-outs that govern how a hit
      is adjudicated. Art. 3(3) 'provider'; Art. 3(4) 'deployer' — 'a natural or legal person ...
      using an AI system under its authority except where the AI system is used in the course of a
      personal non-professional activity'; Art. 2(10) — the Regulation 'does not apply to
      obligations of deployers who are natural persons using AI systems in the course of a purely
      personal non-professional activity'; Art. 3(39) 'emotion recognition system' — 'an AI system
      for the purpose of identifying or inferring emotions or intentions of natural persons on the
      basis of their biometric data', which is why intentions and not only emotions are in this
      detector's vocabulary; Art. 2(8) research, testing and development prior to placing on the
      market or putting into service; Art. 2(12) free and open-source licence exclusion, which
      expressly does NOT reach systems falling under Art. 5. Reference only: definitional and scope
      provisions, they do not themselves establish the duty."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-3
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Guidelines on prohibited artificial intelligence practices established by
      Regulation (EU) 2024/1689 (AI Act), C(2025) 5052 final, 29.7.2025 — para. 243 ('The
      prohibition, therefore, applies to both providers and deployers of AI systems, each within
      their respective responsibilities'); para. 245 (the prohibition is to be construed as limited
      to inferences based on a person's biometric data, so Art. 3(39) is relevant to Art. 5(1)(f));
      para. 251 (the signals reach beyond face and voice: keystrokes, gait, body posture, eye
      tracking, heartbeat, EEG and ECG); para. 254 ('workplace' read broadly: any physical or
      virtual space where tasks assigned by an employer are performed, independent of
      employee/contractor/trainee/volunteer status, extended to candidates during the selection and
      hiring process; tracking a call centre's own staff is caught, tracking that call centre's
      customers is not); para. 255 (education institutions of every level and mode, including
      vocational schools and admission testing; inferring students' interest and attention is given
      as a worked example of the prohibition; an emotion-based language app used outside an
      institution is not caught, the same app is caught once an institution requires students to use
      it); paras 256-259 (the medical or safety exception is to be interpreted narrowly: therapeutic
      use means CE-marked medical devices, safety covers protection of life and health only and not
      property, theft or fraud, and general wellbeing, stress or burnout monitoring is outside it);
      para. 261 (Recital 18 excludes physical states such as pain or fatigue from the
      emotion-recognition definition, so driver- or pilot-fatigue detection falls outside); paras
      34-35 (the personal non-professional exclusion removes deployer obligations only and leaves
      the provider limb intact); para. 36 (Art. 2(12) free and open-source exclusion is unavailable
      for Art. 5 systems); para. 55 (Art. 99(3) tier); para. 57 (the scope of the Art. 5
      prohibitions is to be interpreted narrowly); para. 429 (Art. 5 applies from 2025-02-02).
      Reference only: the Guidelines state at para. 5 that they are non-binding."
    url: https://ai-act-service-desk.ec.europa.eu/sites/default/files/2025-08/guidelines_on_prohibited_artificial_intelligence_practices_established_by_regulation_eu_20241689_ai_act_english_ied3r5nwo50xggpcfmwckm3nuc_112367-1.PDF
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2025-02-02

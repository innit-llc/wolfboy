id: ai-prohibited-004
pack: ai-prohibited
short_name: "Image generator: safeguards against fake nude images"
problem_line:
  text: Generator may make sexual deepfakes or child abuse material
fix_line: "From 2 Dec 2026: show real people only on explicit consent; none looking under 18; keep
  filters in code; act on misuse."
title: Nudification wording, safety control off, or image-generation surface - AI Act Art. 5
  (ba)/(bb) from 2026-12-02
jurisdiction:
  - EU
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 5(1), first subparagraph, points (ba) and (bb),
      read with Art. 5(1a) and Art. 5(1b), all inserted by Art. 1(7) of Regulation (EU) 2026/1744
      (Digital Omnibus on AI), CELEX 32026R1744, OJ L series 2026/1744 of 24.7.2026, in force 27
      July 2026. Point (ba) prohibits 'the placing on the market, the putting into service or the
      use of an AI system that generates or manipulates realistic images, videos, audio or similar
      material of an identifiable natural person's intimate parts, or of an identifiable natural
      person engaged in sexually explicit activities, without that person's freely-given, specific,
      informed, unambiguous and explicit consent for that generation or manipulation'. Point (bb)
      prohibits 'the placing on the market, the putting into service or the use of an AI system that
      generates or manipulates material or performance within the meaning of Article 2, points (c)
      and (e), of Directive 2011/93/EU, except where a \"without right\" defence applies under
      national law'. Art. 5(1a) then splits the three prohibited acts between two addressees and
      applies a different test to each, and there is no test that applies to both. PROVIDER, for
      placing on the market and putting into service, Art. 5(1a)(a): those acts are 'only prohibited
      where' either (i) 'that generation or manipulation is the intended purpose of the AI system'
      or (ii) 'the system's design, training, architecture, capabilities or user-facing
      functionalities make that generation or manipulation a reasonably foreseeable and reproducible
      outcome, without requiring significant technical modification, and the system does not have
      reasonable and adequate technical safety measures and other safeguards to reliably prevent
      that generation or manipulation, taking into account reasonably foreseeable misuse, and to
      correct observed or reported misuse'. The connector between (i) and (ii) is or, so either
      alone suffices; the connector inside (ii) is and, so foreseeability alone never establishes a
      provider breach and a provider with reasonable and adequate measures that corrects observed or
      reported misuse sits outside limb (ii) however foreseeable the output is. DEPLOYER, for use,
      Art. 5(1a)(b): 'the use of an AI system that generates or manipulates the material or
      performance referred to in paragraph 1, first subparagraph, points (ba) and (bb) is only
      prohibited where the deployer uses the system for the purpose of generating or manipulating
      such material or performance' - a pure purpose test with no foreseeability element, no
      safeguards element and no capability element. Art. 5(1b) narrows point (ba) only: 'an AI
      system that manipulates material in a way that does not increase the exposure of any depicted
      intimate parts or alter the nature of any depicted sexually explicit activities shall not
      constitute manipulation'. Two cross-reference wordings differ in the Official Journal and are
      reproduced as printed: the provider limb refers to 'point (ba) or (bb)' and the deployer limb
      to 'points (ba) and (bb)'."
    url: https://publications.europa.eu/resource/celex/32026R1744
    checked_at: 2026-08-06
    jurisdiction: EU
  - cite: "EU AI Act Art. 113, third paragraph, point (a), as replaced by Art. 1(40)(a) of Regulation
      (EU) 2026/1744 (CELEX 32026R1744): 'Chapters I and II shall apply from 2 February 2025, with
      the exception of Article 5(1), first subparagraph, points (ba) and (bb), and Article 5(1a) and
      (1b) which shall apply from 2 December 2026'. The two new points and the two new paragraphs
      are therefore not applicable before 2026-12-02, while the pre-existing Art. 5 prohibitions
      keep 2025-02-02. Art. 113 is composed of unnumbered paragraphs and has no subparagraphs, so
      the citation is the third paragraph and not the third subparagraph. Reference only: this fixes
      when the obligation in entry 1 starts to apply, not what it requires."
    url: https://publications.europa.eu/resource/celex/32026R1744
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Regulation (EU) 2026/1744 (CELEX 32026R1744), recitals 11, 12 and 13 - context for the
      adjudicator and not the operative test. Recital 11 records that the technologies concerned are
      'often described as' nudification applications and that their proliferation 'has created an
      urgent need for an explicit regulatory prohibition'. Recital 12 lists what safeguards may look
      like: 'Technical measures and other safeguards to prevent the generation of such material
      could include data cleaning, refusal training, safe prompt design and output controls, runtime
      prompt guardrails, content classification and filtering mechanisms, usage restrictions, abuse
      detection mechanisms, and notice and action mechanisms'. It sets the adequacy standard:
      preventive measures 'are considered adequate if they align with the state-of-the-art measures
      and demonstrably prevent or sufficiently reduce in each specific case the likelihood of
      generating or manipulating such material, taking into account known and reasonably foreseeable
      misuse, including reasonably foreseeable circumvention of the preventive measures without
      significant technical modification'. The closing words are part of the standard and are quoted
      here in full because they extend it: foreseeable circumvention without significant technical
      modification sits inside the adequacy question and not beside it, so a measure that known
      misuse would foreseeably circumvent has to be weighed against the standard rather than assumed
      to meet it. What the wording does not do is settle that such a measure fails: the standard is
      disjunctive - measures 'demonstrably prevent or sufficiently reduce in each specific case the
      likelihood' - so a measure that is foreseeably circumvented may still be adequate where it
      sufficiently reduces that likelihood. Both halves are evidential questions for the operator
      and neither is in a source tree. It fixes what realism means for point (ba): the term 'refers
      to the depiction of the person's face, voice or their body in a credible real-life manner,
      regardless of the realism of the context of that depiction or whether it fully corresponds to
      the actual voice or appearance of the depicted person. Conversely, it excludes cartoonish or
      physically impossible depictions of a person's body'. It places consented and clinical uses
      outside point (ba), naming 'try-on applications and medical applications, such as medical
      anatomical simulations and mammograms'. It preserves capability development: 'This prohibition
      should not prevent providers from developing the technical capabilities of AI systems to
      generate or manipulate images, videos, audio or similar material'. It states the deployer side
      in both directions: the prohibition on use 'does not cover the use of an AI system for lawful
      purposes, such as the generation or manipulation of material other than non-consensual
      intimate material or child sexual abuse material, even in cases where the AI system lacks
      reasonable and adequate safeguards that should have been put in place by the provider, nor
      does it cover accidental generation or manipulation of such content'. Recital 13 names what
      the point (bb) carve-out is meant to include: 'activities carried out under domestic legal
      powers, such as the legitimate generation, or manipulation of child sexual abuse material by
      the authorities in order to conduct criminal proceedings or to prevent, detect or investigate
      crime, as well as the legitimate use of the AI system in the context of red-teaming and
      evaluation activities for the purpose of assessing the system's compliance with the
      prohibition laid down in this Regulation'. One warning for anyone quoting from here: recital
      12's summary of the provider test is NOT word-identical to Art. 5(1a)(a)(ii), which carries
      neither 'where necessary' nor 'including circumvention of such measures'. Reference only:
      recitals do not create the defence and do not restate the test."
    url: https://publications.europa.eu/resource/celex/32026R1744
    checked_at: 2026-08-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Directive 2011/93/EU of the European Parliament and of the Council of 13 December 2011 on
      combating the sexual abuse and sexual exploitation of children and child pornography, and
      replacing Council Framework Decision 2004/68/JHA (OJ L 335, 17.12.2011, p. 1), CELEX
      32011L0093 - Art. 2, points (c) and (e), which AI Act Art. 5(1)(bb) imports by article and
      point number. Art. 2(c) defines the term 'child pornography' over four alternatives, quoted
      here point by point: (i) 'any material that visually depicts a child engaged in real or
      simulated sexually explicit conduct'; (ii) 'any depiction of the sexual organs of a child for
      primarily sexual purposes'; (iii) 'any material that visually depicts any person appearing to
      be a child engaged in real or simulated sexually explicit conduct or any depiction of the
      sexual organs of any person appearing to be a child, for primarily sexual purposes'; (iv)
      'realistic images of a child engaged in sexually explicit conduct or realistic images of the
      sexual organs of a child, for primarily sexual purposes'. Art. 2(e) defines 'pornographic
      performance' as 'a live exhibition aimed at an audience, including by means of information and
      communication technology, of' either (i) 'a child engaged in real or simulated sexually
      explicit conduct' or (ii) 'the sexual organs of a child for primarily sexual purposes'. Art.
      2(a) supplies the subject: a child is 'any person below the age of 18 years'. Three
      consequences for anything built on point (bb). First, the enacting text of point (bb) never
      uses the phrase child sexual abuse material - the recitals do, the operative text imports the
      Directive terms above, and a citation attributing that phrase to either instrument would be
      quoting words neither contains. Second, the definition reaches generated material by more than
      one route, and not only through (c)(iii) and (c)(iv): (c)(i) already covers material visually
      depicting a child engaged in 'real or simulated' sexually explicit conduct, so a generated or
      manipulated depiction of a real, identifiable child falls inside the term with no need for the
      later points, while (c)(iii) and (c)(iv) extend it to material where no real child exists at
      all - a person appearing to be a child, or a realistic image of a child. Third, point (e)
      reaches a live exhibition rather than stored material, so a real-time stream is within point
      (bb) through the performance branch even where nothing is written to disk. The carve-out
      defers to national law: Art. 5(1) of the same Directive requires Member States to punish the
      listed conduct 'when committed without right', and the Directive gives that phrase no
      definition in its Art. 2, so what it covers is settled by national law and none of those
      answers is in a source repository. Two counts, kept apart because they are not the same
      number. Point (bb) belongs to a Regulation binding in all 27 Member States and its carve-out
      is keyed to national law rather than to this Directive's transposition, so there are up to 27
      national answers to the carve-out question. The Directive behind it is transposed in at most
      26 of them: its recital (52) records that, in accordance with Articles 1 and 2 of Protocol (No
      22), 'Denmark is not taking part in the adoption of this Directive and is not bound by it or
      subject to its application'. It is not, however, unglossed at EU level, and the gloss must not
      be read past. Recital (17) of the same Directive states that in the context of child
      pornography the term allows Member States to provide a defence in respect of conduct relating
      to pornographic material having for example 'a medical, scientific or similar purpose'; that
      it also allows 'activities carried out under domestic legal powers', the example given being
      'the legitimate possession of child pornography by the authorities in order to conduct
      criminal proceedings or to prevent, detect or investigate crime'; and that it 'does not
      exclude legal defences or similar relevant principles that relieve a person of responsibility
      under specific circumstances', the example given being 'where telephone or Internet hotlines
      carry out activities to report those cases'. Recital 13 of Regulation (EU) 2026/1744 points
      the reader at this same phrase in this same article, and it carries only the middle one of
      those three categories forward - restating it for generation and manipulation rather than
      possession, and adding red-teaming and evaluation. It does not narrow or replace the other
      two. An adjudicator who takes recital 13's list for the whole of the EU-level material
      therefore drops the medical, scientific or similar purpose category and the hotline-reporting
      category, which are the two most likely to describe a repository this rule's own patterns
      reach, and reports point (bb) as broader than it was enacted. None of this displaces the
      national-law question and a recital creates no defence: what the phrase covers in the Member
      State concerned is answered by that Member State's transposition and by counsel, not here. Two
      further Member State discretions sit in the same Directive and are recorded so that they are
      not mistaken for either thing: Art. 5(7) leaves each Member State to decide whether Art. 5
      applies at all to Art. 2(c)(iii) material where the person appearing to be a child was in fact
      18 years of age or older at the time of depiction, and Art. 5(8) leaves each Member State to
      decide whether Art. 5(2) and (6) apply to Art. 2(c)(iv) material produced and possessed by its
      producer solely for private use on the conditions stated there. Neither is a without right
      defence and neither narrows point (bb) directly, because point (bb) imports Art. 2's
      definitions and not Art. 5's offences or discretions; they are here only as further evidence
      that the national picture behind the carve-out really does differ from one Member State to the
      next. Reference only: this supplies definitions the AI Act imports; entry 1 carries the
      obligation."
    url: https://publications.europa.eu/resource/celex/32011L0093
    checked_at: 2026-08-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 99(3): 'Non-compliance with the prohibition of
      the AI practices referred to in Article 5 shall be subject to administrative fines of up to
      EUR 35 000 000 or, if the offender is an undertaking, up to 7 % of its total worldwide annual
      turnover for the preceding financial year, whichever is higher.' Art. 99(6) reverses that
      comparison for SMEs including start-ups: 'each fine referred to in this Article shall be up to
      the percentages or amount referred to in paragraphs 3, 4 and 5, whichever thereof is lower'.
      Regulation (EU) 2026/1744 (CELEX 32026R1744) did not amend either paragraph; its new Art.
      99(6a) gives small mid-cap enterprises a comparable cap for 'paragraphs 4 and 5' only, so an
      SMC gets no relief on an Art. 5 breach while an SME does. Do not confuse Art. 99(3) with Art.
      100(2), whose opening words are nearly identical and whose EUR 1 500 000 figure applies only
      to Union institutions, bodies, offices and agencies. Reference only: this establishes the
      consequence, not the obligation the detector tests."
    url: https://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 3(3), Art. 3(4), Art. 2(1), Art. 2(10) and Art.
      2(12). A provider is a body that 'develops an AI system or a general-purpose AI model or that
      has an AI system or a general-purpose AI model developed and places it on the market or puts
      the AI system into service under its own name or trademark, whether for payment or free of
      charge'; a deployer is a body 'using an AI system under its authority except where the AI
      system is used in the course of a personal non-professional activity'. Art. 2(10): 'This
      Regulation does not apply to obligations of deployers who are natural persons using AI systems
      in the course of a purely personal non-professional activity.' Art. 2(12): 'This Regulation
      does not apply to AI systems released under free and open-source licences, unless they are
      placed on the market or put into service as high-risk AI systems or as an AI system that falls
      under Article 5 or 50.' The carve-back names Article 5 without qualification, so it picks up
      points (ba) and (bb) from 2026-12-02 with no further step, and it is framed on placing on the
      market and putting into service rather than on use - whether it shelters a deployer whose own
      use is the prohibited act is not answered by any text retrieved on 2026-08-06 and is an open
      question for the adjudicator rather than a settled exclusion. Territorially, Art. 2(1) reaches
      providers placing on the market or putting into service in the Union wherever established,
      deployers established or located in the Union, and providers and deployers in a third country
      'where the output produced by the AI system is used in the Union'. Reference only: these
      narrow who the rule can reach, they do not establish the obligation."
    url: https://publications.europa.eu/resource/celex/32024R1689
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Commission Guidelines on prohibited artificial intelligence practices established by
      Regulation (EU) 2024/1689 (AI Act), C(2025) 5052 final, 29.7.2025. These Guidelines do not
      address Art. 5(1) points (ba) or (bb), Art. 5(1a) or Art. 5(1b) at all: searched over the full
      extracted text on 2026-08-06, nudification 0 occurrences, non-consensual 0, (ba) 0, (bb) 0,
      5(1a) 0. They predate the amending act by a year. There is therefore no Commission
      interpretation of reasonable and adequate technical safety measures and other safeguards, of
      reasonably foreseeable and reproducible outcome, or of significant technical modification, and
      the only official gloss on any of those phrases is recital 12 quoted above. What the
      Guidelines do supply, and what carries over unchanged because the underlying provisions were
      not amended, is the reading of the scope exclusions: para. 34 treats any regular economic
      benefit and any professional, business, trade, occupational or freelance use as professional
      and states that criminal activities cannot be considered purely personal activities, even if
      no economic benefit is sought or attained; para. 35 confines the Art. 2(10) exclusion to
      deployer obligations, leaving providers, other professional deployers, importers and
      distributors in scope; para. 36 records that providers of AI systems cannot benefit from the
      Art. 2(12) free-and-open-source exclusion if the AI system they place on the market or put
      into service constitutes a prohibited practice under Article 5. Separately, the Guidelines
      touch AI-generated child sexual abuse material in two places rather than one, and both were
      re-read in the extracted text on 2026-08-07. Para. 116 gives AI systems used for the
      generation of such material, and for manipulating existing material depicting real children to
      create further novel content featuring them, as an illustration of significant harm under Art.
      5(1)(b) - a different prohibition with a different test. Para. 145, in the passage on the
      interplay with other Union law, attributes to the prohibitions in Art. 5(1)(a) AND (b)
      together the aim of preventing the generation and dissemination of 'illegal content', and its
      list of that content names sexually explicit deepfakes alongside terrorist content, child
      sexual abuse material and hate speech; the same paragraph records that, as internal market
      legislation, those prohibitions cover not only the use but also the placing on the market of
      the AI system. Sexually explicit deepfakes are nearer to the subject matter of point (ba) than
      anything in para. 116, so a reader sent only to para. 116 is sent to the less relevant of the
      two. Neither paragraph interprets points (ba) or (bb), neither is authority for the new test,
      and both predate it. Reference only, and a null result is not evidence that no guidance is
      coming: this row should be re-checked before 2026-12-02, and again if the reported recast of
      Directive 2011/93/EU is adopted, because point (bb) imports that Directive by article and
      point number."
    url: https://ai-act-service-desk.ec.europa.eu/sites/default/files/2025-08/guidelines_on_prohibited_artificial_intelligence_practices_established_by_regulation_eu_20241689_ai_act_english_ied3r5nwo50xggpcfmwckm3nuc_112367-1.PDF
    checked_at: 2026-08-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 3(12) and Art. 3(13) - the two defined terms the
      enacted test in entry 1 turns on. Limb (i) of Art. 5(1a)(a) asks whether the generation or
      manipulation is the INTENDED PURPOSE of the AI system, and Art. 3(12) defines that term as
      'the use for which an AI system is intended by the provider, including the specific context
      and conditions of use, as specified in the information supplied by the provider in the
      instructions for use, promotional or sales materials and statements, as well as in the
      technical documentation'. Every source the definition names is a document the provider writes,
      and it names no property of the system, which is why limb (i) is answered from declared
      documents and never from what the code can do. The second element of limb (ii) requires
      safeguards taking into account REASONABLY FORESEEABLE MISUSE, and Art. 3(13) defines that term
      as 'the use of an AI system in a way that is not in accordance with its intended purpose, but
      which may result from reasonably foreseeable human behaviour or interaction with other
      systems, including other AI systems'. Two things follow, and both hold limb (ii) to what was
      enacted. First, the term is anchored to the intended purpose, so the misuse a provider must
      take into account is use departing from the Art. 3(12) purpose - use inside that purpose is
      not misuse at all, it is limb (i) - and the provider's answer on limb (ii) is therefore tied
      back to the same documentation that answers limb (i). Second, the misuse must be one that may
      result from reasonably foreseeable human behaviour or from interaction with other systems, so
      an arbitrary hypothetical use is outside the term. An adjudicator who reads reasonably
      foreseeable misuse at large reads limb (ii) as reaching further than the words do, which is
      the same shape as reading point (bb) without recital (17). One boundary on this entry: the
      FIRST element of limb (ii) asks whether the generation or manipulation is a reasonably
      foreseeable and reproducible outcome, which is a statement about the outcome and not the
      defined term about the use, so Art. 3(13) must not be imported into it. Neither definition was
      touched by Regulation (EU) 2026/1744: its Art. 1(4) amends Art. 3 at point (14) and inserts
      points (14a) and (14b) and does nothing else, read first-hand on 2026-08-07. Reference only:
      these define two terms entry 1 quotes; entry 1 carries the obligation."

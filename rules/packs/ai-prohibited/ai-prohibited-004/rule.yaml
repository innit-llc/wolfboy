context_questions:
  - "Read the matched line before anything else and say what it actually is. The classes below are
    counted rather than imagined: over the 31 pinned repositories this rule was built against -
    236,434 files after its own path_without - it raises 19 candidates on 67 matched lines, and this
    is what those 19 are. Read the share before the label, because the share decides where your
    reading goes. (f) AN ORDINARY IMAGE-GENERATION CALL SITE, 12 of the 19 candidates and 53 of the
    67 lines, in 4 of the 31 repositories: a negative_prompt or neg_prompt parameter on a Bedrock,
    Vertex, HuggingFace, ModelsLab, Runware or Stability action, or on a self-hosted AUTOMATIC1111
    or ComfyUI router, with no person-image path and no adult vocabulary anywhere in the file. THIS
    IS NOT A DISMISSAL, AND IT IS NOT A FINDING EITHER. It establishes capability - the first
    element of Art. 5(1a)(a)(ii), design, training, architecture, capabilities or user-facing
    functionalities - and nothing else, and capability alone never engages this prohibition. Do not
    close it here and do not upgrade it here: record it in those words and carry it to question 2
    and then to the role and purpose questions. (c) AUDIO AND VIDEO MODERATION IN A CONFERENCE, 4 of
    the 19 candidates and 11 of the 67 lines, all in one repository: DISABLE_MODERATION in a meeting
    product governs who may unmute and is not content safety. A dismissal. (e) A LOGGING OR SEARCH
    SETTING, 1 of the 19 candidates and 1 of the 67 lines: safesearch 0 on a web-search tool. A log4
    configuration with threshold OFF is the same class and is removed by match_without before it
    reaches you. Dismiss it, but say which of the two you are holding, because the same control
    sitting on a generation path would not be dismissible. The remaining 2 candidates on that corpus
    are neither a dismissal nor class (f): a build-time feature flag pair for an unfinished feature
    (ENABLE_AGENT_CONTENT_MODERATION = false, on the line after ENABLE_AGENT_CLI_TOOLS = false), and
    a harm threshold genuinely set to BLOCK_NONE - on a text completion endpoint, not an image path.
    Read each as what it is. Three further classes are named below because they are the direction
    error this rule must never make and because they are what a widened pattern would raise first;
    no shipped pattern reaches any of them today, checked string by string on 2026-08-07, so if you
    are looking at one then something has changed, and you should say so and stop. (a) A CONTENT
    CLASSIFIER OR ITS THRESHOLD: nsfw_flag_threshold_porn, is_nsfw, nsfw_likelihood,
    show_nsfw_content, a NudeNet, opennsfw, nsfwjs or Falconsai/nsfw_image_detection model id, a
    SafetyChecker class - these are a safeguard being applied, the opposite direction from this
    rule. (b) A CONTENT-WARNING TAXONOMY: a platform's label enumeration such as Adult Content or
    Nudity in a social or video connector. (d) A MODERATOR PRIVILEGE: can_revoke_moderation and its
    siblings are permissions on a person, and match_without removes them before they reach you. ONE
    LIMIT ON EVERY SHARE ABOVE: those 31 repositories are ordinary open-source applications selected
    for other rows, not the population this rule exists for, so the split says what this rule costs
    an ordinary tree and says nothing about what its output looks like on a tree that does the work
    these two points describe. Quote the line and its surroundings and name which class it is, or
    say that it is none of them."
  - "If the line survives question 1, what does it establish about the SYSTEM, and what does it not?
    Trace outward from the matched location and name the files you read: where the images or frames
    come from (an upload endpoint, a camera, a URL fetch, a dataset path), which call generates or
    edits them, and whether any safety code sits between the two. The vocabulary of an image
    generation or editing stack is images.generate, createImage, text2img, txt2img, img2img, an
    inpaint or edit endpoint, a Stable Diffusion, ComfyUI, AUTOMATIC1111, SDXL, FLUX, DALL-E or
    Midjourney reference, a Replicate, fal, Stability or Bedrock endpoint, a checkpoint or LoRA
    path, and a negative_prompt or guidance parameter. A CivitAI reference is a weak corroborator on
    its own, because that site hosts general-purpose checkpoints as well. Record what the code can
    do; do not record what you think it is for. Every question below is about the second thing, and
    none of it is in the tree."
  - "Is the date of assessment before 2 December 2026, or on or after it? Say which, in the finding,
    before wording anything else. Nothing in the engine conditions this rule's output on the date -
    the effective_date field is declared in the schema and no code reads it - so the two branches
    are held apart by the words the adjudicator writes and by nothing else. AI Act Art. 113, third
    paragraph, point (a), as replaced by Art. 1(40)(a) of Regulation (EU) 2026/1744, defers Art.
    5(1), first subparagraph, points (ba) and (bb) and Art. 5(1a) and (1b) to that date. BEFORE 2
    DECEMBER 2026: these two points do not yet apply, every finding on this rule is preparation for
    a date in the future, and it must be worded that way - do not describe present conduct as caught
    by a prohibition that has not started. ON OR AFTER 2 DECEMBER 2026: the two points are in force,
    the preparation framing is no longer accurate and must not be used, and a finding may speak in
    the present tense about exposure. What does not change on that date is what a matched line
    establishes, which is nothing: the elements are still the role, the intended purpose or the
    deployer's purpose, the adequacy of safeguards and facts about depicted persons, all of them
    answered below and none of them by the code. Report what the code names either way; the date
    decides the tense, not the strength of the claim. The pre-existing Art. 5 prohibitions are
    unaffected and keep 2 February 2025."
  - "Which role does the scanned party hold for this system: provider (it develops the system, or
    has it developed, and places it on the market or puts it into service under its own name or
    trademark, whether for payment or free of charge - Art. 3(3)), deployer (it uses the system
    under its own authority - Art. 3(4)), both, or neither? Art. 5(1a) applies a different test to
    each and there is no test that applies to both, so this must be answered before any other
    question about the test. Answer from packaging, publication, deployment configuration and the
    declared documents, and quote what you relied on."
  - "PROVIDER LIMB (i) - is the generation or manipulation of the material described in points (ba)
    or (bb) the intended purpose of this AI system, as stated in the technical documentation,
    instructions for use, marketing material, terms of service and store listing? Intended purpose
    is a defined term of the AI Act, at Art. 3(12): the use for which an AI system is intended by
    the provider, including the specific context and conditions of use, as specified in the
    information supplied by the provider in the instructions for use, promotional or sales materials
    and statements, as well as in the technical documentation. Every source that definition names is
    a document the provider writes and it names no property of the system, so this is fixed by the
    provider's own documentation and not by what the code can do. Ask the person running the scan or
    read their declared documents. What the code is capable of does not answer this, and a source
    identifier never does."
  - DEPLOYER LIMB - if the scanned party is a deployer, does it use this system for the purpose of
    generating or manipulating that material? Art. 5(1a)(b) prohibits use on that ground and on no
    other. Two consequences, both from recital 12 of Regulation (EU) 2026/1744, and both matter
    here. A deployer that uses the system for other purposes stays outside this prohibition even
    where the provider's safeguards are absent, and accidental generation is not covered. But a
    deployer that uses a well-safeguarded system for the prohibited purpose IS caught, and the
    provider's diligence gives it no shelter. Purpose is a state of the operator; ask them.
  - "PROVIDER LIMB (ii), FIRST ELEMENT - do this system's design, training, architecture,
    capabilities or user-facing functionalities make that generation or manipulation a reasonably
    foreseeable and reproducible outcome, without requiring significant technical modification? The
    outcome must be BOTH foreseeable AND reproducible: a one-off output that cannot be reproduced
    does not meet this element, and neither does one that needs significant technical modification
    to obtain. Read this element on its own words. It asks about the OUTCOME, and the phrase
    reasonably foreseeable and reproducible outcome is not the AI Act's defined term reasonably
    foreseeable misuse (Art. 3(13)), which belongs to the second element and is asked at question 8.
    Do not import that definition here, and do not answer the two elements together: they are joined
    by and, so both have to be established. This is the element the detector's evidence speaks to,
    and it speaks to it only as corroboration. Point to red-team reports, evaluation results, abuse
    reports, model cards or incident records, not to the matched line alone."
  - "PROVIDER LIMB (ii), SECOND ELEMENT - does the system have reasonable and adequate technical
    safety measures and other safeguards that reliably prevent that generation or manipulation,
    taking into account reasonably foreseeable misuse, AND correct observed or reported misuse? The
    two purposes are joined by and: prevention without any route for acting on observed or reported
    misuse does not satisfy this element. Reasonably foreseeable misuse is a defined term of the AI
    Act, at Art. 3(13): the use of an AI system in a way that is not in accordance with its intended
    purpose, but which may result from reasonably foreseeable human behaviour or interaction with
    other systems, including other AI systems. It is anchored to the intended purpose answered at
    question 5, so the misuse to be taken into account here is use that departs from the documented
    purpose AND that may result from reasonably foreseeable human behaviour or from interaction with
    other systems - not any use that can be imagined. Use that stays inside the intended purpose is
    not misuse at all; that is limb (i), and it is a different question. The element is stated in
    the negative, so a provider with such measures defeats limb (ii) entirely however foreseeable
    the misuse is - which is why capability alone never engages this prohibition. Recital 12 lists
    data cleaning, refusal training, safe prompt design and output controls, runtime prompt
    guardrails, content classification and filtering mechanisms, usage restrictions, abuse detection
    mechanisms, and notice and action mechanisms, and treats measures as adequate where they align
    with state-of-the-art measures and demonstrably prevent or sufficiently reduce, in each specific
    case, the likelihood of generating or manipulating such material, taking into account known and
    reasonably foreseeable misuse, including reasonably foreseeable circumvention of the preventive
    measures without significant technical modification. Those closing words are part of the
    standard and they cut both ways: circumvention that is foreseeable without significant technical
    modification has to be weighed rather than ignored, and the standard is met by preventing OR by
    sufficiently reducing the likelihood, so a measure that could be circumvented is not disposed of
    on that ground alone. Code can show that a filter or a refusal path EXISTS; it cannot show that
    it is state-of-the-art, that it demonstrably reduces likelihood here, or that reported misuse is
    actually corrected. Those are evidential questions for the operator. Note also that an
    open-source release strategy is a proportionality factor in what corrective measures are
    reasonable, and is not an exclusion."
  - POINT (ba) - does the material this system generates or manipulates depict identifiable natural
    persons, and for each such person is there consent to that generation or manipulation which is
    freely given, specific, informed, unambiguous and explicit - all five, and consent to THAT
    generation, not to something else? Where does that consent live and how is it demonstrated?
    Whether a depicted person is identifiable, and whether that person consented, are facts about
    people and about records held outside the repository, and no source vocabulary decides either.
    Ask the operator.
  - "POINT (ba), the two boundaries. REALISM: are the depictions realistic in recital 12's sense -
    showing the person's face, voice or body in a credible real-life manner, regardless of how
    realistic the context is - and do they show intimate parts, or sexually explicit activity?
    Cartoonish or physically impossible depictions of a person's body are outside the point. On
    intimate parts, recital 12 says the prohibition should be limited to realistic depictions of
    intimate parts, NOTABLY the genitals, pubic area, anus, exposed buttocks or exposed female
    breasts, nipples or areolae. That word notably is in the recital and it matters: the list
    illustrates what counts rather than closing it, so a depiction is not outside the point merely
    for being outside the list. MANIPULATION: where the system edits pre-existing material, does the
    edit increase the exposure of any depicted intimate parts, or alter the nature of any depicted
    sexually explicit activities? Art. 5(1b) provides that an edit doing neither does not constitute
    manipulation for point (ba), and recital 12 gives changing a background, adding a text heading
    and adjusting contrast or brightness as examples. Also outside: generative applications where
    intimate parts are not exposed, or are exposed with the depicted person's consent - recital 12
    names try-on applications and medical applications such as anatomical simulations and
    mammograms."
  - "POINT (bb) - does the material or performance this system generates or manipulates fall within
    Article 2, point (c) or point (e), of Directive 2011/93/EU? Point (c) reaches generated material
    by more than one route, and the shorter route is the one to check first. Its point (i) covers
    material visually depicting a child engaged in real or simulated sexually explicit conduct, so a
    generated or manipulated depiction of a real, identifiable child is inside the term with no need
    for the later points - which is the route taken by a system that edits an uploaded photograph.
    Its points (iii) and (iv) then extend the term to material where no real child exists at all:
    any person appearing to be a child, and realistic images of a child. Point (e) reaches a live
    exhibition aimed at an audience, including by means of information and communication technology,
    so a real-time stream is within the point even where nothing is stored. This is a criminal-law
    classification turning on appearing to be a child, primarily sexual purposes and realistic.
    Point (bb) imports these Art. 2 definitions by article and point number, so the definitional
    question is the Directive's own; what differs from one Member State to the next is the criminal
    law around it, and the Directive itself is transposed in at most 26 Member States rather than 27
    because Denmark is not bound by it. Either way the classification is answered by counsel and by
    the declared purpose, never by source vocabulary, and this rule deliberately carries no
    age-suggesting vocabulary for that reason."
  - "POINT (bb) ONLY - does a without right defence apply under the national law of the Member State
    concerned? Directive 2011/93/EU gives the phrase no definition in its Art. 2; its Art. 5(1)
    makes it a condition of criminalisation and leaves the content to national law, so there are up
    to 27 answers and none is in the repository. But two EU-level recitals gloss it, and BOTH must
    be put to the operator, because between them they name three categories and only one of the
    three survives into the newer instrument. FROM RECITAL (17) OF DIRECTIVE 2011/93/EU, three: (a)
    MEDICAL, SCIENTIFIC OR SIMILAR PURPOSE - the term allows Member States to provide a defence for
    conduct relating to such material having, for example, a medical, scientific or similar purpose;
    (b) ACTIVITIES UNDER DOMESTIC LEGAL POWERS - the example given is legitimate possession by the
    authorities in order to conduct criminal proceedings or to prevent, detect or investigate crime;
    (c) HOTLINE REPORTING - the term does not exclude legal defences or similar principles relieving
    a person of responsibility in specific circumstances, the example given being where telephone or
    Internet hotlines carry out activities to report those cases. FROM RECITAL 13 OF REGULATION (EU)
    2026/1744, category (b) again in a generative form - authorities generating or manipulating such
    material to conduct criminal proceedings or to prevent, detect or investigate crime - plus
    red-teaming and evaluation activities for the purpose of assessing the system's compliance with
    this prohibition. Ask about all of them, not only the newer list. Branches 2 and 3 of this
    rule's detector fire on moderation, classifier and content-filter identifiers, which is exactly
    the code a CSAM-reporting hotline, a law-enforcement tool or a clinical or research system
    carries, so categories (a) and (c) are live possibilities here rather than remote ones - how
    often is not measured and is not claimed. An adjudicator who considers only recital 13 will
    report the prohibition as broader than it was enacted for precisely those operators. Neither
    recital creates a defence and neither answers the question: name which Member State's law is
    relied on, and if the answer relies on red-teaming, state whether the activity is for assessing
    compliance with this prohibition, because that recital's wording is narrow. Note also that the
    same Directive leaves Member States a discretion at Art. 5(7) over Art. 2(c)(iii) material where
    the person appearing to be a child was in fact 18 or older, and at Art. 5(8) over Art. 2(c)(iv)
    material held solely for private use. Those are discretions on the criminal offence, not without
    right defences, and they do not answer this question - they are one more reason to ask which
    Member State's law applies rather than to assume the position is uniform. There is no equivalent
    defence for point (ba)."
  - "Do the scope provisions take the scanned party outside the Regulation? Three to check, none of
    which is decided by the code. TERRITORY: Art. 2(1) reaches providers placing on the market or
    putting into service in the Union wherever they are established, deployers established or
    located in the Union, and third-country providers and deployers where the output produced by the
    system is used in the Union. PERSONAL NON-PROFESSIONAL USE: Art. 2(10), read with Art. 3(4),
    disapplies deployer obligations for a natural person acting purely personally and
    non-professionally. Commission Guidelines C(2025) 5052 final para. 34 treats any regular
    economic benefit and any professional, business, trade, occupational or freelance activity as
    professional and states that criminal activities cannot be considered purely personal even where
    no economic benefit is sought; para. 35 confines the exclusion to deployer obligations and
    leaves the provider side untouched. Because the deployer limb of these two points turns on an
    individual's purpose, this route matters far more here than it does for the older Art. 5
    prohibitions, and it should be put to the adjudicating agent rather than assumed in either
    direction. FREE AND OPEN-SOURCE RELEASE: Art. 2(12) excludes systems released under free and
    open-source licences unless they are placed on the market or put into service as a system
    falling under Article 5, so it gives a provider no shelter here (Guidelines para. 36); whether
    it shelters a deployer whose own use is the prohibited act is not settled by any text or
    guidance retrieved as at 2026-08-06, and should be recorded as an open question rather than
    answered."
evidence_template: "{file}:{line} matched one of three shapes this rule looks for against AI Act
  Art. 5(1) points (ba) and (bb), which apply from 2026-12-02 - an identifier stating a nudification
  purpose, a safety control being switched off, or an image-generation or person-image path. Which
  of the three it is has to be read off the line, and it may be none of them. Three look-alikes have
  been read on real matched lines: the disable-flag vocabulary also reaches a safeguard of the
  opposite polarity, where a no_nsfw column defaulting to true excludes adult media rather than
  switching a filter off; the inpainting mask vocabulary also reaches unrelated masking options,
  such as a mask_url_credentials setting in error-tracking code, and reaches them inside a
  documentation code sample as readily as in a running path; and a safesearch control set to 0 on a
  web-search tool satisfies the second shape literally, on a surface these two points do not reach.
  Context question 1 names the classes with their measured shares and says what to do with each.
  This records what the code names, not what the operator does: the prohibition turns on role,
  purpose, the adequacy of safeguards and facts about depicted persons, none of which is in this
  repository"
remediation_template: >
  Check today's date before reading further, because it decides how this finding reads. AI Act

  Art. 5(1), first subparagraph, points (ba) and (bb), and Art. 5(1a) and (1b), were inserted by

  Art. 1(7) of Regulation (EU) 2026/1744 and apply from 2 December 2026 under Art. 113, third

  paragraph, point (a).

  BEFORE 2 DECEMBER 2026 this is preparation for a prohibition that has not started, not a finding

  about present conduct, and there is time to answer the questions below on paper.

  ON OR AFTER 2 DECEMBER 2026 the two points are in force and the preparation wording no longer

  describes the position: the same questions decide whether the prohibition is engaged, but they are

  no longer being answered ahead of time, and the Art. 99(3) tier attaches to a breach - up to

  EUR 35 000 000 or 7 % of total worldwide annual turnover, whichever is higher, and for an SME or

  start-up Art. 99(6) reverses that to whichever is lower.

  What the date does not change is what this rule reports. A matched line names a surface; it

  establishes none of the elements, on either side of 2 December 2026.

  Read the matched line first. On the 31 repositories this rule was built against it raises 19

  candidates, and 12 of the 19 are an ordinary image-generation call site - a negative_prompt

  parameter on a hosted or a self-hosted image API. That is a capability rather than the subject

  matter, and it is not closed at this step: it goes on to the four facts below. Five further

  look-alikes are named in the rule and none of them is the subject matter - a content classifier or

  its threshold, a platform content-warning label, a conference audio and video moderation feature,

  a moderator role privilege, or a logging or web-search setting. If the line is one of those five,

  record which and close it. One qualification, which context question 1 states in the same terms: a

  safety control switched off is the fifth class only where it sits on a logging or a search path,
  so

  name the path you are relying on, because the same control on a generation path is not closed
  here.

  Otherwise, and that includes every image-generation call site, write down four facts next to the

  code. Which of them decides the answer depends on the role, because the two limbs of the test draw

  on different ones. (1) WHICH ROLE this

  organisation holds for the system: provider, if it develops or commissions the system and places

  it on the market or puts it into service under its own name; deployer, if it uses the system under

  its own authority; or both. The test is different for each and there is no test that applies to

  both. (2) WHAT THE STATED PURPOSE IS, in the technical documentation, instructions for use,

  marketing, terms of service and store listing - not what the code can do. For a provider this is

  the FIRST limb and it is sufficient on its own: where that generation is the intended purpose of

  the system, nothing else has to be established. For a deployer it is the whole test. (3) WHAT THE

  SAFEGUARDS ARE and whether they both prevent and correct. This is the provider's SECOND limb, and

  it applies only where the first does not: it is engaged where the outcome is reasonably
  foreseeable

  AND reproducible without significant technical modification AND the system lacks reasonable and

  adequate measures that reliably prevent it and correct observed or reported misuse. A system whose

  measures do both sits outside that second limb however foreseeable the misuse is. (4) WHERE THE

  IMAGES COME FROM and whether depicted persons are identifiable and have consented to that specific

  generation - a fact about people and records, not about code.

  Settle the purpose first, because none of the engineering changes further down reaches it. If fact

  (2) shows that generating or manipulating that material is the intended purpose of the system, a

  provider is inside the first limb however good its safeguards are; and if this organisation, as a

  deployer, uses a system for the purpose of that generation, it is inside the deployer limb whoever

  built the safeguards. No filter, toggle or reporting route changes either answer. What does: for

  point (ba) material, a generation is outside the point where the identifiable person depicted has

  given freely given, specific, informed, unambiguous and explicit consent to that specific
  generation,

  collected and stored as described below; for point (bb) material no consent takes it out, and the

  one exception the point names, a without-right defence under national law, is a question for

  counsel, not for code. Otherwise the change is to the purpose itself: stop offering or using the

  system for that generation, take out the feature that offers it, and take the statements of that

  purpose out of the interface copy, instructions for use, technical documentation, marketing, terms

  of service and store listing, so that what the product does and what it says it is for agree. The

  capability can stay (see the last paragraph); the purpose cannot. Once that generation is not the

  purpose, the provider's second limb still applies, and the changes below are what answer it.

  Engineering changes that move a system away from this subject matter, cheapest first. Keep the

  safety path in the code rather than in configuration, so that a filter cannot be switched off by a

  deployment variable or an admin toggle with no trace in the repository. Where a switch must be

  exposed, default it on and record why it can be turned off. Add a route for acting on observed or

  reported misuse - reporting, takedown, key revocation - because prevention alone does not satisfy

  the second element. Where the system takes an uploaded photograph of a person into a generative

  edit, decide whether it needs to, and if it does, collect and store demonstrable consent from the

  depicted person for that generation, which is what recital 12 expects of a system intended for

  such generation. Where a checkpoint, LoRA or hosted endpoint is named for adult output, record

  what it is there for.

  Two things that do not change the answer. Releasing under a free and open-source licence does not

  take an Art. 5 practice out of the Regulation on the provider side (Art. 2(12), Commission

  Guidelines C(2025) 5052 final para. 36). And removing the capability is not required: recital 12

  states that this prohibition should not prevent providers from developing the technical

  capabilities of AI systems to generate or manipulate images, videos, audio or similar material.

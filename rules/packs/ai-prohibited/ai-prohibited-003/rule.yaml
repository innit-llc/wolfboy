id: ai-prohibited-003
pack: ai-prohibited
short_name: Race or belief labels that may come from biometric data
problem_line:
  text: Sensitive traits deduced from a person's biometric data
fix_line: Remove race, political, religious, union, sex-life and orientation labels from per-person
  output and stored values.
title: Protected-characteristic label named, screened against AI Act Art. 5(1)(g) - biometric input
  needs review
jurisdiction:
  - EU
legal_basis:
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 5(1)(g) - addressed to providers (Art. 3(3)) AND
      deployers (Art. 3(4)) alike, unlike the Art. 50 transparency duties which split the two: the
      provision prohibits 'the placing on the market, the putting into service for this specific
      purpose, or the use of biometric categorisation systems that categorise individually natural
      persons based on their biometric data to deduce or infer their race, political opinions, trade
      union membership, religious or philosophical beliefs, sex life or sexual orientation; this
      prohibition does not cover any labelling or filtering of lawfully acquired biometric datasets,
      such as images, based on biometric data or categorizing of biometric data in the area of law
      enforcement'. Quoted from the Official Journal text (CELEX 32024R1689), retrieved 2026-07-27
      from the Publications Office cellar; earlier drafts of this rule reproduced the Guidelines'
      rendering, which prints 'sex-life' and 'categorising'. The list of six characteristics is
      closed: age, gender, skin, eye or hair colour are not on it. Art. 5 sits in Chapter II, which
      has applied since 2025-02-02 (Art. 113, second subparagraph, point (a))."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "Commission Guidelines on prohibited artificial intelligence practices established by
      Regulation (EU) 2024/1689 (AI Act), C(2025) 5052 final, 29.7.2025 - para. 273 (five cumulative
      conditions: a placing on the market, putting into service for this specific purpose or use; a
      biometric categorisation system; individual categorisation of persons; based on their
      biometric data; to deduce or infer one of the six listed characteristics); para. 274 ('the
      prohibition, therefore, applies to both providers and deployers of AI systems, each within
      their respective responsibilities'); para. 277 (Art. 3(40) definition, and its cumulative
      'ancillary to another commercial service AND strictly necessary for objective technical
      reasons' exclusion); para. 280 (AR try-on filters and social-network face filters given as
      permitted ancillary features; inferring assumed political orientation or assumed sexual
      orientation from uploaded photos given as prohibited); para. 282 (persons must be categorised
      'individually'; where a whole group is categorised without looking at the individual the
      prohibition does not apply); para. 283 (the six characteristics are exhaustive - a system
      categorising persons by skin or eye colour, or analysing DNA of crime victims for origin,
      'would not be prohibited'); paras 284-286 (both carve-outs: labelling or filtering of lawfully
      acquired biometric datasets, including de-biasing of training data and medical sorting by skin
      or eye colour, and labelling or filtering in the area of law enforcement); para. 251
      (biometric data covers facial images, gait, keystrokes, voice; emotion or attribute inference
      from written text is not based on biometric data)."
    url: https://ai-act-service-desk.ec.europa.eu/sites/default/files/2025-08/guidelines_on_prohibited_artificial_intelligence_practices_established_by_regulation_eu_20241689_ai_act_english_ied3r5nwo50xggpcfmwckm3nuc_112367-1.PDF
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: EU AI Act (Regulation (EU) 2024/1689), Art. 3(4), Art. 2(10) and Art. 2(12) - Art. 3(4)
      defines a deployer as a person or body 'using an AI system under its authority except where
      the AI system is used in the course of a personal non-professional activity', and Art. 2(10)
      provides that 'this Regulation does not apply to obligations of deployers who are natural
      persons using AI systems in the course of a purely personal non-professional activity'. Per
      Commission Guidelines C(2025) 5052 final paras 34-35, that exclusion removes only the
      deployer-side obligations; the provider placing the system on the market stays in scope, and
      any regular economic benefit or professional, business, trade, occupational or freelance use
      defeats it. Art. 2(12) provides that the Regulation 'does not apply to AI systems released
      under free and open-source licences, unless they are placed on the market or put into service
      as high-risk AI systems or as an AI system that falls under Article 5 or 50' - Art. 5 is
      carved back in expressly (Guidelines para. 36), so an open-source licence is no answer to this
      rule.
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-2
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "EU AI Act (Regulation (EU) 2024/1689), Art. 99(3): 'Non-compliance with the prohibition of
      the AI practices referred to in Article 5 shall be subject to administrative fines of up to
      EUR 35 000 000 or, if the offender is an undertaking, up to 7 % of its total worldwide annual
      turnover for the preceding financial year, whichever is higher.' Art. 99(6) inverts that
      comparison for this product's audience: 'In the case of SMEs, including start-ups, each fine
      referred to in this Article shall be up to the percentages or amount referred to in paragraphs
      3, 4 and 5, whichever thereof is lower.' Chapter XII, which contains Art. 99, has applied
      since 2025-08-02 (Art. 113, second subparagraph, point (b))."
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-99
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2025-02-02
sunset: null
superseded_by: null
severity: high
rule_confidence: 0.5

context_questions:
  - "Is the input genuinely biometric data as defined in AI Act Art. 3(34) - personal data resulting
    from specific technical processing of a physical, physiological or behavioural characteristic,
    such as a facial image, a face template or descriptor, gait, keystroke dynamics or voice
    characteristics - or is it an ordinary image, text or tabular feature that only resembles it?
    Quote the line where the feature vector is built and say what it is derived from. Commission
    Guidelines C(2025) 5052 final para. 251 places inference from written text outside this concept,
    and para. 277 places categorisation by clothes or accessories and by social-media activity
    outside it too. This question is the one the detector no longer pre-answers, so answer it
    explicitly. Look for any of: face-api.js or @vladmandic/face-api; @mediapipe/face_detection,
    face_mesh or tasks-vision, FaceLandmarker, FaceDetector, BlazeFace; AWS Rekognition
    (DetectFaces, IndexFaces, SearchFacesByImage); Azure AI Face (@azure-rest/ai-vision-face,
    FaceClient, returnFaceAttributes, /face/v1.0/detect, PersonGroupPerson); Google Cloud Vision
    FACE_DETECTION or faceAnnotations; DeepFace, InsightFace, face_recognition, FaceNet, ArcFace,
    RetinaFace, MTCNN, dlib, SCRFD, YuNet, OpenCV cascade classifiers; MorphCast or Affectiva; an
    in-house face descriptor, embedding, template, crop or alignment step; voice biometrics (speaker
    embedding, verification, identification or diarisation, voiceprints, resemblyzer, pyannote,
    SpeechBrain, ECAPA-TDNN); gait or keystroke dynamics. AND, because Art. 5(1)(g) binds deployers
    too and a deployer names none of the above: a plain HTTP call to a hosted face or voice analysis
    service, where the biometric processing happens on the other side of the wire and only the
    payload is visible here. In that case the evidence is the request (an image, a frame, a crop, an
    audio buffer of a person) and the response (a per-person attribute set). Say which of these you
    found, quote it, and if you found none, say that the biometric limb is unproven and stop."
  - "Is the label actually one of the six characteristics Art. 5(1)(g) lists - race, political
    opinions, trade union membership, religious or philosophical beliefs, sex life, sexual
    orientation? The list is closed. Age and gender estimation from a face is NOT on it, and
    Guidelines para. 283 records that categorising persons by skin or eye colour, or analysing DNA
    of crime victims for origin, falls outside the prohibition. Quote the label set, enum, output
    field or instruction text and map each value to the statutory list; where nothing maps, record
    that and stop - the remaining questions do not arise, though Art. 50(3) and, in workplace or
    education settings, Art. 5(1)(f) may still be worth checking. A model or dataset name is NOT an
    answer to this question: FairFace, UTKFace and names like them are purpose-blind. FairFace is a
    face-attribute model family whose published label set is race, gender and age, but it is also
    used as a general backbone chosen for accuracy on under-represented faces in a pipeline whose
    only outputs are gender, age and expression (verified in a real codebase), and it is
    redistributed on Hugging Face in age-only variants such as dima806/fairface_age_image_detection
    (verified in a second one). The detector raises these deliberately and does not try to tell them
    apart. Read what the code actually does with the model output - the fields it stores, renders or
    branches on - and decide from that, not from the model id."
  - Does the pipeline attach a category to an individual natural person, or does it only produce
    aggregate counts with no per-person label? Art. 5(1)(g) requires that persons be categorised
    'individually', and Guidelines para. 282 records that where a whole group is categorised without
    looking at the individual the prohibition does not apply. Quote the code that writes the label
    onto a person, a session, an account or a single-subject image, or the code that shows the
    output is aggregate only.
  - "Is the protected-category value deduced from the biometric input, or supplied by the person
    themselves? A self-declared profile field, a survey answer, an onboarding selection or an
    imported CRM attribute is not a biometric inference and is outside this rule, however sensitive
    it is. Trace the write path back to its source and quote it: if the value arrives from a form, a
    request body or a third-party record rather than from a model run on the face or voice input,
    record that and stop."
  - "Carve-out 1, read narrowly: is this the labelling or filtering of a biometric dataset acquired
    in line with Union or national law - for example labelling a training set so that demographic
    groups are equally represented, or de-biasing work of the kind Guidelines paras 284-285
    describe? The carve-out covers labelling and filtering of the dataset; it does not cover
    deducing a protected characteristic about a person in production. Quote the dataset's provenance
    and identify who consumes the labels - a training or evaluation job, or a live user-facing
    decision."
  - "Carve-out 2, read narrowly: is the categorisation of biometric data carried out in the area of
    law enforcement, in the sense of Guidelines para. 286 (a competent authority's work such as
    victim or suspect identification in a lawfully held dataset)? Identify the deploying entity from
    the repository, not from aspiration: a commercial product that markets itself to police forces
    is not itself a law enforcement authority, and this carve-out does not reach ordinary security,
    fraud or moderation features."
  - "Does the Art. 3(40) ancillary-feature exclusion apply? It removes a feature from the definition
    of a biometric categorisation system only where BOTH conditions hold cumulatively: the feature
    is ancillary to another commercial service AND strictly necessary for objective technical
    reasons. Guidelines para. 280 treats an online-marketplace try-on filter and a social-network
    face filter as ancillary, but treats inferring assumed political orientation or assumed sexual
    orientation from uploaded photos to target advertising as failing the strict-necessity limb.
    Quote the feature's relationship to the principal service."
  - "Which acts happen in this repository - placing the system on the market, putting it into
    service for this purpose, or using it? Art. 5 binds providers (Art. 3(3)) and deployers (Art.
    3(4)) alike, each within their own responsibilities (Guidelines para. 274), so unlike the Art.
    50 rules there is no role that escapes the provision; the answer determines which act to
    describe, not whether the provision reaches this party. Note also Art. 2(12): releasing the
    system under a free and open-source licence does not take it outside Art. 5 (Guidelines para.
    36). Quote the entry point, the published artifact or the deployment path."
  - "Does the Art. 3(4) and Art. 2(10) personal non-professional use exclusion apply on the deployer
    side - is this a hobby repository run by a natural person with no regular economic benefit and
    no professional, business, trade, occupational or freelance use? Guidelines paras 34-35 read the
    exclusion narrowly and confine it to deployer obligations: the provider that places the system
    on the market stays in scope regardless. Quote the evidence of how the project is distributed or
    monetised, and where the evidence points to hobby use, say so plainly rather than reporting a
    deployer-side candidate."
evidence_template: "{file}:{line} matched a spelling from this rule's protected-characteristic
  vocabulary, in one of six positions - a classifier label, a model id, a requested attribute, a
  per-person result field, a payload type or a model instruction. What the detector established is
  that a listed spelling occurs at this location, and these spellings are ordinary English words
  whose unrelated senses the position test does not separate. Four homonym classes have been read on
  real matched lines: a vendor, product or protocol name built on the word, where a GPS-tracker
  maker's class ThinkRaceProtocol or class RaceDynamicsProtocol reads as a declared payload type;
  the concurrency sense, on a line that does not carry the bigram race condition this rule
  suppresses; the motorsport sense, a sentence about a race car; and documentation prose - a
  glossary defining personal data by example, an editorial or newsletter sentence - where the word
  is the writer's example rather than a label this code assigns to anyone. Read the matched line
  first and say which of the six positions the characteristic is in, or that no characteristic is
  being assigned on this line at all. Where one is, check whether the value is deduced from
  biometric input or supplied by the person"
remediation_template: |
  This is a candidate for review against the AI Act Art. 5(1)(g) prohibition on biometric
  categorisation, not a determination about this code. Art. 5 binds providers and deployers alike,
  and it has applied since 2025-02-02, with the Art. 99(3) tier attached (up to EUR 35 000 000 or
  7% of worldwide annual turnover, whichever is higher) since 2025-08-02. For an SME or start-up
  Art. 99(6) reverses that comparison to whichever is lower.
  Establish two facts first, because most hits fail on one of them:
  1. Is the input biometric data within Art. 3(34) - a facial image, face template or descriptor,
     gait, keystroke dynamics or voice characteristics - rather than an ordinary feature?
  2. Is the protected characteristic being deduced from that input, rather than declared by the
     person? A user-supplied religion or orientation field is outside this provision entirely,
     however sensitive it is; where the value comes from a form, move on.
  If both hold, the engineering question is whether the label set can be narrowed. Art. 5(1)(g)
  lists six characteristics and no others: age and gender estimation from a face, and sorting by
  skin, eye or hair colour, sit outside it. Dropping the race, religion, political, trade-union,
  sex life and sexual-orientation classes from the label set, the model head, the requested
  attribute list or the model instruction, and deleting any stored per-person values already
  derived from them, removes this rule's subject matter. Where the label set exists for dataset
  de-biasing or for labelling or filtering a lawfully acquired dataset, keep that work inside the
  training or evaluation path and out of live per-person decisions, and record the dataset's
  provenance next to the code so the distinction is legible to a reviewer.
  Where the pipeline instead produces emotion or affect output with no protected-category label,
  the applicable obligations are Art. 50(3) deployer notice and, in workplace or education
  settings, Art. 5(1)(f) - different provisions with their own rules, not this one.

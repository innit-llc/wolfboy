id: presence-001
pack: presence
short_name: Online status broadcast to others and stored
problem_line:
  text: Online status broadcast to others or stored offline
fix_line: By default publish only needed status detail; on legitimate interests let people stop;
  delete offline status in time.
title: Live availability and behavioural state broadcast to a subscriber graph, and stored offline
jurisdiction:
  - EU
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 6(1)(f) - processing is lawful to the extent that
      'processing is necessary for the purposes of the legitimate interests pursued by the
      controller or by a third party, except where such interests are overridden by the interests or
      fundamental rights and freedoms of the data subject which require protection of personal data,
      in particular where the data subject is a child.' This is the provision the construct turns
      on, and the word that does the work is 'necessary'. Making a person reachable is a real
      interest; whether it needs a continuously published idle timer, a last-activity stamp and a
      typing indicator, rather than a plain reachable-or-not signal, is the balancing a finding here
      should actually be about
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be 'adequate, relevant
      and limited to what is necessary in relation to the purposes for which they are processed'.
      Minimisation applies to the GRANULARITY of a presence signal, which is where it is usually
      decided without anyone noticing a decision was made: available-or-not, available with a status
      word, available with an idle duration, and available with a last-activity timestamp are four
      different disclosures serving the same stated purpose"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e) - personal data shall be 'kept in a form which
      permits identification of data subjects for no longer than is necessary for the purposes for
      which the personal data are processed'. Carried as an operative provision, not a reference,
      and specifically for the offline half of the construct: an offline-presence row and a
      last-activity stamp are stored state about a person who is not connected, so they are retained
      personal data rather than a transient signal, and two questions follow that ordinarily have no
      answer anywhere in the product: for how long, and deleted by what"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 25(2) - 'The controller shall implement appropriate
      technical and organisational measures for ensuring that, by default, only personal data which
      are necessary for each specific purpose of the processing are processed. That obligation
      applies to the amount of personal data collected, the extent of their processing, the period
      of their storage and their accessibility. In particular, such measures shall ensure that by
      default personal data are not made accessible without the individual's intervention to an
      indefinite number of natural persons.' The last sentence is the one to read twice against this
      construct: presence is accessible by default to everyone in the subscriber graph, and the
      control that limits it is something the person has to go and find"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 21(1) - 'The data subject shall have the right to
      object, on grounds relating to his or her particular situation, at any time to processing of
      personal data concerning him or her which is based on point (e) or (f) of Article 6(1),
      including profiling based on those provisions.' Reference only: this detector establishes
      nothing about what a deployment does when somebody objects. It is carried because the
      construct is ordinarily run on legitimate interests, and an objection right comes with that
      basis - which in practice means the product needs a way for a person to stop publishing their
      state without leaving the service"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.35

    - (?&broadcast_verb)[^\n]{0,60}(?&subscriber_graph)|(?&subscriber_graph)[^\n]{0,60}(?&broadcast_verb)
    - (?&visibility_control)
context_questions:
  - "WHAT EXACTLY IS PUBLISHED, AND AT WHAT GRANULARITY? List the fields that leave the person: a
    reachable-or-not flag, a status word, a free-text status message, an idle duration, a
    last-activity timestamp, a typing indicator, a device or client name. Each step up that list is
    a larger disclosure serving the same stated purpose, and the granularity is where Art. 5(1)(c)
    is decided. Quote the payload shape rather than the feature name."
  - WHO RECEIVES IT IN THIS DEPLOYMENT? The code shows the broadcast; who is on the receiving end is
    a runtime fact read from the roster, the channel authorisation or the room membership. Establish
    whether the graph is mutual (both sides agreed), one-sided (anyone may subscribe), or open
    (everyone in an installation sees everyone), because those are three different answers to Art.
    25(2)'s last sentence about accessibility to an indefinite number of people without the
    individual's intervention.
  - WHAT IS THE DEFAULT, AND WHERE IS THE CONTROL? Two halves of one question. Find the shipped
    default for presence visibility, and find the control that changes it - a privacy list, an
    invisible mode, a hide-last-seen switch. Then say how a person would discover the control,
    because a control that exists and is unreachable is the situation Art. 25(2) describes rather
    than the answer to it.
  - WHAT HAPPENS TO THE STATE WHEN THE PERSON DISCONNECTS? This is the half most often missed. Check
    for an offline-presence row, a last-activity stamp, or a cached last-known state, and then find
    what deletes it and when. A stored last-activity timestamp for an account that has not connected
    in a year is retained personal data with no active purpose, which is Art. 5(1)(e), and the
    deletion path is frequently only the account-deletion path.
  - CAN A PERSON USE THE SERVICE WITHOUT PUBLISHING STATE AT ALL? Where the processing runs on
    legitimate interests, Art. 21(1) gives a right to object on grounds relating to the person's
    particular situation. In practice that means there has to be a way to stop publishing without
    leaving the service. Record whether one exists, and whether using it degrades anything the
    person needs - if the only way to be invisible is to be unreachable, say so.
evidence_template: "{file}:{line} matched one of seven shapes: presence machinery, a presence or
  roster store, a framework presence or awareness call, a compound behavioural-state field, a bare
  state word beside a presence or subscriber noun, a broadcast verb beside a subscriber graph, or a
  visibility control. This establishes only that THE CODE HAS A CONSTRUCT for publishing a person's
  live availability and behavioural state to subscribers, and in some cases for storing it after
  they disconnect. It does not establish who is in any subscriber graph at runtime - that is read
  from the roster or channel authorisation by the adjudicating layer and is context question 2. It
  does not establish what the shipped default visibility is, nor whether the person can find the
  control that changes it. And where the match is a stored row, it does not establish how long that
  row is kept or what deletes it."
remediation_template: >
  Write down the published payload field by field before anything else. Most of what this construct

  discloses is decided by granularity rather than by whether the feature exists, and an idle
  duration

  or a last-activity timestamp is frequently carried for no reason anyone can now name.

  Answer the default question explicitly: what a new account publishes, to whom, before the person

  changes anything. Art. 25(2) is about that state of affairs and not about whether a control
  exists.

  Where the control exists but is hard to find, that is the finding - say where it lives.

  Treat the offline half as storage, because it is. An offline-presence row and a last-activity
  stamp

  are retained personal data about somebody who is not connected; give them a deletion path of their

  own rather than leaving them to the account-deletion path.

  Where the processing runs on legitimate interests, make sure a person can stop publishing state

  without leaving the service, and check that doing so does not disable something they need.

  Where the construct arrived through a framework - a channel presence tracker, a collaborative

  editing awareness protocol - read what the library publishes by default rather than what the

  product's own code sets. An awareness protocol commonly carries a display name and a cursor

  position to everyone in a document, and no line in the product says so.
data_categories:
  - user.behavior
  - user.account
  - user.unique_id
  - user.device
fingerprint_spec: project
reading_class:
  class: existence
  elements:
    - name: shipped_default
      question: 3
      text: the shipped default for presence visibility
    - name: visibility_control
      question: 3
      text: the control that changes it - a privacy list, an invisible mode, a hide-last-seen switch

settling_questions:
  - scope.data_processing_service
context_questions:
  - "Is the scanned party a PROVIDER OF DATA PROCESSING SERVICES that these duties reach at all, and
    is it the SOURCE provider? Three separate gates, and none of them is decidable from source code.
    (a) Art. 2(8) defines a data processing service as \"a digital service that is provided to a
    customer and that enables ubiquitous and on-demand network access to a shared pool of
    configurable, scalable and elastic computing resources of a centralised, distributed or highly
    distributed nature that can be rapidly provisioned and released with minimal management effort
    or service provider interaction\". WHETHER A NICHE APPLICATION MEETS THAT TEST IS AN OPEN
    QUESTION IN THIS REPOSITORY AND THIS RULE DOES NOT CLOSE IT. Recital 81 puts IaaS, PaaS and SaaS
    inside the category, but it does not say the converse - that every hosted application is a data
    processing service - and Recital 80 glosses the last clause of the definition around the
    customer self-provisioning without any human interaction by the provider, so a
    provider-administered application is the arguable case. Ask the person running the scan how the
    service is sold and provisioned; do not infer it from vocabulary in the tree. (b) Art. 24 limits
    Arts. 23, 25, 29, 30 and 34 to \"the services, contracts or commercial practices provided by the
    source provider of data processing services\". A destination-side provider - one whose product
    imports a customer's data FROM a competitor - owes none of this. If the only migration code in
    the tree runs in the import direction (importFromAirtable, migrate from slack, an importer for a
    competitor's zip file), say so: that evidences accepting switchers and says nothing about
    letting a customer leave. (c) Art. 1(3), point (f) applies the Regulation to providers
    \"irrespective of their place of establishment, providing such services to customers in the
    Union\", so establishment outside the Union is not a gate; where the customers are, is. Answer
    each of the three and say which, if any, closes the candidate."
  - "Does Art. 31(2) switch this off? \"The obligations laid down in this Chapter shall not apply to
    data processing services provided as a non-production version for testing and evaluation
    purposes and for a limited period of time.\" Chapter VI is Arts. 23 to 31, so this limb takes
    the Arts. 23(c), 30(2) and 30(5) half of this row with it. All three conditions are cumulative:
    a non-production version, AND for testing and evaluation purposes, AND for a limited period of
    time. IT DOES NOT DISPOSE OF THE ART. 34(1) IN-PARALLEL-USE DUTY, AND DO NOT CLOSE THAT DUTY ON
    THIS GROUND. Art. 34 sits in Chapter VIII (Interoperability, Arts. 33 to 36), not in Chapter VI,
    so Art. 31(2)'s words \"this Chapter\" do not reach it by chapter membership - this file
    asserted that they did until 2026-08-06 and the premise was simply false. Whether the
    disapplication travels anyway is genuinely arguable both ways, because Art. 34(1) borrows
    Chapter VI's requirements \"mutatis mutandis\" and it is unsettled whether the borrowing carries
    their qualifications with them. Report it as unsettled, say which reading you are taking and
    why, and do not present either as settled law. A permanently available free tier is none of
    those - Art. 23(c) expressly names porting \"including after having benefited from a free-tier
    offering\" - and a long-running public beta is not obviously time-limited either. DO NOT ALSO
    APPLY ART. 31(1), AND THIS IS THE MOST LIKELY MISTAKE ON THIS ROW. Art. 31(1) disapplies Art. 23
    point (d), Art. 29 and Art. 30(1) and (3) for a custom-built service not offered at broad
    commercial scale. This rule rests on Art. 23 point (c), Art. 30(2) and Art. 30(5), none of which
    is on that list, so a bespoke service still owes everything here. The sibling row on switching
    charges (Art. 29) does switch off under either limb, and importing its gate would wrongly
    disapply this one. Where either limb is relied on, Art. 31(3) requires the provider to tell the
    prospective customer, before contracting, which Chapter VI obligations do not apply - which is
    worth reporting as a companion item."
  - "Is what was found a CUSTOMER-FACING BULK EXPORT, or an internal operations backup, or something
    that is neither? The detector cannot decide this and does not try. What it matched is a scope
    noun bound to an export identifier, a `/export` route literal, an export job or worker, a
    format-bound export name, an API description, an admin-scoped instance export, or - since
    2026-09-04 - an archive or document writer being called, which is the one shape that carries no
    export word at all. Work through the distinctions the vocabulary measurement drew, using the
    code around each location. (0) IF THE LOCATION IS AN ARCHIVE OR DOCUMENT WRITER, ASK WHAT GOES
    INTO IT AND WHERE IT GOES. That clause matches a ZIP, gzip, tar, spreadsheet, PDF, Word or
    calendar writer being invoked, and it says nothing about the size of what is written: the same
    call builds one customer's whole dataset and one object a person clicked download on. Read the
    loop that feeds it and the response that carries it away. Art. 30(5)'s operative word is ALL
    exportable data, so a writer fed from one record is evidence of a hand-out and not of this duty
    being answered; a writer fed from a whole tenant's rows is the shape the row is about. (a)
    CUSTOMER-FACING EXPORT versus OPERATIONS BACKUP. The separating feature is not the word backup;
    it is what the word is attached to and where the bytes go. A customer export attaches to a scope
    the customer owns - workspace, organisation, project, team, view - is triggered by an HTTP
    route, a user-interface control or a command the customer runs, and ends in a download, a
    presigned URL or an emailed link. An operations backup attaches to the infrastructure - pg_dump,
    WAL, point-in-time recovery, a snapshot policy, a retention window - is triggered by a cron, a
    schedule or a Kubernetes job, and ends in an object-store bucket with a lifecycle rule. One
    repository in the corpus has both, and the word backup appears in both. Quote the trigger and
    the destination. (b) WHO CAN REACH IT. An export only an operator can run from a shell is not a
    route by which a customer exercises Art. 23(c); an export behind an administrator role MAY be,
    because the Data Act's claimant is the CUSTOMER organisation and its own administrator acts for
    it - which is the opposite of the GDPR position, where an admin-only console is not a route for
    the data subject. Say which role reaches the path and whether that role belongs to the customer
    or to the provider. (c) WHOSE DATA MOVES, AND IN WHICH DIRECTION. Some matched vocabulary is an
    IMPORT wearing export words - a client library that calls a third-party service's own export API
    to pull data IN. That evidences the opposite of this duty. (d) A DIRECTORY THE DETECTOR CANNOT
    SEE. The strongest signal the vocabulary measurement found was a directory named `export`,
    `export-import`, `data-export` or `export_process` - 74 of them across 16 real repositories -
    and this engine cannot match a path. Look for one by name; in two corpus trees it was the only
    route to the export implementation."
  - "Does the export reach ALL EXPORTABLE DATA, and is the format genuinely structured, commonly
    used and machine-readable? Art. 30(5) requires the provider, \"In the case of switching between
    services of the same service type\" and where no common specifications or harmonised standards
    have been published, at the customer's request, to \"export all exportable data in a structured,
    commonly used and machine-readable format\". The word ALL is operative, and so is the
    same-service-type condition: Art. 30(5) is written for a move to a service COVERING THE SAME
    SERVICE TYPE, and it does not by its own terms reach a move to something else. WHAT COVERS THE
    OTHER CASES IS ART. 23(c), WHICH CARRIES NO SUCH RESTRICTION - it forbids obstacles to \"porting
    the customer's exportable data and digital assets, to a different provider of data processing
    services or to an on-premises ICT infrastructure\", so a customer taking their data in-house
    rests on Art. 23(c) rather than on Art. 30(5). Say which provision the case in front of you
    turns on. Art. 2(38) defines exportable data as \"the input and output data, including metadata,
    directly or indirectly generated, or cogenerated, by the customer's use of the data processing
    service\", excluding only assets protected by intellectual property rights or constituting a
    trade secret of the provider or a third party. Read that list against what the code actually
    emits. INPUT data is what the customer put in. OUTPUT data is what the service produced for them
    - generated documents, computed results, model outputs, rendered artefacts. METADATA is
    timestamps, authorship, structure, permissions, relationships between objects. INDIRECTLY
    GENERATED and COGENERATED data is observed and derived - activity history, usage records,
    analytics computed about the customer's own use. An export that emits the rows of one table and
    none of the above is not obviously an Art. 30(5) export, and this is where most real
    implementations fall short. On format: JSON, CSV, NDJSON, XML, Parquet and a documented archive
    of such files are structured and machine-readable; a PDF, a screenshot, a rendered HTML report
    or a proprietary binary that only this product can read is not, on the same reasoning this
    repository already applies to the GDPR Art. 20 export in eu-dsr-001. Quote the serialiser and
    the shape it writes. Where the route parameter or the task class names the format - `:exportAs`,
    ExportJSONTask, CsvReportExportService - that is where the answer is legible; the serialisation
    library alone is not, because the same library parses uploads."
  - "Are OPEN INTERFACES available, and to whom? This is Art. 30(2) and it has NO counterpart in the
    GDPR, so nothing in a data-subject-rights review will have answered it. The text requires
    providers to \"make open interfaces available to an equal extent to all their customers and the
    concerned destination providers of data processing services free of charge to facilitate the
    switching process\", and those interfaces must \"include sufficient information on the service
    concerned to enable the development of software to communicate with the services, for the
    purposes of data portability and interoperability\". Four properties, and a checked-in OpenAPI
    or Swagger document evidences at most the last one. Work through them. OPEN: is the interface
    published and usable without a negotiated agreement? EQUALLY AVAILABLE: can every customer reach
    it on every plan, and can the DESTINATION PROVIDER a customer is moving to reach it - which is a
    party with no contract with you at all? FREE OF CHARGE: is access to the interface itself
    charged for, metered, or rate-limited in a way that makes a bulk migration impractical?
    SUFFICIENT: is there enough documentation of the data structures and formats for somebody to
    write an importer? If the candidate's only locations are specification files, say plainly that
    no export path was found in this tree and that the finding is about the interface half of the
    row alone."
  - "Is the export capability PAYWALLED, TIER-GATED OR ROLE-GATED, and what does that mean here?
    This was measured in the corpus and it is the sharpest question on the row: one workspace-export
    endpoint is documented in its own specification as \"only available on an enterprise license\",
    another workspace export sits behind an explicit permission string, and one platform's own
    upgrade dialog tells a locked-out customer to upgrade in order to \"export your workspaces\"
    before their data is removed. Three distinct provisions bear on that and they should not be
    merged. (a) Art. 23 forbids imposing \"pre-commercial, commercial, technical, contractual and
    organisational obstacles\" that inhibit customers from porting their exportable data - a paywall
    in front of the only bulk-export path is on its face a commercial obstacle, and point (c) adds
    that porting is owed \"including after having benefited from a free-tier offering\", so being on
    the free plan is not an answer. (b) Art. 30(2)'s open interfaces must be available to an equal
    extent to ALL customers and free of charge, so a tier that removes interface access is squarely
    within it. (c) SWITCHING CHARGES ARE A SEPARATE ROW AND ARE NOT RESOLVED HERE. Art. 29 governs
    charges for the switching process and is coverage map Part C row 20, with its own checklist
    `data-act-switching-charges-29` and its own 12 January 2027 cliff. FLAG THE OVERLAP AND DO NOT
    DECIDE IT: say that a charge or tier gate was found, name which of Arts. 23 and 30(2) it bears
    on, and hand the charging question to row 20 rather than answering it with this row's
    provisions. Note also Art. 34(2), which permits data egress charges for in-parallel use but only
    at cost."
  - "Does the product owe this to customers who never leave? YES, AND THIS IS THE POINT NOBODY
    EXPECTS. Art. 34(1) provides that the requirements laid down in Art. 23, Art. 24, Art. 25(2)
    points (a)(ii), (a)(iv), (e) and (f) and \"Article 30(2) to (5) shall also apply mutatis
    mutandis to providers of data processing services to facilitate interoperability for the
    purposes of in-parallel use of data processing services\". So the whole of this rule's subject
    matter applies a second time to a customer using this product SIDE BY SIDE with another -
    multi-cloud, a second tool for the same job, a warehouse the customer syncs into - and not only
    to a customer terminating the contract. Two consequences for the finding. First, the common
    objection - our customers never switch away, so this does not reach us - does not answer the
    duty, and the finding should say so before anyone raises it. Second, the shape of what is owed
    differs slightly: in-parallel use is about ONGOING interoperability rather than a one-time
    extraction, which raises the weight of Art. 30(2)'s interfaces relative to Art. 30(5)'s export.
    Art. 34(2) is the one charging permission in this area: egress charges for in-parallel use are
    permitted \"but only for the purpose of passing on egress costs incurred, without exceeding such
    costs\"."
  - Whose duty is this, and does anything in Art. 30(6) limit it? Art. 30(6) provides that providers
    "shall not be required to develop new technologies or services, or disclose or transfer digital
    assets that are protected by intellectual property rights or that constitute a trade secret, to
    a customer or to a different provider of data processing services or compromise the customer's
    or provider's security and integrity of service". Read the three reliefs narrowly, because each
    is narrower than it is usually stated. No duty to develop NEW technologies or services does not
    excuse failing to expose data the service already holds through an interface it already has. The
    intellectual-property and trade-secret relief covers the PROVIDER'S OR A THIRD PARTY'S assets,
    and Art. 2(38) has already excluded those from the definition of exportable data - so a claim
    that the CUSTOMER'S own records are the provider's trade secret is an assertion to be
    substantiated, not accepted, and Recital 82 adds that these exemptions "should not impede or
    delay the switching process". The security relief is about not compromising integrity of
    service, not about declining to build an authenticated export. Where the team relies on any of
    the three, name which one and what evidence supports it.
  - "What is the date position, and how should the finding be worded? Art. 50 provides that the
    Regulation \"shall apply from 12 September 2025\", and its three deferrals - Art. 3(1), Chapter
    III and Chapter IV - do not touch Chapter VI. Neither Art. 23 nor Art. 30 nor Art. 34 carries a
    date of its own. THIS DUTY IS THEREFORE IN FORCE TODAY AND HAS BEEN SINCE 12 SEPTEMBER 2025, and
    a finding on this row is written in the present tense as a live obligation - not, as every Cyber
    Resilience Act row in this repository is, as preparation for a future date. Do not import Art.
    29's dates: 12 January 2027 is its switching-charge cliff, and 11 January 2024 is the opening of
    the reduced-charge window in Art. 29(2). Both belong to the sibling row on charges and neither
    dates anything in this row. Chapter VI has no micro or small-enterprise carve-out anywhere, so
    team size changes nothing. One forward-looking caveat belongs in any finding that quotes Art.
    30(5): it is written as a FALLBACK that applies only while no common specifications or
    harmonised standards have been published in the central Union standards repository under Art.
    35(8). As at 2026-08-06 that was checked and none had been - no implementing act has been
    adopted and the repository has not been established - so Art. 30(5) is the live duty and Art.
    30(3) is dormant. When the first Art. 35(8) implementing act lands, Art. 30(3) switches on
    twelve months later for the service types it covers and Art. 30(5) recedes for those types. If
    you are reading this well after 2026-08-06, re-check that status before relying on it."
  - "What does the tree NOT show, and what should the finding refuse to conclude? Three things this
    scan cannot see, each of which has closed a candidate in a comparable review. First, a mechanism
    living somewhere else: an export offered from a separate administrative console, a hosted
    control panel, a separate repository or a documented manual process on request is outside this
    scan and should be recorded as existing elsewhere rather than assumed absent. Second, the
    ABSENCE of any export path. This detector says nothing by staying silent - it looks for the
    presence of an export capability, and finding none is not evidence that none exists, so a
    finding must never report silence as a gap. Third, the contract. Art. 23's obstacles are
    expressly \"pre-commercial, commercial, technical, contractual and organisational\", and the
    contractual half lives in the terms of service, not in the source tree; coverage map Part C row
    18 and its checklist `data-act-switching-terms-23-25` are where the written contract is examined
    against Art. 25. Where the code shows a working export and the contract forbids or charges for
    it, neither half alone reaches the answer. Say which half you were able to read."
evidence_template: "{file}:{line} carries one of this rule's export or published-interface
  spellings: it evidences a path by which data leaves this product in bulk, or a published
  description of its interface, or NEITHER OF THOSE - and which of the three it is has to be read
  off the matched line before anything else. The third limb is not a formality, and it is the same
  third limb context question 3 offers: the export clauses match on spellings, so a homonym reaches
  them. EXPORT_ALL_VARIABLES, a GNU Make special target that exports Make variables into the
  environment of recipe subshells, matched inside one alternation of a vendored TextMate
  syntax-highlighting grammar for Makefiles - a line where no data leaves anything and no interface
  of this product is described. Where the matched line is that kind of homonym, say so and close the
  location on that ground. ONE BRANCH CARRIES NO EXPORT WORD AT ALL, ADDED 2026-09-04: an archive,
  compressed-stream, spreadsheet, PDF, Word or calendar WRITER being called - `zip.NewWriter(`,
  `zipfile.ZipFile(`, `new ZipOutputStream(`, `archiver.create(`, `SimpleDocTemplate(` - because a
  product can hand a customer their data out of the door without ever writing the word `export` in
  the file that does it. WHAT THAT BRANCH ESTABLISHES IS NARROWER THAN THE OTHERS: a file is being
  BUILT here, and nothing on the line says how much goes into it, whether it reaches a customer or
  an operations bucket, or whether the archive holds a whole tenant's dataset or the single object
  somebody clicked. Art. 30(5)'s operative word is ALL exportable data, so a writer fed from one
  record evidences a hand-out and not this duty; context question 3, limb (0), is where that is read
  off the surrounding code. The archive spellings this branch reads are the same ones the
  personal-data export rules read, so the three cannot disagree about how a writer is spelled, and
  that shared list also carries per-document renderers - a weaker shape for this rule than an
  archive writer, kept rather than filtered. READ THE LOCATIONS BEFORE ACCEPTING THE HEADLINE: this
  rule raises one finding per repository, and a candidate's locations may mix export constructs with
  published-interface evidence, so which of the three any given location is has to be read off the
  line rather than taken from the headline. A CANDIDATE CAN NO LONGER REST ENTIRELY ON AN OPENAPI OR
  SWAGGER VERSION STRING. Since 2026-08-12 that branch produces a location only in a file that also
  carries an export construct, so a version string is corroboration of the Art. 30(2) half and never
  the whole of a candidate; measured over the 94-repository corpus, the change removed 76 locations,
  added none, and took the firing repositories from 70 to 63. THIS PASSAGE SAID, UNTIL 2026-08-12:
  \"a candidate can rest entirely on branch 5, an OpenAPI or Swagger version string, with NO export
  location anywhere in it. On the 31-repository corpus that is the case for 2 of the 25 firing
  trees.\" That was true of the rule as it then stood and is kept here so that a reader who quotes
  it can see that it moved and why. Note also that the corpus grew from 31 repositories to 94
  between the two measurements, so the old figures and the new ones are not comparable. What a
  matched line establishes is that Data Act Arts. 23(c), 30(2) and 30(5) - and, through Art. 34(1),
  the same duties again for a customer using this product in parallel with another - are live
  questions for whatever this repository operates. It is NOT evidence that those duties are met, and
  it is not evidence that they are unmet. THE SCOPE OF THIS DUTY IS NOT PERSONAL DATA: Art. 1(2)(e)
  applies Chapter VI to \"any data\", Art. 2(38) keys exportable data to the customer's USE OF THE
  SERVICE rather than to identifiability, and Art. 2(30) gives the right to a customer that may be a
  legal person. A per-person GDPR Art. 20 download does not answer it, and a finding that describes
  this as a data-subject right has cited the wrong instrument. What the detector cannot see, and
  what context_questions ask instead: whether the export reaches ALL exportable data including
  output data and metadata, whether the format is structured, commonly used and machine-readable,
  whether open interfaces exist and are equally available and free of charge, whether the capability
  is paywalled or role-gated, whether this is a customer-facing export or an internal operations
  backup, and whether the party is a data processing service at all. THREE BRANCHES ADDED 2026-09-09
  READ AN INTERFACE DESCRIPTION THAT IS NOT A STATIC CHECKED-IN SPECIFICATION FILE, which is the
  only form the OpenAPI branch above can see. (a) A DOCUMENT GENERATED FROM CODE ANNOTATIONS AND
  SERVED AT A ROUTE - `SwaggerUi::new(`, `OpenApiRouter::with_openapi(`, `#[derive(OpenApi)]`,
  `@OpenAPIDefinition`, `GroupedOpenApi.builder(`, `SpectacularAPIView`, `swaggerJsdoc(`,
  `SwaggerModule.setup(`, or the published route itself as a quoted path such as `/openapi.json`,
  `/v3/api-docs` or `/swagger-ui` - where the description exists only when the service is running
  and the tree carries no version line to read. (b) A GRAPHQL SCHEMA WRITTEN IN THE SCHEMA
  DEFINITION LANGUAGE - `type Query {`, `extend type Mutation {`, `scalar DateTime`, `directive
  @auth on FIELD_DEFINITION` - which publishes the same kind of information in a different format; a
  GraphQL OPERATION document (`query apps { … }`, a fragment) is a client's request text and is
  deliberately not matched. (c) A PUBLISHED COMMAND OR CONTROL-VARIABLE REFERENCE - a DocBook entity
  include of a generated VTY or command reference, a `<refentry>`, a document title naming a
  command, control or API reference, or a documentation table whose header enumerates an interface's
  commands, selectors, variables or endpoints against their access mode, value or type. WHAT THOSE
  THREE ESTABLISH IS THE INTERFACE HALF AND NOTHING BEYOND IT: that a description of this product's
  interface is published somewhere. They do not establish that the interface is OPEN, that it is
  available TO AN EQUAL EXTENT to every customer and to the destination provider a customer is
  moving to, that it is FREE OF CHARGE, or that it carries SUFFICIENT INFORMATION for somebody to
  write an importer - Art. 30(2)'s four properties, which context question 5 puts one at a time. A
  generated document has to be OPENED before any of that can be answered, and the matched line only
  says that something serves it; a schema or a command table has to be read against Art. 2(38)'s
  list of exportable data before anyone can say the description covers what a customer would need to
  take with them. WHERE THESE THREE SIT RELATIVE TO THE FILE-LEVEL GATE, BECAUSE IT CHANGES HOW A
  CANDIDATE SHOULD BE READ. No gate clause was changed by them. The gate's first clause is an
  absence claim about a static OpenAPI or Swagger version header, so it is satisfied by a route
  file, a schema file or a reference document - none of which declares one - and a location produced
  by these branches stands whether or not an export construct sits beside it in the same file. The
  decision that an OpenAPI or Swagger VERSION STRING inside a checked-in specification file may not
  carry a candidate on its own is unchanged in wording and in effect; it is about that branch and
  that file shape, and it is not a general rule that an interface description must be corroborated.
  SO READ THE LOCATIONS BEFORE ACCEPTING THE HEADLINE, in the way this rule has always asked:
  because it raises one finding per repository, a repository whose only locations are interface
  descriptions of these three kinds produces a candidate with no extraction location anywhere in it.
  A candidate of that shape is about the Art. 30(2) interface half alone - say so plainly, say that
  no export path was found in this tree, and do not report the silence as a gap. WHETHER THE DATA
  ACT REACHES THIS PRODUCT AT ALL IS A PRODUCT-CLASSIFICATION QUESTION, ASKED OF THE PERSON RUNNING
  THE SCAN AND NEVER READ OFF THE SOURCE. The classification this rule's own duties turn on is Art.
  2(8): is the scanned party a provider of a `data processing service`, and is it the SOURCE
  provider of it under Art. 24? Where a reader reaches instead for the Regulation's Chapter II
  vocabulary, the same rule holds and the answer comes from the same place: whether the thing is a
  `connected product` (Art. 2(5)) or a `related service` (Art. 2(6)) is a fact about how the product
  is built, sold and provisioned, answered by the operator or read from their declared documents.
  Say which chapter is in play before quoting either term, because they are not interchangeable: the
  duties this rule tests are Chapter VI's, owed by a provider of data processing services, while
  `connected product` and `related service` are Chapter II's terms and Chapter II is not what this
  rule tests. No clause in this detector decides any of those classifications or contributes to
  deciding one, and context question 1 - deliberately the first of the ten - is where the question
  is asked. TWO SHAPES THE 2026-09-09 BRANCHES REACH THAT ARE WEAKER THAN THE REST, MEASURED ON THE
  PINNED CORPUS AND DISCLOSED HERE RATHER THAN FILTERED OUT. FIRST, THE DOCUMENTATION TABLE CAN BE A
  TABLE ABOUT SOMETHING THAT IS NOT AN INTERFACE. The same header row that publishes a control
  interface's commands and variables also heads a contributor guide's table of build commands, a
  keyboard-shortcut reference, and an operator's environment-variable list - and of those three,
  only the last is arguably an interface at all, and none is an interface a destination provider
  would write an importer against. Read the table's own subject before treating it as Art. 30(2)
  evidence: what makes a table interface documentation is that its rows are the operations or values
  something OUTSIDE the product may send it, not that its columns are named the same way. SECOND, A
  LINK OR A ROUTE CAN NAME SOMEBODY ELSE'S DOCUMENT. A quoted path ending in `/openapi.json` or
  `/swagger-ui` evidences a published description only when the host serving it is this product;
  where the line links to a third party's specification - a vendor's own API documentation the
  product happens to call - it evidences the OPPOSITE direction, and Art. 24 limits Arts. 23, 25,
  29, 30 and 34 to \"the services, contracts or commercial practices provided by the source provider
  of data processing services\". Context question 1, limb (b), is where that is settled"
remediation_template: >
  This is a candidate for review against Data Act (Regulation (EU) 2023/2854) Arts. 23(c), 30(2) and

  30(5), applied a second time to in-parallel use by Art. 34(1). It is not a determination about
  this

  repository. What the scan established is narrower than it may look: this tree carries evidence of
  a

  bulk or tenant-scoped export path, or of a published interface description, or - where the match

  is the archive-and-document-writer branch added 2026-09-04 - only that a FILE IS BEING BUILT here,

  which says nothing on its own about how much goes into it or who receives it. It did NOT check

  whether any duty below is met, and finding an export route here is not evidence that it is.

  READ THIS FIRST, BECAUSE IT IS THE THING MOST OFTEN GOT WRONG ON THIS ROW.

  THIS IS NOT A PERSONAL-DATA DUTY AND IT IS NOT THE GDPR EXPORT. Art. 1(2), point (e) applies

  Chapter VI to "any data"; Art. 2(38) defines exportable data by the CUSTOMER'S USE OF THE SERVICE,

  with no reference to whether anybody is identifiable; and Art. 2(30) gives the right to a

  "customer", expressly "a natural or legal person" - so a company holds it and a company has no

  GDPR Art. 20 right at all. The unit is the whole dataset belonging to one customer, tenant,

  workspace or organisation. A per-person "download my data" button, however well built, answers a

  different instrument, and four differences make that concrete: the KIND of data (any data, not

  personal data), WHICH data of that kind (input and output data, metadata, indirectly generated and

  cogenerated data, against Art. 20's "provided by" limit), the LEGAL-BASIS precondition (none
  here),

  and WHO HOLDS THE RIGHT (a customer including a legal person, against a natural person).

  Five requirements sit behind these provisions. They are separate, a product can meet some and not

  others, and a finding should name which one it is about rather than asking for an export in

  general.

  1. EXPORT ALL EXPORTABLE DATA, ON REQUEST - Art. 30(5), which is written for the case of switching
     between services of the SAME SERVICE TYPE and applies while no common specifications or
     harmonised standards have been published. A customer porting to on-premises ICT infrastructure,
     or to something that is not the same service type, is covered by Art. 23(c) instead, which names
     porting "to a different provider of data processing services or to an on-premises ICT
     infrastructure" and carries no same-service-type restriction. The word ALL is operative and Art. 2(38)
     says what it covers: input AND output data, metadata, and data indirectly generated or
     cogenerated by the customer's use of the service. In practice that means more than the rows of
     the main tables - generated artefacts, computed results, activity history, timestamps,
     authorship, permissions and the relationships between objects all sit inside the definition.
     The only exclusions are assets protected by intellectual property rights or constituting a
     trade secret OF THE PROVIDER OR A THIRD PARTY; the customer's own records are never inside that
     carve-out. Concretely: one route or command that produces one archive containing everything one
     customer owns, requestable by that customer.
  2. USE A STRUCTURED, COMMONLY USED AND MACHINE-READABLE FORMAT - Art. 30(5), same sentence. JSON,
     NDJSON, CSV, XML or Parquet, or a documented archive of such files, with the schema written
     down. A PDF, a rendered HTML report, a screenshot bundle or a proprietary binary that only this
     product can read does not satisfy it. Note the exact words: Art. 30(5) does NOT say
     "comprehensive" - that longer phrase belongs to Chapter II's connected-product provisions and
     should not be quoted here.
  3. PROVIDE OPEN INTERFACES, FREE AND EQUALLY AVAILABLE - Art. 30(2). This has NO GDPR counterpart
     and is the requirement most often missing. The interfaces must be open; available TO AN EQUAL
     EXTENT to all customers AND to the destination providers a customer is moving to, who have no
     contract with you; free of charge; and carrying enough information about the service to let
     somebody develop software against them for portability and interoperability. In practice: a
     published, versioned API description, documented data structures and formats, and access that
     does not depend on the plan the customer is on. Art. 26, point (b) is the companion information
     duty and names the artefact - an up-to-date online register of the data structures, data formats
     and relevant standards in which the exportable data are available.
  4. REMOVE OBSTACLES RATHER THAN ADDING A FEATURE - Art. 23. The duty is worded as not imposing and
     removing "pre-commercial, commercial, technical, contractual and organisational obstacles". A
     bulk export that exists only on the top plan, an export that must be requested through support,
     a rate limit that makes a full extraction impractical, or a contract term that forbids it are
     each capable of being such an obstacle even where an export path exists in the code. Point (c)
     adds that porting is owed "including after having benefited from a free-tier offering", so being
     on a free plan is not an answer. Where a charge is attached, note that the separate question of
     switching CHARGES is Art. 29 and belongs to its own row and checklist; do not settle it here.
  5. OWE IT TO CUSTOMERS WHO ARE NOT LEAVING - Art. 34(1). Art. 23 and Art. 30(2) to (5) apply
  again,
     mutatis mutandis, to in-parallel use of data processing services. A customer running this
     product alongside another one is owed the same interfaces and the same export, which makes
     ongoing interoperability - not just a one-time extraction on the way out - part of the
     requirement. Art. 34(2) permits data egress charges for in-parallel use only at cost.
  Before doing any of this, settle whether the duties attach. They bind a "provider of data

  processing services" (Art. 2(8)), and only the SOURCE provider (Art. 24) - a product that imports
  a

  customer's data from a competitor owes nothing on that account. Art. 31(1) does NOT reach this
  row:

  its list is Art. 23 point (d), Art. 29 and Art. 30(1) and (3), so a custom-built service still
  owes

  everything above. Art. 31(2) is the limb that does reach it: for a non-production version supplied

  for testing and evaluation for a limited period, all three conditions together, requirements 1 to
  4

  above fall away. IT DOES NOT DISPOSE OF REQUIREMENT 5. Art. 31(2) disapplies "the obligations laid

  down in this Chapter", and Art. 34 is in Chapter VIII (Interoperability), not in Chapter VI - so

  the in-parallel-use duty is not switched off by chapter membership. Whether it is switched off

  anyway, because Art. 34(1) borrows Chapter VI's requirements mutatis mutandis, is genuinely

  unsettled; treat it as an open question rather than as answered in either direction.

  Dates, so the work can be scheduled. All of the above has applied since 12 September 2025

  (Art. 50); Chapter VI is not among that article's three deferrals and carries no micro or

  small-enterprise carve-out, and Art. 1(3), point (f) reaches providers established anywhere who

  serve customers in the Union. Do not import the 12 January 2027 date - that is the
  switching-charge

  cliff in Art. 29(1) and belongs to a different row. One forward-looking note: Art. 30(5) is
  written

  as a fallback that applies while no common specifications or harmonised standards have been

  published in the central Union standards repository under Art. 35(8). None had been as at

  2026-08-06 - no implementing act has been adopted and the repository has not been established - so

  Art. 30(5) governs today. When the first such act lands, Art. 30(3) takes over twelve months later

  for the service types it covers.

  Where a mechanism already exists but the scanner could not see it - an export offered from a

  separate administrative console, a hosted control panel, a separate repository, or a documented

  manual process on request - record where it lives so that the next reader can close the candidate

  from the note rather than re-deriving it.
fingerprint_spec: project
duty_about: release_supply_documentation
reading_class:
  class: existence
  elements:
    - name: open
      question: 5
      text: "OPEN: is the interface published and usable without a negotiated agreement?"
    - name: equally_available
      question: 5
      text: "EQUALLY AVAILABLE: can every customer reach it on every plan, and can the DESTINATION
        PROVIDER a customer is moving to reach it?"
    - name: free_of_charge
      question: 5
      text: "FREE OF CHARGE: is access to the interface itself charged for, metered, or rate-limited in a
        way that makes a bulk migration impractical?"
    - name: sufficient
      question: 5
      text: "SUFFICIENT: is there enough documentation of the data structures and formats for somebody to
        write an importer?"

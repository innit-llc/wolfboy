id: eu-data-act-001
pack: eu-data-act
short_name: "Data export or published API: switching providers"
problem_line:
  text: Export gated, or no full structured export or open API found
fix_line: Let customers port all exportable data unobstructed in a structured, machine-readable
  format, and offer open interfaces.
title: Export path, or a published interface description - Data Act Arts. 23(c), 30(2) and 30(5)
  need checking
jurisdiction:
  - EU
legal_basis:
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 23, chapeau and point (c) - the obstacle-removal
      duty, and the first sentence that is itself an operative duty. Chapeau: \"Providers of data
      processing services shall take the measures provided for in Articles 25, 26, 27, 29 and 30 to
      enable customers to switch to a data processing service, covering the same service type, which
      is provided by a different provider of data processing services, or to on-premises ICT
      infrastructure, or, where relevant, to use several providers of data processing services at
      the same time. In particular, providers of data processing services shall not impose and shall
      remove pre-commercial, commercial, technical, contractual and organisational obstacles, which
      inhibit customers from:\". Point (c): \"porting the customer's exportable data and digital
      assets, to a different provider of data processing services or to an on-premises ICT
      infrastructure, including after having benefited from a free-tier offering;\". THREE THINGS TO
      CARRY OUT OF THIS TEXT. First, the duty is stated as obstacle removal rather than as feature
      delivery: the question a reader has to answer is not only whether an export control exists but
      whether anything - commercial, technical, contractual or organisational - stops a customer
      taking their data elsewhere. Second, the free-tier clause is the only qualifier inside point
      (c), and it settles one thing and not another: a free tier does not put a customer's data
      outside the porting duty, which is a different statement from the proposition that a free
      service is a data processing service - the Art. 2(8) test still has to be met on its own.
      Third, Art. 23 must be handled POINT BY POINT and never as a whole article, because Art. 31(1)
      carves out point (d) while leaving point (c) standing; see the Art. 31 entry below."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 30(2) - open interfaces, free of charge, equally
      available. \"Providers of data processing services, other than those referred to in paragraph
      1, shall make open interfaces available to an equal extent to all their customers and the
      concerned destination providers of data processing services free of charge to facilitate the
      switching process. Those interfaces shall include sufficient information on the service
      concerned to enable the development of software to communicate with the services, for the
      purposes of data portability and interoperability.\" Four separate requirements are packed
      into two sentences and a finding should name which one it is about: the interfaces are OPEN;
      they are available TO AN EQUAL EXTENT to all customers and to the destination providers those
      customers are moving to; they are FREE OF CHARGE; and they carry SUFFICIENT INFORMATION to
      enable somebody to develop software against them for portability and interoperability. The
      addressee limb - \"other than those referred to in paragraph 1\" - points at the providers
      Art. 30(1) does NOT cover, i.e. everything that is not bare scalable and elastic
      infrastructure, which is the platform and application layer this scanner's audience ships.
      Recital 97 states the same pairing of format and interface: parties should \"enable the secure
      and timely transfer of necessary data in a commonly used, machine-readable format, and by
      means of open interfaces\". GDPR has no interface-provision duty at all, which is why this
      entry has no analogue in eu-dsr-001 and cannot be covered by citing it."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
  - cite: 'Data Act (Regulation (EU) 2023/2854), Art. 30(5) - export all exportable data, on request, in
      a structured, commonly used and machine-readable format. "In the case of switching between
      services of the same service type, for which common specifications or the harmonised standards
      for interoperability referred to in paragraph 3 of this Article have not been published in the
      central Union standards repository for the interoperability of data processing services in
      accordance with Article 35(8), the provider of data processing services shall, at the request
      of the customer, export all exportable data in a structured, commonly used and
      machine-readable format." The word ALL is operative and is the difference between this duty
      and a per-object download. The Regulation does not further define structured, commonly used or
      machine-readable anywhere in Chapter VI; it is the same phrase GDPR Art. 20(1) uses, and the
      nearest gloss is Recital 85 on who does what: "the source provider of data processing services
      is responsible for extracting the data to a machine-readable format, but it is the customer
      and the destination provider of data processing services who are to upload the data to the new
      environment, unless a specific professional transition service has been obtained." ONE WORDING
      TRAP, MEASURED RATHER THAN ASSUMED: where the Data Act states the same requirement for
      connected-product data in Arts. 3(1), 4(1) and 5(1) it writes "in a comprehensive, structured,
      commonly used and machine-readable format" - one word longer. Art. 30(5) omits comprehensive,
      and the Chapter II wording must not be imported into a Chapter VI finding. Recital 90 names
      ISO/IEC 19941:2017 as "an important international standard constituting a reference for the
      achievement of the objectives of this Regulation", which is a reference and not a requirement,
      and is not a harmonised standard.'
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
  - cite: 'Data Act (Regulation (EU) 2023/2854), Art. 34 - the same duties again, for a customer who is
      not leaving. Art. 34(1): "The requirements laid down in Article 23, Article 24, Article 25(2),
      points (a)(ii), (a)(iv), (e) and (f) and Article 30(2) to (5) shall also apply mutatis
      mutandis to providers of data processing services to facilitate interoperability for the
      purposes of in-parallel use of data processing services." So Art. 23 and Art. 30(2) to (5) -
      every provision this rule rests on - apply a SECOND time, to multi-cloud and side-by-side use
      rather than to switching away. The open-interfaces duty and the export duty are therefore owed
      even to a customer with no intention of terminating, which is the answer to any argument that
      a product owes nothing because nobody has ever asked to leave it. Art. 34(2) is the one place
      egress charging survives, and only at cost: "Where a data processing service is being used in
      parallel with another data processing service, the providers of data processing services may
      impose data egress charges, but only for the purpose of passing on egress costs incurred,
      without exceeding such costs." Note that Art. 34(1) expressly carries Art. 24 across as well,
      so the source-provider limit travels with the duty into the in-parallel case.'
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 1(2), Art. 2(1), Art. 2(38) and Art. 2(30) - the
      duty's data scope is NOT limited to personal data, and its right-holder is not a natural
      person. Art. 1(2) chapeau: \"This Regulation covers personal and non-personal data\", and
      point (e): \"Chapter VI applies to any data and services processed by providers of data
      processing services;\". The contrast with point (f) is load-bearing, because it shows the
      drafters narrowing when they meant to: \"Chapter VII applies to any non-personal data held in
      the Union by providers of data processing services.\". Art. 2(1) defines the term with no
      personal-data limb: \"'data' means any digital representation of acts, facts or information
      and any compilation of such acts, facts or information, including in the form of sound, visual
      or audio-visual recording;\", while the neighbouring points exist precisely so the Regulation
      can narrow elsewhere - \"'personal data' means personal data as defined in Article 4, point
      (1), of Regulation (EU) 2016/679;\" and \"'non-personal data' means data other than personal
      data;\". Art. 2(38) is the operative term in Arts. 23(c) and 30(5): \"'exportable data', for
      the purpose of Articles 23 to 31 and Article 35, means the input and output data, including
      metadata, directly or indirectly generated, or cogenerated, by the customer's use of the data
      processing service, excluding any assets or data protected by intellectual property rights, or
      constituting a trade secret, of providers of data processing services or third parties;\".
      Read what that includes: INPUT AND OUTPUT data, METADATA, and data INDIRECTLY generated or
      COGENERATED - observed and derived data, not only what the customer typed in - with the only
      exclusions being the provider's or a third party's IP-protected assets and trade secrets. The
      hook is the CUSTOMER'S USE OF THE SERVICE, not identifiability. Recital 82 confirms it: \"The
      scope of exportable data should include, at a minimum, input and output data, including
      metadata, directly or indirectly generated, or cogenerated, by the customer's use of the data
      processing service, excluding any assets or data of the provider of data processing services
      or a third party.\" Art. 2(30) settles who is owed the duty: \"'customer' means a natural or
      legal person that has entered into a contractual relationship with a provider of data
      processing services with the objective of using one or more data processing services;\". A
      business customer that is a limited company holds an Art. 30(5) right and holds no GDPR Art.
      20 right at all, because GDPR rights are owed only to a data subject, who is a natural
      person."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 2(8) and Recitals 80 and 81 - whether the scanned
      party is a provider of data processing services at all, WHICH IS AN OPEN QUESTION THIS RULE
      INHERITS AND DOES NOT CLOSE. Art. 2(8): \"'data processing service' means a digital service
      that is provided to a customer and that enables ubiquitous and on-demand network access to a
      shared pool of configurable, scalable and elastic computing resources of a centralised,
      distributed or highly distributed nature that can be rapidly provisioned and released with
      minimal management effort or service provider interaction;\". Recital 81 puts the three
      delivery models inside the category: \"As commonly understood by providers and users and in
      line with broadly used standards, data processing services fall into one or more of the
      following three data processing service delivery models, namely Infrastructure as a Service
      (IaaS), Platform as a service (PaaS) and Software as a Service (SaaS).\" IT DOES NOT SAY THE
      CONVERSE. The proposition that every data processing service is one of the three delivery
      models is not the proposition that every hosted application sold as a subscription is a data
      processing service, and Art. 2(8)'s own test still has to be met; the
      data-act-switching-terms-23-25 checklist, which ships in this bundle, records that this file's
      sibling asserted the converse between 2026-07-28 and 2026-07-29 and withdrew it, and that
      record is not restated here. Recital 80 glosses the last clause of Art. 2(8) and points AWAY
      from the widest reading: \"The capability of the customer of the data processing service to
      unilaterally self-provision computing capabilities, such as server time or network storage,
      without any human interaction by the provider of data processing services could be described
      as requiring minimal management effort and as entailing minimal interaction between provider
      and customer.\" The definition says \"with minimal management effort or service provider
      interaction\" - a disjunction - while the recital describes the paradigm case as the customer
      self-provisioning without any human interaction at all, so a provider-administered application
      is the genuinely arguable case rather than a clear inclusion. This is a fact about the PRODUCT
      and the way it is sold. It is asked of the person running the scan or read from their declared
      documents, and it is never inferred from vocabulary in the tree."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 24 - the SOURCE-provider limit, checked against
      the operative text rather than assumed. \"The responsibilities of providers of data processing
      services laid down in Articles 23, 25, 29, 30 and 34 shall apply only to the services,
      contracts or commercial practices provided by the source provider of data processing
      services.\" The list names Articles 23 and 30, so it reaches BOTH of this rule's articles, and
      it names Article 34, so it reaches the in-parallel-use re-application too. A destination-side
      provider - one whose product IMPORTS a customer's data from a competitor - is a data
      processing service and owes none of these duties on that account. This bears directly on one
      measured detection hazard: a sweep of real repositories on 2026-08-06 found 180 lines across
      15 of them carrying competitor-IMPORT vocabulary (importFromAirtable, migrate from slack,
      import from github), which evidences that a product ACCEPTS switchers and says nothing about
      whether a customer can leave it. Treating that as evidence of an export capability would
      invert the direction of the duty, which is why no branch of this detector matches it."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 31 - the specific regime, and it has TWO limbs
      which except different amounts. Art. 31(1): \"The obligations laid down in Article 23, point
      (d), Article 29 and Article 30(1) and (3) shall not apply to data processing services of which
      the majority of main features has been custom-built to accommodate the specific needs of an
      individual customer or where all components have been developed for the purposes of an
      individual customer, and where those data processing services are not offered at broad
      commercial scale via the service catalogue of the provider of data processing services.\" READ
      THE LIST. It names Article 23 point (d), Article 29, and Article 30(1) and (3). This rule
      rests on Article 23 point (c), Article 30(2) and Article 30(5), and NONE of them is on that
      list - so a custom-built service that is not offered at broad commercial scale still owes the
      whole of this rule's subject matter. That is the same position as Art. 25 (coverage map Part C
      row 18) and the OPPOSITE of Art. 29 (row 20), which is named in 31(1) and switches off under
      either limb. Art. 31(2) is the limb that does reach this rule, and it reaches it completely:
      \"The obligations laid down in this Chapter shall not apply to data processing services
      provided as a non-production version for testing and evaluation purposes and for a limited
      period of time.\" Chapter VI is Articles 23 to 31, so Arts. 23 and 30 fall with it. Its three
      conditions are cumulative: a non-production version, AND for testing and evaluation purposes,
      AND for a limited period of time. ART. 34 IS NOT IN CHAPTER VI AND THIS FILE SAID OTHERWISE
      UNTIL 2026-08-06, WHICH WAS A FALSE PREMISE CARRYING A CONCLUSION. The Official Journal's own
      structure puts Art. 34 in CHAPTER VIII (Interoperability, Arts. 33 to 36), between Art. 33 and
      Art. 35; Chapter VI ends at Art. 31 and Chapter VII (Arts. 32) sits between them. So Art.
      31(2)'s words \"this Chapter\" do not reach Art. 34 by chapter membership. Whether they reach
      it another way is a REAL AND UNSETTLED QUESTION, and it is left open here rather than
      answered: Art. 34(1) applies \"the requirements laid down in Article 23 ... and Article 30(2)
      to (5) ... mutatis mutandis\", so one reading is that the borrowed requirements arrive with
      their Chapter VI qualifications, Art. 31 included, and another is that Art. 31(2) is expressly
      confined to its own Chapter and a duty imposed from outside it survives. Nothing in the
      operative text settles which, no Commission guidance addresses it, and a finding must not
      assert either. What is certain is narrower and is what a reader should be told: Art. 31(2)
      disapplies the Arts. 23(c), 30(2) and 30(5) half of this row for a service that meets its
      three cumulative conditions. Art. 31(3) adds a disclosure duty wherever either limb is relied
      on: \"Prior to the conclusion of a contract on the provision of the data processing services
      referred to in this Article, the provider of data processing services shall inform the
      prospective customer of the obligations of this Chapter that do not apply.\" Whether a service
      is custom-built, whether it is offered at broad commercial scale, and whether an environment
      is a time-limited non-production version are facts about the product and its contracts, asked
      of the person running the scan."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 30(6) - the ceiling, and it is narrower than it is
      usually stated. \"Providers of data processing services shall not be required to develop new
      technologies or services, or disclose or transfer digital assets that are protected by
      intellectual property rights or that constitute a trade secret, to a customer or to a
      different provider of data processing services or compromise the customer's or provider's
      security and integrity of service.\" Three reliefs, and each is bounded. No duty to develop
      NEW technologies or services - which does not excuse failing to expose data the service
      already holds through an interface it already has. No duty to disclose or transfer digital
      assets protected by intellectual property rights or constituting a trade secret - and Art.
      2(38) has already excluded exactly those from the definition of exportable data, so this is a
      restatement at the point of transfer rather than a second carve-out. No duty to compromise
      security or integrity of service. Recital 82 adds the limit on the limit: those exemptions
      \"should not impede or delay the switching process\". The provider's own IP is excluded; the
      CUSTOMER'S data is not, and a claim that a customer's records are the provider's trade secret
      is the kind of assertion a finding should ask to see substantiated rather than accept."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 30(3) and Art. 35(8), and the implementing-act
      status as at 2026-08-06. Art. 30(3): \"For data processing services other than those referred
      to in paragraph 1 of this Article, providers of data processing services shall ensure
      compatibility with common specifications based on open interoperability specifications or
      harmonised standards for interoperability at least 12 months after the references to those
      common specifications or harmonised standards for interoperability of data processing services
      were published in the central Union standards repository for the interoperability of data
      processing services following the publication of the underlying implementing acts in the
      Official Journal of the European Union in accordance with Article 35(8).\" Note the addressee:
      \"other than those referred to in paragraph 1\" - the SAME audience as 30(2) and 30(5), namely
      the platform and application layer, not bare infrastructure. Recital 100 confirms it in the
      legislator's own words, describing the standards power as existing \"where market-driven
      processes have not demonstrated a capacity to establish common specifications or standards
      that facilitate effective cloud interoperability at the PaaS and SaaS levels\". Art. 35(8) is
      the mechanism: \"For the purpose of Article 30(3), the Commission shall, by means of
      implementing acts, publish the references of harmonised standards and common specifications
      for the interoperability of data processing services in a central Union standards repository
      for the interoperability of data processing services.\" NO SUCH IMPLEMENTING ACT HAS BEEN
      ADOPTED AND THE CENTRAL UNION STANDARDS REPOSITORY HAS NOT BEEN ESTABLISHED, checked rather
      than assumed on 2026-08-06, and the checks are these: the Commission's Rolling Plan for ICT
      Standardisation still describes the repository as to-be-established and its preparatory study
      was published only in March 2026; the standardisation request that has been accepted, M/614,
      is aimed at Art. 33 and not Art. 35; and Commission Implementing Regulation (EU) 2026/818,
      which surfaces on a keyword search, was fetched (CELEX 32026R0818) and is made under
      Regulation (EU) 2024/900 on political advertising, which has nothing to do with the Data Act.
      Delegated acts under this Regulation are confined by Art. 45(2) to Art. 29(7) and Art. 33(2),
      so there is no delegated-act power over this subject matter either. THE CONSEQUENCE: Art.
      30(3) currently has no operative content, its 12-month clock has never started, and Art. 30(5)
      is the live export duty today for every same-service-type switch. THIS WILL INVERT. When the
      first Art. 35(8) implementing act lands, Art. 30(3) switches on 12 months later for the
      service types it covers and Art. 30(5) recedes for those types, at which point this rule needs
      re-reading. The negative fact is time-sensitive and should be re-checked before anything
      ships."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 1(5) and Recital 35 - the GDPR relationship
      clause, and what it does NOT do. Art. 1(5): \"This Regulation is without prejudice to Union
      and national law on the protection of personal data, privacy and confidentiality of
      communications and integrity of terminal equipment, which shall apply to personal data
      processed in connection with the rights and obligations laid down herein, in particular
      Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive 2002/58/EC, including the powers
      and competences of supervisory authorities and the rights of data subjects. Insofar as users
      are data subjects, the rights laid down in Chapter II of this Regulation shall complement the
      rights of access by data subjects and rights to data portability under Articles 15 and 20 of
      Regulation (EU) 2016/679.\" Two readings, and the second is easy to miss. First, this is the
      standard without-prejudice pattern: the Data Act ADDS a duty and does not narrow itself to the
      GDPR's scope; the GDPR prevails only on CONFLICT, and an export duty wider than Art. 20 is not
      in conflict with Art. 20. Second, THE SENTENCE THAT EXPRESSLY BRIDGES TO GDPR ARTS. 15 AND 20
      IS ABOUT CHAPTER II, NOT CHAPTER VI. The legislator wrote a complementarity clause for the
      connected-product chapter and wrote none for the switching chapter, so there is no mechanism
      anywhere in this Regulation that narrows Chapter VI back to personal data. Recital 35 states
      the difference in the drafters' own words - it is written in the Chapter II context, and its
      reasoning about the narrowness of Art. 20 is general: \"Article 20 of Regulation (EU) 2016/679
      specifies that it pertains to data provided by the data subject\" but does not settle whether
      that reaches passively observed data, whereas this Regulation grants rights \"irrespective of
      their nature as personal data\", and \"Unlike Article 20 of Regulation (EU) 2016/679, this
      Regulation mandates and ensures the technical feasibility of third party access for all types
      of data falling within its scope, whether personal or non-personal\". FOUR AXES ON WHICH THIS
      DUTY IS WIDER THAN GDPR ART. 20, each traceable to a quote in this file: the KIND of data (any
      data, not personal data only); WHICH data of that kind (input AND output data, metadata,
      indirectly generated and cogenerated data, against the limit in Art. 20 to data the person has
      provided); the LEGAL-BASIS precondition (none here, against the condition in Art. 20(1) that
      processing rest on consent or contract and be carried out by automated means); and WHO HOLDS
      THE RIGHT (a customer, expressly including a legal person, against a data subject who must be
      a natural person). And one duty with no GDPR analogue at all: Art. 30(2)'s open interfaces."
    url: http://publications.europa.eu/resource/celex/32023R2854
    checked_at: 2026-08-06
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Data Act (Regulation (EU) 2023/2854), Art. 50 and Art. 1(3), point (f) - the date, and who it
      reaches. Art. 50: \"It shall apply from 12 September 2025.\" Art. 50 then grants deferrals to
      exactly three things and CHAPTER VI IS NOT AMONG THEM: \"The obligation resulting from Article
      3(1) shall apply to connected products and the services related to them placed on the market
      after 12 September 2026.\", \"Chapter III shall apply in relation to obligations to make data
      available under Union law or national legislation adopted in accordance with Union law, which
      enters into force after 12 September 2025.\", and \"Chapter IV shall apply to contracts
      concluded after 12 September 2025.\" Neither Art. 23 nor Art. 30 nor Art. 34 carries a date of
      its own. SO THIS DUTY HAS BEEN IN APPLICATION SINCE 12 SEPTEMBER 2025, and unlike the Cyber
      Resilience Act rows in this repository THERE IS NO PREPARATION-PHASE FRAMING AVAILABLE HERE: a
      finding is worded as a present obligation, not as preparation for a future date. The only
      dates anywhere inside Chapter VI are in Art. 29, and there are two of them rather than one:
      the switching-charge cliff of 12 January 2027 set by Art. 29(1), and the window set by Art.
      29(2) running \"From 11 January 2024 to 12 January 2027\", during which reduced switching
      charges are permitted. Both belong to coverage map Part C row 20 and neither may be imported
      into this row. Two further points on exposure. There is NO micro or small-enterprise carve-out
      anywhere in Chapter VI, unlike Chapter II, which has one in Art. 7(1). And Art. 1(3), point
      (f) applies the Regulation to \"providers of data processing services, irrespective of their
      place of establishment, providing such services to customers in the Union\", so a provider
      established outside the Union that serves Union customers is inside it. Penalties are for the
      Member States to set under Art. 40 rather than being fixed in the Regulation, so no fine
      ceiling is stated here; authority designation was still fragmented across Member States in
      mid-2026, which is the reason this row's practical exposure is recorded as low today and
      rising."

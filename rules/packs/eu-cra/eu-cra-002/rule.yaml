  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Recital 56, Art. 13(4) and Annex I Part I
      point (2)(c) - the automatic-update limb of Annex I Part II point (7), what disapplies it, and
      the neighbouring product-side duty it is easy to merge with. Point (7) ends with the words
      'where applicable for security updates, in an automatic manner', and the qualifier is not
      decorative. Recital 56 states two classes for which automatic updates are disapplied: 'The
      requirements relating to automatic updates as set out in an annex to this Regulation are not
      applicable to products with digital elements primarily intended to be integrated as components
      into other products. They also do not apply to products with digital elements for which users
      would not reasonably expect automatic updates, including products with digital elements
      intended to be used in professional ICT networks, and especially in critical and industrial
      environments where an automatic update could cause interference with operations.' It then
      keeps the core duty alive regardless: 'Irrespective of whether a product with digital elements
      is designed to receive automatic updates or not, its manufacturer should inform users about
      vulnerabilities and make security updates available without delay.' So a product PRIMARILY
      intended to be integrated as a component into other products sits outside the automatic limb
      while remaining inside the rest of point (7) and inside points (2) and (8). The word primarily
      is in the recital and is load-bearing: it is not enough that a product CAN be integrated, or
      that some users integrate it, and this sentence dropped the word until 2026-08-05, which read
      as though any component-bound product qualified. How far that can be pushed is uncertain and
      should be reported as such: Recital 56 is a recital, the operative hook is only the words
      'where applicable', and the recital's own phrase 'as set out in an annex to this Regulation'
      names neither Annex I Part II point (7) nor Annex I Part I point (2)(c), both of which carry
      automatic-update language. Where the conclusion is that a requirement does not apply, Art.
      13(4) supplies the consequence rather than silence: 'Where certain essential cybersecurity
      requirements are not applicable to the product with digital elements, the manufacturer shall
      include a clear justification to that effect in that technical documentation.' The
      neighbouring duty, quoted so that the two are not merged, is Annex I Part I point (2)(c):
      'ensure that vulnerabilities can be addressed through security updates, including, where
      applicable, through automatic security updates that are installed within an appropriate
      timeframe enabled as a default setting, with a clear and easy-to-use opt-out mechanism,
      through the notification of available updates to users, and the option to temporarily postpone
      them;'. Part I point (2)(c) is a property of the product and is gated by the risk-assessment
      chapeau of Part I point (2); Part II point (7) is a process of the manufacturer and is not
      gated at all. They sit in different Parts and are assessed through different paragraphs of
      Art. 13. This rule tests neither of them by detection; it raises the question."

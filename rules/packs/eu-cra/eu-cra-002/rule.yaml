  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Recital 57 and Recital 39, and the Article
      3 finding that neither term is defined. Recital 57 is the rationale for the separation limb of
      Annex I Part II point (2) and is a single sentence: 'To improve the transparency of
      vulnerability handling processes and to ensure that users are not required to install new
      functionality updates for the sole purpose of receiving the latest security updates,
      manufacturers should ensure, where technically feasible, that new security updates are
      provided separately from functionality updates.' The mischief it names is users being made to
      take functionality they did not ask for in order to receive a security fix. THE BOUNDARY THAT
      LIMB TURNS ON IS NOT A DEFINED ONE. Article 3 contains 51 definitions, numbered (1) to (51),
      and all 51 were enumerated on the 2026-08-05 fetch: neither update, nor security update, nor
      functionality update, nor feature update, nor patch appears among them. The only elaboration
      anywhere is Recital 39, and it works by example rather than by definition: 'Where a security
      update which is designed to decrease the level of cybersecurity risk of a product with digital
      elements does not modify the intended purpose of a product with digital elements, it is not
      considered to be a substantial modification. This usually includes situations where a security
      update entails only minor adjustments of the source code.' Recital 39 also separates two
      things an earlier description of this row had merged into one term - 'a minor functionality
      update, such as a visual enhancement or the addition of new pictograms or languages to the
      user interface, should not generally be considered to be a substantial modification' as
      against 'where a feature update modifies the original intended functions or the type or
      performance of a product with digital elements and meets the above criteria, it should be
      considered to be a substantial modification, as the addition of new features typically leads
      to a broader attack surface, thereby increasing the cybersecurity risk'. A functionality
      update and a feature update are therefore not interchangeable in the recitals. The consequence
      for anything this rule reports: state the boundary the way the recital does - a security
      update is one whose purpose is to decrease cybersecurity risk and which does not modify the
      intended purpose - and do not present it as a defined line, because there is no definition to
      appeal to. Recital 39 closes by recording that 'The Commission should issue guidance on how to
      determine what constitutes a substantial modification.', which had not issued as at
      2026-08-05."

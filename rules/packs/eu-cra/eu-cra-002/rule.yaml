  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 13(10), Art. 3(30) and Recital 40 - a
      LIMITATION on Annex I Part II point (2), not an addition to it, and the only relief provision
      in this rule. Art. 13(10) names point (2) expressly: 'Where a manufacturer has placed
      subsequent substantially modified versions of a software product on the market, that
      manufacturer may ensure compliance with the essential cybersecurity requirement set out in
      Part II, point (2), of Annex I only for the version that it has last placed on the market,
      provided that the users of the versions that were previously placed on the market have access
      to the version last placed on the market free of charge and do not incur additional costs to
      adjust the hardware and software environment in which they use the original version of that
      product.' Two conditions have to hold before the relief is available, and both are about the
      users of the older versions: free-of-charge access to the newest version, and no additional
      cost to adjust the hardware and software environment they run it in. Recital 40 gives the
      worked example - 'This could, for instance, be the case where a desktop operating system
      upgrade does not require new hardware, such as a faster central processing unit or more
      memory.' - and states the limit of the relief: 'Nonetheless, the manufacturer should continue
      to comply, for the support period, with other vulnerability-handling requirements, such as
      having a policy on coordinated vulnerability disclosure or measures in place to facilitate the
      sharing of information about potential vulnerabilities for all subsequent substantially
      modified versions of the software product placed on the market.' So the relief is specific to
      point (2) and does not extend to points (5), (6), (7) or (8); that reading is supported by
      Recital 40 and by the fact that Art. 13(10) names one point, but the operative text says
      nothing beyond naming it, so it is offered as a reading rather than as settled law. Recital 40
      also fixes the hardware case the other way: 'where a hardware product, such as a smartphone,
      is not compatible with the latest version of the operating system it was originally delivered
      with, the manufacturer should continue to provide security updates at least for the latest
      compatible version of the operating system for the support period.' What counts as
      substantially modified is Art. 3(30): 'a change to the product with digital elements following
      its placing on the market, which affects the compliance of the product with digital elements
      with the essential cybersecurity requirements set out in Part I of Annex I or which results in
      a modification to the intended purpose for which the product with digital elements has been
      assessed'. Note that the definition is expressed against Part I only, so on these words a
      change affecting Part II compliance is not a substantial modification."

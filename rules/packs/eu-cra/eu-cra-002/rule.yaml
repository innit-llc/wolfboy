  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Article 2 - scope. THIS ENTRY DELIBERATELY
      CONTAINS NO SCOPE TEST AND NO ARTICLE 2 QUOTATION. The complete test lives in the shared CRA
      scope gate, gate_id cra-scope, which SHIPS INSIDE THIS BUNDLE - the build splices it whole
      into every checklist that names it, so a reader holds it as the applicability object of the
      three CRA checklists in checklists.json - and which decomposes Article 2 in full - the
      paragraph that brings a product in, and each of the seven subtractive paragraphs, every one
      carrying its own limb, its own question and its own verbatim quote of the operative words -
      alongside the Article 3 definitions, Art. 24, Art. 69(2), Art. 71(2) and the recitals that
      elaborate them, into 37 limbs backed by 50 supporting quotes. Every one of those quotes was
      verified against the Official Journal text and twice checked by independent adversarial legal
      review on 2026-08-04; the receipts and the review records are held by the rule author and do
      not ship, so nothing here asks a reader to open them. That gate's own header names the
      update-mechanism duty as one of the rows expected to reference it rather than keep its own
      copy, and this rule takes that instruction. Re-deriving Article 2 here is the drifting-copy
      defect this repository has paid for repeatedly and is not done. One paragraph is worth a
      reader's specific attention because of how close it sits to this subject matter, and it is in
      the gate rather than here: Article 2(6) excludes spare parts made available to replace
      identical components and manufactured to the same specifications as the components they
      replace, and a rule about update supply will meet replacement-component cases. What the link
      is and is not: no rule evaluates a gate directly - referencing a gate is a facility of
      checklists and not of rules - so this pointer is documentary and a reader has to follow it
      into the checklists the bundle ships. A scan nevertheless reaches the same gate by a different
      route: it annotates every candidate whose legal_basis cites name an instrument that a shipped
      gate assesses, and every cite in this file names Regulation (EU) 2024/2847 - so a candidate
      raised by this rule arrives carrying depends_on_applicability, and context question 1 sends
      the adjudicating agent to that output before anything else."

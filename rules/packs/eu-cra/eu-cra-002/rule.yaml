  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 71(2): 'This Regulation shall apply
      from 11 December 2027. However, Article 14 shall apply from 11 September 2026 and Chapter IV
      (Articles 35 to 51) shall apply from 11 June 2026.' Every provision this rule rests on - Annex
      I Part II points (2), (7) and (8), Art. 13(6), Art. 13(8), Art. 13(9), Art. 13(10) and Annex
      II - is reached through Article 13, which sits in Chapter II and is not among the provisions
      the second subparagraph brings forward. THE DUTY THEREFORE APPLIES FROM 11 DECEMBER 2027, and
      not from 11 September 2026, which is Article 14 alone (reporting of actively exploited
      vulnerabilities and severe incidents, a separate obligation with no source-code trace, which
      this product treats as an organisational duty with no source-code trace and tests by no rule).
      Art. 69(2) additionally provides that products placed on the market before 11 December 2027
      are subject to the Regulation only if they are substantially modified from that date, and Art.
      69(3) carves Article 14 back out of that grandfathering. Two consequences for anything this
      rule reports. First, nothing here is chargeable today and every finding is worded as
      preparation for a dated obligation. Second, the date is not something the detector can see:
      matched lines evidence an update path or a pinned runtime, and neither carries a date. The
      date belongs to the duty the adjudicating agent is asked about, and context question 10 is
      where it is stated to the reader."

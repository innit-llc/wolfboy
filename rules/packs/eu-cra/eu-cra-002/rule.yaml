context_questions:
  - "Does the Cyber Resilience Act reach what this repository supplies at all? Do not answer that
    from Art. 2(1) alone and do not re-derive the test here. Article 2 has eight paragraphs: the
    first brings a product in, and the other seven take it back out or limit what applies - among
    them Art. 2(2) for products covered by the medical devices, in vitro diagnostic devices or motor
    vehicle Regulations, Art. 2(3) for products certified under the civil aviation Regulation, Art.
    2(4) for marine equipment, Art. 2(5) for a delegated act limiting or excluding application, Art.
    2(6) for spare parts replacing identical components, Art. 2(7) for products developed or
    modified exclusively for national security or defence and products designed to process
    classified information, and Art. 2(8) for information whose disclosure would be contrary to
    essential security interests. The whole test, decomposed into 37 limbs with the operative words
    of each paragraph quoted, is the shared scope gate `rules/gates/cra-scope.yaml`, and a scan
    evaluates that gate rather than leaving you to open a 37-limb file cold. Read the scan output
    first, in this order. (a) On this candidate, `depends_on_applicability`: one entry per checklist
    that names the gate, each carrying `verdict` (applies, likely-applies, does-not-apply or
    unresolved) and `because`; identical entries from more than one checklist are one verdict
    reported twice and not two verdicts. (b) At the top level of the findings file, `applicability`:
    the same assessment in full, with every limb and its state, the evidence for and against each,
    `unresolved_limbs` naming what nothing settled, and `contradictions` where the person running
    the scan declared one thing and the tree shows another. If the verdict is does-not-apply, record
    that and stop: the duties this rule asks about do not attach. If it is unresolved or
    likely-applies, work through the limbs named in `unresolved_limbs` using the questions the gate
    itself states, and note that every Art. 2(2) to 2(8) limb turns on a fact about what the product
    IS - a medical device, a vehicle component, a spare part, defence software - which is asked of
    the person running the scan or read from their declared documents, and is never inferred from
    vocabulary in the tree. Art. 2(6) deserves a moment on this row specifically: a replacement
    component manufactured to the same specifications as the part it replaces is outside the
    Regulation, and a repository about update supply will meet that case. If no applicability
    information reached you, say so plainly and answer the limbs by asking, rather than substituting
    a scope analysis of your own."
  - "Is what was matched actually a MECHANISM by which software reaches somebody else's machine, or
    only something that looks like one? This is the question that separates a real candidate from a
    false one, and the detector cannot answer it. Four distinctions, each of which was measured on
    real repositories. (a) A VERSION CHECK IS NOT A DELIVERY PATH. An endpoint that reports the
    latest version number and does nothing else tells a user that something newer exists; Annex I
    Part II point (7) asks for mechanisms to securely DISTRIBUTE updates. Read the code around the
    match: does anything download, verify, stage or install what the check found, or does the path
    end at a notice? Both answers are useful - a notice with no delivery behind it is itself worth
    reporting, against point (7) and against Annex II point 8(c) - but they are different findings
    and must not be reported as the same one. (b) A DEVELOPER-TOOL NOTIFIER IS NOT A PRODUCT UPDATE
    PATH. Five trees in the measurement use update-notifier or update-check to tell a DEVELOPER that
    their own command-line tool is out of date; that is a fact about the repository's tooling, and
    the same vocabulary sometimes appears as a disabled flag, which is the opposite fact. (c) SOME
    OF THIS VOCABULARY IS NOT ABOUT UPDATES AT ALL, OR IS ABOUT SOMEBODY ELSE'S UPDATES. Measured on
    the corpus: a check-for-updates call is git branch synchronisation in one tree; an update
    checker is a framework file watcher in two others; a scheduled job named for an update check is
    about topping up an account balance in a third; and 23 lines in one tree are translations of a
    button label for updating PLUGINS - one line in each of 23 locale files, including the English
    source - which is an update path for a third party's extension rather than for the product. A
    sixth shape is a documentation anchor naming a feature rather than an endpoint. That last shape
    matters beyond its count, because it is the one most likely to read as a genuine hit: the words
    are exactly right and the object of the sentence is wrong. Quote the surrounding lines and say
    which reading you took, and whose software the update would reach. (d) A MATCH IN DOCUMENTATION
    CUTS BOTH WAYS: a framework page describing somebody else's updater is a false positive, while a
    docs page describing how THIS product updates itself, naming its update server and its
    configuration key, is among the best evidence in a repository and is what an Annex II point 8(c)
    answer looks like. Say whose mechanism the matched line describes."
  - "Whose update path is it, and what does it actually cover? Annex I Part II point (7) binds the
    manufacturer of the product with digital elements. Three cases the measurement produced, and
    they lead to different findings. First, a first-party mechanism the team operates - an updater
    library wired into their own application, their own feed or update server, their own signing key
    for updater artifacts. Second, a THIRD-PARTY CHANNEL the team relies on: an editor-extension
    marketplace, an application store, a hosted build-and-update service, a container-image
    auto-updater the end user runs. That is still capable of satisfying point (7), because the point
    asks for mechanisms to be provided for and does not say by whom they must be operated - but it
    makes the manufacturer's compliance depend on someone else's channel, and it is worth saying so
    in the finding, together with which parts of the product the channel does NOT reach. Third, a
    mechanism belonging to a dependency or to a vendored tree, which is not this repository's supply
    at all. Say which, and quote the line you relied on. Then say what the mechanism covers: many
    repositories in the measurement ship several artifacts - a desktop bundle, a container image, a
    command-line tool, a library - and an updater wired into one of them says nothing about the
    others."
  - "Is the update mechanism SECURE, which is the word point (7) actually uses? The duty is not to
    have an update path but to 'provide for mechanisms to securely distribute updates'. The detector
    establishes only that a path exists. Look for, and quote, whatever is there: an updater-specific
    signing key, distinct from the platform code-signing identity, held as a secret in the release
    pipeline; verification of a downloaded artifact before it is applied; a feed URL fixed to a
    transport that authenticates the server; pinned or published keys the client checks against. The
    measurement found exactly one instance in 31 repositories of an updater-specific signing key
    declared separately from the platform identity, which is the shape this limb is about, and it
    found that generic signature-verification vocabulary is dominated by INBOUND webhook
    verification and is not evidence about updates at all - so read what the verification is
    verifying before counting it. Build-time code signing (notarisation, an installer signing
    certificate) is evidence about the artifact and not by itself about the channel that delivers
    it; record it as corroboration rather than as an answer. Where you find no verification anywhere
    on the update path, say so as an observation about what the repository shows, not as a
    conclusion about the product."
  - "Are security updates supplied FREE OF CHARGE, and does the tailor-made carve-out apply? Annex I
    Part II point (8) requires dissemination free of charge 'unless otherwise agreed between a
    manufacturer and a business user in relation to a tailor-made product with digital elements'.
    Recital 64 is the only elaboration. ON THE READING THIS RULE TAKES - and it is a reading, not
    settled law, because the operative text says only that the duty is displaced where otherwise
    agreed in relation to a tailor-made product, and the second limb is drawn from Recital 64's
    words about both parties having explicitly agreed - two things have to hold before the duty is
    displaced: the product is fitted to a particular purpose for a particular business user, AND
    both parties have explicitly agreed to a different set of contractual terms. Report it as that
    reading rather than as a settled test, and say which limb you think is or is not met. What is
    not arguable on either reading: silence between the parties does not displace the duty, and
    neither does the product merely being sold to businesses. WHETHER A PRODUCT IS TAILOR-MADE AND
    WHETHER SUCH AN AGREEMENT EXISTS ARE FACTS ABOUT THE PRODUCT AND ITS CONTRACTS: ask the person
    running the scan, or read their declared documents. Do not infer either from vocabulary in the
    tree - an enterprise pricing page, a per-seat licence check or a paid-tier feature flag
    establishes neither, and the measurement found paid-tier vocabulary to be almost entirely
    translation strings about plans in general. What the tree CAN show, and what is worth quoting if
    it is there, is a security fix placed behind a paid tier or a support contract, or a release
    channel where the version carrying security fixes is available only to paying users. If you find
    that, report it as a question against point (8) and name the two conditions above that would
    have to be met for it to be permitted."
  - "Does the automatic-update limb apply to this product, and if not, has that been justified?
    Point (7) ends 'where applicable for security updates, in an automatic manner', and the
    qualifier carries real weight. Recital 56 disapplies the automatic-update requirements for two
    classes: products primarily intended to be integrated as components into other products, and
    products for which users would not reasonably expect automatic updates, expressly including
    products intended to be used in professional ICT networks and especially in critical and
    industrial environments where an automatic update could interfere with operations. A great deal
    of what this scanner is pointed at falls in one of those - a library, an SDK, a component
    distributed for integration, a self-hosted server for a professional network. Two cautions.
    First, this is a RECITAL and the operative hook is only the words 'where applicable'; Recital
    56's own phrase 'as set out in an annex to this Regulation' names neither Annex I Part II point
    (7) nor Annex I Part I point (2)(c), and both carry automatic-update language, so report it as
    the recital's guidance on the qualifier and not as an operative exemption. Second, the
    disapplication is narrow: it removes the automatic limb only. Recital 56 says in terms that
    irrespective of whether a product is designed to receive automatic updates, its manufacturer
    should inform users about vulnerabilities and make security updates available without delay, so
    points (2) and (8) and the rest of point (7) stand. Where the conclusion is that the limb does
    not apply, Art. 13(4) supplies the consequence: a clear justification to that effect belongs in
    the technical documentation. Whether the product is a component for integration or is intended
    for a professional or industrial environment is a fact about the product, asked of the person
    running the scan and never read out of source vocabulary."
  - "Are new security updates provided SEPARATELY from functionality updates, where that is
    technically feasible? This is the second limb of point (2) - not, as an earlier description of
    this row had it, part of point (8) - and the qualifier is 'where technically feasible' rather
    than any looser form. Recital 57 gives the mischief: users should not have to install new
    functionality updates for the sole purpose of receiving the latest security updates. NO DEFINED
    LINE EXISTS BETWEEN THE TWO KINDS OF UPDATE. Article 3 defines neither update nor security
    update nor functionality update nor feature update; all 51 definitions were enumerated and none
    of those terms is among them. The only guidance is Recital 39, and it works by example: a
    security update designed to decrease cybersecurity risk that does not modify the intended
    purpose is not a substantial modification and usually entails only minor adjustments of the
    source code, while a feature update that modifies the original intended functions or the type or
    performance of the product is one. So state the boundary as the recital does and do not present
    it as a definition. What to look for in the repository, and it is process evidence rather than
    code: a maintenance or patch branch that receives fixes without receiving features; release
    notes or a changelog that separate security fixes from other changes; a versioning policy under
    which a security fix ships as a patch release on an existing line rather than only in the next
    feature release; a supported-versions statement that backports fixes. Where everything ships in
    one stream, the question to answer is not whether that is permitted but whether separating them
    would be technically feasible for this product - and that is a judgment for the team, which the
    finding should ask for rather than pre-empt."
  - "Do updates carry ADVISORY MESSAGES, and does the product tell users what they need to know?
    Point (8) requires that disseminated updates be 'accompanied by advisory messages providing
    users with the relevant information, including on potential action to be taken'. This is a
    communication duty inside the dissemination point and it is distinct from three neighbouring
    things it is easy to merge with: Annex I Part II point (4), which is the public disclosure of
    information about a fixed vulnerability once the update is available; Annex I Part I point
    (2)(c), which is the product-side notification that an update EXISTS; and Annex II, which is the
    standing instructions that travel with the product. Look for what accompanies a release rather
    than what announces it: release notes that say what a security fix addresses and what a user
    should do (restart, rotate a credential, change a configuration, apply a workaround where the
    update cannot yet be installed); a security advisory published alongside the release; an
    in-product message shown when an update is offered. A version number and a download link on
    their own are not advisory messages. Separately, the standing information Annex II requires is
    its own check: point 7, the type of technical security support and the END-DATE of the support
    period during which users can expect vulnerabilities to be handled and to receive updates; point
    8(c), how security-relevant updates can be installed; and point 8(e), how to turn off the
    default that installs security updates automatically. Annex II point 8 allows an internet
    address referring to detailed instructions rather than the instructions themselves, so a
    documentation link satisfies the form. Report which of those a user could actually find, and
    from where."
  - "Would each security update still be retrievable in ten years, and does the
    substantial-modification limitation apply? Two separate provisions, both missed by every earlier
    description of this row, and they pull in opposite directions. Art. 13(9) ADDS a duty: each
    security update made available during the support period must remain available after it is
    issued 'for a minimum of 10 years or for the remainder of the support period, whichever is
    longer'. Read the comparison carefully - the ten years is a floor and not a cap, the clock runs
    per update from the date that update is issued, and the duty is availability rather than
    re-issue. What that means in practice, and what to look for: whether old releases are retained
    or pruned; whether the release channel is one the team controls or one a third party could
    remove; whether a registry retention policy, an expiring artifact store or a garbage-collected
    CI artifact would take a two-year-old security release offline; whether a container image tag is
    overwritten in place, which leaves no retrievable older build at all. Art. 13(11) permits a
    public software archive of historical versions, with a clear warning to users about the risks of
    running unsupported software, and that is the shape most teams reach for. Art. 13(10) LIMITS the
    other direction: where a manufacturer has placed subsequent substantially modified versions of a
    software product on the market, compliance with point (2) may be ensured for the last version
    placed on the market ONLY - provided users of the earlier versions have access to that last
    version free of charge and incur no additional cost to adjust the hardware and software
    environment they run it in. Both conditions must hold, and Recital 40 confines the relief to
    point (2): a manufacturer relying on it still owes the other Part II requirements for every
    version. If the repository shows several supported major lines, or a policy of fixing only the
    newest, ask which of the two provisions the team is relying on and whether its conditions are
    actually met."
  - "For a matched runtime pin, is the pinned version still supported by whoever maintains that
    runtime? The detector found a pin and nothing more. It cannot answer this, on purpose: a pin is
    a version and not a date, and knowing when a version left support requires either a network call
    this scanner does not make or knowledge the scanner does not carry - but YOU carry it. Take each
    matched pin - a base image tag, a language-setup version input in CI, a whole-line version in a
    runtime-version file, a build-tool distribution URL - and say, from your own knowledge of that
    runtime's published support calendar, whether that version is still receiving security fixes,
    and if not, roughly when it stopped. Where the pin is indirect, say so and resolve it from the
    surrounding files if you can, rather than guessing. Three indirect shapes you will meet, and
    what the detector does with each: a MATRIX ARRAY such as `node-version: [24.x]` is matched, and
    in at least one measured repository the array lines are the only ones carrying the number the
    expressions elsewhere refer to, so start there - but READ THE WHOLE ARRAY, because it may name
    SEVERAL versions rather than one. `php-version: ['8.4.1', '8.5']` and `python-version: ['3.11',
    '3.12']` both occur in the corpus, and an array of that shape is a test matrix rather than a
    pin: it tells you which runtimes the project builds against, not which one the artifact it ships
    is built on. Determining that is yours to do and it is a fact about the product - read the
    release pipeline, the container image or the packaging configuration, or ask the person running
    the scan - and where a matrix leg names an out-of-support runtime but the shipped artifact does
    not use it, say both things rather than either alone; an EXPRESSION such as `node-version: ${{
    matrix.node-version }}`, an EMPTY action input and a floating channel word such as `lts/*` or
    `stable` are no longer raised at all, because they name no version and a support calendar cannot
    be consulted for them - if you need them, they are in the file beside the locations you were
    given; and a DIGEST pin such as `FROM node@sha256:...` is deliberately not raised for the same
    reason, so where a build uses digests you will have to resolve the digest to a version from the
    lock or build metadata, or record that you could not. Then connect it to the duty rather than
    reporting it as hygiene: a product built on a runtime that no longer receives security fixes
    cannot remediate vulnerabilities in that runtime by updating it, which is what Annex I Part II
    point (2) asks for, and Art. 13(6) puts the vulnerabilities of integrated components inside the
    same duty. Recital 34 is the nearest the Regulation comes to naming this, and it names it as due
    diligence on components - one of its examples is verifying that a component receives regular
    security updates by checking its security-update history - rather than as a prohibition on old
    pins. Two things this question does NOT ask you to do: do not treat an old pin as a finding on
    its own, since a pinned runtime inside a development container or a documentation example is not
    what the product ships; and do not read the absence of a pin as anything at all."
  - "Is the party behind this repository a manufacturer or an open-source software steward? They are
    different addressees with different duties. Art. 3(13) makes a manufacturer anyone who develops
    a product with digital elements 'and markets them under its name or trademark, whether for
    payment, monetisation or free of charge'. Art. 3(14) makes a steward 'a legal person, other than
    a manufacturer' that systematically sustains the development of free and open-source software
    'intended for commercial activities' and ensures its viability; Recital 19 names foundations and
    entities publishing open source in a business context. A steward owes the Art. 24(1) documented
    cybersecurity policy plus cooperation with market surveillance, and owes none of the duties this
    rule asks about - not the point (2) remediation duty, not the point (7) mechanism, not the point
    (8) dissemination duty, not Art. 13(9)'s availability tail and not Annex II. A team publishing
    its own application is not a steward of that application. Where the repository belongs to a
    foundation sustaining somebody else's ecosystem, record that this rule's duties are the wrong
    instrument and that Art. 24 is the one to read. On administrative fines, keep to what Art.
    64(10) provides and say no more than it does. Point (b) disapplies 'the administrative fines
    referred to in those paragraphs' for 'any infringement of this Regulation by open-source
    software stewards', and its chapeau - as corrected by the corrigendum published as OJ L,
    2025/90555 of 2 July 2025, which is the reading the consolidated text carries - derogates from
    paragraphs 2 to 9. Paragraph 2 is the tier covering Annex I and Articles 13 and 14, so it is
    inside the derogation, and Recital 120's closing sentence reads with the article rather than
    against it. This question is nevertheless about the duty and not about the fine: report that the
    point (2), point (7) and point (8) duties, Art. 13(9) and Annex II do not attach to a steward,
    and leave what a national authority may impose to whoever asks about it, since Art. 64(1) leaves
    the rules on penalties to the Member States."
  - "What is the date position, and how should the finding be worded? Every duty this rule asks
    about applies from 11 December 2027 (Art. 71(2), first subparagraph). None of them is among the
    provisions the second subparagraph brings forward: only Article 14 (11 September 2026) and
    Chapter IV, Articles 35 to 51 (11 June 2026), move earlier, and Article 14 is a separate
    reporting obligation this rule does not test. Art. 69(2) additionally grandfathers products
    placed on the market before 11 December 2027 unless they are substantially modified from that
    date. NOTHING HERE IS CHARGEABLE TODAY, and the finding is written as preparation for a dated
    obligation rather than as a present shortfall. Two things make that more than a formality on
    this row. First, the lead time is real: an update channel, an artifact archive with a ten-year
    floor and a release process that separates security fixes from features are quarters of work,
    not a file. Second, Art. 13(9)'s clock runs from the moment each update is ISSUED, so updates a
    team ships after the application date start accruing a ten-year availability obligation
    immediately, and a retention policy set today is the thing that decides whether that obligation
    can be met. Where the product is already on the market, note the Art. 69(2) position, and say
    which kind of product it is, because placing on the market is per individual product (Recital
    38): standalone software already released comes fully within the Regulation on a substantial
    modification after the application date (and a new product or variant first released from that
    date is within it then), while for hardware and firmware every unit placed on the market from 11
    December 2027 must comply, of an old model or a new one."
evidence_template: "{file}:{line} evidences ONE OF TWO UNRELATED THINGS, OR NEITHER, and which of
  the three it is has to be read off the matched line before anything else: either a path by which
  software supplied from this repository is updated on somebody else's machine, or a runtime version
  pinned to a particular release or major line - or neither of those, which is a real answer and one
  you may return. The version-shaped alternative matches a bare semantic version standing alone on a
  line, and a shipped data file can carry one: in the corpus a word-list entry inside a
  common-password dictionary reads `0.0.000` and is neither an update path nor a runtime pin. Where
  a location is neither, say so and report nothing against it. READ THE LOCATIONS BEFORE ACCEPTING
  THE HEADLINE. This rule is a single finding per repository, and a candidate can rest entirely on
  pinned runtime versions - a container base-image tag, a language-setup version in continuous
  integration, a .nvmrc - with NO update-mechanism evidence anywhere in it. On the 31-repository
  corpus that is the case for 8 of the 31, so it is the ordinary case and not an edge one. Where
  every location is a runtime pin, say so and answer context question 9 alone; do not report an
  update-mechanism finding that no matched line evidences. What either kind of line establishes is
  that CRA Annex I Part II points (2), (7) and (8) and Art. 13(9) are live questions for whatever
  this repository supplies. It is not evidence that those duties are met, and it is not evidence
  that they are unmet. The detector cannot see whether updates are disseminated without delay,
  whether they are free of charge, whether they carry advisory messages, whether they are separated
  from functionality updates, whether they install automatically where that applies, or whether each
  one stays retrievable for ten years - all six are asked of the adjudicating agent in
  context_questions. For an update-path line, check first whether it is a delivery mechanism at all
  (a version check with no delivery behind it may not be) and whose mechanism it is; for a runtime
  pin, check whether the pinned version still receives security fixes"
remediation_template: >
  This is a candidate for review against CRA (Regulation (EU) 2024/2847) Annex I, Part II,

  points (2), (7) and (8), Art. 13(9) and Art. 13(10), not a determination about this repository.

  What the scan established is narrower than it may look: this tree carries evidence of an update

  delivery path, or of a runtime pinned to a specific version. It did NOT check whether any of the

  duties below are met, and finding an updater here is not evidence that they are.

  Six requirements sit behind those provisions. They are separate, a product can meet some and not

  others, and a finding should name which one it is about rather than asking for an updater in

  general.

  1. REMEDIATE WITHOUT DELAY - point (2). Vulnerabilities in the product, including in its
     third-party and open-source components (Art. 13(6)), are addressed and remediated without
     delay, including by providing security updates. Art. 13(6) adds a second duty on the same
     facts: report the component vulnerability to whoever maintains that component, and share the
     fix with them where you developed one.
  2. SEPARATE SECURITY FROM FUNCTIONALITY - point (2), second limb, where technically feasible.
     A user should not have to accept new functionality in order to receive a security fix
     (Recital 57). In practice this is a maintenance line that receives fixes without features, a
     patch release on an existing version rather than only the next feature release, and release
     notes that distinguish the two. The Regulation defines neither term; Recital 39 draws the line
     by example, a security update being one whose purpose is to decrease cybersecurity risk
     without modifying the intended purpose.
  3. DISTRIBUTE SECURELY, AND AUTOMATICALLY WHERE THAT APPLIES - point (7). A mechanism that
     delivers updates so that vulnerabilities are fixed or mitigated in a timely manner, and where
     applicable for security updates, in an automatic manner. Securely is the operative word: an
     updater-specific signing key held separately from the platform code-signing identity,
     verification of the downloaded artifact before it is applied, and a feed the client can
     authenticate. Recital 56 disapplies the automatic limb for products primarily intended to be
     integrated as components into other products, and for products whose users would not
     reasonably expect automatic updates - expressly including professional ICT networks and
     critical or industrial environments. Where that applies to your product, Art. 13(4) asks for a
     clear justification in the technical documentation rather than for silence. The rest of point
     (7) still stands.
  4. DISSEMINATE WITHOUT DELAY, FREE OF CHARGE, WITH ADVISORY MESSAGES - point (8). Three limbs in
     one sentence. Without delay is its own timing standard, separate from point (2)'s. Free of
     charge is displaced where the product is tailor-made and the parties have agreed otherwise, and
     on the reading this rule takes - drawn from Recital 64, and a reading rather than settled law -
     BOTH limbs have to hold: the product is fitted to a particular purpose for a particular
     business user, and both parties have explicitly agreed a different set of contractual terms.
     What is not arguable either way is that the duty is not displaced merely because the customer
     is a business, nor by silence between the parties. Advisory messages must give users the relevant
     information, including on potential action to be taken: what the fix addresses, and what the
     user has to do (restart, rotate a credential, apply a workaround where the update cannot yet
     be installed). A version number and a download link are not advisory messages.
  5. KEEP EACH UPDATE RETRIEVABLE - Art. 13(9). Each security update made available during the
     support period must remain available after it is issued for a minimum of 10 years or for the
     remainder of the support period, whichever is longer. The clock runs per update, from the date
     that update was issued, and the ten years is a floor rather than a cap. What usually breaks
     this is not the release process but retention: a registry policy that prunes old versions, a
     CI artifact store that expires, or a container tag overwritten in place so no older build
     survives. Art. 13(11) permits a public archive of historical versions, provided users are
     clearly informed about the risks of running unsupported software.
  6. TELL THE USER - Annex II points 7, 8(c) and 8(e). The type of technical security support and
     the END-DATE of the support period; how security-relevant updates can be installed; and how to
     turn off the default that installs them automatically. Annex II point 8 allows an internet
     address referring to detailed instructions, so a documentation page satisfies the form.
  Where the product has been substantially modified into successive versions, Art. 13(10) is the

  one relief provision: point (2) may be discharged for the last version placed on the market only,

  provided users of the earlier versions get that version free of charge and incur no additional

  cost to adjust the hardware and software environment they run it in. Both conditions have to

  hold, and Recital 40 confines the relief to point (2) - the other Part II duties continue for

  every version.

  If the matched line is a RUNTIME PIN rather than an updater, the question is different: a product

  built on a runtime that no longer receives security fixes cannot remediate vulnerabilities in

  that runtime by updating it. Check the pinned version against that runtime's published support

  calendar, and treat a development-container or documentation pin differently from the one the

  shipped artifact is built on.

  Dates, so the work can be scheduled rather than rushed. All of the above applies from

  11 December 2027 (Art. 71(2)): to every hardware unit placed on the market from that date, and to

  software first released, or substantially modified, from that date (Art. 69(2)). Nothing here is

  chargeable before then. Two things still argue for

  starting early: an update channel, an artifact archive with a ten-year floor and a release

  process that separates security fixes from features are quarters of work rather than a file; and

  Art. 13(9)'s ten-year clock starts on the day each update is issued, so a retention policy chosen

  now decides whether that obligation can be met later. Recital 31 records a second exposure that

  is not a fine at all: where a lack of security updates after placing the product on the market

  causes damage, the manufacturer's liability under the product liability regime can be triggered

  irrespective of fault.

  Where the repository belongs to a foundation or entity that sustains open-source software it does

  not itself market, read Art. 24 instead: a steward owes a documented cybersecurity policy and

  cooperation with market surveillance, and none of the six requirements above.

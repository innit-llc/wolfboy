  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 24 and Art. 3(14) - open-source
      software stewards, a DIFFERENT addressee from the manufacturer, with a lighter regime and none
      of the three duties this rule asks about. Art. 3(14) defines a steward as 'a legal person,
      other than a manufacturer, that has the purpose or objective of systematically providing
      support on a sustained basis for the development of specific products with digital elements,
      qualifying as free and open-source software and intended for commercial activities, and that
      ensures the viability of those products'. Art. 24(1) states what a steward owes instead:
      stewards 'shall put in place and document in a verifiable manner a cybersecurity policy to
      foster the development of a secure product with digital elements as well as an effective
      handling of vulnerabilities by the developers of that product.' Art. 24(2) requires
      cooperation with market surveillance authorities and production of that documentation on
      reasoned request, and Art. 24(3) applies only Art. 14(1) and Art. 14(3) and (8) to stewards. A
      steward therefore owes a documented cybersecurity policy and not the Annex I Part II point (2)
      remediation duty, not the point (7) secure distribution mechanism, not the point (8)
      dissemination duty, not the Art. 13(9) availability tail and not the Annex II accompanying
      information - which is the distinction this entry exists to draw, and it holds on the
      operative words of Art. 24 alone. Recital 19 confines the category to 'legal persons who
      provide support on a sustained basis for the development of such products which are intended
      for commercial activities, and who play a main role in ensuring the viability of those
      products', naming 'certain foundations as well as entities that develop and publish free and
      open-source software in a business context'. A solo developer or a small team publishing their
      own application is a manufacturer if they market it under their own name in the course of a
      commercial activity, and is outside the Regulation entirely if they do not; they are not
      stewards of their own product. On fines, say only what the operative text says, and note that
      the operative text changed on 2 July 2025. Art. 64(10), point (b), names 'any infringement of
      this Regulation by open-source software stewards'. Its chapeau was corrected by the
      corrigendum published as OJ L, 2025/90555 of 2 July 2025 and reads, in the consolidated text
      at CELEX 02024R2847-20241120, 'By way of derogation from paragraphs 2 to 9, the administrative
      fines referred to in those paragraphs shall not apply to the following:'; the base Official
      Journal text at CELEX 32024R2847, which this entry's url names because of its recital quotes,
      is not corrected in place and still serves the range beginning at paragraph 3. Paragraph 2 is
      the tier reaching Annex I and Articles 13 and 14, so it is inside the corrected range, and
      Recital 120's closing sentence reads with the operative provision rather than against it. This
      entry stated the opposite until 2026-09-07. What this rule turns on is the duty and not the
      fine: the Annex I Part II point (2), point (7) and point (8) duties, the Art. 13(9)
      availability tail and the Annex II accompanying information do not attach to a steward, and
      Art. 64(1) leaves the rules on penalties to the Member States. Nothing in this rule's
      detection turns on the point either way."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 64(2), with Recital 31 and Recital 61.
      Art. 64(2): 'Non-compliance with the essential cybersecurity requirements set out in Annex I
      and the obligations set out in Articles 13 and 14 shall be subject to administrative fines of
      up to EUR 15 000 000 or, if the offender is an undertaking, up to 2,5 % of the its total
      worldwide annual turnover for the preceding financial year, whichever is higher' - the phrase
      of the its is the Official Journal wording and is reproduced rather than corrected. That tier
      reaches both Annex I and Article 13, so every provision in entries (1) to (5) attracts it.
      Art. 64(5)(c) requires due regard to 'the size, in particular with regard to microenterprises
      and small and medium sized-enterprises, including start-ups, and the market share of the
      economic operator'. Art. 64 sits in Chapter VII and therefore applies from 11 December 2027
      under Art. 71(2). A SECOND EXPOSURE, WHICH IS NOT A FINE AND IS THE ONE MOST DIRECTLY ABOUT
      MISSING UPDATES: Recital 31 records that the new product liability regime 'establishes the
      principle that the manufacturer of a product is liable for damages caused by a lack of safety
      in their product irrespective of fault (strict liability). Where such a lack of safety
      consists in a lack of security updates after the placing on the market of the product, and
      this causes damage, the liability of the manufacturer could be triggered. Obligations for
      manufacturers that concern the provision of such security updates should be laid down in this
      Regulation.' Failing to supply security updates is therefore not only a CRA fine exposure; it
      is a route into strict liability under Directive (EU) 2024/2853. Recital 61 states what the
      Regulation encourages once a support period ends: 'When products with digital elements reach
      the end of their support periods, in order to ensure that vulnerabilities can be handled after
      the end of the support period, manufacturers should consider releasing the source code of such
      products with digital elements either to other undertakings which commit to extending the
      provision of vulnerability handling services or to the public.' That is a should in a recital
      and not an obligation, and it is quoted because it is the only place the Regulation addresses
      what happens to a product after its support period, which is the question a developer reads
      Art. 13(9) and immediately asks. Recital 38 fixes the other end of the timeline: 'for a
      product type, each individual product with digital elements should have received all security
      patches or updates available to address relevant security issues when it is placed on the
      market'."

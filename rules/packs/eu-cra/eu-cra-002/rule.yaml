  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), the free-of-charge limb of Annex I Part II
      point (8) and its tailor-made carve-out, with Recital 64 and the parallel carve-out in Annex I
      Part I point (2)(b). The carve-out is written into point (8) as a condition on the
      free-of-charge words: 'unless otherwise agreed between a manufacturer and a business user in
      relation to a tailor-made product with digital elements'. Recital 64 is the only elaboration:
      'Manufacturers should make their products with digital elements available on the market with a
      secure by default configuration and provide security updates to users free of charge.
      Manufacturers should only be able to deviate from the essential cybersecurity requirements in
      relation to tailor-made products that are fitted to a particular purpose for a particular
      business user and where both the manufacturer and the user have explicitly agreed to a
      different set of contractual terms.' A tailor-made product with digital elements is NOT among
      the 51 Article 3 definitions. Reading the operative words with Recital 64, two conditions have
      to hold before the free-of-charge duty is displaced - the product is fitted to a particular
      purpose for a particular business user, AND there is an explicit agreement to a different set
      of contractual terms - so silence between the parties does not displace it. That two-limb
      reading is drawn from Recital 64 and should be presented as a reading rather than as settled
      law, since the operative text says only that it is displaced where otherwise agreed in
      relation to a tailor-made product. A carve-out of the same shape sits on a different duty in
      Annex I Part I point (2)(b), which is quoted so that a reader searching on the phrase does not
      mistake one for the other: 'be made available on the market with a secure by default
      configuration, unless otherwise agreed between manufacturer and business user in relation to a
      tailor-made product with digital elements, including the possibility to reset the product to
      its original state;'. Note the wording differs slightly between the two - Part I point (2)(b)
      says between manufacturer and business user, point (8) says between a manufacturer and a
      business user. Searching the Regulation for the tailor-made phrase returns four locations and
      five occurrences, because Recital 19 uses it twice: the two operative provisions above,
      Recital 64, and Recital 19 - which is a false friend and will be hit by any such search,
      because it uses the same word to describe the open-source steward regime as a 'light-touch and
      tailor-made regulatory regime' and has nothing to do with tailor-made products. WHETHER A
      PRODUCT IS TAILOR-MADE, AND WHETHER A BUSINESS USER HAS AGREED DIFFERENT CONTRACTUAL TERMS,
      ARE FACTS ABOUT THE PRODUCT AND ITS CONTRACTS. They are asked of the person running the scan
      or read from their declared documents, and they are never inferred from vocabulary in the
      tree."

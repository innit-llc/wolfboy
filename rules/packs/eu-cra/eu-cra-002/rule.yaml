id: eu-cra-002
pack: eu-cra
short_name: Update delivery path, or a pinned runtime version
problem_line:
  text: "Update path or runtime pin: CRA duties from Dec 2027"
fix_line: Ship secure, free security fixes with advisories, split if feasible, kept 10+ yrs, on
  supported runtimes; CRA from 2027.
title: Update delivery path or pinned runtime - CRA remediation, secure distribution and
  dissemination duties from 2027-12-11
jurisdiction:
  - EU
legal_basis:
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Annex I, Part II (Vulnerability handling
      requirements), chapeau and points (2), (7) and (8) - the three duties this rule asks about.
      Chapeau: 'Manufacturers of products with digital elements shall:'. Point (2): 'in relation to
      the risks posed to products with digital elements, address and remediate vulnerabilities
      without delay, including by providing security updates; where technically feasible, new
      security updates shall be provided separately from functionality updates;'. Point (7):
      'provide for mechanisms to securely distribute updates for products with digital elements to
      ensure that vulnerabilities are fixed or mitigated in a timely manner and, where applicable
      for security updates, in an automatic manner;'. Point (8): 'ensure that, where security
      updates are available to address identified security issues, they are disseminated without
      delay and, unless otherwise agreed between a manufacturer and a business user in relation to a
      tailor-made product with digital elements, free of charge, accompanied by advisory messages
      providing users with the relevant information, including on potential action to be taken.'.
      The addressee named in the chapeau is the MANUFACTURER, defined in Art. 3(13) as 'a natural or
      legal person who develops or manufactures products with digital elements or has products with
      digital elements designed, developed or manufactured, and markets them under its name or
      trademark, whether for payment, monetisation or free of charge'. FIVE THINGS ABOUT HOW THE
      DUTIES DIVIDE ACROSS THESE THREE POINTS, EVERY ONE OF WHICH THE FIRST DESCRIPTION OF THIS
      COVERAGE-MAP ROW GOT WRONG; the corrections and the searches that establish them were made
      against the Official Journal text on 2026-08-05, and each is stated in full below rather than
      pointed at. (i) The separation requirement - new security updates supplied apart from
      functionality updates - is the SECOND LIMB OF POINT (2). It is absent from point (8) and from
      everywhere else in the operative text: searching the whole Regulation for the words 'where
      technically feasible' returns exactly three hits, being Annex I Part II point (2), Recital 57
      which elaborates that same point, and Art. 13(19) second subparagraph, which is the
      end-of-support notification and a different duty. A finding that cites point (8) for the
      separation requirement cites the wrong point. (ii) The qualifier on that limb is 'where
      technically feasible'. The Regulation also uses 'where applicable' and, in Art. 13(19), 'Where
      technically feasible in light of the nature of the product with digital elements'; the three
      phrases have different scopes and the shorter form without the word technically is not the
      text. (iii) The subject of that limb is 'new security updates', not updates generally. (iv)
      Point (8) carries an advisory-messages limb, which no earlier description of this row
      mentioned: an update must be 'accompanied by advisory messages providing users with the
      relevant information, including on potential action to be taken'. That is a communication duty
      sitting inside the dissemination point, and it is distinct from the Annex II duties in
      legal_basis entry (5). (v) The words 'without delay' attach to BOTH points and to different
      acts: point (2) requires the manufacturer to 'address and remediate vulnerabilities without
      delay', point (8) requires that available updates 'are disseminated without delay'.
      Remediation and dissemination are separately timed. One structural point, because it changes
      how a reader should hear the qualifiers: Part II's chapeau is unconditional. Part I's point
      (2) chapeau opens 'On the basis of the cybersecurity risk assessment referred to in Article
      13(2) and where applicable, products with digital elements shall:'; Part II has no equivalent
      risk-assessment condition and no equivalent blanket qualifier, so the only conditions on
      points (2), (7) and (8) are the ones written inside those points."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-08-05
    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 13(8), Art. 3(20) and Annex VII points
      2(b) and 4 - the operative clause that binds Part II to the manufacturer, the period it runs
      for, and the documentation it has to produce. Art. 13(8), first subparagraph: 'Manufacturers
      shall ensure, when placing a product with digital elements on the market, and for the support
      period, that vulnerabilities of that product, including its components, are handled
      effectively and in accordance with the essential cybersecurity requirements set out in Part II
      of Annex I.' That subparagraph names Part II as a whole and singles out no point, so it
      reaches points (2), (7) and (8) exactly as it reaches points (5) and (6). Art. 3(20) closes
      the loop, defining the support period as 'the period during which a manufacturer is required
      to ensure that vulnerabilities of a product with digital elements are handled effectively and
      in accordance with the essential cybersecurity requirements set out in Part II of Annex I'.
      Art. 13(8), third subparagraph, sets the floor and its one downward exception: 'Without
      prejudice to the second subparagraph, the support period shall be at least five years. Where
      the product with digital elements is expected to be in use for less than five years, the
      support period shall correspond to the expected use time.' The fourth subparagraph
      additionally empowers the Commission to raise category-specific minima by delegated act, so
      five years is a default minimum rather than an absolute one. Annex VII point 2(b) is what a
      manufacturer must be able to hand a market surveillance authority for point (7): 'necessary
      information and specifications of the vulnerability handling processes put in place by the
      manufacturer, including the software bill of materials, the coordinated vulnerability
      disclosure policy, evidence of the provision of a contact address for the reporting of the
      vulnerabilities and a description of the technical solutions chosen for the secure
      distribution of updates;'. The closing clause of that point - a description of the technical
      solutions chosen for the secure distribution of updates - is the documentation that point (7)
      turns into paperwork. Annex VII point 4 requires 'relevant information that was taken into
      account to determine the support period pursuant to Article 13(8) of the product with digital
      elements;'. One framing point worth carrying into any finding: Art. 13(12), third
      subparagraph, speaks of 'the processes put in place by the manufacturer' being assessed
      against Part II, and the same pairing recurs in Art. 13(21) and Art. 13(22). Part I is
      assessed as a property of the artefact; Part II is assessed as a process of the manufacturer.
      A repository can evidence a process; it cannot by itself discharge one."

    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 13(9) - a distinct obligation naming
      Annex I Part II point (8) expressly, and the only one in this rule that can outlast the
      support period: 'Manufacturers shall ensure that each security update, as referred to in Part
      II, point (8), of Annex I, which has been made available to users during the support period,
      remains available after it has been issued for a minimum of 10 years or for the remainder of
      the support period, whichever is longer.' Three readings that matter and are easy to get
      backwards. First, the comparison runs to whichever period is LONGER, so the ten years is a
      floor and not a cap: where a support period still has twelve years to run, an update issued
      today has to remain available for those twelve. Second, the clock is per update - it starts
      when that individual update is issued, not when the product is placed on the market - so a
      manufacturer with a ten-year support period and updates issued throughout it owes availability
      for close to twenty years measured from first supply. Third, it is an AVAILABILITY duty, not a
      re-issue duty: the update has to remain retrievable by a user who needs it, which is a
      question about archives, artifact registries and download endpoints rather than about the
      release pipeline that produced it. Art. 13(11) is the adjacent permission and is quoted
      because it is the shape a manufacturer usually reaches for: 'Manufacturers may maintain public
      software archives enhancing user access to historical versions. In those cases, users shall be
      clearly informed in an easily accessible manner about risks associated with using unsupported
      software.' Note that Art. 13(11) is permissive and Art. 13(9) is mandatory; keeping an archive
      is optional, keeping each issued security update retrievable is not."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-08-05
    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 13(6) - how a vulnerability in a
      third-party or open-source component enters the point (2) remediation duty: 'Manufacturers
      shall, upon identifying a vulnerability in a component, including in an open source-component,
      which is integrated in the product with digital elements report the vulnerability to the
      person or entity manufacturing or maintaining the component, and address and remediate the
      vulnerability in accordance with the vulnerability handling requirements set out in Part II of
      Annex I. Where manufacturers have developed a software or hardware modification to address the
      vulnerability in that component, they shall share the relevant code or documentation with the
      person or entity manufacturing or maintaining the component, where appropriate in a
      machine-readable format.' Two duties, not one: report upstream, and remediate in the product.
      Recital 34 states the same reach in terms - 'The vulnerability handling obligations set out in
      this Regulation, which manufacturers have to comply with when placing a product with digital
      elements on the market and for the support period, apply to products with digital elements in
      their entirety, including to all integrated components.' - and describes the due diligence
      expected when a component is integrated, one of its named actions being 'verifying that a
      component receives regular security updates, such as by checking its security updates
      history'. That sentence is the closest the Regulation comes to the staleness question this
      rule's runtime-pin branch is aimed at, and it is worded as due diligence on components rather
      than as a prohibition on old pins."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-08-05
    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Annex II (Information and instructions to
      the user), chapeau and points 7, 8(c) and 8(e) - what has to travel with the product about
      updates. Chapeau: 'At minimum, the product with digital elements shall be accompanied by:'.
      Point 7: 'the type of technical security support offered by the manufacturer and the end-date
      of the support period during which users can expect vulnerabilities to be handled and to
      receive security updates;'. Point 8 opens 'detailed instructions or an internet address
      referring to such detailed instructions and information on:', so a URL satisfies the form, and
      its sub-point (c) requires information on 'how security-relevant updates can be installed;'
      while sub-point (e) requires information on 'how the default setting enabling the automatic
      installation of security updates, as required by Part I, point (2)(c), of Annex I, can be
      turned off;'. Sub-point (e) is the only place in Annex II that names an Annex I point by
      number, and the point it names is Part I point (2)(c) - the product-side automatic-update
      property - and not Part II point (7). None of these three requires telling a user that a
      SPECIFIC update exists; that duty is the advisory-messages limb of Annex I Part II point (8)
      in legal_basis entry (1), and the notification limb of Annex I Part I point (2)(c) in entry
      (7). THE POINTS THIS ENTRY DOES NOT QUOTE, NAMED SO THAT THE LIST ABOVE IS NOT MISTAKEN FOR AN
      EXHAUSTIVE READING OF ANNEX II. Annex II has nine points. Points 1, 2, 3, 5 and 6 and
      sub-points 8(a), 8(b), 8(d) and 8(f) do not bear on updates, and point 2 - the single point of
      contact and where the coordinated vulnerability disclosure policy can be found - is the
      subject of eu-cra-001. Point 4 is contextual only: it requires the intended purpose, the
      security environment provided by the manufacturer and information about the security
      properties, which frames an update question without asking one. Point 9 was omitted from this
      enumeration until 2026-08-05 and is named now: it requires, where the manufacturer decides to
      make the software bill of materials available to the user, information on where it can be
      accessed. That is conditional on a manufacturer decision and belongs to the
      software-bill-of-materials row rather than to this one, but a reader is entitled to see it
      accounted for rather than absent. Note the formatting difference when citing: Annex II numbers
      its points in arabic numerals without parentheses, where Annex I parenthesises them."

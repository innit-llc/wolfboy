      |CFBundleIdentifier|com\.android\.application|^\s*"type"\s*:\s*"(?:project|library|metapackage|composer-plugin)"|^\s*"psr-4"\s*:|^\s*"psr-0"\s*:|^\s*"laravel"\s*:\s*\{

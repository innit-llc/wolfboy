context_questions:
  - "Does the Cyber Resilience Act reach what this repository supplies at all? Do not answer that
    from Art. 2(1) alone and do not re-derive the test here. Article 2 has eight paragraphs: the
    first brings a product in, and the other seven take it back out or limit what applies - Art.
    2(2) for products covered by the medical devices, in vitro diagnostic devices or motor vehicle
    Regulations, Art. 2(3) for products certified under the civil aviation Regulation, Art. 2(4) for
    marine equipment, Art. 2(5) for a delegated act limiting or excluding application, Art. 2(6) for
    spare parts replacing identical components, Art. 2(7) for products developed or modified
    exclusively for national security or defence and products designed to process classified
    information, and Art. 2(8) for information whose disclosure would be contrary to essential
    security interests. The whole test, decomposed into 37 limbs with the operative words of each
    paragraph quoted, is the shared scope gate `rules/gates/cra-scope.yaml`, and a scan evaluates
    that gate rather than leaving you to open a 37-limb file cold. Read the scan output first, in
    this order. (a) On this candidate, `depends_on_applicability`: one entry per checklist that
    names the gate - `cra-product-information-13-8` and `cra-sbom-annex-i-ii-1` today, both
    reporting the same gate, so two identical entries are one verdict and not two - each carrying
    `verdict` (applies, likely-applies, does-not-apply or unresolved) and `because`. (b) At the top
    level of the findings file, `applicability`: the same assessment in full, with every limb and
    its state, the evidence for and against each, `unresolved_limbs` naming what nothing settled,
    and `contradictions` where the person running the scan declared one thing and the tree shows
    another. If the verdict is does-not-apply, record that and stop: the duty this rule tests does
    not attach. If it is unresolved or likely-applies, work through the limbs named in
    `unresolved_limbs` using the questions the gate itself states, and note that every Art. 2(2) to
    2(8) limb turns on a fact about what the product IS - a medical device, a vehicle component,
    defence software - which is asked of the person running the scan or read from their declared
    documents, and is never inferred from vocabulary in the tree. If no applicability information
    reached you, say so plainly and answer the limbs by asking, rather than substituting a scope
    analysis of your own. Then the part that is specific to this rule and that the gate cannot do
    for you: quote what the repository actually ships - a container image, a signed desktop or
    mobile bundle, a published package, a firmware image - and quote the evidence that it is or is
    not monetised, since the matched lines carried under this candidate are where the supply and
    commercial-activity limbs of the gate get their code evidence. Where what ships is a service the
    team hosts itself, do not stop there: who operates the servers is not this Regulation's test.
    Art. 3(1) makes a product with digital elements 'a software or hardware product and its remote
    data processing solutions, including software or hardware components being placed on the market
    separately', and Recital 11 says that approach secures such products 'in their entirety by their
    manufacturers, irrespective of whether data is processed or stored locally on the user's device
    or remotely by the manufacturer'. Recital 12 conditions itself in its own first sentence - cloud
    solutions are remote data processing solutions 'only if they meet the definition laid down in
    this Regulation' - and introduces its inside case with 'For example', so the operative test
    stays Art. 3(2): data processing at a distance 'for which the software is designed and developed
    by the manufacturer, or under the responsibility of the manufacturer, and the absence of which
    would prevent the product with digital elements from performing one of its functions'. Ask that
    as two cumulative questions and quote your evidence for each. (a) Does this same party also make
    available something somebody else installs, runs or flashes, or a component placed on the market
    separately - a published package or library, a container image, a desktop or mobile bundle, a
    browser extension, a device, a firmware image? (b) Is the hosted service's software built by
    that party or under its responsibility, and would its absence stop one of that thing's functions
    from working? Where both are yes, the hosted service is inside the scope as that product's
    remote data processing solution, and Recital 11 states this audience's ordinary case in terms:
    'a mobile application requires access to an application programming interface or to a database
    provided by means of a service developed by the manufacturer. In such a case, the service falls
    within the scope of this Regulation as a remote data processing solution.' Say in the same
    breath how far that reaches, because a yes here is narrower than it looks: Recital 11 draws
    processing at a distance in 'only in so far as it is necessary for a product with digital
    elements to perform its functions', and adds that the requirements 'do therefore not entail
    technical, operational or organisational measures aiming to manage the risks posed to the
    security of a manufacturer's network and information systems as a whole', so the rest of the
    team's infrastructure does not come with it. What Recital 12 places outside is narrower than
    self-hosting: 'cloud services designed and developed outside the responsibility of a
    manufacturer of a product with digital elements', and 'websites that do not support the
    functionality of a product with digital elements'. Where (a) is no, so that nothing is supplied
    beyond the hosted service itself, say so plainly: software that executes on the manufacturer's
    own servers and is merely accessed by the user is not, on that basis alone, a product with
    digital elements. The Commission's guidance on the application of the Regulation reads Recitals
    11 and 12 so, and names as the typical case a web application, a progressive web app included,
    that users reach only through a web browser (C(2026) 5252 final of 27.7.2026, Annex, paragraph
    21 and Example 5; the Commission's reading of the recitals, not the text). That answer belongs
    to the gate's `is-a-product-with-digital-elements` limb, whose 'no' closes the gate and which
    only the person running the scan or their declared documents settle: report the limb, the answer
    the evidence points to and that evidence, and let the gate's verdict be what ends the enquiry;
    the only stop this question carries is the does-not-apply one above. Directive (EU) 2022/2555
    may reach the hosted service whichever way this comes out - Recital 12 routes cloud computing
    services and cloud service models, 'such as Software as a Service (SaaS), Platform as a Service
    (PaaS) or Infrastructure as a Service (IaaS)', to that Directive, and names entities at or above
    the medium-sized-enterprise thresholds of Recommendation 2003/361/EC - and it is a different
    instrument with different duties, not a lighter version of this one."
  - "Does this project publish a coordinated vulnerability disclosure policy AND a contact route a
    reporter could actually use? This is the question the finding turns on, and the detector does
    not answer any part of it - it only established that something is supplied from here. Until
    2026-07-27 a `guard_missing` clause answered it inside layer 1 and deleted the candidate when it
    thought the answer was yes; that mechanism is gone, so answer it yourself, by reading files.
    Look in every place a reporter would look, in this order: `SECURITY.md` at the repository root,
    `docs/SECURITY.md`, `.github/SECURITY.md`, `/.well-known/security.txt` (or `public/`, `static/`,
    `apps/docs/public/` copies of it), a `## Security` section of the README or CONTRIBUTING, and
    any security page the README links to. What counts as a policy: a document that names where a
    report goes and what happens to it - Recital 76 calls it 'a structured process through which
    vulnerabilities are reported to a manufacturer in a manner allowing the manufacturer to diagnose
    and remedy such vulnerabilities before detailed vulnerability information is disclosed to third
    parties or to the public'. What counts as a contact route: an RFC 9116 `Contact:` or `Policy:`
    field whose value is a security address or a security page; a monitored mailbox such as
    `security@`, `psirt@`, `secalert@`, `secops@`, `infosec@`, `appsec@`, `cve@`, `disclosure@` or
    `responsible-disclosure@` on the project's own domain; a GitHub private vulnerability reporting
    form at `/security/advisories/new` or the rendered `/security/policy` page; or the project's own
    programme page on a coordinated-disclosure platform (hackerone.com, bugcrowd.com, intigriti.com,
    yeswehack.com, huntr.com, openbugbounty.org, hackenproof.com) - Recital 76 puts bug-bounty
    programmes expressly inside the point (5) policy, so a programme page is the instrument itself.
    What does NOT count: a placeholder such as `security@example.com` or an address at a your-domain
    placeholder host, which no report reaches; a `SECURITY.md` that lists only supported versions
    and no route in; a dependabot configuration or a CI security-scanning job, which are inbound
    hygiene and not an intake path; a `# Security` heading with no address or link under it; and
    `/security/advisories` without `/new`, which is where fixed advisories are published (Annex I
    Part II point (4)) rather than where reports arrive. Quote the file and the line you relied on,
    or say that you looked in all of those places and found nothing."
  - "Is the policy somewhere this scan could not see? This is the known and expected reason for a
    candidate here to be wrong, and it must be checked before anything else is concluded. Look in
    this order. (a) An organisation-level `.github` community-health repository: GitHub serves a
    SECURITY.md from `<org>/.github` to every repository in the organisation that lacks its own, so
    the policy can be entirely absent from this tree and still be published on this repository's
    Security tab. (b) A same-repository `.github/SECURITY.md` or `.github/SECURITY.rst`: this is one
    of the three locations GitHub documents. The scanner CAN read it as of 2026-07-27 - the walker
    descends into `.github` - but `.rst` is not in SCAN_EXTS, and a policy in any other unread
    format under that directory is still invisible, so check the filesystem directly before
    concluding. One such case: a security contact address published in an issue template under
    `.github/ISSUE_TEMPLATE/`. (c) `/.well-known/security.txt` served by the deployed site rather
    than committed here - look at the deploy configuration, the CDN or reverse-proxy rules, the
    static-hosting redirects and any `public/` or `static/` directory of a separate website
    repository. (d) A separate documentation, marketing or handbook repository, or a security page
    on the product's own domain, linked from the README or the docs. (e) The org's other
    conventions: a `SECURITY` section in CONTRIBUTING.md, a security page in a docs site, or a
    vulnerability-reporting address in a support or trust centre. Say which of these you checked and
    what you found. If a policy exists anywhere a user could reasonably reach from the product,
    record that the candidate does not stand and stop."
  - "If you found an address or a link, is it the manufacturer's own intake path or somebody else's?
    This question exists for the mirror case: a repository that documents how to report
    vulnerabilities to an upstream dependency, a registry or a hosting provider has published
    nothing about its own product. Quote the address or URL and say whose domain, organisation or
    programme it belongs to. Annex I Part II point (6) asks for a contact address for
    vulnerabilities discovered 'in the product with digital elements' - the one this repository
    supplies."
  - "Which of the two duties is unmet - the policy or the address? They are separate. Annex I Part
    II point (5) requires the manufacturer to 'put in place and enforce a policy on coordinated
    vulnerability disclosure', which is a documented process for receiving a report, triaging it and
    coordinating the timing of public disclosure; Recital 76 describes it as 'a structured process
    through which vulnerabilities are reported to a manufacturer in a manner allowing the
    manufacturer to diagnose and remedy such vulnerabilities before detailed vulnerability
    information is disclosed to third parties or to the public'. Point (6) requires the address
    through which reports arrive. Annex II point 2 requires both to travel with the product: 'the
    single point of contact where information about vulnerabilities ... can be reported and
    received, and where the manufacturer's policy on coordinated vulnerability disclosure can be
    found'. A repository can satisfy one and not the other - a bare `security@` line in a README is
    an address with no process behind it, and an internal handbook page is a process nobody outside
    can reach. Report which limb is missing rather than reporting a single undifferentiated gap."
  - "Is the party behind this repository a manufacturer or an open-source software steward? They are
    different addressees with different duties. Art. 3(13) makes a manufacturer anyone who develops
    a product with digital elements 'and markets them under its name or trademark, whether for
    payment, monetisation or free of charge'. Art. 3(14) makes a steward 'a legal person, other than
    a manufacturer' that systematically sustains the development of free and open-source software
    'intended for commercial activities' and ensures its viability - Recital 19 names foundations
    and entities publishing open source in a business context. A steward owes only the Art. 24(1)
    documented cybersecurity policy plus cooperation with market surveillance; it does not owe Annex
    I Part II point (5), point (6) or Annex II. On administrative fines, keep to what Art. 64(10)
    provides and say no more than it does. Point (b) disapplies 'the administrative fines referred
    to in those paragraphs' for 'any infringement of this Regulation by open-source software
    stewards', and the chapeau - as corrected by the corrigendum published as OJ L, 2025/90555 of 2
    July 2025, which is the reading the consolidated text carries - derogates from paragraphs 2 to
    9. Paragraph 2 is the tier that covers Annex I and Arts. 13 and 14, so it is inside the
    derogation, and Recital 120's closing sentence reads with the article rather than against it.
    This question is nevertheless about the duty and not about the fine: report that the Annex I
    Part II point (5) and point (6) duties and the Annex II point 2 duty do not attach to a steward,
    and leave what a national authority may impose to whoever asks about it, since Art. 64(1) leaves
    the rules on penalties to the Member States. A team publishing its own application is not a
    steward of that application. Where the repository belongs to a foundation sustaining somebody
    else's ecosystem, record that this rule's duty is the wrong instrument and that Art. 24 is the
    one to read."
  - "What is the date position, and does it change what should be said to the reader? The duty this
    rule tests applies from 11 December 2027 (Art. 71(2), first subparagraph). It is not among the
    provisions the second subparagraph brings forward: only Art. 14 (11 September 2026) and Chapter
    IV, Articles 35 to 51 (11 June 2026), move earlier. Art. 69(2) additionally grandfathers
    products placed on the market before 11 December 2027 unless they are substantially modified
    from that date - and Art. 69(3) carves Art. 14 back out of that grandfathering, so the reporting
    duty reaches products already shipped. Placing on the market is per individual product (Recital
    38), so the grandfathering works differently for the two kinds of product: standalone software
    already released takes this duty on its next substantial modification on or after 11 December
    2027 (and a new product or variant first released from that date takes it then), while for
    hardware and firmware every unit placed on the market from 11 December 2027 must comply, of an
    old model or a new one. Nothing here is chargeable today. State the finding as preparation for a
    dated obligation, and note the operational link if it applies: the Art. 14(2)(a) early warning
    is due within 24 hours of the manufacturer becoming aware of an actively exploited
    vulnerability, and a manufacturer with no published address is unlikely to become aware from an
    outside finder within that window. Art. 64(10), point (a), removes the administrative fines of
    Art. 64(2) to (9) for microenterprises and small enterprises for missing that 24-hour deadline,
    and equally for missing the 24-hour early warning of a severe incident under Art. 14(4), point
    (a), which is the second deadline the point names and which this sentence omitted until
    2026-09-07. It reaches those two deadlines and nothing else."
  - Is there an existing process that is real but simply not published where a scanner or a finder
    would look? A team may triage reports through a private mailing list, a paid platform they have
    not linked, an internal runbook, or a support contract, and Annex II point 2 is about where a
    user can find that process, not about whether it exists. Quote whatever internal evidence you
    find - a triage runbook, an on-call rotation for security reports, an advisory history under the
    repository's Security tab - and distinguish 'no process' from 'a process with no published
    entrance', because the engineering work those two need is not the same.
evidence_template: "{file}:{line} matched one of this rule's six branches: a manifest key that
  declares a distributable artifact, a container image build instruction, a release or publication
  automation token, an instruction telling a reader to install or run software on their own machine,
  a payment SDK declared as a dependency or imported, or a firmware or embedded build declaration.
  READ THE LOCATIONS BEFORE ACCEPTING THE HEADLINE. This rule raises one finding per repository, and
  a candidate can rest entirely on the payment-SDK branch, which is evidence of commercial activity
  and NOT of a product with digital elements. The install-instruction branch has a reading problem
  of its own: a `docker run` or `brew install` line in a README can be telling the reader to fetch
  somebody else's artifact. So the detector did not establish that this repository supplies a
  product with digital elements; that is context question 1, answered against the shared scope gate
  and never inferred from these lines. It says nothing about whether a disclosure policy exists
  either: this detector does not look for one. Read context question 2 and check `SECURITY.md`,
  `.github/SECURITY.md`, `/.well-known/security.txt`, the README security section and any linked
  security page - and, because the scan reads this repository only, the organisation's
  `<org>/.github` community-health repository and the product website as well - before treating this
  as a gap"
remediation_template: >
  This is a candidate for review against CRA (Regulation (EU) 2024/2847) Annex I, Part II,

  points (5) and (6) and Annex II, point 2, not a determination about this repository. What the scan

  established is narrower than it may look: a line here matched one of six patterns the rule reads
  as

  evidence that something is supplied from this repository, and one of those six - a payment SDK

  declared or imported - is evidence of monetisation rather than of a distributed artifact. It did

  NOT establish that what you supply is a product with digital elements, and it did NOT check
  whether

  you publish a disclosure policy. Both are the adjudicating agent's to settle, and if you already

  publish a policy this candidate closes with no change.

  Check first whether the policy already exists. In the repository: `SECURITY.md` at the root, in

  `docs/` or in `.github/`; `/.well-known/security.txt`; a security section in the README or

  CONTRIBUTING. Outside it, where no single-repository scan can look: an organisation-level

  `<org>/.github` repository serves a SECURITY.md to every repository in the organisation that lacks

  its own; `/.well-known/security.txt` is frequently served by the deployed site rather than

  committed; and a security page on the product's own domain is in no repository at all. If any of

  those applies, nothing needs to change here.

  What does not close it: a `SECURITY.md` listing only supported versions, a dependabot

  configuration, a CI security-scanning job, or a `# Security` heading with no address or link under

  it. Those are inbound hygiene. Points (5) and (6) are about a route in for somebody outside.

  Dates, so the work can be scheduled rather than rushed. The two Annex I Part II duties and the

  Annex II accompanying-information duty apply from 11 December 2027 (Art. 71(2)): to every hardware

  unit placed on the market from that date, and to software first released, or substantially

  modified, from that date (Art. 69(2)). What applies

  from 11 September 2026 is Art. 14 alone: an early warning to the coordinating CSIRT and ENISA

  within 24 hours of becoming aware of an actively exploited vulnerability, a fuller notification

  within 72 hours, and a final report no later than 14 days after a corrective or mitigating

  measure is available (Art. 14(2)); for a severe incident having an impact on the security of the

  product, the same 24-hour early warning and 72-hour notification, and a final report within one

  month of that notification (Art. 14(4)). Art. 69(3) applies that reporting duty to products

  already on the market. The connection to this finding is practical: the 24-hour clock starts on
  awareness, and

  an outside finder with no address to write to is a slow way to become aware.

  Two artifacts close the gap, and they are separate requirements:

  1. The policy - point (5). A SECURITY.md at the repository root, in `docs/`, or in `.github/`,
     stating where to send a report, what a reporter can expect (acknowledgement time, triage,
     status updates), what is in and out of scope, and how disclosure timing is coordinated before
     details become public. GitHub's private vulnerability reporting, a platform programme, or a
     plain mailbox all work as the intake; what point (5) asks for is that a process exists and is
     enforced, and Recital 76 describes it as a structured process that lets the manufacturer
     diagnose and remedy before details reach the public.
  2. The address - point (6). A monitored mailbox on the product's own domain - `security@` is the
     commonest spelling, `psirt@`, `secalert@`, `secops@`, `infosec@`, `appsec@` and
     `responsible-disclosure@` all work as well - or the link to whichever intake channel the policy
     names: GitHub's private reporting form at `/security/advisories/new`, or your own programme page
     on a coordinated-disclosure platform such as hackerone.com, bugcrowd.com, intigriti.com,
     yeswehack.com, huntr.com, openbugbounty.org or hackenproof.com. Recital 76 puts bug-bounty
     programmes expressly inside the point (5) policy, so a programme page is part of the instrument
     and not a substitute for it. Do not ship a placeholder: `security@example.com` in a template is
     an address no report reaches. Recital 76 also suggests publishing the policy in machine-readable
     form, which in practice means an RFC 9116 `/.well-known/security.txt` carrying `Contact:` and
     `Policy:` fields, served from the product's domain.
  Annex II point 2 then requires the single point of contact and the location of the policy to

  travel with the product itself - in the README, the release notes, the store listing or the

  in-product help - not only to sit in the repository. Art. 13(17) adds that the contact must be

  easily identifiable by users and must not be limited to automated tools.

  Where the repository belongs to a foundation or entity that sustains open-source software it does

  not itself market, read Art. 24 instead: a steward owes a documented cybersecurity policy and

  cooperation with market surveillance, and none of the three provisions above.
fingerprint_spec: project
reading_class:
  class: existence
  elements:
    - name: disclosure_policy
      question: 5
      text: a policy on coordinated vulnerability disclosure - "put in place and enforce a policy on
        coordinated vulnerability disclosure" (Annex I Part II point (5))
    - name: report_address
      question: 5
      text: the address through which reports arrive (Annex I Part II point (6)); Annex II point 2
        requires both to travel with the product

id: eu-cra-001
pack: eu-cra
short_name: Packaging, release, install, firmware or payment-SDK line
problem_line:
  text: Vulnerability disclosure policy or contact not found
fix_line: Publish a vulnerability disclosure policy and a reporting contact; the CRA asks both of
  products placed from Dec 2027.
title: Packaging, release, install, firmware or payment SDK - CRA vulnerability disclosure policy
  and contact (products placed from Dec 2027)
jurisdiction:
  - EU
legal_basis:
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Annex I, Part II (Vulnerability handling
      requirements), chapeau and points (5) and (6). Chapeau: 'Manufacturers of products with
      digital elements shall:'. Point (5): 'put in place and enforce a policy on coordinated
      vulnerability disclosure;'. Point (6): 'take measures to facilitate the sharing of information
      about potential vulnerabilities in their product with digital elements as well as in
      third-party components contained in that product, including by providing a contact address for
      the reporting of the vulnerabilities discovered in the product with digital elements;'. The
      addressee named in the chapeau is the MANUFACTURER, defined in Art. 3(13) as 'a natural or
      legal person who develops or manufactures products with digital elements or has products with
      digital elements designed, developed or manufactured, and markets them under its name or
      trademark, whether for payment, monetisation or free of charge'. (Corrected 2026-07-27 from
      3(12), which is 'economic operator'; the quoted definition was always the manufacturer's, only
      its number was wrong. Verified by enumerating all 51 definitions in Art. 3.) Point (5) is a
      policy, point (6) is a published address; a repository can carry evidence of either, both or
      neither."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Annex II (Information and instructions to
      the user), chapeau and point 2. Chapeau: 'At minimum, the product with digital elements shall
      be accompanied by:'. Point 2: 'the single point of contact where information about
      vulnerabilities of the product with digital elements can be reported and received, and where
      the manufacturer's policy on coordinated vulnerability disclosure can be found;'. This is the
      reason the absence of a published pointer matters and not only the absence of an internal
      process: Annex II point 2 requires the contact and the location of the policy to travel WITH
      the product. Annex II point 1 separately requires general manufacturer contact details, and
      point 6 an internet address for the EU declaration of conformity, neither of which this rule
      tests."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 13(8), (17) and (18) - the operative
      articles that bind the two Annexes to the manufacturer. Art. 13(8), first subparagraph:
      'Manufacturers shall ensure, when placing a product with digital elements on the market, and
      for the support period, that vulnerabilities of that product, including its components, are
      handled effectively and in accordance with the essential cybersecurity requirements set out in
      Part II of Annex I.' Art. 13(8), final subparagraph: 'Manufacturers shall have appropriate
      policies and procedures, including coordinated vulnerability disclosure policies, referred to
      in Part II, point (5), of Annex I to process and remediate potential vulnerabilities in the
      product with digital elements reported from internal or external sources.' Art. 13(17), first
      and second subparagraphs: 'For the purposes of this Regulation, manufacturers shall designate
      a single point of contact to enable users to communicate directly and rapidly with them,
      including in order to facilitate reporting on vulnerabilities of the product with digital
      elements. Manufacturers shall ensure that the single point of contact is easily identifiable
      by the users. They shall also include the single point of contact in the information and
      instructions to the user set out in Annex II.' Art. 13(18), first sentence: 'Manufacturers
      shall ensure that products with digital elements are accompanied by the information and
      instructions to the user set out in Annex II, in paper or electronic form.' Annex VII, point
      2(b) further requires the technical documentation to contain 'the coordinated vulnerability
      disclosure policy, evidence of the provision of a contact address for the reporting of the
      vulnerabilities'."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 71(2): 'This Regulation shall apply
      from 11 December 2027. However, Article 14 shall apply from 11 September 2026 and Chapter IV
      (Articles 35 to 51) shall apply from 11 June 2026.' Art. 71(1) sets entry into force on the
      twentieth day following publication; the act was done at Strasbourg on 23 October 2024. Annex
      I Part II points (5) and (6) and Annex II point 2 are reached through Art. 13, which sits in
      Chapter II and is NOT carved out of the second subparagraph - so THIS rule's duty applies from
      11 December 2027, not from 11 September 2026. Art. 69(2) adds that products placed on the
      market before 11 December 2027 are subject to the Regulation only if they are substantially
      modified from that date, and Art. 69(3) carves Art. 14 back out of that grandfathering: 'By
      way of derogation from paragraph 2 of this Article, the obligations laid down in Article 14
      shall apply to all products with digital elements that fall within the scope of this
      Regulation that have been placed on the market before 11 December 2027.'"
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 14 - the only substantive manufacturer
      obligation that applies from 11 September 2026. Art. 14(1): a manufacturer 'shall notify any
      actively exploited vulnerability contained in the product with digital elements that it
      becomes aware of simultaneously to the CSIRT designated as coordinator ... and to ENISA', via
      the single reporting platform established under Art. 16. Art. 14(2) sets the clocks: an early
      warning 'without undue delay and in any event within 24 hours of the manufacturer becoming
      aware of it' (point (a)), a vulnerability notification within 72 hours (point (b)), and a
      final report 'no later than 14 days after a corrective or mitigating measure is available'
      (point (c)). Art. 14(3) and (4) impose the same 24-hour / 72-hour pattern for severe incidents
      having an impact on the security of the product, with a final report 'within one month after
      the submission of the incident notification under point (b)' (Art. 14(4), point (c)) - the
      month runs from the 72-hour notification, not from the incident and not from a fix. Art. 15
      provides for voluntary reporting. The connection to this rule is operational, not legal: the
      24-hour clock starts when the manufacturer BECOMES AWARE, and a manufacturer that publishes no
      reporting address is unlikely to become aware from an outside finder in time. The Art. 14 duty
      is nevertheless a separate obligation with no source-code trace of its own - this product
      treats it as an organisational duty with no source-code trace, and this rule does not test
      it."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 2(1) and the Art. 3 defined terms the
      rest of this rule turns on. THIS ENTRY IS NOT THE SCOPE TEST AND MUST NOT BE READ AS ONE; the
      pointer at the end says where the test is. Art. 2(1) is the paragraph that brings a product
      IN: the Regulation 'applies to products with digital elements made available on the market,
      the intended purpose or reasonably foreseeable use of which includes a direct or indirect
      logical or physical data connection to a device or network'. Art. 3(1) defines a product with
      digital elements as 'a software or hardware product and its remote data processing solutions,
      including software or hardware components being placed on the market separately'; Art. 3(2)
      confines 'remote data processing' to processing 'for which the software is designed and
      developed by the manufacturer, or under the responsibility of the manufacturer, and the
      absence of which would prevent the product with digital elements from performing one of its
      functions'. Art. 3(22) defines making available on the market as 'the supply of a product with
      digital elements for distribution or use on the Union market in the course of a commercial
      activity, whether in return for payment or free of charge'; Art. 3(21) defines placing on the
      market as 'the first making available of a product with digital elements on the Union market',
      which is the event Art. 13(8) and Art. 69(2) both turn on. (Corrected 2026-07-27 from 3(21)
      for making available - 3(21) is placing on the market and 3(20) is the support period; the
      quoted words were always those of 3(22).) WHAT THIS ENTRY LEAVES OUT, NAMED SO THAT NOBODY
      MISTAKES IT FOR NOTHING. Article 2 has eight paragraphs. Only the first, quoted above, brings
      a product into the Regulation; the other seven are subtractive. Five exclude outright: Art.
      2(2), products with digital elements to which Regulation (EU) 2017/745 on medical devices,
      Regulation (EU) 2017/746 on in vitro diagnostic medical devices or Regulation (EU) 2019/2144
      on motor vehicles applies; Art. 2(3), products certified in accordance with Regulation (EU)
      2018/1139 on civil aviation; Art. 2(4), equipment falling within the scope of Directive
      2014/90/EU on marine equipment; Art. 2(6), spare parts made available to replace identical
      components and manufactured to the same specifications as the components they replace; and
      Art. 2(7), products developed or modified exclusively for national security or defence
      purposes and products specifically designed to process classified information. One is a power
      rather than an exclusion: Art. 2(5) empowers the Commission to adopt delegated acts limiting
      or excluding the application of this Regulation to products already covered by other Union
      rules addressing the same risks, and only the excluding branch takes a product out. One carves
      out information rather than products: Art. 2(8) provides that the obligations laid down in the
      Regulation do not entail supplying information whose disclosure would be contrary to the
      essential national security, public security or defence interests of the Member States. The
      2026-07-27 version of this entry stated the scope question as Art. 2(1) plus Art. 3(1), (2),
      (21) and (22) plus Recitals 12, 15, 18 and 20, and named, quoted and analysed none of those
      seven paragraphs - the same defect that was found in the shared CRA scope gate on 2026-08-04
      and closed there by an independent adversarial legal check. THE COMPLETE ARTICLE 2 ANALYSIS IS
      NOT RE-DERIVED HERE AND MUST NOT BE. It lives in the shared CRA scope gate, `gate_id`
      `cra-scope`, which SHIPS INSIDE THIS BUNDLE - the build splices it whole into every checklist
      that names it, so a reader holds it as the `applicability` object of the three CRA checklists
      in `checklists.json` - and which decomposes Article 2 in full - each of the seven paragraphs
      above carrying its own limb, its own question and its own verbatim quote of the operative
      words - alongside the Article 3 definitions, Art. 24, Art. 69(2), Art. 71(2) and Recitals 11,
      12, 15, 16, 18, 19, 20, 25 and 27, into 37 limbs backed by 50 supporting quotes. Every one of
      those quotes was verified against the Official Journal text and twice checked by independent
      adversarial legal review on 2026-08-04; the receipts and the review records are held by the
      rule author and do not ship, so nothing here asks a reader to open them. Recitals 12, 15, 18
      and 20 were quoted in this entry until 2026-08-05 and are quoted in that gate, where each
      carries a limb; they were removed from here rather than maintained in two places, which is the
      drifting-copy defect this repository has paid for repeatedly. This rule's own applicability
      question, context_questions[0], no longer restates Art. 2(1) either: it sends the adjudicating
      agent to that gate and to the applicability verdict a scan already computes from it. What the
      link is and is not: no rule evaluates a gate directly - referencing a gate is a facility of
      checklists and not of rules - so this pointer is documentary and a reader has to follow it
      into the checklists the bundle ships. A scan nevertheless reaches the same gate by a different
      route: it annotates every candidate whose legal_basis cites name an instrument that a shipped
      gate assesses, every cite in this file names Regulation (EU) 2024/2847, and the verdict
      arrives on the candidate as `depends_on_applicability`."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-08-05
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 24 and Art. 3(14) - open-source
      software stewards, a DIFFERENT addressee from the manufacturer, with a lighter regime. Art.
      3(14) defines a steward as 'a legal person, other than a manufacturer, that has the purpose or
      objective of systematically providing support on a sustained basis for the development of
      specific products with digital elements, qualifying as free and open-source software and
      intended for commercial activities, and that ensures the viability of those products'. Art.
      24(1): stewards 'shall put in place and document in a verifiable manner a cybersecurity policy
      to foster the development of a secure product with digital elements as well as an effective
      handling of vulnerabilities by the developers of that product. That policy shall also foster
      the voluntary reporting of vulnerabilities as laid down in Article 15 by the developers of
      that product and take into account the specific nature of the open-source software steward and
      the legal and organisational arrangements to which it is subject. That policy shall, in
      particular, include aspects related to documenting, addressing and remediating vulnerabilities
      and promote the sharing of information concerning discovered vulnerabilities within the
      open-source community.' Art. 24(2) requires cooperation with market surveillance authorities
      and production of that documentation on reasoned request. Art. 24(3) applies only Art. 14(1)
      (to the extent the steward is involved in development) and Art. 14(3) and (8) (for severe
      incidents affecting the steward's own development infrastructure). Three differences matter
      for this rule. First, a steward owes a documented cybersecurity policy, NOT the Annex I Part
      II point (5) coordinated-disclosure policy, NOT the point (6) contact address and NOT the
      Annex II accompanying information - which is the difference this rule turns on, and it holds
      on the operative words of Art. 24 alone. Second, a steward may not affix the CE marking
      (Recital 19: 'they should not be permitted to affix the CE marking to the products with
      digital elements whose development they support'). Third - and this changed on 2 July 2025 -
      Art. 64(10), point (b), names 'any infringement of this Regulation by open-source software
      stewards', and the corrigendum published as OJ L, 2025/90555 of 2 July 2025 corrected the
      chapeau of Art. 64(10) so that the derogation runs from paragraph 2 rather than from paragraph
      3. Art. 64(2), the tier that covers Annex I and Arts. 13 and 14, is therefore inside the range
      of paragraphs whose administrative fines that point disapplies; the corrected operative words
      are quoted in full in entry (6) and are not repeated here. Recital 120 describes the same two
      points in its closing sentence, quoted here in full because this entry sits on the base
      Official Journal text and the consolidated rendering carries no recitals: 'Given that
      administrative fines do not apply to microenterprises or small enterprises for a failure to
      meet the 24-hour deadline for the early warning notification of actively exploited
      vulnerabilities or severe incidents having an impact on the security of the product with
      digital elements, nor to open-source software stewards for any infringement of this
      Regulation'. The disagreement between that recital and the operative provision which this
      entry recorded until 2026-09-07 does not exist. Nothing in this rule's detection turns on the
      point either way: a steward is outside the duty this rule tests, so it never reaches the
      question of a fine. Recital 19 confines the category to 'legal persons who provide support on
      a sustained basis for the development of such products which are intended for commercial
      activities, and who play a main role in ensuring the viability of those products', naming
      'certain foundations as well as entities that develop and publish free and open-source
      software in a business context'. A solo developer or a small team publishing their own
      application is a manufacturer if they market it under their own name in the course of a
      commercial activity, and is outside the Regulation entirely if they do not; they are not
      stewards of their own product."
    url: http://publications.europa.eu/resource/celex/32024R2847
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Art. 64(2): 'Non-compliance with the
      essential cybersecurity requirements set out in Annex I and the obligations set out in
      Articles 13 and 14 shall be subject to administrative fines of up to EUR 15 000 000 or, if the
      offender is an undertaking, up to 2,5 % of the its total worldwide annual turnover for the
      preceding financial year, whichever is higher' (the 'of the its' is the Official Journal
      wording). Art. 64(5)(c) requires due regard to 'the size, in particular with regard to
      microenterprises and small and medium sized-enterprises, including start-ups, and the market
      share of the economic operator'. Art. 64(10) IS QUOTED HERE FROM THE CONSOLIDATED TEXT, CELEX
      02024R2847-20241120, which carries the correction made by the corrigendum published as OJ L,
      2025/90555 of 2 July 2025; the base Official Journal text is not corrected in place and still
      serves the uncorrected chapeau, which is why this entry's url is the consolidated one. The
      chapeau reads 'By way of derogation from paragraphs 2 to 9, the administrative fines referred
      to in those paragraphs shall not apply to the following:', and the two points read '(a)
      manufacturers that qualify as microenterprises or small enterprises with regard to any failure
      to meet the deadline referred to in Article 14(2), point (a), or Article 14(4), point (a); (b)
      any infringement of this Regulation by open-source software stewards.' The corrigendum
      replaced the words paragraphs 3 to 9 with paragraphs 2 to 9 in that chapeau, and this entry
      quoted the uncorrected range and reasoned from it until 2026-09-07. WHAT THE CORRECTED
      PARAGRAPH PROVIDES, ON BOTH POINTS. Paragraph 2 is inside the range, so the administrative
      fines the paragraph disapplies include those of Art. 64(2) - the tier of EUR 15 000 000 or 2,5
      % that covers Annex I and Arts. 13 and 14, and the only tier this rule's subject matter can
      attract - as well as those of Art. 64(3) and Art. 64(4). Point (a) is bounded twice, by
      addressee and by subject matter: it reaches a manufacturer that qualifies as a microenterprise
      or a small enterprise, and within that only a failure to meet the 24-hour early warning of
      Art. 14(2), point (a), or Art. 14(4), point (a). It reaches no other obligation of Art. 14 and
      not the duty this rule tests. Point (b) is bounded by addressee alone: it reaches any
      infringement of the Regulation by an open-source software steward, which is a party the duty
      this rule tests does not attach to in the first place - see entry (5). Recital 120 describes
      both points in its closing sentence and now reads with the operative provision rather than
      against it, so the adjudicating agent has no tension to report; that instruction was removed
      on 2026-09-07. Art. 64(1) leaves the rules on penalties to the Member States, so what a
      national authority may impose outside these administrative fines is not settled by Art.
      64(10). Art. 64 sits in Chapter VII (Arts. 63 to 65) and therefore applies from 11 December
      2027 under Art. 71(2)."
    url: http://publications.europa.eu/resource/celex/02024R2847-20241120
    checked_at: 2026-09-07
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Cyber Resilience Act (Regulation (EU) 2024/2847), Recital 76: 'Manufacturers of products with
      digital elements should put in place coordinated vulnerability disclosure policies to
      facilitate the reporting of vulnerabilities by individuals or entities either directly to the
      manufacturer or indirectly, and where requested anonymously, via CSIRTs designated as
      coordinators for the purposes of coordinated vulnerability disclosure in accordance with
      Article 12(1) of Directive (EU) 2022/2555. Manufacturers' coordinated vulnerability disclosure
      policy should specify a structured process through which vulnerabilities are reported to a
      manufacturer in a manner allowing the manufacturer to diagnose and remedy such vulnerabilities
      before detailed vulnerability information is disclosed to third parties or to the public.
      Moreover, manufacturers should also consider publishing their security policies in
      machine-readable format. Given the fact that information about exploitable vulnerabilities in
      widely used products with digital elements can be sold at high prices on the black market,
      manufacturers of such products should be able to use programmes, as part of their coordinated
      vulnerability disclosure policies, to incentivise the reporting of vulnerabilities by ensuring
      that individuals or entities receive recognition and compensation for their efforts. This
      refers to so-called 'bug bounty programmes'.' The single quotation marks around the phrase bug
      bounty programmes are the Journal's own and are part of the quotation; CORRECTION 2026-08-03,
      this entry re-rendered them as double quotation marks until the quote-verification gate was
      extended to rule cites, and that re-rendering truncated the verified span to its first 442
      characters of about 1,330, so do not restore it. Two things follow. (i) The machine-readable
      form the ecosystem settled on is RFC 9116 (A File Format to Aid in Security Vulnerability
      Disclosure, IETF, April 2022), which defines the '/.well-known/security.txt' file and its
      Contact, Policy, Expires and Canonical fields. RFC 9116 is not EU law and creates no
      obligation; it is named here because a repository that publishes one has answered Annex I Part
      II point (6) in the exact form Recital 76 encourages, and because it is the first thing
      context question 2 sends the adjudicating agent to look for. It was also what the rule's first
      `guard_missing` branch recognised until guards were removed from every rule on 2026-07-27; the
      shape did not stop being evidence, it stopped being a suppression. (ii) A bug-bounty programme
      is not adjacent to the point (5) policy, it is expressly a permitted part OF it. So a
      project's own programme page on a coordinated-disclosure platform is evidence of the
      instrument itself and not merely of a related activity, and context question 2 and the
      remediation template both say so. The first draft recorded the opposite while deleting a prose
      '[Bb]ug [Bb]ounty' detector branch: that deletion was right on its measurement - a sentence
      mentioning somebody else's programme is not evidence of your own - and wrong on its law."

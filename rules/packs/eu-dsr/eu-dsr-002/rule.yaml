id: eu-dsr-002
pack: eu-dsr
short_name: Erasure, export or objection action to review
problem_line:
  text: "Rights route flaw: reach, access, format, timing or promise"
fix_line: Record the route, make it reach every copy or record why a copy is kept, and give people a
  way to request it.
title: Erasure, export or objection action named over a person-shaped store - implementation needs
  review - GDPR Arts. 15-22, or a file hand-out with no such noun on the line
jurisdiction:
  - EU
legal_basis:
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Arts. 15-22 - the data subject
      rights this rule reports the implementation of. Art. 15(3): 'The controller shall provide a
      copy of the personal data undergoing processing', and 'Where the data subject makes the
      request by electronic means, and unless otherwise requested by the data subject, the
      information shall be provided in a commonly used electronic form.' Art. 16: 'The data subject
      shall have the right to obtain from the controller without undue delay the rectification of
      inaccurate personal data concerning him or her'. Art. 17(1): 'The data subject shall have the
      right to obtain from the controller the erasure of personal data concerning him or her without
      undue delay and the controller shall have the obligation to erase personal data without undue
      delay where one of the following grounds applies'. Art. 20(1) gives the right 'to receive the
      personal data concerning him or her, which he or she has provided to a controller, in a
      structured, commonly used and machine-readable format and have the right to transmit those
      data to another controller without hindrance'. Art. 21(3) provides that where the data subject
      objects to processing for direct marketing purposes 'the personal data shall no longer be
      processed for such purposes', which is the provision an unsubscribe or blocklist route bears
      on. A ROUTE THAT EXISTS IS NOT A RIGHT THAT IS DISCHARGED, and nothing in this rule says
      otherwise: what the code shows is a mechanism, and whether it reaches every store, every
      recipient and every copy is the reader's question. Applies since 2018-05-25, Art. 99(2): 'It
      shall apply from 25 May 2018.'"
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-08-28
    jurisdiction: EU
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Art. 12(2)-(4) - the duty to
      make the rights usable, which is not discharged by the existence of a function. Art. 12(2):
      'The controller shall facilitate the exercise of data subject rights under Articles 15 to 22.
      In the cases referred to in Article 11(2), the controller shall not refuse to act on the
      request of the data subject for exercising his or her rights under Articles 15 to 22, unless
      the controller demonstrates that it is not in a position to identify the data subject.' Art.
      12(3): 'The controller shall provide information on action taken on a request under Articles
      15 to 22 to the data subject without undue delay and in any event within one month of receipt
      of the request.' Art. 12(5) makes the actions free of charge. Read against what this rule
      finds, three things follow and the context questions ask all three. A route reachable only by
      an administrator does not facilitate the DATA SUBJECT's exercise of anything. A route with no
      response inside a month does not satisfy Art. 12(3) however well it deletes. And a route that
      charges for an export does not satisfy Art. 12(5). Reference only: this entry withholds
      satisfaction rather than establishing the duty the rule reports on."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Arts. 17(2) and 19 - why an
      erasure that stops at the local database is incomplete. Art. 17(2): 'Where the controller has
      made the personal data public and is obliged pursuant to paragraph 1 to erase the personal
      data, the controller, taking account of available technology and the cost of implementation,
      shall take reasonable steps, including technical measures, to inform controllers which are
      processing the personal data that the data subject has requested the erasure by such
      controllers of any links to, or copy or replication of, those personal data.' Art. 19: 'The
      controller shall communicate any rectification or erasure of personal data or restriction of
      processing carried out in accordance with Article 16, Article 17(1) and Article 18 to each
      recipient to whom the personal data have been disclosed, unless this proves impossible or
      involves disproportionate effort.' Art. 4(9) defines a recipient as 'a natural or legal
      person, public authority, agency or another body, to which the personal data are disclosed,
      whether a third party or not' - which reaches the analytics, error-reporting, messaging, CRM
      and payment vendors an application forwards user records to. A `delete_user` that removes rows
      and tells no vendor is exactly the case these two provisions are about, and it is
      context_questions[2]. Reference only."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Art. 5(2) and Art. 30(1) -
      accountability and the record of processing activities, which is what a positive finding
      feeds. Art. 5(2): 'The controller shall be responsible for, and be able to demonstrate
      compliance with, paragraph 1'. Art. 30(1) requires the record to 'contain all of the following
      information', including at point (f) 'where possible, the envisaged time limits for erasure of
      the different categories of data'. Art. 30(5) exempts smaller organisations conditionally
      only: 'The obligations referred to in paragraphs 1 and 2 shall not apply to an enterprise or
      an organisation employing fewer than 250 persons unless the processing it carries out is
      likely to result in a risk to the rights and freedoms of data subjects, the processing is not
      occasional, or the processing includes special categories of data as referred to in Article
      9(1) or personal data relating to criminal convictions and offences referred to in Article
      10.' A list of the routes through which a person can act on their own record is the
      demonstration Art. 5(2) asks for, and it is the half of the record no scan of an absence can
      produce. Reference only: it is why the finding is worth raising, not the duty it tests."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: General Data Protection Regulation, Regulation (EU) 2016/679, Art. 28(3)(e) and (g) - where a
      PROCESSOR's position differs. The contract binding the processor must stipulate that the
      processor 'taking into account the nature of the processing, assists the controller by
      appropriate technical and organisational measures, insofar as this is possible, for the
      fulfilment of the controller's obligation to respond to requests for exercising the data
      subject's rights laid down in Chapter III', and Art. 28(3)(g) adds that at the end of the
      service the processor must, at the controller's choice, delete or return all the personal data
      and delete existing copies. A repository that is a pure processor - a hosted API, a background
      worker, an SDK operating on a customer's data - therefore owes an assistance duty under a
      contract rather than Arts. 15-22 directly, and a route found in it is evidence about that
      assistance rather than about a discharged right. Reference only, and it is the first context
      question.
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Art. 4(1) and Art. 11 - what
      the detector may not decide. Personal data 'means any information relating to an identified or
      identifiable natural person', and an identifiable natural person 'is one who can be
      identified, directly or indirectly, in particular by reference to an identifier such as a
      name, an identification number, location data, an online identifier or to one or more factors
      specific to the physical, physiological, genetic, mental, economic, cultural or social
      identity of that natural person'. A route named for a person-shaped noun is not thereby a
      route over personal data: `deleteContact` in a device-pairing feature and `deleteContact` in a
      recruitment database are the same eleven characters. Art. 11(2) then disapplies part of the
      duty outright: 'Where, in cases referred to in paragraph 1 of this Article, the controller is
      able to demonstrate that it is not in a position to identify the data subject, the controller
      shall inform the data subject accordingly, if possible. In such cases, Articles 15 to 20 shall
      not apply except where the data subject, for the purpose of exercising his or her rights under
      those articles, provides additional information enabling his or her identification.' The
      disapplication reaches Arts. 15 to 20 only; Arts. 21 and 22 are outside it. Reference only.
      Both determinations are for the adjudicating agent or for the person running the scan, and no
      pattern here tests either."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-08-28
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
sunset: null

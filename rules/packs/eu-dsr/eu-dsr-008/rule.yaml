id: eu-dsr-008
pack: eu-dsr
short_name: Changes to personal data kept in an append-only log
problem_line:
  text: Erasure and correction stop short of the event log
fix_line: Make erasure reach the events (for example by destroying a per-person key), or record what
  stays and for how long.
title: Personal-data changes stored as immutable events in an append-only event store, with the read
  side served by projections
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 16 - 'The data subject shall have the right to obtain
      from the controller without undue delay the rectification of inaccurate personal data
      concerning him or her. Taking into account the purposes of the processing, the data subject
      shall have the right to have incomplete personal data completed, including by means of
      providing a supplementary statement.' The Article says rectification, not supersession: a
      store whose only write operation is an append raises the question of what the controller does
      with the inaccurate value that the appended event replaces"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 17(1) - 'The data subject shall have the right to obtain
      from the controller the erasure of personal data concerning him or her without undue delay and
      the controller shall have the obligation to erase personal data without undue delay where one
      of the following grounds applies'. Whether an erasure that rewrites or drops a projection row,
      leaving the events it was projected from in place, discharges this obligation is the question
      this construct raises; the detector does not answer it
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(d) - personal data shall be 'accurate and, where
      necessary, kept up to date; every reasonable step must be taken to ensure that personal data
      that are inaccurate, having regard to the purposes for which they are processed, are erased or
      rectified without delay'. The principle names erasure and rectification as the two remedies
      for inaccuracy, and an append-only log offers neither to the stored event
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(e) - personal data shall be 'kept in a form which
      permits identification of data subjects for no longer than is necessary for the purposes for
      which the personal data are processed'. Cited because the anchor tree's audit-log retention
      default keeps every event for an unbounded period; whether that is true of the tree in front
      of the reader is a deployment fact this detector does not read
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 25(1) - the controller shall 'implement appropriate
      technical and organisational measures, such as pseudonymisation, which are designed to
      implement data-protection principles, such as data minimisation, in an effective manner and to
      integrate the necessary safeguards into the processing in order to meet the requirements of
      this Regulation and protect the rights of data subjects', both 'at the time of the
      determination of the means for processing and at the time of the processing itself'. Reference
      only: this detector reads a storage architecture, and whether that architecture is an
      appropriate measure is a judgement about the whole system that no matched line can carry"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.35
detector:
  engine: builtin-regex
  file_globs:
    - "**"
  match:
    - (?:^|[^A-Za-z0-9_])(?:eventstore|event_store|eventStore|EventStore|event_journal|EventJournal)\s*\.\s*(?:events?|Events?|streams?|Streams?)[0-9]{0,3}(?![A-Za-z_])
    - (?:Eventstore|EventStore|EventStoreClient|EventStoreDBClient|RailsEventStore|RubyEventStore|NewEventstore|NewEventStore)(?![A-Za-z0-9_])
    - (?:(?:^|[^A-Za-z0-9_])(?:eventstore|event_store)\s*\.\s*[A-Za-z_][A-Za-z0-9_]*|/(?:eventstore|event_store|eventsourcing)")
    - (?:^|[^A-Za-z0-9_])(?:PushEvents|AppendEvents|append_events|appendEvents|AppendToStream|AppendToStreamAsync|appendToStream|append_to_stream)\s*\(
    - (?:^|[^A-Za-z0-9_])(?:eventstore|eventStore|Eventstore|EventStore|event_store)\s*\.\s*(?:Push|push)\s*\(
    - (?:^|[^A-Za-z0-9_])(?:AggregateType|AggregateID|AggregateId|AggregateRoot|aggregate_type|aggregate_id|aggregateType|aggregateId|aggregate_root)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:editor_user|editorUser|EditorUser|FieldEditorUser)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:events?|eventstore|event_store|event_log|event_type|EventType)(?![A-Za-z0-9_])[^\n]{0,120}?(?:^|[^A-Za-z0-9_])(?:created_by|creator|editor|editor_user)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:created_by|creator|editor|editor_user)(?![A-Za-z0-9_])[^\n]{0,120}?(?:^|[^A-Za-z0-9_])(?:events?|eventstore|event_store|event_log|event_type|EventType)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])projections\s*\.\s*[A-Za-z_][A-Za-z0-9_]*
    - (?:(?:ReadModel|ReadModelHandler|ProjectionHandler|NewCreateStatement|NewUpdateStatement|NewMultiStatement|EventReducers?|AggregateReducers?|eventReducers?|aggregateReducers?|reduceEvent)|(?:^|[^A-Za-z0-9_])(?:Reducers|read_model|projection_handler|new_create_statement|event_reducer|aggregate_reducer))(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])@(?:EventSourcingHandler|Aggregate|AggregateIdentifier)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])AggregateLifecycle\s*\.\s*apply\s*\(
    - (?:^|[^A-Za-z0-9_])(?:Commanded\.(?:Aggregate|Event|Commands|EventStore)|eventsourcing\.(?:domain|application)|event_store\s*\.\s*publish)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:apply|Apply|on|On|handle|Handle|when|When|evolve|Evolve)\s*\(\s*(?:final\s+)?(?:[A-Za-z_][A-Za-z0-9_.<>]*\s+)?(?:@event|@?[A-Za-z_][A-Za-z0-9_]*[Ee]vent)(?![A-Za-z0-9_.])
    - (?:^|[^A-Za-z0-9_])(?:apply|Apply|evolve|Evolve|when|When)\s*\(\s*(?:[A-Za-z_][A-Za-z0-9_]*\s*,\s*)?(?:final\s+)?(?:[A-Za-z_][A-Za-z0-9_.<>]*\s+)?@?(?:event|evt|Event)\s*[),]
    - (?:^|[^A-Za-z0-9_])(?:RegisterFilterEventMapper|RegisterEventMapper|register_event_mapper|EventTypeMapping|eventTypeMapping)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:tinybird|Tinybird|TINYBIRD|tinybirdco|clickhouse_driver|ClickHouseClient|createClickHouseClient|snowplow|Snowplow|SnowplowTracker|rudderstack|Rudderstack|RudderStack|rudderanalytics|KinesisFirehose|FirehoseClient|PutRecordBatchCommand|PutRecordBatch|DeliveryStreamName|buildIngestEndpoint|buildPipe|buildDatasource)(?![A-Za-z0-9_])|@tinybirdco/|@clickhouse/client|@snowplow/|@rudderstack/|@google-cloud/bigquery|clickhouse-connect|clickhouse_connect
    - (?:^|[^A-Za-z0-9_])(?:ENGINE_SORTING_KEY|ENGINE_PARTITION_KEY|ENGINE_TTL|IMPORT_SERVICE|ENGINE_VER)(?![A-Za-z0-9_])|^[
      \t]*(?:SCHEMA|SQL)[
      \t]*>|(?:^|[^A-Za-z0-9_])[A-Za-z0-9_/.-]{0,60}\.(?:datasource|pipe)(?![A-Za-z0-9_.])(?![

    - :(?:string|text|citext|date|datetime|inet|integer|bigint|boolean|binary|decimal|float|json|jsonb)\s*,\s*:(?:[A-Za-z0-9]+_)?((?&personal_data_field_names))(?:_[A-Za-z0-9]+|[A-Z][A-Za-z0-9]{0,20}|e?s|[0-9]{1,2})?(?:_[0-9]{1,2})?\b
    - params\s*\.\s*require\(\s*:(?:user|member|account|customer|subscriber|person|people|profile|contact|applicant|candidate|student|employee|patient|attendee|guest|participant|registrant|buyer|author|reader|learner|donor|volunteer|patron|recipient|resident|passenger)s?\b
  match_without:
    - ^\s*(\*|//|/\*|#|<!--|--\s)(?![^\n]*(501|403|[Nn]ot
      [Ii]mplemented|NotImplemented|not_implemented|notImplemented|NotImplementedError|NotImplementedException|StatusNotImplemented|[Uu]nimplemented|[Cc]oming
      [Ss]oon|coming_soon|[Nn]ot [Ss]upported|[Uu]nsupported|[Nn]ot [Aa]vailable|[Nn]ot
      [Yy]et|[Nn]ot [Bb]uilt|TODO|FIXME|[Ff]orbidden|[Dd]enied|[Ss]tubbed|throw new
      Error|\braise\b|\bpass\b|[Cc]ontact (us|support)|[Ee]mail (us|support)))
  shared_path_exclusions:
    - attribution_documents
  path_without:
    - (^|/)(mock|__mock__|testdata|test[_-]data|test-utils|test-helpers|test-fixtures|factories)/
    - _test\.(go|py|rb|php)$|_spec\.rb$|_test\.exs?$|\.(e2e|e2e-spec|integ|int-spec)\.[cm]?[jt]sx?$
    - \.(test|spec)\.[a-z-]+\.[cm]?[jt]sx?$
    - (^|/)(generated|__generated__|codegen|\.output|\.vercel)/|\.(min|bundle|chunk)\.[cm]?jsx?$
context_questions:
  - "Is the scanned party a controller or a processor for the personal data in the locations list?
    Art. 4(7) makes the controller the party that determines the purposes and means of the
    processing, and Arts. 15-22 are owed by the controller alone. A processor's duty is the derived
    one in Art. 28(3)(e) - assist the controller, on the controller's documented instructions, so
    that the controller can answer requests - and it is owed to the controller under a contract, not
    to the data subject. Decide from what the repository is: a product with its own accounts and its
    own sign-up is a controller for those accounts; a hosted API, a background worker, an SDK or a
    library that only handles data its customer supplies is a processor for that data, and often a
    controller for its own account holders at the same time. Name the role for each store, and where
    the answer is processor, say which of the Art. 28(3) duties applies instead."
  - Are the values in the locations list personal data within Art. 4(1) - information relating to an
    identified or identifiable natural person - or are they something the vocabulary only makes look
    personal? A `users` table holding machine accounts or API service principals, a `customers`
    table of company records with no named contact, a schema for the product's own configuration and
    a type declaration with no store behind it are all outside Art. 4(1). Quote the two or three
    strongest locations, say what identifies a person in each, and list the ones you are discarding
    with the reason. If every location is incidental, that is a complete answer and it closes the
    candidate.
  - Does the repository store the data at all, or only pass them through? The rights bite on data
    the controller holds. Distinguish a persistent store (a table, a document collection, an object
    store, a durable queue, a log retained on disk) from a value that exists only for the duration
    of one request. Quote the write.
  - "THE CENTRAL QUESTION, and the detector answers no part of it: does this project provide a route
    by which a DATA SUBJECT - not an administrator - can obtain erasure of their personal data and a
    copy of it in a commonly used electronic form, and make a request under Arts. 15-22 at all; and
    does that route reach a working implementation rather than a stub? Until 2026-07-27 a regex
    tried to answer this by suppressing the candidate whenever it saw a matching identifier, and it
    was measured silencing 21 of 28 real repositories, at least 14 of them on shapes that were not
    mechanisms. The vocabulary it used is retained here as SEARCH TERMS, which is all it was ever
    good for. Account deletion: delete_account, deleteAccount, DELETE_ACCOUNT, account_deletion,
    accountDeletion, can_delete_account, destroy_account, terminate_account, delete_my_account,
    DeleteAccountButton, DeleteAccountLink, showDeleteAccount. Erasure of the person's record:
    delete_user, deleteUser, user_deletion, PermanentDeleteUser, hard_delete_user, purge_user,
    erase_user, scrub_user, wipe_user, anonymize_user, UserAnonymizer, UserDestroyer, delete_member,
    delete_profile, delete_customer, delete_subscriber. Erasure of the contents:
    delete_personal_data, erase_personal_data, purge_personal_data, data_erasure, erasure_job,
    erasure_service, erasure_workflow. A copy or portability path: export_user_data, exportUserData,
    export_account_data, export_personal_data, download_your_data, download_my_data,
    data_portability, portability_request. A request route named for the right: dsar, DSAR,
    data_subject_request, subject_access_request, gdpr_export, gdpr_delete, right_to_be_forgotten,
    right_to_erasure, right_of_access, erasure_request, deletion_request, privacy_request. A
    persisted request record: data_subject_requests, DataSubjectRequest, request_account_deletion,
    request_data_export, request_erasure. Search for the IDENTIFIER, never the substring, and read
    the line before believing it - every one of these was measured deleting a whole repository's
    findings while being nothing of the kind: forgetmenot in a common-password wordlist (that is not
    forget_me), deleteuser-v2.png (a screenshot file name), takeout_box (an emoji slug),
    .delete-user-modal (a stylesheet class), a documentation table row naming the audit-log event
    user_deleted, and userDeletedSuccess (an admin panel's success message). Weigh rather than
    count: an admin console only staff can reach is not a route for the data subject; a settings
    page that exists only as a route string is not a mechanism; an unsubscribe link serves the Art.
    21(3) direct-marketing objection and nothing else; a mechanism living in a separate front-end or
    mobile repository, or in a hosted identity provider's console, is outside this scan and is worth
    recording as such rather than assumed. A privacy@ or dpo@ address is an open question and not a
    settled one: Recital 59 says the controller \"should also provide means for requests to be made
    electronically, especially where personal data are processed by electronic means\", so a
    monitored inbox can be a modality under Art. 12(2), while an unattended address in a page footer
    is not - say which one the evidence supports. Record what you searched for, quote what you
    found, and state explicitly if you found nothing."
  - "Which of the seven rights does the mechanism you found actually serve, and which are unserved?
    A project that ships account deletion and nothing else has answered Art. 17 and still owes Art.
    15 access, Art. 16 rectification, Art. 18 restriction, Art. 20 portability and Art. 21 objection
    - and this candidate will look identical either way, because the detector reports the presence
    of personal data and nothing about routes. Go through them one at a time against what the code
    offers: erasure (17), a copy in a commonly used electronic form (15(3)), a structured, commonly
    used and machine-readable export of the data the person provided (20(1)), correction of
    inaccurate data (16), restriction (18), objection including to direct marketing (21), and a
    route for a decision made solely by automated means (22)."
  - "If a deletion path exists, does it erase or does it mark? Art. 17(1) requires erasure. Trace
    what the path does to the row: a `deleted_at` timestamp, an `is_deleted` boolean, a status
    string, a disabled flag or a move to an archive table leaves the name, the email address and
    everything else in place and readable. Quote the write. Where the mark is the first half of a
    two-stage design, find the second half - the job, cron, lifecycle rule or scheduled task that
    actually removes the data - and quote it too; if you cannot find it, say the erasure is unproven
    rather than assuming it exists."
  - If a deletion path exists, where does it stop? Art. 19 requires the controller to communicate
    the erasure to each recipient the data were disclosed to, and Art. 17(2) adds a duty to inform
    other controllers where the data were made public. List the recipients this repository sends
    personal data to - analytics and product-analytics vendors, error reporting, session replay, CRM
    and marketing automation, transactional email and SMS, payment processors, support desks, data
    warehouses, search indexes, backups and read replicas - then say, for each, whether the deletion
    path reaches it. A path that deletes one database row while the same person stays identified in
    an analytics vendor, a CRM and an error tracker has not completed the erasure.
  - "Does any route that answers a data-subject request return a fixed refusal, or is it a stub?
    Art. 12(2) requires the controller to facilitate the exercise of the rights; Art. 12(4) requires
    that where the controller does not act it inform the person, within one month, of the reasons,
    of the possibility of lodging a complaint with a supervisory authority and of seeking a judicial
    remedy; and Art. 12(5) puts the burden of showing a request manifestly unfounded or excessive on
    the controller. Read the handler BODY rather than its name - a name is not an implementation,
    and the shapes measured in real repositories are: a 501 or 403 response, a NotImplementedError,
    a bare `raise` or `pass` in Python, `throw new Error` in JavaScript, an empty function body, a
    route registered but never wired to a handler, a handler that only sends an email to the team,
    and a feature flag that gates the whole path (in which case say whether anything in the
    repository shows it switched on). Detector branch (11) puts such a line into the locations list
    when the refusal shares the line with the route name; when it sits a few lines below, nothing in
    layer 1 can see it and this question is the only thing that will. Quote the handler and say what
    it returns."
  - "Can the person reach the mechanism, and how long does the answer take? Art. 12(2) is a duty to
    facilitate, and Art. 12(3) sets one month from receipt, extendable by two further months for
    complexity or number, with the person told of the extension and its reasons inside the first
    month; Art. 12(5) makes the action free of charge. Say whether the path is self-service, whether
    it needs a support ticket, whether a human must run a script, whether any fee or plan tier is
    attached, and what evidence there is about elapsed time. Where the code shows an identity check
    before acting, note it: Art. 12(6) permits the controller to ask for information needed to
    confirm identity where it has reasonable doubts."
  - 'Can this controller identify the data subject at all? Art. 11(1): where the purposes for which
    a controller processes personal data "do not or do no longer require the identification of a
    data subject by the controller, the controller shall not be obliged to maintain, acquire or
    process additional information in order to identify the data subject for the sole purpose of
    complying with this Regulation". Art. 11(2): where the controller "is able to demonstrate that
    it is not in a position to identify the data subject" it shall inform the data subject
    accordingly if possible, and "In such cases, Articles 15 to 20 shall not apply except where the
    data subject, for the purpose of exercising his or her rights under those articles, provides
    additional information enabling his or her identification". Art. 12(2) carries the same limit
    from the other side: in Art. 11(2) cases the controller "shall not refuse to act on the request
    of the data subject for exercising his or her rights under Articles 15 to 22, unless the
    controller demonstrates that it is not in a position to identify the data subject". This reaches
    stores keyed only by an installation id, a device id or a hashed event key with no account
    behind them; it does not reach a product with sign-in, where an account row carrying an email
    address identifies the person by construction. Note the boundary: Art. 11(2) disapplies Arts. 15
    to 20 only, so the Art. 21 objection right and the Art. 22 automated-decision right stay owed
    either way. Where the store keeps a pseudonymous key, say whether the repository holds the
    additional information that re-attaches it, because Art. 4(5) and Recital 26 keep pseudonymised
    data inside the definition of personal data.'
  - Does an exemption or a limit apply to part of the data? Art. 17(3) withholds the erasure duty so
    far as processing is necessary for freedom of expression and information, for compliance with a
    legal obligation or a public-interest task, for public health, for archiving, research or
    statistics under Art. 89(1), or for the establishment, exercise or defence of legal claims; Art.
    20(1) attaches portability only where processing rests on consent or contract and is automated,
    and Art. 20(4) preserves the rights and freedoms of others - the reason a forum can be obliged
    to erase an author's account while other people's replies quoting it stay. Where a retention
    obligation is relied on, name the law and the period rather than the intention.
  - "Is this product offered in the EU at all, and to whom? Art. 3(1) applies the Regulation to
    processing in the context of the activities of an establishment in the Union, and Art. 3(2) to a
    controller outside it that offers goods or services to, or monitors the behaviour of, people in
    the Union. Check ScanProfile.distribution_regions and any EU-facing signal in the repository,
    such as EU locales, EUR pricing or EU consent code. A region that is not in the list may not
    have been asked: that question is open, not answered no."
  - "THE OPERATOR'S ROUTE COUNTS TOO. Art. 12(2) puts the duty on the controller: 'The controller
    shall facilitate the exercise of data subject rights under Articles 15 to 22.' It does not
    require that the person act alone. A request can reach the operator by any channel the operator
    runs (a monitored address, a form, a support desk: which one is a fact about the operator, not
    about the code), and the operator can then answer it with what the product ships. WHAT SHIPS IS
    A FEATURE OF THE PRODUCT that an operator uses through the product's own interface or through a
    command the product itself defines and documents: an administrator's deletion that erases the
    person's data (question 6), a view of the person's record (access) or a structured,
    machine-readable export of it (portability, question 5) that the operator can hand over, a
    correction, a task or command-line subcommand of the product's own. A database console, raw SQL,
    a framework's own console (`rails console`, `manage.py shell`, `artisan tinker`) and direct
    access to the store are not what ships, even where a document describes them: every product with
    a database could be answered that way, so they answer no right here. Where every right question
    5 walks that applies to this data (questions 10 and 11 say which do not) can be answered with
    what ships, by a route the person starts or by one the operator runs, the status is `duty_met`,
    its `at` the line of the route that answers erasure, and its `element` the words `the operator
    can answer the request with what ships`. A ROUTE THAT DOES NOT ACT answers its right only where
    both of two things hold. First, the refusal rests on a ground the Regulation gives, which the
    route's own code tests and which you name: the controller cannot identify the person (Art.
    11(2), question 10); a request that Art. 12(5) lets the controller refuse as 'manifestly
    unfounded or excessive, in particular because of their repetitive character', which the
    controller must show; an exception to erasure in Art. 17(3), 'Paragraphs 1 and 2 shall not apply
    to the extent that processing is necessary' for one of the purposes it lists, such as a
    retention law named with its period or the defence of a legal claim (question 11); the rights
    and freedoms of others, which limit what a copy or an export carries (Art. 15(4), Art. 20(4));
    processing outside portability's scope (Art. 20(1)); a request for restriction in none of the
    four cases Art. 18(1) lists; an objection the controller answers under Art. 21(1) with
    'compelling legitimate grounds for the processing which override the interests, rights and
    freedoms of the data subject'; or a restriction a Union or Member State law makes (Art. 23(1)).
    Where the ground turns on a fact about the operator (the lawful basis, a retention law, a
    national restriction), take it from the operator's declared documents or from the person running
    the scan, never from the code's words. While such a fact is unanswered and the refusal gives
    Art. 12(4)'s notice, write no `duty_met` on it: where every other applicable right is answered,
    the status is `waits_on_answer`, its `at` the refusal's line, and `fact` the words `the
    operator's ground for refusing this request: its lawful basis, a retention law or a national
    restriction` about `L1`; where another applicable right has neither route, the finding stays
    `duty_unmet` with that right named; and a refusal without that notice stays `duty_unmet`
    whatever its ground. Second, the refusal tells the person what Art. 12(4) requires, the
    controller informing the data subject 'of the reasons for not taking action and on the
    possibility of lodging a complaint with a supervisory authority and seeking a judicial remedy'.
    A refusal that gives that notice but rests on no such ground (a route that always declines, a
    feature switched off, a refusal for the product's own convenience) does not answer the right:
    Art. 12(4) is the duty that attaches to not acting, not a way of discharging the right. Where
    any applicable right has neither route, or only such a refusal, the finding stays `duty_unmet`,
    with that right named. Question 4's search for a route the person can start stands: it is how
    the person reaches the controller, and an administrator's route is how the controller answers. A
    WAY OUT HOLDS ONLY AT EVERY KEPT PLACE: a status this question gives is the finding's only where
    every place of the finding that you or the seats before you kept has the shape that status
    names; a kept place inside a helper or a shared function has that shape only where every call
    that reaches it does, so walk every caller, and a caller that would be `duty_unmet` makes that
    place `duty_unmet`. Where the kept places differ, the finding takes the heaviest of their
    statuses (`duty_unmet`, then `waits_on_answer`, then `duty_met` or `exempt`), with its `at` and
    its `decisive` at that place: one kept place that is `duty_unmet` makes the finding
    `duty_unmet`."
evidence_template: "{file}:{line} matched one of this rule's five shapes: a store, schema, model or
  form field named for people and their contact details; A NAMED PERSONAL-DATA FIELD READ, BOUND
  FROM A REQUEST OR HELD IN A SESSION - a quoted subscript read, an object accessor or property, a
  request-binding helper, a DOM field lookup, a form control or label, a mapping or object-literal
  key, a form model binding, or a server-side session store - WHICH SAYS THE PRODUCT HANDLES THE
  FIELD AND NOT THAT IT DECLARES IT, so read it as a pointer to the store rather than as the store;
  an identity forwarded to an analytics, error-reporting, payment or marketing vendor, or named in
  an identifier-shaped custom HTTP header (x-...-user-id and its siblings) whose receiving party the
  line does not identify - GDPR Art. 4(9) makes a recipient a body to which personal data are
  disclosed whether a third party or not, which is why an unnamed internal service counts. THE
  HEADER LIMB ESTABLISHES THE HEADER NAME AND NOT THE DIRECTION OF TRAVEL, and that limit is stated
  here rather than left to be found: the clause reads a quoted x-... header name wherever it stands,
  so a line that READS a header this product RECEIVED matches in exactly the same way as a line that
  writes one it sends. Measured 2026-08-28 over the eight pinned corpus trees, 2 of the 7 lines this
  limb reaches are inbound reads of that shape - `site_id = find_header(headers, x-site-id)` and
  `user_id = find_header(headers, x-current-user-id)`, in the same file whose lines 20 to 22 are the
  outbound writes. NOTHING ON THE MATCHED LINE SAYS WHICH SIDE OF THE WIRE IT IS ON. Read the
  surrounding lines before you record a disclosure; where the line turns out to be a read of an
  inbound header, the match is position-correct and direction-wrong, no recipient row follows from
  it, and saying so is the right answer rather than a dropped finding. The clause is not narrowed to
  the writing form, because a header name is the construct and nothing on a single line
  distinguishes the two uses; a data-subject route name sharing a line with a refusal or
  not-implemented marker; or an authentication construct named on an import, dependency or call line
  - next-auth, @auth/core, NextAuth(, passport.use(, bcrypt, argon2, make_password, set_password,
  @clerk/, lucia-auth, better-auth, supabase.auth.*, createUserWithEmailAndPassword(,
  django.contrib.auth, IdentityUser, devise and their siblings. THE FIFTH SHAPE IS AN INFERENCE, NOT
  A STORE, and a line matched by it will not look like one: an import of an authentication library
  is not a schema, not a form field and not a vendor disclosure, so nothing in the first four shapes
  describes it. The clause raises it because a project that authenticates people keeps accounts, and
  accounts are what Arts. 15-22 attach to. Read such a line as a pointer rather than as evidence:
  find the account store it implies and report that, or record that you looked and could not - it is
  neither a store on its own nor an incidental match to be dropped. Since 2026-09-14 the match may
  also come from a CONSTRUCT rather than from that line alone: this rule reads the bracket-balanced
  construct a line opens on as one folded text as well, so a data-subject route or handler whose
  refusal sits in a body written on the lines below its opening brace is matched as a whole, and
  where that is what happened the finding is reported on the line the construct opens on and carries
  the span it was folded from in locations[].joined_from. Read those lines together, not the opening
  line alone. Whether the values are personal data within Art. 4(1), or something the vocabulary
  only makes look personal, is context question 2. Whether this project offers the data subject an
  erasure route, a copy of the data in a commonly used electronic form and a way to make a request
  under Arts. 15-22 is not decidable from this line and is not decided by this detector: it is
  context question 4, answered by reading the code"
remediation_template: >
  Read this only after context question 4 has been answered. This candidate is raised by the

  presence of personal data, not by the absence of a route: a project that already ships a

  self-service erasure path and a JSON export produces exactly the same candidate as one that ships

  nothing, and the difference between them is a question for the reader rather than for the scanner.

  If the routes are already there, the useful output is the note recording where they live.

  Settle the role first, because GDPR Arts. 15-22 are owed by the controller (Art. 4(7)) and not by

  a processor. A product with its own accounts is the controller for those accounts; a service that

  only handles a customer's data on that customer's instructions is a processor for it, and owes the

  narrower Art. 28(3)(e) duty to assist the controller instead. If the repository is a processor for

  everything in the locations list, record that and the candidate closes.

  For a controller, the size of the team changes nothing: Chapter III carries no micro or small

  enterprise carve-out, and Art. 83(5)(b) puts an infringement of Arts. 12-22 in the higher fining

  tier.

  Engineering changes that close the gap, in the order they pay off:

  1. An erasure path the person can start themselves, which removes the data rather than marking
     them. Art. 17(1) says erase. If a two-stage design is wanted - mark now, remove later - ship
     the second stage as a scheduled job in the same change, with the interval written down, so the
     mark is a queue entry and not the whole feature.
  2. Propagation, which is the half that is usually missing. Art. 19 requires the erasure to be
     communicated to every recipient the data were disclosed to. Enumerate the recipients once
     (analytics, error reporting, session replay, CRM, transactional email and SMS, payments,
     support desk, warehouse, search index, backups and read replicas), then make the erasure path
     call each one's own deletion API and record the outcome. Several of them have one: a suppression
     or delete endpoint on the analytics vendor, a contact-delete on the CRM, a customer-delete on
     the payment processor. Where a store cannot be reached in-line - a backup, an immutable log -
     write down the retention period after which the copy disappears.
  3. A copy of the data, in a commonly used electronic form (Art. 15(3)) and, for the data the
     person provided under consent or contract, in a structured, commonly used and machine-readable
     format that another controller can ingest (Art. 20(1)). A JSON or CSV bundle generated on
     request satisfies both; a screenshot or a PDF of a settings page does not satisfy Art. 20.
  4. A route for the rest of Chapter III - access (15), rectification (16), restriction (18),
     objection (21) and a decision made solely by automated means (22) - even if it is one form
     that opens a ticket. Persist the request with its receipt timestamp so the Art. 12(3) one-month
     clock is measurable, and so an extension can be notified with reasons inside that first month.
  5. Where a request is refused, Art. 12(4) is what the response has to carry: the reasons, the
     possibility of lodging a complaint with a supervisory authority, and the possibility of a
     judicial remedy. A handler that returns a bare 403, a 501 or "not available" meets none of
     that, and Art. 12(5) puts the burden of showing a request excessive on the controller.
  6. Name the routes the way the ecosystem names them, so the next reader finds them in one search:
     delete_account / deleteAccount / accountDeletion for the Art. 17 action, delete_user_data or
     erase_personal_data for the contents, export_user_data / download_your_data / data_portability
     for the Art. 15(3) copy and the Art. 20(1) export, and dsar / data_subject_request /
     erasure_request for the intake route, with the request itself persisted as
     data_subject_requests. This is naming, not compliance - the scanner no longer reads these names
     and no longer suppresses anything on the strength of one - but a route nobody can find is a
     route the next audit will not credit either.
  One thing that does not count as erasure: pseudonymisation. Art. 4(5) defines it as processing

  after which the data "can no longer be attributed to a specific data subject without the use of

  additional information", and Recital 26 says such data "should be considered to be information on

  an identifiable natural person" - so a pseudonymiser leaves the data inside the Regulation and

  leaves Art. 17 unanswered. Anonymisation is different: Recital 26 puts data "rendered anonymous in

  such a manner that the data subject is not or no longer identifiable" outside the Regulation,
  which

  is why an anonymiser that genuinely severs re-identification can discharge the erasure duty.

  Where a mechanism already exists but the scanner could not see it - a form in a separate front-end

  repository, an identity provider's own console, a documented manual process - record where it
  lives

  so that the next reader can close the candidate from the note rather than re-deriving it.
data_categories:
  - user.contact.email
  - user.name
  - user.unique_id
  - user.authorization.credentials
  - user.contact.phone_number
  - user.contact.address
  - user.demographic.date_of_birth
fingerprint_spec: project
reading_class:
  class: existence
  elements:
    - name: erasure
      question: 5
      text: erasure (17)
    - name: access_copy
      question: 5
      text: a copy in a commonly used electronic form (15(3))
    - name: portability_export
      question: 5
      text: a structured, commonly used and machine-readable export of the data the person provided
        (20(1))
    - name: rectification
      question: 5
      text: correction of inaccurate data (16)
    - name: restriction
      question: 5
      text: restriction (18)
    - name: objection
      question: 5
      text: objection including to direct marketing (21)
    - name: automated_decision_route
      question: 5
      text: a route for a decision made solely by automated means (22)

id: eu-dsr-001
pack: eu-dsr
short_name: Where people's data is stored and read, for access requests
problem_line:
  text: No full way found for people to get, fix or erase data
  template: "{data}: no complete way found to get or erase it"
fix_line: Let people get, correct, export and erase their data; delete rows, not only mark them;
  tell those you shared it with.
title: Store, schema or read surface for people, an identity disclosed, or a stubbed data-subject
  route - GDPR Arts. 15-22
jurisdiction:
  - EU
legal_basis:
  - cite: 'General Data Protection Regulation, Regulation (EU) 2016/679, Arts. 15-22 - the data subject
      rights, every one of them owed by the CONTROLLER (Art. 4(7)). Art. 15(1): "The data subject
      shall have the right to obtain from the controller confirmation as to whether or not personal
      data concerning him or her are being processed, and, where that is the case, access to the
      personal data and the following information", followed by points (a)-(h) (purposes; categories
      of personal data; recipients; storage period; the existence of the rectification, erasure,
      restriction and objection rights; the right to lodge a complaint; the source where data were
      not collected from the data subject; the existence of automated decision-making). Art. 15(3):
      "The controller shall provide a copy of the personal data undergoing processing", and "Where
      the data subject makes the request by electronic means, and unless otherwise requested by the
      data subject, the information shall be provided in a commonly used electronic form." Art. 16:
      "The data subject shall have the right to obtain from the controller without undue delay the
      rectification of inaccurate personal data concerning him or her", and to have incomplete data
      completed. Art. 17(1): "The data subject shall have the right to obtain from the controller
      the erasure of personal data concerning him or her without undue delay and the controller
      shall have the obligation to erase personal data without undue delay where one of the
      following grounds applies", grounds (a)-(f) including (a) the data are no longer necessary,
      (b) consent is withdrawn and no other legal ground applies, and (d) the data have been
      unlawfully processed. Art. 18(1) gives a right to obtain restriction of processing in the four
      listed situations. Art. 20(1): the right "to receive the personal data concerning him or her,
      which he or she has provided to a controller, in a structured, commonly used and
      machine-readable format and have the right to transmit those data to another controller
      without hindrance", where processing rests on consent or contract and is carried out by
      automated means. Art. 21(1)-(3) give a right to object, and Art. 21(3) provides that where the
      data subject objects to processing for direct marketing purposes "the personal data shall no
      longer be processed for such purposes". Art. 22(1) gives a right not to be subject to a
      decision based solely on automated processing producing legal or similarly significant
      effects. Retrieved 2026-07-27 from the Publications Office cellar
      (http://publications.europa.eu/resource/celex/32016R0679, Accept-Language: eng).'
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Art. 12(2)-(4) - the duty to
      make the rights usable, again on the controller. Art. 12(2), quoted in full because the
      earlier version of this entry stopped at the first sentence and lost the Art. 11(2) limit that
      the second sentence carries: \"The controller shall facilitate the exercise of data subject
      rights under Articles 15 to 22. In the cases referred to in Article 11(2), the controller
      shall not refuse to act on the request of the data subject for exercising his or her rights
      under Articles 15 to 22, unless the controller demonstrates that it is not in a position to
      identify the data subject.\" Recital 59 sits behind that duty and is quoted here because this
      rule previously asserted the opposite of it: \"Modalities should be provided for facilitating
      the exercise of the data subject's rights under this Regulation, including mechanisms to
      request and, if applicable, obtain, free of charge, in particular, access to and rectification
      or erasure of personal data and the exercise of the right to object. The controller should
      also provide means for requests to be made electronically, especially where personal data are
      processed by electronic means.\" A published electronic address is therefore capable of being
      a modality; whether a particular one is depends on whether it is monitored and answered, which
      is a question for the reader and not a matter this rule settles. Art. 12(3): \"The controller
      shall provide information on action taken on a request under Articles 15 to 22 to the data
      subject without undue delay and in any event within one month of receipt of the request. That
      period may be extended by two further months where necessary, taking into account the
      complexity and number of the requests. The controller shall inform the data subject of any
      such extension within one month of receipt of the request, together with the reasons for the
      delay. Where the data subject makes the request by electronic form means, the information
      shall be provided by electronic means where possible, unless otherwise requested by the data
      subject.\" Art. 12(4): \"If the controller does not take action on the request of the data
      subject, the controller shall inform the data subject without delay and at the latest within
      one month of receipt of the request of the reasons for not taking action and on the
      possibility of lodging a complaint with a supervisory authority and seeking a judicial
      remedy.\" Art. 12(5) makes the actions free of charge, and puts the burden of proving a
      request manifestly unfounded or excessive on the controller. A route that answers a request
      with a fixed refusal is therefore not outside these provisions - Art. 12(4) is the provision
      it has to satisfy, and it must name reasons, the supervisory authority and the judicial
      remedy."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: 'General Data Protection Regulation, Regulation (EU) 2016/679, Arts. 17(2) and 19 - why an
      erasure that stops at the local database is incomplete. Art. 17(2): "Where the controller has
      made the personal data public and is obliged pursuant to paragraph 1 to erase the personal
      data, the controller, taking account of available technology and the cost of implementation,
      shall take reasonable steps, including technical measures, to inform controllers which are
      processing the personal data that the data subject has requested the erasure by such
      controllers of any links to, or copy or replication of, those personal data." Art. 19: "The
      controller shall communicate any rectification or erasure of personal data or restriction of
      processing carried out in accordance with Article 16, Article 17(1) and Article 18 to each
      recipient to whom the personal data have been disclosed, unless this proves impossible or
      involves disproportionate effort. The controller shall inform the data subject about those
      recipients if the data subject requests it." Art. 4(9) defines a recipient as "a natural or
      legal person, public authority, agency or another body, to which the personal data are
      disclosed, whether a third party or not" - which reaches the analytics, error-reporting,
      messaging, CRM and payment vendors an application forwards user records to.'
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
  - cite: 'General Data Protection Regulation, Regulation (EU) 2016/679, Art. 11 - processing which does
      not require identification. Art. 11(1): "If the purposes for which a controller processes
      personal data do not or do no longer require the identification of a data subject by the
      controller, the controller shall not be obliged to maintain, acquire or process additional
      information in order to identify the data subject for the sole purpose of complying with this
      Regulation." Art. 11(2): "Where, in cases referred to in paragraph 1 of this Article, the
      controller is able to demonstrate that it is not in a position to identify the data subject,
      the controller shall inform the data subject accordingly, if possible. In such cases, Articles
      15 to 20 shall not apply except where the data subject, for the purpose of exercising his or
      her rights under those articles, provides additional information enabling his or her
      identification." The disapplication reaches Arts. 15 to 20 only: the Art. 21 right to object
      and the Art. 22 right regarding solely automated decisions are outside it. Two boundaries
      decide whether it is available at all. Art. 4(5) defines pseudonymisation as processing after
      which the personal data "can no longer be attributed to a specific data subject without the
      use of additional information, provided that such additional information is kept separately",
      and Recital 26 says personal data which have undergone pseudonymisation "should be considered
      to be information on an identifiable natural person" - so holding the re-identification key
      defeats the Art. 11 case, and it also means a pseudonymisation routine does not discharge Art.
      17. Recital 26 puts only data "rendered anonymous in such a manner that the data subject is
      not or no longer identifiable" outside the Regulation. Retrieved 2026-07-27 from the
      Publications Office cellar (http://publications.europa.eu/resource/celex/32016R0679,
      Accept-Language: eng).'
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Art. 28(3)(e) - where a
      PROCESSOR's duty differs, and it differs completely. The contract binding the processor must
      stipulate that the processor \"taking into account the nature of the processing, assists the
      controller by appropriate technical and organisational measures, insofar as this is possible,
      for the fulfilment of the controller's obligation to respond to requests for exercising the
      data subject's rights laid down in Chapter III\". A processor therefore owes an assistance
      duty under a contract, not the Arts. 15-22 rights themselves, and it answers to the controller
      rather than to the data subject: Art. 28(3)(a) has it process personal data \"only on
      documented instructions from the controller\". Art. 28(3)(g) adds that at the end of the
      service the processor must, at the controller's choice, delete or return all the personal data
      and delete existing copies. A repository that is a pure processor - a hosted API, a background
      worker, an SDK operating on a customer's data - is outside the primary duty this rule tests,
      which is why identifying the role is the first context question."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "General Data Protection Regulation, Regulation (EU) 2016/679, Art. 83(5)(b) and Art. 99(2) -
      exposure and date. Art. 83(5)(b) puts infringements of \"the data subjects' rights pursuant to
      Articles 12 to 22\" in the higher fining tier, \"up to 20 000 000 EUR, or in the case of an
      undertaking, up to 4 % of the total worldwide annual turnover of the preceding financial year,
      whichever is higher\". Art. 99(2): \"It shall apply from 25 May 2018.\" Supervisory-authority
      attention is current rather than historical: the EDPB's Coordinated Enforcement Framework
      action for 2024 was the right of access (Art. 15) across 1,185 controllers, and the 2025
      action was the right to erasure (Art. 17) across 32 supervisory authorities and 764
      controllers, with the report adopted 2026-02-10."
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
    checked_at: 2026-07-27
    jurisdiction: EU
    supports_rule_condition: false

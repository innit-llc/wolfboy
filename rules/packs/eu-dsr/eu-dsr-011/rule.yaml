id: eu-dsr-011
pack: eu-dsr
short_name: Viewer's identity stamped into a served document or image
problem_line:
  text: Viewer's identity can be stamped into each served copy
  template: "{data} can be stamped into each served copy"
fix_line: Stamp only what you need, say at download that their copy is marked, and record that
  erasure cannot reach copies.
title: Recipient-identifying values composited into a document or image at the moment it is served
jurisdiction:
  - EU
legal_basis:
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(a) - personal data shall be 'processed lawfully,
      fairly and in a transparent manner in relation to the data subject'. This is the provision the
      construct turns on. A document is manufactured at the moment of delivery to carry the identity
      of the person receiving it, and whether that person is told their copy is individually marked
      is a fairness and transparency question before it is anything else
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 17(1) - 'The data subject shall have the right to obtain
      from the controller the erasure of personal data concerning him or her without undue delay and
      the controller shall have the obligation to erase personal data without undue delay where one
      of the following grounds applies'. The obligation is to erase the personal data, and a copy of
      it composited into a file that has already left the deployment is within the words while being
      outside everything the controller operates. Erasing the view record does not reach the stamped
      document somebody downloaded last month
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 19 - 'The controller shall communicate any rectification
      or erasure of personal data or restriction of processing carried out in accordance with
      Article 16, Article 17(1) and Article 18 to each recipient to whom the personal data have been
      disclosed, unless this proves impossible or involves disproportionate effort. The controller
      shall inform the data subject about those recipients if the data subject requests it.' Cited
      because each person handed a marked copy is a recipient to whom that person's own identifying
      data has been disclosed, and the duty runs to each of them. Note the two express limits in the
      same sentence - impossibility and disproportionate effort - which is why the finding this rule
      raises is a question about whether the deployment can enumerate its recipients at all, and not
      an assertion that it must reach every copy
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 5(1)(c) - personal data shall be 'adequate, relevant and
      limited to what is necessary in relation to the purposes for which they are processed'. The
      imprint is usually configured as free text, so which of the viewer's attributes are drawn into
      the page is an operator's choice made once and applied to every download. A mark carrying an
      e-mail address, a client IP address and a timestamp is a different minimisation question from
      a mark carrying an initial, and the two are one configuration field apart
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 14(1) - 'Where personal data have not been obtained
      from the data subject, the controller shall provide the data subject with the following
      information', which the paragraph then lists at points (a) to (f) including 'the purposes of
      the processing for which the personal data are intended as well as the legal basis for the
      processing'. Reference only, and deliberately so: the trigger is the SOURCE of the data, and
      compositing a value into a page is not obtaining it. Where the addresses stamped into a
      document were supplied by the document's owner rather than by the person the copy is served
      to, this entry becomes live - and establishing that is context question 2, not a detector's
      work"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-02
    jurisdiction: EU
    supports_rule_condition: false
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.4

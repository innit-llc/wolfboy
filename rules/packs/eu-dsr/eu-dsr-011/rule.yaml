  match:
    - (?&imprint_machinery)[^\n]{0,80}(?&receiver_identity)|(?&receiver_identity)[^\n]{0,80}(?&imprint_machinery)
    - (?&composition_call)[^\n]{0,80}(?&receiver_identity)|(?&receiver_identity)[^\n]{0,80}(?&composition_call)
    - (?:^|[^A-Za-z0-9_])(?&per_recipient_imprint)
    - (?&imprint_machinery)[^\n]{0,80}(?&burn_in)|(?&burn_in)[^\n]{0,80}(?&imprint_machinery)
    - (?&composition_call)[^\n]{0,80}(?&imprint_machinery)|(?&imprint_machinery)[^\n]{0,80}(?&composition_call)
    - \{\{\s*(?:ipAddress|ip_address|clientIp|client_ip|viewerEmail|viewer_email|recipientEmail|recipient_email|viewerName|viewer_name|viewerIp|viewer_ip|downloaderEmail|downloader_email)\s*\}\}
    - (?:(?&imprint_marker)|(?&imprint_machinery))[^\n]{0,80}\{\{\s*(?:email|date|time|link|name|user|username|userEmail|user_email)\s*\}\}|\{\{\s*(?:email|date|time|link|name|user|username|userEmail|user_email)\s*\}\}[^\n]{0,80}(?:(?&imprint_marker)|(?&imprint_machinery))
    - (?:(?&imprint_marker)|(?&imprint_machinery))[^\n]{0,80}(?:%|\$\{)\s*(?&receiver_identity)\s*(?:%|\})|(?:%|\$\{)\s*(?&receiver_identity)\s*(?:%|\})[^\n]{0,80}(?:(?&imprint_marker)|(?&imprint_machinery))
context_questions:
  - WHO ASKED FOR THIS FILE, AND WHOSE IDENTITY IS DRAWN ON IT? This is the first question because
    the whole type turns on it. Where the person who requested the document is the same person whose
    identity is stamped on it - their own export, their own invoice, their own certificate - this is
    not the construct and the candidate should be dismissed here, with the code path that shows it
    quoted. Where the artefact is served to one person and marked with that person's identity so
    that a later copy can be traced back to them, it is the construct. Read the route that produces
    the file and say which of the two it is; do not infer it from the name of the routine.
  - "WHICH ATTRIBUTES ARE ACTUALLY COMPOSITED, AND WHERE DOES THE OPERATOR CHOOSE THEM? Find the
    imprint's text template and quote it. The placeholder set is the list of attributes drawn into
    every copy, and it is usually a free-text field an operator filled in once: an e-mail address,
    the client IP address of the request, a timestamp, a link name. Say which of them are values the
    person supplied to this product and which are values observed from their request, because that
    distinction decides whether the Art. 14(1) entry in this rule's legal basis is live at all -
    Art. 14 applies where the data was NOT obtained from the data subject, and a dataroom whose
    viewer list is set by the document owner is exactly that case."
  - IS THE IMPRINT SWITCHED ON IN THIS DEPLOYMENT? The detector cannot answer this and must not be
    read as having answered it. The mark is almost always an operator configuration row - a per-link
    setting, a workspace default, a plan feature - so the code being present says the capability
    exists, not that any document carries a mark. Find the configuration and say whether it is on,
    for which links or documents, and who can turn it on.
  - IS THE PERSON RECEIVING THE FILE TOLD THAT THEIR COPY IS INDIVIDUALLY MARKED? Look for the text
    shown at the point of download or in the viewer, not for a clause in a policy document
    elsewhere. A visible mark carrying a legible e-mail address tells the person something; a
    low-opacity tiled mark, a mark drawn only on later pages, or an imprint carrying an IP address
    the person never sees may not. Quote whatever the person is actually shown, or record that
    nothing is.
  - "WHAT HAPPENS TO THE MARKED COPIES WHEN THE PERSON ASKS FOR ERASURE? Follow the erasure route
    for a viewer record and say where it ends. The honest answer is normally that it reaches the
    view row and the analytics, and reaches nothing at all in the files already downloaded - which
    is the finding, and it should be recorded as a limit of the route rather than as a defect
    somebody can fix. Then address Art. 19 separately: each person handed a marked copy is a
    recipient, the duty to communicate an erasure to each of them is subject to express limits for
    impossibility and disproportionate effort, and the practical question is whether the deployment
    can enumerate the recipients at all."
  - "IS THE MARK IN THE ARTEFACT'S SUBSTANCE OR IS IT A REMOVABLE LAYER? A PDF annotation, an
    optional-content layer, an XMP or EXIF field and an HTTP header can all be stripped without
    touching the page content, and none of them is this construct. Check for a flatten, burn-in or
    rasterise step and say whether one runs. Where it does, say so plainly: every copy made
    afterwards carries the identity, and no later editing removes it."
evidence_template: "{file}:{line} matched a place where this product composites
  RECIPIENT-IDENTIFYING VALUES into a document or an image at the moment it is served: an imprint
  routine carrying a viewer payload, a drawing call beside a viewer identifier, an imprint named for
  the recipient it identifies, an imprint beside a burn-in instruction, a drawing call inside the
  imprint routine, or a text template naming a viewer attribute. THAT IS THE WHOLE OF WHAT IS
  ESTABLISHED - that the code manufactures per-recipient copies. IT DOES NOT ESTABLISH THE ONE FACT
  THE TYPE TURNS ON: whether the person receiving the file is a different person from the one whose
  identity is drawn on it. A person's own export stamped with their own identity matches these
  clauses exactly and is NOT this construct; that is context question 1 and it decides the
  candidate. It does not establish that the imprint is switched on in this deployment - that is an
  operator configuration row and is context question 3. It does not establish that the recipient was
  told - question 4. And it does not establish that the mark is in the artefact's substance rather
  than in a removable layer, although a burn-in instruction on the matched line is evidence that it
  is - question 6. Where the construct is confirmed, the reach question follows: the copies live
  outside every store this controller operates, so an erasure route that reaches the view record has
  not reached them, and each holder of a marked copy is a recipient in Art. 19's sense."
remediation_template: >
  Answer the actor-versus-subject question first, from the route that produces the file. Where the

  person receiving the document is the person it is marked with, there is nothing further to do here

  and the candidate closes.

  Where it is a per-recipient mark, write down the attribute set. The imprint's text template is a

  configuration field, it is usually the only place the attribute set is recorded, and it is where a

  reduction is cheapest: a mark that identifies a copy does not need a full e-mail address, a client

  IP address and a timestamp together, and each attribute dropped is one fewer value living in every

  copy that leaves.

  Tell the person at the point of download. The mark is applied to their copy, it carries their own

  identity, and a sentence at the download button is the difference between a control they know

  about and one they discover from a forwarded file.

  Record the reach limit honestly rather than designing around it. Copies already served cannot be

  reached by any erasure route, and writing that down - in the record of processing activities and
  in

  the answer given to an erasure request - is the accurate position. Where the deployment keeps a

  list of who received a marked copy, that list is what makes an Art. 19 communication possible at

  all; where it does not, that is the gap to record.

  Check whether the mark is burned in or is a layer. A layer that can be stripped is a weaker
  control

  and a smaller exposure at the same time; a mark flattened into the page content is the reverse.
  Say

  which one this is, because the two lead to different answers on both counts.

  Where the viewer list is set by the document's owner rather than by the viewer, revisit the

  Art. 14(1) entry in this rule's legal basis: in that configuration the addresses were not obtained

  from the data subject, and the information duty in that paragraph becomes live.
data_categories:
  - user.contact
  - user.identifiers
  - user.behavior
fingerprint_spec: file

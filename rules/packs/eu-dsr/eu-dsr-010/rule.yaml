id: eu-dsr-010
pack: eu-dsr
short_name: Personal data copied into a search index, dump or export
problem_line:
  text: "Copy of personal data: erasure or expiry for it not found"
  template: "Copy of {data}: erasure or expiry for it not found"
fix_line: Make deletion reach the copy and keep deleted rows out of rebuilds, give the copy a
  lifetime, and list who holds it.
title: Personal data copied into a search index, a derived search table, an embedding store, a dump
  or an export archive, or handed out as an attachment or a browser download
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 17(1) - 'The data subject shall have the right to
      obtain from the controller the erasure of personal data concerning him or her without undue
      delay and the controller shall have the obligation to erase personal data without undue delay
      where one of the following grounds applies'. The obligation is to erase the personal data, not
      the primary row: a copy in a search index or an export archive is within it, and a deletion
      path that reaches only the source table has not discharged it"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: GDPR (Regulation (EU) 2016/679), Art. 19 - 'The controller shall communicate any rectification
      or erasure of personal data or restriction of processing carried out in accordance with
      Article 16, Article 17(1) and Article 18 to each recipient to whom the personal data have been
      disclosed, unless this proves impossible or involves disproportionate effort. The controller
      shall inform the data subject about those recipients if the data subject requests it.' Cited
      because a hosted search service or an export handed to a user or to a third party is a
      recipient, and the duty runs to each of them
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 5(1)(e) - personal data shall be 'kept in a form which
      permits identification of data subjects for no longer than is necessary for the purposes for
      which the personal data are processed'. A derived copy has its own lifetime, which is usually
      governed by nothing at all: an index is rebuilt rather than expired, and a dump directory
      grows"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-09-01
    jurisdiction: EU
effective_date: 2018-05-25
severity: medium
rule_confidence: 0.35
detector:
  engine: builtin-regex
  file_globs:
    - "**"
  join_bracketed_constructs: true
  shared_vocabulary:
    - export_disposition_carriers
    - export_download_triggers
    - export_document_writers
  match:
    - (?:^|[^A-Za-z0-9_])(?:Chewy|chewy|Searchkick|searchkick|MeiliSearch|Meilisearch|meilisearch|Typesense|typesense|SphinxQL|sphinxql|OpenSearchClient|ElasticsearchClient|Elasticsearch|elasticsearch|OpenSearch|opensearch|SolrClient|solr|Algolia|algolia|algoliasearch|RediSearch|pg_search)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:addDocuments|add_documents|indexDocuments|index_documents|updateDocuments|update_documents|deleteDocuments|delete_documents|bulkIndex|bulk_index|reindex|reindex_all|rebuild_index|rebuildIndex|update_index|updateIndex|refresh_index|index_record|index_document|indexDocument|IndexDocument|update_search_index)\s*\(
    - (?:^|[^A-Za-z0-9_])(?:(?:[Ss]earch|[Ii]ndex|[Ee]lastic|[Oo]pen[Ss]earch|[Mm]eili|[Tt]ypesense|[Ss]olr|[Ss]phinx|[Aa]lgolia|[Cc]hewy)[A-Za-z0-9_]*|[Ee]s(?:(?:[Cc]lient|[Ss]ervice|[Cc]onnection|[Cc]onn|[Nn]ode|[Rr]epository|[Rr]epo|[Ii]ndex|[Ss]earch|[Bb]ulk|[Ww]riter|_client|_service|_index)[A-Za-z0-9_]*)?)\s*\.\s*(?:index|add|update|save|import|store)[!?]?\s*\(
    - "[A-Za-z0-9_]*(?:Index|index|Search|search)\\s*\\.\\s*(?:index|add|update|save|import|store|r\
      eindex|delete)[!?]?\\s*\\("
    - (?:^|[^A-Za-z0-9_])(?:index_scope|define_type|search_data|search_import|searchable_text|search_document|as_indexed_json|should_index|searchkick_index|update_index_on)(?![A-Za-z0-9_])
    - (?:^|[^A-Za-z0-9_])(?:sql_query_pre|sql_query_post|sql_query_range|sql_query_killlist|sql_attr_[a-z_]+|sql_field_[a-z_]+|rt_field|rt_attr_[a-z_]+)(?![A-Za-z0-9_])|^[
      \t]*sql_query[ \t]*=[
      \t]*(?:\\|[Ss][Ee][Ll][Ee][Cc][Tt]|[Ww][Ii][Tt][Hh]|[Cc][Aa][Ll][Ll])(?![A-Za-z0-9_])

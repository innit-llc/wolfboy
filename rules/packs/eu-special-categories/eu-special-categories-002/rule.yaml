context_questions:
  - "Is the matched value biometric data within GDPR Art. 4(14) at all - personal data resulting
    from specific technical processing relating to the physical, physiological or behavioural
    characteristics of a natural person, which allow or confirm the unique identification of that
    natural person? Quote the line where the template, embedding or comparison input is built and
    say what it derives from. ASK WHAT IS MEASURED, NOT WHICH WORD IS USED. The question is whether
    the value derives from a measurement of a person's body or behaviour, or from something else
    that shares the vocabulary. Four look-alikes recur and each is outside this rule: browser or
    device fingerprinting (FingerprintJS, visitorId, canvas and audio-context entropy - this
    measures a MACHINE CONFIGURATION, not a person's physical, physiological or behavioural
    characteristics); TLS certificate, SSH key and build-artifact fingerprints, which measure bytes;
    3D-geometry 'face' identifiers, where mesh faces next to a distance call are polygons; and
    model, dataset or product names that merely contain the vocabulary (InterSystems IRIS, the
    Fisher iris dataset, PaLM). TWO WARNINGS ABOUT USING THAT LIST. First, do not close on the word:
    keystroke dynamics, mouse dynamics, gait and continuous-authentication products are routinely
    marketed as 'fingerprinting' and they measure a person's BEHAVIOUR, which is squarely inside
    Art. 4(14)'s 'behavioural characteristics'. If what is measured is the human, the shared word is
    irrelevant and the candidate stays open. Second, 'wrong rule' is not 'no issue': a browser or
    device fingerprint is still personal data under Art. 4(1) and still engages the ePrivacy
    terminal-equipment rule eu-consent-012, so close this candidate by naming that rule as the right
    home, never by writing that nothing is wrong. Where what you find is genuinely one of the four,
    say which, say what it measures, and say where the question goes instead."
  - "Is the processing for the purpose of uniquely identifying a natural person - the qualifier Art.
    9(1) places inside the biometric limb, and the question this detector never answers? Two shapes
    pass it: 1:1 verification of a probe against an enrolled template (verify, CompareFaces,
    compare_faces, verifyFaceToFace), and 1:N identification against a gallery or collection
    (IndexFaces + SearchFaces, PersonGroup identify, FaceMatcher over LabeledFaceDescriptors,
    speaker identification). Three shapes fail it: detection used only to crop, blur, count or
    autofocus, with no template stored and no comparison; liveness or presence checking with no
    enrolment; and emotion or attribute estimation with no identity match. FAILING THIS RULE'S
    PURPOSE ELEMENT IS NOT THE SAME AS THERE BEING NO PROBLEM, and the third shape is where that
    distinction bites. Attribute estimation from a face or a voice is outside the BIOMETRIC limb of
    Art. 9(1) because nobody is being singled out - but its OUTPUT may sit in another Art. 9(1) limb
    entirely: an ethnicity or ancestry estimate is personal data revealing racial or ethnic origin,
    and an emotion, stress, fertility or disease-risk estimate is data concerning health. C-184/20
    (quoted in legal_basis) holds that data liable indirectly to reveal a special category are
    inside Art. 9(1) whichever limb they belong to, and it does not matter that a model produced
    them. So route this shape onward rather than closing the GDPR question:
    eu-special-categories-003 for race, ethnicity, religion, political opinion, trade union
    membership, sex life or sexual orientation; eu-special-categories-001 for anything
    health-shaped; and the AI Act rules for the separate prohibitions on the system itself
    (ai-prohibited-003 for biometric categorisation, ai-prohibited-001 and ai-transparency-007 for
    emotion). Those are different instruments with different addressees - Art. 5(1)(g) of the AI Act
    bites on the provider or deployer of the categorisation system, while Art. 9(1) bites on anyone
    processing its output, including a downstream party that never built a model. Say which rule you
    are routing to and why; do not write 'not biometric identification' and stop. Recital 51 (quoted
    in legal_basis) makes photographs as such neither special-category nor biometric data. Where the
    surfaced line is an artifact with no visible comparison, trace where the template goes -
    enrolment in one file and matching in another is the normal layout, and a detect-only call whose
    output feeds an identification pipeline elsewhere is inside the purpose after all. Quote the
    enrolment and the comparison, or record that you traced and found neither, in which case the
    identification limb is unproven - say so and stop. THE TEST IS RECOGNITION, NOT A NAME, and this
    is the correction that matters most in this question. Unique identification does not require
    that anyone learn who the person is. EDPB Guidelines 3/2019 paragraph 82 (quoted in legal_basis)
    decides exactly this: a shop that stores templates in order to detect a data subject
    're-entering the area or entering another area' is uniquely identifying a natural person and the
    operation falls under Article 9 'from the start', because 'it is aimed at recognition through
    the use of specific technical processing' - and that shop never learns a name. So singling the
    same person out again, across sessions, visits, recordings or camera ranges, IS the purpose,
    however the label is spelled and even if the label is a random cluster id. Two corollaries. A
    template deleted immediately after the comparison is still biometric data processed to uniquely
    identify (Example 5 under paragraph 83), so do not close a candidate because the template is
    ephemeral or held only in memory. And where a system captures everyone in order to decide who is
    enrolled and who is not, paragraph 84 says an Art. 9(2) exception is needed for everyone
    captured, not only for the enrolled. Speaker diarisation is the case this distinction actually
    decides, and it goes both ways: clusters computed within ONE recording purely to separate turns,
    discarded with the transcript, do not single anybody out across anything and the purpose is not
    shown; voiceprints that PERSIST across recordings so the same speaker is recognised again are
    inside Art. 9(1) whether the cluster is called SPEAKER_00 or Alice. Quote the retention and the
    scope of the labels, not whether a name appears."
  - "Does this party's code ever hold the sample, the template, or the comparison? THAT is the
    question, and it is deliberately not 'where is the template stored'. A WebAuthn or passkey
    platform authenticator (navigator.credentials.create with authenticatorAttachment 'platform',
    userVerification 'required'), Android BiometricPrompt, and Face ID / Touch ID wrappers do close
    the candidate - but for a precise reason: the capture, the template and the comparison all
    happen inside the device's secure hardware, and the relying party receives a public key and a
    signed assertion, so it never processes biometric data at all. Where that is the whole of the
    biometric-adjacent code, record it and close. DO NOT GENERALISE THAT TO 'THE TEMPLATE IS ON THE
    USER'S DEVICE, SO WE ARE OUT'. EDPB Opinion 11/2024 assesses precisely the case where the
    enrolled template sits 'in the hands of the individual, for example, on their individual device,
    under their sole control' for 1:1 authentication, and still analyses the operation as Art. 9
    processing by the controller, requiring safeguards - storage location is a mitigation and a
    proportionality argument, not an exit from Art. 9. So a system where this party's code captures
    the face, builds the template, or runs the match is inside Art. 9(1) however the template is
    stored afterwards, including where it is written back to the user's phone or held only in memory
    for the duration of one comparison. A server-side enrolment is the clearest case and stays open:
    a template computed or received server-side, stored in a database or object store, or sent to a
    vendor API is processing by (or on behalf of) the party running that server, whatever
    authentication vocabulary surrounds it."
  - "Whose characteristics are processed - an identified or identifiable natural person? Quote what
    the template or match result is keyed to: a user id, an employee record, a customer account, a
    visitor session that is later joined to an identity. Synthetic test faces, stock demo images and
    the vendor's own sample datasets are not personal data about anyone; say so if that is all the
    code touches, and note that the same pipeline pointed at real users re-opens the question."
  - "Which Art. 9(2) exception could the processing rest on, and can you name its legal basis? All
    ten points are quoted in legal_basis; nine are invisible to a scanner, so answer from the code
    and the repository's own statements, and quote what you find. Walk them in the order a real
    product turns them on: (a) explicit consent for one or more specified purposes - a consent
    checkbox or enrolment opt-in near the biometric code is a lead, never an answer, because the
    consent must be explicit and the purposes specified, and a record of it must exist (the
    eu-consent-016 questions apply to that record); (b) employment and social security law - the
    common claim for workplace fingerprint or face attendance and access-control terminals, and it
    requires authorisation by Union or Member State law or a collective agreement, not merely an
    employment contract; (e) manifestly made public by the data subject - and treat this one with
    particular care, because EDPB Guidelines 3/2019 paragraph 70 (quoted in legal_basis) says a
    controller processing special categories through video surveillance cannot rely on it, since
    'the mere fact of entering into the range of the camera does not imply that the data subject
    intends to make public special categories of data relating to him or her'; the same reasoning
    defeats a claim that a scraped public photograph was manifestly made public as biometric data;
    (f) legal claims; (g) substantial public interest on the basis of a named Union or Member State
    law. Where the code shows nothing either way, record explicitly that you looked and it shows
    nothing."
  - "Who is the controller, where do the templates go, and what does Art. 9(4) leave open? A
    library, SDK or integration connector that wraps a face API for a caller is not thereby the
    controller - record the finding against the integrating application where this repository is a
    component. Trace the template store and every recipient: a vendor API call (AWS, Azure) sends
    biometric data to a processor, and a recipient outside the EEA adds the Chapter V transfer
    questions (Arts. 44-49), which are separate duties not decided here. And because Art. 9(4) lets
    member states maintain or introduce FURTHER conditions on biometric data expressly, an answer
    that everything above is in order is still only the GDPR position - name the member states the
    deployment shows, and say that national conditions were not assessed."
  - "WHO ANSWERS WHICH ART. 9(2) CONDITION THE ORGANISATION RELIES ON? Whether the organisation that
    runs this product has a condition under Art. 9(2) for the special-category data it keeps, and
    has it written down, is a fact about that organisation: the person running the scan is asked it
    as the Art 9 condition question, ScanProfile.operator.special_category_condition, and the code
    never decides it. Where the matched value is special-category data about an identifiable person
    and what remains open is that condition - the Art. 9(2) question above - write the finding as
    waiting on operator.special_category_condition, whether or not it has been answered, and let the
    program apply the answer. The leads the Art. 9(2) question asks you to quote from the repository
    corroborate or contradict the answer; where they contradict it, say so in the reasoning. The
    answer settles that condition and nothing else: whether the value is special-category data at
    all and whom it concerns, any further condition Member State law adds under Art. 9(4), and
    whether the condition covers the use this finding is about, stay yours, so where one of those
    decides the finding, answer it instead of waiting. An answer that the organisation has a
    condition never says that it covers a particular use: each condition is tied to its purpose
    (Art. 9(2)(a) consent is given for one or more specified purposes), so each onward use the code
    shows - the value sent to a log or an error tracker, an analytics, marketing or session-replay
    SDK or another tracker, a language model or another third-party API, or an export - is yours to
    judge on its own line, with the transfer, minimisation and integrity questions it raises, and is
    never written as waiting on this answer."
evidence_template: "{file}:{line} names a biometric template artifact or a biometric
  identification/verification operation (face, voice/speaker, fingerprint, iris, palm, gait or
  keystroke). SOME OF THAT VOCABULARY IS A BARE TOKEN THAT IS ALSO AN ORDINARY ENGLISH WORD, and
  some of it names a picture rather than an operation. `minutiae` is the standard word for
  fingerprint template features and is also the ordinary English noun, met in a company newsletter
  paragraph about product engineering; and a case arm of an icon-name mapping table that returns a
  face-recognition glyph names an icon, not a comparison. Read the matched line and say which kind
  you are holding, or that it is neither; context question 1 sets out four further look-alikes and
  asks what each of them measures. Whether the processing is for the purpose of uniquely identifying
  a natural person - the qualifier GDPR Art. 9(1) places inside the biometric limb - and whether an
  Art. 9(2) exception applies are not tested by the detector; they are context questions 2 and 5."
remediation_template: |
  This is a candidate for review against GDPR Art. 9(1), which prohibits processing biometric data
  for the purpose of uniquely identifying a natural person unless an Art. 9(2) exception applies -
  not a determination about this code. Art. 9 is listed expressly in Art. 83(5)(a), the
  Regulation's upper fining band (up to 20 000 000 EUR or 4 % of total worldwide annual turnover,
  whichever is higher), and has applied since 2018-05-25.
  Establish three facts first, because most candidates close on one of them:
  1. Is it biometric data within Art. 4(14) at all - a template, embedding or matcher over a
     person's physical, physiological or behavioural characteristics? Device and browser
     fingerprints, TLS/SSH/build fingerprints and 3D-mesh "faces" are not; a photograph as such
     is not either (Recital 51) until a specific technical means is applied to it.
  2. Is the purpose uniquely identifying a person - 1:1 verification or 1:N search? Recognising
     the same person again is enough; nobody has to learn a name (EDPB Guidelines 3/2019 para.
     82), and a template deleted straight after the comparison still counts. Detection used only
     to crop, blur or count, and liveness with no enrolment, fail this element. Emotion or
     attribute estimation with no identity match also fails it - but its OUTPUT may be a
     different Art. 9(1) category, so route it to eu-special-categories-003 (race, ethnicity,
     religion, politics, trade union, sex life, orientation) or eu-special-categories-001
     (health) as well as to the AI Act rules, rather than closing the GDPR question.
  3. Does this party process the biometric at all? WebAuthn/passkey platform authenticators,
     BiometricPrompt and Face ID keep it on the user's device; the server holds a public key.
  If all three hold, the engineering choices are concrete. Where identification is incidental to
  the feature (the feature is cropping, filtering, deduplicating photos), remove the
  identification limb: use detect-only calls, stop computing or storing templates, and delete
  stored template columns and collections (Rekognition collections, PersonGroups, descriptor
  tables). Where authentication is the goal, prefer the on-device shape: platform authenticators
  (WebAuthn/passkeys) give the server a public key and take the biometric out of the controller's
  hands entirely. Where identification IS the product (KYC selfie-to-document verification, access
  control, attendance), the processing needs a named Art. 9(2) basis before it runs: explicit
  consent for specified purposes with a demonstrable record (point (a)), or an employment /
  social-security law authorisation (point (b)) - an employment contract alone is not that.
  Around that basis sit further duties which are SEPARATE from Art. 9(1), which this rule does
  not test, and which it states here only so they are not forgotten: minimisation and storage
  limitation (Art. 5(1)(c) and (e)), and the Chapter V analysis for any non-EEA vendor
  (Arts. 44-49). On the data protection impact assessment specifically, state it accurately
  rather than flatly: Art. 35(1) requires one where the processing is 'likely to result in a
  high risk to the rights and freedoms of natural persons', and Art. 35(3)(b) makes one required
  in particular for 'processing on a large scale of special categories of data referred to in
  Article 9(1)'. Both are quoted in legal_basis. Whether this deployment is large scale is not
  something the code shows, so establish the scale before asserting the duty - but note that
  Art. 35(3) says 'in particular', so a smaller biometric identification system can still meet
  the Art. 35(1) threshold on its own facts. Two limits to state plainly:
  member states may impose further conditions on biometric data (Art. 9(4)), so a GDPR-only
  answer is never the whole answer; and where the pipeline also infers emotions or protected
  characteristics, or its gallery was built by untargeted scraping, the AI Act prohibitions
  (ai-prohibited-001/-002/-003) are separate duties with their own rules - a finding here does
  not absorb them, and clearing this rule does not clear them.

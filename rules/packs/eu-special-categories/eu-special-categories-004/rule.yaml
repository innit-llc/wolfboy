settling_questions:
  - operator.special_category_condition
context_questions:
  - "Does the sequence, genotype or marker relate to an identified or identifiable natural person?
    GDPR Art. 4(1) is the gate for the whole of Art. 9, and Art. 4(13) requires the data to relate
    to 'the inherited or acquired genetic characteristics of a natural person'. Five shapes reach
    this detector and are outside that: a REFERENCE genome or reference panel (GRCh38, hg38, a
    RefSeq or Ensembl transcript set) which is a coordinate system rather than anybody's data; a
    NON-HUMAN genome - plant, animal, microbial, viral - where a pathogen assembly from a patient
    sample is the one case that can still be personal data of the patient; a SYNTHETIC or simulated
    dataset generated by the code itself; a POPULATION-LEVEL summary such as an allele-frequency
    table, a gnomAD lookup or a cohort count with no person key; and a bioinformatics LIBRARY or
    format parser that defines the data structures and ships no data. Quote the schema, the file
    header or the loader that shows what the record is keyed on, and say whether a person
    identifier, a pseudonymous sample identifier that the project can re-link, or nothing at all
    sits next to the sequence. Note that a pseudonymous sample identifier plus a separate linking
    table is still personal data: Art. 4(1) covers identification 'directly or indirectly'."
  - "Is it genetic data within Art. 4(13), and by which route? The definition has three cumulative
    elements: the data relate to inherited OR ACQUIRED genetic characteristics of a natural person,
    they give unique information about that person's physiology or health, and they result in
    particular from the analysis of a biological sample from that person. Recital 34 opens the third
    element wide: 'in particular chromosomal, deoxyribonucleic acid (DNA) or ribonucleic acid (RNA)
    analysis, or from the analysis of another element enabling equivalent information to be
    obtained'. So a karyotype, an RNA-seq profile, a genotype array, an HLA type, a polygenic risk
    score computed from that array, and a marker panel are all inside the concept, and 'acquired'
    brings in a somatic tumour variant profile and epigenetic marks. Two things that are not:
    gene-expression counts of a cell line rather than of a person, and a value that only borrows the
    vocabulary - a genetic ALGORITHM's chromosome and alleles, a 'genome' used as a metaphor for a
    configuration set, or a `.vcf` file that is an address-book export. Quote the field and map it
    to the element it satisfies."
  - Does the code also compute or store something derived from the genetic data that carries the
    same information? Art. 4(13) covers data that 'give unique information about the physiology or
    the health' of the person, and Recital 34 covers 'another element enabling equivalent
    information'. So a polygenic risk score, a carrier-status flag, a predicted-trait field, an
    ancestry-composition breakdown, a relative-match list and a pharmacogenomic dosing
    recommendation are inside the same prohibition as the raw genotype they came from, and they are
    frequently stored in a different table from it, under names this detector may not have reached.
    Trace the derived values and quote them, because remediation that protects the VCF and leaves
    the derived scores in an ordinary user profile has not addressed the finding.
  - "Which Art. 9(2) point is being relied on, and can you name it and the law it rests on? Nine of
    the ten are invisible to a detector, so this is the question the scanner cannot answer at all.
    Walk them in the order a real genomics codebase turns on them. (a) EXPLICIT CONSENT to one or
    more specified purposes - the consumer-genomics answer, and the bar is higher than an ordinary
    consent: it must be explicit and the purposes must be specified, so a signup checkbox covering
    'improving our services' is a lead rather than an answer, and research re-use, relative matching
    and any onward sharing are separate specified purposes. (j) SCIENTIFIC RESEARCH, archiving in
    the public interest or statistics under Art. 89(1), on the basis of Union or Member State law
    with proportionate safeguards - the research-cohort answer. (h) preventive or occupational
    medicine, medical diagnosis, or the provision of health or social care, on the basis of Union or
    Member State law or a contract with a health professional - the clinical-genetics answer, and it
    is conditional on Art. 9(3), which requires the data to be processed by or under the
    responsibility of a person bound by an obligation of professional secrecy: an organisational
    fact, so say whether the repository shows it or not. Then (b) employment and social security
    law; (c) vital interests where the data subject is incapable of giving consent; (d) a
    not-for-profit body processing only its members' data; (e) data manifestly made public by the
    data subject - which is the one that can be visible in code, where a project ingests openly
    published genomes, and it is narrow; (f) legal claims, which is where paternity and forensic
    testing usually sits; (g) substantial public interest under a named Union or Member State law;
    (i) public health. Quote what you find, or record explicitly that you looked and the code shows
    nothing either way."
  - "Where does the value go, and who receives it? A sink is not required for this rule to be right
    - Art. 9(1) prohibits processing, and Art. 4(2) includes collection, recording, structuring and
    storage - but each hop adds a separate duty. Trace it and quote every hop: a first-party
    database or object store; a console, structured log or crash report; an analytics or
    product-telemetry call; an LLM or hosted-inference provider, which is the fastest-growing route
    for a genomic payload to leave the machine; a third-party variant-interpretation or annotation
    API; a session-replay recorder. Two consequences worth naming: a recipient outside the EEA
    raises Arts 44-49 on top of Art. 9, and a genotype in an application log raises Art. 5(1)(f) and
    is rarely intended by anyone. Say which sinks you found and quote the call."
  - "Who is the controller for this processing, and is that the party whose repository this is? Note
    first what Art. 9(1) does and does not say, because this file said the wrong thing until
    2026-08-03 and contradicted its sibling -001 in doing so. Art. 9(1) is written in the passive -
    processing of genetic data 'shall be prohibited' - and it names no addressee at all, so the
    prohibition binds whoever carries out the operation, controller and processor alike. Art. 4(8)
    defines a processor as a body 'which processes personal data on behalf of the controller', and
    that activity is itself processing within Art. 4(2). What is controller-shaped is most of Art.
    9(2): the exceptions turn on purposes, consent and legal bases that only a controller
    determines, and Art. 4(7) defines the controller as the body 'which, alone or jointly with
    others, determines the purposes and means of the processing of personal data'. The contrast that
    settles it is Art. 5(2), where the Regulation names an addressee when it means to: 'The
    controller shall be responsible for, and be able to demonstrate compliance with, paragraph 1'.
    Art. 9(1) contains no such sentence. So the question to answer is not 'is this repository the
    controller' but two questions: who processes here, and who determines the purposes and means. A
    format parser, a bioinformatics library, a workflow module or an integration connector that
    carries a VCF record or an rsID through to its caller does not determine the purposes and means,
    so it is not the controller - though a deployment of it that stores real genotypes is still
    processing. Where the repository is a component rather than a deployed service, record the
    finding against the integrating application and say so, rather than reporting the library as the
    addressee."
  - "Does Art. 9(4) change the answer for the Member States this product is deployed in? For genetic
    data, biometric data and data concerning health, Art. 9(4) lets a Member State 'maintain or
    introduce further conditions, including limitations', so a national condition on genetic data
    may exist on top of the Regulation. Note the limit of the paragraph as well: it reaches only
    these three categories. Neither this scan nor the authoring of this rule assessed any national
    instrument - no Member State law was fetched or read - so treat this question as open rather
    than as answered in either direction. Name the Member States the repository shows the product
    operating in, and record that national conditions on genetic data were not assessed, so that a
    reader does not treat an identified Art. 9(2) point as the end of the question."
  - "Is anything here liable INDIRECTLY to reveal a person's genetic characteristics, even though it
    is not itself a sequence, a genotype or a marker? CJEU C-184/20, quoted in this rule's
    legal_basis, holds that personal data liable indirectly to reveal a special category are inside
    Art. 9(1), and it reached that holding by refusing to make the test weaker for the categories
    Art. 9(1) introduces with 'data concerning' than for those it introduces with 'revealing'.
    Genetic data sits in neither of those two groups - it is in the 'the processing of' limb - and
    nothing in the judgment gives that limb a narrower test either. Shapes to look for, none of
    which this detector can reach on its own: a family or pedigree structure, which reveals
    inherited characteristics of relatives who never used the product; a 'family history of X' or
    'first-degree relative affected' flag; a carrier-status or disease-risk field stored away from
    the genotype it came from; an ancestry-composition or haplogroup-derived lineage grouping; a
    relative-match or DNA-relatives list; and a pseudonymous sample identifier held next to anything
    that re-links it. Quote what you find and say what could be deduced from it about a specific
    person, or record that you looked and nothing is deducible. Note also that this question is not
    answered by deleting the sequence: the derived value is inside Art. 9(1) on its own."
  - "WHO ANSWERS WHICH ART. 9(2) CONDITION THE ORGANISATION RELIES ON? Whether the organisation that
    runs this product has a condition under Art. 9(2) for the special-category data it keeps, and
    has it written down, is a fact about that organisation: the person running the scan is asked it
    as the Art 9 condition question, ScanProfile.operator.special_category_condition, and the code
    never decides it. Where the matched value is special-category data about an identifiable person
    and what remains open is that condition - the Art. 9(2) question above - write the finding as
    waiting on operator.special_category_condition, whether or not it has been answered, and let the
    program apply the answer. The leads the Art. 9(2) question asks you to quote from the repository
    corroborate or contradict the answer; where they contradict it, say so in the reasoning. The
    answer settles that condition and nothing else: whether the value is special-category data at
    all and whom it concerns, any further condition Member State law adds under Art. 9(4), and
    whether the condition covers the use this finding is about, stay yours, so where one of those
    decides the finding, answer it instead of waiting. An answer that the organisation has a
    condition never says that it covers a particular use: each condition is tied to its purpose
    (Art. 9(2)(a) consent is given for one or more specified purposes), so each onward use the code
    shows - the value sent to a log or an error tracker, an analytics, marketing or session-replay
    SDK or another tracker, a language model or another third-party API, or an export - is yours to
    judge on its own line, with the transfer, minimisation and integrity questions it raises, and is
    never written as waiting on this answer."
evidence_template: "{file}:{line} carries a string from this rule's genomic and genetic-test
  vocabulary - a genome, exome, genotype, allele, karyotype, variant call, marker identifier,
  sequencing artifact, consumer-genomics import, HLA type, or a biological specimen joined to a
  person identifier. THAT STRING IS THE WHOLE OF WHAT WAS MATCHED, and several of these tokens are
  short or are also ordinary words, so read the line before treating it as genomic material. Six
  look-alike classes have been met on real code and every one of them satisfied a clause. A VALUE
  THAT ONLY BORROWS THE VOCABULARY, which context question 2 sets out: a genetic ALGORITHM's
  chromosome and alleles, a genome used as a metaphor for a configuration set, a .vcf file that is
  an address-book export. AN rsID SPELLING THAT IS AN INDEX RATHER THAN A VARIANT: `rs2320` and
  `rs2321` are serial-port channels 0 and 1 in a hardware protocol decoder, and the four-digit
  requirement that keeps out the JOSE algorithm names RS256 and RS512 does not keep out a four-digit
  channel number. A PERSON-PREFIXED ACCESSOR WHOSE FIELD IS NOT GENOMIC: a `markers` collection read
  off a user object can be timeline read-position markers, and the person prefix is exactly what
  makes such a match look strongest while being furthest from genomic material. A DATA TABLE THAT
  HAPPENS TO SPELL ONE OF THESE WORDS: a subword entry in an embedding model's tokenizer vocabulary,
  or a cryptocurrency ticker table whose asset names contain genome. A TOKEN MATCHED INSIDE A LONGER
  WORD OF ANOTHER LANGUAGE: in a translation catalogue the sequencing token NGS sits inside a
  Swedish word whose accented letter is written as a JSON unicode escape, and the digit that ends
  that escape defeats the letter guard that would otherwise require a word boundary. AND THE NAME OF
  THE LEGAL CATEGORY ITSELF: a bullet reading `genetic data` in an article or a documentation page
  listing the Art. 9(1) special categories names the category rather than anybody's material. Say
  which of these the line is, or that it is none of them, and then check whether the matched value
  relates to an identified or identifiable natural person (Art. 4(1), Art. 4(13)) and which Art.
  9(2) point is relied on"
remediation_template: >
  This is a candidate for review against the GDPR Art. 9(1) prohibition on processing genetic data,

  not a determination about this code. Art. 9 has applied since 2018-05-25 and sits in the

  Art. 83(5)(a) tier, which names Article 9 expressly: up to EUR 20 000 000 or 4% of total worldwide

  annual turnover, whichever is higher.

  Establish two facts first, because most candidates are decided by them:

  1. Does the material relate to an identified or identifiable natural person (Art. 4(1))? A
  reference
     genome, a non-human genome, a synthetic dataset, a population-level allele-frequency table and a
     format parser with no data are outside Art. 9 entirely. A pseudonymous sample identifier that
     this project can re-link to a person is not: Art. 4(1) covers indirect identification.
  2. Is it genetic data within Art. 4(13) - inherited or acquired genetic characteristics of a
  natural
     person, giving unique information about their physiology or health? Recital 34 makes this wide:
     chromosomal analysis, DNA or RNA analysis, "or from the analysis of another element enabling
     equivalent information to be obtained". A genotype array, an HLA type and a risk score derived
     from either are inside it. A genetic algorithm's chromosomes and alleles are not.
  If both hold, the question is which Art. 9(2) point applies, and the engineering work follows from

  which one it is rather than preceding it:

  - Relying on (a) explicit consent, which is the consumer-genomics case: Art. 9(2)(a) itself
    carries only two of the four things engineers are usually told to build. It requires consent to
    be "explicit" and given "for one or more specified purposes"; separability and withdrawability
    come from elsewhere and are quoted here so that this file does not assert a test it has not
    shown. Art. 4(11) defines consent as "any freely given, specific, informed and unambiguous
    indication of the data subject's wishes by which he or she, by a statement or by a clear
    affirmative action, signifies agreement to the processing of personal data relating to him or
    her", and Art. 7(3) provides that "The data subject shall have the right to withdraw his or her
    consent at any time. The withdrawal of consent shall not affect the lawfulness of processing
    based on consent before its withdrawal. Prior to giving consent, the data subject shall be
    informed thereof. It shall be as easy to withdraw as to give consent." Art. 7(1) is what
    requires the record: "Where processing is based on consent, the controller shall be able to
    demonstrate that the data subject has consented to processing of his or her personal data." So:
    separate the purposes the code actually pursues - storage, interpretation, relative matching,
    research re-use, onward sharing - make each one separately grantable and as easy to withdraw as
    to give, and keep on the controller's side the record of what was shown and agreed to.
  - Relying on (j) research under Art. 89(1): read what that provision actually requires, because
    the two halves of it are not the same strength. Art. 89(1): "Processing for archiving purposes
    in the public interest, scientific or historical research purposes or statistical purposes,
    shall be subject to appropriate safeguards, in accordance with this Regulation, for the rights
    and freedoms of the data subject. Those safeguards shall ensure that technical and
    organisational measures are in place in particular in order to ensure respect for the principle
    of data minimisation. Those measures may include pseudonymisation provided that those purposes
    can be fulfilled in that manner. Where those purposes can be fulfilled by further processing
    which does not permit or no longer permits the identification of data subjects, those purposes
    shall be fulfilled in that manner." So data minimisation is required of the measures, whereas
    pseudonymisation is permitted rather than required and is conditional on the research purposes
    still being achievable with it - and the last sentence goes further than either: where the
    purposes can be met without identifying anybody, they must be. The Union or Member State law
    requirement is not in Art. 89(1) at all; it comes from Art. 9(2)(j), which conditions the
    exception on processing being "on the basis of Union or Member State law".
  - Relying on (h) clinical care: Art. 9(3) additionally requires the processing to be by or under
  the
    responsibility of a person bound by professional secrecy, which is an access-control and
    contractual fact as much as a code one.
  - Relying on none of them: if no Art. 9(2) point applies, nothing further down takes the case
    out, because Art. 9(1) prohibits the processing itself and Art. 4(2) counts collection,
    recording, structuring, storage, use and disclosure as processing - so stopping storage alone,
    while the code still collects, derives or forwards the values, is not the change. The change is
    to stop processing genetic data of identifiable persons on this path: stop collecting it, stop
    deriving values from it, stop sending it on, and delete what is held; or to change the path so
    that what it handles no longer relates to an identifiable person (a population-level table, for
    example), which for a genome takes more than removing the name, as the last paragraph but one says.
  The changes that reduce exposure whichever point applies, in the order they usually pay off:

  keep the person identifier out of the genomic payload and hold the specimen-to-person link in one

  place under its own access control, so that a leak of a VCF store is not a leak of identified

  genetic data; keep genotypes, rsIDs and derived risk scores out of application logs, crash
  reports,

  analytics events and prompts sent to hosted inference providers - a genomic value in a log is
  almost

  never intended and it is the cheapest of these to fix; give the genomic store and its derived
  tables

  a retention rule and an erasure path - storage limitation under Art. 5(1)(e) and erasure under

  Art. 17 are separate duties that this rule neither quotes nor assesses, and they are named here

  only so that the engineering work is done once - remembering that genetic data cannot be

  de-identified by removing the name, because the sequence is itself an identifier under Art. 4(1);
  and hold the

  derived values - risk scores, carrier flags, ancestry breakdowns, relative matches - to the same

  standard as the raw data, since they carry equivalent information.

  Two things a reviewer should refuse as an answer. Deleting the person's name while keeping the

  genotype does not take the record outside Art. 9, because Art. 4(1) covers indirect identification

  and a genome is unique to one person. And a statement that the Regulation has been satisfied is
  not

  the whole answer for this category at all: Art. 9(4) lets each Member State add further conditions

  on genetic data, and those were not assessed by this scan.

  Where the same line is also a health record - Recital 35 puts "information derived from the
  testing

  or examination of a body part or bodily substance, including from genetic data and biological

  samples" inside data concerning health - the health limb of Art. 9(1) is engaged by it too, with
  the

  same exceptions and the same national-conditions caveat.
data_categories:
  - user.genetic
  - user.health
fingerprint_spec: file

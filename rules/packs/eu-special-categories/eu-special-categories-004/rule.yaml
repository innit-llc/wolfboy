id: eu-special-categories-004
pack: eu-special-categories
short_name: Genetic data named in the code
problem_line:
  text: Genetic data processed with no Art. 9 basis named
fix_line: Name the Art. 9(2) point, such as explicit consent per purpose, or stop processing genetic
  data of identifiable people.
title: Genome, genotype, variant-call or genetic-test vocabulary - GDPR Art. 9(1) person link and
  basis need review
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(1): 'Processing of personal data revealing racial or
      ethnic origin, political opinions, religious or philosophical beliefs, or trade union
      membership, and the processing of genetic data, biometric data for the purpose of uniquely
      identifying a natural person, data concerning health or data concerning a natural person's sex
      life or sexual orientation shall be prohibited.' Quoted verbatim from the Official Journal
      text (CELEX 32016R0679), retrieved 2026-07-30 from the Publications Office cellar
      (publications.europa.eu/resource/celex/32016R0679, which needs BOTH an Accept:
      application/xhtml+xml header AND an Accept-Language: eng header - with the Accept header alone
      it returns HTTP 400 and a 205-byte body, which this file stated as sufficient until 2026-08-03
      and which was re-tested that day, returning 400 without the language header and 200 with it;
      the C-184/20 entry below already carried the correct pair, and eur-lex.europa.eu itself
      returns an empty WAF challenge from this machine). Three structural points this rule rests on.
      First, 'genetic data' is one of the four limbs introduced by 'the processing of', so no
      purpose qualifier sits inside the prohibition for it: the qualifier 'for the purpose of
      uniquely identifying a natural person' attaches to the biometric limb alone. Second, the
      prohibited act is 'processing', which Art. 4(2) defines as 'any operation or set of operations
      which is performed on personal data or on sets of personal data, whether or not by automated
      means, such as collection, recording, organisation, structuring, storage, adaptation or
      alteration, retrieval, consultation, use, disclosure by transmission, dissemination or
      otherwise making available, alignment or combination, restriction, erasure or destruction' -
      storing a genotype in a first-party table with no onward transmission is squarely inside it,
      which is why this detector requires no sink. Third, the data must be personal data: Art. 4(1)
      defines that as 'any information relating to an identified or identifiable natural person', an
      identifiable person being 'one who can be identified, directly or indirectly, in particular by
      reference to an identifier such as a name, an identification number, location data, an online
      identifier or to one or more factors specific to the physical, physiological, genetic, mental,
      economic, cultural or social identity of that natural person' - the word 'genetic' appears in
      that list, so a genetic profile can itself be the identifier. Art. 9 has applied since
      2018-05-25: Art. 99(2) reads 'It shall apply from 25 May 2018.'"
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(13): '‘genetic data’ means personal data relating to
      the inherited or acquired genetic characteristics of a natural person which give unique
      information about the physiology or the health of that natural person and which result, in
      particular, from an analysis of a biological sample from the natural person in question;'.
      Quoted verbatim from the same Official Journal text, retrieved 2026-07-30. Three cumulative
      elements, none of which a line-level detector can settle: (i) the data relate to a NATURAL
      PERSON's genetic characteristics, so a reference genome, a synthetic or simulated genome, a
      non-human genome and a population-level allele-frequency table are outside it; (ii) the
      characteristics may be inherited OR ACQUIRED, so a somatic tumour profile and an epigenetic
      mark are inside it and not only inherited germline variants; (iii) the information is unique
      to that person and concerns their physiology or health. Context question 2 asks the
      adjudicating agent for exactly these three."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 34: 'Genetic data should be defined as personal data
      relating to the inherited or acquired genetic characteristics of a natural person which result
      from the analysis of a biological sample from the natural person in question, in particular
      chromosomal, deoxyribonucleic acid (DNA) or ribonucleic acid (RNA) analysis, or from the
      analysis of another element enabling equivalent information to be obtained.' Quoted verbatim
      from the same Official Journal text, retrieved 2026-07-30. This recital is why the detector's
      vocabulary is not limited to DNA sequence data: 'chromosomal' analysis puts a karyotype inside
      the concept, 'ribonucleic acid (RNA) analysis' puts RNA sequencing inside it, and 'the
      analysis of another element enabling equivalent information to be obtained' is open-ended - it
      is the clause that covers a marker panel, an HLA type, a polygenic risk score derived from a
      genotype array, and any future assay that yields the same information without sequencing
      anything. Note also what the recital does NOT require: it says the data result from the
      analysis of a biological sample, while Art. 4(13) says 'in particular' from such an analysis,
      so a genotype imported from a consumer-genomics file the data subject uploaded is not outside
      the concept merely because this controller never touched a sample."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 35, third limb of its second sentence: personal data
      concerning health includes 'information derived from the testing or examination of a body part
      or bodily substance, including from genetic data and biological samples'. The full sentence
      reads: 'This includes information about the natural person collected in the course of the
      registration for, or the provision of, health care services as referred to in Directive
      2011/24/EU of the European Parliament and of the Council (9) to that natural person; a number,
      symbol or particular assigned to a natural person to uniquely identify the natural person for
      health purposes; information derived from the testing or examination of a body part or bodily
      substance, including from genetic data and biological samples; and any information on, for
      example, a disease, disability, disease risk, medical history, clinical treatment or the
      physiological or biomedical state of the data subject independent of its source, for example
      from a physician or other health professional, a hospital, a medical device or an in vitro
      diagnostic test.' Quoted verbatim from the same Official Journal text, retrieved 2026-07-30.
      The (9) that follows 'of the Council' is the Journal's own footnote reference to its citation
      of Directive 2011/24/EU, and it is reproduced here exactly as the Journal prints it. This file
      elided it until 2026-08-03, because the quotation check's HTML-to-text step then inserted
      spaces inside the parentheses around the footnote number and no faithful transcription of the
      printed text could match the result; that defect was fixed on 2026-08-03, so the plain
      quotation is used and the elision is gone. Consequence for the reader of a finding from this
      rule: a genetic test result is generally data concerning health as well as genetic data, so
      the health limb of Art. 9(1) is engaged by the same line and 'disease risk' is named in the
      recital expressly - a polygenic risk score is inside the concept. This entry is marked as not
      supporting the rule condition because the condition this detector tests is the genetic limb;
      the health overlap changes what else applies, not whether Art. 9(1) is engaged."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "CJEU, Case C-184/20, OT v Vyriausioji tarnybinės etikos komisija, judgment of the Grand
      Chamber of 1 August 2022 (CELEX 62020CJ0184). Para. 127: 'Consequently, those provisions
      cannot be interpreted as meaning that the processing of personal data that are liable
      indirectly to reveal sensitive information concerning a natural person is excluded from the
      strengthened protection regime prescribed by those provisions, if the effectiveness of that
      regime and the protection of the fundamental rights and freedoms of natural persons that it is
      intended to ensure are not to be compromised.' The Court reached that conclusion by REJECTING,
      at para. 124, the reading on which the verb 'reveal' covers indirect deduction while the
      preposition 'concerning' requires a more direct link: 'Such an interpretation, which would
      result in a distinction being drawn according to the type of sensitive data at issue, would
      not, however, be consistent with a contextual analysis of those provisions, in particular with
      Article 4(15) of the GDPR, according to which ‘data concerning health’ are personal data
      related to the physical or mental health of a natural person, including the provision of
      health care services, which ‘reveal’ information about his or her health status, and with
      recital 35 of that regulation, which states that personal data concerning health should
      include all data pertaining to the health status of a data subject which ‘reveal’ information
      relating to the past, current or future physical or mental health status of the data subject.'
      Two consequences for THIS rule. First, there is no limb of Art. 9(1) for which indirect
      revelation is a weaker test, so the fact that genetic data sits in the 'the processing of'
      limb rather than the 'revealing' limb changes nothing: a value liable indirectly to reveal a
      person's inherited or acquired genetic characteristics is inside Art. 9(1) even though it is
      not itself a sequence. Second, the case is about a category the Court described as sensitive
      by deduction from ordinary data - name-specific data about a spouse - which is exactly the
      shape a family-history field, a lineage grouping or a relative-match list takes in a genomics
      codebase. Quoted verbatim from the Publications Office cellar text (CELEX 62020CJ0184, fetched
      2026-08-03 with Accept: application/xhtml+xml and Accept-Language: eng); the judgment's own
      inner quotation marks are U+2018 and U+2019 and are reproduced as printed."
    url: http://publications.europa.eu/resource/celex/62020CJ0184
    checked_at: 2026-08-03
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(2) and 9(3), quoted verbatim from the same Official
      Journal text, retrieved 2026-07-30. Art. 9(2): '2. Paragraph 1 shall not apply if one of the
      following applies: (a) the data subject has given explicit consent to the processing of those
      personal data for one or more specified purposes, except where Union or Member State law
      provide that the prohibition referred to in paragraph 1 may not be lifted by the data subject;
      (b) processing is necessary for the purposes of carrying out the obligations and exercising
      specific rights of the controller or of the data subject in the field of employment and social
      security and social protection law in so far as it is authorised by Union or Member State law
      or a collective agreement pursuant to Member State law providing for appropriate safeguards
      for the fundamental rights and the interests of the data subject; (c) processing is necessary
      to protect the vital interests of the data subject or of another natural person where the data
      subject is physically or legally incapable of giving consent; (d) processing is carried out in
      the course of its legitimate activities with appropriate safeguards by a foundation,
      association or any other not-for-profit body with a political, philosophical, religious or
      trade union aim and on condition that the processing relates solely to the members or to
      former members of the body or to persons who have regular contact with it in connection with
      its purposes and that the personal data are not disclosed outside that body without the
      consent of the data subjects; (e) processing relates to personal data which are manifestly
      made public by the data subject; (f) processing is necessary for the establishment, exercise
      or defence of legal claims or whenever courts are acting in their judicial capacity; (g)
      processing is necessary for reasons of substantial public interest, on the basis of Union or
      Member State law which shall be proportionate to the aim pursued, respect the essence of the
      right to data protection and provide for suitable and specific measures to safeguard the
      fundamental rights and the interests of the data subject; (h) processing is necessary for the
      purposes of preventive or occupational medicine, for the assessment of the working capacity of
      the employee, medical diagnosis, the provision of health or social care or treatment or the
      management of health or social care systems and services on the basis of Union or Member State
      law or pursuant to contract with a health professional and subject to the conditions and
      safeguards referred to in paragraph 3; (i) processing is necessary for reasons of public
      interest in the area of public health, such as protecting against serious cross-border threats
      to health or ensuring high standards of quality and safety of health care and of medicinal
      products or medical devices, on the basis of Union or Member State law which provides for
      suitable and specific measures to safeguard the rights and freedoms of the data subject, in
      particular professional secrecy; (j) processing is necessary for archiving purposes in the
      public interest, scientific or historical research purposes or statistical purposes in
      accordance with Article 89(1) based on Union or Member State law which shall be proportionate
      to the aim pursued, respect the essence of the right to data protection and provide for
      suitable and specific measures to safeguard the fundamental rights and the interests of the
      data subject.' Art. 9(3): '3. Personal data referred to in paragraph 1 may be processed for
      the purposes referred to in point (h) of paragraph 2 when those data are processed by or under
      the responsibility of a professional subject to the obligation of professional secrecy under
      Union or Member State law or rules established by national competent bodies or by another
      person also subject to an obligation of secrecy under Union or Member State law or rules
      established by national competent bodies.' The three points a genomics codebase most often
      rests on are (a) explicit consent for one or more specified purposes, which is the
      consumer-genomics answer; (j) scientific research under Art. 89(1) on the basis of Union or
      Member State law, which is the research-cohort answer; and (h) read with (3), which is the
      clinical-genetics answer and carries the professional-secrecy condition. Whether any of them
      is made out turns on facts no detector can see - the wording of a consent flow, a national
      research statute, an organisation's legal form."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(4): 'Member States may maintain or introduce further
      conditions, including limitations, with regard to the processing of genetic data, biometric
      data or data concerning health.' Quoted verbatim from the same Official Journal text,
      retrieved 2026-07-30. Recital 53 says the same in its own words: 'Member States should be
      allowed to maintain or introduce further conditions, including limitations, with regard to the
      processing of genetic data, biometric data or data concerning health. However, this should not
      hamper the free flow of personal data within the Union when those conditions apply to
      cross-border processing of such data.' Genetic data is the first of the three categories
      named, and note the limit of the paragraph: it reaches genetic, biometric and health data
      ONLY, so it does not extend to the rest of the Art. 9(1) list. No count of the remaining
      categories is given: this entry stated one until 2026-08-03 and the sibling rule -003 stated a
      different one on the same day in the same pack, which cannot both be right, because the list
      can be read as eight limbs or as nine depending on whether sex life and sexual orientation are
      counted separately. Nothing in the Regulation settles that and no legal consequence turns on
      it, so neither file states a number now. Whether any particular Member State has used the
      power, and what it enacted, is NOT recorded here and was not checked: no national instrument
      was fetched or read during authoring, and a statement about national law that rests on nothing
      fetched has no place in a citation field. The consequence for this product's output is that a
      review of an Art. 9(2) point under the Regulation is never the whole answer for a genomics
      codebase; the national conditions of each Member State the product is deployed in are a
      separate question, and this scan assesses none of them. This entry bounds the duty rather than
      establishing it."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Article 9 is named in that list by number, so the special-categories prohibition carries the
      upper band rather than the Art. 83(4) one. Quoted from the same Official Journal text,
      retrieved 2026-07-30; the introductory line of Art. 83(5) reads in full '5. Infringements of
      the following provisions shall, in accordance with paragraph 2, be subject to administrative
      fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of the total worldwide
      annual turnover of the preceding financial year, whichever is higher:'."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(2): '‘processing’ means any operation or set of
      operations which is performed on personal data or on sets of personal data, whether or not by
      automated means, such as collection, recording, organisation, structuring, storage, adaptation
      or alteration, retrieval, consultation, use, disclosure by transmission, dissemination or
      otherwise making available, alignment or combination, restriction, erasure or destruction;'.
      Quoted verbatim from the Regulation's text (CELEX 32016R0679, checked on 2026-11-07 against
      the consolidated text 02016R0679-20160504, which the receipt names); the Journal wraps the
      defined term in U+2018/U+2019 curly quotation marks, preserved here. CONSEQUENCE: Art. 9(1)
      prohibits processing, and Art. 4(2) makes collection, recording, structuring, storage, use and
      disclosure each an operation of processing in its own right; 'disclosure by transmission' is
      one item in that list, not a precondition for the others. A genotype written to a first-party
      table and sent nowhere is therefore inside the prohibition, and stopping storage alone, while
      the code still collects, derives or forwards the values, does not take a path out of it."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-11-07
    jurisdiction: EU
    supports_rule_condition: false

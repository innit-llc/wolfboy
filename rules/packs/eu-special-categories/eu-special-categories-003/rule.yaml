id: eu-special-categories-003
pack: eu-special-categories
short_name: Origin, belief, union or sexuality data named in the code
problem_line:
  text: "Origin, belief, union, sexuality data: no Art. 9 basis named"
fix_line: Name the GDPR Art. 9 exception relied on, or drop the field and keep the value out of logs
  and analytics.
title: Racial or ethnic origin, political opinions, religion or belief, trade union, sex life or
  sexual orientation named
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(1): 'Processing of personal data revealing racial or
      ethnic origin, political opinions, religious or philosophical beliefs, or trade union
      membership, and the processing of genetic data, biometric data for the purpose of uniquely
      identifying a natural person, data concerning health or data concerning a natural person's sex
      life or sexual orientation shall be prohibited.' Quoted verbatim from the Official Journal
      text (CELEX 32016R0679), retrieved 2026-07-30 from the Publications Office cellar
      (publications.europa.eu/resource/celex/32016R0679; eur-lex.europa.eu itself returns an empty
      WAF challenge); the apostrophe in 'person's' is ASCII U+0027 in the Journal text. WHAT THIS
      RULE COVERS: the four categories Art. 9(1) introduces with the word 'revealing' - racial or
      ethnic origin, political opinions, religious or philosophical beliefs, trade union membership
      - together with its final limb, 'data concerning a natural person's sex life or sexual
      orientation'. Genetic data, biometric data and data concerning health are
      eu-special-categories-004, -002 and -001. No count of the listed categories is given anywhere
      in this file, and the omission is deliberate: the file carried such a count until 2026-08-03
      and it was arithmetically inconsistent, counting sex life and sexual orientation as two
      categories in the numerator and as one in the denominator, while the sibling rule -004 used
      the eight-limb count in the same pack on the same day. The Art. 9(1) list can be read as eight
      limbs or as nine depending on that choice, nothing in the Regulation settles it, and no legal
      consequence turns on it. WHAT IS NOT ON THE LIST: the word gender does not appear in Art. 9(1)
      at all, and the word sex appears in it only inside the two phrases 'sex life' and 'sexual
      orientation'. Exactly one thing follows from that, and it is stated narrowly because the wider
      version is unsound once C-184/20 is read correctly (see the next entry): a plain sex or gender
      column is not itself one of the listed categories, which is why the detector's vocabulary does
      not contain the bare words gender and sex. Whether a particular gender-identity or
      trans-status field is liable INDIRECTLY to reveal a person's sex life or sexual orientation is
      a different question, it is not answered by the absence of the words from the list, and it is
      context question 3. ADDRESSEE. Art. 9(1) names none. Art. 4(7) defines the controller as
      '‘controller’ means the natural or legal person, public authority, agency or other body which,
      alone or jointly with others, determines the purposes and means of the processing of personal
      data', and Art. 4(8) defines the processor as '‘processor’ means a natural or legal person,
      public authority, agency or other body which processes personal data on behalf of the
      controller'. A processor's activity is itself processing, so the prohibition binds it too;
      what is controller-shaped is most of Art. 9(2). Contrast Art. 5(2), where the Regulation does
      name an addressee expressly: 'The controller shall be responsible for, and be able to
      demonstrate compliance with, paragraph 1'. THE PROHIBITED ACT. Art. 4(2): '‘processing’ means
      any operation or set of operations which is performed on personal data or on sets of personal
      data, whether or not by automated means, such as collection, recording, organisation,
      structuring, storage, adaptation or alteration, retrieval, consultation, use, disclosure by
      transmission, dissemination or otherwise making available, alignment or combination,
      restriction, erasure or destruction'. Storing one of these categories in a first-party table
      with no onward transmission is squarely inside that list, which is why this detector requires
      no sink. Art. 9 has applied since 2018-05-25: Art. 99(2) reads 'It shall apply from 25 May
      2018.' All quoted verbatim from the same Official Journal text; the Art. 4(2), 4(7), 4(8) and
      5(2) spans were added on 2026-08-03 and re-fetched that day, and each defined term inside them
      carries the Journal's own U+2018/U+2019 marks rather than ASCII substitutes."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "CJEU, Case C-184/20, OT v Vyriausioji tarnybinės etikos komisija, judgment of the Grand
      Chamber of 1 August 2022 (CELEX 62020CJ0184). WHAT THE COURT HOLDS: personal data liable
      INDIRECTLY to reveal a special category are inside Art. 9(1), and the Court refuses to draw
      any distinction between the categories introduced by 'revealing' and those introduced by
      'concerning'. Para. 127: 'Consequently, those provisions cannot be interpreted as meaning that
      the processing of personal data that are liable indirectly to reveal sensitive information
      concerning a natural person is excluded from the strengthened protection regime prescribed by
      those provisions, if the effectiveness of that regime and the protection of the fundamental
      rights and freedoms of natural persons that it is intended to ensure are not to be
      compromised.' Operative part, point 2: 'Article 8(1) of Directive 95/46 and Article 9(1) of
      Regulation 2016/679 must be interpreted as meaning that the publication, on the website of the
      public authority responsible for collecting and checking the content of declarations of
      private interests, of personal data that are liable to disclose indirectly the sexual
      orientation of a natural person constitutes processing of special categories of personal data,
      for the purpose of those provisions.' THE CATEGORY AT ISSUE WAS SEXUAL ORIENTATION, which Art.
      9(1) introduces with 'data concerning' and not with 'revealing' - so the holding is about the
      'concerning' limb, and it cannot be read as a proposition about the 'revealing' limb alone.
      THE READING THE COURT REJECTS, quoted because this file previously cited it as if it were the
      holding. Para. 123 reports the Advocate General: 'As the Advocate General has observed, in
      essence, in point 85 of his Opinion, whilst the use, in those provisions, of the verb ‘reveal’
      is consistent with the taking into account of processing not only of inherently sensitive
      data, but also of data revealing information of that nature indirectly, following an
      intellectual operation involving deduction or cross-referencing, the preposition ‘concerning’
      seems, on the other hand, to signify the existence of a more direct and immediate link between
      the processing and the data concerned, viewed inherently.' Para. 124 then discards it: 'Such
      an interpretation, which would result in a distinction being drawn according to the type of
      sensitive data at issue, would not, however, be consistent with a contextual analysis of those
      provisions, in particular with Article 4(15) of the GDPR, according to which ‘data concerning
      health’ are personal data related to the physical or mental health of a natural person,
      including the provision of health care services, which ‘reveal’ information about his or her
      health status, and with recital 35 of that regulation, which states that personal data
      concerning health should include all data pertaining to the health status of a data subject
      which ‘reveal’ information relating to the past, current or future physical or mental health
      status of the data subject.' Para. 125 adds the first of two further reasons: 'Furthermore, a
      wide interpretation of the terms ‘special categories of personal data’ and ‘sensitive data’ is
      confirmed by the objective of Directive 95/46 and the GDPR, noted in paragraph 61 of the
      present judgment, which is to ensure a high level of protection of the fundamental rights and
      freedoms of natural persons, in particular of their private life, with respect to the
      processing of personal data concerning them'. Para. 126 adds the second: 'The contrary
      interpretation would, moreover, run counter to the purpose of Article 8(1) of Directive 95/46
      and Article 9(1) of the GDPR, namely to ensure enhanced protection as regards processing
      which, because of the particular sensitivity of the data processed, is liable to constitute,
      as follows from recital 33 of Directive 95/46 and recital 51 of the GDPR, a particularly
      serious interference with the fundamental rights to respect for private life and to the
      protection of personal data, guaranteed by Articles 7 and 8 of the Charter'. THE CONCRETE
      PROXY in the case, para. 119: it was possible 'to deduce from the name-specific data relating
      to the spouse, cohabitee or partner of the declarant certain information concerning the sex
      life or sexual orientation of the declarant and his or her spouse, cohabitee or partner.'
      Quoted verbatim from the Publications Office cellar text (CELEX 62020CJ0184, Accept:
      application/xhtml+xml and Accept-Language: eng required), re-fetched and re-checked character
      by character on 2026-08-03; the judgment prints its inner quotation marks as U+2018 and U+2019
      and they are reproduced as such above, where this file previously substituted ASCII U+0022
      without saying so."

      |[Nn]umber|[Dd]istance|[Ss]tart|[Ff]inish|[Ww]inner|[Pp]ace|[Ss]plit|[Ee]vent|[Ss]eries|[Dd]a\
      te)|[Mm]arathon|[Tt]riathlon|[Rr]acecar|[Rr]acing|[Hh]orse|NASCAR|[Ff]ormula ?1|[Gg]rand
      ?[Pp]rix|[Ll]eaderboard|[Pp]odium|[Aa]rms[_\\s\\-]?race|[Rr]at[_\\s\\-]?race"

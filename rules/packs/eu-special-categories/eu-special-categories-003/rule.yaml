settling_questions:
  - operator.special_category_condition
context_questions:
  - "Is the matched value about an identified or identifiable natural person at all (GDPR Art. 4(1),
    quoted in this rule's legal_basis)? Four content shapes recur and none of them is personal data:
    a dictionary or lexicon gloss ABOUT the word (measured in a real tree: `meaningEn: 'religion;
    sect; denomination; main point'` in a kanji-teaching dataset - the detector fires there
    deliberately and this question is where that candidate is dismissed); an i18n/translation
    catalogue or UI copy naming the category; a content-topic taxonomy or moderation-policy string
    ('politics', 'sexual content') that classifies CONTENT rather than a person; and a demo/sample
    dataset with no person behind it. TWO FURTHER SHAPES RECUR AND NEITHER IS ABOUT A PERSON EITHER.
    The same spelling used in another technical domain, where no category of anybody is named: a
    concurrency race condition written as `race:` inside a log message, a GraphQL union member type
    in application code or in a parser grammar, a subword entry in an embedding model's tokenizer
    vocabulary, an entry in a random-word list used to generate display names. And one of these
    words inside a sentence of ordinary prose - a code of conduct, a governance or policy document,
    a README. Where that is what the line is, say so and dismiss the candidate here; a collision is
    a cost of casting wide rather than a defect to argue around. Quote the surrounding schema, type
    or record and say what the row is keyed on - a person identifier, or a word, article, product or
    nothing."
  - "Which of the six categories this rule covers does the value fall in - racial or ethnic origin,
    political opinions, religious or philosophical beliefs, trade union membership, sex life, sexual
    orientation - and does it actually fall in one? The Art. 9(1) list is closed: the bare words
    gender and sex are NOT on it, an allergen or dietary attribute of a product is not a
    characteristic of a person, and a device's screen orientation is not an orientation of anybody.
    WHERE NOTHING MAPS DIRECTLY, DO NOT STOP HERE - GO ON TO QUESTION 3, and that instruction is the
    correction that matters most in this question, because stopping here is how this rule would
    dismiss the field shape this area produces most often. That instruction is for a field that IS
    about a person and names no listed category; it does not apply where question 1 has already
    established that the matched spelling is not about a person at all - a homonym from another
    technical domain, a word list, a model vocabulary or a sentence of prose - and such a candidate
    closes at question 1 without reaching question 3. A gender-identity or trans-status field is not
    itself one of the listed categories, and that answers only the direct question; whether it is
    liable INDIRECTLY to reveal a person's sex life or sexual orientation is a different question,
    it is not answered by the absence of the words from the list, and this rule's own legal_basis
    routes it to question 3 (C-184/20, quoted there, holds that data liable indirectly to reveal a
    special category are inside Art. 9(1), whichever limb the category sits in). The same goes for
    any other field that names no category outright. So record here that nothing maps directly, say
    so in those words, and answer question 3 before closing anything; 'not on the list' is a finding
    about the words, never a conclusion about the data. And answer the inversion explicitly, because
    the neighbouring AI Act rule decides it the other way: a SELF-DECLARED value - a form entry, a
    survey answer, an onboarding selection - stays squarely inside Art. 9 (the AI Act Art. 5(1)(g)
    rule ai-prohibited-003 excludes self-declared values because its provision prohibits deducing
    from biometric data; Art. 9 contains no such condition). 'The user typed it themselves' keeps
    the finding, never dismisses it."
  - "If the field does not name a category directly, is it liable to reveal one INDIRECTLY? CJEU
    C-184/20, quoted at length in this rule's legal_basis, holds that personal data liable
    indirectly to reveal a special category are inside Art. 9(1). Read the holding carefully before
    applying it, because it is easy to get backwards: the Court considered the argument that the
    verb 'reveal' covers indirect deduction while the preposition 'concerning' requires 'a more
    direct and immediate link', and it REJECTED that argument at paragraph 124 as inconsistent with
    a contextual reading. The category actually at issue was sexual orientation, which Art. 9(1)
    introduces with 'data concerning'. So the rule to apply is: data liable indirectly to reveal a
    special category are inside Art. 9(1), whichever limb the category sits in, and there is no
    category on the list for which indirect revelation is a weaker test. In that case the proxy was
    name-specific data about the declarant's spouse, cohabitee or partner, from which sexual
    orientation could be deduced. Shapes that carry this question: a partner or spouse field next to
    names; a gender-identity or trans-status field, which is the shape this area produces most often
    and which the absence of the words 'gender' and 'sex' from Art. 9(1) does not answer; membership
    of a named organisation whose aim is political, religious or trade-union, where the
    organisation's name reveals the affiliation; an advertising or content interest segment named
    after one of the categories; donation or dues records to such an organisation. Quote the field
    and say what an ordinary reader could deduce from it about a specific person, or record that
    nothing is deducible and stop."
  - "Which Art. 9(2) exception, if any, does the processing rest on? Nine of the ten are invisible
    to this scanner - they turn on organisational facts, national law, or how a value reached the
    system - so answer from the repository and its documentation, in this order for these
    categories: (d) is the processing carried out by a foundation, association or other
    not-for-profit body with a political, philosophical, religious or trade union aim, solely for
    its members, former members or regular contacts, without disclosure outside the body? This is
    the exception most likely to apply to an open-source repository - a union's, parish's or party's
    own membership system - and the repository itself (name, README, deployment target) may be the
    only evidence. (e) was the value manifestly made public by the data subject themselves - trace
    how it reached the system, and note that scraping a public profile is not the subject making
    anything public. (a) explicit consent for one or more specified purposes - a consent checkbox
    near the field is a lead, never an answer: 'explicit' and 'specified purposes' are what must be
    shown. Then (b) employment and social-security law (a works-council or union-dues field in HR
    software turns on national law and collective agreements), (f) legal claims, (g) substantial
    public interest on a named legal basis, (j) archiving/research/statistics under Art. 89(1).
    Quote what you find, or record explicitly that you looked and the code shows nothing either
    way."
  - Where does the value go? Trace it and quote each hop. A first-party database write is still
    processing - this rule fires on it deliberately, and 'it never leaves our Postgres' is an answer
    to a different question. A log line, an analytics event, an error-tracker context, an LLM prompt
    or any third-party payload each add their own questions on top of Art. 9 - integrity and
    confidentiality under Art. 5(1)(f) for logs, and the Chapter V transfer rules in Arts. 44-49
    where the recipient is outside the EEA. Neither provision is quoted in this file and neither is
    assessed by this rule; they are named so that a reader knows to take them elsewhere, not so that
    this finding decides them. Say which sinks exist and which do not.
  - Who is the controller for this processing, and is it the party whose repository this is? A
    library, SDK, form-builder or integration connector that carries an Art. 9-shaped field through
    to a caller is not thereby the controller. Where the repository is a component rather than a
    deployed service, record the finding against the integrating application and say so plainly.
  - "WHO ANSWERS WHICH ART. 9(2) CONDITION THE ORGANISATION RELIES ON? Whether the organisation that
    runs this product has a condition under Art. 9(2) for the special-category data it keeps, and
    has it written down, is a fact about that organisation: the person running the scan is asked it
    as the Art 9 condition question, ScanProfile.operator.special_category_condition, and the code
    never decides it. Where the matched value is special-category data about an identifiable person
    and what remains open is that condition - the Art. 9(2) question above - write the finding as
    waiting on operator.special_category_condition, whether or not it has been answered, and let the
    program apply the answer. The leads the Art. 9(2) question asks you to quote from the repository
    corroborate or contradict the answer; where they contradict it, say so in the reasoning. The
    answer settles that condition and nothing else: whether the value is special-category data at
    all, directly or indirectly, whom it concerns, and whether the condition covers the use this
    finding is about stay yours, so where one of those decides the finding, answer it instead of
    waiting. An answer that the organisation has a condition never says that it covers a particular
    use: each condition is tied to its purpose (Art. 9(2)(a) consent is given for one or more
    specified purposes), so each onward use the code shows - the value sent to a log or an error
    tracker, an analytics, marketing or session-replay SDK or another tracker, a language model or
    another third-party API, or an export - is yours to judge on its own line, with the transfer,
    minimisation and integrity questions it raises, and is never written as waiting on this answer."
evidence_template: "{file}:{line} carries a string from this rule's Art. 9(1) vocabulary - racial or
  ethnic origin, political opinions, religious or philosophical beliefs, trade union membership, sex
  life or sexual orientation - which the clauses look for as a field, column, form control, key,
  enum, per-person read, label set or logged value. THE STRING IS THE WHOLE OF WHAT WAS MATCHED, AND
  THE ROLE IS NOT: several clauses match a bare word, and the punctuation the others require is
  written inside log messages, JSON data and prose as well as inside declarations, so that list says
  what the clauses aim at rather than what this line was shown to be. Four look-alike classes have
  been met on real code, each of them satisfying a clause while naming no category of anybody. THE
  SAME WORD IN ANOTHER TECHNICAL SENSE: `race` as a concurrency race condition inside a log message,
  which reads as corroborated because the line really is a logging call; `union member` as a GraphQL
  union member type, both in application code and in a parser grammar. AN ORDINARY ENGLISH WORD:
  `political` in a random-word list used to generate display names, between `polite` and `poor`. A
  MODEL VOCABULARY: the same word as a subword entry in an embedding model's tokenizer, where the
  entry is a JSON key and the key shape therefore reads as satisfied. AND PROSE: a code of conduct,
  a policy document, a translation catalogue or documentation, where the word sits in a sentence and
  none of the syntactic roles listed above is present at all. Say which of these the line is, or
  that it is none of them, before going further. Then check whether the value relates to an
  identifiable person, whether it is liable indirectly to reveal one of these categories (C-184/20,
  which applies that test to every limb of Art. 9(1)), and which Art. 9(2) exception, if any, covers
  the processing"
remediation_template: |
  This is a candidate for review against the GDPR Art. 9(1) prohibition on processing special
  categories of personal data, not a determination about this code. Art. 9 has applied since
  2018-05-25 and is named expressly in the Art. 83(5)(a) tier (administrative fines up to
  20 000 000 EUR or, for an undertaking, up to 4 % of total worldwide annual turnover, whichever
  is higher).
  Two facts decide most candidates, so establish them first:
  1. Is the value personal data at all (Art. 4(1))? A dictionary gloss, a translation catalogue,
     a survey question bank, a content-topic taxonomy and a moderation-policy string name these
     words without relating them to an identifiable person. Where the row is keyed on a word,
     an article or a product rather than a person, record that and move on.
  2. Which Art. 9(1) category does it fall in? The list is closed, and the words gender and sex
     are not on it - but that settles less than it looks. Under C-184/20 data liable indirectly to
     reveal a special category are inside Art. 9(1), and the Court refused at paragraph 124 to draw
     any distinction between the categories introduced by 'revealing' and those introduced by
     'concerning'; the category in that case was sexual orientation, which is a 'concerning' one.
     So a proxy field - a partner's name, a gender-identity or trans-status field, membership of a
     named organisation, an interest segment - needs the same review as a field that names the
     category outright. Unlike AI Act Art. 5(1)(g), a self-declared value is NOT out of scope: the
     data subject's own form entry is squarely inside Art. 9(1).
  If both hold, the question becomes which Art. 9(2) exception the processing rests on, and that
  is an organisational fact this scan does not assess. For these categories the exceptions most
  likely to be live are (d) - a foundation, association or other not-for-profit body with a
  political, philosophical, religious or trade union aim, processing solely its members' and
  regular contacts' data without outside disclosure (a union's, church's or party's own
  membership system answers this rule by naming (d) and its scope, not by deleting the field) -
  (e) - personal data manifestly made public by the data subject - and (a) - explicit consent to
  one or more specified purposes, which a bare checkbox does not by itself show. Record the
  exception and its factual basis next to the processing so the answer is legible to a reviewer.
  Where no exception can be named, the engineering changes that remove the subject matter are:
  drop the field, column, form control or label set, and deal with values already stored - which
  is a separate question under Art. 17 that this rule neither quotes nor assesses;
  stop writing the value into logs, analytics events and error-tracker contexts (Art. 5(1)(f),
  and Arts. 44-49 where a recipient is outside the EEA, add their own questions); and where the
  value arrives from a classifier's output, note that AI Act Art. 5(1)(g) runs in parallel with
  its own rule (ai-prohibited-003), its own exceptions and its own remediation - answering one
  duty does not answer the other.
data_categories:
  - user.demographic.race_ethnicity
  - user.demographic.religious_belief
  - user.demographic.political_opinion
  - user.demographic.trade_union_membership
  - user.demographic.sexual_orientation

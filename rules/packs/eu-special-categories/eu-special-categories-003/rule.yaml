  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(1): '‘personal data’ means any information relating
      to an identified or identifiable natural person (‘data subject’); an identifiable natural
      person is one who can be identified, directly or indirectly, in particular by reference to an
      identifier such as a name, an identification number, location data, an online identifier or to
      one or more factors specific to the physical, physiological, genetic, mental, economic,
      cultural or social identity of that natural person'. In the Official Journal text both the
      defined term 'personal data' and the term 'data subject' inside the definition are wrapped in
      U+2018/U+2019 curly quotation marks. CORRECTED 2026-08-03: this file previously substituted
      ASCII U+0022 for the marks around 'data subject' inside the quoted span, while its own note
      about curly marks described only the defined term outside it - a reader was told a true fact
      about the wrong words. Quoted from the same Official Journal text, retrieved 2026-07-30."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 51, first and second sentences: 'Personal data which
      are, by their nature, particularly sensitive in relation to fundamental rights and freedoms
      merit specific protection as the context of their processing could create significant risks to
      the fundamental rights and freedoms. Those personal data should include personal data
      revealing racial or ethnic origin, whereby the use of the term ‘racial origin’ in this
      Regulation does not imply an acceptance by the Union of theories which attempt to determine
      the existence of separate human races.' The U+2018/U+2019 curly quotation marks around 'racial
      origin' are the Journal's own and are reproduced above; this file previously substituted ASCII
      U+0022 for them, which it disclosed but did not fix, and it was fixed on 2026-08-03. Quoted
      from the same Official Journal text, retrieved 2026-07-30."
    url: http://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 83(5)(a): infringements of 'the basic principles for
      processing, including conditions for consent, pursuant to Articles 5, 6, 7 and 9' are 'subject
      to administrative fines up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of
      the total worldwide annual turnover of the preceding financial year, whichever is higher'.
      Art. 9 is listed expressly, so for this rule the tier is a direct listing rather than an
      inference from 'basic principles'. Quoted from the same Official Journal text, retrieved
      2026-07-30."

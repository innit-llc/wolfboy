    - (?<![A-Za-z0-9_])[A-Za-z_][A-Za-z0-9_]{0,20}\.(?:races?|racial|ancestry|beliefs?|faith(?!ful)|creed|worship|RACES?|RACIAL|ANCESTRY|BELIEFS?|FAITH(?!FUL)|CREED|WORSHIP)(?![A-Za-z])

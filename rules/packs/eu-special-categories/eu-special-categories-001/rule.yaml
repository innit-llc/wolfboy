id: eu-special-categories-001
pack: eu-special-categories
short_name: Health data named in the code
problem_line:
  text: "Health: Art. 9 basis not named, or consent step not found"
fix_line: Name the Art. 9(2) exception; for consent, add an explicit step naming the data and each
  purpose; or stop and delete it.
title: Health-related field, measurement or medical identifier named in code - GDPR Art 9(1) basis
  needs review
jurisdiction:
  - EU
legal_basis:
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(1): 'Processing of personal data revealing racial or
      ethnic origin, political opinions, religious or philosophical beliefs, or trade union
      membership, and the processing of genetic data, biometric data for the purpose of uniquely
      identifying a natural person, data concerning health or data concerning a natural person's sex
      life or sexual orientation shall be prohibited.' Quoted verbatim from the Official Journal
      text (CELEX 32016R0679), retrieved 2026-07-30 from the Publications Office cellar
      (publications.europa.eu/resource/celex/32016R0679; eur-lex.europa.eu returns an empty WAF
      challenge, and the cellar URL answers only when the request carries BOTH an Accept header of
      application/xhtml+xml AND an Accept-Language header of eng - with the Accept header alone it
      returns HTTP 400 and a 205-byte body, which this file stated as sufficient until 2026-08-03
      and which was re-tested that day, returning 400 without the language header and 200 with it).
      The Journal spells 'person's' with an ASCII apostrophe. Art 9(1) lists its categories in two
      groups: four introduced by 'revealing' (racial or ethnic origin, political opinions, religious
      or philosophical beliefs, trade union membership), which belong to eu-special-categories-003,
      and four introduced by 'the processing of' (genetic data; biometric data for the purpose of
      uniquely identifying a natural person; data concerning health; data concerning a natural
      person's sex life or sexual orientation). This rule tests the THIRD limb of that second group,
      'data concerning health'. No legal consequence turns on how the limbs are counted, and
      C-184/20 (quoted below) holds that the two groups do not receive different tests, so this rule
      states the position of its own limb and no total. Health is the only element this rule's
      detector can see; whether the data concerns an identified or identifiable natural person (Art
      4(1)) and whether an Art 9(2) exception applies are the context questions. Art. 9 has applied
      since 25 May 2018 - Art. 99(2): 'It shall apply from 25 May 2018.'"
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(15): '‘data concerning health’ means personal data
      related to the physical or mental health of a natural person, including the provision of
      health care services, which reveal information about his or her health status;'. Quoted
      verbatim from the same Official Journal text, retrieved 2026-07-30. Two consequences for this
      rule: the definition covers mental as well as physical health (which is why PHQ-9/GAD-7 scores
      and psychiatric vocabulary are in the detector), and it turns on what the data REVEALS about
      health status, not on the label the developer gave the field - a wellness app's readiness
      score can be data concerning health, while a hospital's healthcheck endpoint is not data about
      a person at all. Note the verb: Art 4(15) defines data CONCERNING health as data which
      'reveal' information about health status. That is not a stylistic detail; it is the textual
      step the Court of Justice took in C-184/20 paragraph 124 to hold that no Art 9(1) limb gets a
      narrower test than any other (see the C-184/20 entry below)."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Recital 35: 'Personal data concerning health should include
      all data pertaining to the health status of a data subject which reveal information relating
      to the past, current or future physical or mental health status of the data subject. This
      includes information about the natural person collected in the course of the registration for,
      or the provision of, health care services as referred to in Directive 2011/24/EU of the
      European Parliament and of the Council (9) to that natural person; a number, symbol or
      particular assigned to a natural person to uniquely identify the natural person for health
      purposes; information derived from the testing or examination of a body part or bodily
      substance, including from genetic data and biological samples; and any information on, for
      example, a disease, disability, disease risk, medical history, clinical treatment or the
      physiological or biomedical state of the data subject independent of its source, for example
      from a physician or other health professional, a hospital, a medical device or an in vitro
      diagnostic test.' Quoted from the same Official Journal text, retrieved 2026-07-30; '(9)' is
      the Journal's own footnote marker, and the Journal's no-break spaces (after 'Directive' and
      'Council') are rendered as ordinary spaces here, as in every other rule quoting this document.
      Three detector consequences stated by the recital itself: a patient identifier is health data
      ('a number, symbol or particular assigned ... for health purposes' - which is why patientId is
      in the vocabulary and why a patient id in a log line is a candidate); a computed 'disease
      risk' and 'the physiological or biomedical state of the data subject' are health data (which
      is why a disease-risk score and physiological readings are in the vocabulary); and
      registration data collected in the course of providing health care is health data (which is
      why a clinical system's person-record fields count even where the field itself names no
      disease). WHAT THE RECITAL DOES NOT SAY, stated here because an earlier draft of this rule
      asserted it: the recital does not decide that every wearable measurement is data concerning
      health. 'Disease risk' and 'physiological or biomedical state' are its words and they carry
      blood pressure, SpO2 and a computed risk score. A step count is behaviour rather than
      physiological state and the recital nowhere addresses it; the only published guidance on the
      point (the Art. 29 Working Party annex, quoted in its own entry below) decides the isolated
      case the other way and makes the answer depend on combination, duration and context. The
      detector deliberately still matches step counts and every other measurement listed - that is a
      question for the adjudicating agent, and context question 2 states the test rather than the
      answer."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-07-30
    jurisdiction: EU
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 4(2): '‘processing’ means any operation or set of
      operations which is performed on personal data or on sets of personal data, whether or not by
      automated means, such as collection, recording, organisation, structuring, storage, adaptation
      or alteration, retrieval, consultation, use, disclosure by transmission, dissemination or
      otherwise making available, alignment or combination, restriction, erasure or destruction;'.
      Art. 4(7): '‘controller’ means the natural or legal person, public authority, agency or other
      body which, alone or jointly with others, determines the purposes and means of the processing
      of personal data;'. Art. 4(8): '‘processor’ means a natural or legal person, public authority,
      agency or other body which processes personal data on behalf of the controller;'. Art. 5(2):
      'The controller shall be responsible for, and be able to demonstrate compliance with,
      paragraph 1'. All quoted verbatim from the same Official Journal text (CELEX 32016R0679),
      re-fetched 2026-08-03; the Journal wraps each defined term in U+2018/U+2019 curly quotation
      marks, preserved here. TWO CONSEQUENCES. (1) NO SINK REQUIREMENT. Art 9(1) prohibits
      processing, and Art 4(2) makes collection, recording, organisation, structuring and storage
      each an operation of processing in their own right; 'disclosure by transmission' is one item
      in that list, not a precondition for the others. A diagnosis column written to a first-party
      database and sent nowhere is therefore squarely inside the prohibition, and a detector that
      required a third-party sink, an analytics call or a log write would make the commonest real
      shape permanently unreachable. (2) THE ADDRESSEE IS WHOEVER PROCESSES. Art 9(1) is written in
      the passive and names no role - processing of the listed categories 'shall be prohibited'. Art
      5(2) shows what the Regulation writes when it means the controller specifically, and Art 9
      contains no such sentence; a processor processes (Art 4(8)), and Art 9(1) prohibits
      processing, so the prohibition reaches a processor too. What IS controller-shaped is Art 9(2):
      its exceptions turn on purposes, legal bases and organisational facts that only the body
      determining 'the purposes and means' (Art 4(7)) can supply. That is a fact about the
      exceptions, not about the prohibition, and context question 5 asks both questions separately."
    url: https://publications.europa.eu/resource/celex/32016R0679
    checked_at: 2026-08-03
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "CJEU, Case C-184/20, OT v Vyriausioji tarnybinės etikos komisija (Grand Chamber, 1 August
      2022), ECLI:EU:C:2022:601. Paragraph 123 sets out the reading THE COURT GOES ON TO REJECT, and
      is quoted here only so that the rejection is legible: 'As the Advocate General has observed,
      in essence, in point 85 of his Opinion, whilst the use, in those provisions, of the verb
      ‘reveal’ is consistent with the taking into account of processing not only of inherently
      sensitive data, but also of data revealing information of that nature indirectly, following an
      intellectual operation involving deduction or cross-referencing, the preposition ‘concerning’
      seems, on the other hand, to signify the existence of a more direct and immediate link between
      the processing and the data concerned, viewed inherently.' Paragraph 124 REJECTS it, and does
      so through this rule's own provisions: 'Such an interpretation, which would result in a
      distinction being drawn according to the type of sensitive data at issue, would not, however,
      be consistent with a contextual analysis of those provisions, in particular with Article 4(15)
      of the GDPR, according to which ‘data concerning health’ are personal data related to the
      physical or mental health of a natural person, including the provision of health care
      services, which ‘reveal’ information about his or her health status, and with recital 35 of
      that regulation, which states that personal data concerning health should include all data
      pertaining to the health status of a data subject which ‘reveal’ information relating to the
      past, current or future physical or mental health status of the data subject.' Paragraph 127
      states the conclusion: 'Consequently, those provisions cannot be interpreted as meaning that
      the processing of personal data that are liable indirectly to reveal sensitive information
      concerning a natural person is excluded from the strengthened protection regime prescribed by
      those provisions, if the effectiveness of that regime and the protection of the fundamental
      rights and freedoms of natural persons that it is intended to ensure are not to be
      compromised.' Operative part, point 2: 'Article 8(1) of Directive 95/46 and Article 9(1) of
      Regulation 2016/679 must be interpreted as meaning that the publication, on the website of the
      public authority responsible for collecting and checking the content of declarations of
      private interests, of personal data that are liable to disclose indirectly the sexual
      orientation of a natural person constitutes processing of special categories of personal data,
      for the purpose of those provisions.' Quoted verbatim from the English text (CELEX
      62020CJ0184), fetched 2026-08-03 from the Publications Office cellar; the request needs BOTH
      an Accept header of application/xhtml+xml AND an Accept-Language header of eng, otherwise it
      returns HTTP 400. The Court's typographic quotation marks (U+2018/U+2019) around 'reveal',
      'concerning' and 'data concerning health' are reproduced as printed. WHAT IT MEANS FOR THIS
      RULE: personal data liable INDIRECTLY to reveal health status are inside Art 9(1), and the
      Court's reason is textual and specific to the health limb - Art 4(15) and Recital 35 already
      define data concerning health by what they 'reveal', so the reveal/concern wording cannot be
      used to give health a narrower test. The category actually at issue in the case was sexual
      orientation, which sits in the same 'the processing of' group as health, so the holding
      reaches a 'concerning'-limb category directly. Context question 3 is this entry's question.
      Note the limit of what is quoted: the judgment settles that indirect revelation is not
      excluded; it does not say how strong an inference must be, and this rule does not assert one."
    url: https://publications.europa.eu/resource/celex/62020CJ0184
    checked_at: 2026-08-03
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "Article 29 Data Protection Working Party, ANNEX - health data in apps and devices (annex to
      the WP29 letter to the European Commission, 5 February 2015). THE SUMMARY TEST, quoted
      verbatim: 'In summary, personal data are health data when: 1. The data are inherently/clearly
      medical data 2. The data are raw sensor data that can be used in itself or in combination with
      other data to draw a conclusion about the actual health status or health risk of a person 3.
      Conclusions are drawn about a person's health status or health risk (irrespective of whether
      these conclusions are accurate or inaccurate, legitimate or illegitimate, or otherwise
      adequate or inadequate)'. ON A STEP COUNT, which is the passage that decides the question this
      rule previously pre-empted: 'if an app would only count the number of steps during a single
      walk, without being able to combine those data with other data from and about the same data
      subject, and in the absence of specific medical context in which the app data are to be used,
      the collected data are not likely to have a significant impact on the privacy of the data
      subject and do not require the extra protection of the special category of health data. They
      are just raw (relatively low impact lifestyle) personal data (provided, the app does not
      process location data), not information from which knowledge about that persons health can be
      inferred.' ON VITAL SIGNS, which qualifies the same way and is why this rule no longer states
      a flat conclusion about heart rate or blood pressure either: 'a single registration of a
      person's weight, blood pressure or pulse/heart rate (if not excessive in absolute terms), at
      least without any further information about age or sex, does not allow for the inference of
      information about the actual or likely future health status of that person. However, that
      aspect measured over time, especially in combination with age and sex, may be used to
      determine a significant aspect of an individual's health'. ON SCALE, from the Working Party's
      own footnote 5 - and this is the strongest available answer to any future proposal to narrow
      this rule's vocabulary on a null result: 'a pedometer tracking and storing how many steps one
      has taken for a few days (and deleting such data after a week by default) may not process
      'health data'. But an app combining several years' worth of extensive quantified-self records
      of an individual (tracking, for example, sleep and exercise habits, detailed records of diet,
      weight, body mass index, blood pressure and other vital statistics, as well as a mood diary)
      will be processing health data.' ON INFERENCES: 'When conclusions are drawn about someone's
      health, regardless of their reliability, these conclusions are to be treated as health data.'
      And: 'Raw sensor data thus may lead to the drawing of conclusions (whether accurate or
      inaccurate) concerning the health status of a data subject. Such conclusions are health data,
      even though the raw sensor data may not always be.' Fetched 2026-08-03 from the Commission's
      Article 29 documentation archive; the PDF is 576,787 bytes (SHA-256
      3f4da2febc8fe1b271f511a319c786505e5451cab2d8e1579721399d2866af52) and the quotations above are
      transcribed from its text layer. TYPOGRAPHY, corrected 2026-08-03 after an independent
      re-check: the annex prints the marks around the words health data in the footnote 5 passage as
      ASCII apostrophes (U+0027), and this file wrote them as U+2018/U+2019 until that day - the
      same defect shape, in the opposite direction, that the sibling rule -003 spent a repair round
      removing. The same text layer contains U+2018, U+2019, U+201C and U+201D elsewhere, so the
      straight marks are what the document prints and not an artefact of the renderer; every other
      quotation in this entry uses the document's own characters unchanged. STANDING: this is
      guidance from a body that no longer exists, construing a repealed Directive. It is not
      binding, the EDPB has not re-adopted it, and it is cited here as the reasoning a competent
      adjudicator should engage with rather than as authority that settles anything. WHY IT DOES NOT
      NARROW THE DETECTOR: the same document says scale, combination and purpose turn the identical
      value into health data, and says a controller using ANY personal data 'with the purpose of
      identifying disease risks' is inside the concept. A regex sees one line, not a retention
      period or a join. So the vocabulary stays wide and the question moves to context question 2,
      where it belongs."
    url: https://ec.europa.eu/justice/article-29/documentation/other-document/files/2015/20150205_letter_art29wp_ec_health_data_after_plenary_annex_en.pdf
    checked_at: 2026-08-03
    jurisdiction: EU
    supports_rule_condition: false
  - cite: "GDPR (Regulation (EU) 2016/679), Art. 9(2): 'Paragraph 1 shall not apply if one of the
      following applies: (a) the data subject has given explicit consent to the processing of those
      personal data for one or more specified purposes, except where Union or Member State law
      provide that the prohibition referred to in paragraph 1 may not be lifted by the data subject;
      (b) processing is necessary for the purposes of carrying out the obligations and exercising
      specific rights of the controller or of the data subject in the field of employment and social
      security and social protection law in so far as it is authorised by Union or Member State law
      or a collective agreement pursuant to Member State law providing for appropriate safeguards
      for the fundamental rights and the interests of the data subject; (c) processing is necessary
      to protect the vital interests of the data subject or of another natural person where the data
      subject is physically or legally incapable of giving consent; (d) processing is carried out in
      the course of its legitimate activities with appropriate safeguards by a foundation,
      association or any other not-for-profit body with a political, philosophical, religious or
      trade union aim and on condition that the processing relates solely to the members or to
      former members of the body or to persons who have regular contact with it in connection with
      its purposes and that the personal data are not disclosed outside that body without the
      consent of the data subjects; (e) processing relates to personal data which are manifestly
      made public by the data subject; (f) processing is necessary for the establishment, exercise
      or defence of legal claims or whenever courts are acting in their judicial capacity; (g)
      processing is necessary for reasons of substantial public interest, on the basis of Union or
      Member State law which shall be proportionate to the aim pursued, respect the essence of the
      right to data protection and provide for suitable and specific measures to safeguard the
      fundamental rights and the interests of the data subject; (h) processing is necessary for the
      purposes of preventive or occupational medicine, for the assessment of the working capacity of
      the employee, medical diagnosis, the provision of health or social care or treatment or the
      management of health or social care systems and services on the basis of Union or Member State
      law or pursuant to contract with a health professional and subject to the conditions and
      safeguards referred to in paragraph 3; (i) processing is necessary for reasons of public
      interest in the area of public health, such as protecting against serious cross-border threats
      to health or ensuring high standards of quality and safety of health care and of medicinal
      products or medical devices, on the basis of Union or Member State law which provides for
      suitable and specific measures to safeguard the rights and freedoms of the data subject, in
      particular professional secrecy; (j) processing is necessary for archiving purposes in the
      public interest, scientific or historical research purposes or statistical purposes in
      accordance with Article 89(1) based on Union or Member State law which shall be proportionate
      to the aim pursued, respect the essence of the right to data protection and provide for
      suitable and specific measures to safeguard the fundamental rights and the interests of the
      data subject.' Quoted verbatim from the same Official Journal text, retrieved 2026-07-30; the
      Journal's no-break spaces (inside 'Member State' in points (a), (b), (h) and (i), after
      'paragraph' in point (h), and after 'Article' in point (j)) are rendered as ordinary spaces.
      Point (h) is the exception a real clinical system relies on, so a finding on a hospital's or
      insurer's own records is expected output, answered by naming the (h) basis and the Art 9(3)
      secrecy arrangement rather than by changing code. Point (a) requires consent that is EXPLICIT
      and for SPECIFIED purposes - a consent surface near a health field is a lead, never an
      answer."
    url: https://publications.europa.eu/resource/celex/32016R0679

settling_questions:
  - operator.special_category_condition
context_questions:
  - "Does the matched value relate to an identified or identifiable natural person at all (GDPR Art.
    4(1))? Art 9(1) governs personal data, so this question decides most candidates first. Not
    personal data: a diagnosis or ICD-10 code on a disease MASTER table or code list with no person
    key; an allergen list that is an attribute of a menu item or product; medical words inside
    dictionary entries, teaching datasets or translation glosses; a veterinary or plant-pathology
    record; aggregate statistics with no per-person row. Personal data: the same field keyed on a
    user, patient, member, session or device identifier - and per Recital 35, the patient identifier
    itself ('a number, symbol or particular assigned to a natural person to uniquely identify the
    natural person for health purposes'). Quote the surrounding schema, type or query and say what
    the row is keyed on. Where there is no person key anywhere, record that and stop - the remaining
    questions do not arise."
  - "Is the value data concerning health as Art. 4(15) defines it - personal data that 'reveal
    information about his or her health status'? ANSWER THE TEST, DO NOT ASSUME THE ANSWER. Some of
    what this detector matches is settled and some is genuinely open, and an earlier draft of this
    rule wrongly told you the open cases were closed. SETTLED, on the words of Recital 35 itself:
    information collected when registering for or receiving health care; a patient identifier
    assigned for health purposes; a diagnosis, disease code, medication, prescription, allergy,
    disability or medical history; a computed disease-risk score; 'the physiological or biomedical
    state of the data subject', which carries blood pressure, blood glucose, SpO2 and clinical
    laboratory values. For these, 'it is only wellness data' is not a dismissal. OPEN, and the
    question you have to actually answer: an isolated lifestyle measurement - a step count, a
    calorie count, a single heart-rate reading, a sleep-duration value - is not health data merely
    because a wearable produced it. The Art. 29 Working Party's three-limb test (quoted in
    legal_basis) is the one to apply: (1) is the data inherently or clearly medical; (2) is it raw
    sensor data that, alone OR IN COMBINATION with other data this controller holds, can support a
    conclusion about the person's actual health status or health risk; (3) are conclusions in fact
    drawn about health status or health risk - and if they are, those conclusions are health data
    whether or not they are accurate. So the deciding facts are usually not on the matched line:
    what else is stored against the same person, for how long, and what the product does with it. A
    pedometer keeping a few days of steps and deleting them may not be processing health data; the
    same step count joined to weight, BMI, sleep and years of history is, and so is any field a
    controller uses for the purpose of identifying disease risks. Say which limb you are relying on
    and what evidence in the repository supports it; if the code does not show the combination or
    the retention, say the question is unresolved rather than resolving it either way. THE RECURRING
    NON-HEALTH READINGS, each measured on real trees: a healthcheck/health_check/liveness/readiness
    endpoint or a service's healthStatus describes a SYSTEM, not a person; 'diagnostic' in tooling
    (compiler diagnostics, a placement-test feature) describes software or a quiz; an A/B
    experiment's 'treatment' arm describes the experiment; 'temperature' as an LLM sampling
    parameter; Core Web Vitals metrics; a retry helper's sleep_duration or MAX_SLEEP_DURATION_MS; a
    form wizard's stepCount; a university admissions record; a Material or Font Awesome icon name in
    a generated icon catalogue (medication, allergy, vaccines, psychiatry and pregnancy are all icon
    names). Quote the line and name which reading applies."
  - "Does anything on or near this line indirectly reveal health status, even though no field names
    a disease? This question exists because C-184/20 (quoted in legal_basis) holds that personal
    data 'liable indirectly to reveal sensitive information concerning a natural person' are NOT
    excluded from Art 9(1) - and the Court reached that conclusion by reasoning through Art. 4(15)
    and Recital 35, which are this rule's own provisions: because 'data concerning health' are
    themselves defined as data which 'reveal' information about health status, the health limb
    cannot be given a narrower test than the 'revealing' categories. So a field that is not
    health-shaped at all can still be inside Art 9(1). The shapes to look for, none of which this
    detector can see on its own: a prescription-refill schedule, a repeat-medication reminder or a
    pharmacy order history; a leave-of-absence, absence-reason or workplace-accommodation code on an
    employee record; an accessibility or assistive-technology flag stored against a person rather
    than a session; an insurance tier, premium band, underwriting class or claims-history flag;
    membership of a named support group, clinic, specialist ward or disease-specific mailing list; a
    dietary or allergen attribute recorded against a PERSON rather than against a product or a menu
    item; a device or app identifier that only a single-condition product installs; an appointment
    record whose only content is which department the person visited. For any such field, ask what a
    reader holding this row could conclude about the person's physical or mental health, and quote
    the join that makes the inference available. Two limits to respect: the judgment settles that
    indirect revelation is not excluded, not how strong an inference has to be, so do not present a
    weak inference as decided; and a field that is genuinely unrelated to health does not become Art
    9(1) data because it sits in a health product's repository. Where you find nothing, record that
    you looked."
  - "Which Art 9(2) exception, if any, covers the processing, and can you name its legal basis? Nine
    of the ten are invisible to a scanner, so this is your question, not the detector's. Walk them
    in the order a real product turns on them. (h) preventive or occupational medicine, medical
    diagnosis, provision of health or social care or management of its systems - the exception a
    genuine clinical system (EHR, claims processor, pharmacy, telehealth) actually relies on; a
    finding on such a system is expected output, and the answer is naming the (h) basis ('on the
    basis of Union or Member State law or pursuant to contract with a health professional') plus the
    Art 9(3) condition: is the processing under the responsibility of someone bound by professional
    secrecy? Say whether the code or repository shows that organisational fact or whether it must be
    confirmed outside the code. (a) explicit consent for one or more SPECIFIED purposes - a consent
    checkbox or consent SDK near the health field is a lead, never an answer: quote what the consent
    covers and whether it is explicit and purpose-specific, and note that Union or Member State law
    can make the prohibition unliftable by consent. (b) employment and social security law, for HR
    and occupational-health features. (c) vital interests where the person cannot consent, for
    emergency features. (d) a not-for-profit body with a political, philosophical, religious or
    trade-union aim processing only its members' data. (e) data manifestly made public by the data
    subject - turns on how the value reached the system, so trace the write path. (f) legal claims.
    (g) substantial public interest on a named Union or Member State legal basis. (i) public health.
    (j) archiving, scientific or historical research or statistics under Article 89(1) - the
    exception a research pipeline relies on, conditional on safeguards. Quote what you find, or
    record explicitly that you looked and the code shows nothing either way."
  - "Where does the value go? Trace it and quote each hop. A first-party database write is still Art
    9(1) processing and this rule fires on it deliberately - but each further hop adds separate
    questions: a log or console write (console.log, logger.*, print, Rails.logger - and note a
    patient identifier in a log line is itself health data per Recital 35); an error tracker
    (captureException, setContext, setUser, sendDefaultPii); a product-analytics or marketing SDK
    (track, identify, logEvent, gtag, dataLayer.push); a session-replay recorder capturing screens
    where health fields are typed; an LLM or other third-party API receiving the value in a prompt
    or payload; an export or CSV feature. For any recipient outside the EEA, Arts 44-49 transfer
    questions arise on top of Art 9; for logs and trackers, Art 5(1)(f) integrity/confidentiality
    and Art 5(1)(c) minimisation. Say which sinks exist, quote them, and say which received the
    health value itself rather than a foreign key."
  - "Two separate questions, and they have different answers. FIRST, WHO PROCESSES? That is what Art
    9(1) prohibits, and it names no role: the prohibition is written in the passive ('shall be
    prohibited'), and Art 5(2) shows what the Regulation writes when it means the controller
    specifically. A processor 'processes personal data on behalf of the controller' (Art 4(8)), so a
    processor is inside the prohibition too, and so is this repository's party if its code collects,
    records, structures or stores the value. SECOND, WHO DETERMINES THE PURPOSES AND MEANS (Art
    4(7))? That is the controller, and it matters because the Art 9(2) exceptions are almost all
    controller-shaped - only the body that sets the purpose can say which exception the purpose
    falls under, and only it can hold the consent record or name the Union or Member State law. All
    three provisions are quoted in legal_basis. Practical consequences: a library, SDK, FHIR client
    wrapper or integration connector that carries health-shaped fields through to a caller processes
    them, but does not thereby determine the purposes - record the finding as guidance for the
    integrating application and say so. A hosted service running someone else's clinical workload is
    a processor and is still inside Art 9(1), with Art 28 duties on top; naming the customer as
    controller answers the second question, not the first."
  - Does Art 9(4) change the answer for the member states this product is deployed in? For data
    concerning health (with genetic and biometric data) a member state 'may maintain or introduce
    further conditions, including limitations', so an analysis under the GDPR alone is never the
    complete national answer for this rule's subject matter. Name the member states the repository
    shows the product operating in, if it shows any, and record that national conditions were not
    assessed by this scan.
  - "IF THE MATCH IS A MEDICAL EVENT-TYPE CONSTANT, ASK THREE THINGS IN THIS ORDER. FIRST, IS IT A
    NAME OR A VALUE? A constant, an enumeration member or a column declaration is a name; find
    whether any code path writes a value for it and quote that path, because a product may carry a
    vocabulary it never populates. SECOND, WHOSE HEALTH IS IT ABOUT, AND IS THAT PERSON LIVING? A
    cause of death, an autopsy record or a death certificate is ordinarily about a deceased person,
    and Recital 27 puts the deceased outside this Regulation while leaving member states free to
    legislate - so name the deployment jurisdictions before concluding anything. Then ask separately
    whether the same value is information about a LIVING person: a hereditary cause of death in a
    relative record can be data concerning the health, and disease risk, of the living people linked
    to it. THIRD, IS THE MEDICAL READING THE RIGHT ONE HERE? A miscarriage is a miscarriage of
    justice in a legal corpus, and an autopsy or a post-mortem is a figure of speech about an
    incident or a release in engineering prose. ONE OF THOSE WAS MEASURED RATHER THAN GUESSED AT:
    `post_mortem` and `pdb-postmortem` are the Python debugger's own API and command-line flag, so a
    tree that drops into a debugger on an unhandled exception carries the word with no medical sense
    at all. Say which reading applies before going further."
  - "WHO ANSWERS WHICH ART. 9(2) CONDITION THE ORGANISATION RELIES ON? Whether the organisation that
    runs this product has a condition under Art. 9(2) for the special-category data it keeps, and
    has it written down, is a fact about that organisation: the person running the scan is asked it
    as the Art 9 condition question, ScanProfile.operator.special_category_condition, and the code
    never decides it. Where the matched value is special-category data about an identifiable person
    and what remains open is that condition - the Art. 9(2) question above - write the finding as
    waiting on operator.special_category_condition, whether or not it has been answered, and let the
    program apply the answer. The leads the Art. 9(2) question asks you to quote from the repository
    corroborate or contradict the answer; where they contradict it, say so in the reasoning. The
    answer settles that condition and nothing else: whether the value is special-category data at
    all and whom it concerns, any further condition Member State law adds under Art. 9(4), and
    whether the condition covers the use this finding is about, stay yours, so where one of those
    decides the finding, answer it instead of waiting. An answer that the organisation has a
    condition never says that it covers a particular use: each condition is tied to its purpose
    (Art. 9(2)(a) consent is given for one or more specified purposes), so each onward use the code
    shows - the value sent to a log or an error tracker, an analytics, marketing or session-replay
    SDK or another tracker, a language model or another third-party API, or an export - is yours to
    judge on its own line, with the transfer, minimisation and integrity questions it raises, and is
    never written as waiting on this answer."
evidence_template: "{file}:{line} carries vocabulary from this rule's health-data list - the name of
  a field, a measurement, a medical identifier or a health-data interface. THAT IS VOCABULARY, NOT A
  READING: the detector did not establish that the word carries its medical sense here, and context
  question 2 names the recurring non-health readings that were measured on real trees - a
  healthcheck, liveness or readiness endpoint and a service's healthStatus describe a SYSTEM rather
  than a person; a step count can be an agent loop's tool-call limit or a setup wizard's step total;
  medication, allergy, vaccines, psychiatry and pregnancy are all icon names in a generated icon
  catalogue. A FURTHER KIND IS A MEDICAL EVENT-TYPE CONSTANT - a cause of death, an autopsy, a
  post-mortem, a stillbirth, a death certificate or a named medical or clinical event, declared as a
  constant, an enumeration member or a column name. A CONSTANT ESTABLISHES THE VOCABULARY AND
  NOTHING ELSE: that this tree has a name for the thing, not that any person's record carries a
  value for it, not that any such value was ever written, and not that any of it is data concerning
  health within Art. 4(15) - that reading is context question 2's, and whether an Art. 9(2)
  exception covers the processing is question 4's. Where the field is death-related there is a
  further question before either of them, and it is context question 8's: whether any living person
  is concerned at all, since information about a deceased person is outside this Regulation's own
  material scope (Recital 27) while member-state law may still cover it, and a relative's cause of
  death can be information about a living person's disease risk. Two further shapes sit outside that
  list and were met on real code: one of these words as an entry in a common-password blocklist, and
  one of them used metaphorically in English prose or documentation, as in a testing guide's 'a
  timeout is usually a symptom, not the problem'. Say which reading applies, or that none of them
  does, before going further - then check whether the value relates to an identifiable natural
  person and which Art 9(2) exception, if any, covers the processing"
remediation_template: |
  This is a candidate for review against GDPR Art 9(1), which prohibits processing of data
  concerning health unless an Art 9(2) exception applies - not a determination about this code.
  Art 9 has applied since 2018-05-25 and is expressly inside the Art 83(5)(a) fining tier (up to
  EUR 20 000 000 or 4% of worldwide annual turnover, whichever is higher).
  Establish three facts first, because most candidates fail on one of them:
  1. Does the value relate to an identified or identifiable natural person? A disease code list,
     a product's allergen attribute, a dictionary entry and a service healthcheck are not
     personal data; the same vocabulary keyed on a user or patient row is.
  2. Does it reveal information about that person's physical or mental health (Art 4(15),
     Recital 35)? Recital 35 reads broadly, and its own words carry clinical fields, patient
     identifiers assigned for health purposes, disease-risk scores and the physiological or
     biomedical state of the person. For an isolated lifestyle measurement - a step count, a
     calorie total, a single heart-rate reading - the recital settles nothing, and the question
     is whether this dataset, over this period, combined with what this controller also holds,
     supports a conclusion about health status or health risk. Answer it; do not assume it in
     either direction. Context question 2 sets out the test.
  3. Even where no field names a health matter, ask whether the data are liable INDIRECTLY to
     reveal health status - a refill schedule, an absence-reason code, an accessibility flag, an
     insurance tier, a support-group membership. C-184/20 holds that indirectly revealing data
     are not excluded from Art 9(1). Context question 3 sets out the shapes.
  If these hold, the question is which Art 9(2) exception the processing rests on, and the answer
  differs by what the system is:
  - A clinical or care system (EHR, claims, pharmacy, telehealth, occupational health) normally
    rests on Art 9(2)(h). That is answered by naming the legal or contractual basis and the
    Art 9(3) professional-secrecy arrangement - an organisational fact to document next to the
    code - not by deleting fields.
  - A consumer wellness, fitness or symptom-tracking product normally needs Art 9(2)(a) explicit
    consent for one or more specified purposes. Art 9(2)(a), which this rule quotes, carries two
    elements and only two: the consent must be EXPLICIT and it must be for one or more SPECIFIED
    purposes. A distinct, affirmative step that names the health data and each purpose is what
    meets them, and a generic cookie banner or bundled ToS acceptance does not. The further
    requirements a reviewer will also want - that consent be freely given, informed and
    unambiguous (Art 4(11)), that the controller be able to demonstrate it (Art 7(1)), and that
    it be as easy to withdraw as to give (Art 7(3)) - come from provisions this rule neither
    quotes nor assesses; eu-consent-016 is the rule that tests the consent record itself.
  - A research pipeline may rest on Art 9(2)(j) with Article 89(1) safeguards; an HR system on
    (b); an emergency feature on (c).
  Where no exception can be named, the engineering change is to stop processing the health value:
  remove the field and the code that collects, derives or sends it, and delete what is held. Not
  persisting it is not enough on its own: Art 9(1) prohibits processing, and Art 4(2), which this
  rule quotes, counts collection, use and disclosure as processing as well as storage, so a feature
  that holds the value only in memory while it works on it still processes it.
  Independent of the basis, minimise the blast radius, because each of these is a separate
  recurring gap: keep health values and patient identifiers out of application logs and error
  trackers (a patient id in a log line is itself health data under Recital 35); do not attach
  them to product-analytics or marketing events; exclude screens where health data is typed from
  session replay (the session-replay rules eu-consent-005 and eu-consent-020 meet this rule in a
  health application, in different files, and both findings are then correct); and treat any
  transmission to a non-EEA recipient, including an LLM API assembling prompts from records, as
  raising transfer questions on top of Art 9.
  Each item in that paragraph is a SEPARATE duty under a provision this rule neither quotes nor
  assesses, and none of them is decided here: integrity and confidentiality and minimisation
  under Art 5(1)(f) and Art 5(1)(c), erasure of values already collected under Art 17, and
  transfers to third countries under Arts 44-49. Satisfying Art 9 does not satisfy them, and
  failing them is not an Art 9 finding.
  Finally, Art 9(4) lets member states add further conditions for health data, so record which
  member states the deployment covers and have the national layer checked - an analysis under
  the GDPR alone is not the complete answer for health data anywhere.
data_categories:
  - user.health
fingerprint_spec: file

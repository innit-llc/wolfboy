lists:
  storage_recipients:
    kind: recipient
    purpose: "Cloud object-storage vendors that receive uploaded file content and its metadata from the
      scanned product, for the rules that ask who the recipients of the data are — GDPR Art.
      30(1)(d)'s field (d) of the record of processing activities, and the equivalent data-inventory
      field in US state privacy law and in Japan's APPI. Every anchor is a spelling the vendor owns:
      an SDK package name, an import specifier, a registry coordinate or an API hostname. A match is
      evidence that the vendor's code or endpoint is named in the tree; it is not, on its own,
      evidence that anything was disclosed to that vendor, which is what the importing rule's
      context questions are for."
    matching:
      case_insensitive: true
      separator_insensitive: true
    entries:
      - vendor: Amazon Web Services — S3 — Amazon Web Services EMEA SARL
        legal_name: Amazon Web Services EMEA SARL
        anchors:
          - aws-sdk
          - "@aws-sdk/client-s3"
          - boto3
          - aws-sdk-s3
          - aws/aws-sdk-php
          - AWSSDK.S3
          - software.amazon.awssdk
          - com.amazonaws
          - software.amazon.awssdk:s3
          - com.amazonaws:aws-java-sdk-s3
          - github.com/aws/aws-sdk-go-v2/service/s3
          - github.com/aws/aws-sdk-go
          - aws-config
          - aws-credential-types
          - reqsign-aws-v4
          - s3.amazonaws.com
          - com.amazonaws.services.s3
          - software.amazon.awssdk.services.s3
        receives: "PutObject (REST API, direct or via SDK): Key — object key/path, quoted from AWS's own
          docs: \"Object key for which the PUT action was initiated.\" Frequently carries filenames
          or application-chosen identifiers (which themselves often embed a user id)., x-amz-meta-*
          — arbitrary user-defined metadata headers set by the calling application, e.g. AWS's own
          worked example \"x-amz-meta-author: Janet\"., Content-Type, Content-Disposition — the
          latter can carry an original filename via an attachment;filename= directive., ACL grantee
          headers (x-amz-grant-*) — historically could carry a grantee's email address; AWS's own
          docs state Email Grantee ACLs were discontinued as of October 1, 2025 in several regions.
          | S3 server access logs / CloudTrail: Remote IP — quoted verbatim: \"The apparent IP
          address of the requester.\" (example given: 192.0.2.3), Requester — \"The canonical user
          ID of the requester, or a - for unauthenticated requests\" (or the assumed IAM role ARN),
          Key — the object key of the request, example given: /photos/2019/08/puppy.jpg, Referer,
          User-Agent — standard HTTP headers, logged verbatim"
        jurisdiction: "A QUESTION, NOT AN ANSWER. The candidate entities the vendor's own documents name are
          listed below with the document each was read from and the date it was read; which of them
          applies to the operator running this scan is a fact about THEIR contract, not about the
          vendor. What the research pass recorded as this vendor's establishment IN the European

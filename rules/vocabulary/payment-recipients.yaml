lists:
  payment_recipients:
    kind: recipient
    purpose: "Payment vendors that receive personal data from the scanned product, for the rules that
      ask who the recipients of the data are — GDPR Art. 30(1)(d)'s field (d) of the record of
      processing activities, and the equivalent data-inventory field in US state privacy law and in
      Japan's APPI. Every anchor is a spelling the vendor owns: an SDK package name, an import
      specifier, a registry coordinate or an API hostname. A match is evidence that the vendor's
      code or endpoint is named in the tree; it is not, on its own, evidence that anything was
      disclosed to that vendor, which is what the importing rule's context questions are for."

  payment_sdk_names_cra_scope:
    kind: term
    purpose: The payment-SDK spellings eu-cra-001 reads as evidence of commercial activity under CRA
      Art. 3(22)'s second limb, which Recital 15 characterises by charging a price or an intention
      to monetise. A different question from payment_recipients above, over a strict subset of the
      same spellings.
    entries:
      - term: Payment SDK package or npm scope named in a dependency declaration or an import
        anchors:
          - "@paddle/"
          - paddle-sdk
          - lemonsqueezy
          - "@polar-sh/"
          - "@adyen/"
          - braintree-web
        note: "These six spellings are exactly what rules/packs/eu-cra/eu-cra-001/rule.yaml match[4] carried
          inline before V2b, and moving them here changed that rule's matching by no character. They
          are a strict subset of payment_recipients above, and they are written twice on purpose: a
          rule imports a whole list and cannot import part of one, so eu-cra-001 splicing
          payment_recipients would widen a CRA scope rule from six spellings to every anchor in the
          table, which is a change to that rule's detection approach and not this phase's to take.
          Neither copy is hand-maintained: both are projected from one declaration in the generator
          of this file, which refuses to write this file if a spelling here is not an anchor of an
          entry above."

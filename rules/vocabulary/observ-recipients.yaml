          are entered into by. The document read is the UNITED STATES region version; a
          region-specific version for the European Economic Area exists and was not read, so whether
          a customer there contracts with an Irish entity is unconfirmed [read from
          https://marketingplatform.google.com/about/analytics/terms/us/ on 2026-08-25]; Google
          Ireland Limited — Ireland, as the research pass recorded it — named in Google's CONSUMER
          privacy policy as an affiliate for services in the European Economic Area. That is a
          different document about a different product, and it is here so a reader knows the entity
          exists rather than as evidence about this one [read from
          https://policies.google.com/privacy on 2026-08-25]. || WHICH CANDIDATE APPLIES TO A GIVEN
          OPERATOR IS A FACT ABOUT THAT OPERATOR'S OWN CONTRACT AND NOT AN ATTRIBUTE OF THE VENDOR.
          It is read from the order form, the data processing agreement or the invoice that operator
          actually signed; where none of those can be read, the answer for this field is
          needs_human. Do not choose a candidate because it is the largest, the nearest, the one
          with the most familiar name or the only one left. Every date above is the day that
          document was read and nothing in this repository re-reads it, so this list ages into an
          INCOMPLETE list and never into a false statement — a candidate may have been renamed,
          acquired or added since."
        jurisdiction_source: "ESTABLISHED FIRST-HAND FOR THE PRODUCT, and this is a case where the brief's
          general rule needed testing rather than applying. The brief states that a vendor's
          contracting entity does not change between its products; for Google that is FALSE as a
          general matter, and it was checked rather than assumed. The Google Analytics Terms of
          Service retrieved in this pass name Google LLC as the contracting party and name NO EEA
          entity at all, while the first bundle's research recorded Google Cloud EMEA Limited as the
          (weak-evidence) EMEA contracting entity for Google Cloud Storage and the consumer privacy
          policy names Google Ireland Limited for EEA consumer services. THREE DIFFERENT ENTITIES
          ACROSS THREE DOCUMENTS. WHAT WAS CARRIED ACROSS FROM THE FIRST BUNDLE: only the recorded
          fact that Google's own canonical contracting-entity page
          (cloud.google.com/terms/google-entity) is a JavaScript-rendered single-page application
          that returns no server-rendered text, so it was not re-attempted here. WHAT WAS NOT
          CARRIED ACROSS: the Google Cloud EMEA Limited establishment, which is about Google Cloud
          Platform and not about Google Analytics, and which the first bundle's own research tagged
          JURISDICTION NOT ESTABLISHED. The document read here is the US-REGION Analytics terms; a
          region-specific EEA version exists and was NOT read, so whether an EEA customer contracts
          with an Irish entity is UNCONFIRMED. ||
          https://marketingplatform.google.com/about/analytics/terms/us/ (retrieved 2026-08-25)
          names, for \"The Google Analytics Terms of Service name Google LLC as the contracting
          party\": \"These Google Analytics Terms of Service (this \"Agreement\") are entered into
          by Google LLC (\"Google\") and the entity executing this Agreement (\"You\").\" [SUMMARY,
          not raw text. CORRECTED 2026-08-25 by's independent manual check: the summarising fetch
          had transcribed the vendor's own straight double quotes around
          \"Agreement\"/\"Google\"/\"You\" as single quotes; the source (fetched and read directly
          for this correction) prints them in <strong>\"...\"</strong> spans with literal double
          quotes, now matched verbatim. The fetching tool also reported the notice address 'Google
          LLC, 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA' and reported in terms that
          the document names no separate EEA entity. This is the US-region terms document; the
          region in the URL path is deliberate and is why the EEA question stays open.] ||
          https://policies.google.com/privacy (retrieved 2026-08-25) names, for \"Google Ireland
          Limited is named as an EEA affiliate in the consumer privacy policy\": \"Google Ireland
          Limited, Google Ltd, Google Payment Corp, and Google Dialer Inc.\" [SUMMARY, not raw text.
          This is the CONSUMER privacy policy and the entities it names provide consumer services;
          it is NOT evidence about who a Google Analytics customer contracts with, and it is cited
          here only so a reader does not mistake its absence for a gap in the research.]"

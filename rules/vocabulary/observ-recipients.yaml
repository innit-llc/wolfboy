          message and stack trace, the source file and line, the release and environment, the
          breadcrumb trail leading up to the error - which ordinarily includes the URLs visited, the
          console output and the network requests made - the caller's IP address, the user agent,
          and whatever the application attached through setUser, setTag, setContext or setExtra. —
          THE BREADCRUMB TRAIL AND THE STACK-LOCAL VARIABLES ARE THE FIELDS AN OPERATOR IS LEAST
          LIKELY TO HAVE ENUMERATED. A stack trace can carry the arguments a function was called
          with, and an application that puts an email address, a token or a document title in a URL
          discloses it in the breadcrumbs without any deliberate call. What is attached is decided
          by the calling code and cannot be inferred from the vendor's name. ||
          Sentry.replayIntegration - Session Replay: A serialised recording of the DOM and of its
          mutations over the session, with mouse movement, clicks, scrolls and network request
          metadata, sampled at whatever rate the deployment configures. — THIS PATH IS WHY THIS
          ENTRY MATTERS TO TWO DIFFERENT RULES. The base error integration is a recipients question;
          the replay integration is also a prior-consent and a masking question, which is what
          eu-consent-005 and eu-consent-020 ask. The vendor's own masking options - maskAllText,
          maskAllInputs, blockAllMedia - default to the protective value, as eu-consent-020 records
          from its own reading, so what a recording contains depends on whether the deployment
          reversed them. || sendDefaultPii: Where this option is switched on, the SDK attaches the
          end user's IP address, cookies and request headers to every event without the application
          naming any of them. — A single option changes what every event in the deployment carries,
          which is why a rule elsewhere in this bundle matches it separately. Read the option before
          answering what the vendor receives. || What this vendor necessarily learns on every path,
          regardless of payload: The caller's IP address, the user agent, the destination host and

        receives: "gtag.js / GTM container page_view beacon: The measurement or container id;
          `page_location` (the full page URL including its query string), `page_referrer`,
          `page_title`; the `_ga` client id, a stable pseudonymous device identifier Google's own
          script sets in a first-party cookie; the session id and session number; screen resolution,
          language, and the user agent; and, where the application sets it, `user_id`. —
          `page_location` IS THE FIELD TO READ FIRST. A URL carrying an order number, an email
          address, a password-reset token or a document title is disclosed in full by the default
          page-view beacon with no custom event written at all, and applications routinely put such
          values in the path or the query string. || gtag('event', ...) and dataLayer.push custom
          events: The event name and every parameter the application chooses to attach, including
          e-commerce item, transaction and value parameters. — The operator decides these fields
          entirely; they cannot be inferred from the vendor's name and must be read from the calling
          code. || Google Tag Manager container load: The container id, the page URL and referrer,
          the caller's IP and user agent. The container itself then decides which further tags load,
          and those tags may be other vendors entirely. — A GTM CONTAINER IS A RECIPIENT AND ALSO A
          ROUTER. The record owes Google as a recipient for the container load, AND owes whatever
          the container's published configuration ships to - which is not in the source tree at all
          and has to be read from the GTM workspace. That second half is the thing most often
          missing from a record of processing activities for this vendor. || Measurement Protocol /
          GA4 Data API server-side calls: Whatever the server sends: client_id or user_id, event
          names and parameters. For the Data API, the direction is inbound (reports read back)
          rather than a disclosure. — `@google-analytics/data` is a READ client for reporting, so a
          hit on it is weaker evidence of a disclosure than a hit on the measurement path. Say which
          direction the code runs in. || What Google necessarily learns on every path, regardless of
          payload: The caller's IP address, the user agent, the destination host and path, the TLS
          SNI, and for the browser paths the page URL, the referrer and the `_ga` client id. —
          Google documents IP-address handling controls for GA4; whether any of them is enabled for
          the deployment in front of you is a configuration fact this detector does not have and no
          anchor establishes."
        jurisdiction: "A QUESTION, NOT AN ANSWER. The candidate entities the vendor's own documents name are
          listed below with the document each was read from and the date it was read; which of them
          applies to the operator running this scan is a fact about THEIR contract, not about the

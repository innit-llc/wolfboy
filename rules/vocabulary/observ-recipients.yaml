          reversible in practice for any address a rainbow table or a dictionary of known addresses
          covers, and its whole purpose is to look a specific person up. Recital 26's
          pseudonymisation reasoning is the point - data that can be attributed to a person by the
          use of additional information is still personal data. So the product that renders a
          Gravatar DISCLOSES ITS USERS' EMAIL ADDRESSES to Automattic in identifier form, on every
          page view, together with the page they were on. Wherever the hash travels in an `<img
          src>` rendered in the person's own browser, the disclosure is made by the VISITOR'S
          browser at the product's instruction, which does not remove it from the record - the
          product decided that the request would be made. || Gravatar profile API -

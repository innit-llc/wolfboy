          OVERLOOKED. A page URL carrying a record identifier, an email address or a search term is
          disclosed by the ordinary page-view request as much as by any explicit event, and nothing
          in the protocol strips it. uid is the parameter that turns a pseudonymous visitor
          identifier into a named person for every action already recorded against it. || Bulk
          Tracking request (a JSON body carrying a requests array, with token_auth): An array of
          complete tracking requests in one HTTP call, each carrying the fields above, together with
          an authentication token. Matomo's own reference states that token_auth is a 32-character
          authorization key used to authenticate the API request, and that it is what permits the
          request to set cip, cdt, country, region, city, lat and long. — THIS IS THE SERVER-SIDE
          PATH AND IT IS THE ONE WHERE THE PAYLOAD IS ENTIRELY THE OPERATOR'S. No browser is
          involved, so what travels cannot be read from the vendor's name and must be read from the
          calling code that fills the array. Note the consequence for the IP address: on this path
          the caller's address is the SERVER's, not the person's, unless the operator sets cip
          explicitly - which is one of the parameters the token authorises. Whether a deployment
          sets it is a configuration fact this detector does not have. || JavaScript tracker in the

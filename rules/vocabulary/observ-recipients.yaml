lists:
  analytics_recipients:
    kind: recipient
    purpose: Web and product analytics vendors that receive event-level records of what a person did in
      the scanned product - page views, identify and track calls, session recordings and heatmaps.
      Every anchor is a spelling the vendor owns — an SDK package name, an npm scope, a registry
      coordinate, an import specifier, a snippet global or an API hostname — EXCEPT the
      community-authored client libraries flagged as corroborating-only in the entries that carry
      them. A match is evidence that the vendor's code or endpoint is named at this location; it is
      not, on its own, evidence that anything was disclosed to that vendor, which is what the
      importing rule's context questions are for.
    matching:
      case_insensitive: true
      separator_insensitive: true
    entries:
      - vendor: PostHog — PostHog Inc. (formerly known as Hiberly Inc.)
        legal_name: PostHog Inc.
        anchors:
          - posthog-js
          - posthog-node
          - posthog-react-native
          - posthog-js-lite
          - posthog
          - posthog-ruby
          - posthog/posthog-php
          - github.com/posthog/posthog-go
          - app.posthog.com
          - us.i.posthog.com
          - eu.i.posthog.com
          - us.posthog.com
          - eu.posthog.com
          - i.posthog.com
          - posthog.com/static/array
          - PostHogProvider
          - usePostHog
          - posthog-js/react
          - posthog-rs
          - posthog_ex
        receives: "posthog-js autocapture and $pageview (browser): The event name and its properties; the
          `distinct_id` (a stable pseudonymous identifier PostHog sets in a cookie or in
          localStorage and which is linked to a real user id by `identify`); for autocapture, the
          DOM path, tag name, element text and href of the element interacted with; `$current_url`,
          `$referrer`, `$host`, `$pathname`; screen and viewport dimensions; the user agent and the
          browser, OS and device it is parsed into. — AUTOCAPTURE IS THE FIELD THAT MATTERS MOST
          HERE AND IT IS THE ONE THE OPERATOR IS LEAST LIKELY TO HAVE ENUMERATED: element TEXT is
          captured, so a button or link whose label carries a person's name, an order number or an
          email address discloses it without any explicit event being written. Whether autocapture
          is on for the deployment in front of you is a configuration fact this detector does not
          have. || posthog.identify(distinctId, properties): The application's own user identifier,
          and every person property the call passes - in ordinary use an email address, a name, a
          plan or role, an organisation and a signup date. — This is the call that turns a
          pseudonymous `distinct_id` into a named person for every event already recorded against
          it, historically as well as prospectively. || Session replay (posthog-js
          `session_recording`, and @posthog/react-native session replay): A serialised recording of
          the DOM and of its mutations over the session, plus mouse movement, clicks, scrolls and
          network request metadata where those are enabled. — WHETHER FORM CONTENTS TRAVEL COULD NOT
          BE ESTABLISHED FIRST-HAND IN THIS PASS. PostHog documents input masking with configurable
          behaviour, and the default was not verified against a retrieved document. Treat as
          unconfirmed and read the deployment's own `session_recording` configuration rather than
          assuming either answer. Contrast Microsoft Clarity, whose own documentation was retrieved
          and states input boxes are masked in all modes. || posthog-node / posthog-python /
          posthog-go server-side capture: Whatever the server passes: the distinct id, the event
          name and its properties. The caller's IP address here is the SERVER's, not the end user's,
          unless the application forwards `$ip` explicitly. — The server-side path is the one where
          the operator has full control of the payload, so it is the one where 'what does it
          receive' has to be read from the calling code and cannot be answered from the vendor's
          name. || What PostHog necessarily learns on every path, regardless of payload: The
          caller's IP address (from which a coarse location is ordinarily derived), the user agent,
          the destination host and path, and the TLS SNI. For the browser paths, additionally the
          page URL and the referrer, and the stable `distinct_id` in the cookie or localStorage. —
          This is the floor. An operator who strips every property from every event still discloses
          this much, and Art. 4(1) makes an IP address and a stable identifier personal data in
          their own right."
        jurisdiction: "A QUESTION, NOT AN ANSWER. The candidate entities the vendor's own documents name are
          listed below with the document each was read from and the date it was read; which of them
          applies to the operator running this scan is a fact about THEIR contract, not about the
          vendor. The place the research pass recorded for this vendor: United States (PostHog
          Inc.), with subsidiaries in the United Kingdom (Hiberly Ltd) and Germany (PostHog GmbH) ||
          CANDIDATE CONTRACTING ENTITIES, as the vendor's own documents named them on the day each
          document was read: PostHog Inc. (formerly known as Hiberly Inc.) — United States, as the
          research pass recorded it; no registered address and no state of incorporation was
          obtained — named together with 'any of its subsidiaries and/or affiliates'. The policy
          names the three entities as a group and never says which of them contracts with a given
          customer [read from https://posthog.com/privacy on 2026-08-25]; Hiberly Ltd — United
          Kingdom — named as the subsidiary based in the United Kingdom, in the same policy and with
          the same silence about which entity contracts [read from https://posthog.com/privacy on
          2026-08-25]; PostHog GmbH — Germany — named as the subsidiary based in Germany. Note that
          the EU hosting option places DATA in Germany, which is a fact about where data sits and
          not a fact about which entity contracts [read from https://posthog.com/privacy on
          2026-08-25]. || WHICH CANDIDATE APPLIES TO A GIVEN OPERATOR IS A FACT ABOUT THAT
          OPERATOR'S OWN CONTRACT AND NOT AN ATTRIBUTE OF THE VENDOR. It is read from the order
          form, the data processing agreement or the invoice that operator actually signed; where
          none of those can be read, the answer for this field is needs_human. Do not choose a
          candidate because it is the largest, the nearest, the one with the most familiar name or
          the only one left. Every date above is the day that document was read and nothing in this
          repository re-reads it, so this list ages into an INCOMPLETE list and never into a false
          statement — a candidate may have been renamed, acquired or added since."
        jurisdiction_source: "The three entities are named first-hand in PostHog's own privacy policy. WHICH
          of them contracts with a given customer is NOT established and is not inferable from the
          policy: it names them as a group. PostHog Cloud has a EU-hosted option and the policy
          places that hosting in Germany, which is a fact about where data sits and NOT a fact about
          which entity contracts - the two are separate and are recorded separately here. No
          registered address and no state of incorporation for PostHog Inc. was obtained. ||
          https://posthog.com/privacy (retrieved 2026-08-25) names, for \"PostHog names three
          entities: PostHog Inc. and subsidiaries in the UK and Germany\": \"PostHog Inc. (formerly
          known as Hiberly Inc.) and/or any of its subsidiaries and/or affiliates\" [SUMMARY, not
          raw text: the fetching tool returned quoted fragments selected against a prompt rather
          than the document's own text in order. The fragment is presented as a quotation because
          the tool was asked for verbatim wording and returned it in quotation marks; a reader
          re-deriving this should re-fetch and read the document in full.] ||
          https://posthog.com/privacy (retrieved 2026-08-25) names, for \"The UK and Germany
          subsidiaries are named\": \"our subsidiaries based in the UK (Hiberly Ltd) and in Germany
          (PostHog GmbH)\" [SUMMARY, not raw text - same fetch as the citation above.] ||
          https://posthog.com/privacy (retrieved 2026-08-25) names, for \"EU hosting is in
          Germany\": \"The Websites are hosted in the United States, or in Germany if you are a
          PostHog Cloud customer who has selected EU hosting\" [SUMMARY, not raw text. This sentence
          is about the WEBSITES; whether it also governs the ingestion endpoints a product's own
          code posts to was not established.]"

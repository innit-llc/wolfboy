      exception, its stack trace, the breadcrumb trail and request context leading up to it, and
      whatever identifier the application attached to the person it failed for. Every anchor is a
      spelling the vendor owns — an SDK package name, an npm scope, a registry coordinate, an import
      specifier, a snippet global or an API hostname — EXCEPT the community-authored client
      libraries flagged as corroborating-only in the entries that carry them. A match is evidence
      that the vendor's code or endpoint is named at this location; it is not, on its own, evidence
      that anything was disclosed to that vendor, which is what the importing rule's context
      questions are for.
    matching:

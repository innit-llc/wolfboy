        receives: "mixpanel.track(event, properties) (browser): The event name and its properties; the
          `distinct_id`; and Mixpanel's own default properties - `$current_url`, `$referrer`,
          `$referring_domain`, `$screen_height`, `$screen_width`, `$browser`, `$os`, `$device`,
          `$initial_referrer`, `$search_engine` and `mp_lib`. — The default properties travel
          whether or not the application passes any, so 'we only send an event name' does not
          describe what leaves the browser. || mixpanel.identify / mixpanel.people.set: The
          application's user identifier and every profile property set - in ordinary use `$email`,
          `$name`, `$first_name`, `$last_name`, `$phone`, `$created`, and any custom property. —
          `$email` and `$phone` are Mixpanel's OWN reserved property names, which is why a profile
          call is the path most likely to disclose direct identifiers. || Server-side /track and
          /import (mixpanel Python, Node, Ruby, PHP, Go): Whatever the server passes. The default
          browser properties are absent unless the application supplies them, and the IP seen by
          Mixpanel is the server's unless `ip` is set explicitly. — Mixpanel documents an explicit
          `ip` property for server-side calls, so an operator can cause an end user's IP to be
          disclosed from a server path where it otherwise would not be. Read the calling code. ||
          What Mixpanel necessarily learns on every path, regardless of payload: The caller's IP
          address, the user agent, the destination host and path, and the TLS SNI; for the browser
          paths, the page URL and referrer and the `distinct_id` cookie value."

        receives: "Hotjar tracking-code page load: The site id, the page URL and referrer, the caller's IP
          address, the user agent, screen and viewport dimensions, and a Hotjar user identifier
          stored in the browser. || Session recording: A serialised recording of the page and its
          mutations over the visit, including mouse movement, clicks, scrolls, page transitions, and
          the text content of the page as rendered. — WHETHER FORM CONTENTS TRAVEL COULD NOT BE
          ESTABLISHED FIRST-HAND. Hotjar's Data Suppression help article
          (https://help.hotjar.com/hc/en-us/articles/115011789828-Data-Suppression) returned HTTP
          403 to this pass and no substitute was found. Hotjar is understood to suppress keystrokes
          in input fields by default and to offer `data-hj-allow` to opt individual fields back in,
          AND THAT UNDERSTANDING IS RECORDED AS UNVERIFIED. Read the deployment's own suppression
          configuration. Do not assume either answer, and note that the opt-in direction means a
          developer can deliberately un-suppress a field. || Heatmaps: Aggregated click, move and
          scroll coordinates per page, plus a snapshot of the page's rendered DOM against which the
          coordinates are drawn. — THE DOM SNAPSHOT IS THE PART THAT IS EASY TO MISS. A heatmap is
          often described as anonymous aggregate coordinates, but the picture has to be drawn on
          something, and that something is a capture of the page as one visitor saw it - which on an
          authenticated page is that person's own data. || Surveys and feedback widgets: Free-text
          answers the person types, the rating chosen, and any identifying attributes the
          application attaches to the session. — Free text is the field class with the least
          predictable content in this whole bundle: a person may type anything into it, including
          special-category data under Art. 9(1). || What Hotjar necessarily learns on every path,
          regardless of payload: The caller's IP address, the user agent, the destination host and
          path, the TLS SNI, the page URL and the referrer."

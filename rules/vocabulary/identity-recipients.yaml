        receives: "PER INTEGRATION PATH, and the paths differ materially — read the one the code actually
          uses rather than answering from the vendor's name. PATH 1 — Facebook Login - the browser
          redirect to www.facebook.com/dialog/oauth, or the JavaScript SDK loaded from
          connect.facebook.net calling FB.login: The end user's browser reaches Meta directly, so
          Meta receives the end user's IP address, user-agent and existing Facebook cookies - which
          identify the person to Meta whether or not they complete the sign-in - together with the
          application's app id, the requested permissions, the redirect_uri and the referring page.
          Meta records the app authorisation against the person's Facebook account. Loading the
          JavaScript SDK from connect.facebook.net is itself a request to Meta from the end user's
          browser on every page that loads it, before any sign-in happens. [source: The construct
          itself and Meta's published Login endpoints. NOT re-read from Meta's developer
          documentation in this pass.]  ||  PATH 2 — Graph API token exchange and profile read

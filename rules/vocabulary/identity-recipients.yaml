lists:
  consumer_oauth_recipients:
    kind: recipient
    purpose: Consumer identity providers a product redirects an end user to in order to sign them in -
      the party that authenticates the person, learns that they signed in to this application and
      when, and returns an assertion about who they are. For the rules that ask who received the
      authentication event and whether that party is a processor or an independent controller for
      it. A match is evidence that the vendor's code, endpoint or protocol field name is named in
      the tree; it is not, on its own, evidence that anything was disclosed to that vendor, which is
      what the importing rule's context questions are for.
    matching:
      case_insensitive: true
      separator_insensitive: true
    entries:

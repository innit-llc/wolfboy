          appsecret_proof, the code or access token, the requested field list, and the calling
          server's IP address. RETURNED TO THE OPERATOR, in the opposite direction: the app-scoped
          user id, name, and - where the permission was granted - the email address, profile picture
          and whatever other fields the application asked for. [source: The construct itself. NOT
          re-read from Meta's documentation in this pass.]"

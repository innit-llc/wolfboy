        receives: "PER INTEGRATION PATH, and the paths differ materially — read the one the code actually
          uses rather than answering from the vendor's name. PATH 1 — OAuth 2.0 / OpenID Connect
          authorization-code flow - the browser redirect to accounts.google.com: The end user's
          browser reaches Google directly, so Google receives the end user's IP address, user-agent
          and any Google session cookies the browser already holds; the developer's OAuth client_id,
          which identifies the scanned product's Google Cloud project; the requested scopes; the
          redirect_uri; the state parameter, whatever the application put in it; and the fact and
          time of this person signing in to this application. The person authenticates with their
          Google credentials on Google's own page, so Google also receives whatever it collects at
          sign-in, including any second factor. [source: The construct itself and Google's published
          OAuth 2.0 endpoints. NOT re-read from Google's identity documentation in this pass; the
          field list is the flow's own parameters.]  ||  PATH 2 — Token exchange and userinfo - the
          server-side POST to oauth2.googleapis.com/token and the ID token or
          openidconnect.googleapis.com userinfo call: Sent to Google: the client_id, the
          client_secret, the authorization code or refresh token, and the calling server's IP
          address. RETURNED BY GOOGLE TO THE OPERATOR, which is a disclosure in the opposite
          direction and belongs in a different row of the record: the subject identifier sub, and
          depending on scope the email address, email_verified, given and family name, profile
          picture URL, locale and hosted-domain hd. [source: The OpenID Connect standard claims
          Google's endpoints return. NOT re-read from Google's documentation in this pass.]"

  breach_check_recipients:
    kind: recipient
    purpose: Services a product queries to find out whether a credential or an account identifier has
      appeared in a known data breach. The whole legal interest of this class is HOW MUCH the
      service learns, which differs by an order of magnitude between the two paths the same vendor
      offers, so the entry states both. A match is evidence that the vendor's code, endpoint or
      protocol field name is named in the tree; it is not, on its own, evidence that anything was
      disclosed to that vendor, which is what the importing rule's context questions are for.
    matching:
      case_insensitive: true
      separator_insensitive: true
    entries:
      - vendor: Superlative Enterprises Pty Ltd (Have I Been Pwned, including Pwned Passwords)
        anchors:
          - api.pwnedpasswords.com
          - pwnedpasswords.com
          - haveibeenpwned.com
          - api.haveibeenpwned.com
          - hibp-api-key
          - hibp
          - pwnedpasswords
          - pwned
          - haveibeenpwned
        receives: "PER INTEGRATION PATH, and the paths differ materially — read the one the code actually
          uses rather than answering from the vendor's name. PATH 1 — Pwned Passwords range query -
          GET https://api.pwnedpasswords.com/range/{first 5 characters of the SHA-1 or NTLM hash of
          the password}: WHAT THE SERVICE RECEIVES: the first five characters of the hash, the
          caller's IP address, the User-Agent and the TLS connection metadata, and the timing of the
          request. It does NOT receive the password, the full hash, the username, the email address
          or any account identifier, and it is not told which of the returned suffixes - if any -
          the caller matched, because the comparison happens on the caller's own machine. There are
          1,048,576 possible prefixes and every one returns HTTP 200, so the mere fact of a request
          reveals nothing about whether a match exists. A range search typically returns
          approximately 800 hash suffixes; the Add-Padding: true request header pads every response
          to between 800 and 1,000 results so that response size cannot be used to infer which
          prefix was searched. TWO THINGS DO STILL REACH A HUMAN-RELEVANT LEVEL and must not be
          glossed over: the five-character prefix narrows the password to one of a bucket, and the
          caller's IP address ties the request to a machine and often to a session; and where the
          check is performed incrementally as the user types, the vendor's own documentation says a
          party able to observe inbound requests can discern the original password. [source:
          https://haveibeenpwned.com/API/v3, read raw on 2026-08-25, which says the range query
          \"allows the first 5 characters of either a SHA-1 or an NTLM hash (not case-sensitive) to
          be passed to the API\"; who operates the service, and where, is quoted in
          jurisdiction_source.] [This is the path the phrase k-anonymity refers to, and it is the
          reason this vendor is not comparable to the others in this bundle: on this path the
          operator discloses almost nothing.]  ||  PATH 2 — Breached-account search by full email
          address - GET /breachedAccount/{email address} with an hibp-api-key header: WHAT THE
          SERVICE RECEIVES: the full email address in the URL path, the API key that identifies the
          subscriber, the caller's IP address, and the timing. The vendor's own documentation says
          in terms that this path DISCLOSES THE ADDRESS to Have I Been Pwned. A product that checks
          its users' addresses against breaches on this path is disclosing an account identifier for
          each of them. [source: https://haveibeenpwned.com/API/v3, read raw on 2026-08-25.] [A
          third path exists between the two: a breached-account search by SIX-character hash prefix,
          which the same documentation calls a k-anonymity search and describes as not disclosing
          the address. Which of the three a given integration uses is decided by the URL it builds,
          not by the vendor's name, and the detector cannot tell them apart.]  ||  PATH 3 — The
          onward recipient behind the API, which is a separate party and a separate row of the
          record: Have I Been Pwned's own API documentation names Cloudflare as a party with access
          to view inbound requests to the API. So a request on any of the three paths reaches
          Cloudflare as well as Have I Been Pwned, and Cloudflare's establishment is a separate
          question from Superlative Enterprises'. [source: https://haveibeenpwned.com/API/v3, read
          raw on 2026-08-25, which says this \"may provide a 3rd party (namely someone with access
          to view inbound requests at Cloudflare) with the ability to observe the API requests\".]"

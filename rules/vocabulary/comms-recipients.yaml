  team_chat_recipients:
    kind: recipient
    purpose: "Team-chat and ops-notification webhook vendors that relay a message INWARD TO THE
      OPERATOR'S OWN STAFF — the person the data is about is the SUBJECT of the message rather than
      its addressee, and normally does not know it exists — for the same record fields the sibling
      list serves. THE DIRECTION IS WHY THIS IS A SEPARATE LIST: the audience is the vendor PLUS
      everyone in the channel it posts to, which for a public channel is unbounded, so a record row
      naming only the vendor has understated who received the data. Every anchor is a spelling the
      vendor owns EXCEPT those marked corroborating-only in an entry's note, which a non-vendor
      library author owns — for Discord that is nearly all of them, because Discord publishes no SDK
      in any ecosystem. A match is evidence that the vendor's code or endpoint is named in the tree;
      it is not, on its own, evidence that anything was disclosed."

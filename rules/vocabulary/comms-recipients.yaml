lists:
  email_delivery_recipients:
    kind: recipient
    purpose: "Transactional-email and email-service-provider vendors that relay a message OUTWARD TO THE
      DATA SUBJECT — the person the data is about is the addressee — for the rules that ask who the
      recipients of the data are: GDPR Art. 30(1)(d)'s field (d) of the record of processing
      activities, Cal. Civ. Code Sec. 1798.110(a)(4)'s categories of third parties, and the record
      of provision to a third party under Japan's APPI Art. 29. The relay necessarily learns the
      envelope recipient address and the subject line whether or not the body carries anything about
      a person, so the metadata is a disclosure in its own right. Every anchor is a spelling the
      vendor owns EXCEPT those marked corroborating-only in an entry's note, which a non-vendor
      library author owns. A match is evidence that the vendor's code or endpoint is named in the
      tree; it is not, on its own, evidence that anything was disclosed to that vendor, which is
      what the importing rule's context questions are for."
    matching:
      case_insensitive: true
      separator_insensitive: true
    entries:
      - vendor: Resend — Plus Five Five, Inc. (trading as Resend)
        legal_name: Plus Five Five, Inc.
        anchors:
          - resend
          - resend/resend-php
          - Resend
          - com.resend
          - com.resend:resend-java
          - github.com/resend/resend-go
          - resend-rs
          - api.resend.com
          - resend.com
        receives: "POST /emails (Send Email) — the ordinary send call every SDK wraps: to — the envelope
          recipient address, and up to 50 of them; this is the data subject's own email address and
          it is disclosed on EVERY send, whatever the body says, cc, bcc — further recipient
          addresses, from — sender address, which for a reply-to-a-person flow is often an
          operator's named mailbox, subject — the subject line, which routinely carries a person's
          name or an order/account identifier, html, text — the message body, which routinely
          carries a person's name, address, order contents and links containing tokens, attachments
          (content, filename, path) — arbitrary file content and the original filename, headers —
          arbitrary custom headers the application sets, tags (name, value) — arbitrary
          application-defined key/value data carried with the message, template.variables —
          arbitrary key/value merge data, which is where personalisation fields live | Open and
          click tracking, where the operator enables it: IP address, location, operating system,
          browser, device, email client, spam complaints | The transport itself (learned whether or
          not the payload is interesting): the caller's IP address — the sending server's own
          address, seen on every API call, the envelope recipient address and the subject line,
          which are metadata rather than body content and are disclosed even where the body carries
          nothing about a person [NOT established first-hand in the research pass; treat as
          unconfirmed]"
        jurisdiction: "A QUESTION, NOT AN ANSWER. The candidate entities the vendor's own documents name are
          listed below with the document each was read from and the date it was read; which of them
          applies to the operator running this scan is a fact about THEIR contract, not about the
          vendor. The place the research pass recorded for this vendor: United States (San
          Francisco, California) — Plus Five Five, Inc. || CANDIDATE CONTRACTING ENTITIES, as the
          vendor's own documents named them on the day each document was read: Plus Five Five, Inc.
          — United States (2261 Market Street #5039, San Francisco, CA 94114) — named as the Data
          Importer and Processor in the vendor's own agreement; no entity established in the
          European Economic Area is named at all, so an exporter there is exporting to a United
          States importer [read from https://resend.com/legal/dpa on 2026-08-25]. || WHICH CANDIDATE
          APPLIES TO A GIVEN OPERATOR IS A FACT ABOUT THAT OPERATOR'S OWN CONTRACT AND NOT AN
          ATTRIBUTE OF THE VENDOR. It is read from the order form, the data processing agreement or
          the invoice that operator actually signed; where none of those can be read, the answer for
          this field is needs_human. Do not choose a candidate because it is the largest, the
          nearest, the one with the most familiar name or the only one left. Every date above is the
          day that document was read and nothing in this repository re-reads it, so this list ages
          into an INCOMPLETE list and never into a false statement — a candidate may have been
          renamed, acquired or added since."
        jurisdiction_source: "https://resend.com/legal/dpa (retrieved 2026-08-25) names, for \"the
          contracting entity, named as Data Importer in the DPA's own Exhibit B list of parties\":
          \"Data Importer: Name: Plus Five Five, Inc. Address: 2261 Market Street #5039 San
          Francisco, CA 94114 Contact: Resend Security - Signature and date: The parties agree that
          execution of the Agreement by the Data Importer and the Data Exporter shall constitute
          execution of these Clauses by both parties on the Effective Date of the Agreement. Role:
          Processor\" || https://resend.com/legal/dpa (retrieved 2026-08-28) names, for \"the
          categories of personal data the vendor's own DPA says are transferred\": \"The categories
          of personal data transferred relate to the sending and receiving of email messages (and
          which constitutes personal data). At a minimum, this includes metadata, email address and
          message content. Message content may also include name and other information decided and
          added by the sender, like attachments. The Customer also has the option to enable
          open/link tracking and other analytics/tracking of recipient actions, which could include
          IP address, location, operating system, browser, device, email client and spam
          complaints.\""
      - vendor: Twilio SendGrid — Twilio Ireland Limited
        legal_name: Twilio Ireland Limited
        anchors:
          - "@sendgrid/mail"
          - "@sendgrid/client"
          - sendgrid
          - python-http-client
          - sendgrid-ruby
          - sendgrid/sendgrid
          - SendGrid
          - com.sendgrid
          - com.sendgrid:sendgrid-java
          - com.sendgrid:smtpapi-java
          - com.sendgrid:java-http-client
          - github.com/sendgrid/sendgrid-go
          - api.sendgrid.com
          - smtp.sendgrid.net
          - sendgrid.net
          - "@sendgrid/"
        receives: "POST /v3/mail/send — the ordinary send call: personalizations[].to.email and .to.name —
          the envelope recipient address and the person's display name, per message,
          personalizations[].cc, .bcc — further recipient addresses and names,
          personalizations[].subject — the subject line, personalizations[].dynamic_template_data —
          arbitrary merge data, which is where personalisation fields live,
          personalizations[].custom_args — arbitrary application-defined values \"carried along with
          the email and its activity data\", from.email, reply_to — sender and reply addresses,
          content[].value — the message body, HTML or plain text, attachments[].content, .filename —
          arbitrary file content and the original filename | SMTP relay (smtp.sendgrid.net) — the
          same disclosure by a different transport: the RFC 5322 envelope and headers: recipient
          address, sender address, subject, the message body and attachments [NOT established
          first-hand in the research pass; treat as unconfirmed] | Event Webhook / activity feed
          (delivery, open, click, bounce, spam report): the recipient email address, on every event,
          the event type and timestamp — including whether and when a person opened a message and
          which link they clicked, custom_args, echoed back with the event [NOT established
          first-hand in the research pass; treat as unconfirmed]"
        jurisdiction: "A QUESTION, NOT AN ANSWER. The candidate entities the vendor's own documents name are
          listed below with the document each was read from and the date it was read; which of them
          applies to the operator running this scan is a fact about THEIR contract, not about the
          vendor. The place the research pass recorded for this vendor: Ireland (Twilio Ireland
          Limited, named as EEA Headquarters) and the United States (Twilio Inc.) || CANDIDATE
          CONTRACTING ENTITIES, as the vendor's own documents named them on the day each document
          was read: Twilio Ireland Limited — Ireland (78 Sir John Rogerson's Quay, Dublin 2 D02
          R296) — named as the EEA Headquarters. SendGrid is a Twilio brand and not a separate
          contracting party in the documents read here [read from
          https://www.twilio.com/en-us/legal/privacy on 2026-08-25]; Twilio Inc. — United States, as
          the research pass recorded it — named as the entity complying with the EU-U.S. Data
          Privacy Framework and its United Kingdom and Swiss extensions [read from
          https://www.twilio.com/en-us/legal/privacy on 2026-08-25]. || WHICH CANDIDATE APPLIES TO A
          GIVEN OPERATOR IS A FACT ABOUT THAT OPERATOR'S OWN CONTRACT AND NOT AN ATTRIBUTE OF THE
          VENDOR. It is read from the order form, the data processing agreement or the invoice that
          operator actually signed; where none of those can be read, the answer for this field is
          needs_human. Do not choose a candidate because it is the largest, the nearest, the one
          with the most familiar name or the only one left. Every date above is the day that
          document was read and nothing in this repository re-reads it, so this list ages into an
          INCOMPLETE list and never into a false statement — a candidate may have been renamed,
          acquired or added since."
        jurisdiction_source: 'https://www.twilio.com/en-us/legal/privacy (retrieved 2026-08-25) names, for
          "the EEA entity and its address": "EEA Headquarters Twilio Ireland Limited 78 Sir John
          Rogerson’s Quay, Dublin 2 D02 R296, Ireland" || https://www.twilio.com/en-us/legal/privacy
          (retrieved 2026-08-25) names, for "the US entity and the transfer framework it certifies
          under": "Twilio Inc. and our subsidiary Stytch Inc. comply with the EU-U.S. Data Privacy
          Framework (EU-U.S. DPF), the UK Extension to the EU-U.S. DPF, and the Swiss-U.S. Data

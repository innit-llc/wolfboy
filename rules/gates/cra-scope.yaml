    - quote: "'open-source software steward' means a legal person, other than a manufacturer, that has the
        purpose or objective of systematically providing support on a sustained basis for the
        development of specific products with digital elements, qualifying as free and open-source
        software and intended for commercial activities, and that ensures the viability of those
        products;"
      cite: CRA Art. 3(14)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "A different party under a different and much lighter regime. A steward is expressly \"other
        than a manufacturer\", and Article 24 imposes **neither** Article 13 **nor** Annex II
        information on it - though it is not weightless. Article 24(1), quoted below, requires a
        documented cybersecurity policy; Article 24(2) requires cooperation with the market
        surveillance authorities at their request, and the provision of that documentation on a
        reasoned request from one; and Article 24(3) applies Article 14(1) to a steward to the
        extent it is involved in the product's development, and Article 14(3) and (8) to the extent
        severe incidents **having an impact on the security of products with digital elements**
        affect the network and information systems it provides for that development - the qualifier
        on \"severe incidents\" was dropped from this sentence until 2026-08-05. **Those three
        sentences were deleted on 2026-08-04 and restored the same day, and the reason for the round
        trip is worth keeping.** They were removed on the ground that the
        `cra-product-information-13-8` checklist, which then carried this gate's text, did not carry
        Article 24(2) or Article 24(3), so the prose asserted a legal test with no provision behind
        it - the category that file names as its own prohibition, in its `scope_note`. An
        independent legal check re-fetched the Official Journal, read Article 24 in full and found
        the deleted statements **true**. The prohibition is on stating a legal test with nothing
        behind it, and the remedy it calls for is to fetch the provision, not to delete the
        statement; both paragraphs are now quoted below and cited on the limb that rests on them.
        **Four cumulative elements, and the fourth is easy to drop**: a legal person; other than a
        manufacturer; the purpose or objective of systematically providing support on a sustained
        basis for the development of specific products (which must qualify as free and open-source
        software and be intended for commercial activities); **and that it ensures the viability of
        those products**. A party that funds or supports a project without ensuring its viability is
        not a steward, and dropping the element would route it off `cra-product-information-13-8` on
        a definition it does not meet."
    - quote: 1. Open-source software stewards shall put in place and document in a verifiable manner a
        cybersecurity policy to foster the development of a secure product with digital elements as
        well as an effective handling of vulnerabilities by the developers of that product. That
        policy shall also foster the voluntary reporting of vulnerabilities as laid down in Article
        15 by the developers of that product and take into account the specific nature of the
        open-source software steward and the legal and organisational arrangements to which it is
        subject. That policy shall, in particular, include aspects related to documenting,
        addressing and remediating vulnerabilities and promote the sharing of information concerning
        discovered vulnerabilities within the open-source community.
      cite: CRA Art. 24(1)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Added 2026-08-04. The steward limb and the Article 3(14) note between them stated five
        propositions about Article 24 while Article 24 was quoted nowhere in the
        `cra-product-information-13-8` checklist** - the exact category that file names as its own
        prohibition in its `scope_note`, and one it had already corrected four times in a day for
        Article 21, Article 22(1), Article 3(16) and Article 3(17). This is the duty a \"yes\" on
        the steward limb points at, and it is a duty about a **policy**: put in place and document
        in a verifiable manner a cybersecurity policy to foster secure development and effective
        handling of vulnerabilities **by the developers of that product**, fostering the voluntary
        reporting of vulnerabilities under Article 15 **by the developers of that product** and
        taking account of the steward's own nature and legal and organisational arrangements; and
        the paragraph gives that policy two further contents in two different verbs - it shall, \"in
        particular, **include aspects related to** documenting, addressing and remediating
        vulnerabilities\", and it shall **promote** \"the sharing of information concerning
        discovered vulnerabilities within the open-source community\". **This compression dropped
        \"by the developers of that product\" from both of the first two limbs and collapsed the
        last two verbs into one word, \"covering\", until 2026-08-05.** Both matter and in opposite
        directions. The locus is the operative limit on a duty that falls on a party which by
        Article 3(14) is not the manufacturer, so dropping it widened the duty past the paragraph's
        own words; and \"promote the sharing\" is an active obligation, which \"covering\" turned
        into a topic the policy merely has to touch on, so that half was narrowed. It is not the
        Article 13 duty and it is not the Annex II information `cra-product-information-13-8` walks.
        **Article 24(2) and Article 24(3) are quoted below, and they were deleted rather than
        fetched on 2026-08-04.** For part of that day this `why` read \"Article 24(2) and Article
        24(3) are not carried by this file, so nothing here may state what they require\" - \"this
        file\" then being the `cra-product-information-13-8` checklist - and the statements about
        them elsewhere in that file were removed on that ground. An independent legal check
        re-fetched the Official Journal, read Article 24 in full and found the deleted statements
        **true and a faithful compression of the text**, down to both \"to the extent\" clauses.
        Deleting a correct statement because nobody fetched its source is a loss and not a
        correction: the right remedy was one `curl`, which is what was run, and the statements are
        restored with the paragraphs behind them. Article 24 is out of scope for this product's rule
        coverage - a decided exclusion, on the recorded ground that its addressee is stewards rather
        than app developers - so what a finding may say is still bounded by that exclusion and not
        by what this gate quotes: say that this may be a steward's obligation under Article 24,
        which this product does not examine, never that there is no obligation."
    - quote: 2. Open-source software stewards shall cooperate with the market surveillance authorities, at
        their request, with a view to mitigating the cybersecurity risks posed by a product with
        digital elements qualifying as free and open-source software. Further to a reasoned request
        from a market surveillance authority, open-source software stewards shall provide that
        authority, in a language which can be easily understood by that authority, with the
        documentation referred to in paragraph 1, in paper or electronic form.
      cite: CRA Art. 24(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**The second of the steward's duties, and the file said what it required in prose before it
        carried it.** Article 24(2) has two subparagraphs and both are quoted: a standing duty to
        cooperate with the market surveillance authorities at their request, with a view to
        mitigating the cybersecurity risks posed by a product with digital elements qualifying as
        free and open-source software; and, further to a **reasoned** request from such an
        authority, a duty to provide the documentation referred to in Article 24(1) - the
        cybersecurity policy - in a language which can be easily understood by that authority, in
        paper or electronic form. **Both duties are triggered by the authority, not by the steward's
        own release cycle**, which is the practical difference between this paragraph and Article
        24(1): 24(1) is a thing to have written down before anyone asks, and 24(2) is what happens
        when somebody does ask. Note that the documentation duty is on a **reasoned** request while
        the cooperation duty is on a bare request; the paragraph draws that distinction and a
        finding must not flatten it."
    - quote: 3. The obligations laid down in Article 14(1) shall apply to open-source software stewards to
        the extent that they are involved in the development of the products with digital elements.
        The obligations laid down in Article 14(3) and (8) shall apply to open-source software
        stewards to the extent that severe incidents having an impact on the security of products
        with digital elements affect network and information systems provided by the open-source
        software stewards for the development of such products.
      cite: CRA Art. 24(3)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Part of the Article 14 reporting regime reaches a steward, and only part - the two \"to the
        extent\" clauses are the whole of the point.** Article 14(1) applies to a steward **to the
        extent that it is involved in the development** of the products with digital elements.
        Article 14(3) and Article 14(8) apply **to the extent that severe incidents** having an
        impact on the security of products with digital elements **affect network and information
        systems provided by the steward for the development** of those products. Neither is a
        wholesale application of Article 14 to stewards, and a finding that says \"a steward carries
        the Article 14 reporting duties\" without the two limits states the duty wider than the
        paragraph does. **What this gate does not carry, stated so nobody reads the quote as more
        than it is.** Article 14 itself is not quoted here - not 14(1), not 14(3), not 14(8) - so
        this gate says which paragraphs of Article 14 reach a steward and how far, and says nothing
        at all about what those paragraphs require. Article 24 is out of scope for this product's
        rule coverage, and Article 14 is a separate obligation this gate does not reach either."
    - quote: This Regulation does not apply to natural or legal persons who contribute with source code to
        products with digital elements qualifying as free and open-source software that are not
        under their responsibility.
      cite: CRA Recital 18 (contributors)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**A recital, and it is the only place the Regulation says this** - Article 2's scope
        exclusions do not mention contributors, so this route out rests on confirming support rather
        than on an operative exclusion. Say it that way round: the party is not a manufacturer under
        Article 3(13) and is not deemed one under Article 21 or Article 22, so Article 13(18) does
        not speak to it, and this sentence confirms that reading. **There are two conditions and
        this passage named one until 2026-08-05.** The sentence reaches persons who contribute
        source code to \"products with digital elements **qualifying as free and open-source
        software** that are not under their responsibility\", so the products must qualify as free
        and open-source software as well as being outside the contributor's responsibility; naming
        only the second widened a route out to a contributor to proprietary software, where the
        sentence gives none. The same phrase was restored to
        `contributor-to-software-not-under-their-responsibility`'s question on the same date, and to
        this gate's top-level `question` on 2026-08-05 in a second round, after an independent check
        found the contributor role still glossed there as \"a contributor to software that is not
        under their responsibility\" - a third field holding a second rule for one phrase, which is
        exactly the reason the phrase was restored in the first place. All three now state one rule.
        On the second condition: a person who maintains the project, decides what ships and puts
        their name to it is not a contributor in this sense, however much of the code somebody else
        wrote. **The cite carries a parenthetical because this gate quotes Recital 18 twice**, and
        two supporting quotes with the same cite make `quote_ref` unresolvable - a printed report
        could show a limb backed by a sentence that does not support it. The other passage is cited
        as \"CRA Recital 18 (free and open-source software and commercial activity)\"."
    - quote: This Regulation applies to economic operators only in relation to products with digital
        elements made available on the market, hence supplied for distribution or use on the Union
        market in the course of a commercial activity. Supply in the course of a commercial activity
        might be characterised not only by charging a price for a product with digital elements, but
        also by charging a price for technical support services where this does not serve only the
        recuperation of actual costs, by an intention to monetise, for instance by providing a
        software platform through which the manufacturer monetises other services, by requiring as a
        condition for use the processing of personal data for reasons other than exclusively for
        improving the security, compatibility or interoperability of the software, or by accepting
        donations exceeding the costs associated with the design, development and provision of a
        product with digital elements. Accepting donations without the intention of making a profit
        should not be considered to be a commercial activity.
      cite: CRA Recital 15
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The characterisations Recital 15 gives for the commercial-activity limb, non-exhaustively,
        and confined to no kind of software.** It names **five**, and the
        `cra-product-information-13-8` checklist gave limbs to only the first and the fourth until
        2026-07-29: charging a price for the product; charging a price for technical support
        services where that does not serve only the recuperation of actual costs; an intention to
        monetise, for instance a platform through which the manufacturer monetises other services;
        requiring the processing of personal data as a condition for use for reasons other than
        exclusively for improving the security, compatibility or interoperability of the software;
        and accepting donations exceeding the costs associated with design, development and
        provision. **All five now have a limb, and the five are not a closed set**: the Recital says
        supply \"might be characterised\" by them, so none of them met leaves
        `in-the-course-of-a-commercial-activity` open rather than settling it \"no\". Any one of
        them met is answered \"yes\" on that limb, which is that limb's own choice in the
        over-including direction and not something these words compel - the Recital's next sentence
        and Recital 16 each give a case where a characterisation is met and the supply is not
        commercial on that ground alone. **This passage called the five \"the positive test\" until
        2026-08-05**, which presented an illustrative list as an exhaustive one. The three that were
        missing are routes that bring a project **in**, so their absence under-included - a
        paid-support-only or donation-funded project, which is an extremely common open-source shape
        and this product's declared audience, reached the commercial-activity limb with no limb able
        to establish it. The Recital also states its own negative: a donation accepted without the
        intention of making a profit is not a commercial activity. Read it against Article 3(22),
        which says a supply free of charge is not outside **on that ground alone** - a different
        statement from \"every free supply is inside\"."
    - quote: Products with digital elements provided as part of the delivery of a service for which a fee
        is charged solely to recover the actual costs directly related to the operation of that
        service, such as may be the case with certain products with digital elements provided by
        public administration entities, should not be considered on those grounds alone to be a
        commercial activity for the purposes of this Regulation. Furthermore, products with digital
        elements which are developed or modified by a public administration entity exclusively for
        its own use should not be considered to be made available on the market within the meaning
        of this Regulation.
      cite: CRA Recital 16
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Two sentences and two different propositions, and the `cra-product-information-13-8`
        checklist quoted only the first until 2026-07-29.** The first is the cost-recovery limit on
        the Recital 15 test, and it has two elements rather than one: the product must be **provided
        as part of the delivery of a service**, and the fee must be charged **solely to recover the
        actual costs directly related to the operation of that service**. **This passage stated the
        second element without the first until 2026-08-05**, which reads the sentence onto any
        cost-recovery fee where the Recital reaches only a fee for the service the product is
        delivered as part of. It is then qualified by \"on those grounds alone\": such a fee does
        not make the supply commercial on that ground alone, and it does not put the supply outside
        either, where some other Recital 15 signal is met. The second sentence is stronger and
        unqualified, and it goes not to commercial activity but to making available on the market at
        all: a product developed or modified by a public administration entity exclusively for its
        own use is not made available on the market. Public-sector internal tooling published openly
        is a real shape in this product's audience, and it now has its own limb."
    - quote: (48) 'free and open-source software' means software the source code of which is openly shared
        and which is made available under a free and open-source licence which provides for all
        rights to make it freely accessible, usable, modifiable and redistributable;
      cite: CRA Art. 3(48)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Added 2026-08-04. \"Free and open-source software\" is a defined term of Article 3, and this
        gate tested it against Recital 18 alone** - the same defect that had been corrected in the
        `cra-product-information-13-8` checklist four times in one day for Article 22(1), Article
        3(16), Article 3(17) and Article 3(13), one term further along. The two formulations barely
        differ, which is why this was a gap and not a misstatement. Recital 18 says free and
        open-source software is \"understood as software the source code of which is openly shared
        and **the licensing of which** provides for all rights...\"; the article says the software
        must be \"**made available under a free and open-source licence which** provides for all
        rights...\". The article's words govern, and they are the ones the limbs now cite first.
        **It is a licence test, not a development-model test.** Two cumulative elements: the source
        code is openly shared, and the licence grants all rights to make the software freely
        accessible, usable, modifiable and redistributable. Source that is readable but not
        redistributable meets the first and fails the second. **Qualifying as free and open-source
        software does not by itself put a product outside this Regulation.** The routes out that
        turn on the software being free and open-source run through the commercial-activity element
        of Article 3(22), which is what Recital 18 supplies. **This sentence said \"the routes out\"
        with no such qualifier until 2026-08-05, and those are not the only ones**: Article 2(2),
        2(4), 2(6) and 2(7) take a product out by what it is, what it was built for, or which other
        instrument covers it, and Article 2(3) takes it out by something a party **does** - it
        applies to products \"that have been **certified in accordance with** Regulation (EU)
        2018/1139\", so a product within that Regulation's reach which has not been certified under
        it is not taken out by Article 2(3) at all. None of the five says anything about licensing.
        **This sentence sorted Article 2(3) with the covered-by-another-instrument paragraphs until
        2026-08-05**, which is the collapse `regulation-2019-2144-motor-vehicles-applies` states the
        rule against - stating an exclusion wider than the Regulation does is the dangerous
        direction on Article 2 - and the operative limb
        `certified-under-regulation-2018-1139-civil-aviation` asked the certification question
        correctly throughout, so the error was in this account and never in what a reader is asked.
        Beyond Article 2, Article 2(1)'s own data-connection condition leaves a product outside
        where it is not met, and Recital 16 puts a public administration entity's own-use
        development outside the **making available** element rather than the commercial-activity
        one. Each of those is quoted earlier in this same list and carries a limb of its own, so
        reading this sentence as the whole account would keep a product in scope that Article 2 puts
        out. This quote is added to the three limbs that test the defined term itself -
        `product-is-free-and-open-source-software` and the two exemptions built on it - and not to
        the limbs about components, monetisation or not-for-profit development, which are built on
        the defined term rather than testing it. **`not-for-profit-development` gained a
        free-and-open-source element on 2026-08-05, and this sentence was written before it did.**
        That limb's question now names the term, so a reader adjudicating it meets a defined term
        whose definition is not cited beside it. The element is recorded by cross-reference rather
        than by a second citation: `limbs[21].note` sends the reader to
        `product-is-free-and-open-source-software` first, and that limb carries this quote. Settling
        a definition in one place and pointing at it from the others is the same choice this gate
        makes for the component and monetisation limbs, and it is what keeps one term from having
        two homes."
    - quote: Free and open-source software is understood as software the source code of which is openly
        shared and the licensing of which provides for all rights to make it freely accessible,
        usable, modifiable and redistributable. Free and open-source software is developed,
        maintained and distributed openly, including via online platforms. In relation to economic
        operators that fall within the scope of this Regulation, only free and open-source software
        made available on the market, and therefore supplied for distribution or use in the course
        of a commercial activity, should fall within the scope of this Regulation. The mere
        circumstances under which the product with digital elements has been developed, or how the
        development has been financed, should therefore not be taken into account when determining
        the commercial or non-commercial nature of that activity. More specifically, for the
        purposes of this Regulation and in relation to the economic operators that fall within its
        scope, to ensure that there is a clear distinction between the development and supply
        phases, the provision of products with digital elements qualifying as free and open-source
        software that are not monetised by their manufacturers should not be considered to be a
        commercial activity. Furthermore, the supply of products with digital elements qualifying as
        free and open-source software components intended for integration by other manufacturers
        into their own products with digital elements should be considered to be making available on
        the market only if the component is monetised by its original manufacturer. For instance,
        the mere fact that an open-source software product with digital elements receives financial
        support from manufacturers or that manufacturers contribute to the development of such a
        product should not in itself determine that the activity is of commercial nature. In
        addition, the mere presence of regular releases should not in itself lead to the conclusion
        that a product with digital elements is supplied in the course of a commercial activity.
        Finally, for the purposes of this Regulation, the development of products with digital
        elements qualifying as free and open-source software by not-for-profit organisations should
        not be considered to be a commercial activity provided that the organisation is set up in
        such a way that ensures that all earnings after costs are used to achieve not-for-profit
        objectives.
      cite: CRA Recital 18 (free and open-source software and commercial activity)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Quoted to the end of the Recital's commercial-activity passage on 2026-07-29, and the
        extension added four operative propositions the file had been silent about.** The earlier
        quote began at the third sentence and stopped at the fifth, which carried the not-monetised
        carve-out and nothing else. In order, what the whole passage says. (a) Free and open-source
        software is defined here: source openly shared, licence granting all rights to make it
        freely accessible, usable, modifiable and redistributable. (b) It is \"developed, maintained
        and distributed openly, including via online platforms\" - the sentence to cite for the
        proposition that open development and open publication are the ordinary condition of free
        and open-source software, and **not** for the proposition that publishing is therefore not
        an act of supply. **This passage offered it for the second until 2026-08-05**, and the
        sentence will not carry it: its own verb is \"distributed\", and Article 3(22) defines
        making available as the supply of a product \"**for distribution** or use\". Recital 20's
        first sentence bears on the same question and is not confined to the platform: \"The sole
        act of hosting products with digital elements on open repositories, including through
        package managers or on collaboration platforms, does not in itself constitute the making
        available on the market of a product with digital elements\" names an act and no actor, and
        only its second sentence turns to \"Providers of such services\". **This passage said
        \"Recital 20 does not carry that proposition; it is about the hosting platform\" until
        2026-08-05**, which is the same absolute that `supporting_quotes[43].why` records as
        withdrawn on 2026-07-29 for overstating the recital in the opposite direction; how far the
        first sentence reaches a developer publishing their own package is the open question
        recorded there, not a settled no. (c) How the project was funded does not decide the
        commercial question, so a sponsorship page neither settles nor excludes it. (d) **Not being
        monetised excludes it only for free and open-source software**, and reading that carve-out
        as general was the `cra-product-information-13-8` checklist's own recorded error. For
        proprietary software the carve-out is not available at all. **What does not follow - and
        what the first correction of that error asserted before being corrected again the same day -
        is that proprietary software therefore always meets the limb.** (e) A free and open-source
        **component** intended for integration by other manufacturers is made available on the
        market **only if the component is monetised by its original manufacturer**. That is a
        further route out, and it is the route for the single most common open-source shape there
        is: the library. (f) **The mere presence of regular releases does not in itself show
        commercial activity** - which directly qualifies `release_automation`, the strongest fact
        the `distribution` collector emits, and appeared in no note of that file until 2026-07-29.
        (g) Development **of free and open-source software** by a not-for-profit organisation set up
        so that all earnings after costs go to not-for-profit objectives is not a commercial
        activity. The Recital confines this sentence, as it confines the two before it, to products
        with digital elements qualifying as free and open-source software, and this item dropped
        that element until 2026-08-05. It has a limb, `not-for-profit-development`, and that limb
        annotates rather than closing the gate. **This item called it \"a further route out\" until
        2026-08-05 and the limb was an exemption to match; both were corrected on that date.** The
        sentence is about the **development**, and the passage says in its own words that it is
        drawing a \"clear distinction between the development and supply phases\" - it is the fifth
        sentence, the not-monetised carve-out at (d), that is put on the supply side. Article 3(22)
        makes the **supply** the thing that has to be in the course of a commercial activity, so a
        not-for-profit constituted as the proviso requires that develops free and open-source
        software and then sells it, or sells support above cost, answers the limb truthfully \"yes\"
        while supplying commercially. A \"yes\" removes one ground for calling the supply commercial
        and leaves the others standing."
    - quote: "'making available on the market' means the supply of a product with digital elements for
        distribution or use on the Union market in the course of a commercial activity, whether in
        return for payment or free of charge;"
      cite: CRA Art. 3(22)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "The making-available limb, in the Regulation's own words, and it carries three separate
        conditions: supply **for distribution or use**, **on the Union market**, **in the course of
        a commercial activity**. Each has its own limb below. Note the final clause, \"whether in
        return for payment or free of charge\": a free download is not outside the Regulation on the
        ground that nobody paid; what decides the limb is whether the supply is in the course of a
        commercial activity. **That final clause was missing from this gate's own top-level
        `question` until 2026-08-05, where the gloss of Article 3(22) reproduced the definition in
        its own order and stopped at \"in the course of a commercial activity\".** It is the same
        omission that was corrected in `in-the-course-of-a-commercial-activity`'s `question` on the
        same date, and the top-level question is the sentence a reader holds in mind while walking
        every limb, so the maintainer of a product given away for nothing met \"commercial
        activity\" first with nothing beside it. One clause has one home: wherever this gate glosses
        Article 3(22)'s commercial-activity element in the definition's own order, the payment
        clause goes with it. Note also the words \"for distribution **or use**\". Supply for use is
        a route of its own, and nothing in the definition requires an artefact to leave the
        manufacturer's hands. **This gate reads that as reaching a service the manufacturer hosts**
        - giving somebody the use of software the manufacturer runs - which is the inclusive
        reading, chosen for the stated asymmetry reason, and not something Article 3(22) says in
        terms. **This passage stated it as the definition's own content until 2026-08-05** (\"it is
        what a hosted service is\"), which put a contested reading in the provision's mouth: the
        reading still needs the hosted thing to be a product with digital elements within Article
        3(1), and where a hosted component belongs to a product the instrument reaches it through
        Article 3(1)'s \"and its remote data processing solutions\" with Article 3(2), while Recital
        12 puts a cloud service designed and developed outside a manufacturer's responsibility
        outside this Regulation. `is-a-product-with-digital-elements` is where that is answered, and
        its \"no\" closes the gate, so a reader cannot skip it."
    - quote: The sole act of hosting products with digital elements on open repositories, including
        through package managers or on collaboration platforms, does not in itself constitute the
        making available on the market of a product with digital elements. Providers of such
        services should be considered to be distributors only if they make such software available
        on the market and hence supply it for distribution or use on the Union market in the course
        of a commercial activity.
      cite: CRA Recital 20
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Extended to both sentences on 2026-07-29, and the second sentence changes who the Recital is
        about.** Read alone, the first sentence looks like a qualifier on the supply limb for the
        party being scanned. The second sentence identifies the subject: \"Providers of such
        services\" - the operators of the open repositories, the package managers and the
        collaboration platforms. GitHub, npm and GitLab. The Recital answers whether a hosting
        platform becomes a distributor by hosting other people's software, and it says it does not
        unless it itself makes the software available on the market in the course of a commercial
        activity. **What follows for the developer who publishes their own package, stated as a
        reading and not as a settled fact.** the `cra-product-information-13-8` checklist applied
        the Recital to the party being scanned and used it to neutralise `publishable_package` as
        evidence on a limb that must be true for the Regulation to reach; the effect was to
        downgrade a met inclusion limb on the strength of a Recital about somebody else. That
        correction stands: a manufacturer's own `npm publish` step is the manufacturer's act, not
        the platform's. **But the correction was then written as the opposite absolute - \"it says
        nothing about the developer who publishes their own package\" - and that overstates it, so
        it was withdrawn on 2026-07-29.** The Recital's second sentence shows its operative concern
        is the platform; its first sentence states a proposition about an **act** (\"the sole act of
        hosting ... does not in itself constitute the making available on the market\") and names no
        actor. And the Regulation elsewhere plainly contemplates software that is published without
        being made available on the market: Recital 19, quoted below, opens on \"products with
        digital elements qualifying as free and open-source software that are published, but not
        made available on the market within the meaning of this Regulation\". So the reading this
        gate takes - `publishable_package` is evidence of supply and Recital 20 does not neutralise
        it - is the inclusive reading, chosen for the stated asymmetry reason, and a contestable
        one. It is recorded as a question on `hosting-on-an-open-repository-alone`, not as a settled
        reading. For the proposition that merely putting source on a public forge need not amount to
        making available on the market, what bears on it is Recital 20's first sentence above -
        whose reach beyond the platform is the open question this limb records - together with
        Article 3(22)'s commercial-activity element, which is what usually decides. **This passage
        sent a reader to Recital 18 for that proposition until 2026-08-05**: \"free and open-source
        software is developed, maintained and distributed openly, including via online platforms\"
        describes the ordinary condition of open-source development, its own verb is
        \"distributed\", and it does not say that publishing is not supply."
    - quote: Taking into account the importance for cybersecurity of many products with digital elements
        qualifying as free and open-source software that are published, but not made available on
        the market within the meaning of this Regulation, legal persons who provide support on a
        sustained basis for the development of such products which are intended for commercial
        activities, and who play a main role in ensuring the viability of those products
        (open-source software stewards), should be subject to a light-touch and tailor-made
        regulatory regime. Open-source software stewards include certain foundations as well as
        entities that develop and publish free and open-source software in a business context,
        including not-for-profit entities. The regulatory regime should take account of their
        specific nature and compatibility with the type of obligations imposed. It should only cover
        products with digital elements qualifying as free and open-source software that are
        ultimately intended for commercial activities, such as for integration into commercial
        services or into monetised products with digital elements. For the purposes of that
        regulatory regime, an intention for integration into monetised products with digital
        elements includes cases where manufacturers that integrate a component into their own
        products with digital elements either contribute to the development of that component in a
        regular manner or provide regular financial assistance to ensure the continuity of a
        software product. The provision of sustained support to the development of a product with
        digital elements includes but is not limited to the hosting and managing of software
        development collaboration platforms, the hosting of source code or software, the governing
        or managing of products with digital elements qualifying as free and open-source software as
        well as the steering of the development of such products. Given that the light-touch and
        tailor-made regulatory regime does not subject those acting as open-source software stewards
        to the same obligations as those acting as manufacturers under this Regulation, they should
        not be permitted to affix the CE marking to the products with digital elements whose
        development they support.
      cite: CRA Recital 19
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Added 2026-07-29 to stop the `cra-product-information-13-8` checklist stating a contestable
        reading of Recital 20 as a fact.** The Recital's first words are the ones that matter here:
        it speaks of products qualifying as free and open-source software \"that are **published,
        but not made available on the market** within the meaning of this Regulation\". The
        Regulation therefore recognises a category of published software that is not made available
        on the market, which is why Recital 20's first sentence cannot be dismissed as having
        nothing to do with the developer who publishes their own package. It does not follow that
        publishing is never supply - the commercial-activity element in Article 3(22) is what
        usually decides - but the absolute that file previously stated does not follow either.
        Quoted whole rather than to its first sentence, because the rest of the recital is the
        steward regime and this gate has one limb resting on it. Two sentences bear on that limb
        directly. Stewards \"include certain foundations as well as entities that develop and
        publish free and open-source software in a business context, including not-for-profit
        entities\" - so a not-for-profit is not thereby outside Article 3(14). And the regime
        \"should only cover products with digital elements qualifying as free and open-source
        software that are ultimately intended for commercial activities\", which is Article 3(14)'s
        third element read in its intended breadth: integration into commercial services or into
        monetised products."
    - quote: Manufacturers shall ensure that products with digital elements are accompanied by the
        information and instructions to the user set out in Annex II, in paper or electronic form.
        Such information and instructions shall be provided in a language which can be easily
        understood by users and market surveillance authorities. They shall be clear,
        understandable, intelligible and legible. They shall allow for the secure installation,
        operation and use of products with digital elements. Manufacturers shall keep the
        information and instructions to the user set out in Annex II at the disposal of users and
        market surveillance authorities for at least 10 years after the product with digital
        elements has been placed on the market or for the support period, whichever is longer. Where
        such information and instructions are provided online, manufacturers shall ensure that they
        are accessible, user-friendly and available online for at least 10 years after the product
        with digital elements has been placed on the market or for the support period, whichever is
        longer.
      cite: CRA Art. 13(18)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: '**The provision that makes Annex II binding. It was quoted nowhere until 2026-07-29, and then
        quoted only as far as its third sentence.** The checklist that names this gate,
        `cra-product-information-13-8`, is named after Article 13(8), which is the support-period
        paragraph; nine of the ten items in the `cra-product-information-13-8` checklist cite "Annex
        II, point N" and had no operative article behind them. **The tenth, `art-13-8-five-years`,
        cites Article 13(8) itself and always did**, so it is the one item this correction was never
        about. A finding citing an annex with no duty attached is a citation a lawyer rejects. The
        quote now runs to the end of the paragraph, which is where the fourth, fifth and sixth
        sentences live: the information must **allow for the secure installation, operation and use
        of the product**; the manufacturer must **keep it at the disposal of users and market
        surveillance authorities**; and where it is provided online it must be **accessible,
        user-friendly and available online**. **Both of the periods are the same and this passage
        compressed them to "the ten-year or support period" until 2026-08-05**, which loses the
        floor and the tie-breaker: the paragraph says "for **at least** 10 years after the product
        with digital elements has been placed on the market or for the support period, **whichever
        is longer**", so a manufacturer with a three-year support period owes ten years and not
        three. The fifth sentence was not named here at all before that date, although it is a duty
        of its own rather than a gloss on the sixth. The `scope_note` of
        `cra-product-information-13-8` - a field this gate does not have - now declares all five of
        the requirements that checklist does not ask about; it declared three, and asserted that
        three was the number, until this quote was read to its end.'
    - quote: Manufacturers shall ensure that the end date of the support period referred to in paragraph
        8, including at least the month and the year, is clearly and understandably specified at the
        time of purchase in an easily accessible manner and, where applicable, on the product with
        digital elements, its packaging or by digital means. Where technically feasible in light of
        the nature of the product with digital elements, manufacturers shall display a notification
        to users informing them that their product with digital elements has reached the end of its
        support period.
      cite: CRA Art. 13(19)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The duty to state the support period's end date, which the `scope_note` of the
        `cra-product-information-13-8` checklist attributed to Article 13(8) until 2026-07-29.**
        Article 13(8) requires the manufacturer to determine a support period and sets the five-year
        floor. **That floor has an exception in its own subparagraph, and this sentence stated it
        bare until 2026-08-05**: \"Without prejudice to the second subparagraph, the support period
        shall be at least five years. Where the product with digital elements is expected to be in
        use for less than five years, the support period shall correspond to the expected use
        time.\" So five years is not owed by a product expected to be in use for less than five, and
        the opening words subordinate the floor to the second subparagraph's duty to determine the
        period by expected use in the first place. What Article 13(8) does not do is say anything
        about telling anybody **what the period is**. Its own fifth subparagraph does impose a
        recording duty, and the two are not the same duty: it requires \"the information that was
        taken into account to determine the support period\" to go into the technical documentation
        as set out in Annex VII - the inputs to the decision, into a document, not the end date, to
        a user. The `scope_note` of the `cra-product-information-13-8` checklist names that fifth
        subparagraph, and this sentence is phrased to sit beside it rather than against it; **the
        two were written against each other on 2026-08-05**, one saying Article 13(8) says nothing
        about telling anybody and the other that a universal negative about it is refuted by that
        subparagraph, with neither naming its object. The statement duties are here and in Annex II
        point 7: Article 13(19) requires the end date, including at least the month and the year, to
        be specified clearly and understandably **at the time of purchase in an easily accessible
        manner and, where applicable, on the product with digital elements, its packaging or by
        digital means** - the paragraph does not stop at the point of purchase, and this sentence
        did until 2026-08-05, which left a reader checking the point of purchase alone and not the
        conditional alternatives. **The structure is one unconditional locus plus, where applicable,
        a choice of three, and not four cumulative places**: specifying the end date at the time of
        purchase in an easily accessible manner is owed always, and the product, its packaging and
        digital means are joined by \"or\" behind \"where applicable\", so any one of them answers
        that half wherever the condition is met. **This passage said the earlier sentence \"left a
        reader checking one place out of four\" until 2026-08-05**, which read a conditional
        disjunction as a cumulative list - the tolerated direction, and still not the provision's
        own scope - and Annex II point 7 requires the type of technical security support and the end
        date in the accompanying information. That checklist's scope declaration named the wrong
        provision for the duty it opens by describing. Quoted to the end of the paragraph, which has
        a second subparagraph the first reading dropped: where technically feasible, the
        manufacturer must display a **notification to users that the support period has ended**.
        That is a duty about the product's own behaviour, not about a document, and no item of that
        checklist asks about it. Declared here rather than left silent."
    - quote: 2. This Regulation shall apply from 11 December 2027. However, Article 14 shall apply from 11
        September 2026 and Chapter IV (Articles 35 to 51) shall apply from 11 June 2026.
      cite: CRA Art. 71(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**The date this gate and the checklist that names it, `cra-product-information-13-8`, have
        asserted in prose since that prose was written, quoted for the first time on 2026-08-04.**
        Three passages stated \"the Regulation applies from 11 December 2027\" with no provision
        behind it - the timing limb's note and the `when_unresolved` passage, both in this gate, and
        one item's `applicability_note` in the `cra-product-information-13-8` checklist. The number
        itself was never floating free, because the Article 69(2) quote below contains the words
        \"before 11 December 2027\", but the proposition that the Regulation *applies from* that
        date rested on nothing either file carried. **Article 71(2) and Article 69(2) answer
        different questions and both are needed.** Article 71(2) fixes when the Regulation begins to
        apply at all. Article 69(2) fixes what happens to a product that was already on the market
        when it did. A finding that gives only the first tells a released product a date that is
        wrong for it. **The two exception dates are quoted although neither reaches that
        checklist**, so that a reader is not left to assume 11 December 2027 is the only date in the
        instrument: Article 14 applies from 11 September 2026 and Chapter IV (Articles 35 to 51)
        from 11 June 2026. Article 13 is in neither exception, so every item of that checklist takes
        the general date. **No limb rests on this quote, and that is a decision rather than an
        omission.** A limb asks a question about the product that a person can answer; the date the
        Regulation begins to apply is the same for every product and every party, and turns only on
        the day the scan runs. What it changes is how a finding must be worded - as preparation for
        the duties that apply from 11 December 2027, and as a present duty for Article 14, which
        applies from 11 September 2026 - which is prose, and it is stated on the timing limb
        `placed-on-the-market-before-11-december-2027`, in `when_unresolved` - both in this gate -
        and on the item of the `cra-product-information-13-8` checklist that turns on it."
    - quote: Products with digital elements that have been placed on the market before 11 December 2027
        shall be subject to the requirements set out in this Regulation only if, from that date,
        those products are subject to a substantial modification.
      cite: CRA Art. 69(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The transitional rule, and it changes what a finding of the three checklists whose duties
        apply from 11 December 2027 means** (`cra-product-information-13-8`,
        `cra-sbom-annex-i-ii-1`, `cra-annex3-important-products`). For standalone software already
        released, nothing starts on 11 December 2027: the requirements attach only from a
        substantial modification made on or after that date, or to a new product or variant first
        released from it. For hardware it is the other way: placing on the market is per unit
        (Recital 38), so every unit placed from 11 December 2027 must comply, whatever the model's
        age. Saying \"the duty applies from 11 December 2027\" without this tells a software
        developer a date that is wrong for their product. **Article 69(3) takes Article 14 out of
        this rule**, so the fourth checklist naming this gate, `cra-reporting-readiness-14`, applies
        today to products already on the market, and this paragraph does not reach it. This passage
        said until 2026-11-11 that \"almost every project scanned today is already on the market, so
        for it nothing starts on 11 December 2027\", which was wrong for hardware units and was read
        beside the Article 14 checklist (checker L, D3 and D4)."
    - quote: "At minimum, the product with digital elements shall be accompanied by:"
      cite: CRA Annex II
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-28
      why: The chapeau of the list that the items of the `cra-product-information-13-8` checklist walk. It
        was this gate's only quote until 2026-07-28, which meant the gate quoted the duty and left
        every part of its own test - product with digital elements, data connection, commercial
        activity, the open-source position - as unchecked prose.
  limbs:
    - id: is-a-product-with-digital-elements
      question: Is what this repository contains a software or hardware product within Article 3(1),
        counting its remote data processing solutions and counting a component - software or
        hardware intended for integration into an electronic information system - that is being
        placed on the market separately - but not counting software that runs on your own servers
        and that people only reach remotely - in a web browser, including a web application or
        progressive web app whose code runs in the browser, or through an API - which is not a
        product on that basis alone (Recitals 11 and 12; the Commission's guidance, paragraph 21)
        unless it is the remote data processing solution of a product you supply (Article 3(2)) or
        is supplied for local execution (the guidance, paragraph 20)?
      decided_by: either
      closes_gate_when: "false"
      quote_ref:
        - CRA Art. 2(1)
        - CRA Art. 3(1)
        - CRA Art. 3(4)
        - CRA Art. 3(6)
      declared_by: cra.product_with_digital_elements
      declared_answers:
        - true
        - false
      evidence_categories:
        - distribution
      code_evidence:
        supports:
          - publishable_package
          - command_line_entry_point
          - mobile_app_bundle
          - browser_extension
          - desktop_installer
          - release_automation
          - release_documented
        neutral:
          - marked_not_published
          - installable_web_client
      note: "**A fact about the product, which the code suggests and never settles (2026-11-10).** Whether
        what the repository holds is a product within Article 3(1) is answered by the person or
        stated in their declared documents (the standing rule: a fact about the product is asked of
        the person or read from their declared documents, and code may corroborate or contradict it
        but never decide it); the kinds in `code_evidence` are printed beside the question as what
        the code suggests. **A characterisation question, not a supply question.** The word
        \"ships\" was removed on 2026-07-29: it merged this limb with
        `supplied-for-distribution-or-use`, which asks about supply and asks it separately. Article
        3(1)'s main clause contains no supply element: a product with digital elements is \"a
        software or hardware product and its remote data processing solutions\", and nothing has to
        be supplied to anybody for that to be true of it. **This sentence read \"Article 3(1)
        contains no supply element\" flat until 2026-08-05, and the definition's own \"including\"
        limb carries one** - it extends to \"software or hardware components **being placed on the
        market separately**\", so that extension is conditional on a placing on the market, as two
        later paragraphs of this same note already said. The supply question itself belongs to
        `supplied-for-distribution-or-use` and is asked there. Read with Article 3(4) - software is
        the part of an electronic information system which consists of computer code - this gate
        treated any repository containing computer code as meeting the limb. That was an inclusive
        reading and not a compelled one: Article 3(1) says \"product\" and Article 3(4) defines
        \"software\", so the step from one to the other is a choice, made for the reason given on
        the Article 3(1) quote above. **Software that runs only on the manufacturer's servers and is
        reached through a browser is not a product on that basis alone, and this gate said otherwise
        until 2026-11-11 (checker L, D2).** Recital 11 brings processing at a distance into the
        scope \"only in so far as it is necessary for a product with digital elements to perform its
        functions\", and Recital 12 says that \"websites that do not support the functionality of a
        product with digital elements, or cloud services designed and developed outside the
        responsibility of a manufacturer of a product with digital elements do not fall within the
        scope of this Regulation\", routing cloud computing services such as Software as a Service
        to Directive (EU) 2022/2555. The Commission's guidance on the application of the Regulation,
        C(2026) 5252 final of 27.7.2026, Annex,
        https://ec.europa.eu/newsroom/dae/redirection/document/131456, read 2026-11-11 - the
        Commission's reading of the recitals, not the text, approved as the content of a draft
        Communication whose formal adoption is not established, reads them so: software is a product
        where it is \"provided to a user, obtained by that user and operated on, or as part of, an
        electronic information system on the user's side\" (paragraph 20), while \"software that
        executes remotely and is merely accessed by the user is not, on that basis alone, a product
        with digital elements\", which \"is typically the case for web applications, including
        progressive web apps, where they are accessed exclusively through a web browser\" (paragraph
        21; Example 5). The hosted part of a product the manufacturer does supply is inside, as that
        product's remote data processing solution (Article 3(2)). The question now says both halves.
        Since 2026-11-10 the code only suggests this limb, and its kinds - a dependency, a call
        site, a URL - are as present in a hosted web application as in one that is shipped, so they
        suggest that the repository holds software and say nothing about which side of that line it
        falls on; the person answers. **The evidence now matches the question the limb states, which
        it did not until 2026-07-29.** The kinds were byte-identical to
        `supplied-for-distribution-or-use`'s, so a limb whose note insists it is not a supply
        question was evidenced by nothing except supply artefacts, and the two required limbs held
        the same state on every tree ever measured - one of the five required limbs contributing
        nothing to the verdict. Four code-existence kinds were added: `dependency`, `outbound_call`,
        `url_literal` and `host_literal`. Any one of them is a trace of computer code in the tree,
        which is what Article 3(4) asks about, and none of them is a supply artefact. **That is the
        difference between this list and the supply limb's: the artefact kinds are shared because a
        published artefact is evidence of a product and of supply alike, and the code-existence
        kinds are here only, because code in a tree says nothing about whether anything is
        supplied.** **But that comparison is with the wrong limb, and the right one has to be stated
        here rather than left for a reader to derive.** This limb's evidence set **strictly
        contains** `data-connection-in-intended-purpose-or-foreseeable-use`'s: that limb's four
        kinds are `outbound_call`, `host_literal`, `url_literal` and `dependency`, and all four are
        in this list. So this limb is `supported` whenever that one is, and it can never be the limb
        that holds the verdict back on its own - the symptom the four code-existence kinds were
        added to cure against the supply limb, recreated against the data-connection limb by the
        same change. Measured 2026-07-29 on eight real trees: both limbs `supported` on all eight,
        this limb's fact set a superset every time, and **the first evidence a reader is shown for
        the two limbs is the identical fact on all eight** , and on one of the eight the two sets
        are not merely nested but equal, because that tree emits no distribution fact at all. So a
        reader must not read two `supported` limbs here as two independent confirmations; on most
        trees they are one fact counted twice, under two questions that happen to share it. Neither
        list is narrowed to fix this. The overlap is real - a dependency with a call site genuinely
        evidences both that the repository contains computer code and that it talks to a network -
        and dropping a kind from either limb to make the two independent would remove evidence
        rather than describe it. **The artefact kinds are a limit of the evidence, not of the
        definition, but the limit is narrower than this note used to claim.** It said \"a library,
        an SDK, a server or a framework emits none of them\". That is false for most libraries:
        `publishable_package` reads package.json, Cargo.toml, composer.json, go.mod, pyproject.toml,
        setup.py and `*.gemspec`, so a packaged JavaScript, Rust, PHP, Go, Python or Ruby library
        emits a distribution fact on sight. The shapes that genuinely emit no distribution fact are
        the ones with no supported manifest: a Maven or Gradle library, a bare server tree, a
        vendored component. Article 3(1) expressly reaches \"software or hardware components being
        placed on the market separately\", and Article 3(6) says a component is software **or
        hardware** intended for integration into an electronic information system. **The question
        dropped six of Article 3(1)'s words until 2026-08-04, and the note two paragraphs above had
        them right the whole time.** It read \"counting a component intended for integration into
        somebody else's system\", which is Article 3(6)'s definition of *component* standing in for
        Article 3(1)'s condition. Article 3(1) does not reach every component: it reaches \"software
        or hardware components **being placed on the market separately**\". One field of this limb
        therefore contradicted two others, in the over-inclusive direction, and the words are
        restored. **The gloss of *component* itself was narrower than Article 3(6) until
        2026-08-05.** It read \"software intended for integration into somebody else's system\",
        where Article 3(6) defines a component as \"software **or hardware** intended for
        integration into an electronic information system\". Dropping hardware narrowed a definition
        on a limb whose \"false\" closes the gate, which is the under-inclusive direction. The
        paragraph immediately above and `component-intended-for-integration-by-other-manufacturers`
        both carried the full definition while the question did not. The definition's own words are
        now in the question. **So an unresolved answer here is not a \"no\".** The limb carries no
        `opposes` kinds at all, deliberately, so the evaluator can never read it as `opposed` and
        the gate can never be closed by the silence of a collector. The product-versus-service
        framing is unsafe in one direction and Article 3(1) is why: a shipped client whose functions
        do not work without the provider's own backend does not become a service because the backend
        is hosted. In the other direction it holds: a service that backs no product the provider
        supplies is not made a product by being software."
    - id: remote-processing-built-by-or-for-the-manufacturer
      question: Does this product have data processing at a distance for which the software is designed
        and developed by the manufacturer, or under the manufacturer's responsibility?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 3(1)
        - CRA Art. 3(2)
        - CRA Recital 11
        - CRA Recital 12
      note: "First of the two cumulative conditions in Article 3(2). **Reworded on 2026-07-29 so that the
        question is self-contained.** It used to read \"Is **the** hosted component's software
        designed and developed by the manufacturer\", and the definite article presupposed that a
        hosted component had already been identified - by a limb that does not exist. Nothing in
        this gate asks whether a hosted component exists at all, so the existence question is folded
        into this one: a product with no data processing at a distance answers \"no\" here, and that
        costs it nothing, because this limb is annotation-only. A third-party API the product merely
        calls is not this. Recital 12 draws the line in both directions: its worked example of what
        is inside is a cloud enabled functionality provided by a manufacturer \"of smart home
        devices that enable users to control the device at a distance\"; what it puts outside is a
        cloud service designed and developed **outside** the responsibility of a manufacturer of a
        product with digital elements, **or a website that does not support the functionality of
        such a product**. **This sentence gave the inside half as an unconditional rule about any
        manufacturer-provided cloud functionality, and dropped the website branch of the outside
        half, until 2026-08-05.** The recital conditions itself in its first sentence - cloud
        solutions are remote data processing solutions \"only if they meet the definition laid down
        in this Regulation\" - so Article 3(2), whose first condition this limb is, stays the test
        and the recital illustrates it rather than replacing it. **Recital 11 draws the other
        boundary, and it was cited nowhere in this gate until 2026-08-04.** Processing at a distance
        is inside the scope \"only in so far as it is necessary for a product with digital elements
        to perform its functions\", and the requirements do not entail measures aiming to manage the
        risks to the security of the manufacturer's network and information systems **as a whole**.
        So a \"yes\" here draws in the hosted component the product needs, and it does not draw in
        everything else the manufacturer runs. **No fact kind states who a hosted backend belongs
        to.** The `recipients` collector emits every outbound host, which is where a reader begins -
        an outbound host whose server code sits in the same tree is the ordinary shape of an own
        backend - but no collector can say that a host belongs to the party being scanned, so this
        limb declares no evidence category: the tree suggests; the person or their documents answer,
        and an unanswered limb is asked."
    - id: remote-processing-absence-would-prevent-a-function
      question: Would the absence of that data processing at a distance prevent the product from
        performing one of its functions?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 3(2)
        - CRA Recital 11
        - CRA Recital 12
      note: "Second of the two cumulative conditions, kept separate so a reader can see whether the answer
        failed on ownership or on dependence. Article 3(2) asks only whether **one** function would
        fail, so a product that also runs without the hosted component still meets this limb if any
        single function does not. No fact kind bears on it: the tree suggests; the person or their
        documents answer, and an unanswered limb is asked. **Recital 11 states the same condition as
        a limit and is cited here as of 2026-08-04**: processing or storage at a distance is inside
        the scope \"only in so far as it is necessary for a product with digital elements to perform
        its functions\". The recital's worked example is this limb's ordinary case - a mobile
        application that requires access to an application programming interface or a database
        provided by a service the manufacturer developed."
    - id: data-connection-in-intended-purpose-or-foreseeable-use
      question: Does the intended purpose or reasonably foreseeable use include a direct or indirect
        logical or physical data connection to a device or network?
      decided_by: either
      closes_gate_when: "false"
      quote_ref:
        - CRA Art. 2(1)
        - CRA Art. 3(8)
        - CRA Art. 3(9)
        - CRA Art. 3(10)
        - CRA Art. 3(23)
        - CRA Art. 3(24)
      declared_by: cra.data_connection
      declared_answers:
        - true
        - false
      evidence_categories:
        - recipients
      code_evidence:
        supports:
          - outbound_call
          - host_literal
          - url_literal
          - dependency
      note: "**A fact about the product, which the code suggests and never settles (2026-11-10).** The
        intended purpose and the reasonably foreseeable use are the product's: a call site shows
        that code in the repository can open a connection, not that this code is part of what is
        made available or how the product is used. So the person answers the limb (the standing
        rule: a fact about the product is asked of the person or read from their declared documents,
        and code may corroborate or contradict it but never decide it), and the kinds in
        `code_evidence` are printed beside the question as what the code suggests. Almost anything
        that fetches, syncs, updates itself or talks to an API meets this. **Two tiers of evidence,
        and they are named here because the weaker tier is kept deliberately.** `outbound_call` and
        `host_literal` bear directly. `url_literal` and `dependency` do not always: an XML
        namespace, an SPDX licence URL, a documentation link in a comment or a schema `$id` is a URL
        that is not a request target, and a lockfile row for a string-padding library is a
        dependency with no call site. They stay because the alternative is worse in the direction
        that matters: a dependency with a call site is often the only visible trace of a network
        path, and dropping the kind would make that path unreachable, while an over-read produces a
        candidate a reader dismisses in one line. Article 3(23) and Article 3(24) are quoted so a
        reader can see what the limb is really asking, and **this passage carried only the first of
        the two until 2026-08-05.** Article 2(1) reads them in the disjunctive and they are not the
        same fact. Article 3(23)'s **intended purpose** is what the manufacturer says the product is
        for - \"including the specific context and conditions of use\", as specified in the
        instructions for use, promotional or sales materials **and statements**, as well as in the
        technical documentation. Article 3(24)'s **reasonably foreseeable use** is expressly the
        branch that is \"not necessarily the intended purpose supplied by the manufacturer\", but is
        \"likely to result from reasonably foreseeable human behaviour or technical operations or
        interactions\". So a product whose own documentation never mentions a network still meets
        this limb where a connection is a reasonably foreseeable use of it, and a reader told to
        look only at the manufacturer's own documents answers \"no\" on a limb whose \"no\" closes
        the gate and drops every item of the checklist. Both are facts about the product rather than
        about its source text, which is why the limb is `either` and not `code`. **The three
        definitions of the connection itself were carried nowhere until 2026-08-04**, so a reader
        asked whether a build-time dependency is an indirect connection had the question and no
        text. Article 3(8): a **logical connection** is a virtual representation of a data
        connection implemented through a software interface. Article 3(9): a **physical connection**
        is implemented by physical means, including wires and radio waves. Article 3(10): an
        **indirect connection** is one that does not take place directly \"but rather as part of a
        larger system that is directly connectable to such device or network\" - which is how a
        library that opens no socket of its own is still within Article 2(1). All three widen the
        test rather than narrow it, and none of them defines \"device or network\", which Article
        2(1) uses and Article 3 leaves undefined. **The claim that this limb puts a strictly offline
        utility outside the Regulation has been withdrawn.** It cannot: the limb declares no
        `opposes` kinds, and no census fact can say \"this collector ran over N files and found
        nothing\", so the evaluator can only ever report this limb as `supported` or `unresolved`.
        The offline case is real and this gate cannot express it; saying otherwise described a route
        out that does not exist."
    - id: supplied-for-distribution-or-use
      question: Is the product supplied for distribution or use - for example made available for users or
        customers to download, install or run on their own side, or sold or given away as a device
        (whether software that runs only on your own servers is a product at all is the product
        question)?
      decided_by: either
      closes_gate_when: "false"
      quote_ref:
        - CRA Art. 3(22)
        - CRA Recital 18 (free and open-source software and commercial activity)
      declared_by: cra.supplied_for_distribution_or_use
      declared_answers:
        - true
        - false
      evidence_categories:
        - distribution
      code_evidence:
        supports:
          - release_automation
          - release_documented
          - publishable_package
          - command_line_entry_point
          - mobile_app_bundle
          - browser_extension
          - installable_web_client
          - desktop_installer
        neutral:
          - marked_not_published
      note: "**A fact about the product, which the code suggests and never settles (2026-11-10).** Whether
        anything is supplied, and how, is a fact about the business: a manifest or a release step
        shows how the code could be shipped, not that it is. So the person answers the limb (the
        standing rule: a fact about the product is asked of the person or read from their declared
        documents, and code may corroborate or contradict it but never decide it), and the kinds in
        `code_evidence` are printed beside the question as what the code suggests. **The counting
        rule this question carried is withdrawn (2026-11-11, checker L, D2).** From 2026-08-05 the
        question told a reader to count \"the giving of access to software the manufacturer hosts\"
        as supply for use, a rule this gate adopted \"on the ground that the other reading would put
        a hosted-only service outside the Regulation entirely, which is neither what Article 3(22)
        says nor what Article 3(1) contemplates\". That ground was wrong: Recital 12 puts websites
        that do not support a product's functionality and cloud services designed and developed
        outside a manufacturer's responsibility outside the Regulation and routes Software as a
        Service to Directive (EU) 2022/2555, and Recital 11 brings processing at a distance in only
        as far as a product needs it. The Commission's guidance on the application of the Regulation
        (C(2026) 5252 final of 27.7.2026, Annex, paragraphs 20 and 21 and Example 5,
        https://ec.europa.eu/newsroom/dae/redirection/document/131456, read 2026-11-11; the
        Commission's reading of the recitals, not the text, and not established as formally adopted)
        reads a web application reached only through a browser as not a product with digital
        elements unless it supports the functionality of one. So a small team running its own web
        application was asked a question that pointed it toward yes on the law it is most likely to
        be outside of. Whether hosted software is a product is now asked on
        `is-a-product-with-digital-elements`, in those terms; this limb asks only whether a product
        is supplied. **`marked_not_published` was removed from `opposes` on 2026-07-29, and this
        limb now carries no counter-evidence at all.** npm's `private` flag is a
        registry-publication guard in one package manager's tooling; it is not a statement about
        supply for distribution or use. A package marked private is routinely still supplied - as a
        monorepo application deployed to users, as a git or tarball dependency, as an artefact in a
        private registry, or as a container image. The `distribution` collector says so about itself
        in terms. Measured consequences of the earlier wiring: in every monorepo the limb landed on
        `contested` (32 supporting facts against 5 private manifests, in one case), so the verdict
        could never rise above `likely-applies`; and where a tree had one private root manifest and
        nothing else the limb read `opposed` and switched the whole instrument off - which is how a
        template documenting two distribution routes on adjacent README lines was reported as
        outside the Regulation on the strength of one line of one manifest. **What counts.** A
        **package manifest that is not marked unpublishable**, a release step that runs, an
        installer, a mobile bundle, a browser extension, a command-line entry point in a manifest, a
        browser-installable client - a web application manifest declaring `display: standalone` or
        `fullscreen`, a service worker registration, an install prompt. Software that installs onto
        a user's device from a browser is supplied for use as squarely as software installed from a
        store, and this audience ships that way more often than it ships packages. The Commission's
        guidance draws the line at local execution: an application \"developed using web
        technologies but supplied for local execution\" is a product (paragraph 20), and a web
        application, \"including progressive web apps\", accessed exclusively through a web browser
        is not on that basis alone (paragraph 21), so a web manifest, a service worker or an install
        prompt is what the code suggests and the person answers which it is. This list read \"a
        published package\" until 2026-07-29, which is the over-read the collector exists to prevent
        and which this gate corrects in its own `census_categories` comment: the kind is
        `publishable_package`, **not `published_package`, and the difference is the whole point** -
        measured on four real repositories, all three hits were ordinary monorepo workspace packages
        that nobody publishes. The correction has to sit here, because this note is the passage a
        reader reaches when they are adjudicating the limb. `release_documented` - the same release
        command written in a document rather than in a step that runs - is now listed, and it is
        weaker than `release_automation`: it shows an intended route, not one the repository
        executes. It was collected and then consulted by no limb until 2026-07-29. **What does not
        count, and what does.** A container **build** is not evidence of supply, because building an
        image is not a supply to anybody; it is emitted separately as `container_build_config` and
        no limb here consults it. A **push to a registry** is supply to somebody else, and the
        collector does emit it: `docker push` and `docker/build-push-action` are matched and emitted
        as `release_automation`, which this limb lists in `supports`. **This note said \"no
        collector emits one\" until 2026-07-29 and that was false** - the correction of an earlier
        false statement written into a new one. A reader trusting it would have gone looking by hand
        for evidence the scan already held, and would not have known that a `docker push` line was
        what settled the limb. The reason the older versions of this note gave for excluding a
        Dockerfile was different again and wrong: that Recital 12 \"places outside this Regulation\"
        a service its provider hosts itself. Recital 12 conditions itself - cloud solutions are
        remote data processing solutions \"only if they meet the definition laid down in this
        Regulation\" - and its worked example puts a manufacturer's own cloud enabled functionality
        **inside** the scope, while a cloud service designed and developed outside a manufacturer's
        responsibility is outside it. **This note gave the inside half unconditionally until
        2026-08-05.** The user-facing text has now caught up. Rule `eu-cra-001` fires on Dockerfiles
        in the same scan, and its title asserted the supply as established - \"Product supplied from
        this repository\" - until 2026-08-12, when it was corrected to name the construct matched
        instead. **Its `context_questions[0]` carried the Recital 12 misreading until the same
        date**, in the stronger form of an instruction to record a self-hosted service and stop, so
        one run printed the corrected reading here and the uncorrected one in the finding a user
        actually reads. That sentence was replaced on 2026-08-12 with the Article 3(1) and Article
        3(2) test; the hosted-only case is now routed to `is-a-product-with-digital-elements`, whose
        \"false\" closes this gate, instead of being closed inside the rule, and the rule now also
        named this limb's counting rule - that giving access to software the manufacturer hosts was
        counted here as supply for use - as this gate's own rather than as Article 3(22)'s words,
        until both were withdrawn on 2026-11-11. The correction was made on 2026-08-12, against the
        Official Journal text. This note said correcting the rule was \"owed work outside this
        gate\" until that date. Finally, Recital 18: the mere presence of regular releases does not
        in itself show supply in the course of a commercial activity. This limb and
        `in-the-course-of-a-commercial-activity` are separate questions, and a release workflow
        answers only the first."
    - id: hosting-on-an-open-repository-alone
      question: Is the supply relied on solely a hosting platform's own act of hosting other people's
        software on an open repository, including through a package manager or on a collaboration
        platform, as against this party's own act of publishing?
      decided_by: ask
      closes_gate_when: never
      quote_ref:
        - CRA Recital 20
        - CRA Recital 19
      note: "**Reframed on 2026-07-29 to the subject Recital 20 actually has.** The Recital's second
        sentence - \"Providers of such services should be considered to be distributors only if they
        make such software available on the market\" - shows that its operative concern is the
        operators of open repositories, package managers and collaboration platforms, and whether
        hosting other people's software makes them distributors. The limb used to ask the question
        of the party being scanned and use it to neutralise that party's own publication, and that
        is the error the reframing corrects. **What this limb records is a question, not a settled
        reading, and the difference was overstated on 2026-07-29 before being corrected the same
        day.** The note asserted flatly that Recital 20 \"says nothing about the developer who
        publishes their own package\". That swings from one absolute to the opposite one. The
        Recital's first sentence states a proposition about an act - \"the sole act of hosting
        products with digital elements on open repositories ... does not in itself constitute the
        making available on the market\" - and names no actor; and Recital 19 opens on free and
        open-source products \"that are published, but not made available on the market within the
        meaning of this Regulation\", so the Regulation does recognise publication that is not
        making available on the market. The inclusive reading - a manufacturer's own `npm publish`
        step is the manufacturer's act and counts as supply - is the one this gate takes, for the
        stated asymmetry reason. It is contestable, and a reader answering this limb \"yes\" is
        contesting it. **The wiring was removed for the same reason the framing changed.** This limb
        was answered from `publishable_package`, a kind that means only \"this manifest is not
        marked unpublishable\", and the result was confident wrong answers rather than unresolved
        ones: on a closed-source paid hosted service that publishes nothing anywhere, the limb
        reported that the only supply relied on was hosting on an open repository, off two internal
        workspace manifests. `release_automation` was listed as evidence **against** the limb, and
        the ground this note gave for taking it off was itself wrong. **The note said until
        2026-08-05 that a CI step publishing to npm, PyPI, crates.io or Maven \"is literally
        'hosting products with digital elements on open repositories ... through package managers',
        the paradigm case the Recital names\".** It is not. Recital 20's second sentence attaches
        the consequence to \"Providers of such services\", so the act its first sentence describes
        is the platform's act of hosting, and a publish step is the act of putting the product onto
        the platform - which is why the first sentence cannot be read to neutralise the publisher's
        own supply. The wiring goes for a reason the Recital does give: **No collector emits any
        fact about publicity** - not a git remote host, not a registry URL in a manifest's
        `publishConfig`, not a `repository` field pointing at a public forge - and publicity is the
        only thing this Recital is about. So the limb is asked, not inferred. **What the answer
        does, stated accurately after an earlier version described an effect the evaluator cannot
        produce.** It said a \"yes\" records that `supplied-for-distribution-or-use` \"has not been
        settled by the hosting fact alone\". **No mechanism carries that.** `assessScope` computes
        each limb's state from census facts filtered by kind and by nothing else, and
        `closes_gate_when: never` makes this limb `bears_on_verdict: false`, so a \"yes\" here
        cannot unsettle the supply limb, cannot change the verdict, and is not read by any code path
        at all. So the honest statement is: **this limb's only consumer is the person or the
        adjudicating agent reading the report.** A \"yes\" is the sentence \"the only supply this
        scan relies on is a platform's act of hosting, so the supply limb needs another ground
        before a finding rests on it\", written into a finding's reasoning by hand. A \"no\" records
        nothing. Where the supply is characterised by something else - a release aimed at users, a
        paid tier, any of Recital 15's signals - the supply limb is met on that other ground and
        this limb does not touch it. **The limb is kept and the gap is named rather than closed by
        deleting the question.** It is one of thirteen questions this gate puts to a person
        unconditionally - three about the supply and the supplier, and ten about Article 2's own
        paragraphs, added 2026-08-04 - and paying for a question whose answer no field carries is a
        real cost. That cost is this limb's alone: every other `ask` limb's answer is read by
        somebody, and this one's is read by nobody. Two ways out exist and both are owed work
        outside this gate: give the answer somewhere to live, by having the report print it as an
        annotation against the supply limb's evidence, or drop it to a note on
        `supplied-for-distribution-or-use` and stop asking. Deleting a live legal question to save a
        prompt is the direction this repository does not take, so it stays until one of the two is
        built."
    - id: on-the-union-market
      question: Is the supply for distribution or use on the Union market?
      decided_by: premise
      closes_gate_when: "false"
      quote_ref:
        - CRA Art. 3(22)
      note: "Settled by the pack's standing premise - running the EU pack is the statement that the
        product is supplied for distribution or use on the Union market - and therefore never asked
        as its own question. A No to the region question for the EU does not answer it: that
        question asks whether the product is offered to people or organisations in the EU, and
        Article 3(22) also reaches supply for use on the Union market, which a product people in the
        EU download, install or buy without its being offered to them there still is, so the four
        questions about the product decide instead. From 2026-11-11 to 2026-11-13 such a No answered
        this limb no and the gate did not apply."
    - id: in-the-course-of-a-commercial-activity
      question: Is the supply in the course of a commercial activity, whether in return for payment or
        free of charge?
      decided_by: either
      closes_gate_when: "false"
      declared_by: cra.commercial_activity
      declared_answers:
        - true
        - false
      quote_ref:
        - CRA Art. 3(22)
        - CRA Recital 15
        - CRA Recital 18 (free and open-source software and commercial activity)
      evidence_categories:
        - commercial
      code_evidence:
        supports:
          - subscription_route
      note: "**A fact about the business, which the code suggests and never settles (2026-11-10).**
        `subscription_route` was the one kind allowed to decide this limb from 2026-07-30 to
        2026-11-10. Since then it is printed beside the question as what the code suggests, and the
        limb is settled only by the person (the standing rule: a fact about the product is asked of
        the person or read from their declared documents, and code may corroborate or contradict it
        but never decide it), so a billing call site no longer settles it over an answer of no. **Of
        the scan profile, only `cra.commercial_activity` answers the limb, yes or no (since
        2026-11-11, second round); `features.payments.present` no longer reaches it.** Taking
        payments is Recital 15's first characterisation; taking none answers nothing, because
        Article 3(22) reaches a supply made \"whether in return for payment or free of charge\" and
        Recital 15 names paid support, a platform through which the manufacturer monetises other
        services and personal data required for reasons other than security among the other
        characterisations. Until that date a no over a tree with no commercial fact closed the gate,
        which told a company that gives its product away that the Regulation does not reach it.
        Where this note says below that a kind decides, settles or is allowed to decide this limb,
        it describes the gate before that date. **An independent condition, answered on its own
        evidence.** The five characterisation limbs that follow - `price-charged-for-the-product`,
        `paid-technical-support-beyond-cost-recuperation`, `intention-to-monetise`,
        `personal-data-processing-required-as-a-condition-of-use` and `donations-exceeding-costs` -
        are Recital 15's non-exhaustive indicators, not a formula. **None of them met does not
        settle this limb \"no\"**, because Recital 15 says supply \"might be characterised\" by them
        and lists no closed set. **Any one of them met is answered \"yes\" here, and that is this
        gate's choice and not the Recital's instruction** - \"might be characterised\" is
        permissive, and the Recital gives two cases in which a characterisation is met and the
        supply is still not commercial on that ground: its own closing sentence, \"Accepting
        donations without the intention of making a profit should not be considered to be a
        commercial activity\", and Recital 16's fee \"charged solely to recover the actual costs
        directly related to the operation of that service\", which is not commercial \"on those
        grounds alone\". Both have a limb of their own, in
        `donations-accepted-without-the-intention-of-making-a-profit` and
        `fee-charged-solely-to-recover-actual-operating-costs`, and a reader who answers either of
        those \"yes\" has the Recital's own answer to the characterisation beside it. The gate
        answers \"yes\" on a single characterisation anyway because over-inclusion here leaves the
        duties in place and under-inclusion drops every item. **This passage gave \"because Recital
        15 says supply 'might be characterised' by them\" as the ground for the sufficiency half as
        well as for the openness half until 2026-08-05**, and those words carry only the second.
        That is why they are all `closes_gate_when: never` while this limb closes the gate: they
        inform it and do not compute it. \"Whether in return for payment or free of charge\"
        qualifies the manner of supply and does not dispense with the condition, so a free supply
        does not by itself bring a product in. **The question omitted those words until 2026-08-05,
        and this note carried them all along**: asked as \"Is the supply in the course of a
        commercial activity?\", the maintainer of a product given away for nothing reads
        \"commercial\" and answers \"no\", which on a `closes_gate_when: \"false\"` limb closes the
        gate and drops every item - and the one clause in Article 3(22) that stops that inference
        was in a note four thousand words below the question. Closed-source software supplied
        outside any commercial activity is outside the Regulation. **This limb was got wrong twice
        in one day, in opposite directions.** First by saying it \"is not in the code\", which a
        Stripe subscription route on the first project the gate was pointed at disproved the same
        day; then by saying that software which is not free and open-source meets it automatically,
        which is also wrong - Recital 18's carve-out is unavailable to proprietary software, and
        that is a different statement from proprietary software always being commercial. **Wired on
        2026-07-29, and the reason given for not wiring it was false.** This limb named no fact
        kind, on the stated ground that \"the build's fixture floor fails any `code_evidence` kind
        that no fixture tree's census emits, and neither fixture tree contains a payment route or a
        price identifier\". That was untrue of the repository as it stood the same day. The floor
        was not computed from a fixture census then; it was a fixed list, kept in the build's tests,
        of the kinds some test tree emits, and it already listed all nine `commercial` and
        `provenance` kinds, because one of the build's test trees had been given a payment route, a
        price identifier, a licence-key check, a donation link, a publisher block, a copyright line,
        a changelog and a governance file for exactly this purpose. That tree's expected census
        emitted them all and the suite passed. **The false reason was the load-bearing excuse for
        the whole wiring gap and stood in twelve parsed fields of the `cra-product-information-13-8`
        checklist in a revision - two stating it (`limbs[7].note` and `when_unresolved`) and ten
        limb notes cross-referring to it with the words \"for the reason given on
        `in-the-course-of-a-commercial-activity`\" - besides a thirteenth statement in a YAML
        comment there.** What it cost, re-measured on 2026-07-29 after the collector was
        restructured: on one real tree with a billing route, the `commercial` collector emits 255
        facts, of which 3 are `subscription_route` - the kind wired here - the first being
        `checkout.sessions.create` in a billing route, and 150 more are `payment_provider`, which
        annotate. While this limb named no kind, that entire body of evidence went unread and the
        project returned `likely-applies`. This passage carried counts from a run made before the
        restructuring - \"189 `payment_provider`, 98 `price_identifier` and 3 `subscription_route`\"
        - and those numbers no longer reproduce, so they are replaced by a current run rather than
        kept; the \"153 facts of the three kinds now wired here\" it then carried stopped being true
        on 2026-07-30, when two of those three were demoted. A measured claim this gate keeps has to
        be one a reader can reproduce today. **Which one kind is here, and which seven are
        deliberately kept off this limb.** Wired here: `subscription_route` (a billing call site).
        Kept off, and all wired to limbs that are `closes_gate_when: never` where they annotate and
        decide nothing: `payment_provider`, `hosted_checkout_link`, `price_identifier`,
        `licence_key_check`, `commercial_documented`, `monetary_amount_literal` and `donation_link`.
        **The division is by whether the line is code that runs.** This passage read
        \"`payment_provider`, `price_identifier` and `subscription_route`\" until 2026-07-29, then
        \"`payment_provider`, `hosted_checkout_link` and `subscription_route`\" until 2026-07-30.
        `price_identifier` was moved off because an identifier NAME is not a payment: measured
        2026-07-29 on an MIT-licensed web framework, every one of its `price_identifier` facts was a
        `price_list_id` row in recorded test mocks of somebody else's e-commerce API, and while the
        kind was wired here they were the bulk of what carried this limb to `applies` on that
        framework. They are now on `price-charged-for-the-product`, still shown, deciding nothing.
        `subscription_route` is the least ambiguous of the eight commercial kinds -
        `checkout.sessions.create`, `paymentIntents.create` and `billing_portal` are call sites and
        not strings. `subscriptions.create` sits in the same clause and is **not** vendor-shaped:
        Rails ActionCable's client and a notification service's API both use that exact chain for
        something that is not money, so the collector matches it only where a payment or billing
        word appears on the same line. Measured on one support product whose ActionCable connector
        used to put a `subscription_route` fact on this limb: that line now produces no commercial
        fact at all. **From 2026-08-03 the kind reads the same call in six languages, not one.**
        `Stripe::Subscription.create` (Ruby), `stripe.Subscription.modify` and
        `stripe.checkout.Session.create` (Python), `\\Stripe\\Checkout\\Session::create` (PHP),
        `&stripe.SubscriptionParams{` (Go), `SubscriptionCreateParams.builder()` (Java), `new
        SubscriptionCreateOptions` (C#) and the Node SDK's own
        `stripe.billingPortal.sessions.create` were all invisible while this was the only kind
        allowed to decide. Every added spelling carries the vendor's name inside the match or
        requires it on the same line, so the kind still means what it says. **Two lines that look
        like a call and are not**: a Stripe call inside a fenced code block in a documentation guide
        is emitted as `commercial_documented`, on the same reasoning that makes a release command in
        a TODO file `release_documented` rather than `release_automation`; and a TypeScript type
        annotation such as `Stripe.Checkout.SessionCreateParams.Mode` is a type, not a call. Both
        are still collected and still printed on `price-charged-for-the-product`.
        **`licence_key_check` is not here on purpose.** Recital 15 does not name licence keys, and a
        key check can gate a free registration as easily as a paid one. It is weak and inferential,
        so it goes to `price-charged-for-the-product`, which is `closes_gate_when: never` and
        therefore cannot decide anything on it. **`donation_link` is not here on purpose either, and
        the reason is in the Recital.** The fifth characterisation is donations **exceeding the
        costs** of design, development and provision, and the next sentence says donations accepted
        without an intention to profit are not a commercial activity. A sponsor link alone cannot
        settle a limb that closes the gate, so it goes to `donations-exceeding-costs`, where it
        opens the question and never closes it. **That sentence was a promise the collector did not
        keep until 2026-07-29**: a `paypal.me` link matched the payment-vendor clause instead and
        landed here, so on one component library two adjacent lines of one funding block were split,
        the GitHub Sponsors line correctly kept off this limb and the PayPal line deciding it.
        Re-measured on 2026-07-29 after the fix: the `paypal.me` donation route appears on four
        lines of that library's documentation and READMEs, producing eight facts between them, and
        every one of the eight is now classified `donation_link` and sits on
        `donations-exceeding-costs`. This limb holds none of them. **What the wiring costs,
        re-measured on 2026-07-30, because this passage is the fourth version of itself and each
        earlier one described a world its own commit had already removed.** On that library this
        limb now holds **no fact at all** and the verdict is `likely-applies`, with
        `in-the-course-of-a-commercial-activity` named under TO ANSWER. Its three
        `hosted_checkout_link` facts are still collected and still carried to
        `price-charged-for-the-product`, and the first of them is still a purchase link for a paid
        support tier, which is Recital 15's first characterisation on its face. **A reader looking
        at that line will answer this limb \"yes\" in one second, and the gate now asks them to
        rather than answering for them.** That is the cost of the 2026-07-30 decision stated in its
        sharpest form, on the tree where it costs most, and it is a real loss. **This passage said
        \"still printed\" until 2026-08-03 and that was false of the console.** Measured: the limb
        holds 192 facts on that library, of which 186 are `monetary_amount_literal`, 3
        `commercial_documented` and 3 `hosted_checkout_link`; the console block prints the FIRST
        fact of a limb and a `(+n more)` count, and the first is a `monetary_amount_literal` fact on
        a mock amount in a documentation gallery. The three purchase links sit at indices 5, 6 and 7
        of the limb's evidence array and are reachable only by reading `findings.json`. So the
        demotion is not a suppression in the emitted document, where every fact is present and
        ordered, and it IS a loss of visibility on the terminal, where the reader the argument is
        about is looking. **Printing the strongest fact of a limb rather than the first, or printing
        more than one, is the fix and it was not made in the 2026-08-03 round** - it changes what
        every scan prints for every limb of every gate, which is wider than the closing limb this
        round was scoped to. What this passage said in its second version: that the limb was settled
        by 186 `price_identifier` facts whose first were `amount:` values in a documentation
        dashboard demo, and by 8 `payment_provider` facts several of which were the word \"paypal\"
        on a sponsors page. Every part of that is false. The 186 bare numbers are emitted as
        `monetary_amount_literal` and consulted only by `price-charged-for-the-product`, where they
        are still shown and can decide nothing; the PayPal facts are `donation_link`. Its third
        version said this limb was \"now settled by three facts, all `hosted_checkout_link`\", which
        was true until the demotion. **And the sentence that justified tolerating the noise was
        false and is withdrawn.** It read *\"This limb is `either` and its findings are adjudicated,
        so an over-read costs a candidate a reader dismisses in one line.\"* That is true of a
        finding and false of this limb. This limb is `closes_gate_when: \"false\"`, so an over-read
        here does not produce a dismissible candidate - it produces `applies`, the strongest verdict
        the instrument emits, with nothing between the collector's regular expression and the legal
        conclusion. The tolerance argument belongs to the five characterisation limbs, which are
        `closes_gate_when: never`, and never belonged here. Restricting this limb to a call site is
        what replaces it, and the effect is measured twice. Once on 2026-07-29, when the limb went
        from eight kinds to three: two MIT libraries with no payment code in the tree, returned
        `applies` before that change and `likely-applies` after it. Once on 2026-07-30, when it went
        from three kinds to one: six trees returned `applies` before and `likely-applies` after, and
        every one of the six had been decided by evidence that does not bear on Article 3(22) - an
        SVG import, a markdown filename, a SQL schema qualifier, a vendor's API base URL, a security
        header in a `.har` test fixture. The same change cost three trees a correct `applies`. Four
        others still return `applies`, each with a real call site as its first evidence. **The third
        measurement, 2026-08-03, is of the same limb reading five more languages, and it corrects
        the sentence above.** Two of those three were not the price of the demotion: both hold
        billing call sites, in Ruby and in Python, which is exactly and only what this limb accepts,
        and the collector could not spell them. Nor were two of the six wrong verdicts removed: both
        hold billing call sites in their own production code, in Node chains the older patterns did
        not read. All four return `applies` again, on their own call sites, and a fifth tree, first
        scanned on 2026-08-03, joins them with the facts of its own subscriptions plugin. **Two
        trees are the whole of the price**, and both remain `likely-applies` with the limb named
        under TO ANSWER and their evidence printed on the annotating limb. Not reading the kinds at
        all cost the only verdict this gate can move: before 2026-07-29 every project on earth
        returned `likely-applies` with an identical explanation. A reader still answers it from the
        tree where the collector is silent: a paid tier, a payments dependency with a call site, a
        mandatory account whose data is processed for any reason other than exclusively for
        improving the software's security, compatibility or interoperability, a support contract
        sold beside the software, or donations accepted in excess of the costs associated with the
        design, development and provision of the product. **That list carried only the first four
        until 2026-08-05**, so a reader working down it over a donation-funded project - the shape
        `supporting_quotes[38].why` calls this product's declared audience - found none of them,
        answered \"no\", and closed the gate; the fifth characterisation is Recital 15's own and has
        a limb of its own in `donations-exceeding-costs`."
    - id: price-charged-for-the-product
      question: Is a price charged for the product with digital elements?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 15
      evidence_categories:
        - commercial
      code_evidence:
        supports:
          - payment_provider
          - hosted_checkout_link
          - price_identifier
          - subscription_route
          - licence_key_check
          - commercial_documented
          - monetary_amount_literal
      note: "The first of Recital 15's five characterisations. A checkout, a subscription or billing
        route, a purchase link, a price or plan identifier, a licence-key check, a bare price
        literal, a vendor named in a link. Seven of the `commercial` collector's eight kinds are
        wired here as of 2026-07-29 - all of them except `donation_link`. This limb previously named
        none of them, for a reason that was false and is corrected on
        `in-the-course-of-a-commercial-activity`; and this sentence said \"all four kinds\" until
        the collector was restructured later the same day and the count stopped being four. **What
        `commercial_documented` is, and what it still does not reach.** It is a payment vendor named
        in a link or as a domain in prose - `https://buy.stripe.com/...`,
        `www.paypal.com/us/business` in a tutorial, `stripe.com/docs` in an example README - and it
        is the commercial collector's counterpart of `release_documented` in the distribution
        collector: a claim in prose, emitted under a kind that says which it is. It was created
        because tightening the vendor clause on 2026-07-29 stopped a body of prose lines from
        matching, and one of those lines was a true statement of a product's own paid subscription.
        **That particular line is still not reached, though the sentence before this one implies it
        is.** Measured 2026-07-29: a component library's subscription card tells the reader the plan
        can be cancelled at any time and is paid through Stripe, and the whole file produces **no
        commercial fact of any kind** - a vendor name at the end of a sentence is followed by a full
        stop and a line break, which the clause requires not to be a member access, and the card's
        price rendering (`prices.solo[interval]`) matches no pattern either. So the gap of a tree
        whose only commercial trace is its own pricing page in prose is **narrowed and not closed**:
        vendor domains and links are now emitted here, bare vendor names in prose still produce
        silence. On that component library it costs nothing, because the paid-SLA purchase links
        survive elsewhere in the tree; on a tree whose only trace is that sentence it would cost
        everything, and it is recorded here rather than left to be discovered. **`licence_key_check`
        is wired here and nowhere else, deliberately.** Recital 15 does not name licence keys, and a
        key check can gate a free registration as easily as a paid one, so it is inferential
        evidence. This limb is `closes_gate_when: never`, so nothing can be decided on it here;
        putting it on `in-the-course-of-a-commercial-activity`, which closes the gate, would let a
        weak inference settle a required condition. A \"yes\" here informs
        `in-the-course-of-a-commercial-activity` and does not compute it: that limb is not a tally
        of these five."
    - id: paid-technical-support-beyond-cost-recuperation
      question: Is a price charged for technical support services in a way that does not serve only the
        recuperation of actual costs?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 15
        - CRA Recital 16
      evidence_categories:
        - commercial
      note: "**The second of Recital 15's five characterisations, and it had no limb until 2026-07-29.** A
        paid-support-only project - open-source software given away with a support contract sold
        beside it - is an extremely common shape in the audience of the checklists that name this
        gate, and it reached `in-the-course-of-a-commercial-activity` with no limb able to establish
        it. The omission under-included. The qualifier is part of the condition: support charged at
        cost is not this. Read it with Recital 16, which says that a product provided as part of the
        delivery of a service, for which a fee is charged solely to recover the actual costs
        directly related to the operation of that service, is not a commercial activity on those
        grounds alone. **The service-delivery element is part of Recital 16 and this sentence
        dropped it until 2026-08-05**, which stated the neighbouring Recital wider than it reads.
        Recital 16 says nothing about technical support, and it is
        `fee-charged-solely-to-recover-actual-operating-costs` rather than this limb that asks it.
        **No fact kind is wired here, and the reason is the question rather than the collector.** A
        support tier appears in a tree as a plan or price identifier or a subscription route, which
        the `commercial` collector does emit - but those kinds say a fee exists and cannot say what
        the fee is **for**, and what the fee is for is the whole of this limb: a price charged for
        technical support, beyond the recuperation of actual costs. Wiring them here would report
        every checkout route as evidence of a paid support contract. More often the fact appears
        only on a pricing page, which is a document and not code. So the tree suggests; the person
        or their documents answer, and an unanswered limb is asked. (This note previously blamed the
        build's fixture floor, which was false; the real reason is the one above.)"
    - id: intention-to-monetise
      question: Is there an intention to monetise, for instance by providing a software platform through
        which the manufacturer monetises other services?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 15
        - CRA Recital 18 (free and open-source software and commercial activity)
      evidence_categories:
        - commercial
      code_evidence:
        supports:
          - subscription_route
      note: "**The third of Recital 15's five characterisations, and it had no limb until 2026-07-29.** It
        is the one that catches the shape the audience of the checklists that name this gate most
        often has: a free product given away by a company that sells accounts, credits, plans or a
        hosted edition beside it. The product is free; the intention to monetise is the platform.
        Recital 18 qualifies it in two ways that matter here, and only one of the two is confined to
        open-source software. The mere fact that an **open-source** software product with digital
        elements receives financial support from manufacturers, or that manufacturers contribute to
        its development, does not in itself determine that the activity is of a commercial nature -
        the Recital's sentence carries that element and this note dropped it until 2026-08-05, which
        offered a proprietary product a qualification the Recital does not offer it. The second
        sentence carries no such element: the mere presence of regular releases does not in itself
        lead to the conclusion that **a product with digital elements** is supplied in the course of
        a commercial activity, and that one reaches every product. **`subscription_route` is wired
        here as of 2026-07-29** - a billing portal or a checkout session created inside a product
        that is otherwise given away is the trace of \"a software platform through which the
        manufacturer monetises other services\", which is Recital 15's own example. This limb named
        no kind before that date, for a reason that was false and is corrected on
        `in-the-course-of-a-commercial-activity`. A \"yes\" informs that limb and does not compute
        it."
    - id: personal-data-processing-required-as-a-condition-of-use
      question: Is the processing of personal data required as a condition for use, for reasons other than
        exclusively for improving the security, compatibility or interoperability of the software?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 15
      note: "The fourth of Recital 15's five characterisations. The trigger is personal-data processing
        required as a condition of use **for any reason other than exclusively for improving the
        software's security, compatibility or interoperability**, and the exception is improving
        those three things and nothing wider: Recital 15 excepts processing required \"exclusively
        for improving the security, compatibility or interoperability of the software\". The
        exception is part of the condition and not an afterthought. **This note glossed the trigger
        as \"something other than the software's own operation\" until 2026-08-05, and that gloss
        was strictly narrower than the provision.** \"The software's own operation\" is a smaller
        set than the three excepted purposes, so the gloss silently excepted every purpose a reader
        counts as part of running the software. **Product analytics is the worked example it got
        wrong.** A product whose mandatory account data feeds usage analytics is caught by Recital
        15, because analytics is none of security, compatibility or interoperability - and a reader
        asked whether that data \"feeds something other than the software's own operation\" answers
        **no**, because analytics reads as part of running the software. An answer of \"false\" here
        understates a limb that bears on whether this Regulation reaches the product at all, and a
        skipped check is indistinguishable from a passed one. That gloss stood in
        `in-the-course-of-a-commercial-activity`'s note and in `when_unresolved` as well - three
        occurrences in all, measured by parsing this gate and normalising whitespace - and all three
        are corrected on that date. **The first replacement, made the same day, read \"for any
        purpose other than the software's security, compatibility or interoperability\" and dropped
        \"exclusively for improving\".** That wording excepts processing for those three things at
        all, where the Recital excepts only processing required exclusively to **improve** them: the
        data a mandatory authentication step needs in order to *operate* is processed for security,
        so it falls inside the wider gloss and outside the Recital's exception. A wider exception is
        a narrower limb, which is the same understating direction the replacement was correcting,
        and the three words are restored in the same three fields. **They were not literally the
        same three words in all of them until 2026-08-05.** `limbs[7].note` and one of
        `when_unresolved`'s two occurrences read \"exclusively improving\" without the \"for\", as
        did this limb's own question and `supporting_quotes[38].why`. The two forms mean the same
        thing and the operative word - **improving** - was in every one, so no answer turned on it;
        but a field describing another more precisely than the artefact is a defect class this
        repository records, and all five now read \"exclusively for improving\". Checked by parsing
        this gate and normalising whitespace rather than by reading it, because the phrase wraps.
        Inside the exception: a compatibility check against the host platform or another version, an
        interoperability handshake with another system, a crash report read exclusively to improve
        the software's security. **\"Crash and telemetry reporting read only to keep the software
        working\" stood in this list until 2026-08-05 and does not belong in it**: keeping software
        working is reliability, and reliability is none of security, compatibility or
        interoperability - which is the objection this note makes two paragraphs above to a gloss
        that excepted \"the software's own operation\", re-admitted through the example beside it.
        Outside the exception, and therefore caught: analytics, advertising, personalisation,
        recommendation, profiling, telemetry read for any of those or for product decisions, and any
        sale or transfer of the data to a third party. **The reading is the literal one**, and it is
        chosen deliberately. Recital 15 asks whether processing is required as a condition for use
        \"for reasons other than exclusively for improving the security, compatibility or
        interoperability of the software\", and on that reading a login, an email address or a
        mandatory consent gate answers yes for almost every account-based application. A narrower,
        purposive reading - processing that is itself the monetisation, data taken as the price of
        admission - would be met by almost none of them. Nothing in the Recital chooses between
        them, so this limb takes the reading that over-includes, and it costs nothing to do so: the
        limb is `closes_gate_when: never`, so a \"yes\" here informs
        `in-the-course-of-a-commercial-activity` and removes nothing, and that limb is not a tally
        of these five. **The `collection` evidence category was removed on 2026-07-29.** Its only
        collector is permission-apis, which emits `navigator.geolocation`, `mediaDevices`,
        `clipboard` and `Notification.requestPermission`. A device-permission call says nothing
        about whether processing is a **condition of use**. No fact kind states that an account is
        mandatory either, so this limb declares no evidence category at all: the tree suggests; the
        person or their documents (the terms of service) answer, and an unanswered limb is asked."
    - id: donations-exceeding-costs
      question: Are donations accepted that exceed the costs associated with the design, development and
        provision of the product with digital elements?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 15
      evidence_categories:
        - commercial
      code_evidence:
        supports:
          - donation_link
      note: "**The fifth of Recital 15's five characterisations, and it had no limb until 2026-07-29.** A
        donation-funded project is an ordinary open-source shape, and the omission under-included in
        exactly the population this product is built for. **A donations link is not the answer, and
        now that it is wired this note has to say so louder.** The Recital states its own negative
        in the next sentence: donations accepted without the intention of making a profit are not a
        commercial activity, and what makes them commercial is that they **exceed** the costs of
        design, development and provision. The `commercial` collector's `donation_link` shows that
        donations are solicited and can never show what they amount to against those costs. **So a
        `donation_link` opens this question and never closes it**, and it is wired here - on a limb
        that is `closes_gate_when: never` - and deliberately not on
        `in-the-course-of-a-commercial-activity`, which closes the gate. A sponsor link on a hobby
        project must not be able to settle a required condition of the Regulation's scope. **The
        negative half of the same sentence is asked by its own limb as of 2026-08-04**,
        `donations-accepted-without-the-intention-of-making-a-profit`, so that a donation-funded
        project is asked the question that can take it out and not only the question that keeps it
        in."
    - id: donations-accepted-without-the-intention-of-making-a-profit
      question: Are the donations accepted without the intention of making a profit?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 15
      evidence_categories:
        - commercial
      note: "**Recital 15's closing sentence, and it had no limb until 2026-08-04 although the positive
        half beside it had one from 2026-07-29.** The Recital says in terms that \"accepting
        donations without the intention of making a profit should not be considered to be a
        commercial activity\". The gate asked whether donations exceed the costs of design,
        development and provision, and never asked the question that answers it the other way -
        which is the cleanest route out for the shape this gate's own prose calls an ordinary
        open-source shape and the declared audience of the checklists that name this gate. **A
        \"yes\" does not take the project out, and that is why this limb is `closes_gate_when:
        never` rather than an exemption.** The sentence says that the act of accepting such
        donations is not a commercial activity. It does not say the supply as a whole is outside: a
        project can accept donations with no profit intention and still charge a price, sell support
        above cost, or monetise a platform, and any one of those meets
        `in-the-course-of-a-commercial-activity` on its own. So a \"yes\" here removes one ground
        for finding the supply commercial and leaves the others standing, exactly as its sibling
        `fee-charged-solely-to-recover-actual-operating-costs` does. **The two negatives are not
        worded alike, and the difference is recorded rather than smoothed.** Recital 16's
        cost-recovery sentence carries \"on those grounds alone\"; Recital 15's donation sentence
        carries no such qualifier. Both are treated here as answering one characterisation and not
        the whole limb, because neither sentence says the supply as a whole is non-commercial - but
        the reader should know that the donation sentence is the stronger of the two on its face.
        **No fact kind is wired here, and the reason is the question rather than the collector.**
        The `commercial` collector's `donation_link` shows that donations are solicited; the
        intention behind them is not in a repository, and no collector reads an intention. The
        category is declared so a reader knows which facts to open - the same donation links that
        answer the limb above - and the answer comes from the project's own statements or from the
        person."
    - id: fee-charged-solely-to-recover-actual-operating-costs
      question: Is the product provided as part of the delivery of a service for which a fee is charged
        that serves solely to recover the actual costs directly related to the operation of that
        service?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 16
      evidence_categories:
        - commercial
      note: "The cost-recovery limit on the Recital 15 test, and the reason a billing route is a candidate
        rather than a conclusion: what the fee is for has to be read too. **The question omitted
        Recital 16's \"provided as part of the delivery of a service\" element until 2026-08-05, and
        so asked a wider question than the Recital answers.** Recital 16 reaches \"Products with
        digital elements provided as part of the delivery of a service for which a fee is charged
        solely to recover the actual costs directly related to the operation of that service\", and
        \"that service\" is the same service the product is provided as part of. Without the element
        the limb asked about any cost-recovery fee at all, so a bare cost-price charge for a
        download answered \"yes\" and was recorded as removing a ground the Recital never removes.
        That case is Recital 15's first characterisation, charging a price for a product with
        digital elements, and it carries no cost-recovery escape of its own - the only cost-recovery
        qualifier in Recital 15 is attached to technical support services, and it is
        `paid-technical-support-beyond-cost-recuperation` that asks it. The element is restored.
        **Which of the two readings was wrong, resolved rather than recorded.** The neighbouring
        scan-profile field `supply.monetisation.fee_recovers_operating_costs_only` carries the
        service-delivery element and its own description named this limb as the wider of the two and
        asked for them to be reconciled. Read against Recital 16 the field states the provision and
        this limb did not, so the limb was the one that was wrong; the field is correct and is
        unchanged. **Where no fee is charged at all, the answer is \"no\" and nothing follows from
        it.** The question was reworded on 2026-07-29 for that reason: the earlier form, \"Is
        **the** fee charged solely to recover...\", presupposed a fee, and a bare \"no\" against a
        product that charges nothing reads in a report as a finding against the product. Say which
        of the two situations is meant. Read the qualifier in both directions. Cost recovery does
        not make a supply commercial on those grounds alone, and it does not put a supply outside
        either, where some other Recital 15 signal is met - so a \"yes\" here does not take a
        project out, and this limb is not an exemption. **No fact kind is wired here, and the reason
        is the question and not the fixtures.** The `commercial` collector reports that a fee
        exists; this limb asks what the fee is **for**, and no collector can read a purpose. The
        category is declared so that a reader knows where to look: the tree suggests; the person or
        their documents (the pricing page) answer."
    - id: public-administration-entity-own-use-only
      question: Was the product developed or modified by a public administration entity exclusively for
        its own use?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Recital 16
        - CRA Art. 3(22)
      note: "**Recital 16's second sentence, and it had no limb until 2026-07-29 because the quote stopped
        at the first.** It is a stronger route out than the cost-recovery sentence beside it: it
        goes not to commercial activity but to making available on the market at all, and it carries
        no \"on those grounds alone\" qualifier. Public-sector internal tooling published openly is
        a real shape in this product's audience. Both elements are needed: a public administration
        entity, and exclusively for its own use. **Recital 16 says nothing about publication, and it
        does not say what does or does not defeat \"exclusively for its own use\": it states the
        condition and then states the consequence** - \"should not be considered to be made
        available on the market within the meaning of this Regulation\" - **and adds no further
        condition of any kind.** The boundary is therefore the words themselves - a product
        developed or modified for somebody else's use as well as the entity's own is outside them -
        and everything past that is open on the text. `regulation-2017-745-medical-devices-applies`
        states the rule this gate applies where the edge of an exemption is open: widening an
        exemption on an unquoted word is the under-inclusive direction, which this gate does not
        permit. So the answer is \"no\" wherever the source is published, or the product is
        otherwise put where somebody outside the entity can take it, unless the person answering can
        say that the development or modification was still exclusively for the entity's own use.
        That default over-includes, which is the tolerated direction on a limb whose \"yes\" drops
        every item. **This note asserted that \"Publishing the source does not defeat 'exclusively
        for its own use' by itself - what defeats it is supplying the product to somebody else\"
        until 2026-08-05.** Recital 16 contains neither half of that sentence, and on a
        `closes_gate_when: \"true\"` limb the first half told a public administration entity that
        publishes its internal tooling to answer \"yes\", which returns does-not-apply and drops
        every item of every checklist that names this gate. Nothing in a repository states who the
        party is, so this is asked, and like every exemption in this gate it is never claimed from
        code. **Two elements in one question, with no separate limb recording which of them
        failed.** That is the shape that was split apart for the two open-source exemptions, and it
        is not split here: an entity that is not a public administration and an entity using its own
        tool internally are both a \"no\", and the report cannot tell them apart on its own. The
        person or agent answering must name the failing element in the answer text. Recorded as a
        known residual rather than left for a reader to discover."
    - id: product-is-free-and-open-source-software
      question: Is the product free and open-source software, its source code openly shared and its
        licence providing for all rights to make it freely accessible, usable, modifiable and
        redistributable?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 3(48)
        - CRA Recital 18 (free and open-source software and commercial activity)
      note: '**The first of the two cumulative elements of the carve-out below, asked separately so that a
        "no" to the carve-out says which element failed.** Added 2026-07-29 after an independent
        reading pointed out that the exemption limb recorded "open source but monetised" and "not
        open source at all" identically, though they are legally different situations and only one
        of them can ever change. **The defined term is Article 3(48) and this limb tested it against
        Recital 18 alone until 2026-08-04.** The article is now cited first. Its two elements are
        the ones the question asks: the source code is openly shared, **and** the software is made
        available under a free and open-source licence which provides for all rights to make it
        freely accessible, usable, modifiable and redistributable. Recital 18 stays cited because it
        is where the consequence lives - qualifying as free and open-source software changes nothing
        on its own, and the routes out run through the commercial-activity element of Article 3(22).
        A licence file usually answers it, so this limb is `either` and not `ask`. Two cautions. A
        `"license": "MIT"` string in a scaffold-generated manifest with no licence text behind it is
        not an answer. And **"the product" is singular where a repository ships several** - a free
        core beside a paid directory under a separate licence is the ordinary shape - so answer for
        the thing that is supplied, and say which thing that is. No fact kind reads a licence, so
        this limb declares no evidence category.'
    - id: free-and-open-source-not-monetised-by-its-manufacturer
      question: Is the product a product with digital elements qualifying as free and open-source
        software, which its manufacturer does not monetise?
      decided_by: either
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 3(48)
        - CRA Recital 18 (free and open-source software and commercial activity)
      evidence_categories:
        - commercial
      note: "**Two cumulative elements, and the carve-out is available to free and open-source software
        and to nothing else.** Reading it as general was the `cra-product-information-13-8`
        checklist's own recorded error, and reading \"not free and open-source\" as automatically
        commercial was the over-correction that followed. **The question read \"Is the product free
        and open-source software that its manufacturer does not monetise?\" until 2026-08-05**,
        which compressed Recital 18's fifth sentence: the Recital puts the whole phrase on the thing
        provided - \"the provision of **products with digital elements qualifying as** free and
        open-source software that are not monetised by their manufacturers should not be considered
        to be a commercial activity\". Restoring the words narrows an exemption whose \"yes\" closes
        the gate, which reports more duties and never fewer, and
        `is-a-product-with-digital-elements` establishes the element separately, so nothing a reader
        answers changes. It is corrected because the same words were restored to
        `foss-component-for-integration-not-monetised`'s note on the same date on the ground that
        one phrase may not have two homes, and this question was the other home. Which element
        failed is recorded by `product-is-free-and-open-source-software` above. **This limb is no
        longer described as the one question this gate puts to a person.** It was labelled \"the one
        limb this gate asks a person, and the only one\", which was untrue of a gate in which four
        other limbs could also ask. It is now `either`, because across six real repositories the
        tree defeated it outright in five - a proprietary licence, or no licence file at all beside
        in-tree payment code, or a free licence beside credit balances and Stripe columns in the
        same repository. Reading a defeat from the tree carries no asymmetry risk: a negative answer
        here can only ever leave a duty in place. The limbs this gate does ask unconditionally are
        `hosting-on-an-open-repository-alone`, `public-administration-entity-own-use-only` and
        `not-for-profit-development`, and, as of 2026-08-04, the ten limbs that put Article 2's
        other seven paragraphs - seven exclusions, because Article 2(2)'s three points are asked
        separately; the two branches of Article 2(5), of which only the exclusion branch closes the
        gate; and the Article 2(8) information carve-out. **This sentence said \"the three limbs\"
        and named a closed set until that date**; thirteen limbs are `decided_by: ask` now, and a
        count stated as a closed set is the kind of sentence that goes stale without anything
        failing. **What a person is still needed for.** Monetisation can sit entirely outside the
        repository, in a paid support contract or a hosted edition billed elsewhere, so the tree can
        defeat this exemption and cannot establish it. An unanswered question leaves the gate open,
        because an exemption nobody has claimed is not an exemption. **Why no fact kind is wired
        here, now that the commercial and provenance kinds are wired elsewhere.** The `commercial`
        collector's eight kinds - `payment_provider`, `hosted_checkout_link`, `subscription_route`,
        `price_identifier`, `licence_key_check`, `commercial_documented`, `monetary_amount_literal`
        and `donation_link` - are the facts that defeat this exemption, and none of them may go in
        `supports`: the evaluator treats a `supported` exemption as claimed and closes the gate on
        it, so wiring them as support would let a Stripe route claim an open-source exemption.
        `opposes` is the only direction that would be legitimate, **and it would change nothing that
        a consumer can act on**: `assessScope` selects exemptions with `state === \"supported\"` and
        looks at no other state, so an `opposed` exemption limb is treated exactly like an
        unresolved one, while dropping off the list of limbs a reader is told to resolve. Wiring it
        would therefore buy a worse report, not a better verdict. That is an evaluator limit, not a
        legal one, and it is the reason a defeat the tree can see - a proprietary licence beside
        in-tree payment code - still has to be written into the finding by the person or the agent
        reading it. This note previously attributed the gap to the build's fixture floor, which was
        false."
    - id: foss-component-for-integration-not-monetised
      question: Is the product a product with digital elements qualifying as a free and open-source
        software component intended for integration by other manufacturers into their own products
        with digital elements, which its original manufacturer does not monetise?
      decided_by: either
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 3(48)
        - CRA Recital 18 (free and open-source software and commercial activity)
        - CRA Art. 3(6)
      evidence_categories:
        - commercial
      note: "**A further route out that no other software has, and it had no limb until 2026-07-29.**
        Recital 18: the supply of **products with digital elements qualifying as** free and
        open-source software components intended for integration by other manufacturers into their
        own **products with digital elements** \"should be considered to be making available on the
        market only if the component is monetised by its original manufacturer\" - the opening words
        were compressed to \"free and open-source components\" until 2026-08-05, and the Recital
        puts the whole phrase on the thing supplied. **The question above carried the same
        compression until a second round on 2026-08-05**, when an independent check found that the
        note had been repaired and the question one field above it left as it was - the very split
        this note's own reasoning forbids. Restoring the words narrows an exemption whose \"yes\"
        closes the gate, so it reports more duties and never fewer, and
        `is-a-product-with-digital-elements` establishes the element separately. This is the route
        for the single most common open-source shape there is - the library - and it is narrower
        than it looks: the component must be free and open-source, it must be intended for
        integration by **other manufacturers** into **their own products with digital elements**,
        and the original manufacturer must not monetise it. **The question said \"their own
        products\" and dropped \"with digital elements\" until 2026-08-05**, which widened an
        exemption that closes the gate to integration into anything at all, where the Recital
        reaches integration into products with digital elements; the list of three elements in the
        sentence just above carried it the whole time, as does
        `component-intended-for-integration-by-other-manufacturers`, and the question is corrected.
        **The opening summary of this note dropped the same two words, and the correction of
        2026-08-05 said \"this sentence carried the element the whole time\" while pointing at a
        sentence that did not.** That was true of the sentence the claim sat in and false of the
        summary above it: the sweep audited the sentence it was quoting and not the rest of the
        field it was quoting from. A person adjudicating from the summary could grant an exemption
        that closes the gate to a component intended for integration into a product with no digital
        elements. Both are corrected on the same date, and a correction that reports having
        corrected something it did not is recorded here rather than replaced, because the false
        report is the more instructive half. **Three cumulative elements, and each is asked
        separately as of 2026-07-29 so that a \"no\" says which one failed.** The
        free-and-open-source element is `product-is-free-and-open-source-software`, shared with the
        sibling exemption; the other two are
        `component-intended-for-integration-by-other-manufacturers` and
        `component-monetised-by-its-original-manufacturer`. This limb is the conclusion drawn from
        all three: it holds where the first two are \"yes\" and the third is \"no\". Written as one
        question with three conditions, it recorded \"not open source\", \"not a component\" and
        \"monetised\" identically - the same defect that was found and split out of
        `free-and-open-source-not-monetised-by-its-manufacturer` earlier the same day, recreated in
        a new limb hours later. Like every exemption in this gate it is never claimed from code, and
        for the same evaluator reason set out on
        `free-and-open-source-not-monetised-by-its-manufacturer`: a `supported` exemption closes the
        gate, and `opposed` is a state the evaluator does not read for exemptions at all. Until a
        person establishes the exemption the gate stays open."
    - id: component-intended-for-integration-by-other-manufacturers
      question: Is the product a component intended for integration by other manufacturers into their own
        products with digital elements?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 18 (free and open-source software and commercial activity)
        - CRA Art. 3(6)
      note: "**The second element of `foss-component-for-integration-not-monetised`, asked on its own.**
        Article 3(6) defines a component as software or hardware intended for integration into an
        electronic information system; Recital 18 narrows the carve-out further, to a component
        intended for integration **by other manufacturers** into **their own products with digital
        elements**. A library published for anyone to depend on is the ordinary case; an internal
        module of an application that is itself the product is not, because there are no other
        manufacturers integrating it. No fact kind is wired: a manifest says a package exists, not
        who is expected to integrate it or into what. `closes_gate_when: never`, so a \"yes\"
        records an element and decides nothing on its own. **So the evaluator cannot answer this
        limb today, and `decided_by: either` says what a reader can do rather than what the
        evaluator can.** With no `code_evidence`, `assessScope` has no kind to filter facts by and
        reports `unresolved` on every scan - measured 2026-07-29 on ten real trees, `unresolved`
        with zero facts on all ten. `either` is kept rather than changed to `ask` because a person
        reading the tree can find what it suggests, in the way
        `paid-technical-support-beyond-cost-recuperation` already records for itself, and because
        `ask` is reserved for questions on which no repository can suggest anything at all. The tree
        suggests; the person or their documents answer. **That reservation is the line, and it is
        not a count**: this note said the gate asked a person \"a deliberate, named set of three\"
        until 2026-08-04, when nine more were added for Article 2's own paragraphs. A reader
        answering this limb should expect no help from the report and read the manifest, the README
        and the licence."
    - id: component-monetised-by-its-original-manufacturer
      question: Does the component's original manufacturer monetise it?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 18 (free and open-source software and commercial activity)
      evidence_categories:
        - commercial
      note: "**The third element, and note that its polarity is the opposite of the exemption's.** Recital
        18 says the supply of such a component is making available on the market **only if the
        component is monetised by its original manufacturer**, so a \"yes\" here defeats the
        exemption and a \"no\" is what the exemption needs. Asked in the affirmative deliberately: a
        limb phrased as \"does the manufacturer **not** monetise it\" turns a defeat into a double
        negative in the report. \"Original manufacturer\" is doing work. Monetisation by somebody
        who integrates the component downstream is not this; the question is whether the party that
        supplies the component monetises it. **No fact kind is wired, and the reason is that the
        kinds cannot tell whose monetisation they are seeing.** A `payment_provider` or a
        `subscription_route` in a tree says money is taken somewhere in that repository; this limb
        asks whether the **component** is monetised **by its original manufacturer**, and a
        repository that ships a paid application beside a free library answers the first \"yes\" and
        the second \"no\". Monetisation also frequently sits outside the repository altogether, in a
        hosted edition or a support contract. Wiring the kinds here could not close the gate - this
        limb is `closes_gate_when: never` - but it would print a positive answer to a question the
        evidence does not reach, which is the `publishable_package` error in a new place. The
        evidence category is declared so a reader knows where to look. **So the evaluator cannot
        answer this limb today either, and `decided_by: either` says what a reader can do rather
        than what the evaluator can.** With no `code_evidence` there is no kind to filter facts by,
        so `assessScope` reports `unresolved` on every scan - measured 2026-07-29 on ten real trees,
        `unresolved` with zero facts on all ten, including trees carrying hundreds of commercial
        facts. `either` is kept rather than changed to `ask` for the reason given on
        `component-intended-for-integration-by-other-manufacturers`: a reader can find what the tree
        suggests even though the evaluator cannot. The tree suggests; the person or their documents
        answer."
    - id: not-for-profit-development
      question: Is the product free and open-source software developed by a not-for-profit organisation
        set up so that all earnings after costs are used to achieve not-for-profit objectives?
      decided_by: ask
      closes_gate_when: never
      quote_ref:
        - CRA Recital 18 (free and open-source software and commercial activity)
      note: "**The last sentence of Recital 18's commercial-activity passage, and it had no limb until
        2026-07-29.** Development of free and open-source software by a not-for-profit organisation
        is not a commercial activity, **provided** the organisation is set up so that all earnings
        after costs go to not-for-profit objectives. The proviso is the whole of the test and no
        repository contains it: whether an organisation is constituted that way is a fact about its
        articles, not about its code. Asked, never inferred. **This limb was an exemption -
        `closes_gate_when: \"true\"`, a \"yes\" returning `does-not-apply` on its own - until
        2026-08-05, and Recital 18 does not support that. It annotates from that date.** The Recital
        draws the development/supply line itself, and it draws it in the fifth sentence of its
        commercial-activity passage, four sentences before the ninth, which is the one this limb
        states: \"to ensure that there is a clear distinction between the **development and supply
        phases**, the **provision** of products with digital elements qualifying as free and
        open-source software that are not monetised by their manufacturers should not be considered
        to be a commercial activity\". So the Recital puts the not-monetised carve-out on the supply
        side and this one on the development side, and says of this one only that the
        **development** is not a commercial activity. Article 3(22) makes the **supply** the thing
        that has to be in the course of a commercial activity: \"the supply of a product with
        digital elements for distribution or use on the Union market in the course of a commercial
        activity, whether in return for payment or free of charge\". A not-for-profit constituted
        exactly as the proviso requires, which develops free and open-source software and then sells
        it, or sells support above cost, answers this question truthfully \"yes\" - and while the
        limb closed the gate that answer returned `does-not-apply` and dropped every item of every
        checklist that names this gate, for a product the Regulation still reaches. Recital 15's
        first characterisation catches that supply, and `in-the-course-of-a-commercial-activity` is
        where it is asked. **A skipped check is indistinguishable from a passed one**, so that was
        the understating direction, which this gate does not tolerate. **The demotion is the
        treatment this gate already gives the same shape twice, and the reasoning is
        `donations-accepted-without-the-intention-of-making-a-profit`'s in its own words**: a
        project can accept donations with no profit intention and still charge a price, so a \"yes\"
        removes one ground for calling the supply commercial and leaves the others standing.
        `fee-charged-solely-to-recover-actual-operating-costs` is `never` for the same reason. This
        limb is the third of that kind: a \"yes\" takes the circumstances of development out of the
        reckoning and takes no other ground out with them, so the reader carries it to
        `in-the-course-of-a-commercial-activity` and not out of the Regulation. **The alternative
        repair was to add the supply-side condition to the question, and it is recorded here as
        rejected so that it is not tried again.** It would fold the whole of Article 3(22)'s
        commercial-activity test - `in-the-course-of-a-commercial-activity` and the five Recital 15
        characterisation limbs under it - into one question, which is a second copy of something two
        places would then have to agree on; and a compound question records \"not free and
        open-source\", \"not a not-for-profit organisation\", \"earnings not applied to the
        objectives\" and \"supplied commercially anyway\" as one indistinguishable \"no\", which is
        the defect that was split out of `free-and-open-source-not-monetised-by-its-manufacturer`
        and `foss-component-for-integration-not-monetised` on 2026-07-29. Note the interaction with
        Recital 18's other sentences. How the development was financed does not decide the
        commercial question - the Recital says so in terms, \"the mere circumstances under which the
        product with digital elements has been developed, or how the development has been financed,
        should therefore not be taken into account when determining the commercial or non-commercial
        nature of that activity\", which is the development/supply distinction read from the other
        side - so a sponsorship page is not evidence here either way; and a foundation appearing
        among the copyright holders is not a signal at all, because the Free Software Foundation's
        own copyright notice sits inside the text of the GPL, AGPL and LGPL and so appears in every
        copyleft repository there is. **The question omitted Recital 18's free-and-open-source
        element until 2026-08-05, and the first sentence of this note had it right the whole time.**
        The Recital's sentence is confined to \"the development of products with digital elements
        **qualifying as free and open-source software** by not-for-profit organisations\"; the
        question asked only about the organisation and the earnings proviso, so a **proprietary**
        product developed by a not-for-profit answered \"yes\" and, on the exemption setting the
        limb then carried, closed the gate on a carve-out the Recital does not give it. One field of
        this limb therefore contradicted another, in the under-inclusive direction, and the element
        is restored from the Recital that this limb already cites. It is the same element
        `product-is-free-and-open-source-software` records separately for the two open-source
        exemptions, and a reader should answer that limb first. **Two of the three elements are in
        one question, with no separate limb recording which failed - a not-for-profit organisation,
        and the earnings proviso.** Name the failing element in the answer text. Same known residual
        as `public-administration-entity-own-use-only`. **What the demotion costs in the console,
        measured on 2026-08-05 and recorded because no other field carries it.** The scanner's
        console summary prints the question text only for open limbs whose `bears_on_verdict` is
        true, and lists the others by id alone on a context line. Demoting this limb set
        `bears_on_verdict` to false, so it left the `TO ANSWER` block and a person now sees the id
        `not-for-profit-development` with no question beside it. Nothing is lost from the JSON:
        `unresolved_limbs` filters on `state`, and the limb is still in it. But this limb is
        `decided_by: ask`, its answer exists only if somebody is asked for it, and the annotation
        this note relies on - a reader carrying a \"yes\" to
        `in-the-course-of-a-commercial-activity` - is the thing that may now go unmade. That is a
        different cost from the one `hosting-on-an-open-repository-alone` records, which is an
        answer no field reads; here the answer has somewhere to go and the question is what stops
        being shown. The direction is tolerated, because a demoted limb can lose an annotation and
        can never skip a check. **It follows from every demotion and not from this one**, so it
        stays here until the console prints questions for annotating limbs too."
    - id: regulation-2017-745-medical-devices-applies
      question: Is your product a medical device to which Regulation (EU) 2017/745 applies, counting
        software that is itself a medical device?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(2)(a)
        - CRA Recital 25
      note: "**The first of the ten limbs this gate now puts for Article 2's other seven paragraphs, and
        none of them was in this gate until 2026-08-04.** Until then the gate implemented the whole
        of Article 2(1)'s positive test and none of Article 2(2) to 2(8), so it could report that
        the Cyber Resilience Act reaches a product the Cyber Resilience Act excludes. The absence
        over-included, which is the tolerated direction, and it is closed rather than left as owed
        work. **What a \"yes\" does.** Article 2(2)(a) is a total exclusion: where Regulation (EU)
        2017/745 applies to the product, this Regulation does not, so no item of any checklist that
        names this gate is owed and the verdict is `does-not-apply`. It is not a lighter regime and
        it is not a deferral. **What it does not cover.** The test is whether Regulation (EU)
        2017/745 **applies to** the product, which is decided under that Regulation and not here -
        not whether the product is used in a hospital, sold to a clinic, or described as health
        software. Recital 25 is quoted beside this limb because it records that those rules reach
        \"medical devices that function through an electronic system or that are software
        themselves\" and that \"certain non-embedded software\" is covered too, so a small team
        shipping a symptom checker, a dosing calculator or an application that interprets a
        laboratory result is inside the population this limb exists for. Regulation (EU) 2017/745
        itself was not fetched by this gate and nothing here states what it says. **The question
        deliberately does not say \"or an accessory to one\".** The word \"accessory\" appears
        nowhere in the Cyber Resilience Act - searched, zero occurrences - so putting it in the
        question would import a term from an instrument this gate does not carry, into a limb that
        takes the product **out** of the Regulation when answered yes. Widening an exemption on an
        unquoted word is the under-inclusive direction, which this gate does not permit. The words
        the question does use, \"software that is itself a medical device\", are a paraphrase and
        not a quotation: what Recital 25 says is that essential requirements are laid down for
        \"medical devices that function through an electronic system or that are software
        themselves\". **This passage attributed that paraphrase to Recital 25 as its own words until
        2026-08-04**, and then quoted the different words that disprove the attribution, in the same
        sentence. **The two formulations are not the same, and this passage said they \"say the same
        thing\" until 2026-08-05**: Recital 25 names two kinds - \"medical devices that function
        through an electronic system\" **or** those \"that are software themselves\" - and the
        counting clause paraphrases only the second. The question is still neither widened nor
        narrowed, for a reason worth stating rather than assumed: the first kind is already inside
        the question's main clause, \"a medical device to which Regulation (EU) 2017/745 applies\",
        so the counting clause adds the second kind and takes nothing away. But the build's
        quotation check does not reach a `note` field, so a `note` is exactly where putting words in
        a law's mouth goes unchecked. **`decided_by: ask`, like every one of the ten limbs Article
        2's other paragraphs get.** Whether another Union instrument applies to a product is a fact
        about what the product **is** and what it is for. No collector decides it, no vocabulary in
        a repository evidences it, and this limb therefore declares no evidence category and no fact
        kind - deliberately, and it must not acquire one."
    - id: regulation-2017-746-in-vitro-diagnostics-applies
      question: Is your product an in vitro diagnostic medical device to which Regulation (EU) 2017/746
        applies, counting software that is itself such a device?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(2)(b)
        - CRA Recital 25
      note: "**Article 2(2)(b), and it is a separate instrument from Article 2(2)(a)'s.** Asked as its own
        limb so that a \"no\" records which of the two medical-device Regulations was rejected
        rather than recording both as one answer - the same reason the two open-source exemptions
        were split into element limbs on 2026-07-29. **What a \"yes\" does.** A total exclusion,
        exactly as for Article 2(2)(a): the Cyber Resilience Act does not apply, no item of any
        checklist that names this gate is owed, and the verdict is `does-not-apply`. **What it does
        not cover.** Whether Regulation (EU) 2017/746 applies to a product is decided under that
        Regulation, which this gate has not fetched and about which it states nothing. Recital 25
        records only that it lays down rules on in vitro diagnostic medical devices and that the two
        Regulations reach software. Asked and never inferred, and worded without the word
        \"accessory\", for the two reasons on `regulation-2017-745-medical-devices-applies` above."
    - id: regulation-2019-2144-motor-vehicles-applies
      question: Is your product a motor vehicle or a trailer, or a system, component or separate technical
        unit intended for such a vehicle, that Regulation (EU) 2019/2144 applies to?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(2)(c)
        - CRA Recital 27
      note: "**Article 2(2)(c), and the wording it uses is the point.** The exclusion runs to products
        with digital elements \"to which\" Regulation (EU) 2019/2144 applies. Whether anything has
        been certified, type-approved or assessed is irrelevant to this limb: the other instrument
        applying is the whole of the test. **The product classes in the question are an aid and not
        the test, and they were short by two until 2026-08-05.** The question read \"a vehicle, or a
        system or component of one\", which is Recital 27's shorter phrasing (\"the type-approval of
        vehicles, and of their systems and components\"); the Regulation's own title, recited at
        footnote (11) of this instrument, is \"type-approval requirements for motor vehicles **and
        their trailers**, and systems, components and **separate technical units** intended for such
        vehicles\", so a trailer and a separate technical unit were outside the question's nouns
        while inside Article 2(2)(c)'s test. The nouns now follow the title. Whether the other
        Regulation reaches a given product is decided under that Regulation and not here, for the
        reason given on `regulation-2017-745-medical-devices-applies`. **Read it against
        `certified-under-regulation-2018-1139-civil-aviation` below, which is deliberately not the
        same question.** Article 2(3) excludes products **certified in accordance with** Regulation
        (EU) 2018/1139. So an uncertified aeronautical product stays inside this Regulation while a
        vehicle system inside Regulation (EU) 2019/2144's scope is out whether or not any
        certificate exists. Collapsing the two into \"vehicles and aircraft are out\" states the
        aviation half wider than the Regulation does, and that asymmetry is in Article 2 and in
        Recital 27's closing sentence alike. **What a \"yes\" does.** A total exclusion: the verdict
        is `does-not-apply` and no item of any checklist that names this gate is owed. **What it
        does not cover.** Recital 27 says Regulation (EU) 2019/2144 establishes requirements for the
        type-approval of vehicles and of their systems and components; it does not tell a reader
        which products those are, and this gate has not fetched that Regulation. Asked and never
        inferred."
    - id: certified-under-regulation-2018-1139-civil-aviation
      question: Has your product been certified in accordance with Regulation (EU) 2018/1139, the Union's
        civil aviation Regulation?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(3)
        - CRA Recital 27
      note: "**Certification is the test, and this is the one paragraph of Article 2 where that is so.**
        Article 2(3) excludes products with digital elements \"that have been certified in
        accordance with Regulation (EU) 2018/1139\". A product that instrument could reach, but
        which has not been certified under it, is not excluded by this paragraph, and answering this
        limb \"yes\" because a product is aviation software would state the exclusion wider than the
        Regulation does. Recital 27 gives the reason in the Regulation's own words: it is \"the
        certification process under Regulation (EU) 2018/1139\" that \"ensures the level of
        assurance aimed for by this Regulation\". **What a \"yes\" does.** A total exclusion: the
        verdict is `does-not-apply` and no item of any checklist that names this gate is owed.
        **What it does not cover.** Regulation (EU) 2018/1139 was not fetched by this gate. What
        counts as certification in accordance with it, and who may certify, are questions for that
        Regulation. Asked and never inferred: a certificate is a document about the product, and no
        repository holds it."
    - id: within-the-scope-of-directive-2014-90-marine-equipment
      question: Is what you supply equipment that falls within the scope of Directive 2014/90/EU on marine
        equipment?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(4)
        - CRA Art. 2(4), footnote (36)
      note: "**Article 2(4), and it is the only exclusion in Article 2 with no recital behind it.** The
        preamble was searched for one expressly and there is none; the only support anywhere in the
        instrument is footnote (36), which gives the Directive's title. Both are quoted, and the
        limb's question can offer a reader nothing more than that title. **Note the noun, because
        Article 2(4) does not use the Regulation's usual one.** This one excludes \"equipment\" that
        falls within the scope of Directive 2014/90/EU, where paragraphs 1, 2, 3 and 5 speak of
        \"products with digital elements\". **This sentence read \"every other paragraph of Article
        2 speaks of products with digital elements\" until 2026-08-05, and three paragraphs are
        counter-examples**: Article 2(6) excludes \"spare parts\" and uses the usual noun only for
        the host whose components they replace, Article 2(7)'s second limb excludes bare \"products
        specifically designed to process classified information\", and Article 2(8) names no product
        at all. Article 2(4) is one of several paragraphs with a different noun and not the only
        one; what it shares with them does not weaken the point, which is that the noun here is
        \"equipment\". The difference is in the Official Journal text. What it means for a product
        that is software alone is a question for a reader of that Directive, which this gate has not
        fetched. **What a \"yes\" does.** A total exclusion: the verdict is `does-not-apply` and no
        item of any checklist that names this gate is owed. **This limb cites two things and no
        recital, because there is no recital to cite.** An earlier draft of it carried Recital 25 as
        a third citation on the ground that the recital shows the general shape of a sectoral
        instrument displacing this one. Recital 25 says nothing about marine equipment, and citing a
        provision on a limb it does not support is the imprecision this gate has already been
        criticised for elsewhere, so it was removed. Asked and never inferred."
    - id: excluded-by-a-delegated-act-under-article-2-5
      question: Has the Commission adopted a delegated act under Article 2(5) that excludes this
        Regulation's application to products of your kind, because those products are covered by
        other Union rules laying down requirements that address all or some of the risks covered by
        the essential cybersecurity requirements set out in Annex I?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(5)
      note: "**This limb asks about exclusion alone. The limb below asks about limitation. They were one
        question reading \"limits or excludes\" until 2026-08-04, and that was a defect of the kind
        this gate treats as intolerable.** Article 2(5) says the application of this Regulation
        \"may be limited or excluded\", and only the exclusion branch takes a product out. With both
        branches in one question and `closes_gate_when: \"true\"` on it, a manufacturer whose
        products a delegated act merely **limits** answered truthfully \"yes\", the gate returned
        `does-not-apply`, and all ten items of `cra-product-information-13-8` - nine Annex II points
        and Article 13(8)'s support-period floor - were dropped for a product the Regulation still
        reaches. **The earlier version of this note described that outcome and asked the person
        answering to compensate for it in prose. Documenting an under-inclusive verdict does not
        make it permissible**, because a dropped checklist is indistinguishable from a passed one.
        The two branches are asked as two limbs because they have two different answers. **What a
        \"yes\" here does.** A total exclusion: the verdict is `does-not-apply` and no item of any
        checklist that names this gate is owed. Answer yes only where a delegated act adopted under
        Article 2(5) **excludes** this Regulation's application to products of your kind, and name
        that act in the finding. Answering \"yes\" on a suspicion that some sectoral rule covers the
        same ground, with no delegated act named, deletes a duty that exists. **What to do where the
        act only limits.** Answer \"no\" here, and answer the limitation limb below, which records
        the act and its extent without closing the gate. **A standing open condition, and these two
        limbs are the only ones in this gate whose answer can change while the product does not.**
        Article 2(5) is not itself an exclusion: it empowers the Commission to adopt delegated acts
        under Article 61 specifying whether the limitation or exclusion is necessary, which products
        and rules are concerned, and how far it goes. So this limb asks about the delegated acts as
        they stand on the day the scan runs, and it cannot be answered once and frozen. **The two
        conditions are the article's, and the article governs.** The limitation or exclusion must be
        consistent with the overall regulatory framework applying to those products, **and** the
        sectoral rules must achieve \"the same or a higher level of protection\" as this Regulation.
        **The question's own trigger clause is the article's too, as of 2026-08-05.** It read
        \"because other Union rules already address the same cybersecurity risks\", where Article
        2(5) reaches products \"covered by other Union rules laying down requirements that address
        **all or some** of the risks covered by the essential cybersecurity requirements set out in
        Annex I\". \"The same risks\" is narrower than \"all or some of\" them, and the clause now
        carries the article's words. What a reader may answer \"yes\" on is unchanged and is not
        that clause: an adopted delegated act that excludes, named in the finding, is still the
        whole of the test. **ONE DELEGATED ACT HAS BEEN ADOPTED UNDER ARTICLE 2(5), AND IT
        EXCLUDES.** Commission Delegated Regulation (EU) 2025/1535 of 29 July 2025, published as OJ
        L, 2025/1535 of 29 October 2025, is the first exercise of the power. **IT HAS APPLIED SINCE
        18 NOVEMBER 2025, AND NOT BEFORE.** Its Article 2 provides that it enters into force on the
        twentieth day following that of its publication in the Official Journal and sets no separate
        date of application, and the twentieth day after 29 October 2025 is 18 November 2025. The
        date is written here because a scan asks about a product's history as well as its present:
        Article 69(2) of Regulation (EU) 2024/2847 turns on when a product was placed on the market,
        so a \"yes\" on this limb has to be a \"yes\" for the period it is claimed for. Its Article
        1 excludes the application of Regulation (EU) 2024/2847 for products with digital elements
        falling within the scope of Regulation (EU) No 168/2013 - the Regulation on the approval and
        market surveillance of two- or three-wheel vehicles and quadricycles, which recital (2) of
        the delegated act calls the L-category vehicles - and then withholds that exclusion from L1e
        category vehicles designed to pedal, referred to in Article 3, point (94)(b), of that
        Regulation, which the exclusion therefore does not reach. It excludes rather than limits, so
        it belongs to this limb and not to the one below. Answer \"yes\" here where what you supply
        is a product with digital elements falling within the scope of Regulation (EU) No 168/2013
        other than a pedal-designed L1e vehicle, and name the act. The act is named rather than
        quoted: the limb needs to know which act exists, and this gate's quotes are of the
        Regulation whose scope it tests. **The record is dated 2026-09-07 and the list is not
        closed.** A reader must check the delegated acts adopted since that date rather than read
        this note as the whole of them, which is what makes this limb and the one below the only two
        whose answer can change while the product does not. Asked and never inferred; no repository
        holds the Official Journal."
    - id: limited-but-not-excluded-by-a-delegated-act-under-article-2-5
      question: Has the Commission adopted a delegated act under Article 2(5) that limits, without
        excluding, this Regulation's application to products of your kind?
      decided_by: ask
      closes_gate_when: never
      quote_ref:
        - CRA Art. 2(5)
      note: "**Article 2(5)'s other branch, added 2026-08-04, and it takes no product out of the
        Regulation.** A delegated act that limits the application of this Regulation leaves the
        product inside it and narrows what applies. That is why this limb is `closes_gate_when:
        never`: marking it as an exemption would switch a whole instrument off on an act that
        removed nothing, which is the under-inclusive direction this gate does not permit - the same
        reason `information-whose-disclosure-would-be-contrary-to-national-security` annotates.
        **What a \"yes\" changes.** The verdict is untouched and every item of the checklists that
        name this gate is still reported. What the finding must carry is which delegated act was
        relied on, which products and which sectoral rules it names, and **how far the limitation
        goes** - Article 2(5)'s closing subparagraph empowers the Commission to specify \"the scope
        of the limitation, if relevant\". Where that scope reaches the Article 13 information
        duties, say which of the ten items it bears on and say that the Regulation's application to
        them is limited to the extent of that act. Never write that the product is outside the
        Regulation: that is the limb above, and it asks a different question. **Why this is a
        question and not a sentence in the exclusion limb's note.** A limitation is a real thing
        that a real delegated act can do, and a question nobody is asked is a fact nobody records.
        The gate has one answer per limb and cannot record \"partly\", so \"partly\" is given its
        own limb rather than being folded into a yes on a limb that closes the gate. **The one
        delegated act adopted under Article 2(5) as of 2026-09-07 excludes rather than limits**, so
        it is recorded on the exclusion limb above and not here: Commission Delegated Regulation
        (EU) 2025/1535, which has applied since 18 November 2025 - the twentieth day after its
        publication in OJ L, 2025/1535 of 29 October 2025, its Article 2 setting no separate date of
        application - takes products with digital elements within the scope of Regulation (EU) No
        168/2013 out of this Regulation, other than L1e category vehicles designed to pedal, and it
        narrows nothing for a product that stays inside this Regulation. A \"yes\" here therefore
        rests on a later act. This limb degrades with time exactly as the exclusion limb does: the
        record above is dated, and silence must not be read as \"none adopted\". Asked and never
        inferred; no repository holds the Official Journal."
    - id: spare-part-replacing-an-identical-component
      question: Is what you supply a spare part, made available on the market to replace an identical
        component in products with digital elements, and manufactured to the same specifications as
        the component it replaces?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(6)
      note: "**Article 2(6), and it is much narrower than \"a replacement part\".** Three conditions have
        to hold together: the part is made available on the market **to replace identical
        components** in products with digital elements, and it is **manufactured according to the
        same specifications** as the component it is intended to replace. A part that improves on
        what it replaces, or that replaces something similar rather than identical, is outside this
        paragraph and the Regulation continues to reach it. **What a \"yes\" does.** A total
        exclusion: the verdict is `does-not-apply` and no item of any checklist that names this gate
        is owed. **Where a \"no\" leaves things.** Answering \"no\" says only that this route out is
        unavailable; it says nothing about any other limb, and it is not a finding against the
        product. Asked and never inferred. Nothing in a repository states that what it builds is
        supplied as a replacement for an identical component of somebody else's product."
    - id: developed-exclusively-for-national-security-or-defence
      question: Was your product developed or modified exclusively for national security or defence
        purposes, or specifically designed to process classified information?
      decided_by: ask
      closes_gate_when: "true"
      quote_ref:
        - CRA Art. 2(7)
      note: '**Two routes in one paragraph, and only the first carries "exclusively".** Development or
        modification **exclusively** for national security or defence purposes is one route; a
        product **specifically designed** to process classified information is the other, and the
        second does not use the word exclusively. Both are quoted in Article 2(7) above. **What a
        "yes" does.** A total exclusion: the verdict is `does-not-apply` and no item of any
        checklist that names this gate is owed. **What it does not cover, and this is where a "yes"
        is most likely to be wrong.** A product built for a general market and also sold to a
        defence ministry meets neither route: the first fails on "exclusively", and the second asks
        what the product was designed for rather than who buys it. Handling data that happens to be
        sensitive is not the same as being specifically designed to process classified information.
        **Two elements in one question, with no separate limb recording which failed** - the same
        known residual as `public-administration-entity-own-use-only` and
        `not-for-profit-development`. Name the failing element in the answer text. Asked and never
        inferred, and this limb in particular must never acquire a fact kind: a vocabulary search
        for the words "defence" or "classified" in a tree would answer a question about who a
        product was built for from words a product happens to contain.'
    - id: information-whose-disclosure-would-be-contrary-to-national-security
      question: Would supplying any of the information the checklists that name this gate ask about
        disclose something contrary to the essential interests of a Member State's national
        security, public security or defence?
      decided_by: ask
      closes_gate_when: never
      quote_ref:
        - CRA Art. 2(8)
      note: "**Article 2's eighth paragraph, and the only one that is about the checklist that names this
        gate, `cra-product-information-13-8`, in particular.** It is not an exclusion from scope.
        Article 2(2), 2(3), 2(4), 2(6) and 2(7) say which products the Regulation does not reach,
        and Article 2(5) is the power to adopt a delegated act limiting or excluding application,
        only the exclusion branch of which says so; Article 2(8) says that the obligations it does
        lay down \"shall not entail the supply of information the disclosure of which would be
        contrary to the essential interests of Member States' national security, public security or
        defence\". The product stays inside the Regulation; what a particular obligation entails is
        qualified. **That is why this limb is `closes_gate_when: never`.** Marking it as an
        exemption would take the whole instrument off a product on a paragraph that removes no
        product from it, which is the under-inclusive direction this gate does not permit. **What a
        \"yes\" changes.** The checklists that name this gate walk items of information and ask
        whether each is supplied; `cra-product-information-13-8` - the only one naming it as of
        2026-08-04 - walks ten, nine of them Annex II points and the tenth Article 13(8)'s
        support-period floor. Where the answer here is \"yes\", the finding must name which item or
        items it bears on and say that the Regulation's obligations do not entail supplying that
        particular information - not that the item is satisfied, and not that the item is absent. A
        blanket \"yes\" against all ten is almost certainly wrong: the paragraph is about particular
        information whose disclosure would be contrary to those interests, not about a kind of
        supplier. **Why a limb and not an `applicability_note` on the items.** There are ten items.
        A note would have to be repeated on each of them, which is the drifting-copy defect the
        `cra-product-information-13-8` checklist was corrected for repeatedly, or placed on one of
        them arbitrarily, which hides the paragraph from the other nine. One limb is one statement,
        it sits in the list that now carries every other paragraph of Article 2, and it reaches the
        reader in a parsed field rather than in a comment. Asked and never inferred: nothing in a
        repository states what a Member State's essential security interests are."
    - id: placed-on-the-market-before-11-december-2027
      question: Had the product already been placed on the market before 11 December 2027?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 3(21)
        - CRA Art. 3(30)
        - CRA Art. 69(2)
        - CRA Art. 71(2)
      evidence_categories:
        - provenance
      code_evidence:
        supports:
          - release_history
      note: "**Renamed and reworded on 2026-07-29 from
        `requirements-attach-only-on-substantial-modification`, because the old question fused a
        fact with its legal consequence.** It read \"Was the product placed on the market before 11
        December 2027, **so that** the requirements attach only on a substantial modification made
        from that date?\", and a reader could not record the fact without also asserting the Article
        69(2) conclusion. The question is now the fact alone; the consequence is here. **The
        consequence, in three cases and not two.** The question asks a fact as of the day the scan
        runs; Article 69(2) turns on a fact as of 11 December 2027. Those differ, and reading a
        \"no\" as though they were the same was an error corrected on 2026-07-29. **Which checklists
        this reaches, corrected on 2026-11-11 (checker L, D3).** The gate is spliced into four
        checklists: `cra-product-information-13-8` (Article 13(18) and Annex II),
        `cra-sbom-annex-i-ii-1` (Annex I Part II point (1)), `cra-annex3-important-products` (Annex
        III, read with Articles 7 and 32) and `cra-reporting-readiness-14` (Article 14). Everything
        below about Article 69(2), the substantial-modification sentences and wording a finding as
        preparation is for the first three. **For `cra-reporting-readiness-14` none of it applies**:
        Article 14 applies from 11 September 2026 (Article 71(2), second subparagraph), and Article
        69(3) reads \"By way of derogation from paragraph 2 of this Article, the obligations laid
        down in Article 14 shall apply to all products with digital elements that fall within the
        scope of this Regulation that have been placed on the market before 11 December 2027\", so
        its findings are worded as readiness for a duty that applies today, to products already on
        the market too, whatever this limb's answer. This note said until 2026-11-11 that the gate
        was spliced into Article 13(18) and Annex II only and that \"Article 14 is a different row,
        and this gate neither quotes nor tests it\"; the gate quotes Article 71(2)'s Article 14 date
        and Article 69(2), and the Article 14 checklist was handed both sentences. **For the first
        three, the consequence in three cases, and it differs for software and hardware.** Placing
        on the market refers \"to each individual product, not to a type of product, and whether it
        was manufactured as an individual unit or in series\" (the Commission's guidance on the
        application of the Regulation, C(2026) 5252 final of 27.7.2026, Annex, paragraph 11, citing
        the Blue Guide, https://ec.europa.eu/newsroom/dae/redirection/document/131456, read
        2026-11-11; the Commission's reading, not the text), and Recital 38 says the essential
        requirements \"apply to each individual product with digital elements when placed on the
        market, irrespective of whether the product with digital elements is manufactured as an
        individual unit or in series\". A standalone software product is placed on the market once,
        when first supplied, and a substantially modified version is placed anew; variants such as
        builds for different operating systems are distinct products (guidance paragraphs 13 to 15).
        A hardware product is placed unit by unit, and units of a type designed before the date and
        placed on the market after it must comply (guidance paragraph 33). (1) **Yes - the product
        is already on the market.** Standalone software already released: Article 69(2) means the
        requirements attach to it only from a substantial modification made on or after 11 December
        2027, and the honest sentence in a finding is *\"these requirements attach to this software
        when it is next substantially modified on or after 11 December 2027, and to any new product
        or variant first released from that date\"*. Hardware: the units already placed are covered
        by Article 69(2), and **every unit placed on the market from 11 December 2027 must comply**,
        whether or not the model changes, so the honest sentence is *\"every unit placed on the
        market from 11 December 2027 must meet these requirements\"*. Until 2026-11-11 this case
        gave the substantial-modification sentence for every product already on the market, which is
        wrong for a device or firmware team (checker L, D4). (2) **No, and it is expected to be
        released before 11 December 2027.** This is the ordinary case for software under development
        today: it will have been placed on the market before that date, so Article 69(2) governs it
        and the software sentence of case (1) is the right one, not *\"from 11 December 2027\"*. For
        hardware, case (1)'s hardware sentence. (3) **No, and it is not expected to be on the market
        by 11 December 2027.** Only here is the plain sentence *\"from 11 December 2027\"* right for
        software; for hardware it is right in every case for the units placed from that date. The
        note prescribed the plain sentence for every \"no\" until 2026-07-29, which states an
        earlier start date than the law gives for the commonest kind of unreleased product. Article
        3(21) fixes what \"placed on the market\" means: the **first** making available on the Union
        market. **Where the date 11 December 2027 comes from, quoted for the first time on
        2026-08-04.** Article 71(2) is the provision that fixes it: this Regulation \"shall apply
        from 11 December 2027\", with Article 14 from 11 September 2026 and Chapter IV (Articles 35
        to 51) from 11 June 2026. Article 13 is in neither exception, so every item of
        `cra-product-information-13-8` takes the general date. Until that quote was added, the date
        appeared in this note and in `when_unresolved`, both now in this gate, and in one item's
        `applicability_note` in the `cra-product-information-13-8` checklist, with no provision
        behind it anywhere - it was carried only inside the Article 69(2) quote's own words, which
        is where the number happened to survive. **Article 71(2) has no limb of its own, and that is
        a decision rather than an oversight.** A limb asks a question about this product that a
        person can answer, and the answer can differ from one product to the next; the date on which
        the Regulation begins to apply is the same for every product, every party and every scan,
        and turns only on the calendar. There is nothing for a person to answer and nothing a tree
        could evidence. What Article 71(2) changes is how a finding must be worded - for the three
        checklists whose duties apply from 11 December 2027, as preparation, never as present
        non-compliance; for `cra-reporting-readiness-14`, as a duty that applies today - which is
        prose, and it is stated here and in `when_unresolved`, both in this gate, and on the item of
        the `cra-product-information-13-8` checklist that turns on it. Article 69(2), by contrast,
        does ask a question about the product, and that is this limb. Article 3(30) fixes what a
        substantial modification is, and note that it is not \"a big change\": it is a change that
        affects compliance with the Annex I Part I essential requirements, or that modifies the
        intended purpose for which the product has been assessed. **The limb is `closes_gate_when:
        never`, and that is not the same as the law.** As a matter of law Article 69(2) would let
        this limb decide: until a substantial modification is made on or after 11 December 2027, no
        Article 13(18) or Annex II duty attaches to a product already on the market. Marking it
        `never` means the product reports an unattached duty as a live finding, deliberately, for
        the stated asymmetry reason. The finding stands and the annotation carries the date. **It
        was unanswerable by the evaluator until 2026-07-29, and that was a measured fact rather than
        a guess.** Across six real repositories it could not be answered once: no collector emitted
        a release date, a version history or a first-publication fact. `release_history` - the
        earliest dated entry in a changelog - is now wired here. **Two limits on that fact, and both
        have to reach the reader.** A changelog date is the date of a **release**, which is not
        necessarily the date of a first making available on the Union market; Article 3(21) asks
        about the latter, and the tree can rarely tell them apart. And **the absence of a CHANGELOG
        must never be read as \"not yet on the market\"**: this limb carries no `opposes` kind and
        must keep it that way, because silence from a collector that looks only at changelogs says
        nothing about whether a product has been released. Where the fact is absent, a reader
        answers from a git tag, a copyright year or the project's own history. This limb named no
        kind before 2026-07-29 for a reason that was false and is corrected on
        `in-the-course-of-a-commercial-activity`. `copyright_holder` is deliberately not wired here,
        although its line usually carries a year: the kind's value is the holder, the year is
        incidental to it, and a copyright year is the year of authorship rather than of a first
        making available. The distinction is not academic: of those six repositories exactly one was
        not yet on the market, and it is the only one of the six for which the plain 11 December
        2027 date could be correct - and even for that one, only if it is still unreleased on 11
        December 2027."
    - id: who-the-duty-is-addressed-to
      question: Is the party this scan is about a manufacturer - under Article 3(13), or deemed one under
        Article 21 or Article 22?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 13(18)
        - CRA Art. 3(13)
        - CRA Art. 21
        - CRA Art. 22(1)
        - CRA Art. 22(2)
        - CRA Art. 3(30)
      evidence_categories:
        - provenance
      code_evidence:
        supports:
          - publisher_identity
          - copyright_holder
      note: "**This question annotates findings. It never removes one, and `closes_gate_when: never` is
        that decision in data.** Owner decision 2026-07-29, after eleven adversarial attacks on this
        limb in its earlier removing form: eight succeeded, and all eight ran the same way - a duty
        that genuinely existed disappeared without a word. Where in doubt, the duty exists: an
        unresolved answer here is recorded as unresolved and the finding stands. **Three routes, and
        Article 22 was named five times, across four prose fields, in what was then the
        `cra-product-information-13-8` checklist, and quoted nowhere until 2026-07-29.** Measured on
        one revision by parsing that file: `supporting_quotes[2].why`, `[3].why` (twice), `[5].why`
        and `when_unresolved`. This note said \"three times\" until the count was re-run, and it and
        `supporting_quotes[25].why` disagreed about whether the unit was a passage or an occurrence;
        both now give both numbers. Article 3(13): develops or manufactures the product, or has it
        made, **and** markets it under its name or trademark, **whether for payment, monetisation or
        free of charge** - the closing words were missing from this list until 2026-08-05, and they
        settle the commonest case in the audience of the checklists that name this gate, because
        giving the software away does not defeat the definition. Article 21: an importer or
        distributor that places the product on the market under its own name or trademark, **or**
        substantially modifies a product already placed on the market - deemed a manufacturer and
        made subject to Article 13 by name. Article 22(1): any other person who substantially
        modifies a product and makes it available. The steward and contributor questions are
        separate limbs beside this one, and a fourth limb -
        `importer-or-distributor-verification-duty` - carries the duties a plain importer or
        distributor has under Articles 19(2)(c) and 20(2)(b). **A \"no\" to all three is an
        annotation on every finding and removes nothing.** This note read *\"Only a 'no' to all
        three takes the party off this list\"* until 2026-07-29 - the removal power the owner took
        away, restated inside the note that records its removal, fourteen lines below the sentence
        saying the question never removes a finding. The consumer of these notes is an adjudicating
        agent, and that sentence is the shape eight of eleven adversarial attacks exploited. There
        is no list to be taken off: the items are reported either way, and what the answer changes
        is what the finding says about who carries the duty. **Article 22(2) limits the third route,
        and stating Article 22(1) without it overstates the duty.** A person deemed a manufacturer
        under Article 22(1) owes Articles 13 and 14 for the **part** of the product affected by the
        substantial modification, and for the entire product only where the modification affects the
        cybersecurity of the product as a whole. A finding against a substantially modified fork
        must say which of the two it asserts. **Order matters: test Article 3(13) and the deeming
        rules first.** Meeting any of them forecloses the steward route, because Article 3(14) is
        expressly \"other than a manufacturer\". **That ordering is a reader's step and the
        evaluator cannot perform it, which this note prescribed as though it could.** `assessScope`
        computes each limb's state from census facts filtered by kind and by nothing else: there is
        no ordering between limbs, no foreclosure, and no limb reads another limb's state. So the
        report can and does assert both at once. Both limbs are annotation-only, so no duty is
        dropped and what is produced is a contradictory annotation rather than a wrong verdict - but
        an adjudicating agent reading the two states as findings would write a contradiction into a
        report. **Read the ordering as an instruction to the person or agent answering, never as a
        property of the output**, and where both limbs come back `supported`, resolve the
        manufacturer question first and let the answer decide the steward one. **What the tree can
        and cannot say.** The `evidence_categories` here read `distribution` until 2026-07-29, on a
        limb whose own note recorded that distribution-shaped facts are properties of the *software*
        and not facts about the *operator*. That claim is withdrawn and replaced by `provenance`.
        Two of that collector's kinds are wired here as of 2026-07-29: `publisher_identity`, which
        is a package manifest's `author` or `publisher` block, and `copyright_holder`, which is the
        first copyright line in a licence file that is not the licence's own boilerplate. **The two
        kinds bear on different elements of Article 3(13), and this note conflated them.** The
        definition has two cumulative elements: the party develops or manufactures the product, or
        has it made; **and** markets it under its own name or trademark. `publisher_identity` bears
        on the **second** - a manifest's `author` or `publisher` block is the tree's nearest
        statement of the name the thing is put out under. `copyright_holder` bears on the **first**:
        a copyright line states who owns the copyright, which follows from authorship, and says
        nothing about marketing under a name or trademark. This note said \"those two lines are the
        tree's statement of it\" about the second element alone, which is wrong about one of the two
        kinds. **Neither kind alone establishes both elements, and a \"yes\" to this limb needs
        both.** The difference is not academic in the report: `copyright_holder` sorts before
        `publisher_identity`, so a copyright line is the first evidence a reader is shown. Measured
        2026-07-29 on the seven trees out of ten where this limb fires, the first evidence is a
        `copyright_holder` fact on all seven, and on three of the seven it is the **only** kind
        present, so the second element of Article 3(13) has no evidence at all behind a `supported`
        state. Both stay wired: the limb is annotation-only, so a wrong answer adds a sentence and
        can never remove a finding, and dropping either kind would take evidence away from a reader
        rather than describe it. The probe already excludes the Free Software Foundation notice and
        the `[fullname]` placeholders, which is the error that file corrected on **2026-07-29**, not
        2026-07-28 as this note said until the dates were re-run: measured across every revision of
        the `cra-product-information-13-8` checklist, \"Free Software Foundation\" first appears
        there in a revision and `[fullname]` in a later one, both on 2026-07-29, and neither appears
        in that file's two 2026-07-28 commits. The wiring is safe in the direction that matters
        **because this limb is annotation-only**: a wrong answer can add a sentence to a finding and
        can never remove one. That is exactly the risk profile the fork-and-clone limit below
        demands. This limb named no kind before 2026-07-29 for a reason that was false and is
        corrected on `in-the-course-of-a-commercial-activity`. `governance_document` is not wired
        here: a GOVERNANCE, MAINTAINERS or CODEOWNERS file is evidence about stewardship, and it
        goes to `open-source-software-steward`. **And a limit no collector can remove.** A fork, a
        vendored copy and a clone have byte-identical trees to upstream, so any test run over the
        tree returns **upstream's** answer and cannot identify the party running the scan. Read the
        answer as \"this is who the repository says the manufacturer is\", never as \"this is who
        you are\". That limit is the clearest reason this limb annotates and never removes."
    - id: importer-or-distributor-verification-duty
      question: Is the party this scan is about an importer within Article 3(16) - established in the
        Union, placing on the market a product with digital elements that bears the name or
        trademark of a natural or legal person established outside the Union - or a distributor
        within Article 3(17) - in the supply chain, other than the manufacturer or the importer,
        making a product with digital elements available on the Union market without affecting its
        properties - in either case without being deemed a manufacturer under Article 21?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 3(16)
        - CRA Art. 3(17)
        - CRA Art. 19(2)
        - CRA Art. 20(2)
        - CRA Art. 13(18)
        - CRA Art. 21
      note: "**Added 2026-07-29 because its absence under-included, which is the direction this gate does
        not permit.** A plain importer and a plain distributor - one that neither places the product
        on the market under its own name or trademark nor substantially modifies it, so Article 21
        does not deem it a manufacturer - answers \"no\" to all three routes on
        `who-the-duty-is-addressed-to`, is not a steward and is not a contributor. The gate then had
        nothing to say about it, while the Regulation puts duties about **the subject matter of
        `cra-product-information-13-8`** on it. **Both terms are defined, and this limb asserted
        them without quoting either until later the same day.** Article 3(16) and Article 3(17) are
        now quoted above and carried into the question, because the limb as first written was
        answered \"yes\" by any reseller anywhere and then prescribed a sentence asserting a duty on
        a party the Regulation may not reach. That is prose asserting a legal test, which the
        `cra-product-information-13-8` checklist names as its own prohibited category in its
        `scope_note`, and had corrected for Article 22(1) hours earlier. **What the elements are.**
        An importer must be **established in the Union**, and the product must bear the name or
        trademark of a person **established outside the Union**; a person who meets neither is
        outside Article 3(16) however much importing they do in ordinary speech. A distributor must
        be in the supply chain, must be neither the manufacturer nor the importer, and must make the
        product available **without affecting its properties** - which is also the boundary with
        Article 21, because affecting the properties to the point of a substantial modification
        within Article 3(30) is what makes the party a deemed manufacturer instead. **The question
        carried only two of the distributor's three elements until 2026-08-05**, dropping \"other
        than the manufacturer or the importer\", so a party that develops a product, markets it
        under its own name and also makes it available on the Union market could answer \"yes\" on
        the distributor half - which Article 3(17) excludes, and which the trailing \"without being
        deemed a manufacturer under Article 21\" does not repair, because Article 21 deems only
        importers and distributors to be manufacturers. The same sentence said \"such a product\",
        whose nearest antecedent carried the non-Union mark, which narrowed the distributor half to
        products bearing somebody else's foreign mark; it now says \"a product with digital
        elements\". One field of this limb contradicted the other, and the one that contradicted was
        the question. So answer this limb \"no\" for anyone the two definitions do not reach, and
        record which element failed. **What those duties are.** Article 19(2)(c): before placing the
        product on the market, an importer shall ensure that it is accompanied by the information
        and instructions to the user set out in Annex II, in a language which can be easily
        understood by users and market surveillance authorities. Article 20(2)(b): before making the
        product available on the market, a distributor shall verify that the manufacturer and the
        importer have complied with Article 13(15), (16), **(18)**, (19) and (20) and Article 19(4),
        **and have provided all necessary documents to the distributor** - naming by number the
        paragraph that makes Annex II binding. The closing element was dropped from this sentence
        until 2026-08-05, where `supporting_quotes[30].why` carried it. **Neither duty is the
        manufacturer's duty, and a finding must not say it is.** The importer ensures the
        information accompanies the product; the distributor verifies that others have complied.
        Neither authors the Annex II information. Where this limb is \"yes\", the sentence to write
        is that the party carries a checking duty about the same Annex II content that
        `cra-product-information-13-8` walks, and that the drafting duty sits upstream.
        **`closes_gate_when: never`, like every other limb about who a duty is addressed to.** Owner
        decision, 2026-07-29. A \"no\" here removes nothing, and neither does a \"yes\"; the answer
        annotates. No fact kind is wired: nothing in a tree states that the party imports or
        distributes somebody else's product, and the fork-and-clone limit on
        `who-the-duty-is-addressed-to` applies here with more force, because a redistribution's tree
        is upstream's tree."
    - id: open-source-software-steward
      question: Is the party this scan is about an open-source software steward within Article 3(14)?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Art. 3(14)
        - CRA Art. 13(18)
        - CRA Art. 24(1)
        - CRA Art. 24(2)
        - CRA Art. 24(3)
        - CRA Recital 19
      evidence_categories:
        - provenance
      code_evidence:
        supports:
          - governance_document
      note: "**A separate limb since 2026-07-29**, because the addressee question used to offer a four-way
        choice - manufacturer, deemed manufacturer, steward, contributor - as a single yes or no,
        and an answer of \"no\" could not say which of the four had been rejected. **Four cumulative
        elements, and record which one fails**: a legal person, which rules out an unincorporated
        individual maintainer; other than a manufacturer, so `who-the-duty-is-addressed-to` is
        tested first and a \"yes\" there forecloses this; the purpose or objective of systematically
        providing support on a sustained basis for the development of specific products **with
        digital elements**, qualifying as free and open-source software and intended for commercial
        activities; and that it **ensures the viability** of those products. The fourth is the one
        that gets dropped. **\"Tested first\" is an instruction to the person or agent answering,
        and not something the evaluator does.** `assessScope` computes every limb independently from
        census facts filtered by kind, with no ordering and no cross-limb read, so this limb and
        `who-the-duty-is-addressed-to` can both report `supported` on one tree - and on ordinary
        trees they do. Nothing is removed by that - both limbs are annotation-only - but the
        contradiction is in the output, and a reader who takes two `supported` states as two
        established answers will write it into a finding. Resolve the manufacturer question first,
        by hand, and let its answer decide this one. Recital 19 is quoted for two sentences, and
        they run in opposite directions. The first widens the test where a reader would narrow it:
        stewards \"include certain foundations as well as entities that develop and publish free and
        open-source software in a business context, including not-for-profit entities\", so being a
        not-for-profit does not put a party outside Article 3(14). **The second narrows it, and this
        note gave it as a second widening until 2026-08-05.** The recital says the regime \"should
        **only** cover products with digital elements qualifying as free and open-source software
        that are ultimately intended for commercial activities, such as for integration into
        commercial services or into monetised products with digital elements\" - the operative word
        is \"only\", and the sentence excludes from the steward regime everything not ultimately
        intended for commercial activities rather than sweeping more in. **What counts as evidence
        is a governance document naming a stewarding entity for this product**, and
        `governance_document` is wired here as of 2026-07-29 **with a caveat that has to travel with
        it**. The probe matches GOVERNANCE, MAINTAINERS **and CODEOWNERS**, and a CODEOWNERS file is
        a GitHub review-routing file: one component library's assigns every path to three review
        teams, which routes pull-request reviews and evidences none of Article 3(14)'s four
        cumulative elements. **In practice the kind is a CODEOWNERS detector and almost nothing
        else.** Measured 2026-07-29 across 27 real repositories: 13 carry a CODEOWNERS file, and
        exactly one carries a GOVERNANCE or MAINTAINERS file at all - and that one is a vendored
        third-party library's `MAINTAINERS.md` inside a forum product, not a governance document for
        the product. So a `governance_document` fact here is a place to start reading, never an
        answer, and it is survivable as wiring only because this limb is annotation-only and can add
        a sentence but never remove a finding. **The clean fix is in the collector, not here**:
        split the probe so that GOVERNANCE and MAINTAINERS are the wired kind and CODEOWNERS is a
        separate unwired one. Until that is done this limb over-reads its own evidence in the same
        way `publishable_package` does, and says so. **A foundation appearing among the copyright
        holders is not a signal**, so `copyright_holder` is deliberately not wired here: the Free
        Software Foundation's own copyright notice sits inside the text of the GPL, AGPL and LGPL,
        so that phrase matches every copyleft repository there is, and a foundation in a copyright
        line evidences none of Article 3(14)'s elements. **This limb annotates and never removes**,
        like every other addressee limb. Where the answer is \"yes\", what the finding gains is a
        sentence about a different regime, not the deletion of the items: a steward carries
        **Article 24(1)**, a duty to put in place and document in a verifiable manner a
        cybersecurity policy fostering secure development and effective handling of vulnerabilities;
        **Article 24(2)**, a duty to cooperate with the market surveillance authorities at their
        request, and to provide that documentation to one on a reasoned request, in a language it
        can easily understand; and **Article 24(3)**, which applies Article 14(1) to a steward **to
        the extent that it is involved in the development** of the products, and Article 14(3) and
        (8) **to the extent that severe incidents having an impact on the security of products with
        digital elements affect the network and information systems it provides for that
        development**. **The qualifier on \"severe incidents\" was missing from this sentence until
        2026-08-05**, which read as though any severe incident on a steward's systems triggered
        Article 14(3) and (8); the paragraph reaches only an incident having that impact. All three
        paragraphs are quoted in this gate as of 2026-08-04. This note read \"and not this
        checklist's ten items\" - the ten items of `cra-product-information-13-8` - until
        2026-07-29, which is the removal power the owner took away written into the limb that
        annotates. The items are reported either way. **Those Article 24(2) and Article 24(3)
        sentences were deleted earlier on 2026-08-04 and restored the same day.** They were removed
        on the ground that the `cra-product-information-13-8` checklist, which then carried this
        limb, quoted neither paragraph, so five distinct legal propositions - including which
        paragraphs of Article 14 apply to a steward and how far - were being asserted in prose with
        no provision behind them. That ground was sound and the remedy was the wrong one: an
        independent legal check re-fetched the Official Journal, read Article 24 in full, and found
        every deleted proposition **true and a faithful compression of the text**. The rule this
        gate runs on is that a legal test must have its provision carried, which is an instruction
        to fetch the provision - deleting a correct statement because nobody fetched its source is a
        loss. Both paragraphs are now quoted and both are in this limb's `quote_ref`. **What a
        finding may still not do is state the content of Article 14.** Article 14(1), (3) and (8)
        are named by Article 24(3) and are quoted nowhere in this gate, so say which paragraphs
        reach a steward and how far, and never what those paragraphs require. Article 24 is **out of
        scope for this product's rule coverage** - a decided exclusion, with the stated reason that
        its addressee is stewards rather than app developers and that stewards face no
        administrative fines - and not, as this note said until 2026-07-29, an obligation nobody had
        got round to building. **That second reason is the coverage map's, and it is wider than
        Article 64(10) - which this note said in its own voice until 2026-08-05, and which the
        corrigendum of 2 July 2025 has since overtaken.** CORRECTED 2026-09-07: Article 64(10) was
        corrected by the corrigendum published as OJ L, 2025/90555 of 2 July 2025, which replaced
        the range in its chapeau. The consolidated text reads \"By way of derogation from paragraphs
        2 to 9, the administrative fines referred to in those paragraphs shall not apply to ... any
        infringement of this Regulation by open-source software stewards\". Paragraph 2 is inside
        the corrected range, and paragraph 2 is the tier covering non-compliance with Annex I and
        with \"the obligations set out in Articles 13 and 14\" - the tier reachable through Article
        24(3), which applies parts of Article 14 to a steward. **Until 2026-09-07 this note read the
        uncorrected range and said that the derogation reaches Article 64(3) to (9) and not Article
        64(2), which is the opposite of what the corrected paragraph provides.** Recital 120's
        closing sentence states the same proposition as the corrected article and now reads with it
        rather than against it, so the coverage map's sentence is neither an invention nor the
        recital's reading against the operative text. This changes no limb's answer here - it is the
        reason for a scope decision and not a test. Either way the reader-facing advice is the same:
        say \"this may be a steward's obligation under Article 24, which this product does not
        examine\", never \"no obligation\"."
    - id: contributor-to-software-not-under-their-responsibility
      question: Is the party this scan is about a person contributing source code to a product with
        digital elements qualifying as free and open-source software that is not under their
        responsibility?
      decided_by: either
      closes_gate_when: never
      quote_ref:
        - CRA Recital 18 (contributors)
        - CRA Art. 3(13)
      evidence_categories:
        - provenance
      note: "**A separate limb since 2026-07-29**, for the same reason as the steward limb: the four-way
        choice could not say which alternative had been rejected. **The question said \"free and
        open-source software\" and dropped \"products with digital elements qualifying as\" until
        2026-08-05.** Recital 18's last sentence reads \"who contribute with source code to
        **products with digital elements qualifying as free and open-source software** that are not
        under their responsibility\", and the shorter form reached contributors to anything openly
        licensed. Nothing turned on it - this limb is `closes_gate_when: never` and annotates - but
        it is the qualifying phrase Recital 18 attaches to every one of its carve-outs, and \"with
        digital elements\" was restored to `foss-component-for-integration-not-monetised` on the
        same date, on the reasoning that a gate which restores the words in one field and leaves
        them out of another holds two rules for one phrase. **There are two conditions and this
        passage named one until 2026-08-05.** The sentence reaches persons who contribute source
        code to \"products with digital elements **qualifying as free and open-source software**
        that are not under their responsibility\", so the products must qualify as free and
        open-source software as well as being outside the contributor's responsibility; naming only
        the second widened a route out to a contributor to proprietary software, where the sentence
        gives none. `supporting_quotes[37].why` named only the second as well, and both were
        corrected on the same date as the question above. A person who maintains the project,
        decides what ships and puts their name to the release is not a contributor in this sense,
        however much of the code somebody else wrote. Read it against Article 3(13): the way to
        reach this answer is that the party is not a manufacturer under Article 3(13) and is not
        deemed one under Article 21 or Article 22, so Article 13(18) is not addressed to it, and
        Recital 18's last sentence confirms that reading rather than creating it. **That is a
        statement about the addressee and not about the finding**: the items are reported either
        way, and a \"yes\" here adds to a finding the sentence that the party may not be the
        addressee, with the reason. Nothing here removes anything. **No fact kind is wired here, and
        the reason is the question rather than the collector.** The `provenance` collector's
        `publisher_identity` and `copyright_holder` are where a reader starts, and they are wired on
        `who-the-duty-is-addressed-to` as of 2026-07-29 - but there they support the proposition
        that the tree names a manufacturer, and a named publisher does not establish that some
        **different** party is a mere contributor. Wiring them here, in either direction, would be a
        fact about one party read as a fact about another. This limb also carries the limit that
        applies to every addressee limb: a clone has upstream's tree, so the tree answers for
        upstream and not for the party running the scan. **This limb annotates and never removes.**"
  when_unresolved: "**Record `unresolved` and name which limb was not settled. Never resolve a limb to
    a guess in either direction.** What follows is the reasoning behind the limbs above, in the
    order a reader works through them. Limbs are named by `id` throughout; this passage numbered
    them until 2026-07-29 and the numbers had stopped matching the array. **Is what this repository
    contains a product with digital elements?** (`is-a-product-with-digital-elements`.) Article 3(1)
    defines a software or hardware **product**; Article 3(4) defines \"software\" as the part of an
    electronic information system which consists of computer code. This gate read the two together
    inclusively - any repository containing computer code contains software, and that meets the limb
    - which was a choice made because reading a collector's silence as a \"no\" drops duties, and
    not a conclusion the definitions compel. **It went too far for software the manufacturer only
    runs itself, and since 2026-11-11 the question says so**: software that runs only on the
    manufacturer's servers and is reached through a browser is not, on that basis alone, a product
    (Recitals 11 and 12; the Commission's guidance C(2026) 5252, Annex, paragraphs 20 and 21 and
    Example 5, read 2026-11-11, https://ec.europa.eu/newsroom/dae/redirection/document/131456, which
    is the Commission's reading and not the text), and it is inside where it is the remote data
    processing solution of a product the manufacturer supplies (Article 3(2)). Article 3(1) also
    expressly reaches a component placed on the market separately, which Article 3(6) defines as
    software or hardware intended for integration into an electronic information system. Four
    code-existence kinds were wired to this limb on 2026-07-29 - `dependency`, `outbound_call`,
    `url_literal` and `host_literal` - so that the evidence answers the question the limb states
    rather than the supply limb's question. **Silence here is still not a \"no\"**: the limb carries
    no counter-evidence at all, so the evaluator cannot read it as one either. Since 2026-11-10 the
    kinds wired to it are what the code suggests and never settle the limb: whether what the
    repository holds is a product is the person's to answer. **Is something supplied for
    distribution or use?** (`supplied-for-distribution-or-use`.) A package manifest that is not
    marked unpublishable, a release step that runs, an installer, a mobile application bundle, a
    browser extension, a command-line entry point in a manifest, a browser-installable client - a
    web application manifest declaring `display: standalone` or `fullscreen`, a service worker
    registration, an install prompt. Software that installs onto a user's device from a browser is
    supplied for use as squarely as software installed from a store, and the audience this product
    is built for ships that way more often than it ships packages - with the line the Commission's
    guidance draws at local execution (paragraphs 20 and 21): a web application, progressive web
    apps included, reached only through a browser is not a product on that basis alone. **This gate
    read supply \"for use\" as covering giving somebody the use of software the manufacturer hosts
    from 2026-08-05 to 2026-11-11, and that counting rule is withdrawn**: it pointed every
    hosted-only service toward yes, where Recitals 11 and 12 and the guidance point the other way.
    Whether hosted software is a product is `is-a-product-with-digital-elements`'s question, and it
    now names the hosted-only case. This passage said \"a published package\" until 2026-07-29. The
    kind is `publishable_package`, and on a package.json it means only that npm's `private` flag is
    absent - measured on four real repositories, all three hits were ordinary monorepo workspace
    packages that nobody publishes. On the other six manifest formats the probe reads there is no
    such flag, and the fact means only that a manifest with a name exists. **Which shapes emit
    nothing, corrected 2026-07-29.** This passage claimed a library, an SDK, a server or a framework
    emits no distribution fact. That is false for most libraries: the probe reads package.json,
    Cargo.toml, composer.json, go.mod, pyproject.toml, setup.py and `*.gemspec`. What genuinely
    emits nothing is a tree with no supported manifest - a Maven or Gradle library, a bare server
    tree, a vendored component. A container **build** is not evidence of supply, because building an
    image is not a supply to anybody; it is emitted as `container_build_config` and no limb consults
    it. That is the whole of the reason, and it is not the reason this passage used to give: it said
    Recital 12 \"places outside this Regulation\" a service its provider hosts itself, which is too
    wide - a provider's hosted backend of a product it supplies is inside - and was corrected on
    2026-08-05 into a reading that was too narrow, corrected in turn on 2026-11-11 above. Recital 12
    conditions itself in its first sentence - cloud solutions are remote data processing solutions
    \"only if they meet the definition laid down in this Regulation\" - so the operative test stays
    Article 3(2). Within that test the Recital's worked example, introduced by \"For example\", puts
    a manufacturer's own cloud enabled functionality **inside** the scope, and the two cases it
    names as outside are a cloud service designed and developed outside a manufacturer's
    responsibility and a website that does not support a product's functionality. **This passage
    gave the inside half as an unconditional rule and the two outside cases as the only exclusions
    until 2026-08-05**, which turned an illustration into a closed rule; `supporting_quotes[22].why`
    was corrected on the same date and this field was not, so one file said two things. **A push to
    a registry is a different fact and the collector does emit it**: `docker push` and
    `docker/build-push-action` are matched and emitted as `release_automation`, which the supply

    separately. **And a limit no collector can remove**: a fork, a vendored copy and a clone all
    have byte-identical trees to upstream, so any test run over the tree returns upstream's answer
    and cannot by itself identify who is scanning. **Whatever the answer, get the date right in
    every finding, and it is not one date.** (`placed-on-the-market-before-11-december-2027`.)
    **First, which checklist the finding belongs to** (scoped on 2026-11-11, checker L, D3). For
    `cra-reporting-readiness-14`, Article 14 applies from 11 September 2026 (Article 71(2), second

    report that reads as though something is required today is wrong in the other direction for
    those three checklists, and this repository has already corrected one document for that error.
    The tree helps a little and cannot decide: `release_history`, the earliest dated entry in a
    changelog, is wired to this limb. A changelog date is the date of a release rather than of a
    first making available on the Union market, and **the absence of a changelog is never evidence
    that a product is not yet on the market** - the limb carries no `opposes` kind and must not
    acquire one. **The structural limits of this gate, stated so that a reader does not mistake a
    gap for an answer. There are three, and this passage stated one of them until 2026-07-29 while
    asserting that there were two.** **First, `does-not-apply` is unreachable from code** - and,
    since 2026-11-11, from the scan profile too; the end of this passage sets out the route a
    declaration had and why it went; read the two together. No limb in this gate carries an
    `opposes` kind, so the evaluator can never report a required limb as `opposed`; and the other
    route, an exemption limb reported `supported`, is closed because no exemption declares
    `code_evidence` at all. That is the intended direction, and it is bought deliberately: the route
    to `does-not-apply` that existed until 2026-07-29 ran through npm's `private` flag and produced
    a measured wrong answer on a real repository. What it costs is that **eleven** genuine routes
    out of the Regulation can only be established by a person, and that the strictly offline case in
    Article 2(1) cannot be expressed by this gate at all. Three of the eleven come from the recitals
    - Recital 16's public-administration sentence, Recital 18's not-monetised carve-out and its
    component carve-out. **This count was twelve until 2026-08-05**, when Recital 18's
    not-for-profit sentence was demoted from an exemption to an annotating limb because it speaks of
    the **development** and Article 3(22) makes the **supply** the thing that must be in the course
    of a commercial activity; see `not-for-profit-development`. The other eight come from Article 2
    and were added 2026-08-04 - seven from the five paragraphs that exclude, and an eighth from the
    exclusion branch of Article 2(5), which excludes nothing itself and empowers the Commission to
    adopt a delegated act that limits **or** excludes: Regulation (EU) 2017/745, Regulation (EU)
    2017/746 and Regulation (EU) 2019/2144 applying to the product (Article 2(2)(a), (b) and (c));
    certification in accordance with Regulation (EU) 2018/1139 (Article 2(3)); **equipment** falling
    within the scope of Directive 2014/90/EU (Article 2(4)); a delegated act **excluding**
    application (Article 2(5) - a delegated act that only limits application is a different limb and
    takes no product out); a spare part made available on the market to replace an identical
    component **and manufactured according to the same specifications as the component it is
    intended to replace** (Article 2(6)); and development exclusively for national security or
    defence purposes, or specific design to process classified information (Article 2(7)). **This
    list wrote Article 2(4) without its noun and Article 2(6) without its second condition until
    2026-08-05**: Article 2(4) excludes \"equipment that falls within the scope of Directive
    2014/90/EU\" and not every product that Directive reaches, and Article 2(6)'s two conditions are
    cumulative, so summarising it on the first alone made the exemption easier to claim than the
    paragraph allows. **This passage said \"four\" until 2026-08-04, when the eight were added**,
    and before that date the eight were in no field of the `cra-product-information-13-8` checklist
    at all - only in a YAML comment, which the parser strips. **Second, `unresolved` is unreachable,
    and this passage did not say so.** The verdict `unresolved` is produced only where **none** of
    the required limbs is settled. `on-the-union-market` is `decided_by: premise`, so the evaluator
    always records it as `settled-by-premise`, so at least one required limb is always settled and
    the `unresolved` branch is dead code. An earlier review recorded this and the rewrite documented
    the other half only. **Third - and this was true until the wiring of 2026-07-29 - `applies` was
    unreachable too, which made the gate a constant function.**
    `in-the-course-of-a-commercial-activity` is a required limb and named no fact kind, so it could
    never be settled, so `required.every(settled)` was never true. With `does-not-apply` and
    `unresolved` both unreachable, **`likely-applies` was the only output this gate could ever
    produce** - measured identically, with an identical `because` string, on five real repositories
    including one carrying 189 payment-provider facts and a Stripe checkout route. That count is a
    record of what the collector emitted on the day, before the kinds were divided by evidence
    checkability, and it does not reproduce against the collector as it now stands; the current
    numbers for the same repository are on `in-the-course-of-a-commercial-activity`. A verdict that
    cannot vary carries no information: a reader could not tell a project the gate examined and
    found strong evidence for from one it could barely see. That third limit is now lifted. Wiring
    `subscription_route` to that limb makes `applies` reachable - and it is what makes
    `likely-applies` mean something, because the two answers can now differ. **This passage carried
    a measured verdict list that two later changes falsified, and it is replaced by a run made on
    2026-07-30 against the file as it now stands.** What it said was that five trees returned
    `applies` and five `likely-applies`, each of the five naming the commercial-activity limb among
    its open questions and holding zero commercial facts. The second half of that was false when it
    was written: re-measured with no change to the collector, those five held 104, 19, 3, 2 and 1
    commercial facts. What is zero on those trees is the count **on this limb**, which is a much
    narrower statement, and the sentence told a reader the scan had found nothing commercial on a
    tree where it had found 104 lines they would want to open. Re-measured 2026-08-03, after the
    deciding kind was taught the other five languages' spelling of a billing call, over twenty-four
    real trees with no scan profile. `applies` on ten, each settled by a `subscription_route` call
    site in its own production code. `likely-applies` on the other fourteen, thirteen of them naming
    `in-the-course-of-a-commercial-activity` under TO ANSWER and one naming
    `supplied-for-distribution-or-use` instead. **Most of those fourteen hold commercial facts, and
    they are printed**, on `price-charged-for-the-product`, under a label saying the limb annotates
    and cannot decide the verdict. Two of them returned `applies` before the 2026-07-30 demotion and
    are the price it was bought at; six of them returned `applies` on evidence that did not bear on
    Article 3(22) at all, and are what it bought. **The list this passage carried on 2026-07-30
    named two trees among the price and three among the wrong verdicts removed, and both halves were
    partly wrong for the same reason**: `subscription_route` could only read JavaScript, so a Ruby
    billing service directory, a Python subscription router and two Node call chains the SDK spells
    differently were all invisible to the limb that decides. Two trees remain `likely-applies` and
    now for a stated reason - the only billing call either tree holds is a fenced code block in a
    documentation guide teaching a reader to integrate Stripe, which is a call site in the text and
    not this product charging a price. The line is still collected and still printed, as
    `commercial_documented`. **With a scan profile declaring `features.payments.present = false`,
    all twenty-four trees return exactly the verdict they return with no profile at all.** That is
    the 2026-08-03 correction measured: before it, **eighteen of the twenty-four** returned
    `applies` under that declaration while returning `likely-applies` without it. This figure was
    recorded first as ten and then as twenty; both were wrong, and it was re-measured on 2026-08-03
    by rebuilding the pre-repair evaluator from the parent commit and running both paths over all
    twenty-four trees. **`does-not-apply` acquired one route on 2026-07-29 and lost it on
    2026-11-11, and neither was a code route.** The limb carries `declared_by:
    features.payments.present`, and until 2026-11-11 a person who declared no payments over a tree
    holding **no commercial fact of any kind** had the required limb answered from the declaration
    and the verdict `does-not-apply`. That read a no to \"does the product take payments\" as a no
    to \"is the supply in the course of a commercial activity, whether in return for payment or free
    of charge\", which is a different and wider question, so a company's free product was told the
    Regulation does not reach it (checker L, 2026-11-11, D1). The same day the limb was rewired to
    `cra.commercial_activity`, a field that asks the limb's own question, so a yes and a no are both
    answers, and the three product limbs to their own fields the same way (the second round, item
    4): with a truthful answer to each, the gate reaches `applies` or `does-not-apply`, and with
    none it stays `likely-applies` with the questions listed. Where the declaration says no and the
    tree holds **any commercial fact**, the disagreement is still printed first, because whether the
    tree contradicts what the person said is a question about the answer and not about the limb.
    **That test read \"any fact of a kind able to settle the limb\" until 2026-07-30, which is a
    different and much narrower thing, and the difference was measured**: all seven trees of the
    twenty scanned on that date that held no fact of a settling kind returned `does-not-apply` on a
    single profile field while carrying commercial facts the report displayed two lines below a
    sentence saying nothing contradicted the declaration. **A contradiction settles nothing.** Until
    2026-11-10, where the disagreement held a billing call site the limb was settled by the tree,
    and where it held only annotating facts the limb stayed open. Since that date the code settles
    no fact about the product, so whatever the disagreement holds the limb stays open for the person
    and the verdict is `likely-applies`. While the state itself counted as settled (2026-07-30 to
    2026-08-03), **eighteen of twenty-four** trees returned `applies` - the instrument's strongest
    verdict - off a truthful declaration of no payments, each decided by a fact the same report
    labelled *\"annotation only - cannot decide the verdict\"* four lines lower. **Declaring that
    you take no payments must never make the verdict stronger than the same tree produces with no
    profile at all, and since 2026-11-11 it never makes it weaker either.** Declaring that you
    **do** take payments answers the commercial limb, which is movement toward the duty - see the
    `scope_note` of the `cra-product-information-13-8` checklist. So in this version the first limit
    above reads \"no limb in this gate carries counter-evidence from code, no exemption can be
    claimed from code, and no profile field can close a required limb\": `does-not-apply` comes back
    only when a person can record an answer to a required limb's own question or claim an exemption,
    which this version prints as questions and cannot yet record. The second limit stands unchanged,
    and a reader should treat `unresolved` as a verdict this gate does not emit rather than as one
    it has ruled out."

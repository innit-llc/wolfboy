    that still stands, never as a deletion of one. **These limbs annotate findings. They never
    remove one.** Hard rule, and it replaces a set of individually-worded guards that an adversarial
    pass took apart on 2026-07-29. The manufacturer, steward and contributor answers may **not** set
    the gate verdict to `does-not-apply`, set any item to `not-applicable`, or be the ground on
    which another limb writes a status. What they may do is add to a finding's reasoning that the
    party may not be the addressee, and name why. The items are still reported. The reason is the
    asymmetry: a duty reported to somebody who does not carry it costs them a paragraph of reply; a
    duty removed because a role was misjudged costs them a duty they never learn about, and the
    report looks identical to a clean one. **The steward answer is the sharpest case - Article 24 is
    out of scope for this product's rule coverage, a decided exclusion on the ground that its
    addressee is stewards rather than app developers, so routing a reader there hands them to
    nothing.** This passage called it an obligation nobody had got round to building until
    2026-07-29, which was the wrong description of a deliberate exclusion; the advice that follows
    is the same either way. Say \"this may be a steward's obligation under Article 24, which this
    product does not examine\", never \"no obligation\". **What to read, and what does not count.**
    For the deeming rules: is the release somebody else's software under this party's name, or a
    fork changed enough to be a substantial modification - noting that Article 3(30) makes that a
    change affecting compliance with the Annex I Part I essential requirements or modifying the
    assessed intended purpose, and not merely a large change. For the contributor case: does the
    party decide what ships and put their name to the release, as against sending patches to

    that is unreleased today but will be released before that date answers the limb \"no\" and is
    still governed by Article 69(2), so the substantial-modification sentence is the right one for
    it - which is the ordinary case for software under development now. Only software that is not
    expected to be on the market by 11 December 2027 gets the plain *\"from 11 December 2027\"*.

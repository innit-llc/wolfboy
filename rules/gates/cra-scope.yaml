    billing call site) is wired to `in-the-course-of-a-commercial-activity`; `payment_provider`,
    `hosted_checkout_link`, `subscription_route`, `price_identifier`, `licence_key_check`,
    `commercial_documented` and `monetary_amount_literal` to `price-charged-for-the-product`;
    `subscription_route` to `intention-to-monetise`; and `donation_link` to
    `donations-exceeding-costs`. **Seven kinds are deliberately kept off the limb that closes the
    gate and a reader should know why.** `price_identifier`, `licence_key_check`,
    `commercial_documented`, `monetary_amount_literal` and `donation_link` are all names, numbers,
    prose or donations rather than payment routes: Recital 15 does not name licence keys at all, it
    names donations only where they exceed the costs of design, development and provision, and an
    identifier called `priceId` or a bare `amount: 149` is a string that a documentation demo or
    somebody else's API mock produces as readily as a shop does. `payment_provider` and
    `hosted_checkout_link` joined them on 2026-07-30, on measured evidence recorded on the limb:
    across twelve previously unscanned repositories, 6 of the 8 `applies` verdicts were decided by
    those two kinds on an SVG filename, a markdown filename, a third-party API host and a security
    header inside a test fixture. All seven are still emitted and still shown, on limbs that are
    `closes_gate_when: never` and therefore annotate and decide nothing, and the console block
    labels such a limb `annotation only - cannot decide the verdict` so that the demotion is visible
    in the output. Separately, no `commercial` kind is wired to
    `paid-technical-support-beyond-cost-recuperation` or to
    `fee-charged-solely-to-recover-actual-operating-costs`, because those two limbs turn on what a
    fee is **for**, which no collector reads. **Three things Recital 15, Recital 16 and Recital 18
    put outside**: donations accepted without the intention of making a profit
    (`donations-accepted-without-the-intention-of-making-a-profit`, added 2026-08-04 - the gate

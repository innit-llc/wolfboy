    thing that has to be in the course of a commercial activity. A not-for-profit constituted as the
    proviso requires that develops free and open-source software and then sells it, or sells support
    above cost, therefore answers \"yes\" truthfully while supplying commercially, and the exemption
    returned `does-not-apply` over it. **None of the three among them that has a limb is an
    exemption limb, and the mere presence of regular releases has no limb at all**: that sentence
    qualifies the `release_automation` fact rather than putting a question to anybody, so counting
    it among \"the four\" put three limbs and one statement that is not a limb in one set. This
    passage read \"none of the four is an exemption limb\" until 2026-08-05; it was true as written,
    because a thing that is not a limb is not an exemption limb, and it is now said in a way a
    reader cannot take for a fourth limb. Each answers one statement in the recitals and not the
    whole commercial-activity limb: a project can accept donations with no profit intention and
    still charge a price, so a \"yes\" removes one ground for calling the supply commercial and
    leaves the others standing. **Where the software is free and open-source, two further routes out
    exist and only there.** Recital 18's carve-out for free and open-source software not monetised
    by its manufacturer (`free-and-open-source-not-monetised-by-its-manufacturer`, with the licence
    element recorded separately by `product-is-free-and-open-source-software`); and the rule that a
    free and open-source **component** intended for integration by other manufacturers into their
    own products with digital elements is made available on the market only if its original
    manufacturer monetises it (`foss-component-for-integration-not-monetised`, with its two
    remaining elements recorded separately by
    `component-intended-for-integration-by-other-manufacturers` and
    `component-monetised-by-its-original-manufacturer`). Reading the first as general was this
    gate's error until 2026-07-29; the second had no limb at all until then. Outside free and

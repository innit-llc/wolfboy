    three are routes that bring a project **in**. Read the tree for each: a checkout, subscription
    or billing route; a price or plan identifier; a paid support tier; a licence-key check; a
    payments dependency with a call site; a mandatory account whose data is processed for any reason
    other than exclusively for improving the software's security, compatibility or interoperability;
    a donations link. **Any one found: the code suggests the limb is met - cite the line and put it
    to the person, whose answer decides it. None found: the limb is not thereby \"no\"** - Recital
    15 says supply \"might be characterised\" by these and lists no closed set. **The tree now does

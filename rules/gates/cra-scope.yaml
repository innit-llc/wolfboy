gate_id: cra-scope
law: Regulation (EU) 2024/2847 (Cyber Resilience Act)
source_url: https://publications.europa.eu/resource/celex/02024R2847-20241120
applicability:
  question: "Does Regulation (EU) 2024/2847 reach what this repository contains - a product with
    digital elements within Article 3(1), whose intended purpose or reasonably foreseeable use
    includes a direct or indirect logical or physical data connection to a device or network, and
    which is made available on the market within Article 3(22), that is supplied for distribution or
    use on the Union market in the course of a commercial activity, whether in return for payment or
    free of charge - and, if it does, is the product taken back out by any of the exclusions in
    Article 2(2), 2(3), 2(4), 2(6) and 2(7), or by a delegated act adopted under Article 2(5) that
    excludes this Regulation's application to it, or is what applies to it merely limited, whether
    by such a delegated act or by Article 2(8)? And separately, for annotation only and never to
    remove a finding: is the party this scan is about a manufacturer, an open-source software
    steward, a person contributing source code to a product with digital elements qualifying as free
    and open-source software that is not under their responsibility, or an importer within Article
    3(16) or a distributor within Article 3(17) of somebody else's product?"
  quote: This Regulation applies to products with digital elements made available on the market, the
    intended purpose or reasonably foreseeable use of which includes a direct or indirect logical or
    physical data connection to a device or network.
  cite: CRA Art. 2(1)
  url: https://publications.europa.eu/resource/celex/02024R2847-20241120
  checked_at: 2026-07-29
  ask_the_user: true
  census_categories:
    - recipients
    - distribution
    - commercial
    - provenance
  supporting_quotes:
    - quote: "2. This Regulation does not apply to products with digital elements to which the following
        Union legal acts apply: (a) Regulation (EU) 2017/745;"
      cite: CRA Art. 2(2)(a)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**The first of Article 2's seven other paragraphs, and this gate carried none of them until
        2026-08-04.** Article 2(1) is the whole of the positive scope test. Article 2(2), 2(3),
        2(4), 2(6) and 2(7) take products back out of it; Article 2(5) empowers the Commission to
        adopt delegated acts that **limit or exclude** application, of which only the exclusion
        branch takes a product out; Article 2(8) takes no product out and limits what the
        obligations entail. A gate that tests the first and none of the rest can report that the
        Regulation reaches a product the Regulation excludes, which is what this one did on every
        scan it ever ran. **Why the chapeau is quoted with the point.** Point (a) on its own is a
        bare citation and states no test at all. What excludes the product is the chapeau - the
        Regulation \"does not apply to products with digital elements to which the following Union
        legal acts apply\" - so the chapeau and the point are quoted together, and the same is done
        for points (b) and (c) below. The Official Journal prints the three points as one contiguous
        list, and dropping the earlier points from the later quotes would leave a quotation that is
        not verbatim, so each of the three quotes runs from the chapeau to the point it is cited to.
        **The test is that the other Regulation applies to the product**, not that the product has
        been certified under it. Article 2(3) below is the paragraph where certification is the
        test, and the two are not the same question. **This gate does not carry Regulation (EU)
        2017/745 and says nothing about what it reaches.** The limb that rests on this quote is
        asked of the person running the scan, and the answer is found in that Regulation rather than
        in this gate or in any repository."
    - quote: "2. This Regulation does not apply to products with digital elements to which the following
        Union legal acts apply: (a) Regulation (EU) 2017/745; (b) Regulation (EU) 2017/746;"
      cite: CRA Art. 2(2)(b)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: The second point of Article 2(2), quoted from the chapeau for the reason given on Article
        2(2)(a) above. Regulation (EU) 2017/746 is a separate instrument from Regulation (EU)
        2017/745 and it is given its own limb, so that a "no" says which of the two instruments was
        rejected rather than recording both as one answer. **This gate does not carry Regulation
        (EU) 2017/746 and says nothing about what it reaches.**
    - quote: "2. This Regulation does not apply to products with digital elements to which the following
        Union legal acts apply: (a) Regulation (EU) 2017/745; (b) Regulation (EU) 2017/746; (c)
        Regulation (EU) 2019/2144."
      cite: CRA Art. 2(2)(c)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: The third point of Article 2(2), quoted from the chapeau for the reason given on Article
        2(2)(a) above. **The asymmetry with Article 2(3) is in the text and has to survive into
        every reading of it.** This point excludes products **to which** Regulation (EU) 2019/2144
        applies; Article 2(3) excludes products **certified in accordance with** Regulation (EU)
        2018/1139. A product inside the scope of Regulation (EU) 2019/2144 is out of this Regulation
        whether or not anything has been certified, while a product inside the scope of Regulation
        (EU) 2018/1139 is out only once it has been certified under it. Collapsing the two into "a
        vehicle or an aircraft is out" states the aviation half wider than the Regulation does.
        **This gate does not carry Regulation (EU) 2019/2144 and says nothing about what it
        reaches.**
    - quote: Regulation (EU) 2017/745 of the European Parliament and of the Council (9) lays down rules on
        medical devices and Regulation (EU) 2017/746 of the European Parliament and of the Council
        (10) lays down rules on in vitro diagnostic medical devices. Those Regulations address
        cybersecurity risks and follow particular approaches that are also addressed in this
        Regulation. More specifically, Regulations (EU) 2017/745 and (EU) No 2017/746 lay down
        essential requirements for medical devices that function through an electronic system or
        that are software themselves. Certain non-embedded software and the whole lifecycle approach
        are also covered by those Regulations. Those requirements mandate manufacturers to develop
        and build their products by applying risk management principles and by setting out
        requirements concerning IT security measures, as well as corresponding conformity assessment
        procedures. Furthermore, specific guidance on cybersecurity for medical devices is in place
        since December 2019, providing manufacturers of medical devices, including in vitro
        diagnostic devices, with guidance on how to fulfil all the relevant essential requirements
        set out in Annex I to those Regulations with regard to cybersecurity. Products with digital
        elements to which either of those Regulations apply should not therefore be subject to this
        Regulation.
      cite: CRA Recital 25
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Quoted so that the two medical-device limbs can name their subject without this gate
        asserting the content of an instrument it has not fetched.** Article 2(2)(a) and (b) cite
        Regulation (EU) 2017/745 and Regulation (EU) 2017/746 by number and say nothing about what
        they contain; a question that asks a developer \"does Regulation (EU) 2017/745 apply to
        you?\" with no handle is a question nobody can answer. This recital is the Regulation's own
        sentence naming them: rules on medical devices, and rules on in vitro diagnostic medical
        devices. **The sentence that matters most to the audience of the checklists that name this
        gate is the third.** Those Regulations lay down essential requirements \"for medical devices
        that function through an electronic system or that are software themselves\", and \"certain
        non-embedded software\" is also covered. So software alone can sit inside them, which is why
        this exclusion is real for a small team shipping a health application and not a remote
        industrial case. **The recital does not define either instrument's scope and neither does
        this gate.** Whether a particular product is a medical device is decided under Regulation
        (EU) 2017/745 or Regulation (EU) 2017/746, neither of which was fetched. Note also that the
        recital's own typography prints \"(EU) No 2017/746\"; the article text says \"Regulation
        (EU) 2017/746\"."
    - quote: 3. This Regulation does not apply to products with digital elements that have been certified
        in accordance with Regulation (EU) 2018/1139.
      cite: CRA Art. 2(3)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Certification, not scope, and that is the whole of the difference from Article 2(2).** The
        paragraph reaches products \"that have been certified in accordance with\" Regulation (EU)
        2018/1139. A product that Regulation (EU) 2018/1139 could reach, but that has not been
        certified under it, is not taken out by this paragraph. The limb's question is therefore
        about a certificate that exists, not about a field of activity. **This gate does not carry
        Regulation (EU) 2018/1139 and says nothing about what it reaches or about what its
        certification process involves.**"
    - quote: Regulation (EU) 2019/2144 of the European Parliament and of the Council (11) establishes
        requirements for the type-approval of vehicles, and of their systems and components,
        introducing certain cybersecurity requirements, including on the operation of a certified
        cybersecurity management system, on software updates, covering organisations' policies and
        processes for cybersecurity risks related to the entire lifecycle of vehicles, equipment and
        services in compliance with the applicable United Nations regulations on technical
        specifications and cybersecurity, in particular UN Regulation No 155 - Uniform provisions
        concerning the approval of vehicles with regards to cybersecurity and cybersecurity
        management system (12) and providing for specific conformity assessment procedures. In the
        area of aviation, the principal objective of Regulation (EU) 2018/1139 of the European
        Parliament and of the Council (13) is to establish and maintain a high uniform level of
        civil aviation safety in the Union. It creates a framework for essential requirements for
        airworthiness for aeronautical products, parts and equipment, including software, that
        includes obligations to protect against information security threats. The certification
        process under Regulation (EU) 2018/1139 ensures the level of assurance aimed for by this
        Regulation. Products with digital elements to which Regulation (EU) 2019/2144 applies and
        products certified in accordance with Regulation (EU) 2018/1139 should not therefore be
        subject to the essential cybersecurity requirements and conformity assessment procedures set
        out in this Regulation.
      cite: CRA Recital 27
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Quoted for the same reason as Recital 25: two limbs cite an instrument by number, and this
        is the Regulation's own sentence saying what those instruments are about** - type-approval
        of vehicles and of their systems and components for Regulation (EU) 2019/2144, and civil
        aviation safety, with a framework of airworthiness requirements for aeronautical products,
        parts and equipment including software, for Regulation (EU) 2018/1139. **The recital's
        closing sentence carries the asymmetry that Article 2 carries, and it is the reason the two
        limbs ask different questions**: products \"to which Regulation (EU) 2019/2144 applies\"
        **and** products \"certified in accordance with Regulation (EU) 2018/1139\". Scope on one
        side, certification on the other. **Neither instrument was fetched and this gate states
        nothing about their scope.** The recital's own reason for the aviation route is worth
        reading before answering that limb: it is \"the certification process under Regulation (EU)
        2018/1139\" that \"ensures the level of assurance aimed for by this Regulation\", so an
        uncertified aeronautical product is not taken out by Article 2(3)."
    - quote: 4. This Regulation does not apply to equipment that falls within the scope of Directive
        2014/90/EU of the European Parliament and of the Council (36).
      cite: CRA Art. 2(4)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Note the noun.** This paragraph excludes \"equipment\" that falls within the scope of
        Directive 2014/90/EU, where the paragraphs of Article 2 that carry the Regulation's own
        subject-matter noun - paragraphs 1, 2, 3 and 5 - speak of \"products with digital
        elements\". **This sentence read \"every other paragraph of Article 2\" until 2026-08-05,
        and on that date was narrowed to \"paragraphs 1, 2, 3, 5, 6 and 7\"; both were wrong,
        because Article 2(4) is not the only paragraph whose noun is something else.** Article 2(8)
        names no product at all: it says that \"the obligations laid down in this Regulation shall
        not entail the supply of information the disclosure of which would be contrary to the
        essential interests of Member States' national security, public security or defence\".
        Article 2(6) excludes \"spare parts\", and uses \"products with digital elements\" only for
        the host whose components those parts replace. And Article 2(7) excludes \"products with
        digital elements developed or modified exclusively for national security or defence purposes
        or to products specifically designed to process classified information\" - its second limb
        drops the qualifier, exactly as this paragraph does. No answer turns on the quantifier; the
        point being made about Article 2(4) is unaffected by it. The difference is in the Official
        Journal text and is reproduced here rather than smoothed away; what it means for a product
        that is software alone is a question for a reader of that Directive. The trailing \"(36)\"
        is the Official Journal's own footnote marker, printed in the paragraph. The footnote it
        points at is quoted below, because it is the only place in the whole instrument that says
        what Directive 2014/90/EU is about, and without it this exclusion is a number a developer
        cannot answer. **This gate does not carry Directive 2014/90/EU and says nothing about what
        it reaches.**"
    - quote: (36) Directive 2014/90/EU of the European Parliament and of the Council of 23 July 2014 on
        marine equipment and repealing Council Directive 96/98/EC (OJ L 257, 28.8.2014, p. 146).
      cite: CRA Art. 2(4), footnote (36)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**A footnote and not a provision, quoted because it is the only support Article 2(4) has
        anywhere in the instrument.** Article 2(4) has no recital behind it, which was searched for
        expressly and is a genuine absence rather than an omission from this gate. The paragraphs
        that do have one have it plainly: Recital 25 for Article 2(2)(a) and (b), Recital 27 for
        Article 2(2)(c) and Article 2(3), Recital 28 for Article 2(5), Recital 29 for Article 2(6),
        Recital 26 for Article 2(7), and Recital 9 for Article 2(1)'s connection element. **This
        passage said \"every other paragraph of Article 2 has a recital behind it\" until
        2026-08-05, and Article 2(8) has none either**: the one recital that uses the phrase
        \"essential interests\" is Recital 70, and it supports the CSIRT dissemination rules in
        Article 16(2), third subparagraph, point (b) - it is about withholding the full content of a
        vulnerability notification from the single reporting platform - not Article 2(8). **That
        pointer read \"Article 16(4), point (b)\" for part of 2026-08-05**, which is a paragraph
        that exists and carries different content: Article 16(4) is ENISA's duty to manage the risks
        to the security of the single reporting platform, and it has no points at all. Points (a),
        (b) and (c) hang off Article 16(2)'s third subparagraph, between paragraph 2 and paragraph
        3. A correction that fixes one half of a sentence and breaks the other is the class this
        passage has now been through twice, so a paragraph number here is checked as three separate
        things - the paragraph, the subparagraph and the point - and never as one. The two recitals
        that speak of national security or defence are Recital 14, which is about the Member States'
        own responsibility and supports Article 5(1) on procurement or use, and Recital 26, which
        supports Article 2(7). Two paragraphs are unsupported, not one, and the sentence offered its
        own search as the evidence for the stronger claim. **Two further corrections were made here
        on 2026-08-05**: this passage said \"no recital in the instrument contains the phrase
        'essential interests'\", which Recital 70 refutes, and it sent Recital 14 to Article 4(1),
        whose own recital is Recital 13 - Recital 13 repeats Article 4(1) almost word for word,
        while Recital 14's \"procured or used for national security or defence purposes\" is Article
        5(1)'s own subject matter. The footnote gives the Directive's title - it is on marine
        equipment - and that is the whole of the handle the limb resting on Article 2(4) can offer a
        reader. Quoted with the Official Journal's own reference (OJ L 257, 28.8.2014, p. 146) so
        that a reader can find the Directive rather than search for it by number."
    - quote: "5. The application of this Regulation to products with digital elements covered by other
        Union rules laying down requirements that address all or some of the risks covered by the
        essential cybersecurity requirements set out in Annex I may be limited or excluded where:
        (a) such limitation or exclusion is consistent with the overall regulatory framework that
        applies to those products; and (b) the sectoral rules achieve the same or a higher level of
        protection as that provided for by this Regulation. The Commission is empowered to adopt
        delegated acts in accordance with Article 61 to supplement this Regulation by specifying
        whether such limitation or exclusion is necessary, the products and rules concerned, as well
        as the scope of the limitation, if relevant."
      cite: CRA Art. 2(5)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Not an exclusion, an empowerment to create them - and the only condition in this gate that
        changes without the product changing.** Article 2(5) does not itself take anything out. It
        says the application of the Regulation to products with digital elements covered by other
        Union rules \"may be limited or excluded\" on two cumulative conditions, and empowers the
        Commission to adopt delegated acts under Article 61 specifying whether the limitation or
        exclusion is necessary, which products and which rules, and the scope of the limitation
        where that is relevant. **Not any other Union rules will do, and this sentence dropped the
        qualifier until 2026-08-05**: the paragraph reaches products covered by other Union rules
        \"laying down requirements that address all or some of the risks covered by the essential
        cybersecurity requirements set out in Annex I\", so a sectoral instrument that regulates the
        product for reasons unconnected with those risks is not a candidate. So the answer to the
        limbs resting on it is a fact about the Commission's delegated acts as they stand on the day
        the scan runs, not a fact settled once about this product. **\"Limited or excluded\" is two
        outcomes, and this quote backs two limbs, not one.** Only the exclusion branch takes a
        product out of the Regulation; a delegated act that limits leaves the product inside with
        less of the Regulation applying to it. `excluded-by-a-delegated-act-under-article-2-5` is
        `closes_gate_when: \"true\"` and asks only about exclusion;
        `limited-but-not-excluded-by-a-delegated-act-under-article-2-5` is `closes_gate_when: never`
        and records a limitation. A backticked id is kept on one physical line for this reason: a
        folded block scalar turns the line break inside one into a space, and the same-line grep
        that would catch it is the grep this gate forbids. **A single limb asking \"limits or
        excludes\" and closing the gate on either was shipped on 2026-08-04 and corrected the same
        day**, after an independent legal check found it would return `does-not-apply` - dropping
        all ten items of `cra-product-information-13-8`, of which nine are Annex II points - for a
        product whose application a delegated act merely limits. **The article's condition (b) is
        \"the same or a higher level of protection\", and it governs.** Quoted in full, including
        both points and the closing subparagraph, so that a reader is not left to take the condition
        from a summary of it. **The first delegated act under this paragraph was adopted on 29 July
        2025, and it is named on the exclusion limb below.** Commission Delegated Regulation (EU)
        2025/1535 excludes the application of this Regulation for products with digital elements
        falling within the scope of Regulation (EU) No 168/2013, and does not extend that exclusion
        to L1e category vehicles designed to pedal. **IT HAS APPLIED SINCE 18 NOVEMBER 2025**: its
        Article 2 provides that it enters into force on the twentieth day following that of its
        publication in the Official Journal, it was published in OJ L, 2025/1535 of 29 October 2025,
        and it sets no separate date of application, so it is directly applicable from that day and
        was not in force before it. Recorded 2026-09-07; until that date this gate carried no record
        of any delegated act and said so in this sentence. The limb still degrades with time rather
        than being wrong today: the record is dated, and the longer this gate goes unrevised, the
        more likely it is that a further delegated act exists which nothing here names."
    - quote: 6. This Regulation does not apply to spare parts that are made available on the market to
        replace identical components in products with digital elements and that are manufactured
        according to the same specifications as the components that they are intended to replace.
      cite: CRA Art. 2(6)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: '**Three cumulative conditions, and the paragraph is much narrower than "a replacement part".**
        The part must be made available on the market **to replace identical components** in
        products with digital elements, and it must be **manufactured according to the same
        specifications** as the component it replaces. A part that improves on what it replaces, or
        that replaces something similar rather than identical, is outside this paragraph and the
        Regulation continues to reach it.'
    - quote: 7. This Regulation does not apply to products with digital elements developed or modified
        exclusively for national security or defence purposes or to products specifically designed
        to process classified information.
      cite: CRA Art. 2(7)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: '**Two separate routes, and the first carries "exclusively".** Development or modification
        **exclusively** for national security or defence purposes is one; a product **specifically
        designed** to process classified information is the other, and it does not carry the word
        exclusively. A product built for a general market and also sold to a defence ministry meets
        neither: the first fails on "exclusively", and the second asks what the product was designed
        for rather than who buys it.'
    - quote: 8. The obligations laid down in this Regulation shall not entail the supply of information
        the disclosure of which would be contrary to the essential interests of Member States'
        national security, public security or defence.
      cite: CRA Art. 2(8)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**The one paragraph of Article 2 that is about the checklist that names this gate,
        `cra-product-information-13-8`, in particular, and it is not an exclusion from scope.**
        Article 2(2), 2(3), 2(4), 2(6) and 2(7) say which products the Regulation does not reach,
        and Article 2(5) is the power to adopt a delegated act that limits or excludes application -
        only the exclusion branch of which says so. Article 2(8) says something different: the
        obligations the Regulation does lay down \"shall not entail the supply of information\"
        whose disclosure would be contrary to the essential interests of Member States' national
        security, public security or defence. That checklist walks ten information items - nine
        Annex II points and, as `art-13-8-five-years`, Article 13(8)'s support-period floor - and
        asks whether each is supplied, so this is the paragraph that can qualify what any of those
        ten items requires. **It is carried as a limb and not as an `applicability_note` on the
        items, and the reason is that there are ten items.** A note would have to be repeated on
        each of them or placed on one of them arbitrarily; ten copies of one sentence is the
        drifting-copy defect the `cra-product-information-13-8` checklist had already been corrected
        for four times, and one copy on one item hides the paragraph from the other nine. The limb
        is one statement, in the same list that now carries every other paragraph of Article 2, and
        it is `closes_gate_when: never` because a \"yes\" limits what an obligation entails and
        never takes the product out of the Regulation."
    - quote: "'product with digital elements' means a software or hardware product and its remote data
        processing solutions, including software or hardware components being placed on the market
        separately;"
      cite: CRA Art. 3(1)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The definition includes \"its remote data processing solutions\", which is why the
        product-versus-service framing this gate used to rest on is unsafe.** A shipped client whose
        functions do not work without the provider's backend does not become a service because the
        backend is hosted: the backend is part of the product. **The definition's main clause
        contains no supply element**, so a thing is a product with digital elements whether or not
        anybody is supplied with it. **This sentence said \"no supply element at all\" until
        2026-08-05, and the \"including\" limb carries one**: the definition extends to \"software
        or hardware components **being placed on the market separately**\", which conditions that
        extension on a placing on the market. Supply as the operative test is Article 3(22), and it
        is a separate limb. **How this limb reads Article 3(4), stated as the choice it is.**
        Article 3(1) defines a software or hardware **product**; Article 3(4) defines \"software\" -
        the part of an electronic information system which consists of computer code - and not
        \"software product\". So \"any repository containing code meets Article 3(1)\" does not
        follow from the two definitions on their own, and the `cra-product-information-13-8`
        checklist asserted it as though it did until 2026-07-29. What follows is narrower: any
        repository containing computer code contains software. This gate treats that as meeting the
        limb, deliberately and inclusively, because the alternative is to read the silence of an
        artefact-shaped collector as a \"no\" about a definition that has no artefact element in it
        - and that drops duties. The reading over-includes, which is the tolerated direction, and an
        over-inclusive reading never closes this gate: what closes it here is a \"no\". **This
        sentence said \"the limb closes no gate on its own\" until 2026-08-05**, which is false of
        the limb and was the opposite of what this gate's supporting quote on Article 3(22) says one
        field away - that `is-a-product-with-digital-elements` is `closes_gate_when: \"false\"`, so
        a \"no\" on it returns does-not-apply and drops every item. What is true is the narrower
        thing: the direction this reading errs in cannot close it. Read with Article 3(6), it
        expressly reaches a component placed on the market separately, which is the library, the
        SDK, the framework and the server software others run: the commonest shapes in the audience
        of the checklists that name this gate, and the shapes that produce no distribution artefact
        at all. **What the inclusive reading must not reach, stated on 2026-11-11 (checker L, D2)**:
        software that runs only on the manufacturer's own servers and is reached through a browser,
        which Recitals 11 and 12 leave out unless it is the remote data processing solution of a
        product the manufacturer supplies; the limb's question says so."
    - quote: "'software' means the part of an electronic information system which consists of computer
        code;"
      cite: CRA Art. 3(4)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "Added 2026-07-29. The product limb was worded as \"is what this repository **ships** a
        software or hardware product\", which merged the Article 3(1) definition with a supply
        condition the definition's **main clause** does not contain, and then rested the answer on
        six artefact-shaped facts. **This sentence said \"the definition does not contain\" until
        2026-08-05**, which is the same absolute the Article 3(1) quote above was corrected for on
        that date: Article 3(1)'s \"including\" limb extends the definition to \"software or
        hardware components **being placed on the market separately**\" and so does carry a supply
        condition, on that limb alone. The argument the sentence makes is unaffected - a supply
        requirement still may not be read into the main clause, and this limb is `closes_gate_when:
        \"false\"` - but the two fields now state one rule instead of two. With this definition in
        front of the reader the limb is what it should always have been: a characterisation question
        about what the repository contains. **Note what this definition does not say.** It defines
        \"software\", not \"software product\", and Article 3(1) uses the word \"product\". Reading
        the two together as \"any repository containing code is a product with digital elements\" is
        an inclusive reading this gate adopts on purpose, not a conclusion the two definitions
        compel. The reason it is adopted is recorded on the Article 3(1) quote above."
    - quote: "'component' means software or hardware intended for integration into an electronic
        information system;"
      cite: CRA Art. 3(6)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: The other half of Article 3(1)'s closing words. A library or an SDK is a component, and Article
        3(1) reaches it where it is placed on the market separately. Nothing in the `distribution`
        collector sees a component as such, so the product limb must never be read as answered "no"
        because a library emitted no artefact fact.
    - quote: "'intended purpose' means the use for which a product with digital elements is intended by
        the manufacturer, including the specific context and conditions of use, as specified in the
        information supplied by the manufacturer in the instructions for use, promotional or sales
        materials and statements, as well as in the technical documentation;"
      cite: CRA Art. 3(23)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: Added 2026-07-29. The data-connection limb repeats Article 2(1)'s words "intended purpose or
        reasonably foreseeable use" and the gate carried neither definition, so a reader could not
        see that the limb asks a question about what the product is **for** - "including the
        specific context and conditions of use", as specified by the manufacturer in the
        instructions for use, promotional or sales materials **and statements**, as well as in the
        technical documentation - rather than a question about what strings appear in the tree.
        **This sentence listed three of those sources and omitted "and statements" until
        2026-08-05**, which is a source the definition names and which is neither promotional or
        sales material nor technical documentation. That is why the limb is `either` and not `code`,
        and why a bare dependency row does not answer it.
    - quote: "'reasonably foreseeable use' means use that is not necessarily the intended purpose supplied
        by the manufacturer in the instructions for use, promotional or sales materials and
        statements, as well as in the technical documentation, but which is likely to result from
        reasonably foreseeable human behaviour or technical operations or interactions;"
      cite: CRA Art. 3(24)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "The other half of Article 2(1)'s test, and the wider half: a use that is **not necessarily**
        the intended purpose the manufacturer supplied in its own documents still counts where it is
        likely to result from reasonably foreseeable human behaviour or technical operations or
        interactions. **This sentence read \"a use the manufacturer did not intend\" until
        2026-08-05**, which is narrower than the definition in the one word that matters - \"not
        necessarily the intended purpose\" leaves the intended purpose inside the category rather
        than excluding it, so the two halves of Article 2(1)'s disjunction overlap and a use does
        not have to be unintended to answer this limb. So a network path the documentation does not
        mention can still meet the limb, which is the reason the data-connection limb reads the tree
        at all rather than only the documents."
    - quote: (8) 'logical connection' means a virtual representation of a data connection implemented
        through a software interface;
      cite: CRA Art. 3(8)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Added 2026-08-04. The data-connection limb repeated Article 2(1)'s words \"direct or
        indirect logical or physical data connection\" and the gate quoted none of the three
        definitions those words carry**, so a reader adjudicating \"is a build-time dependency an
        indirect connection?\" had nothing to read. Article 3(8) is the widest of the three: a
        logical connection is any virtual representation of a data connection implemented **through
        a software interface**, which is what an API call, a socket and a database driver each are.
        Carrying it widens the limb rather than narrowing it, which is the direction this gate
        tolerates."
    - quote: (9) 'physical connection' means a connection between electronic information systems or
        components implemented using physical means, including through electrical, optical or
        mechanical interfaces, wires or radio waves;
      cite: CRA Art. 3(9)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: The second of the three connection definitions, added 2026-08-04. It is the alternative to
        Article 3(8) in Article 2(1)'s phrase "logical or physical", and it names radio waves
        expressly, so a device that only ever talks over Bluetooth or a radio link is connected
        within the Regulation's own definition.
    - quote: (10) 'indirect connection' means a connection to a device or network, which does not take
        place directly but rather as part of a larger system that is directly connectable to such
        device or network;
      cite: CRA Art. 3(10)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "The third connection definition, added 2026-08-04, and the one that decides the hard cases in
        the audience of the checklists that name this gate. An **indirect** connection is a
        connection that does not take place directly \"but rather as part of a larger system that is
        directly connectable to such device or network\", so a library that never opens a socket
        itself is still within Article 2(1) where the application it is built into is connectable.
        Read with Article 3(8), that is what makes the connection test reach almost every piece of
        networked software, and it is why the data-connection limb's evidence is deliberately read
        widely. Note what is **not** defined: Article 2(1) says \"a device or network\" and Article
        3 defines neither term."
    - quote: "'remote data processing' means data processing at a distance for which the software is
        designed and developed by the manufacturer, or under the responsibility of the manufacturer,
        and the absence of which would prevent the product with digital elements from performing one
        of its functions;"
      cite: CRA Art. 3(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "The test for when a hosted component counts as part of the product, in two cumulative
        conditions: the manufacturer built it or had it built under its responsibility, and without
        it a function of the product does not work. A third-party API the product merely calls is
        not this."
    - quote: The purpose of this Regulation is to ensure a high level of cybersecurity of products with
        digital elements and their integrated remote data processing solutions. Such remote data
        processing solutions should be defined as data processing at a distance for which the
        software is designed and developed by or on behalf of the manufacturer of the product with
        digital elements concerned, the absence of which would prevent the product with digital
        elements from performing one of its functions. That approach ensures that such products are
        adequately secured in their entirety by their manufacturers, irrespective of whether data is
        processed or stored locally on the user's device or remotely by the manufacturer. At the
        same time, processing or storage at a distance falls within the scope of this Regulation
        only in so far as it is necessary for a product with digital elements to perform its
        functions. Such processing or storage at a distance includes the situation where a mobile
        application requires access to an application programming interface or to a database
        provided by means of a service developed by the manufacturer. In such a case, the service
        falls within the scope of this Regulation as a remote data processing solution. The
        requirements concerning the remote data processing solutions falling within the scope of
        this Regulation do therefore not entail technical, operational or organisational measures
        aiming to manage the risks posed to the security of a manufacturer's network and information
        systems as a whole.
      cite: CRA Recital 11
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-08-04
      why: "**Added 2026-08-04. The two remote-processing limbs cited Recital 12 alone, and Recital 12 is
        the boundary from outside; this is the boundary from inside.** Two sentences do work no
        other provision in this gate does. Processing or storage at a distance \"falls within the
        scope of this Regulation **only in so far as it is necessary** for a product with digital
        elements to perform its functions\" - so the manufacturer's hosted component is drawn in to
        the extent the product needs it and no further. And the requirements \"do therefore **not**
        entail technical, operational or organisational measures aiming to manage the risks posed to
        the security of a manufacturer's network and information systems **as a whole**\" - so
        answering the two remote processing limbs \"yes\" does not put the manufacturer's entire
        infrastructure inside this Regulation, which is the reading a reader is most likely to fall
        into. The recital's worked example is the case this product's audience meets: a mobile
        application that requires access to an application programming interface or a database
        \"provided by means of a service developed by the manufacturer\" - there, the service is
        inside the scope as a remote data processing solution. **Note a wording difference against
        Article 3(2), which governs.** The recital says \"designed and developed by or on behalf of
        the manufacturer\"; the article says \"designed and developed by the manufacturer, or under
        the responsibility of the manufacturer\". The article's words are what the limbs ask."
    - quote: Cloud solutions constitute remote data processing solutions within the meaning of this
        Regulation only if they meet the definition laid down in this Regulation. For example, cloud
        enabled functionalities provided by a manufacturer of smart home devices that enable users
        to control the device at a distance fall within the scope of this Regulation. On the other
        hand, websites that do not support the functionality of a product with digital elements, or
        cloud services designed and developed outside the responsibility of a manufacturer of a
        product with digital elements do not fall within the scope of this Regulation. Directive
        (EU) 2022/2555 applies to cloud computing services and cloud service models, such as
        Software as a Service (SaaS), Platform as a Service (PaaS) or Infrastructure as a Service
        (IaaS). Entities providing cloud computing services in the Union which qualify as
        medium-sized enterprises under Article 2 of the Annex to Recommendation 2003/361/EC, or
        exceed the ceilings for medium-sized enterprises provided for in paragraph 1 of that
        Article, fall within the scope of that Directive.
      cite: CRA Recital 12
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Added 2026-07-29 because the `cra-product-information-13-8` checklist was already relying on
        it and had it backwards.** The `when_unresolved` passage said Recital 12 \"places outside
        this Regulation\" a service its provider hosts itself, and used that as the ground for
        refusing to count a Dockerfile. Recital 12 says the opposite for the manufacturer's own
        remote data processing: the recital's own worked example is a cloud enabled functionality
        provided by a manufacturer \"of smart home devices that enable users to control the device
        at a distance\", and that falls **inside** the scope; what is outside is a cloud service
        designed and developed **outside** the responsibility of a manufacturer of a product with
        digital elements, or a website that does not support the functionality of such a product.
        **This sentence gave the inside half as an unconditional rule about any cloud functionality
        a manufacturer provides until 2026-08-05.** The recital conditions itself in its first
        sentence - cloud solutions are remote data processing solutions \"only if they meet the
        definition laid down in this Regulation\" - and introduces the smart-home case with \"For
        example\", so the operative test stays Article 3(2)'s definition and the recital illustrates
        it rather than standing in for it. The correct ground for not counting a Dockerfile is that
        building an image is not a supply to anybody. That ground is stated on
        `supplied-for-distribution-or-use`, which is where this gate uses it. **The finding a user
        reads is produced by rule `eu-cra-001`, whose `context_questions[0]` carried the same
        misreading from 2026-07-27 until 2026-08-12**, in the stronger form of an instruction to
        record the hosted case and stop - so the two halves of one scan disagreed, this gate
        printing the conditioned reading and the finding the unconditioned one. That sentence was
        replaced on 2026-08-12 with the Article 3(1) and Article 3(2) test, and the hosted-only case
        now routes to `is-a-product-with-digital-elements` rather than closing the finding; the
        correction and the primary-source spans behind it were both established on 2026-08-12, read
        off the Official Journal text rather than off any summary of it. This note said the
        correction was \"owed work outside this gate\" until that date. **The quote was extended to
        the end of the recital on 2026-07-29, and the extension is not decoration.** It stopped at
        \"do not fall within the scope of this Regulation\" and dropped 490 of the recital's 1,110
        characters with no ellipsis. The dropped sentences say which instrument does cover the
        excluded services - Directive (EU) 2022/2555, for cloud computing services and for entities
        at or above the medium-sized-enterprise thresholds - and that is exactly the sentence a
        reader needs when telling a developer that their hosted service is outside the CRA. Telling
        somebody a duty does not reach them, without saying what does, is the shape of
        under-inclusion this gate exists to avoid. **The other half of the recital, which this gate
        got wrong until 2026-11-11 (checker L, D2).** Correcting the \"hosted means outside\" error,
        this gate went to the opposite one: its supply question counted access to hosted software as
        supply and its product note treated any code as meeting the limb, so a web application its
        own team runs and its users reach through a browser read `likely-applies` with a question
        pointing toward yes. Recital 11 brings processing at a distance in only as part of a product
        with digital elements, and the websites and cloud services this recital names are outside;
        the Commission's guidance (C(2026) 5252 final, Annex, paragraphs 20 and 21 and Example 5,
        https://ec.europa.eu/newsroom/dae/redirection/document/131456, read 2026-11-11; its reading,
        not the text) says \"a web application accessed by the user exclusively through a web
        browser is not a product with digital elements. Unless it supports the functionality of a
        product with digital elements, it does not fall within the scope of the CRA\". Both halves
        are now in `is-a-product-with-digital-elements`'s question, and the counting rule is
        withdrawn. The Dockerfile ground above is unchanged."
    - quote: "'manufacturer' means a natural or legal person who develops or manufactures products with
        digital elements or has products with digital elements designed, developed or manufactured,
        and markets them under its name or trademark, whether for payment, monetisation or free of
        charge;"
      cite: CRA Art. 3(13)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: '**The addressee of Article 13, and of every item of `cra-product-information-13-8`.** Article
        13(18) - the paragraph that makes Annex II binding - opens "Manufacturers shall ensure". Two
        cumulative elements: develops or manufactures the product, or has it designed, developed or
        manufactured, **and** markets it under its own name or trademark. Note the closing words,
        "whether for payment, monetisation or free of charge", so a free release does not defeat the
        definition. **This definition is not the only way onto this list.** Article 21 deems an
        importer or a distributor to be a manufacturer, and subjects it to Articles 13 and 14 by
        name, where it places the product on the market under its name or trademark **or** carries
        out a substantial modification of a product already placed on the market. Article 22 deems
        any other person who substantially modifies a product **and makes that product available on
        the market** to be a manufacturer - but not to the same extent, and **this passage said
        Article 22 "does the same" until 2026-08-05.** Article 22(2) limits it: the person is
        subject to Articles 13 and 14 "for the part of the product with digital elements that is
        affected by the substantial modification or, if the substantial modification has an impact
        on the cybersecurity of the product with digital elements as a whole, for the entire
        product". So the duty follows the modification, and reaches the whole product only on the
        second branch, where Article 21 carries no such limit. Neither route needs the party to have
        developed anything, and a rebranded redistribution and a substantially modified fork are
        ordinary shapes in the audience of the checklists that name this gate.'
    - quote: An importer or distributor shall be considered to be a manufacturer for the purposes of this
        Regulation and shall be subject to Articles 13 and 14, where that importer or distributor
        places a product with digital elements on the market under its name or trademark or carries
        out a substantial modification of a product with digital elements already placed on the
        market.
      cite: CRA Art. 21
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The first deeming rule, and it names Article 13 by number.** Two independent triggers:
        **placing the product on the market under its own name or trademark**, or **substantial
        modification of a product already placed on the market**. **The first trigger was compressed
        to \"own name or trademark\" until 2026-08-05**, which dropped the act the paragraph turns
        on and so reached a party that merely re-labels a product somebody else had already placed
        on the market. Article 3(21) defines placing on the market as the **first** making available
        of a product on the Union market, so the two words carry the whole difference between a
        rebranding first supplier and a downstream reseller applying its own label; this gate's
        supporting quote on Article 3(16) states the same element in full, and the two now agree.
        Direction: wider, on a limb that is annotation-only, so it over-reported rather than
        skipping a check. Added 2026-07-29, immediately after the addressee limb was written as
        though Article 3(13) were the only route in - a form that would have routed a rebranding
        distributor and a modifying fork off this list."
    - quote: A natural or legal person, other than the manufacturer, the importer or the distributor, that
        carries out a substantial modification of a product with digital elements and makes that
        product available on the market, shall be considered to be a manufacturer for the purposes
        of this Regulation.
      cite: CRA Art. 22(1)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The third route to being a manufacturer, named in four prose fields - five times in all - of
        what was then the `cra-product-information-13-8` checklist, and quoted in none of them until
        2026-07-29.** Measured on one revision, the last state in which Article 22 was named there
        and not yet quoted: `supporting_quotes[2].why`, `[3].why` (twice), `[5].why` and
        `when_unresolved`. This passage said \"three prose passages\" until the count was re-run. By
        the standard that file declares for itself in its `scope_note` - that a citation with no
        duty behind it is one a lawyer rejects and the provision must be carried - that is prose
        asserting a legal test, and it is the same defect that was corrected earlier the same day
        for Article 21, reappearing one route along. This is the route a substantially modified fork
        takes **where the fork is also made available on the market**: Article 22(1) requires both
        the substantial modification and the making available, so a fork published without a supply
        is not caught. The party developed nothing and rebranded nothing, and carries Articles 13
        and 14 - but only as far as Article 22(2) takes them, for the part of the product affected
        by the modification, or for the entire product where the modification has an impact on the
        product's cybersecurity as a whole. **This sentence said \"carries Article 13\" flat until
        2026-08-05**, which is the overstatement the next item's `why` opens by warning against."
    - quote: The person referred to in paragraph 1 of this Article shall be subject to the obligations set
        out in Articles 13 and 14 for the part of the product with digital elements that is affected
        by the substantial modification or, if the substantial modification has an impact on the
        cybersecurity of the product with digital elements as a whole, for the entire product.
      cite: CRA Art. 22(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The limit on the third route, and stating Article 22(1) without it overstates the duty.** A
        person deemed a manufacturer under Article 22(1) owes Articles 13 and 14 for the **part** of
        the product affected by the substantial modification, and for the entire product only where
        the modification affects the cybersecurity of the product as a whole. A finding against a
        substantially modified fork must say which of the two it is asserting, or say that it does
        not know."
    - quote: "'importer' means a natural or legal person established in the Union who places on the market
        a product with digital elements that bears the name or trademark of a natural or legal
        person established outside the Union;"
      cite: CRA Art. 3(16)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Added 2026-07-29. `importer-or-distributor-verification-duty` turned on this defined term
        and on Article 3(17) and the gate quoted neither, which is prose asserting a legal test -
        the prohibited category the `cra-product-information-13-8` checklist names as its own in its
        `scope_note`, and the very defect it had recorded and corrected for Article 22(1) hours
        earlier.** Contrast the treatment the manufacturer limb and the steward limb already had:
        Article 3(13) and Article 3(14) are quoted in full beside them. **Three limiting elements,
        and without them the limb was answered \"yes\" by any reseller anywhere.** The person must
        be **established in the Union**; they must **place the product on the market**, which
        Article 3(21) defines as the **first** making available of it on the Union market; and the
        product must bear the name or trademark of a person **established outside the Union**.
        **This passage counted two elements and left the placing-on-the-market element out until
        2026-08-05**, which made an importer of a shop established in the Union that buys a
        non-Union-branded product from a Union wholesaler and resells it - a distributor on the
        definition, because somebody else made it available first - and so asserted the Article
        19(2)(c) checking duty against a party the Regulation does not put it on. A distributor
        inside one Member State passing on a product made in another Member State is not an importer
        within this definition; nor is a person outside the Union who ships into it. Failing the
        three elements takes the party out of Article 19(2), and out of nothing else. **This passage
        went further until 2026-08-05 and said that where the party does not meet all three
        elements, the sentence the limb's note prescribes - that the party carries a checking duty
        about the Annex II content `cra-product-information-13-8` walks - asserts a duty the
        Regulation does not impose on it.** The limb `importer-or-distributor-verification-duty`
        covers both roles, and the party that fails Article 3(16) is very often a distributor within
        Article 3(17), on whom Article 20(2), point (b), imposes a verification duty that names
        **Article 13(18)** expressly - the paragraph that makes the Annex II content binding. The
        worked example above is that party: the Union shop reselling a non-Union-branded product
        bought from a Union wholesaler is a distributor on the definition, and it owes the Article
        20(2), point (b), duty although it owes nothing under Article 19(2). So the sentence holds
        only where the party is **neither an importer within Article 3(16) nor a distributor within
        Article 3(17)**; stated without that qualification it denied a duty the Regulation does
        impose, which is understating, and this gate's supporting quote on Article 20(2) carried the
        distributor's half correctly the whole time - two accounts of one duty in one gate. What is
        wrong either way is the sentence a finding is told to write; the limb is `closes_gate_when:
        \"never\"`, so no check is skipped on it. Note the relationship with Article 21: an importer
        that puts the product on the market under its **own** name or trademark stops being a plain
        importer and is deemed a manufacturer, which is why the limb's question excludes that case
        in terms."
    - quote: "'distributor' means a natural or legal person in the supply chain, other than the
        manufacturer or the importer, that makes a product with digital elements available on the
        Union market without affecting its properties;"
      cite: CRA Art. 3(17)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**Added 2026-07-29, for the same reason as Article 3(16) and with the same consequence for the
        limb's question.** Three elements: in the supply chain; other than the manufacturer or the
        importer; and making the product available on the Union market **without affecting its
        properties**. **The third element is the one that does work here**, because it is also what
        separates a distributor from the Article 21 deeming rule. A party that affects the product's
        properties has, on the ordinary reading, done something to it; where that something is a
        substantial modification within Article 3(30) and the party is still an importer or a
        distributor, Article 21 deems the party a manufacturer and subjects it to **Articles 13 and
        14**, with no part-of-the-product limit. **Where affecting the properties takes the party
        outside Article 3(17) altogether, the route is Article 22 and not Article 21, and this
        passage named only Article 21 until 2026-08-05.** Article 22(1) reaches a person \"other
        than the manufacturer, the importer or the distributor\" that carries out a substantial
        modification and makes the product available on the market, and Article 22(2) subjects that
        person to Articles 13 and 14 \"for the part of the product with digital elements that is
        affected by the substantial modification or, if the substantial modification has an impact
        on the cybersecurity of the product with digital elements as a whole, for the entire
        product\" - a limit Article 21 does not carry, so which of the two routes applies changes
        how much is owed. So \"without affecting its properties\" and \"without being deemed a
        manufacturer under Article 21\" are not two independent qualifications that happen to sit
        beside each other in the limb's question - the first is a large part of why the second
        holds. Redistribution of somebody else's package unchanged is the paradigm case; a fork that
        patches the code is not."
    - quote: "2. Before placing a product with digital elements on the market, importers shall ensure
        that: (a) the appropriate conformity assessment procedures as referred to in Article 32 have
        been carried out by the manufacturer; (b) the manufacturer has drawn up the technical
        documentation; (c) the product with digital elements bears the CE marking referred to in
        Article 30 and is accompanied by the EU declaration of conformity referred to in Article
        13(20) and the information and instructions to the user as set out in Annex II in a language
        which can be easily understood by users and market surveillance authorities; (d) the
        manufacturer has complied with the requirements set out in Article 13(15), (16) and (19).
        For the purposes of this paragraph, importers shall be able to provide the necessary
        documents proving the fulfilment of the requirements set out in this Article."
      cite: CRA Art. 19(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: '**A duty tied to exactly what `cra-product-information-13-8` walks, carried by a party that is
        not a manufacturer and was not on any list in this gate until 2026-07-29.** Point (c)
        requires an importer, before placing the product on the market, to ensure that it is
        accompanied by the information and instructions to the user set out in Annex II, in a
        language which can be easily understood by users and market surveillance authorities. That
        is the same Annex II `cra-product-information-13-8` walks, read against the same product. A
        plain importer - one that neither places the product on the market under its own name or
        trademark nor substantially modifies it - is **not** deemed a manufacturer by Article 21, so
        it answers "no" to all three routes on `who-the-duty-is-addressed-to`. Before this quote was
        added, the `cra-product-information-13-8` checklist then described such a party as outside
        that checklist, while the Regulation puts an Annex II information duty on it. That is
        under-inclusion, which this repository does not permit in either prose or data, and it now
        has its own limb: `importer-or-distributor-verification-duty`. The quote is Article 19(2) in
        full, including the (a), (b) and (d) points and the closing sentence, and the two are quoted
        for different reasons. The **chapeau** - "Before placing a product with digital elements on
        the market, importers shall ensure that:" - is what makes point (c) a pre-market condition
        rather than a free-standing duty; it is the only source of the timing. The **closing
        sentence** - "For the purposes of this paragraph, importers shall be able to provide the
        necessary documents proving the fulfilment of the requirements set out in this Article" -
        adds a documentary-evidence duty and carries no timing at all. **This passage attributed the
        timing to the chapeau and the closing sentence together until 2026-08-05**, which gave the
        closing sentence a function it does not have and left its own reason for being quoted
        unstated. Nothing a finding may say changes either way; what changes is whether a reader
        looking for the source of the timing finds one sentence or two.'
    - quote: "2. Before making a product with digital elements available on the market, distributors shall
        verify that: (a) the product with digital elements bears the CE marking; (b) the
        manufacturer and the importer have complied with the obligations set out in Article 13(15),
        (16), (18), (19) and (20) and Article 19(4), and have provided all necessary documents to
        the distributor."
      cite: CRA Art. 20(2)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**The distributor's half of the same duty, and it names Article 13(18) by number.** Point (b)
        requires a distributor, before making the product available on the market, to verify that
        the manufacturer and the importer have complied with Article 13(15), (16), **(18)**, (19)
        and (20) **and Article 19(4), and have provided all necessary documents to the distributor**
        - the last two elements were dropped from this sentence until 2026-08-05, and Article 19(4)
        is the importer's own duty to put its contact details on the product, its packaging or an
        accompanying document. Article 13(18) is the paragraph that makes Annex II binding and is
        the operative provision behind nine of the ten items of `cra-product-information-13-8` -
        every one whose `article` is an Annex II point. **The tenth, `art-13-8-five-years`, rests on
        Article 13(8) directly**, and Article 13(8) is not among the paragraphs point (b) lists, so
        a distributor's verification duty reaches nine of that checklist's ten items and not the
        support-period floor. On those nine it is a duty about that checklist's own subject matter.
        It is a duty to **verify**, not to author: the distributor does not draw up the Annex II
        information, it checks that it exists before passing the product on. A finding against a
        distributor must say which of the two it asserts."
    - quote: "'substantial modification' means a change to the product with digital elements following its
        placing on the market, which affects the compliance of the product with digital elements
        with the essential cybersecurity requirements set out in Part I of Annex I or which results
        in a modification to the intended purpose for which the product with digital elements has
        been assessed;"
      cite: CRA Art. 3(30)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "**A substantial modification is an inclusion trigger, not an exclusion, and the
        `cra-product-information-13-8` checklist listed it among provisions that \"can only take a
        project out\".** It is the trigger in three places: Article 21 (an importer or distributor
        that substantially modifies is deemed a manufacturer and made subject to Article 13),
        Article 22(1) (any other person who substantially modifies and makes available is deemed a
        manufacturer), and Article 69(2) (a product already on the market before 11 December 2027
        becomes subject to the requirements precisely **by** being substantially modified from that
        date). Its absence from that file under-included; it did not over-include. Note also what
        the definition does not say: it is not \"a big change\", it is a change **following the
        product's placing on the market** that affects compliance with the Annex I Part I essential
        requirements or that modifies the assessed intended purpose. **The temporal condition was
        missing from this sentence until 2026-08-05**, although the quote directly above it carries
        the words: a change made before the product is first made available on the Union market is
        not a substantial modification at all, which is what makes the Article 69(2) reading above
        turn on a release date rather than on a diff."
    - quote: "'placing on the market' means the first making available of a product with digital elements
        on the Union market;"
      cite: CRA Art. 3(21)
      url: http://publications.europa.eu/resource/celex/32024R2847
      checked_at: 2026-07-29
      why: "The term inside Article 69(2)'s transitional rule and inside Article 13(18)'s ten-year rule,

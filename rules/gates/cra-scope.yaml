    market from 11 December 2027 must meet these requirements\"*. For **standalone software already
    released**, Article 69(2) means the requirements attach only from a substantial modification
    made on or after that date (guidance paragraphs 13 to 15: a version is placed once, when first
    supplied; variants are distinct products), and the honest sentence is *\"these requirements

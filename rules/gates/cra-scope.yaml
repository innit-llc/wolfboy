    administration entity exclusively for its own use (`public-administration-entity-own-use-only`).
    It goes to making available on the market, not to commercial activity, and it carries no \"on
    those grounds alone\" qualifier. **Does Article 2 itself take the product out?**
    (`regulation-2017-745-medical-devices-applies`,
    `regulation-2017-746-in-vitro-diagnostics-applies`,
    `regulation-2019-2144-motor-vehicles-applies`,
    `certified-under-regulation-2018-1139-civil-aviation`,
    `within-the-scope-of-directive-2014-90-marine-equipment`,
    `excluded-by-a-delegated-act-under-article-2-5`, `spare-part-replacing-an-identical-component`,
    `developed-exclusively-for-national-security-or-defence`.) **Article 2(1) is the whole of the
    positive scope test and none of Article 2's other seven paragraphs adds to it; this gate
    implemented the first and none of the rest until 2026-08-04.** Seven limbs cover the five
    paragraphs that exclude - Article 2(2), which has three points asked separately, then 2(3),
    2(4), 2(6) and 2(7). An eighth covers the **exclusion branch** of Article 2(5), which is not
    itself an exclusion but the power to adopt a delegated act that limits **or** excludes; its
    limitation branch is a separate limb, listed below among the paragraphs that take nothing out.
    Every one of these eight is a total exclusion: a \"yes\" means the Regulation does not reach the
    product, no item of any checklist that names this gate is owed, and the verdict is
    `does-not-apply`, which is the form the eight limbs' own notes carry. Two of the eight are
    realistic for the audience of `cra-product-information-13-8` - a small team shipping a symptom
    checker, a dosing calculator or an application that interprets a laboratory result has a real
    question to answer under Article 2(2)(a) or (b), because Recital 25 records that those
    Regulations lay down essential requirements for medical devices \"that function through an
    electronic system or that are software themselves\" and that \"certain non-embedded software\"
    is also covered by them. **Whether any such product is in fact one to which Regulation (EU)
    2017/745 or (EU) 2017/746 applies is decided under those Regulations, which this gate does not
    carry**; this passage said the three shapes were inside Article 2(2)(a) or (b) until 2026-08-05,
    which resolved an exclusion `supporting_quotes[3].why` says in terms this gate cannot resolve,
    on limbs whose \"yes\" returns does-not-apply. Article 2(5)'s delegated-act route is a standing
    open condition whose answer changes as delegated acts are adopted, so this gate degrades with
    time rather than being wrong today. The remaining five are legally real and practically remote
    here. **This passage said \"eight limbs cover the five paragraphs that exclude ... together with
    Article 2(5), which is not itself an exclusion ... Every one of the eight is a total exclusion\"
    until 2026-08-04**, which contradicts itself inside one paragraph and matched a single limb that
    closed the gate on a delegated act which merely limited application. Both are corrected: 2(5)'s
    two branches are two limbs, and only the exclusion branch is counted among the eight. **Three
    things to hold on to when answering them.** First, the wording differs where it looks the same:
    Article 2(2)(c) excludes products **to which** Regulation (EU) 2019/2144 applies, while Article
    2(3) excludes only products **certified in accordance with** Regulation (EU) 2018/1139, so an
    uncertified aeronautical product stays inside. Second, none of the instruments Article 2 points
    at was fetched by this gate and nothing here states what any of them covers; the answer is found
    in that instrument, and the recitals quoted beside the limbs give a handle and no more. Third,
    every one of the eight is `decided_by: ask`, declares no evidence category and names no fact
    kind, deliberately: whether another Union instrument reaches a product is a fact about what the
    product **is**, which is asked of the person or read from their declared documents and is never
    inferred from vocabulary in a tree. A word search for \"medical\", \"vehicle\", \"defence\" or
    \"classified\" would answer a question about what a product is from words a product happens to
    contain, and it must not be added. **And two limbs for things that limit without taking anything
    out** (`limited-but-not-excluded-by-a-delegated-act-under-article-2-5`,
    `information-whose-disclosure-would-be-contrary-to-national-security`.) **The first is Article
    2(5)'s limitation branch.** A delegated act adopted under Article 2(5) may limit rather than
    exclude, and a limitation leaves the product inside the Regulation with less of it applying.
    Where the answer is \"yes\", name the act, the products and rules it covers and how far the
    limitation goes - the closing subparagraph of Article 2(5) empowers the Commission to specify
    \"the scope of the limitation, if relevant\" - and, where that scope reaches the Article 13
    information duties, say which of the ten items it bears on. Never write that the product is
    outside the Regulation; that is `excluded-by-a-delegated-act-under-article-2-5`, a different
    question. **The second is Article 2(8)**, which says the obligations this Regulation lays down
    \"shall not entail the supply of information the disclosure of which would be contrary to the
    essential interests of Member States' national security, public security or defence\". The
    product stays inside the Regulation; what a particular obligation entails is qualified. It is
    the paragraph of Article 2 that bears most directly on the checklist that names this gate,
    `cra-product-information-13-8`, because that checklist is about the supply of information and
    walks ten items - nine Annex II points and Article 13(8)'s support-period floor - and the limb
    is `closes_gate_when: never` for that reason. Where the answer is \"yes\", name which of that
    checklist's ten items it bears on and say that the obligations do not entail supplying that
    particular information - never that the item is satisfied and never that it is absent. **No
    exemption in this gate is ever claimed from code.** Every one of the eleven is `ask` or `either`
    with no `code_evidence`, deliberately: the evaluator treats a `supported` exemption as claimed
    and closes the gate on it, and an exemption nobody has claimed is not an exemption. **The
    consequence, stated because it is what a reader has to act on.** An exemption with no
    `code_evidence` can never reach the `supported` state, so not one of the eleven is an input to
    the verdict: they are questions for the person or the adjudicating agent, and a scan can return
    `applies` with all eleven unanswered. From 2026-08-04 the verdict sentence says how many are
    unanswered instead of asserting that the settled limbs exhaust what the instrument requires, and
    each of them is printed with its question under TO ANSWER. An unanswered exemption is an
    untested exemption, never a rejected one. **And no exemption can be defeated from code either,
    which is an evaluator limit rather than a choice made here.** `assessScope` selects exemptions
    whose state is `supported` and reads no other state, so wiring a `commercial` kind to an
    exemption's `opposes` would leave the verdict exactly where it is while quietly dropping that
    exemption from the list of limbs a reader is told to resolve. The tree can therefore see that an
    exemption fails - a proprietary licence beside in-tree payment code - and the person or agent
    reading the report is the only one who can act on it. Recorded here because two earlier reviews
    recorded it as an unfixed defect and the reason had never been written down. **What the code
    genuinely does not settle.** A licence file says what may be done with the software, not whether
    it is supplied commercially, and Recital 18 says how the development was financed does not
    decide it either. Monetisation can sit entirely outside the repository. Ask the person running
    the scan there. But a gate that declares a limb unavailable in the tree when the tree answers it
    directs a reader away from evidence they are holding, and turns a settleable question into a
    matter of opinion - which is what the `cra-product-information-13-8` checklist did when it said
    the commercial-activity limb \"is not in the code\" about a project with a Stripe subscription
    route in it. **Whose duty is it?** (`who-the-duty-is-addressed-to`,
    `importer-or-distributor-verification-duty`, `open-source-software-steward`,
    `contributor-to-software-not-under-their-responsibility`.) Article 13(18) is addressed to
    manufacturers, and there are **three ways to be one**: Article 3(13) (develops or has the
    product made, **and** markets it under its own name or trademark); Article 21 (an importer or
    distributor that places the product on the market under its own name or trademark, **or**
    substantially modifies a product already on the market - deemed a manufacturer and made subject
    to Article 13 by name); and Article 22(1) (anybody else who substantially modifies a product and
    makes it available, subject under Article 22(2) to Articles 13 and 14 for the part affected, or
    for the entire product where the modification affects its cybersecurity as a whole). A rebranded
    redistribution and a substantially modified fork are on this list. **A plain importer and a
    plain distributor are not deemed manufacturers, and they still carry duties about
    `cra-product-information-13-8` itself - which this gate had no limb for until 2026-07-29.**
    Article 19(2)(c) requires an importer, before placing the product on the market, to ensure that
    it is accompanied by the Annex II information in an easily understood language. Article 20(2)(b)
    requires a distributor, before making it available, to verify that the manufacturer and the
    importer have complied with Article 13(15), (16), **(18)**, (19) and (20) and Article 19(4),
    **and have provided all necessary documents to the distributor** - the last element was dropped
    from this sentence until 2026-08-05, which understated the verification the distributor owes.
    Their absence under-included, which is the direction this gate forbids, and
    `importer-or-distributor-verification-duty` now records them - as a checking duty, not as the
    manufacturer's drafting duty. The audience of this product is open-source developers, and the
    Regulation treats two of them differently. **An open-source software steward** (Article 3(14))
    is expressly \"other than a manufacturer\" and carries **Article 24(1)** - a duty to put in
    place and document in a verifiable manner a cybersecurity policy fostering secure development
    and effective handling of vulnerabilities - together with **Article 24(2)**, a duty to cooperate
    with the market surveillance authorities at their request and to give one that documentation on
    a reasoned request, and **Article 24(3)**, which applies Article 14(1) to a steward to the
    extent it is involved in the products' development and Article 14(3) and (8) to the extent
    severe incidents **having an impact on the security of products with digital elements** affect
    the network and information systems it provides for that development. All three paragraphs are
    quoted in this gate as of 2026-08-04. The Article 24(2) and Article 24(3) sentences were deleted
    earlier that day, on the ground that neither paragraph was quoted here, and restored the same
    day after an independent legal check re-fetched the Official Journal and found them true; the
    rule is to fetch the provision, not to delete the statement. Article 14 itself is quoted nowhere
    in this gate, so a finding may say which of its paragraphs reach a steward and how far, and
    never what they require. This passage said \"instead ... not this checklist's ten items\" - the
    ten items of `cra-product-information-13-8` - which is the removal power the owner took away
    written into the passage that records its removal: the items are reported either way, and what a

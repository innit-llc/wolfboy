    foreseeable use are the product's. Almost anything that fetches, syncs, updates itself or talks
    to an API meets it. A strictly offline utility with no network path is the case that does not;
    **this gate cannot express that case**, because no census fact says \"the collector looked and
    found nothing\", and this passage described a route out that does not exist. **Is it supplied in

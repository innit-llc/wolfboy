    question: If you, or any seller listing on your interface, have put technical obstacles in the way
      of extracting data from your online interfaces, do you allow market surveillance authorities
      to scrape that data for product safety purposes on a reasoned request, using the
      identification parameters they give you?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing.** Article 22(12) specifies no
      Digital Services Act obligation, so the size reading does not reach this limb; it has a
      condition of its own instead. **This is the cleanest genuinely conditional limb in Article 22
      and its condition is on the face of the operative text.** The duty bites \"when providers of
      online marketplaces or online sellers **have put in place** technical obstacles to the
      extraction of data from their online interfaces (data scraping)\". Where none is in place, the
      limb imposes nothing. Where the person running the scan states that no technical obstacle to
      the extraction of data stands in the way of anybody collecting it, neither on this interface
      nor on any online seller's, whether by rate limiting, bot detection, a challenge page or a
      contractual prohibition on automated collection, this item is `not-applicable`. That is the
      second of the two conditions the scope note enumerates, and it counts because a stated fact
      closed a limb the Official Journal text makes conditional on its face. **The \"or online
      sellers\" half of the limb is part of the condition and is the easy half to drop.** The
      Official Journal reaches obstacles put in place by \"providers of online marketplaces **or
      online sellers**\", so a statement about the marketplace's own interface alone does not close
      the limb. A marketplace whose own pages carry no obstacle at all, and whose sellers run
      storefront pages of their own behind a challenge page, is still inside it. A closing fact has
      to reach both, and a finding that records only the marketplace's own answer has not answered
      the question. **A second reading of \"or online sellers\" exists, and this checklist does not
      adopt it, in the form the other open readings on this checklist are recorded in.** The duty
      the limb imposes is on the marketplace and it is to \"allow the scraping of such data\" -
      something a marketplace can do for the interfaces it controls and cannot do for a seller's
      separate website. On that reading the seller-side obstacle is part of what may prompt an
      authority's request rather than part of what founds a duty on the marketplace to lift it, and
      a marketplace with clean pages of its own would owe nothing under this limb however its
      sellers' own sites are configured. Where a seller's storefront pages are hosted on the
      marketplace the two readings coincide; where they are not, they diverge. **Nothing settles
      which is right**, and the reading the paragraph above takes is the wider one, so it holds the
      item open where the narrower reading would close it. The choice is stated here rather than
      left implicit because it decides whether a stated fact about the marketplace's own interface
      alone closes this item, and this checklist's answer to that is no. Recording the alternative
      is the same treatment Article 22(6)'s \"where applicable\", Article 22(9)(c)'s third element
      and Article 22(10)(b)'s \"where applicable\" already get. **This is the trap on this row, and
      it is named before anybody writes a detector.** It is the one condition in Article 22 that a
      repository could plausibly corroborate, and it is exactly where a source-vocabulary detector
      would be most tempting and most wrong: rate limiting and bot detection usually live in
      infrastructure configuration outside the repository, a managed protection service leaves no
      trace in the tree at all, and the contractual prohibition on automated collection lives in a
      published terms document. **Whether obstacles are in place is asked of the person running the
      scan; the tree and the documents corroborate or contradict, and neither decides.** **The duty
      is narrow and a finding must not widen it.** Access is allowed only for product safety
      purposes, only on a reasoned request, and only on the identification parameters the requesting
      authority provides. This is not a duty to open the interface to anybody. **Where the declared
      documents say nothing about this, the answer is `unresolved`, never `not-applicable` and never
      a bare `absent` presented as a shortfall.** A silent document has not shown that no obstacle
      is in place; it has shown that the documents do not address it."

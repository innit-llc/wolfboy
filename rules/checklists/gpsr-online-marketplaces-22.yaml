  - id: art-22-5-identical-content-capability
    article: Art. 22(5)
    quote: Orders issued pursuant to paragraph 4 may require the provider of an online marketplace, for
      the prescribed period, to remove from its online interface all identical content referring to
      an offer of the dangerous product in question, to disable access to it or to display an
      explicit warning, provided that the search for the content concerned is limited to the
      information identified in the order and does not require the provider of an online marketplace
      to carry out an independent assessment of that content, and that the search and the removal
      can be carried out in a proportionate manner by reliable automated tools.
    cite: GPSR Art. 22(5)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: When an order requires it, can you remove, disable access to or display a warning on all
      identical listings of the same dangerous product across your interface for the period the
      order prescribes, using reliable automated tools and without assessing the content yourself?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing.** Article 22(5) specifies no
      Digital Services Act obligation. **This item is a capability question and it must never be
      worded as a duty to search.** Article 22(5) creates no obligation on the marketplace to look
      for identical offers of its own motion. It states what an order **may** require and the limits
      on the authority's power to require it, and recital 56 says the obligations in this Regulation
      do not amount to a general obligation to monitor or to actively seek facts indicating illegal
      activity. The duty to comply with a validly issued order comes from Article 22(4), and it
      reaches whatever such an order may lawfully require, which is why this capability is asked
      about. **The words of condition in this paragraph condition the order, not the duty.** \"May\"
      and \"provided that\" limit what an authority can demand: the search must be limited to the
      information identified in the order, it must not require the marketplace to assess the content
      independently, and the search and removal must be capable of being done proportionately by
      reliable automated tools. Recital 54 says the order should identify the elements that let the
      marketplace find identical offers from the information traders display. **None of that makes
      this item conditional on any fact about the marketplace.** **Where the declared documents say
      nothing about this, the answer is `unresolved`, never `not-applicable` and never a bare
      `absent` presented as a shortfall.** This paragraph carries no words of condition that reach
      the marketplace, so no stated fact can close it and `not-applicable` is never correct on this
      item while the gate's verdict is `applies`. The one route to that word here is the gate's own
      `does-not-apply` verdict, which is a finding that there is no marketplace rather than a fact
      about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."
  - id: art-22-6-taking-safety-gate-information-into-account
    article: Art. 22(6)
    quote: Providers of online marketplaces shall take into account regular information on dangerous
      products notified by the market surveillance authorities in line with Article 26, received
      through the Safety Gate Portal, for the purpose of applying their voluntary measures aimed at
      detecting, identifying, removing or disabling access to the content referring to offers of
      dangerous products on their online marketplace, where applicable, including by making use of
      the interoperable interface to the Safety Gate Portal in accordance with Article 34. They
      shall inform the authority that made the notification to the Safety Gate Rapid Alert System of
      any action taken by using the contact details of the market surveillance authority published
      in the Safety Gate Portal.
    cite: GPSR Art. 22(6)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you take into account the regular information on dangerous products that market
      surveillance authorities notify through the Safety Gate Portal?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing.** Article 22(6) specifies no
      Digital Services Act obligation and the Commission does not mark it as size-limited. **This
      paragraph carries the words \"where applicable\" on its face and is deliberately given no
      condition, and the reason is recorded rather than left implicit.** Two readings exist. On the
      first, the core duty to take the information into account is unconditional and the words \"for
      the purpose of applying their voluntary measures ... where applicable\" describe what the
      information is taken into account **for**; the Commission renders it this way, writing that
      taking the information into account \"will help you to apply your voluntary measures\". On the
      second, \"where applicable\" is a genuine word of condition and a marketplace applying no
      voluntary detection measures has nothing for the first limb to attach to. **The reading is not
      settled and this checklist settles it in neither direction.** What follows is narrow and it is
      the whole of the consequence: an open reading cannot carry `not-applicable`, because that
      verdict is a positive statement that the requirement does not reach this business. **The
      interoperable interface is permissive and must never be reported as a requirement.**
      \"Including by making use of the interoperable interface to the Safety Gate Portal in
      accordance with Article 34\" offers a route; Article 34(5) puts the duty to **build** that
      interface on the Commission. A marketplace that takes the information into account by other
      means has not fallen short of this paragraph. **Where the declared documents say nothing about
      this, the answer is `unresolved`, never `not-applicable` and never a bare `absent` presented
      as a shortfall.** The one reading that would make this paragraph conditional is unsettled, so
      no stated fact can close it and `not-applicable` is never correct on this item while the
      gate's verdict is `applies`. The one route to that word here is the gate's own
      `does-not-apply` verdict, which is a finding that there is no marketplace rather than a fact
      about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."
  - id: art-22-6-informing-the-notifying-authority
    article: Art. 22(6)

  - id: art-22-12-g-access-for-authority-tools
    article: Art. 22(12)(g)
    quote: allow access to their interfaces for the online tools operated by market surveillance
      authorities to identify dangerous products;
    cite: GPSR Art. 22(12)(g)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you allow the online tools that market surveillance authorities operate to identify
      dangerous products to reach your interfaces?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every Article 22(12) limb.
      **This limb is a continuous state and it is unconditional.** Unlike point (i), which bites
      only where technical obstacles to data extraction have been put in place, this one simply
      requires that authority tools be allowed access. **The two are easy to run together and they
      are not the same duty**: point (i) is about permitting scraping on a reasoned request where
      obstacles exist, and this one is about not shutting authority tools out in the first place.
      **A blanket block on automated traffic can breach this limb without anybody deciding to.** Bot
      protection that cannot distinguish an authority's crawler from any other is the ordinary way
      this goes wrong, and it usually lives in infrastructure configuration rather than in the
      repository. **Nothing in a source tree settles it.** An allowlist committed to a repository
      would corroborate and never decide, because the running configuration is what admits or
      refuses a request. **Where the declared documents say nothing about this, the answer is
      `unresolved`, never `not-applicable` and never a bare `absent` presented as a shortfall.**
      This limb carries no words of condition, so no stated fact can close it and `not-applicable`
      is never correct on this item while the gate's verdict is `applies`. The one route to that
      word here is the gate's own `does-not-apply` verdict, which is a finding that there is no
      marketplace rather than a fact about one, and what the item then carries is the gate's
      reasoning; `applicability.when_unresolved` sets that branch out for all forty-one items at
      once."
  - id: art-22-12-h-supply-chain-data-requests
    article: Art. 22(12)(h)
    quote: cooperate in identifying, as far as possible, the supply chain of dangerous products by
      responding to data requests where the relevant information is not publicly available;
    cite: GPSR Art. 22(12)(h)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you respond to data requests that help identify the supply chain of dangerous products,
      where the relevant information is not already publicly available?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every Article 22(12) limb.
      **\"As far as possible\" and \"where the relevant information is not publicly available\"
      qualify individual responses and not the duty.** They shape what a particular answer has to
      contain - the marketplace need not supply what is already public, and need not produce what it
      does not have - and neither of them says that the duty fails to reach this marketplace.
      **Neither is a condition on this item and no stated fact can close it.** **A supply-chain
      question reaches beyond the trader.** Identifying where a dangerous product came from can
      require the trader's own supplier information, which the marketplace may hold from onboarding
      under Article 22(10) or under Article 30(1) of Regulation (EU) 2022/2065, so the mechanisms
      items and this one are related without being the same question. **Whether requests are
      answered is a business record and no repository holds it.** **Where the declared documents say
      nothing about this, the answer is `unresolved`, never `not-applicable` and never a bare
      `absent` presented as a shortfall.** Neither of those two qualifiers is a word of condition on
      this limb, so no stated fact can close it and `not-applicable` is never correct on this item
      while the gate's verdict is `applies`. The one route to that word here is the gate's own
      `does-not-apply` verdict, which is a finding that there is no marketplace rather than a fact
      about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once. **This
      closing clause was the only one of the twenty-six then in that class missing until
      2026-09-01**, when an independent verification pointed out that the sentence three paragraphs
      above says the same thing in different words and is therefore invisible to anything that reads
      for the standard one; both are kept, because the paragraph above says why the two qualifiers
      are not conditions and this sentence says what follows from that."
  - id: art-22-12-i-data-scraping-on-a-reasoned-request

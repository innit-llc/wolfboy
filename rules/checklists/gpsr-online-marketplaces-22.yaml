      with the counter-reading the scope note records. **That is the Commission's reading and it is
      not the law**: the Guidelines are guidance only by their own disclaimer, no court has ruled on
      the point, and the operative text of Article 22(9) carries no size words at all. **Tier 2 of
      the gate reaches this item.** Where the person running the scan states that the operator is a
      micro or small enterprise that is not a designated very large online platform, this item is
      `not-applicable`. That is the first of the two conditions the scope note enumerates, and it
      counts because a stated fact closed a conditional limb. **The twelve-month rule extends that
      exclusion and never withholds it.** On the second subparagraph of Article 19(1) of the Digital
      Services Act, and on the second subparagraph of its Article 29(1), a provider that lost micro
      or small status within the preceding 12 months is outside those Sections as well, unless it
      has been designated under Article 33. So a recent loss of the status reaches this same answer
      rather than denying it. **This checklist said the opposite until 2026-08-07**, requiring as a
      third limb that the status had not been lost in that period, and the correction is recorded on
      every item it touched. **Article 22(9)(a) requires both a postal and an electronic address,
      conjunctively.** The limb reads \"the postal **and** electronic address at which the
      manufacturer can be contacted\" and there is no \"or\" in it. An interface offering one field
      of the two satisfies part of the limb and not the limb, and a finding must say which of the
      two was found. **A postal address is the field most often missing from a listing form**, and
      its absence from a form is a different thing from its absence from a repository. Nothing in a
      source tree records what a listing form asks a trader for, and a schema file naming a field
      does not show that the field is presented, required or displayed. **Both halves of the chapeau
      bite here**: the field must exist for the trader to fill in, and what the trader fills in must
      reach the consumer on the product listing. **Where the declared documents say nothing about
      this, the answer is `unresolved`, never `not-applicable` and never a bare `absent` presented
      as a shortfall.**"

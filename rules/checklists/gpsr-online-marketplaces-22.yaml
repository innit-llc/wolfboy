  - id: art-22-3-internal-processes-for-product-safety
    article: Art. 22(3)
    quote: Providers of online marketplaces shall ensure that they have internal processes for product
      safety in place in order to comply without undue delay with the relevant requirements of this
      Regulation.
    cite: GPSR Art. 22(3)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you have internal processes for product safety in place that let you comply without
      undue delay with this Regulation's requirements?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is

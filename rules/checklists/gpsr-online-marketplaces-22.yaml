  - id: art-22-4-receiving-and-processing-orders
    article: Art. 22(4)
    quote: Providers of online marketplaces shall take the necessary measures to receive and process
      orders issued pursuant to this paragraph and they shall act without undue delay, and in any
      event within two working days from receipt of the order. They shall inform the issuing market
      surveillance authority of the effect given to the order by electronic means using the contact
      details of the market surveillance authority published in the Safety Gate Portal.
    cite: GPSR Art. 22(4), second subparagraph
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Have you taken the measures needed to receive and process orders from market surveillance
      authorities requiring you to remove content referring to an offer of a dangerous product, to
      disable access to it or to display an explicit warning?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing.** The second subparagraph of
      Article 22(4) specifies no Digital Services Act obligation; the orders it speaks of must meet
      Article 9(2) of that Regulation, which is a condition on the **order** and not an importation
      of its scope. **The first subparagraph of Article 22(4) binds Member States and no item is
      written against it.** It reads \"Member States shall confer on their market surveillance
      authorities the necessary power\"; the duty on the marketplace begins at the second
      subparagraph. **This is the standing readiness half of the paragraph, and it is
      unconditional.** The marketplace must have taken the measures needed to receive and process
      such orders, whether or not one has ever arrived. **\"We have never received an order\" is a
      statement about history and closes nothing** - it is not a fact about whether the duty reaches
      this business. **What an order may contain is set by Article 9(2) of Regulation (EU)
      2022/2065**: a reference to the legal basis, a statement of reasons, information identifying
      the issuing authority, clear information enabling the provider to locate the content such as
      one or more exact URLs, and information about redress. A process that cannot act on an order
      identifying content by URL has not taken the necessary measures. **Where the declared
      documents say nothing about this, the answer is `unresolved`, never `not-applicable` and never
      a bare `absent` presented as a shortfall.** This paragraph carries no words of condition, so
      no stated fact can close it and `not-applicable` is never correct on this item while the
      gate's verdict is `applies`. The one route to that word here is the gate's own
      `does-not-apply` verdict, which is a finding that there is no marketplace rather than a fact
      about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."
  - id: art-22-4-two-working-days
    article: Art. 22(4)
    quote: Providers of online marketplaces shall take the necessary measures to receive and process
      orders issued pursuant to this paragraph and they shall act without undue delay, and in any
      event within two working days from receipt of the order. They shall inform the issuing market
      surveillance authority of the effect given to the order by electronic means using the contact
      details of the market surveillance authority published in the Safety Gate Portal.
    cite: GPSR Art. 22(4), second subparagraph
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Can you act on such an order without undue delay and in any event within two working days
      from receipt of the order?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every item outside Article
      22(7), (9) and (11). **Two working days is a hard deadline and it is one of two in Article
      22.** The other is the three working days of Article 22(8), which runs from receipt of a
      third-party notice rather than from receipt of an authority's order. **The four time
      expressions in this Article are not interchangeable** - \"immediately\" in Article 22(12)(d),
      \"without delay\" in Article 22(12)(e)(i), \"without undue delay\" here and in Article 22(3),
      (8) and (12)(e)(ii), and the two hard deadlines - and a finding must use the words of the
      paragraph it is about. **This sentence named Article 22(6) instead of Article 22(3) until
      2026-09-01, and the correction is written rather than made silently, because the wrong version
      is the one an earlier reader may have acted on.** Measured on the Official Journal text of
      Article 22: \"without undue delay\" occurs four times, at paragraph 3, at the second
      subparagraph of paragraph 4, at paragraph 8 and at point (12)(e)(ii); \"without delay\" once,
      at point (12)(e)(i); \"immediately\" once, at point (12)(d); and \"working days\" twice, at
      paragraphs 4 and 8. **Article 22(6) carries no time expression at all** - it requires the
      information to be taken into account and the notifying authority to be informed of any action
      taken, and it sets no deadline - so a finding on either of the two Article 22(6) items must
      not borrow one. **A deadline is a timing rule and never an applicability condition.** It says
      when the act must be done, not whether the duty binds this marketplace, so no statement about
      how many orders have arrived can close this item. **This is a staffing and process fact, and
      no repository contains it.** Whether a business can act within two working days depends on
      cover at weekends and holidays, on who is authorised to take a listing down and on what
      happens when the person on duty is away. A published service commitment is a statement worth
      recording; code is not evidence either way. **Where the declared documents say nothing about
      this, the answer is `unresolved`, never `not-applicable` and never a bare `absent` presented
      as a shortfall.** This paragraph carries no words of condition, so no stated fact can close it
      and `not-applicable` is never correct on this item while the gate's verdict is `applies`. The
      one route to that word here is the gate's own `does-not-apply` verdict, which is a finding
      that there is no marketplace rather than a fact about one, and what the item then carries is
      the gate's reasoning; `applicability.when_unresolved` sets that branch out for all forty-one
      items at once."

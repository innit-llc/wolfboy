  - id: art-22-9-b-responsible-person-name-field
    article: Art. 22(9)(b)
    quote: where the manufacturer is not established in the Union, the name, postal and electronic
      address of the responsible person within the meaning of Article 16(1) of this Regulation or
      Article 4(1) of Regulation (EU) 2019/1020;
    quote_anchor: "For the purpose of compliance with the requirements of Article 31(1) and (2) of
      Regulation (EU) 2022/2065 as regards product safety information, providers of online
      marketplaces shall design and organise their online interface in a way that enables traders
      offering the product to provide at least the following information for each product offered
      and that ensures that the information is displayed or otherwise made easily accessible by
      consumers on the product listing:"
    cite: GPSR Art. 22(9)(b)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Where a trader's manufacturer is not established in the Union, does your interface let
      that trader enter the name of the responsible person, and does the name reach the consumer on
      the listing?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This limb is character-identical to Article 19(b), and the sibling checklist's
      condition for that limb does NOT transfer to it.** Under Article 19 the duty is about **the
      operator's own product**, so \"my manufacturer is established in the Union\" closes it. Under
      Article 22(9) the duty is about a field the interface must offer **for each product offered by
      any trader**, so a marketplace hosting a single product whose manufacturer sits outside the
      Union needs the field. The fact that would close it is \"no product offered through this
      marketplace, by any trader, has a manufacturer established outside the Union\" - a
      marketplace-wide statement that would have to hold continuously, and one almost no marketplace
      can truthfully make. **That fact is not a condition on this checklist, it is not in the scope
      note's enumeration, and it may not be added to one.** The quote above therefore carries
      `quote_anchor` on the Article 22(9) chapeau, because the limb's own words occur twice in the
      Regulation and are unattributable without it. **The branch is the Commission's reading and it
      is not the law, and this item says so where an agent will read it.** Footnote 27 of Commission
      notice C/2025/6233 is quoted whole in the gate; the Guidelines are guidance only by their own
      disclaimer, no court has ruled on the point, the operative text of Article 22(9) carries no
      size words at all, and recital 49 says the Regulation lays down duties for **all** providers
      of online marketplaces. The scope note carries the counter-reading and states why this
      checklist follows the Commission anyway. **Tier 2 of the gate reaches this item.** Where the
      person running the scan states that the operator is a micro or small enterprise that is not a
      designated very large online platform, this item is `not-applicable`. That is the first of the
      two conditions the scope note enumerates, and it counts because a stated fact closed a
      conditional limb. **The twelve-month rule extends that exclusion and never withholds it.** On
      the second subparagraph of Article 19(1) of the Digital Services Act, and on the second
      subparagraph of its Article 29(1), a provider that lost micro or small status within the
      preceding 12 months is outside those Sections as well, unless it has been designated under
      Article 33. So a recent loss of the status reaches this same answer rather than denying it.
      **This checklist said the opposite until 2026-08-07**, requiring as a third limb that the
      status had not been lost in that period, and the correction is recorded on every item it
      touched. **Who the responsible person is comes from two instruments, and the limb names
      both.** Article 16(1) of this Regulation, or Article 4(1) of Regulation (EU) 2019/1020. An
      interface asking for \"an EU representative\" without saying under which instrument has not
      necessarily collected either: a representative appointed under Article 27 of the General Data
      Protection Regulation is a different role, with a different task list, appointed for a
      different reason. One entity may hold both, and that is a business arrangement rather than an
      inference. **Where the declared documents say nothing about this, the answer is `unresolved`,
      never `not-applicable` and never a bare `absent` presented as a shortfall.**"

checklist_id: gpsr-online-marketplaces-22
title: GPSR Article 22 - the obligations of a provider of an online marketplace
law: Regulation (EU) 2023/988 (General Product Safety Regulation)
source_url: https://publications.europa.eu/resource/celex/02023R0988-20260529
checked_at: 2026-09-07
scope_note: "**Scope declaration.** This checklist covers the third of the three General Product
  Safety Regulation articles that this pack reaches: **Article 22**, which is the whole of GPSR
  Chapter IV and carries twelve paragraphs. It says nothing about **Article 19** or **Article 16**,
  which bind the economic operator whose product is listed and ship as the
  `gpsr-distance-sales-19-16` checklist; nothing about whether any product offered through the
  marketplace is safe, which is Chapter II; and nothing about the Digital Services Act's own
  obligations in their own right, which appear here only where Article 22 points at them. **The
  person this checklist asks about is the intermediary, not the seller.** A provider of an online
  marketplace is \"a provider of an intermediary service using an online interface which allows
  consumers to conclude distance contracts with traders for the sale of products\" - Article 3(14),
  quoted whole in the gate. A business that also sells its own goods through the same interface
  holds both roles at once, product by product, and recital 46 says so; this checklist covers the
  intermediary role only, and the sibling checklist covers the other one. **Whether row 25 can be
  called covered once this file ships is not decided here and is not this file's decision to take.**
  Nothing in this file changes row 25's Status word. **The Regulation has applied in full since 13
  December 2024** - Article 52, quoted in the gate - **and Article 52 defers no article and no
  paragraph at all.** Every paragraph of Article 22 has been in application since that date. Every
  finding this checklist produces is therefore a statement about a **present** obligation, and **the
  preparation wording used by the Cyber Resilience Act checklists in this repository must not be
  reused here**: those rows are worded as preparation because their duties are deferred to 11
  December 2027, and copying that phrasing onto a GPSR finding would be wrong by twenty months.
  Article 47(3) sets 13 December 2027 as the date by which the **Commission** must assess a Union
  notification system for Article 22(4), (5) and (6); that is a duty on the Commission and it defers
  nothing. Article 51, the one transitional provision, binds Member States and creates no relief for
  any marketplace duty. **The gate has two tiers, and the second tier does not switch this checklist
  off.** Tier 1 asks whether the business being scanned is a provider of an online marketplace at
  all, and whether what is sold through the interface is a 'product' the Regulation reaches. Tier 2
  asks the **size** question: whether the operator is a micro or small enterprise within Commission
  Recommendation 2003/361/EC, whether it has been designated a very large online platform or very
  large online search engine under Article 33 of the Digital Services Act, and, where it is not a
  micro or small enterprise now, whether it lost that status within the preceding 12 months. **The
  third question widens the exclusion and never withholds it**, because the second subparagraph of
  Article 19(1) and of Article 29(1) of the Digital Services Act extends each exclusion to a
  provider that previously qualified, for the 12 months following the loss of that status. **Every
  one of those is a fact about the business, so every one is asked of the person running the scan
  and none is inferred from source vocabulary.** **The size finding is the single most consequential
  thing behind this checklist, and it is the Commission's reading rather than the Regulation's
  words.** No size word appears anywhere in Article 22, or anywhere in the GPSR as an exemption.
  **Four search needles over the Official Journal text of the Regulation are what that statement
  rests on, and their counts are given here so that a later reader can re-run them.** `micro`
  returns four hits: the SME-guidance recital 41, recital 85 on reaching consumers directly for
  recalls and safety warnings, the second subparagraph of Article 17(2), and one irrelevant match in
  Article 2(2)(d), which excludes \"genetically modified microorganisms in contained use\". `small
  enterprise` returns one, in recital 85. `SME` as a whole word returns four: recital 41, Article
  17(2), the SME factor in Article 18(5)(a) and the 2029 review clause in Article 47(1). `2003/361`
  returns nothing at all, which is the strongest form of the point this paragraph makes. **The
  fourth needle is named because the first three do not reach Article 18(5)(a) or Article 47(1)**:
  both of those write \"SMEs\" and neither writes \"micro\" or \"small enterprise\", and this
  passage listed them as results of needles that do not return them until an independent legal
  verification re-measured all four on 2026-09-01. Not one of the provisions those needles reach is
  an exemption, a threshold or a reduced obligation. Recital 85's size words are in its closing
  sentence, which encourages operators to make all customers aware of a recall notice and to offer
  remedies to other end-users, \"especially in the case of micro- and small enterprises acting like
  consumers\"; the remedies a recall must offer are Article 37 and carry no size words either. **The
  carve-out is imported, not written.** Article 22(7), (9) and (11) each open \"For the purpose of
  compliance with [a named Digital Services Act article]\", and the Commission's Guidelines of 21
  November 2025 (Commission notice, Guidelines on the application of the EU general product safety
  legislative framework by businesses, OJ C/2025/6233, CELEX 52025XC06233) state at footnote 27,
  quoted whole in the gate, that those three paragraphs \"include specifications of certain DSA
  obligations, namely Articles 23 and 31 thereof, and therefore follow the scope of application of
  the latter\", and that under Articles 19 and 29 of that Regulation the obligations \"are in
  principle not applicable to providers of platforms that qualify as Micro and Small Enterprises
  (SMicE)\", subject to the derogation for a platform designated as a very large online platform.
  **That is a stated Commission position and it is not the law**; the Guidelines say of themselves
  that they are \"intended purely as a guidance document\", that \"only the text of the EU
  legislation itself has legal force\" and that \"the binding interpretation of EU legislation is
  the exclusive competence of the Court of the European Union\", and no court has ruled on the
  point. **The argument the other way is carried rather than hidden**: Article 22(7), (9) and (11)
  each say \"providers of online marketplaces shall\", addressing the GPSR's own defined class,
  which has no size threshold; recital 49 says the Regulation \"should lay down due diligence
  obligations for all providers of online marketplaces\"; and recital 47 saves the Digital Services
  Act's application without saying that the GPSR duty shrinks to its scope. The Commission's reading
  is followed because it is the only reasoned position from any authority, a specification of a duty
  that does not bind you cannot itself bind you, and it is the reading that does not tell a small
  operator to do something the Commission has published that it need not do. **A second route out of
  Article 22(7), (9) and (11) exists on the definitions and is recorded as open rather than used.**
  The GPSR class is broader than the class those three Digital Services Act articles bind in a way
  that has nothing to do with size: an 'online platform' additionally requires dissemination to the
  public, and 'provider of an online marketplace' does not. A closed or invitation-only intermediary
  could therefore be a GPSR marketplace and not a Digital Services Act online platform. **No source
  addresses this and this checklist settles it in neither direction**; it is not a route to any
  verdict here. **The two conditions the sibling checklist uses for Article 19(b) and Article 19(d)
  do NOT transfer to Article 22(9)(b) and Article 22(9)(d), and this sentence is the most important
  thing in this file.** Article 22(9)(b) is character-identical to Article 19(b), and Article
  22(9)(c) is character-identical to Article 19(c) - mechanically verified against the Official
  Journal - so an author or a reader moving fast will carry the sibling's conditions straight
  across. **The identical words do not carry the identical meaning.** Article 19 asks what **the
  operator's own offer** displays, so \"my manufacturer is established in the Union\" closes it.
  Article 22(9) asks what field **the interface must offer for each product offered by any trader**,
  so the fact that would close it is \"no product offered through this marketplace, by any trader,
  has a manufacturer established outside the Union\" - a marketplace-wide statement that would have
  to be true continuously and that almost no marketplace can make. The same reasoning applies to
  Article 22(9)(d): the sibling's closing fact is \"no warning is required for **this** product\",
  and the equivalent here would be \"no product offered through this marketplace requires any
  warning or safety information\". **Neither is a condition on this checklist and neither may be
  added to one.** **A document's silence is `unresolved` and never `not-applicable`. This is the
  rule most likely to be broken by anything built from this file, so it is stated once here, again
  on every one of the forty-one items, and mechanically in the build's reconciliation gate check,
  which is where a written decision in this project becomes something a build can fail on.** Where
  the product's own declared documents say nothing about an item, the answer is `unresolved` and
  never `not-applicable`, because recording `not-applicable` would turn a null result into a
  statement that the requirement does not reach this business. \"We looked and found nothing\" is
  not evidence that nothing is there, and a repository's failure to mention a duty is a fact about
  the repository. **The rule admitting `not-applicable` is this one, and both of its halves bind: a
  fact affirmatively stated by the person running the scan closes a genuinely conditional limb.** It
  must be a fact **that somebody stated** - a document that fails to mention something never
  supplies one, and neither does this scanner's own failure to find something. And the limb must be
  **genuinely conditional** - a limb carrying no words of condition cannot be closed by any fact at
  all. **A timing trigger is not a condition and a knowledge qualifier is not a condition.**
  \"within two working days from receipt of the order\", \"from the receipt of the notice\", \"in
  the event of a product safety recall\", \"of which they have actual knowledge\", \"of which they
  have been informed\", \"where they have knowledge that\" all say **when** the act must be done.
  None of them says whether the duty reaches this marketplace, and \"we have never received an
  order\" is a statement about history that closes nothing: the same sentence imposes a standing
  readiness duty that binds regardless. **Two such conditions exist on this checklist, and between
  them they reach fourteen of the 41 items. They are enumerated rather than counted, because a count
  asserted in this field while the items named more conditions than the count allowed is exactly how
  the sibling checklist's equivalent paragraph was wrong until 2026-08-06.** **(1) Tier 2 of the
  gate answered so that the operator sits outside Sections 3 and 4 of the Digital Services Act's
  Chapter III** - it qualifies as a micro or small enterprise within Commission Recommendation
  2003/361/EC **or** it lost that status within the preceding 12 months, **and** in either case it
  has not been designated a very large online platform or very large online search engine under
  Article 33 of that Regulation - makes the thirteen items drawn from the three paragraphs that
  specify a Digital Services Act obligation `not-applicable`: the Article 22(7) item, the eleven
  Article 22(9) items and the Article 22(11) item. **The size limb and the designation limb must
  both be affirmatively stated**, because Articles 19(2) and 29(2) of that Regulation put a
  designated very large online platform back inside the Sections regardless of its size. **The
  twelve-month rule is a second way into the size limb and not a third requirement, and this file
  said the opposite until 2026-08-07.** The **second** subparagraph of Article 19(1), and the second
  subparagraph of Article 29(1), each extend the exclusion to a provider that previously qualified
  as a micro or small enterprise \"during the 12 months following their loss of that status pursuant
  to Article 4(2) thereof, except when they are very large online platforms in accordance with
  Article 33\"; both are quoted in the gate. An operator that stopped being small three months ago
  is therefore **inside** the exclusion. This field used to require, as a third limb, that the
  status had **not** been lost in the preceding 12 months, and attributed the tail to \"the first
  subparagraph of each\". Both were wrong, an independent legal verification found them on
  2026-08-07, and the correction is written here rather than made silently because the wrong version
  is the one an earlier reader may have acted on. The error was conservative - it could only ever
  hold an item open that the Commission's reading closes - and it was still a false statement of
  what the Digital Services Act requires, in the field that decides the branch. **(2) No technical
  obstacle to the extraction of data** being in place, on this interface or on any online seller's,
  makes the Article 22(12)(i) item `not-applicable`. **That limb is conditional in the operative
  text itself**: it bites \"when providers of online marketplaces or online sellers have put in
  place technical obstacles to the extraction of data from their online interfaces (data
  scraping)\", so where none is in place the limb imposes nothing. **Both halves of that condition
  bind**, and the second is the one a closing fact usually forgets: a statement about the
  marketplace's own interface says nothing about a seller's storefront pages, and the limb reaches
  obstacles put in place by either. Holding that item at `unresolved` whatever anybody states would
  misdescribe a conditional limb as permanently open, which is its own error and not a safe default.
  **Article 22(6) carries the words \"where applicable\" on its face and is deliberately NOT given a
  condition, and the reason is the sibling checklist's own precedent.** Two readings of that
  paragraph exist: on the first the core duty to \"take into account regular information on
  dangerous products\" is unconditional and the voluntary measures are what the information is taken
  into account for, which is how the Commission renders it; on the second \"where applicable\" is a
  genuine word of condition. **The reading is not settled and this file does not settle it.** An
  open reading cannot carry `not-applicable`, because that verdict is a positive statement that the
  requirement does not reach this business, and a reading nobody has settled cannot support one. The
  textual condition is recorded on the two Article 22(6) items so that a later reader can see it was
  noticed rather than missed. **Tier 2 is an exception to the rule in the sentence above, it is the
  only one on this checklist, and it is written here as an exception rather than left to collide
  with the rule.** The Commission's reading of Article 22(7), (9) and (11) is no more settled than
  the two readings of Article 22(6) - it is non-binding guidance, no court has ruled on it, and
  recital 49 and the operative text pull the other way - and it nevertheless carries
  `not-applicable` on thirteen items where the size fact is stated. Three things distinguish the two
  situations, and they are set out so that a later reader can reject them. **First, one reasoned
  published position from an authority exists here and none exists on the other side**, whereas
  Article 22(6) has two readings with no authority behind either. **Second, the paragraphs differ in
  kind**: Article 22(7), (9) and (11) each open \"For the purpose of compliance with\" a named
  Digital Services Act article and impose no duty of their own, so a specification of a duty that
  does not bind this operator cannot itself bind it, while Article 22(6) states a free-standing GPSR
  duty whose scope does not depend on any other instrument. **Third, the two ways of being wrong are
  not symmetrical**: following the Commission risks closing thirteen items a court might later read
  the other way, and refusing to follow it tells a small operator to do exactly what the Commission
  has published that it need not do. **That is a reason and not a proof**, and what follows if it is
  rejected is stated too: the thirteen items would then be `unresolved` for a micro or small
  marketplace rather than closed, and no item on this checklist would ever be closed by the size
  fact. **The remaining twenty-seven items can never be `not-applicable` on the strength of a stated
  fact, because they carry no condition for any fact to close** - the gate's own `does-not-apply`
  verdict, answered in `applicability`, is the one route to that word for them, as each of their
  notes says. **Silence on any of the forty-one is `unresolved`**, including on the fourteen that a
  stated fact can reach, because silence is not one of the facts described above. **Every sentence
  in this block is about what a stated FACT can do to an item, and none of them is about the gate's
  own verdict, which is a different question and is answered in a different field.** Tier 1 of the
  gate decides whether this Regulation reaches the business at all. Where tier 1 is answered `no`
  the checklist does not apply to it, and what the forty-one items then carry is the gate's own
  reasoning rather than any answer of their own; `applicability.when_unresolved` sets out that
  branch and the two beside it, item by item, and it is the field to read for them. Nothing in this
  block is a route around the gate: what the twenty-seven refuse is the closing of an unconditional
  limb by a fact about a marketplace, and a gate verdict that there is no marketplace is not a fact
  about one. **The two senses of the word are kept apart everywhere in this file**, and each of the
  twenty-seven says so on its own note. **Article 22(4)'s first subparagraph binds Member States and
  no item is written against it.** It reads \"Member States shall confer on their market
  surveillance authorities the necessary power\", and a checklist item asking the person running the
  scan whether they have conferred a power on a market surveillance authority would be asking the
  wrong person entirely. The same goes for Article 22(5) read as a grant, which conditions the
  **order** and not the marketplace's duty, and for Articles 27, 34(5) and 47, which bind the
  Commission. Article 22(5) does appear as one item, worded as the **capability** an order can call
  on, because the duty to comply with a validly issued order comes from Article 22(4) and reaches
  whatever that order may lawfully require. **Article 35(2) is deliberately not an item, and the
  omission is recorded rather than left to be noticed.** That paragraph is genuinely conditional, it
  does reach marketplaces, and its closing fact - \"this marketplace operates no product
  registration system and no customer loyalty programme\" - is stateable. **Its legal home is
  Article 35(2) and not Article 22**, and row 25 of the coverage map names Articles 19, 16 and 22.
  Adding a fourth article to a row is a granularity decision that belongs to the owner, so the duty
  is named here and left unbuilt. Article 22(12)(a)(i)'s own route into Article 35 is carried on
  that item instead. **Article 22(12)(a)'s own chapeau is a free-standing duty, it was recorded here
  as an unbuilt omission from 2026-09-01, and on 2026-09-02 the item that closes it was added. The
  history is kept rather than replaced.** Point (a) reads \"ensure that they provide appropriate and
  timely information to consumers including by:\" and then names two acts - (i) directly notifying
  affected consumers, and (ii) publishing recall information on the online interfaces - each of
  which has an item on this checklist. **\"Including by\" is not limiting**, in the same way that
  the Article 22(12) chapeau's \"In particular\" is not limiting and the Article 22(9) chapeau
  carries two duties of which the ten field items answer only the first. Both of those chapeaux have
  an item of their own here, and since 2026-09-02 point (a)'s has one too:
  `art-22-12-a-appropriate-and-timely-information`, unconditional, left standing by tier 2 like
  every other Article 22(12) limb, and carrying the same silence rule as the rest. It is the
  forty-first item, and it is placed in article order, above the two items for the acts point (a)
  names. **What stood here until 2026-09-02, and why it stood.** An independent legal verification
  of 2026-09-01 found that a marketplace can perform both named acts and still not have ensured that
  it provides appropriate and timely information to consumers, and that this checklist did not ask
  it whether it had. That verification named two dispositions - build the item, or record in this
  field that point (a) is treated as exhausted by (i) and (ii) - and said the choice was the
  owner's, because adding an item is a granularity decision: every count this file states, the
  counts the build's reconciliation gate check recomputes from them, and this checklist's own
  fixture trees all move together with such an item, so it is one decision taken once and not a
  drafting change. This field therefore carried the gap, the drafted wording of the item, and the
  reason it was not built, so that the owner could approve it in one step. **The disposition NOT
  taken is still the one that was never available**: this file has never asserted that point (a) is
  exhausted by its two named acts, because that would be a false statement rather than a recorded
  gap. **What the two sub-items answer, which the new item does not change.** A finding on
  `art-22-12-a-i-direct-notification-of-affected-consumers` or on
  `art-22-12-a-ii-publishing-recall-information` answers the named act it is about and is not an
  answer about the chapeau above them, and neither may be presented as one. The chapeau is now asked
  in its own right, on its own item, and that item's own note repeats this fence. **No item below
  names a census category, and the omission is deliberate.** `census_categories` is the field
  through which code facts are offered to an adjudicating agent as bearing on an item. Every
  question this checklist asks is about a **relationship with authorities, traders and consumers** -
  a designation, a registration in a Commission system, a filing, an onboarding step, a staffing
  commitment - or about what a rendered listing shows a consumer. No code fact decides any of them.
  A mailbox in a configuration file is not a designated single point of contact; a template in a
  source tree is not what a listing displays, because a template can be overridden; rate limiting
  and bot detection usually live in infrastructure outside the repository and the contractual
  prohibition on automated collection lives in a published document. An agent reading the tree may
  of course notice such things and use them to corroborate or to doubt what the documents say, and
  this checklist deliberately provides no structural field through which such an observation could
  be presented as evidence. The pin is held outside this file, in the build's reconciliation gate
  check. **Penalties are national and no figure appears anywhere in this checklist.** Article 44
  requires Member States to lay down the rules on penalties for infringements of this Regulation
  that impose obligations on economic operators **and** providers of online marketplaces, and to
  make them effective, proportionate and dissuasive. It names one class for both, sets no ceiling,
  no percentage and no amount, and delegates the whole tariff to the Member States, so any figure
  stated for a breach of Article 22 would be invented. **A second exposure exists on Article 22(7),
  (9) and (11) and is recorded as an inference rather than as a finding**: those three are, on the
  Commission's own account, specifications of Digital Services Act obligations, so a marketplace
  inside Section 3 or Section 4 of that Regulation's Chapter III that falls short of them may be
  exposed under that Regulation's own penalty regime as well, which does carry a ceiling. **No
  source says that a shortfall under GPSR Article 22(9) is a shortfall under Article 31 of that
  Regulation**, the inference is this file's own, and no percentage is quoted here or in any finding
  produced from it. **Article 22(12)(i) is the trap on this row and it is named before anybody
  writes a detector.** Whether an interface puts technical obstacles in the way of extracting data
  is the one condition in Article 22 that a repository could plausibly corroborate, and it is
  exactly where a source-vocabulary detector would be most tempting and most wrong. **It reaches no
  verdict about a marketplace**: it records what the declared documents say and what remains
  unanswered, and a human decides what that means. It does not test whether any interface actually
  displays anything, which is a property of the rendered listing rather than of any document in a
  repository; that limit is repeated on each Article 22(9) item rather than left here. **The
  coverage map's Class column for row 25 reads DECL / RUN, and this checklist was authored as the
  DECL half.** The RUN half - loading the marketplace's own listing pages and reading them as a
  consumer sees them, which is the only place Article 22(9)'s display duty can actually be tested -
  does not exist in this repository. Testing a row's Class column is the first step of a row and
  changing it is the owner's call, so the map's cell is unchanged and this paragraph exists so that
  no later reader has to guess whether it was tested."
applicability:
  question: "Two tiers. **Tier 1 - is the business being scanned a provider of an online marketplace
    at all?** Does it operate an online interface through which consumers can conclude distance
    contracts with **third-party traders** for the sale of products - that is, do people other than
    you list products for sale to consumers through your interface, and can a consumer complete a
    purchase from one of them through it? Answer **yes** even if you also sell your own products
    alongside theirs; the two roles run in parallel, recital 46 says so, and this checklist covers
    only the intermediary one. Answer **no** if every product sold through the interface is sold by
    you (limb (i)), if the interface only puts buyers and sellers in touch and the contract is
    concluded elsewhere (limb (i)), if the counterparties are private individuals rather than
    businesses (limb (ii)), or if nothing sold through it is a product (limb (iii)) - a
    services-only marketplace is outside Article 22 because the definition ends \"for the sale of
    products\". **Those are the four exits and there is no fifth**: they close limb (i) twice, limb
    (ii) once and limb (iii) once, and limb (iv) of the limb list has no exit at all because no
    answer to it can put a business outside this checklist. If your interface distributes
    third-party software, apps or games to consumers, this checklist cannot tell you the answer:
    whether standalone software is a \"product\" under this Regulation is genuinely open, the
    Commission has said it is and the Regulation's own text says neither, and no court has ruled -
    record that and treat every item as unresolved rather than guessing in either direction. Note
    what tier 1 does **not** ask: being subject to Union harmonisation legislation is irrelevant
    here, because Article 2(1)(b) disapplies Chapter IIa, Chapter III Section 1, Chapters V and VII
    and Chapters IX to XI and does **not** name Chapter IV, so a marketplace whose products are all
    covered by sector-specific Union law is still fully inside Article 22. **Tier 2 - the size
    question, and this tier does not switch the checklist off.** Is the legal entity operating the
    marketplace a **micro or small enterprise** within the meaning of Commission Recommendation
    2003/361/EC? If it is not one now, did it lose that status within the preceding 12 months? And
    has it been designated a **very large online platform or very large online search engine** by
    the Commission under Article 33 of the Digital Services Act? **The twelve-month question is a
    second route into the size answer and not a further hurdle.** The second subparagraph of Article
    19(1), and the second subparagraph of Article 29(1), keep a provider outside those Sections for
    the 12 months following its loss of micro or small status, unless it is a very large online
    platform under Article 33. So the size limb is met either by qualifying now or by having
    qualified at any point within the last 12 months, and in both cases the designation question
    must be answered **no**. Both answers come from your own accounts and your own correspondence
    with the Commission, never from anything in your code - no repository can show the size of the
    company that owns it. Answered that way, tier 2 switches off the thirteen items drawn from
    Article 22(7), Article 22(9) and Article 22(11), and leaves the other twenty-eight standing. So
    the question this tier is really asking, put in the form nobody can read as a switch for the
    whole checklist, is **which of the forty-one items the size answer reaches**, and the answer is
    thirteen of them. **Seven questions are put by this gate and there is nowhere in the scan input
    to write the answers down, so the report has to carry them.** The structured answer file a
    person may hand this scan has fields for the platform, the technology stacks, the distribution
    regions, the audience, the supply and a fixed list of features, and it has no field for
    marketplace or intermediary status, none for enterprise size and none for a designation under
    Article 33 of the Digital Services Act. Whoever runs this scan therefore asks the seven
    questions in conversation, and until such a field exists the answers survive only if the report
    writes them down. **Ask, in these words, and record each answer beside this checklist's
    applicability verdict, naming who gave it and when**: (1) do people other than you list products
    for sale to consumers through your interface, and can a consumer complete a purchase from one of
    them through it; (2) are those sellers acting for purposes relating to a trade, business, craft
    or profession, rather than as private individuals; (3) is what they sell through it a product
    within Article 3(1), rather than a service; (4) do you also sell your own products through the
    same interface; (5) is the legal entity operating the marketplace a micro or small enterprise
    within Commission Recommendation 2003/361/EC; (6) if it is not one now, did it lose that status
    within the preceding 12 months; and (7) has it been designated a very large online platform or
    very large online search engine by the Commission under Article 33 of the Digital Services Act.
    **An answer that is not written into the report is an answer the next run does not have**, and a
    verdict recorded without them cannot be re-checked by anybody reading the artefact afterwards;
    where a question was not put, name it and say that it was not put, rather than leaving a reader
    to infer it from the verdict. So, with all seven on the record: which of the forty-one items
    does the size answer reach for you?"
  quote: "'provider of an online marketplace' means a provider of an intermediary service using an
    online interface which allows consumers to conclude distance contracts with traders for the sale
    of products;"
  cite: GPSR Art. 3(14)

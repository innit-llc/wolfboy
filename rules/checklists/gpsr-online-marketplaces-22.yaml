  - id: art-22-9-c-picture-of-the-product-field
    article: Art. 22(9)(c)
    quote: information allowing the identification of the product, including a picture of it, its type
      and any other product identifier; and
    quote_anchor: "For the purpose of compliance with the requirements of Article 31(1) and (2) of
      Regulation (EU) 2022/2065 as regards product safety information, providers of online
      marketplaces shall design and organise their online interface in a way that enables traders
      offering the product to provide at least the following information for each product offered
      and that ensures that the information is displayed or otherwise made easily accessible by
      consumers on the product listing:"
    cite: GPSR Art. 22(9)(c)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Does your interface let a trader upload a picture of the product, and does the picture
      reach the consumer on the listing?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This limb is character-identical to Article 19(c) and carries `quote_anchor`
      for that reason.** The anchor is the Article 22(9) chapeau, which occurs exactly once in the
      Regulation and is addressed to marketplace providers rather than to economic operators. **The
      branch is the Commission's reading and it is not the law, and this item says so where an agent
      will read it.** Footnote 27 of Commission notice C/2025/6233 is quoted whole in the gate; the
      Guidelines are guidance only by their own disclaimer, no court has ruled on the point, the
      operative text of Article 22(9) carries no size words at all, and recital 49 says the
      Regulation lays down duties for **all** providers of online marketplaces. The scope note
      carries the counter-reading and states why this checklist follows the Commission anyway.
      **Tier 2 of the gate reaches this item.** Where the person running the scan states that the
      operator is a micro or small enterprise that is not a designated very large online platform,
      this item is `not-applicable`. That is the first of the two conditions the scope note
      enumerates, and it counts because a stated fact closed a conditional limb. **The twelve-month
      rule extends that exclusion and never withholds it.** On the second subparagraph of Article
      19(1) of the Digital Services Act, and on the second subparagraph of its Article 29(1), a
      provider that lost micro or small status within the preceding 12 months is outside those
      Sections as well, unless it has been designated under Article 33. So a recent loss of the
      status reaches this same answer rather than denying it. **This checklist said the opposite
      until 2026-08-07**, requiring as a third limb that the status had not been lost in that
      period, and the correction is recorded on every item it touched. **The three elements of
      Article 22(9)(c) are treated alike on this checklist, and the reason is recorded.** The limb
      attaches no words of condition to the picture, to the type or to any other product identifier,
      so none of the three has a route to `not-applicable` that the other two are denied. The
      sibling checklist was corrected on exactly this point on 2026-08-06 when one of its three
      Article 19(c) elements had been given a condition its siblings did not have. **What counts as
      a picture is defined broadly, in a recital.** Recital 42 - interpretive, and never the sole
      support for a conclusion - says a picture \"should be considered as a photograph, illustration
      or other pictographic element, which easily allows the identification of a product or
      potential product\". **A picture discharges this element and not the limb.** The Commission's
      position on this paragraph is that the points of information \"are set out cumulatively in
      Article 22(9)\" and that \"prima facie, it would be difficult to satisfy this obligation with
      just a picture\", since a simple picture would also have to display the warning or safety
      information. **The document that says so is named here, because attributing a position to the
      Commission without naming where it stands is not a citation.** It is section 6.2, on page 17
      of 19, of the Commission document titled \"EU General Product Safety Regulation - Frequently
      asked questions (FAQ)\", published at the Commission's Safety Gate address for business
      obligations as `Q&A.pdf`. **This checklist called it a \"questions-and-answers document\"
      until 2026-08-07**, which is the file name rather than the title, and a reader searching by
      the name given would not have found it. **It is not in the Guidelines this checklist otherwise
      cites**: a search of the Official Journal text of Commission notice C/2025/6233 for
      `cumulativ`, `prima facie` and `just a picture` returns zero hits, checked on 2026-08-07.
      **Its provenance carries a limit that travels with it, and the limit is the route rather than
      the text.** The Commission's own host still returns a block page, checked on 2026-08-07. The
      passage was re-retrieved independently on that date from an Internet Archive snapshot of that
      same Commission address, captured 2025-04-12, and the bytes were checked rather than assumed:
      the SHA1-base32 of the downloaded file is identical to the digest the archive recorded at
      capture time. **Both the address and the digest are given here, so that this paragraph can be
      re-checked from the checklist alone**: the snapshot is
      `web.archive.org/web/20250412064803id_/https://webgate.ec.europa.eu/safety/consumers/consumer\
      s_safety_gate/obligationsForBusinesses/documents/Q&A.pdf`, 416,447 bytes, and the digest is
      `E4KZYQWN42IZLDIKDNQ2PPEXYSOGMSZM`. They stood only in a private verification record until
      2026-08-07, so a reader of this file was told that bytes had been checked and given nothing to
      check them against. **This file said until 2026-08-07 that the passage had not been
      re-verified from an unblocked network, and that is now out of date** - what remains true is
      that it is read from a mirror and not from the Commission serving it. **The March 2025 date is
      file metadata and is not printed anywhere in the document.** There is no version line and no
      date stamp; the date is the PDF `CreationDate` and `ModDate` of 2025-03-24. **The dating is
      nevertheless right, and it was confirmed by control rather than by the metadata alone**: the
      2025-02-22 snapshot of the same address is a genuinely earlier revision - 8 pages, created
      2024-12-13 - and it contains no section 6.2 and none of the strings quoted above, so the
      passage was introduced in the March 2025 revision. That revision is still the current one; the
      digest is unchanged in snapshots through 2026-06-15. It remains a stated Commission position
      and it is not the law, and **it drives no verdict on this item either way.** **This file said
      \"non-binding by its own document's terms\" until 2026-08-07 and that clause is withdrawn**:
      it is a claim about what the FAQ says about itself, the FAQ is not one of the three sources in
      this checklist's quote receipt, and no quote anywhere supports it. What is supported without
      it is the general position this file states of the Guidelines and states again here - only the
      text of the EU legislation itself has legal force, and the binding interpretation of it is the
      exclusive competence of the Court of Justice of the European Union - which reaches a
      Commission FAQ a fortiori. The direction of the withdrawn clause was conservative and it was
      still unverified, in the one paragraph of this file whose whole subject is provenance rigour.
      **Where the declared documents say nothing about this, the answer is `unresolved`, never
      `not-applicable` and never a bare `absent` presented as a shortfall.**"

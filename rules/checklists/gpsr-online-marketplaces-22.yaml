  - id: art-22-12-d-reporting-dangerous-products-to-authorities
    article: Art. 22(12)(d)
    quote: immediately inform, through the Safety Business Gateway, the market surveillance authorities
      of the Member States in which the relevant product has been made available on the market about
      dangerous products that were offered on their online interfaces, of which they have actual
      knowledge, by providing the appropriate details available to them of the risk to the health
      and safety of consumers, of the quantity by Member State of products still circulating on the
      market, if available, and of any corrective measure that, to their knowledge, has already been
      taken;
    cite: GPSR Art. 22(12)(d)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: When you have actual knowledge that a dangerous product was offered on your interfaces, do
      you immediately inform the market surveillance authorities of the affected Member States
      through the Safety Business Gateway, with the risk details, the quantities still circulating
      where you know them, and any corrective measure already taken?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every Article 22(12) limb.
      **\"Immediately\" is the strictest of the four time expressions in Article 22** and it is not
      interchangeable with \"without delay\" in point (e)(i) or \"without undue delay\" in point
      (e)(ii). A finding must use this limb's own word. **This is a filing into the Safety Business
      Gateway and not into the Safety Gate Portal.** The Gateway is the Commission web portal
      through which businesses provide information **to** authorities, established by Article 27;
      the Portal is the public rapid-alert interface the marketplace registers with under Article
      22(1) and reads under Article 22(6). Confusing the two is the commonest error on this Article.
      **\"Of which they have actual knowledge\" is a knowledge qualifier and not a condition**, and
      recital 56 is the reason it matters: the obligations in this Regulation do not amount to a
      general obligation to monitor or to actively seek facts indicating illegal activity. The limb
      bites on what the marketplace knows, and knowing nothing yet is not a fact that closes it.
      **The limb names three contents and a finding should say which are covered**: the risk to
      consumers' health and safety, the quantity by Member State still circulating where available,
      and any corrective measure already taken to the marketplace's knowledge. **A filing in a
      Commission system leaves no trace in a repository.** **Where the declared documents say
      nothing about this, the answer is `unresolved`, never `not-applicable` and never a bare
      `absent` presented as a shortfall.** This limb carries no words of condition, so no stated
      fact can close it and `not-applicable` is never correct on this item while the gate's verdict
      is `applies`. The one route to that word here is the gate's own `does-not-apply` verdict,
      which is a finding that there is no marketplace rather than a fact about one, and what the
      item then carries is the gate's reasoning; `applicability.when_unresolved` sets that branch
      out for all forty-one items at once."

      it.** Point (a) states a duty in the words before the colon and then names two acts, in the
      same construction as the Article 22(12) chapeau's \"In particular\" and the two duties the
      Article 22(9) chapeau carries. So a marketplace can directly notify every affected consumer
      and publish every recall on its interfaces and still not have ensured that it provides
      appropriate and timely information to consumers. A finding on
      `art-22-12-a-i-direct-notification-of-affected-consumers` or on
      `art-22-12-a-ii-publishing-recall-information` answers the named act it is about and is not an
      answer about this item, and neither may be presented as one. **This item was written on

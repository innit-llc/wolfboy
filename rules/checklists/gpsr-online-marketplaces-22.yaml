  - id: art-22-12-a-i-direct-notification-of-affected-consumers
    article: Art. 22(12)(a)(i)
    quote: "ensure that they provide appropriate and timely information to consumers including by: (i)
      directly notifying all affected consumers who bought through their interfaces the relevant
      product in the event of a product safety recall of which they have actual knowledge or where
      certain information has to be brought to the attention of consumers to ensure the safe use of
      a product (the 'safety warning') in accordance with Article 35 or 36, or both;"
    cite: GPSR Art. 22(12)(a)(i)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: When you have actual knowledge of a product safety recall, or a safety warning has to
      reach consumers, do you directly notify every affected consumer who bought that product
      through your interfaces?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every Article 22(12) limb.
      **\"Of which they have actual knowledge\" is a knowledge qualifier and not a condition.** It
      says when the act must be done, not whether the duty binds this marketplace. A statement that
      no recall has ever occurred closes nothing. **This limb routes into Article 35, which is where
      the actual duty is stated.** Article 35(1) names providers of online marketplaces \"in
      accordance with their obligations as provided for in Article 22(12)\" and requires that all
      affected consumers that can be identified are notified **directly and without undue delay**;
      it adds that a marketplace collecting its customers' personal data must use that information
      for recalls and safety warnings, and Article 35(4) requires a clear and visible recall notice
      through other appropriate channels where not all affected consumers can be contacted,
      accessible to persons with disabilities. Article 36 governs the form of a written recall
      notice, beginning with a headline consisting of the words 'Product safety recall'. **A finding
      that stops at the cross-reference leaves the duty unstated.** **Article 35(2) is a related
      duty that this checklist deliberately does not cover**, because its legal home is Article 35
      rather than Article 22 and row 25 of the coverage map names Articles 19, 16 and 22. It
      requires a marketplace operating a product registration system or a customer loyalty programme
      to offer customers the option of giving separate contact details used only for safety
      purposes. It is named here so that a reader can see it was considered. **Who was actually
      notified is a historical fact about messages sent.** No repository contains it. **Where the
      declared documents say nothing about this, the answer is `unresolved`, never `not-applicable`
      and never a bare `absent` presented as a shortfall.** This limb carries no words of condition,
      so no stated fact can close it and `not-applicable` is never correct on this item while the
      gate's verdict is `applies`. The one route to that word here is the gate's own
      `does-not-apply` verdict, which is a finding that there is no marketplace rather than a fact
      about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."

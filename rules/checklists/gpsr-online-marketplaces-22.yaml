      only by their own disclaimer, no court has ruled on the point, the operative text of Article
      22(9) carries no size words at all, and recital 49 says the Regulation lays down duties for
      **all** providers of online marketplaces. The scope note carries the counter-reading and
      states why this checklist follows the Commission anyway. **Tier 2 of the gate reaches this
      item.** Where the person running the scan states that the operator is a micro or small
      enterprise that is not a designated very large online platform, this item is `not-applicable`.
      That is the first of the two conditions the scope note enumerates, and it counts because a
      stated fact closed a conditional limb. **The twelve-month rule extends that exclusion and
      never withholds it.** On the second subparagraph of Article 19(1) of the Digital Services Act,
      and on the second subparagraph of its Article 29(1), a provider that lost micro or small
      status within the preceding 12 months is outside those Sections as well, unless it has been
      designated under Article 33. So a recent loss of the status reaches this same answer rather
      than denying it. **This checklist said the opposite until 2026-08-07**, requiring as a third
      limb that the status had not been lost in that period, and the correction is recorded on every
      item it touched. **Article 22(9)(b) names three data points and this is the second of them** -
      name, postal address, electronic address - and they are cumulative within the limb exactly as
      Article 22(9)(a)'s three are. **Article 22(9)(a) is not displaced by this limb either**: where

      size words at all, and recital 49 says the Regulation lays down duties for **all** providers
      of online marketplaces. The scope note carries the counter-reading and states why this
      checklist follows the Commission anyway. **Tier 2 of the gate reaches this item.** Where the
      person running the scan states that the operator is a micro or small enterprise that is not a
      designated very large online platform, this item is `not-applicable`. That is the first of the
      two conditions the scope note enumerates, and it counts because a stated fact closed a
      conditional limb. **The twelve-month rule extends that exclusion and never withholds it.** On
      the second subparagraph of Article 19(1) of the Digital Services Act, and on the second
      subparagraph of its Article 29(1), a provider that lost micro or small status within the
      preceding 12 months is outside those Sections as well, unless it has been designated under
      Article 33. So a recent loss of the status reaches this same answer rather than denying it.
      **This checklist said the opposite until 2026-08-07**, requiring as a third limb that the
      status had not been lost in that period, and the correction is recorded on every item it
      touched. **\"Type\" is not defined in the GPSR, and this item says so rather than inventing a
      test.** Article 3 defines twenty-eight terms and \"type\" is not among them. The nearest thing
      in the Regulation is Article 9(5), which requires manufacturers to ensure their products bear
      \"a type, batch or serial number or other element enabling the identification of the product\"
      - a different duty, attached to the product rather than to the listing. Record what the
      interface calls a type, quote the sentence, and say that the term is undefined. **A free-text
      field is not obviously the same as a type field.** Where an interface asks traders for a
      product title and nothing else, whether that discharges this element is a judgement, and a
      finding should present it as one. **Where the declared documents say nothing about this, the
      answer is `unresolved`, never `not-applicable` and never a bare `absent` presented as a
      shortfall.**"
  - id: art-22-9-c-other-product-identifier-field
    article: Art. 22(9)(c)
    quote: information allowing the identification of the product, including a picture of it, its type
      and any other product identifier; and
    quote_anchor: "For the purpose of compliance with the requirements of Article 31(1) and (2) of
      Regulation (EU) 2022/2065 as regards product safety information, providers of online
      marketplaces shall design and organise their online interface in a way that enables traders
      offering the product to provide at least the following information for each product offered
      and that ensures that the information is displayed or otherwise made easily accessible by
      consumers on the product listing:"
    cite: GPSR Art. 22(9)(c)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Does your interface let a trader enter any other product identifier, and does that
      identifier reach the consumer on the listing?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Character-identical to Article 19(c), so the quotation carries `quote_anchor`
      on the Article 22(9) chapeau.** **The branch is the Commission's reading and it is not the
      law, and this item says so where an agent will read it.** Footnote 27 of Commission notice
      C/2025/6233 is quoted whole in the gate; the Guidelines are guidance only by their own
      disclaimer, no court has ruled on the point, the operative text of Article 22(9) carries no
      size words at all, and recital 49 says the Regulation lays down duties for **all** providers
      of online marketplaces. The scope note carries the counter-reading and states why this
      checklist follows the Commission anyway. **Tier 2 of the gate reaches this item.** Where the
      person running the scan states that the operator is a micro or small enterprise that is not a
      designated very large online platform, this item is `not-applicable`. That is the first of the
      two conditions the scope note enumerates, and it counts because a stated fact closed a
      conditional limb. **The twelve-month rule extends that exclusion and never withholds it.** On
      the second subparagraph of Article 19(1) of the Digital Services Act, and on the second
      subparagraph of its Article 29(1), a provider that lost micro or small status within the
      preceding 12 months is outside those Sections as well, unless it has been designated under
      Article 33. So a recent loss of the status reaches this same answer rather than denying it.
      **This checklist said the opposite until 2026-08-07**, requiring as a third limb that the
      status had not been lost in that period, and the correction is recorded on every item it
      touched. **The reading that would make this element conditional is recorded and not adopted.**
      \"Any **other** product identifier\" could be read as biting only where such an identifier
      exists, so that a product carrying none would owe nothing under this element. The Official
      Journal text neither states that nor rules it out, and this checklist settles it in neither
      direction. **An open reading cannot carry `not-applicable`**, because that verdict is a
      positive statement that the requirement does not reach this business, and the three elements
      of the limb are treated alike here for the same reason. **On a marketplace the question is
      about the field, not about one product.** Whether a particular trader's product happens to
      have a barcode is beside the point: the paragraph asks whether the interface lets a trader
      supply an identifier and whether what is supplied reaches the consumer. **Note the chapeau's
      words \"at least\".** Article 22(9) is a floor and not a list of everything an interface must
      collect, so a marketplace collecting more than these four items is not thereby doing something
      wrong, and a finding here never says that it is. **Where the declared documents say nothing
      about this, the answer is `unresolved`, never `not-applicable` and never a bare `absent`
      presented as a shortfall.**"
  - id: art-22-9-d-warnings-and-safety-information-field
    article: Art. 22(9)(d)
    quote: any warning or safety information to be affixed on the product or to accompany it in
      accordance with this Regulation or the applicable Union harmonisation legislation in a
      language which can be easily understood by consumers as determined by the Member State in
      which the product is made available on the market.
    cite: GPSR Art. 22(9)(d)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Does your interface let a trader supply any warning or safety information that has to be
      affixed on the product or to accompany it, in a language easily understood by consumers in the
      Member State concerned, and does it reach the consumer on the listing?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This limb is NOT character-identical to Article 19(d), and the differences
      matter.** Article 19(d) reaches a warning \"to be affixed **to** the product or to the
      packaging or included in an accompanying document\"; this one reaches a warning \"to be
      affixed **on** the product or to accompany it\". The quotation therefore needs no anchor, and
      a reader comparing the two should not assume the wording is shared. **The sibling checklist's
      condition for Article 19(d) does NOT transfer to this limb.** There the closing fact is that
      no warning is required for **this** product; here it would have to be that **no product
      offered through this marketplace** requires any warning or safety information, which is a
      different and far stronger statement. **It is not a condition on this checklist and may not be
      added to one.** **The branch is the Commission's reading and it is not the law, and this item
      says so where an agent will read it.** Footnote 27 of Commission notice C/2025/6233 is quoted
      whole in the gate; the Guidelines are guidance only by their own disclaimer, no court has
      ruled on the point, the operative text of Article 22(9) carries no size words at all, and
      recital 49 says the Regulation lays down duties for **all** providers of online marketplaces.
      The scope note carries the counter-reading and states why this checklist follows the
      Commission anyway. **Tier 2 of the gate reaches this item.** Where the person running the scan
      states that the operator is a micro or small enterprise that is not a designated very large
      online platform, this item is `not-applicable`. That is the first of the two conditions the
      scope note enumerates, and it counts because a stated fact closed a conditional limb. **The
      twelve-month rule extends that exclusion and never withholds it.** On the second subparagraph
      of Article 19(1) of the Digital Services Act, and on the second subparagraph of its Article
      29(1), a provider that lost micro or small status within the preceding 12 months is outside
      those Sections as well, unless it has been designated under Article 33. So a recent loss of
      the status reaches this same answer rather than denying it. **This checklist said the opposite
      until 2026-08-07**, requiring as a third limb that the status had not been lost in that
      period, and the correction is recorded on every item it touched. **The language requirement is
      part of the limb and it is per Member State.** The warning must be in a language easily
      understood by consumers \"as determined by the Member State in which the product is made
      available on the market\", so an interface offering a single free-text warning field in one
      language has not obviously met it for a listing directed at several Member States. **A
      voluntary caution is not a required warning.** Whether anything must be affixed at all is a
      legal conclusion about the product's risks and about which instruments reach it, and the
      trader rather than the marketplace is the one who knows. This item asks about the field and
      the display, not about whether any particular warning was required. **Where the declared
      documents say nothing about this, the answer is `unresolved`, never `not-applicable` and never
      a bare `absent` presented as a shortfall.**"
  - id: art-22-9-display-on-the-product-listing
    article: Art. 22(9)
    quote: "For the purpose of compliance with the requirements of Article 31(1) and (2) of Regulation
      (EU) 2022/2065 as regards product safety information, providers of online marketplaces shall
      design and organise their online interface in a way that enables traders offering the product
      to provide at least the following information for each product offered and that ensures that
      the information is displayed or otherwise made easily accessible by consumers on the product
      listing:"
    cite: GPSR Art. 22(9), chapeau
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Taking the four data points together, is the information a trader supplies actually
      displayed or otherwise made easily accessible by consumers on the product listing, rather than
      only collected into your own systems?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This item exists because the chapeau contains two duties and the ten items
      above would otherwise answer only the first.** The interface must **enable** traders to
      provide the information, and it must **ensure that the information is displayed or otherwise
      made easily accessible by consumers on the product listing**. A marketplace with all four
      fields whose listing template prints none of them has met the enablement duty and not the
      display duty. **The branch is the Commission's reading and it is not the law, and this item
      says so where an agent will read it.** Footnote 27 of Commission notice C/2025/6233 is quoted
      whole in the gate; the Guidelines are guidance only by their own disclaimer, no court has
      ruled on the point, the operative text of Article 22(9) carries no size words at all, and
      recital 49 says the Regulation lays down duties for **all** providers of online marketplaces.
      The scope note carries the counter-reading and states why this checklist follows the
      Commission anyway. **Tier 2 of the gate reaches this item.** Where the person running the scan
      states that the operator is a micro or small enterprise that is not a designated very large
      online platform, this item is `not-applicable`. That is the first of the two conditions the
      scope note enumerates, and it counts because a stated fact closed a conditional limb. **The
      twelve-month rule extends that exclusion and never withholds it.** On the second subparagraph
      of Article 19(1) of the Digital Services Act, and on the second subparagraph of its Article
      29(1), a provider that lost micro or small status within the preceding 12 months is outside
      those Sections as well, unless it has been designated under Article 33. So a recent loss of
      the status reaches this same answer rather than denying it. **This checklist said the opposite
      until 2026-08-07**, requiring as a third limb that the status had not been lost in that
      period, and the correction is recorded on every item it touched. **\"For each product
      offered\" means per listing and not per account.** Collecting the information once when a
      trader registers does not discharge a duty expressed per product. **Recital 58 describes a
      blocking duty that this chapeau does not contain, and the gap must not be closed here.** The
      recital says providers \"should not allow a specific product offer to be listed on their
      platforms unless the trader has provided all information related to product safety and
      traceability as specified in this Regulation\"; the operative words are \"enables traders ...
      to provide\" and \"ensures that the information is displayed\". Article 31(3) of Regulation
      (EU) 2022/2065 comes closer, requiring best efforts to assess whether traders have provided
      the information before allowing them to offer. **A finding must be worded on the operative
      text; if the blocking behaviour is worth asking about, it is asked as a question and never
      reported as a shortfall.** **This is the item where a repository can corroborate most and
      still decide nothing.** A listing template, a product-detail component or a store schema is
      real evidence about what the interface is built to show, and it is not the rendered listing.
      The RUN half of this row, which would read a live listing, does not exist in this repository.
      **Where the declared documents say nothing about this, the answer is `unresolved`, never
      `not-applicable` and never a bare `absent` presented as a shortfall.**"
  - id: art-22-10-a-mechanisms-for-trader-information
    article: Art. 22(10)(a)
    quote: "The internal processes referred to in paragraph 3 shall include mechanisms which enable
      traders to provide: (a) information in accordance with paragraph 9 of this Article including
      information on the manufacturer established in the Union or, where applicable, the responsible
      person within the meaning of Article 16(1) of this Regulation or Article 4(1) of Regulation
      (EU) 2019/1020; and"
    cite: GPSR Art. 22(10), chapeau and point (a)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do your internal processes include mechanisms that enable traders to provide the product
      safety information described in paragraph 9, including information on the manufacturer
      established in the Union or on the responsible person?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing, and this is the item where that
      is hardest to see.** Article 22(10)(a) points at paragraph 9, which is one of the three the
      Commission reads as size-limited - and Article 22(10) itself hangs off Article 22(3), which is
      unconditional, and the Commission does not mark it among the three. **So on the Commission's
      own rendering a micro or small marketplace outside Article 22(9) is still inside Articles
      22(3) and 22(10) and must still have internal mechanisms enabling traders to supply that same
      information; what it escapes is the duty to have designed its interface around it and to have
      displayed it on the listing.** That is a real distinction, it is narrow, and this checklist
      records it as a tension rather than resolving it. **This item is worded so that it stands
      whether or not Article 22(9) applies.** **The words \"where applicable\" in this limb attach
      to the responsible person and not to the mechanism.** They mark the case where a responsible
      person exists because the manufacturer is not established in the Union; they do not make the
      duty to have a mechanism conditional. **A mechanism is an onboarding and process fact.** A
      trader-registration flow, a listing form specification or a published seller policy is the
      kind of thing that would corroborate one, and its absence from a repository is a fact about
      the repository. **Where the declared documents say nothing about this, the answer is
      `unresolved`, never `not-applicable` and never a bare `absent` presented as a shortfall.**
      This limb carries no words of condition that reach the mechanism, so no stated fact can close
      it and `not-applicable` is never correct on this item while the gate's verdict is `applies`.
      The one route to that word here is the gate's own `does-not-apply` verdict, which is a finding
      that there is no marketplace rather than a fact about one, and what the item then carries is
      the gate's reasoning; `applicability.when_unresolved` sets that branch out for all forty-one
      items at once."
  - id: art-22-10-b-trader-self-certification
    article: Art. 22(10)(b)
    quote: their self-certification committing to offer only products that comply with this Regulation
      and additional identification information, in accordance with Article 30(1) of Regulation (EU)
      2022/2065, where applicable.
    cite: GPSR Art. 22(10)(b)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do your internal processes include a mechanism through which a trader gives you a
      self-certification committing to offer only products that comply with this Regulation?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Article 22(10)(b) holds two elements that behave differently, and they are
      split into two items so that the gate is not wrong for one of them.** This item is the
      **self-certification**, which carries no words of condition at all. The next item is the
      additional identification information, which carries \"where applicable\" on its face and
      points at a provision in a Section of the Digital Services Act that the micro and small
      exclusion reaches. **Tier 2 of the gate leaves this item standing.** The self-certification is
      a GPSR undertaking, required by Article 22(10) which hangs off the unconditional Article
      22(3), and the Commission does not mark Article 22(10) among the three size-limited
      paragraphs. **This is NOT the same undertaking as Article 30(1)(e) of Regulation (EU)
      2022/2065.** That one is \"a self-certification by the trader committing to only offer
      products or services that comply with the applicable rules of Union law\"; this one is
      committing to offer only products that comply with **this Regulation**. A marketplace
      collecting the Digital Services Act self-certification alone has collected a differently
      worded undertaking, and a finding should say which one the documents describe. **A checkbox in
      an onboarding flow may be the mechanism and a repository cannot show that it is.** Whether a
      self-certification is collected, from whom, and whether it is retained are onboarding facts; a
      form field in a source tree corroborates and never decides. **Where the declared documents say
      nothing about this, the answer is `unresolved`, never `not-applicable` and never a bare
      `absent` presented as a shortfall.** This element carries no words of condition, so no stated
      fact can close it and `not-applicable` is never correct on this item while the gate's verdict
      is `applies`. The one route to that word here is the gate's own `does-not-apply` verdict,
      which is a finding that there is no marketplace rather than a fact about one, and what the
      item then carries is the gate's reasoning; `applicability.when_unresolved` sets that branch
      out for all forty-one items at once."
  - id: art-22-10-b-additional-identification-information
    article: Art. 22(10)(b)
    quote: their self-certification committing to offer only products that comply with this Regulation
      and additional identification information, in accordance with Article 30(1) of Regulation (EU)
      2022/2065, where applicable.
    cite: GPSR Art. 22(10)(b)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do your internal processes let traders provide the additional identification information
      that Article 30(1) of the Digital Services Act names - the trader's contact details, an
      identification document or other electronic identification, payment account details, a trade
      register entry where the trader has one, and the trader's own self-certification?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate does NOT reach this item, and it did until 2026-08-07.** The
      size branch rests on footnote 27 of Commission notice C/2025/6233, and that footnote names
      \"Article 22 para 7, 9 and 11 of GPSR\" and no other paragraph. Article 22(10)(b) is not one
      of the three. **The same Commission document places this element outside its size-limited
      group twice.** In the obligations list, the bullets carrying an asterisk are Article 22(7),
      Article 22(11) and Article 22(9), and the bullet holding \"their self-certification ... and
      additional identification information in line with the DSA requirements\" carries none. And in
      the Notice's own checklist, the line \"Set up internal processes for product safety. These
      should include mechanisms allowing traders to provide required product safety and traceability
      information, their self-certification and other DSA requirements\" sits **above** the heading
      \"Additional obligations for medium or large enterprises and micro/small enterprises where
      these micro and small enterprises have been designated as a 'very large online platform or
      search engine' withing the meaning of the DSA\" - the misspelling is the Official Journal's -
      under which only Article 22(7), Article 22(11) and Article 22(9) appear. An independent legal
      verification found this on 2026-08-07, and the correction is recorded rather than made
      silently. **Two readings of \"where applicable\" exist and this checklist settles neither.**
      The words are \"additional identification information, in accordance with Article 30(1) of
      Regulation (EU) 2022/2065, **where applicable**\". On the first reading they track the
      **platform**: Article 30 sits in Section 4 of that Regulation's Chapter III, which its Article
      29 does not apply to micro and small enterprises, so this element would fall with the Section
      - and in its strongest form the argument is that a cross-reference to a provision imposing
      nothing on this operator has nothing to point at. On the second they track the **trader**,
      which is what Article 30(1) says in its own chapeau - \"they have obtained the following
      information, where applicable to the trader\" - so the words would mark which of that
      provision's five data points a given trader can supply and would say nothing about the
      platform's size. **The second reading is at least as natural as the first, the Commission's
      own placement points to it, and no source settles the question.** **An open reading cannot
      carry `not-applicable`**, because that verdict is a positive statement that the requirement
      does not reach this business, and a reading nobody has settled cannot support one. That is the
      rule this checklist applies to Article 22(6) and to the third element of Article 22(9)(c), and
      it applies here for the same reason. So this item stays live for a marketplace of every size,
      and for a micro or small marketplace whose documents do not address it the answer is
      `unresolved`. **What Article 30(1) asks for, so that a finding can say which parts are
      covered**: the trader's name, address, telephone number and email address; a copy of an
      identification document or other electronic identification; the trader's payment account
      details; the trade register and registration number where the trader is registered in one; and
      the trader's own self-certification under that Regulation. **The sibling element in the same
      limb is a separate item, and splitting them decided nothing about size.** Article 22(10)(b)
      holds two elements - a self-certification carrying no words of condition, and this one
      carrying \"where applicable\" - and they are split so that a later reader can see that the
      words of condition were noticed rather than missed. That split is why this item exists; it is
      not a reason to put it in the size branch. **The question is asked unconditionally, and it
      opened with a condition until 2026-09-01.** It used to begin \"Where the trader traceability
      rules of the Digital Services Act apply to you\", which invited exactly the conditional answer
      this note goes on to refuse: a person answering \"those rules do not apply to me\" would be
      stating the first of the two open readings as though it were settled, and the item cannot
      express that answer. The question now asks what the internal processes let traders provide and
      names the five data points, so the answer is about the processes, and the reading that nobody
      has settled stays where it is recorded, in this note. **Where the declared documents say
      nothing about this, the answer is `unresolved`, never `not-applicable` and never a bare
      `absent` presented as a shortfall.** The reading that would make this element turn on the
      operator's size is open, so no stated fact closes it and `not-applicable` is never correct on
      this item while the gate's verdict is `applies`. The one route to that word here is the gate's
      own `does-not-apply` verdict, which is a finding that there is no marketplace rather than a
      fact about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."
  - id: art-22-11-suspending-repeat-offending-traders
    article: Art. 22(11)
    quote: For the purpose of compliance with Article 23 of Regulation (EU) 2022/2065 regarding product
      safety, providers of online marketplaces shall suspend, for a reasonable period of time and
      after having issued a prior warning, the provision of their services to traders that
      frequently offer products which are non-compliant with this Regulation.
    cite: GPSR Art. 22(11)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you suspend, for a reasonable period of time and after having issued a prior warning,
      the provision of your services to traders that frequently offer products which do not meet
      this Regulation, and does your published terms and conditions document state that policy?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This is the third of the three paragraphs the Commission reads as following the
      Digital Services Act's scope.** It opens \"For the purpose of compliance with Article 23 of
      Regulation (EU) 2022/2065\", and Article 23 sits in Section 3 of that Regulation's Chapter
      III, which Article 19 of that Regulation does not apply to micro and small enterprises. The
      gate quotes footnote 27 of the Commission's Guidelines whole, with its non-binding status and
      the counter-reading recorded beside it; no court has ruled on it, and the operative text of
      Article 22(11) carries no size words. **Tier 2 of the gate reaches this item.** Where the
      person running the scan states that the operator is a micro or small enterprise that is not a
      designated very large online platform, this item is `not-applicable`. That is the first of the
      two conditions the scope note enumerates, and it counts because a stated fact closed a
      conditional limb. **The twelve-month rule extends that exclusion and never withholds it.** On
      the second subparagraph of Article 19(1) of the Digital Services Act, and on the second
      subparagraph of its Article 29(1), a provider that lost micro or small status within the
      preceding 12 months is outside those Sections as well, unless it has been designated under
      Article 33. So a recent loss of the status reaches this same answer rather than denying it.
      **This checklist said the opposite until 2026-08-07**, requiring as a third limb that the
      status had not been lost in that period, and the correction is recorded on every item it
      touched. **This item is the best-placed in the whole checklist for declaration reconciliation,
      and the question says so.** Article 23(4) of Regulation (EU) 2022/2065 requires providers of
      online platforms to set out their misuse policy \"in a clear and detailed manner, in their
      terms and conditions\", with examples of the facts and circumstances taken into account and
      the duration of the suspension. Article 22(11) is the product-safety specification of the same
      duty, so a published terms document is exactly where an answer would live. **The words are
      nearly identical to Article 23(1) of that Regulation and the two must not be confused.** Both
      read \"shall suspend, for a reasonable period of time and after having issued a prior warning,
      the provision of their services to\"; that one continues \"recipients of the service that
      frequently provide manifestly illegal content\", and this one continues with traders that
      frequently offer products which do not meet this Regulation. The quotation above carries its
      tail for that reason, and the tail is where the two part company. **\"Frequently\" is not
      defined and a finding must not supply a number.** Article 23(3) of that Regulation lists the
      circumstances a provider must weigh - the absolute number of items in a time frame, the
      proportion they represent, the gravity of the misuse and, where identifiable, the intention -
      and none of them is a threshold. **An enforcement practice is not readable from code.**
      Whether traders have in fact been suspended is a business record; a policy in a published
      document is a statement of intent and should be recorded as one. **The question asks two
      things and `partial` is how the ordinary split between them is recorded.** It asks whether the
      suspension is practised **and** whether the published terms and conditions document states the
      policy, and those two facts come from different places: the first is the business record the
      paragraph above says is unreadable here, the second is exactly what this pillar reads. The
      commonest real answer is therefore a document that states the policy beside a practice nobody
      outside the business can see, and **that answer is `partial`, with the reasoning naming which
      half is evidenced and which half is not** - `present` would claim the practice as shown, and
      `absent` would deny the half that is written down. Where the document states the policy and
      the person running the scan also states that suspensions are carried out, `present` is
      available and the reasoning says the second half rests on a statement. **Where the declared
      documents say nothing about this, the answer is `unresolved`, never `not-applicable` and never
      a bare `absent` presented as a shortfall.**"
  - id: art-22-12-cooperation-with-authorities-and-operators
    article: Art. 22(12)
    quote: Providers of online marketplaces shall cooperate with the market surveillance authorities,
      with traders and with relevant economic operators to facilitate any action taken to eliminate
      or, if that is not possible, to mitigate the risks presented by a product that is or was
      offered online through their services.
    cite: GPSR Art. 22(12), chapeau
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you cooperate with market surveillance authorities, with traders and with relevant
      economic operators to help eliminate or mitigate the risks presented by a product offered
      through your services?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing.** Article 22(12) specifies no
      Digital Services Act obligation and the Commission does not mark it among the three
      size-limited paragraphs. **The chapeau is a free-standing duty and the nine limbs that follow
      do not exhaust it.** They are introduced by \"In particular\", which is illustrative and not
      limiting, so a marketplace that does each of the nine things has not thereby discharged the
      chapeau, and a finding on the chapeau is about the general duty to cooperate. **It reaches
      products that are no longer listed.** The words are \"a product that **is or was** offered
      online through their services\", so a delisting does not end the duty to cooperate about it.
      **Cooperation is a course of conduct and a document can describe it without proving it.** A
      published policy naming the team that answers authority requests is the kind of statement
      worth recording; recording that such a statement exists is not recording that the cooperation
      happens. **Where the declared documents say nothing about this, the answer is `unresolved`,
      never `not-applicable` and never a bare `absent` presented as a shortfall.** This paragraph
      carries no words of condition, so no stated fact can close it and `not-applicable` is never
      correct on this item while the gate's verdict is `applies`. The one route to that word here is
      the gate's own `does-not-apply` verdict, which is a finding that there is no marketplace
      rather than a fact about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."
  - id: art-22-12-a-appropriate-and-timely-information
    article: Art. 22(12)(a)
    quote: "ensure that they provide appropriate and timely information to consumers including by:"
    cite: GPSR Art. 22(12)(a), chapeau
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-09-02
    question: Beyond directly notifying affected consumers and publishing recall information, do you
      ensure that you provide consumers with appropriate and timely information about product
      safety?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every Article 22(12) limb.

  supporting_quotes:
    - quote: "'online interface' means any software, including a website, part of a website or an
        application, including mobile applications;"
      cite: GPSR Art. 3(15)
      url: http://publications.europa.eu/resource/celex/32023R0988
      checked_at: 2026-08-07
      why: '**The breadth of "online interface", which is what several Article 22 duties attach to.** It
        reaches a website, part of a website and a mobile application alike, so a marketplace that
        runs only in an app is inside every duty that names the interface. Note what it does not do:
        it defines the medium and says nothing about who the counterparties are, which is the part
        of the Article 3(14) definition that actually decides tier 1.'
    - quote: "'trader' means any natural person or any legal person irrespective of whether privately or
        publicly owned, who is acting, including through any person acting in that natural or legal
        person's name or on that natural or legal person's behalf, for purposes relating to the
        natural or legal person's trade, business, craft or profession;"
      cite: GPSR Art. 3(18)
      url: http://publications.europa.eu/resource/celex/32023R0988
      checked_at: 2026-08-07
      why: "**The counterparty test, and the limb that puts a consumer-to-consumer site outside Article
        22.** The definition in Article 3(14) requires distance contracts with **traders**, so an
        interface whose sellers are all private individuals is not a provider of an online
        marketplace within this Regulation however marketplace-like it looks. This is a fact about
        who the sellers are, asked of the person running the scan; a source tree that says `seller`
        or `vendor` says nothing about it."
    - quote: "'product' means any item, whether or not it is interconnected to other items, supplied or
        made available, whether for consideration or not, including in the context of providing a
        service, which is intended for consumers or is likely, under reasonably foreseeable
        conditions, to be used by consumers even if not intended for them;"
      cite: GPSR Art. 3(1)
      url: http://publications.europa.eu/resource/celex/32023R0988
      checked_at: 2026-08-07
      why: "**The definition the second half of tier 1 turns on, and the place the software question
        lives.** \"Any item\" carries **no tangibility qualifier** - not \"physical\", not
        \"goods\", not \"movable\" - and Article 2(2)'s nine exclusions name no intangible category,
        so the text does not put software outside; nowhere does the Regulation treat software as
        itself the product either. **The claim that the GPSR reaches standalone software rests on a
        Commission position, not on the Regulation**, and that position is non-binding by its own
        document's disclaimer and untested by any court. The consequence here is narrow and
        specific: **if standalone software is a GPSR product, an application store distributing
        third-party apps to consumers is a GPSR online marketplace.** That conditional is as far as
        the sources go and this checklist resolves neither half of it."
    - quote: Products offered for sale online or through other means of distance sales shall be deemed to
        be made available on the market if the offer is targeted at consumers in the Union. An offer
        for sale shall be considered to be targeted at consumers in the Union if the relevant
        economic operator directs, by any means, its activities to one or more Member States.
      cite: GPSR Art. 4
      url: http://publications.europa.eu/resource/celex/32023R0988
      checked_at: 2026-08-07
      why: "**What brings an online offer inside the Regulation at all, and the reason this gate is asked
        rather than inferred.** Recital 21 makes \"targeted\" a case-by-case test on facts about how
        the offer is published and priced - dispatch geography, the languages available, the means
        of payment, the currency, a domain name registered in a Member State - and closes by saying
        that in the case of online sales \"the mere fact that the economic operators' or the
        providers of online marketplaces' interface is accessible in the Member State in which the
        consumer is established or domiciled is insufficient\". Accessibility from the Union is not
        targeting."
    - quote: "With regard to products subject to specific requirements imposed by Union harmonisation
        legislation as defined in Article 3, point (27): (a) Chapter II does not apply insofar as
        the risks or categories of risks covered by Union harmonisation legislation are concerned;
        (b) Chapter IIa, Chapter III, Section 1, Chapters V and VII and Chapters IX to XI do not
        apply."
      cite: GPSR Art. 2(1), third subparagraph
      url: https://publications.europa.eu/resource/celex/02023R0988-20260529
      checked_at: 2026-09-07
      why: "**The carve-out that does NOT reach this checklist, quoted so that nobody applies the
        sibling's tier 2 here.** Article 22 is the whole of **Chapter IV**, and Chapter IV is not in
        the list: the subparagraph names Chapter III Section 1, Chapters V and VII and Chapters IX
        to XI. A marketplace whose products are all covered by sector-specific Union harmonisation
        legislation therefore owes every duty in this checklist. The Commission says the same thing
        in its Guidelines: \"In addition, the GPSR obligations for the providers of online
        marketplaces also apply to products subject to specific safety requirements under other EU
        legislation.\" **The harmonisation question is tier 2 of the sibling checklist's gate and is
        no part of this one's.**"
    - quote: (27) Article 22 para 7, 9 and 11 of GPSR include specifications of certain DSA obligations,
        namely Articles 23 and 31 thereof, and therefore follow the scope of application of the
        latter. Pursuant to Article 19 (re Article 23 and more generally the obligations in section
        3 of Chapter III DSA) and 29 DSA (re Article 31 and more generally the obligations in
        section 4 of Chapter III DSA), these obligations are in principle not applicable to
        providers of platforms that qualify as Micro and Small Enterprises (SMicE). However, both
        Articles 19(2) and 29(2) of the DSA include a derogation to this principle, such that a
        SMicE platform which is at the same time designated as VLOP/VLOSE is indeed subject to these
        obligations. The statement in the table therefore means that the specifications of the DSA
        obligations included in the GPSR applies to any platform provided by medium and large
        enterprises (as normally provided under Articles 19 and 29 of the DSA), as well as to any
        platform provided by a SMicE that is at the same time designated as VLOP/VLOSE, because in
        that case the exclusion from application of sections 3 and 4 of DSA does not apply.
      cite: Commission notice C/2025/6233, footnote 27
      url: http://publications.europa.eu/resource/celex/52025XC06233
      checked_at: 2026-08-07
      why: "**The whole of tier 2, and the only reasoned statement of it from any authority.** It is
        quoted in full rather than summarised because everything the size branch does rests on it
        and because its three moving parts are all in this one footnote: which paragraphs follow the
        Digital Services Act's scope, which Sections of that Regulation the exclusions reach, and
        the derogation that puts a designated very large online platform back inside them whatever
        its size. **It names three paragraphs and no more - 7, 9 and 11 - and that is the whole of
        the branch's membership.** Article 22(10)(b)'s additional-identification element points at
        Article 30(1) of that Regulation and is nevertheless outside the branch, because this
        footnote does not name it and because the Commission's own obligations list and its own
        checklist both put that element outside the size-limited group; the item records both
        readings and takes neither. **It is tier (c) material - a stated Commission position,
        non-binding by the Guidelines' own terms, untested by any court - and the operative text of
        Article 22 carries no size words at all.** The Commission makes the same point twice more in
        the same document, once in the marketplace checklist under a separate \"Additional
        obligations for medium or large enterprises\" heading, and once in the general statement
        that \"The obligations of the GPSR are relevant for all sizes of business\", whose only
        footnoted exception is this one."
    - quote: 1. This Section, with the exception of Article 24(3) thereof, shall not apply to providers of
        online platforms that qualify as micro or small enterprises as defined in Recommendation
        2003/361/EC.
      cite: Reg. (EU) 2022/2065 (DSA) Art. 19(1), first subparagraph
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: "**One of the two exclusions the size branch imports.** It opens Section 3 of the Digital
        Services Act's Chapter III, which contains Article 23 - the provision GPSR Article 22(11)
        specifies. This is the **first** subparagraph and it carries the whole of the present-tense
        limb: a provider that qualifies as a micro or small enterprise is outside Section 3. The
        twelve-month rule is in the **second** subparagraph, quoted next, and it widens this
        exclusion rather than qualifying it."
    - quote: This Section, with the exception of Article 24(3) thereof, shall not apply to providers of
        online platforms that previously qualified for the status of a micro or small enterprise as
        defined in Recommendation 2003/361/EC during the 12 months following their loss of that
        status pursuant to Article 4(2) thereof, except when they are very large online platforms in
        accordance with Article 33.
      cite: Reg. (EU) 2022/2065 (DSA) Art. 19(1), second subparagraph
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: "**The twelve-month rule in its own words, quoted because this file stated it backwards until
        2026-08-07.** It is a grace period: the Section **also** does not apply, for 12 months, to a
        provider that has just stopped being a micro or small enterprise, unless that provider is a
        very large online platform. So having lost the status recently is a **second way of being
        outside** Section 3 and never a reason to be inside it. The gate used to ask, as a third
        limb, that the status had not been lost in the preceding 12 months, which inverted this
        sentence; the limb is now a disjunct of the size limb and this quotation is what holds it to
        the Official Journal."
    - quote: 1. This Section shall not apply to providers of online platforms allowing consumers to
        conclude distance contracts with traders that qualify as micro or small enterprises as
        defined in Recommendation 2003/361/EC.
      cite: Reg. (EU) 2022/2065 (DSA) Art. 29(1), first subparagraph
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: "**The other exclusion the size branch imports.** It opens Section 4, which contains Articles
        30, 31 and 32 - and Article 31 is the provision GPSR Article 22(7) and Article 22(9)
        specify, while Article 30(1) is what the Article 22(10)(b) additional-identification element
        points at. **That element is nevertheless NOT in the size branch**, because footnote 27
        names Article 22 paragraphs 7, 9 and 11 and no other, and the Commission's own document
        twice places the additional-identification element outside its size-limited group; the item
        records both readings and takes neither. **Note also which Section is NOT excluded for
        anybody: Section 2**, where Article 16 of that Regulation sits, which is why GPSR Article
        22(8)'s three-working-day duty binds a marketplace of any size. This is the **first**
        subparagraph; the twelve-month rule is in the second, quoted next."
    - quote: This Section shall not apply to providers of online platforms allowing consumers to conclude
        distance contracts with traders that previously qualified for the status of a micro or small
        enterprise as defined in Recommendation 2003/361/EC during the 12 months following their
        loss of that status pursuant to Article 4(2) thereof, except when they are very large online
        platforms in accordance with Article 33.
      cite: Reg. (EU) 2022/2065 (DSA) Art. 29(1), second subparagraph
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: "**The same grace period for Section 4, quoted rather than described as \"the same
        sentence\".** It is the Section that holds Articles 30, 31 and 32, so it is the one that
        matters for GPSR Article 22(7) and Article 22(9). Reading it beside Article 19(1)'s second
        subparagraph shows that the twelve-month rule is drafted identically in both places and that
        it extends both exclusions, so the size limb of tier 2 is a disjunction and not a
        conjunction."
    - quote: 2. By derogation from paragraph 1 of this Article, this Section shall apply to providers of
        online platforms that have been designated as very large online platforms in accordance with
        Article 33, irrespective of whether they qualify as micro or small enterprises.
      cite: Reg. (EU) 2022/2065 (DSA) Art. 19(2)
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: '**The derogation, and the reason the second limb of tier 2 has to be asked separately.** A
        designated very large online platform is inside Section 3 whatever its headcount and
        turnover, so an answer of "we are a micro enterprise" on its own settles nothing. Article
        29(2) says the same thing for Section 4. A designation is a Commission decision addressed to
        the company; no repository contains it and no document a scanner reads can supply it.'
    - quote: 1. This Section shall apply to online platforms and online search engines which have a number
        of average monthly active recipients of the service in the Union equal to or higher than 45
        million, and which are designated as very large online platforms or very large online search
        engines pursuant to paragraph 4.
      cite: Reg. (EU) 2022/2065 (DSA) Art. 33(1)
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: '**What "very large online platform" means, so that the second limb of tier 2 is answerable.**
        Two things are required and the first alone is not enough: an average of at least 45 million
        monthly active recipients in the Union, **and** a designation by the Commission under
        paragraph 4. A platform above the threshold that has not been designated is not a very large
        online platform for the purposes of Articles 19(2) and 29(2).'
    - quote: "'online platform' means a hosting service that, at the request of a recipient of the
        service, stores and disseminates information to the public, unless that activity is a minor
        and purely ancillary feature of another service or a minor functionality of the principal
        service and, for objective and technical reasons, cannot be used without that other service,
        and the integration of the feature or functionality into the other service is not a means to
        circumvent the applicability of this Regulation;"
      cite: Reg. (EU) 2022/2065 (DSA) Art. 3, point (i)
      url: http://publications.europa.eu/resource/celex/32022R2065
      checked_at: 2026-08-07
      why: "**Quoted because it shows the GPSR class is broader than the Digital Services Act class in a
        second way that has nothing to do with size**, and because a gate that omitted it would
        overstate how settled tier 2 is. An 'online platform' additionally requires **dissemination
        to the public**; 'provider of an online marketplace' in GPSR Article 3(14) does not. So a
        closed or invitation-only intermediary could be a GPSR marketplace and no Digital Services
        Act online platform, and would then sit outside Articles 23, 30 and 31 regardless of its
        size. **No source addresses this and it is recorded as open, not used as a route to any
        verdict.**"
    - quote: Providers of online marketplaces should act with due care in relation to the content hosted
        on their online interfaces that concerns product safety, in accordance with the specific
        obligations laid down in this Regulation. Accordingly, this Regulation should lay down due
        diligence obligations for all providers of online marketplaces in relation to the content
        hosted on their online interfaces that concerns product safety.
      cite: GPSR Recital 49
      url: http://publications.europa.eu/resource/celex/32023R0988
      checked_at: 2026-08-07
      why: "**The strongest thing pulling against tier 2, quoted so that the gate is not one-sided.** It
        is a recital, so it is interpretive and never the sole support for any conclusion, and it
        says the Regulation lays down duties for **all** providers of online marketplaces. Read with
        the operative text of Article 22(7), (9) and (11), which each address the GPSR's own
        unqualified class, it is a real argument that the size carve-out does not reach the GPSR
        duty at all. This checklist follows the Commission and records the disagreement rather than
        resolving it."
    - quote: This Regulation shall enter into force on the twentieth day following that of its publication
        in the Official Journal of the European Union. It shall apply from 13 December 2024.
      cite: GPSR Art. 52
      url: http://publications.europa.eu/resource/celex/32023R0988
      checked_at: 2026-08-07
      why: "**The application date, quoted rather than asserted, because it decides how every finding on
        this checklist must be worded.** Article 52 grants no deferral to any article and carries no
        exception clause of any kind: there is no phased application and no paragraph of Article 22
        with a date of its own. **Any finding worded as preparation would be wrong**, and the Cyber
        Resilience Act checklists' preparation phrasing, which is correct for a duty deferred to
        2027, must not be copied onto this row."
  when_unresolved: "**Never resolve this gate by guessing in either direction.** Assuming Article 22
    applies invents present obligations for a business that is not an intermediary at all; assuming
    it does not silently skips forty-one checks for one that is, and a skipped check is
    indistinguishable from a passed one. Record `unresolved` and name which limb was missing. **Tier
    1, and every limb of it is asked of the person running the scan.** (i) **Is there an online
    interface that allows consumers to conclude distance contracts with traders?** Ask whether the
    contract is concluded on the interface or elsewhere, and whether the sellers act for purposes
    relating to a trade, business, craft or profession. (ii) **Are the counterparties traders rather
    than private individuals?** (iii) **Is what is sold a 'product' within Article 3(1)?** For
    physical goods this is not in question; for an interface distributing software it is the open
    question recorded in the scope note, and it is left open in both directions. (iv) **Does the
    business also act as an economic operator for some of what it sells?** **This limb is recorded
    and it is never decisive**: whichever way it is answered the business stays inside this
    checklist for the third-party listings, so it is asked in order to put the dual role on the
    record and to send the operator to the sibling checklist for its other role, and never as a
    fourth exit. The exits are limbs (i), (ii) and (iii), and the four \"answer no if\" cases in the
    question field close limb (i) twice, limb (ii) once and limb (iii) once. If the business does
    hold both roles, it holds them product by product and the sibling checklist covers the other
    one; that does not take it out of this checklist for the third-party listings. **None of these
    is settled by anything in a repository**, and none may be inferred from what the source tree
    imports, links or implements. A declared document **settles a tier-1 limb where it genuinely
    states the fact that limb turns on**, and the verdict then names the document as the ground
    rather than implying that the code showed it; a regulated consumer-information or
    distance-selling disclosure naming what is transacted, or published terms saying in so many
    words who lists and who buys, are the shapes that do this. Where a document already states the
    fact, asking the person the same question again wastes an answer. Where the source tree carries
    facts that contradict what the document states, print the disagreement first, name the facts and
    leave the limb open: a declaration cannot close a limb the tree disputes, and the tree cannot
    close one the person has answered. **A document that does not address a limb has stated nothing
    about it, and the limb stays open** - an absence is not an answer in either direction, and it is
    not a \"no\". **The same document can fall on either side of that line, and which side it falls
    on is decided by what it says and never by what kind of document it is.** **And inference from a
    document is not a statement in it**, which is where the corroborate-only rule still binds and is
    the reason it was written: a document read for what it implies rather than for what it says may
    corroborate an answer - published seller terms, an onboarding page for traders, a fee schedule
    for listings - and it may never decide one. **Tier 2, and it switches off thirteen items rather
    than the checklist.** Is the operator a micro or small enterprise within Commission
    Recommendation 2003/361/EC, or did it lose that status within the preceding 12 months; and has
    it been designated a very large online platform or very large online search engine under Article
    33 of the Digital Services Act? **The twelve-month question widens the first limb and never
    narrows it**: the second subparagraph of Article 19(1), and the second subparagraph of Article
    29(1), keep a provider outside those Sections for the 12 months following its loss of micro or
    small status, unless it is a very large online platform. **Answered so that the size limb is met
    by either route and the designation question is answered `no`: the thirteen items drawn from
    Article 22(7), Article 22(9) and Article 22(11) become `not-applicable`** - because on the
    Commission's reading those three paragraphs follow the scope of Articles 23 and 31 of that
    Regulation - **and the other twenty-eight items stay live**, because Article 22(1) to (6), (8),
    (10) and (12) specify nothing and are addressed to the GPSR's own class without qualification.
    **Answered so that the operator is neither currently nor recently a micro or small enterprise,
    or so that it has been designated under Article 33: all forty-one items are live.** **Answered
    not at all: record `unresolved` for the thirteen and walk the other twenty-eight anyway**,
    because tier 2 cannot affect them either way and there is no reason to withhold twenty-eight
    answers for want of one fact. **The one thing tier 2 must never do is close the gate.** A single
    \"Article 22 applies / does not apply\" verdict would be wrong for one group of paragraphs
    whichever way it were set. **Do not answer tier 2 from the repository.** Headcount, turnover,
    balance-sheet total, linked and partner enterprises, a Commission designation and the date a
    status was lost are none of them facts a source tree contains, and a small `package.json` is not
    a small enterprise. **What becomes of the forty-one items, verdict by verdict, and this
    paragraph is the one an agent is sent back here to read.** Tier 1 has three outcomes and each of
    them has an item disposition; a gate verdict that says nothing about the items leaves the walker
    to invent one, and until 2026-09-01 this field said what tier 1 does to the gate and never what
    it does to the items. **Tier 1 answered `yes` - the gate's verdict is `applies`: all forty-one
    items are live and are walked against the declared documents**, and tier 2 then decides which
    thirteen of them the size answer reaches, on the three states set out above. **Tier 1 answered
    `no` - the gate's verdict is `does-not-apply`: every one of the forty-one items is still
    emitted, each of them `not-applicable`, and each carrying the gate's own reasoning.** A list
    nobody walked and a law that does not reach this business must not print alike, so an empty
    list, a silent skip and forty-one bare verdicts with no reasoning are all wrong outputs here.
    The reasoning on each item is the gate's: which tier-1 limb was answered `no`, who answered it
    and on what. **This is the gate speaking and not the item, and the difference is the whole of
    it.** Twenty-seven of the forty-one refuse `not-applicable` in their own notes, and what they
    refuse is a fact about a marketplace being used to close a limb that carries no condition for a
    fact to close. A tier-1 `no` is not a fact about a marketplace; it is the finding that there is
    no marketplace, so it reaches every item at once, from the gate, and asserts nothing whatever
    about any duty in Article 22. The two senses never meet: while the gate's verdict is `applies`,
    the only items a stated fact can close are the fourteen the scope note enumerates, and no fact
    closes any of the other twenty-seven. **Tier 1 answered not at all - the gate's verdict is
    `unresolved`: record `unresolved` on all forty-one items, and name in the gate's reasoning which
    limb was missing and which question would settle it.** Do not walk the items against the
    documents as though tier 1 had been answered `yes`, and do not close them as though it had been
    answered `no`; an answer to an item under an unanswered gate is an answer to a question nobody
    has established is being asked. **The sub-case of an interface distributing third-party
    software, recorded in the question field, is an instance of this branch and not a rule of its
    own** - the reason the answer cannot be reached there is that the meaning of 'product' is
    unsettled, and the disposition is the one stated here. **Tier 2 never produces any of these
    three outcomes**, because tier 2 cannot close the gate; its own three states are set out above
    and they redistribute the forty-one items rather than switching them off."
items:
  - id: art-22-1-authority-single-point-of-contact
    article: Art. 22(1)
    quote: Without prejudice to the general obligations provided for in Article 11 of Regulation (EU)
      2022/2065, providers of online marketplaces shall designate a single point of contact allowing
      for direct communication, by electronic means, with Member States' market surveillance
      authorities in relation to product safety issues, in particular for the purpose of notifying
      orders issued pursuant to paragraph 4 of this Article.
    cite: GPSR Art. 22(1), first subparagraph
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Have you designated a single point of contact that lets Member States' market surveillance
      authorities reach you directly by electronic means about product safety issues?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing.** Article 22(1) specifies no
      Digital Services Act obligation, so the size reading the Commission takes of Article 22(7),
      (9) and (11) cannot reach it, and a one-person marketplace owes this designation exactly as a
      large one does. **This is the authority-facing contact point and it is not the consumer-facing
      one.** Article 22(2) requires a second designation, for consumers, and the two are separate
      items on this checklist. They may be the same person or team - recital 50 says the Article
      22(1) point may be the same as the Digital Services Act Article 11 point, and recital 51 says
      the same of the consumer one - but they are two designations, and only this one carries a
      publication duty. **\"Without prejudice to the general obligations provided for in Article 11
      of Regulation (EU) 2022/2065\" is a saving clause and not a condition.** It preserves the
      Digital Services Act duty alongside this one; it does not make this one contingent on
      anything. Neither is \"in particular for the purpose of notifying orders issued pursuant to
      paragraph 4\", which is illustrative of what the contact point is used for and says nothing
      about whether it must exist. **A designation is an organisational act and an address in a
      repository is not one.** A `SECURITY.md` security contact, a mailbox in a configuration file
      or a support address in a README shows that somebody can be written to; whether a single point
      of contact has been designated for market surveillance authorities is a fact about how the
      business is arranged. Where a declared document names one, record what the document says and
      say it is a statement. **Where the declared documents say nothing about this, the answer is
      `unresolved`, never `not-applicable` and never a bare `absent` presented as a shortfall.**
      This paragraph carries no words of condition, so no stated fact can close it and
      `not-applicable` is never correct on this item while the gate's verdict is `applies`. The one
      route to that word here is the gate's own `does-not-apply` verdict, which is a finding that
      there is no marketplace rather than a fact about one, and what the item then carries is the
      gate's reasoning; `applicability.when_unresolved` sets that branch out for all forty-one items
      at once."
  - id: art-22-1-safety-gate-portal-registration
    article: Art. 22(1)
    quote: Providers of online marketplaces shall register with the Safety Gate Portal and shall
      indicate on the Safety Gate Portal the information concerning their single contact point.
    cite: GPSR Art. 22(1), second subparagraph
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Have you registered your business with the Safety Gate Portal?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every item outside Article
      22(7), (9) and (11): the second subparagraph of Article 22(1) specifies no Digital Services
      Act obligation and is addressed to the whole of the Regulation's own class. **Two verbs, two
      items.** The subparagraph requires the marketplace to **register** with the Safety Gate Portal
      and to **indicate** its contact point's information there. This item is the registration; the
      next one is the indication. They are separated because a marketplace can have done the first
      and not the second, and a finding that merges them cannot say which. **The Safety Gate Portal
      is not the Safety Business Gateway, and the two are routinely confused.** The Portal is the
      public face of the Safety Gate Rapid Alert System: the marketplace registers there, publishes
      its authority contact point there, reads dangerous-product notifications there and looks up
      the contact details of the authority it must reply to. The Safety Business Gateway is a
      separate Commission web portal through which businesses **file** information **to**
      authorities, and it is what Article 22(12)(d) and Article 22(12)(e)(ii) use. **A record in a
      Commission system is not a fact any repository holds.** No file in a source tree can show
      whether a registration exists, and no absence of one shows that it does not. A declared
      document stating that the business is registered is a statement to be recorded as a statement.
      **Where the declared documents say nothing about this, the answer is `unresolved`, never
      `not-applicable` and never a bare `absent` presented as a shortfall.** This paragraph carries
      no words of condition, so no stated fact can close it and `not-applicable` is never correct on
      this item while the gate's verdict is `applies`. The one route to that word here is the gate's
      own `does-not-apply` verdict, which is a finding that there is no marketplace rather than a
      fact about one, and what the item then carries is the gate's reasoning;
      `applicability.when_unresolved` sets that branch out for all forty-one items at once."
  - id: art-22-1-contact-point-indicated-on-the-portal
    article: Art. 22(1)
    quote: Providers of online marketplaces shall register with the Safety Gate Portal and shall
      indicate on the Safety Gate Portal the information concerning their single contact point.
    cite: GPSR Art. 22(1), second subparagraph
    url: http://publications.europa.eu/resource/celex/32023R0988

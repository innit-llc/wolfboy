  - id: art-22-12-b-informing-the-economic-operator-of-removal
    article: Art. 22(12)(b)
    quote: inform the relevant economic operator of the decision to remove or disable access to the
      content referring to an offer of a dangerous product;
    cite: GPSR Art. 22(12)(b)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: When you decide to remove or disable access to content referring to an offer of a
      dangerous product, do you inform the relevant economic operator of that decision?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing**, like every Article 22(12) limb.
      **The removal decision is the trigger and a trigger is not a condition.** A marketplace that
      has never removed a listing has never reached the moment this limb describes and still owes
      the duty; nothing about its history makes the limb inapplicable. **The person to be informed
      is the economic operator, which need not be the trader who listed.** 'Economic operator' is
      defined in Article 3(13) and covers the manufacturer, the authorised representative, the
      importer, the distributor, the fulfilment service provider and any other person subject to
      obligations under this Regulation. A notice sent only to the seller account may or may not
      reach the relevant economic operator, and a finding should say which the documents describe.
      **This is not the same as the reply to an authority under Article 22(4).** That one goes to
      the issuing market surveillance authority through the Safety Gate Portal's published contact
      details; this one goes to the economic operator, and a marketplace can do one and not the
      other. **Where the declared documents say nothing about this, the answer is `unresolved`,
      never `not-applicable` and never a bare `absent` presented as a shortfall.** This limb carries
      no words of condition, so no stated fact can close it and `not-applicable` is never correct on

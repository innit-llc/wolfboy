  - id: art-22-7-safety-gate-portal-for-random-checks
    article: Art. 22(7)
    quote: For the purpose of compliance with Article 31(3) of Regulation (EU) 2022/2065, as regards
      product safety, providers of online marketplaces shall use at least the Safety Gate Portal.
    cite: GPSR Art. 22(7)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: When you carry out the random checks on products already offered on your platform that
      Article 31(3) of the Digital Services Act requires, do you use at least the Safety Gate Portal
      as a source?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This is one of the three paragraphs the Commission reads as following the
      Digital Services Act's scope.** It opens \"For the purpose of compliance with Article 31(3) of
      Regulation (EU) 2022/2065\", and Article 31 sits in Section 4 of that Regulation's Chapter
      III, which Article 29 of that Regulation does not apply to micro and small enterprises. The
      reasoning is the Commission's footnote 27, quoted whole in the gate; it is non-binding by the
      Guidelines' own terms, no court has ruled on it, the operative text of Article 22(7) carries
      no size words at all, and recital 49 pulls the other way. The scope note records the
      disagreement. **Tier 2 of the gate reaches this item.** Where the person running the scan
      states that the operator is a micro or small enterprise that is not a designated very large
      online platform, this item is `not-applicable`. That is the first of the two conditions the
      scope note enumerates, and it counts because a stated fact closed a conditional limb. **The
      twelve-month rule extends that exclusion and never withholds it.** On the second subparagraph
      of Article 19(1) of the Digital Services Act, and on the second subparagraph of its Article
      29(1), a provider that lost micro or small status within the preceding 12 months is outside
      those Sections as well, unless it has been designated under Article 33. So a recent loss of
      the status reaches this same answer rather than denying it. **This checklist said the opposite
      until 2026-08-07**, requiring as a third limb that the status had not been lost in that
      period, and the correction is recorded on every item it touched. **What Article 31(3) actually
      requires is the ex-post half of that provision**: after allowing a trader to offer products,
      the platform must make reasonable efforts to check randomly, in any official, freely
      accessible and machine-readable online database or online interface, whether the products
      offered have been identified as illegal. Article 22(7) does not create the checking duty; it
      says that whatever else is consulted, the Safety Gate Portal must be among the sources. **\"At
      least\" is a floor and not a list.** A marketplace consulting other databases as well has not
      done something wrong, and a finding here never says that it has. **Where the declared
      documents say nothing about this, the answer is `unresolved`, never `not-applicable` and never
      a bare `absent` presented as a shortfall.**"
  - id: art-22-8-three-working-days-for-notices
    article: Art. 22(8)
    quote: Providers of online marketplaces shall, without undue delay and in any event within three
      working days from the receipt of the notice, process the notices related to product safety
      issues with regard to the product offered for sale online through their services, received in
      accordance with Article 16 of Regulation (EU) 2022/2065.
    cite: GPSR Art. 22(8)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Do you process notices about product safety issues concerning products offered through
      your services without undue delay, and in any event within three working days from the receipt
      of the notice?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **Tier 2 of the gate leaves this item standing, and this is the item where that
      is least obvious.** Article 22(8) points at Article 16 of Regulation (EU) 2022/2065, which
      sits in **Section 2** of that Regulation's Chapter III, headed \"Additional provisions
      applicable to providers of hosting services\". The micro and small exclusions in Articles 19
      and 29 of that Regulation reach **Sections 3 and 4** only. Section 2 is excluded for nobody,
      the Commission does not mark this paragraph among the three size-limited ones, and a
      marketplace of any size owes this three-working-day duty. **Three working days here, two
      working days in Article 22(4), and they are not the same clock.** This one runs from receipt
      of a **third-party notice**; the Article 22(4) deadline runs from receipt of an **authority's
      order**. A finding must name which. **What a compliant notice mechanism must accept comes from
      Article 16 of that Regulation**: it must be easy to access and user-friendly, accept notices
      by electronic means alone, and be built so as to facilitate notices carrying a substantiated
      explanation, the exact electronic location such as a URL, the notifier's name and email
      address, and a statement of bona fide belief. The mechanism's existence is that Regulation's
      duty; the three-working-day processing time is this one's. **Where the declared documents say
      nothing about this, the answer is `unresolved`, never `not-applicable` and never a bare
      `absent` presented as a shortfall.** This paragraph carries no words of condition, so no
      stated fact can close it and `not-applicable` is never correct on this item while the gate's
      verdict is `applies`. The one route to that word here is the gate's own `does-not-apply`
      verdict, which is a finding that there is no marketplace rather than a fact about one, and
      what the item then carries is the gate's reasoning; `applicability.when_unresolved` sets that
      branch out for all forty-one items at once."
  - id: art-22-9-a-manufacturer-name-field
    article: Art. 22(9)(a)
    quote: name, registered trade name or registered trade mark of the manufacturer, as well as the
      postal and electronic address at which the manufacturer can be contacted;
    cite: GPSR Art. 22(9)(a)
    url: http://publications.europa.eu/resource/celex/32023R0988
    checked_at: 2026-08-07
    question: Does your listing interface let a trader enter the manufacturer's name, registered trade
      name or registered trade mark, and does what the trader enters reach the consumer on the
      product listing?
    applicability_note: "**Applies now**, since 13 December 2024 (Article 52). Nothing here is
      preparation. **This is one of the three paragraphs the Commission reads as following the
      Digital Services Act's scope**, because Article 22(9) opens \"For the purpose of compliance
      with the requirements of Article 31(1) and (2) of Regulation (EU) 2022/2065\" and Article 31
      sits in a Section that Article 29 of that Regulation does not apply to micro and small
      enterprises. The gate quotes footnote 27 of the Commission's Guidelines whole; it is
      non-binding, no court has ruled on it, and the operative text of Article 22(9) carries no size
      words. **Tier 2 of the gate reaches this item.** Where the person running the scan states that
      the operator is a micro or small enterprise that is not a designated very large online
      platform, this item is `not-applicable`. That is the first of the two conditions the scope
      note enumerates, and it counts because a stated fact closed a conditional limb. **The
      twelve-month rule extends that exclusion and never withholds it.** On the second subparagraph
      of Article 19(1) of the Digital Services Act, and on the second subparagraph of its Article
      29(1), a provider that lost micro or small status within the preceding 12 months is outside
      those Sections as well, unless it has been designated under Article 33. So a recent loss of
      the status reaches this same answer rather than denying it. **This checklist said the opposite
      until 2026-08-07**, requiring as a third limb that the status had not been lost in that
      period, and the correction is recorded on every item it touched. **The chapeau carries two
      duties and this item is about both of them at once for one data point.** The interface must
      **enable** a trader to provide the manufacturer's name, and it must **ensure** that what the
      trader provided is displayed or otherwise made easily accessible to consumers on the product
      listing. A listing form with no manufacturer-name field falls short even if every trader would
      have filled it in; a field that collects the name into a database the consumer never sees
      falls short in the other direction. The chapeau's display duty also has an item of its own,
      which asks the question for the four data points together. **Article 22(9)(a) differs from
      Article 19(a) in one word replaced by two, and the difference is deliberate here.** Article
      19(a) ends \"at which they can be contacted\" and Article 22(9)(a) ends \"at which the
      manufacturer can be contacted\": one pronoun, two nouns, and everything before them is
      character-identical. The duty is also on a different person: Article 19 asks what **the
      operator's own offer** displays, and this paragraph asks what field **the marketplace's
      interface offers for any trader's product**. A closing fact that works for Article 19 does not
      transfer, and the two must never be merged. **The marketplace does not warrant that what the
      trader typed is true.** Recital 58 says providers of online marketplaces \"should not be
      responsible for verifying the completeness, correctness and the accuracy of the information
      itself, as the obligation to ensure the traceability of products lies with the relevant
      trader\". A finding here is about the field and the display, never about whether a particular
      name is correct. **Whether a listing displays anything is a fact about the rendered listing,
      not about the source tree.** A template in a repository is evidence at best, because a
      template can be overridden, and a listing schema is not what a consumer sees. **Where the
      declared documents say nothing about this, the answer is `unresolved`, never `not-applicable`
      and never a bare `absent` presented as a shortfall.**"

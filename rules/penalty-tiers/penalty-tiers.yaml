  - id: national-age-gdpr-8
    match: ^(?:NOT VERIFIED AGAINST [A-Z ]+\. )?NATIONAL AGE - [A-Z]{2} \d+\.
    regime: gdpr
    provision: 8(1)
    why: A national provision fixing the age below which GDPR Art 8(1) needs a parent's consent. The
      duty is Art 8's, which Art 83(4)(a) places in the lower tier.
  - id: eprivacy-2009-136-2-5
    match: ^Directive 2009/136/EC, Art\. 2\(5\)
    regime: eprivacy
    provision: 5(3)
    why: Directive 2009/136/EC Art 2(5) replaces ePrivacy Art 5(3); the cited duty is Art 5(3) as
      replaced.
  - id: ai-act-1744-recitals
    match: "^Regulation \\(EU\\) 2026/1744 \\(CELEX 32026R1744\\), recitals "
    regime: ai-act
    tier: no_duty
    why: Recitals of the amending act lay down no duty.
  - id: cra-annex-i-part-ii-8-free-of-charge
    match: "^Cyber Resilience Act \\(Regulation \\(EU\\) 2024/2847\\), the free-of-charge limb of Annex
      I Part II point \\(8\\) and its tailor-made carve-out, with Recital 64 "
    regime: cra
    provision: Annex I
    cite: CRA Annex I, Part II, point (8)
    quote: they are disseminated without delay and, unless otherwise agreed between a manufacturer and a
      business user in relation to a tailor-made product with digital elements, free of charge
    why: The cite rests on the vulnerability-handling requirement of Annex I Part II point (8), quoted,
      which Art 64(2) puts in the top tier, and names Recital 64 (no duty) in prose the reader does
      not read ('and its tailor-made carve-out, with'). Annex I decides it; Recital 64 could only
      lower it.
  - id: non-legislative
    match: ^(?:CNIL\b|EDPB\b|European Data Protection Board\b|Article 29 (?:Data Protection )?Working
      Party\b|CJEU\b|Court of Justice of the European Union\b|Fashion ID, C-40/17\b|Munich Regional
      Court\b|Tribunal judiciaire\b|Commission Guidelines\b|Code of Practice on Transparency of
      AI-generated Content\b|Google\b|IAB Europe\b|Japan, Personal Information Protection
      Commission, Guidelines\b|United States, Federal Trade Commission, )
    tier: no_duty
    why: Guidance, decisions and judgments of authorities and courts, industry frameworks and vendor
      documentation interpret or apply a duty; they lay down none of their own. The duty is the
      statute's, cited beside them.

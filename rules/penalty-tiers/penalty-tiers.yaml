    penalty_quotes:
      - id: jp-appi-178
        cite: APPI Art 178
        quote: 第百四十八条第二項又は第三項の規定による命令に違反した場合には、当該違反行為をした者は、一年以下の拘禁刑又は百万円以下の罰金に処する。
    why: "The Act's penalties differ by route and by named act, not by a fine schedule across the duties
      a rule cites. Art 148(1) lists the duties a Commission recommendation (and so an order) can
      reach, and Art 148(3) those for which it may order at once (Arts 18 to 20 and 23 to 26 among
      them); violating such an order is punished under Art 178 (quoted), with Art 184(1) raising the
      fine for a corporation: the heaviest route the Act sets for an operator's duty. Arts 179, 182
      and 185 set separate penalties for named acts (providing or misappropriating a personal
      information database for illicit gain, a failure to report under Art 146(1), a breach of Art
      30(2) or 56). Every APPI duty the rules cite (Art 23, Art 26) is in both Art 148(1) and
      148(3), so it is on the order route at its heaviest: top. A duty outside Art 148(1) (Art 17 or
      22, say) also resolves top here, which rounds up; it is not a claim that the Act sets no
      tiers."

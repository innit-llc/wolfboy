<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example Book Club - join us</title>
    <link rel="stylesheet" href="/style.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer ?? [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      gtag("js", new Date());
      gtag("config", "G-XXXXXXXXXX");
    </script>

    <script>
      window.fbq = window.fbq ?? function () { (window.fbq.queue ??= []).push(arguments); };
    </script>
    <script async src="https://connect.facebook.net/en_US/fbevents.js"></script>
  </head>
  <body>
    <main>
      <h1>Example Book Club</h1>
      <p>One book a month, read together. Join in a minute.</p>

      <form id="signup">
        <label>Name <input name="name" autocomplete="name" required /></label>
        <label>E-mail <input name="email" type="email" autocomplete="email" required /></label>
        <label>Password <input name="password" type="password" autocomplete="new-password" required /></label>
        <button type="submit">Join the club</button>
      </form>

      <p id="welcome" hidden></p>

      <section id="ask" hidden>
        <h2>Questions about the book?</h2>
        <form id="ask-form">
          <label>Ask the club <textarea name="question" rows="3" required></textarea></label>
          <button type="submit">Ask</button>
        </form>
        <p id="answer" hidden></p>
      </section>
      <p><a href="/privacy">Privacy policy</a></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
